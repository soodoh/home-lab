---
# Copy to an ignored, root-only file. Replace placeholders without committing it.
# Proxmox host apply gates are supplied separately through the fixed Nix controller
# environment and are never Ansible extra-vars.

# Permit removing cloud-image DHCP only while console/LAN rollback remains available.
arch_network_restart_confirmed: false

# Recovery automatically tries the newest decryptable local archive across
# /mnt/games/backups, then /mnt/storage/backups (path order breaks ties).
# Supply the independently reviewed latest weekly S3 object as the final fallback.
recovery_remote_backup_id: ""
recovery_remote_backup_sha256: ""
recovery_backup_url: ""
recovery_backup_version_id: ""
recovery_remote_backup_latest_confirmed: false
# Hash the reviewed exact local selection (or remote fallback) with
# scripts/derive-recovery-backup-identity.py before the apply.
recovery_expected_backup_identity_sha256: ""
recovery_target: ""
recovery_gpg_key_file: ""
recovery_gpg_passphrase_file: ""
recovery_restore_confirmed: false
recovery_target_approved_empty: false
recovery_retain_existing_bind_data: false
recovery_retained_bind_review_confirmed: false

# Enable only after reviewing the first recovered running image set.
maintenance_image_lock_bootstrap_confirmed: false
