# Keep fullscreen frontends visually clean while Sway manages game launchers and dialogs.
# Override GOW's default workspace gaps so the tiled frontend reaches every edge.
workspace main gaps inner 0
workspace main gaps outer 0
for_window [class="steam"] border none
for_window [app_id="steam"] border none
for_window [class="es-de"] border none
for_window [app_id="es-de"] border none
