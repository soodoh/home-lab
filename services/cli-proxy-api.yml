x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:v8.0.53@sha256:19eae277664c18d980701cf1a283b11440f82efbac17e910a9120fdd5ac0e792
    container_name: cli-proxy-api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 127.0.0.1:8317:8317
    volumes:
      - type: bind
        source: /etc/docker-compose/credentials/cli-proxy-api-config.yaml
        target: /CLIProxyAPI/config.yaml
        read_only: true
      - type: bind
        source: /srv/home-lab-state/cli-proxy-api/auths
        target: /root/.cli-proxy-api
    networks:
      - proxy
