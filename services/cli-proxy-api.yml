x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:v8.0.71@sha256:f4bba0d45576c711770bb43a91bc08007200d4a407106016cde8bc0752567946
    container_name: cli-proxy-api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 127.0.0.1:8317:8317
    volumes:
      - type: bind
        source: /etc/docker-compose/credentials/cli-proxy-api-config.yaml
        target: /CLIProxyAPI/config.yaml
        read_only: true
      - type: bind
        source: /srv/home-lab-state/cli-proxy-api/auths
        target: /root/.cli-proxy-api
    networks:
      - proxy
