x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  openfit:
    image: ghcr.io/soodoh/openfit:0.6.7@sha256:b2542c6b27ef0f0c37d7de9c1418d11b1ec4c86103bf9ecbaa43bd41bd41d825
    container_name: openfit
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /srv/home-lab-state/openfit-data:/app/data
    environment:
      TZ: $TZ
      BETTER_AUTH_BASE_URL: $OPENFIT_BASE_URL
      BETTER_AUTH_SECRET: $OPENFIT_SECRET
      ADMIN_USER: $OPENFIT_ADMIN_USER
      ADMIN_PASSWORD: $OPENFIT_ADMIN_PASSWORD
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - proxy
