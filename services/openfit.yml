x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  openfit:
    image: ghcr.io/soodoh/openfit:latest@sha256:14738ad7937761cd447c6d619381aac323f08c5a3de7635160ae6b139cc87694
    container_name: openfit
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /srv/home-lab-state/openfit-data:/app/data
    environment:
      TZ: $TZ
      BETTER_AUTH_BASE_URL: $OPENFIT_BASE_URL
      BETTER_AUTH_SECRET: $OPENFIT_SECRET
      ADMIN_USER: $OPENFIT_ADMIN_USER
      ADMIN_PASSWORD: $OPENFIT_ADMIN_PASSWORD
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - proxy
