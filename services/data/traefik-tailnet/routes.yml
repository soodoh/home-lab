---
# The private instance has only explicit host routes. Never mount this file in
# the public Traefik instance or expose its entry point on a LAN/WAN address.
http:
  routers:
    omada:
      rule: "Host(`omada.ts.diloreto.com`)"
      entryPoints: [tailnet]
      service: omada
      tls:
        certResolver: tailnet
        domains:
          - main: "*.ts.diloreto.com"
    llm:
      rule: "Host(`llm.ts.diloreto.com`)"
      entryPoints: [tailnet]
      service: cli-proxy-api
      tls:
        certResolver: tailnet
        domains:
          - main: "*.ts.diloreto.com"
    proxmox:
      rule: "Host(`proxmox.ts.diloreto.com`)"
      entryPoints: [tailnet]
      service: proxmox
      tls:
        certResolver: tailnet
        domains:
          - main: "*.ts.diloreto.com"
    zwave:
      rule: "Host(`zwave.ts.diloreto.com`)"
      entryPoints: [tailnet]
      service: authentik
      tls:
        certResolver: tailnet
        domains:
          - main: "*.ts.diloreto.com"
    # Provider access is limited to native API paths; UI routes remain public/Authentik-owned.
    sonarr-api:
      rule: "Host(`sonarr.ts.diloreto.com`) && (Path(`/api/v3`) || PathPrefix(`/api/v3/`))"
      entryPoints: [tailnet]
      service: sonarr-api
      tls:
        certResolver: tailnet
        domains:
          - main: "*.ts.diloreto.com"
    radarr-api:
      rule: "Host(`radarr.ts.diloreto.com`) && (Path(`/api/v3`) || PathPrefix(`/api/v3/`))"
      entryPoints: [tailnet]
      service: radarr-api
      tls:
        certResolver: tailnet
        domains:
          - main: "*.ts.diloreto.com"
    radarr-4k-api:
      rule: "Host(`radarr-4k.ts.diloreto.com`) && (Path(`/api/v3`) || PathPrefix(`/api/v3/`))"
      entryPoints: [tailnet]
      service: radarr-4k-api
      tls:
        certResolver: tailnet
        domains:
          - main: "*.ts.diloreto.com"
    prowlarr-api:
      rule: "Host(`prowlarr.ts.diloreto.com`) && (Path(`/api/v1`) || PathPrefix(`/api/v1/`))"
      entryPoints: [tailnet]
      service: prowlarr-api
      tls:
        certResolver: tailnet
        domains:
          - main: "*.ts.diloreto.com"

  serversTransports:
    omada-backend:
      # Trust only the observed Omada certificate on the dedicated bridge.
      # Its DNS SAN is Omada; fail closed on certificate rotation.
      rootCAs: [/etc/traefik/omada.pem]
      serverName: Omada
      disableHTTP2: true
    proxmox-lan:
      # Proxmox serves its own untrusted certificate. Restrict this exception
      # to the fixed LAN backend; the browser-to-Traefik hop remains verified.
      insecureSkipVerify: true

  services:
    omada:
      loadBalancer:
        serversTransport: omada-backend
        servers:
          - url: https://omada:8043
    cli-proxy-api:
      loadBalancer:
        servers:
          - url: http://cli-proxy-api:8317
    proxmox:
      loadBalancer:
        serversTransport: proxmox-lan
        servers:
          - url: https://192.168.0.123:8006
    authentik:
      loadBalancer:
        servers:
          - url: http://authentik-server:9000
    # Gluetun shares the proxy bridge with this private Traefik instance.
    sonarr-api:
      loadBalancer:
        servers:
          - url: http://gluetun:8989
    radarr-api:
      loadBalancer:
        servers:
          - url: http://gluetun:7878
    radarr-4k-api:
      loadBalancer:
        servers:
          - url: http://gluetun:7879
    prowlarr-api:
      loadBalancer:
        servers:
          - url: http://gluetun:9696
