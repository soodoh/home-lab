---
# Private instance: Docker publishes TCP 443 ONLY on the reviewed Tailscale IPv4.
# Production ACME uses a separate protected store; retain the staging store
# untouched for rollback until the strict-TLS cutover is independently verified.
entryPoints:
  tailnet:
    address: ":443/tcp"
    http:
      tls:
        certResolver: tailnet

providers:
  file:
    filename: /etc/traefik/routes.yml

certificatesResolvers:
  tailnet:
    acme:
      storage: /data/acme.json
      dnsChallenge:
        provider: route53
