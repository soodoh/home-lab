---
# Staging-only private instance: bind ONLY the reviewed Docker-host Tailscale
# IPv4. Promote to production ACME with a separate certificate store only
# after DNS-01 succeeds and a distinct deployment is approved.
entryPoints:
  tailnet:
    address: "100.116.163.42:443/tcp"
    http:
      tls:
        certResolver: tailnet

providers:
  file:
    filename: /etc/traefik/routes.yml

certificatesResolvers:
  tailnet:
    acme:
      storage: /data/acme-staging.json
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: route53
