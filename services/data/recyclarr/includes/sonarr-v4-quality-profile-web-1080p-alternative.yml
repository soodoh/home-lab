# Native local include; upstream source (MIT):
# https://github.com/recyclarr/config-templates/blob/4ae377bb704fc7fd69a544ad04e91357e0b09f62/sonarr/includes/quality-profiles/sonarr-v4-quality-profile-web-1080p-alternative.yml
quality_profiles:
  - name: WEB-1080p
    reset_unmatched_scores:
      enabled: true
    upgrade:
      allowed: true
      until_quality: WEB 1080p
      until_score: 10000
    min_format_score: 0
    quality_sort: top
    qualities:
      - name: WEB 1080p
        qualities:
          - WEBDL-1080p
          - WEBRip-1080p
      - name: Bluray-1080p
      - name: HDTV-1080p
      - name: WEB 720p
        qualities:
          - WEBDL-720p
          - WEBRip-720p
      - name: Bluray-720p
      - name: HDTV-720p
