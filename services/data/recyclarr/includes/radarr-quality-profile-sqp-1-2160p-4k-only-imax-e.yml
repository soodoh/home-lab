# Native local include; upstream source (MIT):
# https://github.com/recyclarr/config-templates/blob/4ae377bb704fc7fd69a544ad04e91357e0b09f62/radarr/includes/quality-profiles/sqp/radarr-quality-profile-sqp-1-2160p-4k-only-imax-e.yml
quality_profiles:
  - name: SQP-1 (2160p)
    reset_unmatched_scores:
      enabled: true
    upgrade:
      allowed: true
      until_quality: Bluray|WEB-2160p
      until_score: 10000
    min_format_score: 1000
    score_set: sqp-1-2160p
    quality_sort: top
    qualities:
      - name: Bluray|WEB-2160p
        qualities:
          - Bluray-2160p
          - WEBDL-2160p
          - WEBRip-2160p
