---
# Static ingress configuration; public 80/443 reach these container ports through Omada.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http3: {}
    http:
      middlewares: [hsts@file]
      tls:
        certResolver: letsencrypt

providers:
  file:
    filename: /etc/traefik/routes.yml

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web
