---
# Only listed hosts receive public routes and certificates. No Docker API access.
http:
  routers:
    auth:
      rule: "Host(`auth.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    caromanga:
      rule: "Host(`caromanga.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    comics:
      rule: "Host(`comics.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    ddns:
      rule: "Host(`ddns.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    frigate:
      rule: "Host(`frigate.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    openfit:
      rule: "Host(`openfit.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    prowlarr:
      rule: "Host(`prowlarr.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    qb:
      rule: "Host(`qb.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    radarr-4k:
      rule: "Host(`radarr-4k.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    radarr:
      rule: "Host(`radarr.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    sabnzbd:
      rule: "Host(`sabnzbd.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    seerr:
      rule: "Host(`seerr.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    sonarr:
      rule: "Host(`sonarr.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik
    gost:
      rule: "Host(`gost.diloreto.com`)"
      entryPoints: [websecure]
      service: authentik

    hass:
      rule: "Host(`hass.diloreto.com`)"
      entryPoints: [websecure]
      service: hass
    vaultwarden:
      rule: "Host(`vaultwarden.diloreto.com`)"
      entryPoints: [websecure]
      service: vaultwarden
    watch:
      rule: "Host(`watch.diloreto.com`)"
      entryPoints: [websecure]
      service: jellyfin
    books:
      rule: "Host(`books.diloreto.com`)"
      entryPoints: [websecure]
      service: books
    nextcloud:
      rule: "Host(`nextcloud.diloreto.com`)"
      entryPoints: [websecure]
      service: nextcloud
    todo-auth:
      rule: "Host(`todo.diloreto.com`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: [websecure]
      priority: 100
      service: authentik
    todo-api:
      # Native clients use the Cloud token; calendar subscriptions use their own URL token.
      rule: "Host(`todo.diloreto.com`) && (Path(`/v1`) || PathPrefix(`/v1/`))"
      entryPoints: [websecure]
      priority: 90
      service: mindwtr-cloud
    todo:
      rule: "Host(`todo.diloreto.com`)"
      entryPoints: [websecure]
      service: mindwtr-app
      middlewares: [mindwtr-web-auth]
    karaoke:
      rule: "Host(`karaoke.diloreto.com`)"
      entryPoints: [websecure]
      service: karaoke

  middlewares:
    mindwtr-web-auth:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: false
        # Do not send sync Authorization credentials to the web login gateway.
        authRequestHeaders: [Cookie]
    hsts:
      headers:
        # All application routes terminate TLS on websecure.
        stsSeconds: 15552000

  services:
    authentik:
      loadBalancer:
        servers:
          - url: http://authentik-server:9000
    hass:
      loadBalancer:
        servers:
          - url: http://172.23.0.1:8123
    vaultwarden:
      loadBalancer:
        servers:
          - url: http://vaultwarden:80
    jellyfin:
      loadBalancer:
        servers:
          - url: http://jellyfin:8096
    books:
      loadBalancer:
        servers:
          - url: http://grimmory:6060
    nextcloud:
      loadBalancer:
        servers:
          - url: http://nextcloud:80
    mindwtr-app:
      loadBalancer:
        servers:
          - url: http://mindwtr-app:5173
    mindwtr-cloud:
      loadBalancer:
        servers:
          - url: http://mindwtr-cloud:8787
    karaoke:
      loadBalancer:
        servers:
          - url: http://karaoke-eternal:8080
