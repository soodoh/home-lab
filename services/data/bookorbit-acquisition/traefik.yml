---
# Bind only the BookOrbit-facing address. Neither the Arr interface nor the
# public proxy listens on these ports. No access log: APIs carry keys in URLs.
entryPoints:
  prowlarr:
    address: 172.26.253.2:9696
  qbittorrent:
    address: 172.26.253.2:8081
  sabnzbd:
    address: 172.26.253.2:8080
  health:
    address: 127.0.0.1:9000
ping:
  entryPoint: health
providers:
  file:
    filename: /etc/traefik/routes.yml
    watch: false
log:
  level: ERROR
