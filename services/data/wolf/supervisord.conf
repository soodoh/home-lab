; Based on games-on-whales/wolf facb8e0 docker/supervisord.conf.
; Preserve native PulseAudio ordering and signal handling. The only behavioral
; addition is start-wolf before EVERY Wolf process start, not just container boot.
; Review this file against upstream when changing the Wolf image.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
loglevel=info
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:pulseaudio]
command=pulseaudio -n --daemonize=false --fail=false --exit-idle-time=-1 --load="module-native-protocol-unix auth-anonymous=1 socket=%(ENV_PULSE_SERVER)s" --load=module-always-sink --log-target=stderr
autostart=%(ENV_WOLF_EMBED_PULSE)s
autorestart=true
priority=10
stdout_logfile=NONE
stdout_logfile_maxbytes=0
stderr_logfile=NONE
stderr_logfile_maxbytes=0

[program:wolf]
command=bash -c 'if [ "$WOLF_EMBED_PULSE" = true ]; then echo "[wolf] waiting for PulseAudio socket $PULSE_SERVER"; until [ -S "$PULSE_SERVER" ]; do sleep 0.2; done; fi; exec /bin/sh /etc/wolf-start /wolf/wolf'
autostart=true
autorestart=true
startretries=3
stopsignal=INT
stopwaitsecs=30
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
