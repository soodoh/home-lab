x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.3@sha256:24e541ddae5818bf8eb27898b9ba00d0c344a655aa5097e9e9bd4b19356be847
    container_name: hass
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      zwave:
        condition: service_started
      authentik-server:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      # Preserve the serial path configured in ZHA using the stable host alias.
      - /dev/zigbee:/dev/ttyUSB0
    environment:
      TZ: $TZ
    volumes:
      - /srv/home-lab-state/hass-data:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    # Must use Host network for Homekit bridge, as it uses mDNS
    network_mode: host

  zwave:
    image: ghcr.io/zwave-js/zwave-js-ui:11.27.0@sha256:0f3ad23ccf5ff2256ad8cc060ab0fc987b8f52a8427eac337f93b058fa628f35
    container_name: zwave
    restart: always
    logging: *default-logging
    tty: true
    stop_signal: SIGINT
    devices:
      - /dev/zwave:/dev/zwave
    volumes:
      - /srv/home-lab-state/zwave-data:/usr/src/app/store
    secrets:
      - source: zwave_session_secret
        target: /usr/src/app/store/.session-secret
    environment:
      TZ: $TZ
      ZWAVEJS_EXTERNAL_CONFIG: /usr/src/app/store/.config-db
    ports:
      # HA is on host network and uses the Z-Wave JS websocket on localhost.
      # The UI is reachable only through Authentik on the internal hass-ingress bridge.
      - 127.0.0.1:3000:3000
    networks:
      - hass
      - hass-ingress

  mosquitto:
    image: eclipse-mosquitto:2.0.23-openssl@sha256:6a332cc7a8dbe011cbc076180cbb76b37c6f0f55809682ea08e7980ef0112ad9
    container_name: mosquitto
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
    volumes:
      - type: bind
        source: /srv/home-lab-state/mosquitto-data/config
        target: /mosquitto/config
      - type: bind
        source: /srv/home-lab-state/mosquitto-data/data
        target: /mosquitto/data
      - type: bind
        source: /srv/home-lab-state/mosquitto-data/log
        target: /mosquitto/log
    ports:
      # HA uses localhost; LAN IoT devices use the host's LAN IP.
      - 127.0.0.1:1883:1883
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:1883:1883
    networks:
      - hass

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.3@sha256:d1a3e0008557bb3f3314d442ecd4ba68e9b16ab7872d64612649f7a6e5156635
    container_name: frigate
    restart: unless-stopped
    logging: *default-logging
    shm_size: "100mb"
    mem_limit: 4096m
    devices:
      # Radeon RX 7900 XTX
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      TZ: $TZ
      LIBVA_DRIVER_NAME: "radeonsi"
    secrets:
      - FRIGATE_MQTT_USER
      - FRIGATE_MQTT_PASSWORD
      - FRIGATE_CAM_USER
      - FRIGATE_BACKYARD
      - FRIGATE_BACKYARD_PW
      - FRIGATE_DOORBELL
      - FRIGATE_DOORBELL_PW
      - FRIGATE_DRIVEWAY
      - FRIGATE_DRIVEWAY_PW
      - FRIGATE_BACK_STUDIO
      - FRIGATE_BACK_STUDIO_PW
      - FRIGATE_FRONTYARD
      - FRIGATE_FRONTYARD_PW
      - FRIGATE_STUDIO
      - FRIGATE_STUDIO_PW
      - FRIGATE_BACK_HOUSE
      - FRIGATE_BACK_HOUSE_PW
    volumes:
      - /srv/home-lab-state/frigate-data:/config
      - ${MEDIA_PATH}/frigate:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      # HA uses Frigate's internal unauthenticated API and RTSP restreams on localhost.
      # The authenticated Frigate UI is reachable only through Authentik on hass-ingress.
      - 127.0.0.1:5000:5000
      - 127.0.0.1:8554:8554 # RTSP feeds for HA camera streams
    networks:
      - hass
      - hass-ingress

secrets:
  zwave_session_secret:
    file: /etc/docker-compose/credentials/zwave-session-secret
  FRIGATE_MQTT_USER:
    file: /etc/docker-compose/credentials/FRIGATE_MQTT_USER
  FRIGATE_MQTT_PASSWORD:
    file: /etc/docker-compose/credentials/FRIGATE_MQTT_PASSWORD
  FRIGATE_CAM_USER:
    file: /etc/docker-compose/credentials/FRIGATE_CAM_USER
  FRIGATE_BACKYARD:
    file: /etc/docker-compose/credentials/FRIGATE_BACKYARD
  FRIGATE_BACKYARD_PW:
    file: /etc/docker-compose/credentials/FRIGATE_BACKYARD_PW
  FRIGATE_DOORBELL:
    file: /etc/docker-compose/credentials/FRIGATE_DOORBELL
  FRIGATE_DOORBELL_PW:
    file: /etc/docker-compose/credentials/FRIGATE_DOORBELL_PW
  FRIGATE_DRIVEWAY:
    file: /etc/docker-compose/credentials/FRIGATE_DRIVEWAY
  FRIGATE_DRIVEWAY_PW:
    file: /etc/docker-compose/credentials/FRIGATE_DRIVEWAY_PW
  FRIGATE_BACK_STUDIO:
    file: /etc/docker-compose/credentials/FRIGATE_BACK_STUDIO
  FRIGATE_BACK_STUDIO_PW:
    file: /etc/docker-compose/credentials/FRIGATE_BACK_STUDIO_PW
  FRIGATE_FRONTYARD:
    file: /etc/docker-compose/credentials/FRIGATE_FRONTYARD
  FRIGATE_FRONTYARD_PW:
    file: /etc/docker-compose/credentials/FRIGATE_FRONTYARD_PW
  FRIGATE_STUDIO:
    file: /etc/docker-compose/credentials/FRIGATE_STUDIO
  FRIGATE_STUDIO_PW:
    file: /etc/docker-compose/credentials/FRIGATE_STUDIO_PW
  FRIGATE_BACK_HOUSE:
    file: /etc/docker-compose/credentials/FRIGATE_BACK_HOUSE
  FRIGATE_BACK_HOUSE_PW:
    file: /etc/docker-compose/credentials/FRIGATE_BACK_HOUSE_PW

networks:
  hass:
  hass-ingress:
    internal: true
    ipam:
      config:
        - subnet: "172.26.6.0/28"
