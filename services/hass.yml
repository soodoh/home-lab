x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.7.4@sha256:5a531753cea96444200158fc2b0ac7ccd739291ec50414877b396de6e0bb29b3
    container_name: hass
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      zwave:
        condition: service_started
      authentik-server:
        condition: service_healthy
    privileged: true
    devices:
      - /dev/zigbee:/dev/zigbee
    environment:
      TZ: $TZ
    volumes:
      - /srv/home-lab-state/hass-data:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    # Must use Host network for Homekit bridge, as it uses mDNS
    network_mode: host

  zwave:
    image: ghcr.io/zwave-js/zwave-js-ui:11.22@sha256:f24115c115f98a1cd69fea620bf20180be17889e9ae3c58ceabf5df1bc56c2a8
    container_name: zwave
    restart: always
    logging: *default-logging
    tty: true
    stop_signal: SIGINT
    devices:
      - /dev/zwave:/dev/zwave
    volumes:
      - /srv/home-lab-state/zwave-data:/usr/src/app/store
    environment:
      TZ: $TZ
      ZWAVE_SECRET: $ZWAVE_SECRET
      SESSION_SECRET: $SESSION_SECRET
      ZWAVEJS_EXTERNAL_CONFIG: /usr/src/app/store/.config-db
    ports:
      # HA is on host network and uses the Z-Wave JS websocket on localhost.
      # The Z-Wave UI is reachable through Authentik/Caddy over the proxy network.
      - 127.0.0.1:3000:3000
    networks:
      - hass
      - proxy

  mosquitto:
    image: eclipse-mosquitto:2.0.22-openssl@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
    container_name: mosquitto
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
    volumes:
      - type: bind
        source: /srv/home-lab-state/mosquitto-data/config
        target: /mosquitto/config
      - type: bind
        source: /srv/home-lab-state/mosquitto-data/data
        target: /mosquitto/data
      - type: bind
        source: /srv/home-lab-state/mosquitto-data/log
        target: /mosquitto/log
    ports:
      # HA uses localhost; LAN IoT devices use the host's LAN IP.
      - 127.0.0.1:1883:1883
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:1883:1883
    networks:
      - hass

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2@sha256:d4351369984d4a9e2a49ac59736f6490856a7ea11f7790040746d21496967010
    container_name: frigate
    restart: unless-stopped
    logging: *default-logging
    shm_size: "100mb"
    mem_limit: 4096m
    privileged: true
    devices:
      # Radeon RX 7900 XTX
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      TZ: $TZ
      LIBVA_DRIVER_NAME: "radeonsi"
      FRIGATE_MQTT_USER: $FRIGATE_MQTT_USER
      FRIGATE_MQTT_PASSWORD: $FRIGATE_MQTT_PASSWORD
      FRIGATE_CAM_USER: $FRIGATE_CAM_USER
      FRIGATE_BACKYARD: $FRIGATE_BACKYARD
      FRIGATE_BACKYARD_PW: $FRIGATE_BACKYARD_PW
      FRIGATE_DOORBELL: $FRIGATE_DOORBELL
      FRIGATE_DOORBELL_PW: $FRIGATE_DOORBELL_PW
      FRIGATE_DRIVEWAY: $FRIGATE_DRIVEWAY
      FRIGATE_DRIVEWAY_PW: $FRIGATE_DRIVEWAY_PW
      FRIGATE_BACK_STUDIO: $FRIGATE_BACK_STUDIO
      FRIGATE_BACK_STUDIO_PW: $FRIGATE_BACK_STUDIO_PW
      FRIGATE_FRONTYARD: $FRIGATE_FRONTYARD
      FRIGATE_FRONTYARD_PW: $FRIGATE_FRONTYARD_PW
      FRIGATE_STUDIO: $FRIGATE_STUDIO
      FRIGATE_STUDIO_PW: $FRIGATE_STUDIO_PW
      FRIGATE_BACK_HOUSE: $FRIGATE_BACK_HOUSE
      FRIGATE_BACK_HOUSE_PW: $FRIGATE_BACK_HOUSE_PW
    volumes:
      - /srv/home-lab-state/frigate-data:/config
      - ${MEDIA_PATH}/frigate:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      # HA uses Frigate's internal unauthenticated API and RTSP restreams on localhost.
      # The authenticated Frigate UI is reachable through Authentik/Caddy over the proxy network.
      - 127.0.0.1:5000:5000
      - 127.0.0.1:8554:8554 # RTSP feeds for HA camera streams
    networks:
      - hass
      - proxy

networks:
  hass:
