x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: authentik-postgres
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - type: bind
        source: /srv/home-lab-state/authentik-data/postgresql
        # PostgreSQL 18+ stores versioned clusters below this mount.
        # See docs/authentik-postgres-18-migration.md before changing major versions.
        target: /var/lib/postgresql
    labels:
      docker-volume-backup.stop-during-backup: true
    environment:
      TZ: $TZ
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    networks:
      - authentik

  redis:
    image: redis:8.2-m01-alpine@sha256:73785dd3f61435fbea1a14bafd2c6509f9df112f50953e09eb31c94717c77e76
    container_name: authentik-redis
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    environment:
      TZ: $TZ
    volumes:
      - type: bind
        source: /srv/home-lab-state/authentik-data/redis
        target: /data
    labels:
      docker-volume-backup.stop-during-backup: true
    networks:
      - authentik

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
    container_name: authentik-server
    restart: unless-stopped
    logging: *default-logging
    command: server
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      TZ: $TZ
      AUTHENTIK_POSTGRESQL__USER: $POSTGRES_USER
      AUTHENTIK_POSTGRESQL__NAME: $POSTGRES_DB
      AUTHENTIK_POSTGRESQL__PASSWORD: $POSTGRES_PASSWORD
      AUTHENTIK_REDIS__HOST: $AUTHENTIK_REDIS__HOST
      AUTHENTIK_POSTGRESQL__HOST: $AUTHENTIK_POSTGRESQL__HOST
      AUTHENTIK_SECRET_KEY: $AUTHENTIK_SECRET_KEY
      AUTHENTIK_EMAIL__HOST: $AUTHENTIK_EMAIL__HOST
      AUTHENTIK_EMAIL__PORT: $AUTHENTIK_EMAIL__PORT
      AUTHENTIK_EMAIL__USERNAME: $AUTHENTIK_EMAIL__USERNAME
      AUTHENTIK_EMAIL__PASSWORD: $AUTHENTIK_EMAIL__PASSWORD
      AUTHENTIK_EMAIL__FROM: $AUTHENTIK_EMAIL__FROM
      AUTHENTIK_EMAIL__USE_TLS: $AUTHENTIK_EMAIL__USE_TLS
      AUTHENTIK_EMAIL__USE_SSL: $AUTHENTIK_EMAIL__USE_SSL
      AUTHENTIK_EMAIL__TIMEOUT: $AUTHENTIK_EMAIL__TIMEOUT
    volumes:
      - type: bind
        source: /srv/home-lab-state/authentik-data/media
        target: /media
      - type: bind
        source: /srv/home-lab-state/authentik-data/custom-templates
        target: /templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      docker-volume-backup.stop-during-backup: true
    networks:
      - authentik
      - proxy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
    container_name: authentik-worker
    restart: unless-stopped
    logging: *default-logging
    command: worker
    environment:
      TZ: $TZ
      AUTHENTIK_POSTGRESQL__USER: $POSTGRES_USER
      AUTHENTIK_POSTGRESQL__NAME: $POSTGRES_DB
      AUTHENTIK_POSTGRESQL__PASSWORD: $POSTGRES_PASSWORD
      AUTHENTIK_REDIS__HOST: $AUTHENTIK_REDIS__HOST
      AUTHENTIK_POSTGRESQL__HOST: $AUTHENTIK_POSTGRESQL__HOST
      AUTHENTIK_SECRET_KEY: $AUTHENTIK_SECRET_KEY
      AUTHENTIK_EMAIL__HOST: $AUTHENTIK_EMAIL__HOST
      AUTHENTIK_EMAIL__PORT: $AUTHENTIK_EMAIL__PORT
      AUTHENTIK_EMAIL__USERNAME: $AUTHENTIK_EMAIL__USERNAME
      AUTHENTIK_EMAIL__PASSWORD: $AUTHENTIK_EMAIL__PASSWORD
      AUTHENTIK_EMAIL__FROM: $AUTHENTIK_EMAIL__FROM
      AUTHENTIK_EMAIL__USE_TLS: $AUTHENTIK_EMAIL__USE_TLS
      AUTHENTIK_EMAIL__USE_SSL: $AUTHENTIK_EMAIL__USE_SSL
      AUTHENTIK_EMAIL__TIMEOUT: $AUTHENTIK_EMAIL__TIMEOUT
    labels:
      docker-volume-backup.stop-during-backup: true
    volumes:
      - type: bind
        source: /srv/home-lab-state/authentik-data/media
        target: /media
      - type: bind
        source: /srv/home-lab-state/authentik-data/certs/live
        target: /certs
      - type: bind
        source: /srv/home-lab-state/authentik-data/certs/archive
        target: /archive
      - type: bind
        source: /srv/home-lab-state/authentik-data/custom-templates
        target: /templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - authentik
      - proxy

networks:
  authentik:
    ipam:
      driver: default
      config:
        # Keep authentik network addresses stable for service-to-service integrations.
        - subnet: "172.20.0.0/16"
