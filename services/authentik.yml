x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  postgres:
    image: postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    container_name: authentik-postgres
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - type: bind
        source: /srv/home-lab-state/authentik-data/postgresql
        # PostgreSQL 18+ stores versioned clusters below this mount.
        target: /var/lib/postgresql
    environment:
      TZ: $TZ
      POSTGRES_USER: $AUTHENTIK_DB_USER
      POSTGRES_DB: $AUTHENTIK_DB
      POSTGRES_PASSWORD_FILE: /run/secrets/authentik_db_password
    secrets:
      - authentik_db_password
    networks:
      - authentik-db

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.7@sha256:1675a017c46ba7f4f15333aeafeeb64538c581673bcbcd36af872cdf7de4e7f7
    container_name: authentik-server
    restart: unless-stopped
    logging: *default-logging
    command: server
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      TZ: $TZ
      AUTHENTIK_POSTGRESQL__USER: $AUTHENTIK_DB_USER
      AUTHENTIK_POSTGRESQL__NAME: $AUTHENTIK_DB
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/authentik_db_password
      AUTHENTIK_POSTGRESQL__HOST: $AUTHENTIK_POSTGRESQL__HOST
      AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik_secret_key
      AUTHENTIK_EMAIL__HOST: $AUTHENTIK_EMAIL__HOST
      AUTHENTIK_EMAIL__PORT: $AUTHENTIK_EMAIL__PORT
      AUTHENTIK_EMAIL__USERNAME: $AUTHENTIK_EMAIL__USERNAME
      AUTHENTIK_EMAIL__PASSWORD: file:///run/secrets/authentik_smtp_password
      AUTHENTIK_EMAIL__FROM: $AUTHENTIK_EMAIL__FROM
      AUTHENTIK_EMAIL__USE_TLS: $AUTHENTIK_EMAIL__USE_TLS
      AUTHENTIK_EMAIL__USE_SSL: $AUTHENTIK_EMAIL__USE_SSL
      AUTHENTIK_EMAIL__TIMEOUT: $AUTHENTIK_EMAIL__TIMEOUT
    secrets:
      - authentik_db_password
      - authentik_secret_key
      - authentik_smtp_password
    volumes:
      - type: bind
        source: /srv/home-lab-state/authentik-data/media
        target: /media
      - type: bind
        source: /srv/home-lab-state/authentik-data/custom-templates
        target: /templates
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - authentik-db
      - authentik-outpost
      - auth-ingress
      - gost-ingress
      - hass-ingress
      - admin-apps-ingress
      - arr-ingress
      - shelfmark-ingress
      - authentik-egress

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.7@sha256:1675a017c46ba7f4f15333aeafeeb64538c581673bcbcd36af872cdf7de4e7f7
    container_name: authentik-worker
    restart: unless-stopped
    logging: *default-logging
    command: worker
    environment:
      TZ: $TZ
      AUTHENTIK_POSTGRESQL__USER: $AUTHENTIK_DB_USER
      AUTHENTIK_POSTGRESQL__NAME: $AUTHENTIK_DB
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/authentik_db_password
      AUTHENTIK_POSTGRESQL__HOST: $AUTHENTIK_POSTGRESQL__HOST
      AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik_secret_key
      AUTHENTIK_EMAIL__HOST: $AUTHENTIK_EMAIL__HOST
      AUTHENTIK_EMAIL__PORT: $AUTHENTIK_EMAIL__PORT
      AUTHENTIK_EMAIL__USERNAME: $AUTHENTIK_EMAIL__USERNAME
      AUTHENTIK_EMAIL__PASSWORD: file:///run/secrets/authentik_smtp_password
      AUTHENTIK_EMAIL__FROM: $AUTHENTIK_EMAIL__FROM
      AUTHENTIK_EMAIL__USE_TLS: $AUTHENTIK_EMAIL__USE_TLS
      AUTHENTIK_EMAIL__USE_SSL: $AUTHENTIK_EMAIL__USE_SSL
      AUTHENTIK_EMAIL__TIMEOUT: $AUTHENTIK_EMAIL__TIMEOUT
    secrets:
      - authentik_db_password
      - authentik_secret_key
      - authentik_smtp_password
    volumes:
      - type: bind
        source: /srv/home-lab-state/authentik-data/media
        target: /media
      - type: bind
        source: /srv/home-lab-state/authentik-data/custom-templates
        target: /templates
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - authentik-db
      - authentik-egress

  authentik-ldap:
    image: ghcr.io/goauthentik/ldap:2026.8.7@sha256:b0400c194cd8f4b7b98b2685926cd7c5d79c036d2ca2d6ec61fff3138c90096e
    container_name: authentik-ldap
    restart: unless-stopped
    logging: *default-logging
    environment:
      AUTHENTIK_HOST: http://authentik-server:9000
      AUTHENTIK_INSECURE: "false"
      AUTHENTIK_TOKEN: file:///run/secrets/authentik_ldap_token
    secrets:
      - authentik_ldap_token
    depends_on:
      authentik-server:
        condition: service_healthy
    networks:
      - authentik-outpost
      - jellyfin-auth

secrets:
  authentik_db_password:
    file: /etc/docker-compose/credentials/authentik-db-password
  authentik_secret_key:
    file: /etc/docker-compose/credentials/authentik-secret-key
  authentik_smtp_password:
    file: /etc/docker-compose/credentials/authentik-smtp-password
  authentik_ldap_token:
    file: /etc/docker-compose/credentials/authentik-ldap-token

networks:
  authentik-db:
    internal: true
    ipam:
      config:
        - subnet: "172.26.1.0/28"
  authentik-outpost:
    internal: true
    ipam:
      config:
        - subnet: "172.26.2.0/28"
  authentik-egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: "172.26.24.0/28"
  jellyfin-auth:
    internal: true
