x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

x-backup-env: &backup-env
  TZ: $TZ
  GPG_PUBLIC_KEY_RING_FILE: /etc/docker-volume-backup/gpg-public.asc
  BACKUP_EXCLUDE_REGEXP: '^/backup/(audiobookshelf-data/metadata/|bookshelf-data/(Backups/|MediaCover/|Sentry/|logs/|logs\.db(-.*)?$)|calibre-data/(books/|config/\.cache/)|calibre-web-data/(\.cwa_conversion_tmp/|\.cwa_db_debug/|app\.db\.bak\..*$|calibre-web\.log(\..*)?$|cwa_ingest_retry_queue/|cwa_ingest_status/|epub-fixer\.log$|log_archive/|processed_books/|thumbnails/)|caro-tachidesk-data/(backups/|bin/|cache/|database(\..*)?\.trace\.db$|database\..*\.(backup|sql)$|downloads/|logs/|webUI/)|frigate-data/(\.exports/|\.search_stats\.json$|\.timeline/|\.vacuum/|backup\.db$|model_cache/)|hass-data/(\.cache/|backups?/|core$|home-assistant\.log(\..*)?$|tts/)|jellyfin-data/(cache/|config/(\.cache/|data/(SQLiteBackups/|attachments/|introskipper/|library\.db\.old(-.*)?$|subtitles/)|log/|metadata/))|nextcloud-db-data/(binlog\..*$|system_mysql_backup_.*$)|omada-data/data/(device-firmware/|mongodb-preupgrade\.tar$|mongodb_upgrade\.log(\..*)?$)|pihole-data/(config_backups/|gravity_backups/|gravity_old\.db$|listsCache/|migration_backup/|pihole-FTL\.db(-.*)?$)|((bookshelf|prowlarr|radarr|radarr-4k|sonarr)-data)/(Backups/|MediaCover/|Sentry/|logs/|logs\.db(-.*)?$)|qbittorrent-data/(\.cache/|qBittorrent/(GeoDB/|logs/))|recyclarr-data/(logs/|repositories/|resources/|state/)|sabnzbd-data/logs/|seerr-data/(cache/|logs/)|tachidesk-data/(backups/|bin/|cache/|database(\..*)?\.trace\.db$|database\..*\.(backup|sql)$|downloads/|logs/|webUI/)|vaultwarden-data/(icon_cache/|tmp/)|zwave-data/logs/|wolf/cfg/backtrace\..*\.dump$|wolf/profile-data/paul/WolfES-DE/(\.local/share/Steam/|\.config/retroarch/(assets/|cores/|downloads/|logs/|thumbnails/)|ES-DE/(logs/|scrapers/|screensavers/|themes/))|.*/[Cc]ache/|.*/[Ll]ogs?/|.*\.log(?:\..*)?$)'
x-backup-volumes: &backup-volumes
  - /srv/home-lab-state/audiobookshelf-data/config:/backup/audiobookshelf-data/config:ro
  - /srv/home-lab-state/authentik-data/postgresql:/backup/authentik-data/postgresql:ro
  - /srv/home-lab-state/authentik-data/media:/backup/authentik-data/media:ro
  - /srv/home-lab-state/authentik-data/custom-templates:/backup/authentik-data/custom-templates:ro
  - /srv/home-lab-state/authentik-data/certs/live:/backup/authentik-data/certs/live:ro
  - /srv/home-lab-state/authentik-data/certs/archive:/backup/authentik-data/certs/archive:ro
  - /srv/home-lab-state/bookshelf-data:/backup/bookshelf-data:ro
  - /srv/home-lab-state/calibre-data/config:/backup/calibre-data/config:ro
  - /srv/home-lab-state/calibre-data/plugins:/backup/calibre-data/plugins:ro
  - /srv/home-lab-state/calibre-web-data:/backup/calibre-web-data:ro
  - /srv/home-lab-state/caro-tachidesk-data:/backup/caro-tachidesk-data:ro
  - /srv/home-lab-state/ddns-updater-data:/backup/ddns-updater-data:ro
  - /srv/home-lab-state/frigate-data:/backup/frigate-data:ro
  - /srv/home-lab-state/gluetun-data:/backup/gluetun-data:ro
  - /srv/home-lab-state/jellyfin-data/config:/backup/jellyfin-data/config:ro
  - /srv/home-lab-state/seerr-data:/backup/seerr-data:ro
  - /srv/home-lab-state/karaoke-eternal-data:/backup/karaoke-eternal-data:ro
  - /srv/home-lab-state/litellm-data:/backup/litellm-data:ro
  - /srv/home-lab-state/mosquitto-data/config:/backup/mosquitto-data/config:ro
  - /srv/home-lab-state/mosquitto-data/data:/backup/mosquitto-data/data:ro
  - /srv/home-lab-state/nextcloud-db-data:/backup/nextcloud-db-data:ro
  - /srv/home-lab-state/nextcloud-config:/backup/nextcloud-config:ro
  - /srv/home-lab-state/nextcloud-custom-apps:/backup/nextcloud-custom-apps:ro
  - /srv/home-lab-state/nextcloud-themes:/backup/nextcloud-themes:ro
  - /srv/home-lab-state/omada-data/data:/backup/omada-data/data:ro
  - /srv/home-lab-state/openfit-data:/backup/openfit-data:ro
  - /srv/home-lab-state/pihole-data:/backup/pihole-data:ro
  - /srv/home-lab-state/prowlarr-data:/backup/prowlarr-data:ro
  - /srv/home-lab-state/qbittorrent-data:/backup/qbittorrent-data:ro
  - /srv/home-lab-state/radarr-4k-data:/backup/radarr-4k-data:ro
  - /srv/home-lab-state/radarr-data:/backup/radarr-data:ro
  - /srv/home-lab-state/recyclarr-data/configs:/backup/recyclarr-data/configs:ro
  - /srv/home-lab-state/recyclarr-data/includes:/backup/recyclarr-data/includes:ro
  - /srv/home-lab-state/recyclarr-data/settings.yml:/backup/recyclarr-data/settings.yml:ro
  - /srv/home-lab-state/sabnzbd-data:/backup/sabnzbd-data:ro
  - /srv/home-lab-state/sonarr-data:/backup/sonarr-data:ro
  - /srv/home-lab-state/tachidesk-data:/backup/tachidesk-data:ro
  - /srv/home-lab-state/vaultwarden-data:/backup/vaultwarden-data:ro
  - /srv/home-lab-state/vikunja-data:/backup/vikunja-data:ro
  - /srv/home-lab-state/zwave-data:/backup/zwave-data:ro
  # Non-volumes
  - /srv/home-lab-state/hass-data:/backup/hass-data:ro
  # Wolf identity, pairings, profiles, and non-regenerable configuration
  - ${GAMES_PATH}/wolf/cfg:/backup/wolf/cfg:ro
  - ${GAMES_PATH}/wolf/profile-data/paul/WolfES-DE/.config:/backup/wolf/profile-data/paul/WolfES-DE/.config:ro
  - ${GAMES_PATH}/wolf/profile-data/paul/WolfES-DE/.local/share:/backup/wolf/profile-data/paul/WolfES-DE/.local/share:ro
  - ${GAMES_PATH}/wolf/profile-data/paul/WolfES-DE/ES-DE:/backup/wolf/profile-data/paul/WolfES-DE/ES-DE:ro
  # Sensitive host files remain safe in S3 because backups are GPG-encrypted.
  - /etc/docker-compose/production.env:/backup/.env:ro
  - ${HOME}/.ssh:/backup/.ssh:ro
  # Required for GPG public-key encryption
  - ./data/backup-gpg-public.asc:/etc/docker-volume-backup/gpg-public.asc:ro
  # Required for docker-volume-backup stop/start labels
  - /var/run/docker.sock:/var/run/docker.sock:ro
  # Needed so that the container reflects the $TZ timezone
  - /etc/localtime:/etc/localtime:ro
  - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
  # Write the primary archive to NFS, then synchronously replicate it to the games disk.
  # Recovery independently prefers games, then storage. Weekly S3 backups disable it.
  - ./data/replicate-local-backup:/usr/local/bin/replicate-local-backup:ro
  - /mnt/storage/backups:/archive
  - /mnt/games/backups:/replica-games
  # Keep large plaintext working archives off the capacity-constrained OS disk.
  # The hidden directory is excluded from replica discovery and backup pruning prefixes.
  - type: bind
    source: /mnt/games/backups/.tmp
    target: /tmp
    bind:
      create_host_path: false

services:
  omada:
    image: mbentley/omada-controller:6.2@sha256:d281c115461bd5969e6e1864483e7bf57ca966bddde69d6a3b9a770f3289e273
    container_name: omada
    restart: always
    logging: *default-logging
    # Recommended for easier device discovery
    network_mode: host
    environment:
      TZ: $TZ
    volumes:
      - type: bind
        source: /srv/home-lab-state/omada-data/data
        target: /opt/tplink/EAPController/data
      - type: bind
        source: /srv/home-lab-state/omada-data/logs
        target: /opt/tplink/EAPController/logs
    labels:
      docker-volume-backup.stop-during-backup: true

  ddns-updater:
    image: ghcr.io/qdm12/ddns-updater:v2.10.0@sha256:3e2aa558946b5a293def4d73008fa4651c072b2c12932cecd02126fb23979831
    container_name: ddns-updater
    restart: always
    logging: *default-logging
    volumes:
      - /srv/home-lab-state/ddns-updater-data:/updater/data
    environment:
      TZ: $TZ
      RESOLVER_ADDRESS: $RESOLVER_ADDRESS
      # See: https://pkg.go.dev/time#ParseDuration
      PERIOD: 5m
    networks:
      - proxy

  caddy:
    image: caddy:2.11.4@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    container_name: caddy
    restart: always
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    ports:
      - 80:80
      - 443:443/tcp
      - 443:443/udp
    environment:
      TZ: $TZ
      ROUTE_53_ACCESS_KEY: $ROUTE_53_ACCESS_KEY
      ROUTE_53_SECRET: $ROUTE_53_SECRET
      ROUTE_53_ZONE_ID: $ROUTE_53_ZONE_ID
    volumes:
      - /srv/home-lab-state/caddy-data:/data/caddy
      - ./data/Caddyfile:/etc/caddy/Caddyfile
    networks:
      proxy:
        # Must match Home Assistant's trusted_proxies entry.
        ipv4_address: 172.23.0.250

  pihole:
    image: pihole/pihole:2026.07.2@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    container_name: pihole
    restart: always
    logging: *default-logging
    labels:
      docker-volume-backup.stop-during-backup: true
    ports:
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:53:53/tcp
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:53:53/udp
      # - 81:80
    environment:
      TZ: $TZ
      DNSMASQ_USER: $DNSMASQ_USER
      PIHOLE_PRIMARY_URL: $PIHOLE_PRIMARY_URL
      PIHOLE_PRIMARY_PW: $PIHOLE_PRIMARY_PW
      PIHOLE_SECONDARY_URL: $PIHOLE_SECONDARY_URL
      PIHOLE_SECONDARY_PW: $PIHOLE_SECONDARY_PW
    volumes:
      - /srv/home-lab-state/pihole-data:/etc/pihole
    networks:
      - proxy

  daily-local-backup:
    image: ghcr.io/offen/docker-volume-backup:v2.48.2@sha256:19102d8e59eb1d598cf8c647c2b21100abaadc5a1c808ac643fa612e323c3013
    container_name: daily-local-backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *backup-env
      BACKUP_FILENAME: daily-local-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: daily-local-backup-
      BACKUP_CRON_EXPRESSION: "0 5 * * *"
      BACKUP_RETENTION_DAYS: 7
      LOCAL_BACKUP_NO_PRUNE: "0"
      LOCAL_BACKUP_NO_PRUNE_FILE: /tmp/.local-backup-no-prune
    labels:
      docker-volume-backup.copy-post: /bin/sh -c /usr/local/bin/replicate-local-backup
    volumes: *backup-volumes
    networks:
      - infra

  weekly-remote-backup:
    image: ghcr.io/offen/docker-volume-backup:v2.48.2@sha256:19102d8e59eb1d598cf8c647c2b21100abaadc5a1c808ac643fa612e323c3013
    container_name: weekly-remote-backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *backup-env
      BACKUP_FILENAME: weekly-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: weekly-backup-
      BACKUP_ARCHIVE: /archive-disabled
      AWS_S3_BUCKET_NAME: $AWS_S3_BUCKET_NAME
      AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
      BACKUP_CRON_EXPRESSION: "0 6 * * 0"
      BACKUP_RETENTION_DAYS: 14
    volumes: *backup-volumes
    networks:
      - infra

networks:
  infra:
    ipam:
      driver: default
      config:
        - subnet: "172.22.0.0/16"
  proxy:
    ipam:
      driver: default
      config:
        - subnet: "172.23.0.0/16"
