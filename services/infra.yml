x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  omada:
    image: mbentley/omada-controller:6.3.0.45@sha256:bf81f0456f74c6ceb84d1bf708141f42423a1b1eb74f3b187a12f5965af8a818
    container_name: omada
    restart: always
    logging: *default-logging
    # Recommended for easier device discovery
    network_mode: host
    environment:
      TZ: $TZ
    volumes:
      - type: bind
        source: /srv/home-lab-state/omada-data/data
        target: /opt/tplink/EAPController/data
      - type: bind
        source: /srv/home-lab-state/omada-data/logs
        target: /opt/tplink/EAPController/logs

  ddns-updater:
    image: ghcr.io/qdm12/ddns-updater:v2.10.0@sha256:3e2aa558946b5a293def4d73008fa4651c072b2c12932cecd02126fb23979831
    container_name: ddns-updater
    restart: always
    logging: *default-logging
    volumes:
      - /srv/home-lab-state/ddns-updater-data:/updater/data
    environment:
      TZ: $TZ
      RESOLVER_ADDRESS: $DDNS_RESOLVER_ADDRESS
      # See: https://pkg.go.dev/time#ParseDuration
      PERIOD: 5m
    networks:
      - proxy

  tailscale-control-proxy:
    image: gogost/gost:3.3.0@sha256:f7a958c451928fbe1b99046d25bd0c9bf42019d4c60a82200f50dc8e617b7580
    container_name: tailscale-control-proxy
    restart: always
    logging: *default-logging
    command: ["-C", "/etc/gost/tailscale-control.yml"]
    # Resolve MagicDNS through the host's Tailscale resolver, with the observed
    # host public resolver for controlplane.tailscale.com and other public names.
    # Keep DNS scoped to GOST; Docker's default resolver cannot resolve peers.
    dns:
      - 100.100.100.100
      - 1.1.1.1
    volumes:
      - type: bind
        source: ./data/gost/tailscale-control.yml
        target: /etc/gost/tailscale-control.yml
        read_only: true
    networks:
      - proxy

  caddy:
    image: caddy:2.11.4@sha256:14a9c00d4e833ebc2b65d36515b37bde3b73f0b323a2663aaafc88953d8c4e3f
    container_name: caddy
    restart: always
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    ports:
      - 80:80
      - 443:443/tcp
      - 443:443/udp
    environment:
      TZ: $TZ
      ROUTE_53_ACCESS_KEY: $ROUTE_53_ACCESS_KEY
      ROUTE_53_SECRET: $ROUTE_53_SECRET
      ROUTE_53_ZONE_ID: $ROUTE_53_ZONE_ID
    volumes:
      - /srv/home-lab-state/caddy-data:/data/caddy
      - ./data/Caddyfile:/etc/caddy/Caddyfile
    networks:
      proxy:
        # Must match Home Assistant's trusted_proxies entry.
        ipv4_address: 172.23.0.250

networks:
  infra:
    ipam:
      driver: default
      config:
        - subnet: "172.22.0.0/16"
  proxy:
    ipam:
      driver: default
      config:
        - subnet: "172.23.0.0/16"
