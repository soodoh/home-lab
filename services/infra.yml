---
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  omada:
    image: mbentley/omada-controller:6.3.0.45@sha256:bf81f0456f74c6ceb84d1bf708141f42423a1b1eb74f3b187a12f5965af8a818
    container_name: omada
    restart: always
    logging: *default-logging
    # Bridge mode requires DHCP option 138 to advertise the host LAN address to
    # devices. Keep device-management ports on the LAN, never the public WAN.
    networks:
      - omada-backend
    ports:
      # Retain host loopback until independent consumers are checked live.
      - 127.0.0.1:8043:8043
      # Device firmware upgrades may use this HTTPS listener.
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:8043:8043
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:8044:8044
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:8088:8088
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:8843:8843
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:19810:19810/udp
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:27001:27001/udp
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:29810:29810/udp
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:29811-29817:29811-29817
    environment:
      TZ: $TZ
    volumes:
      - type: bind
        source: /srv/home-lab-state/omada-data/data
        target: /opt/tplink/EAPController/data
      - type: bind
        source: /srv/home-lab-state/omada-data/logs
        target: /opt/tplink/EAPController/logs

  ddns-updater:
    image: ghcr.io/qdm12/ddns-updater:v2.10.0@sha256:3e2aa558946b5a293def4d73008fa4651c072b2c12932cecd02126fb23979831
    container_name: ddns-updater
    restart: always
    logging: *default-logging
    volumes:
      - /srv/home-lab-state/ddns-updater-data:/updater/data
    environment:
      TZ: $TZ
      RESOLVER_ADDRESS: $DDNS_RESOLVER_ADDRESS
      # See: https://pkg.go.dev/time#ParseDuration
      PERIOD: 5m
    networks:
      - proxy

  tailscale-control-proxy:
    image: gogost/gost:3.3.0@sha256:f7a958c451928fbe1b99046d25bd0c9bf42019d4c60a82200f50dc8e617b7580
    container_name: tailscale-control-proxy
    restart: always
    logging: *default-logging
    command: ["-C", "/etc/gost/tailscale-control.yml"]
    # Resolve MagicDNS through the host's Tailscale resolver, with the observed
    # host public resolver for controlplane.tailscale.com and other public names.
    # Keep DNS scoped to GOST; Docker's default resolver cannot resolve peers.
    dns:
      - 100.100.100.100
      - 1.1.1.1
    volumes:
      - type: bind
        source: ./data/gost/tailscale-control.yml
        target: /etc/gost/tailscale-control.yml
        read_only: true
    networks:
      - proxy

  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    container_name: traefik
    restart: always
    logging: *default-logging
    ports:
      # Omada forwards public 80/443 to these host ports, including UDP for HTTP/3.
      - 18080:80/tcp
      - 18443:443/tcp
      - 18443:443/udp
    volumes:
      - /srv/home-lab-state/traefik-data:/data
      - ./data/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./data/traefik/routes.yml:/etc/traefik/routes.yml:ro
    networks:
      proxy:
        # Must match Home Assistant's trusted_proxies entry.
        ipv4_address: 172.23.0.250

  traefik-tailnet:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    container_name: traefik-tailnet
    restart: always
    logging: *default-logging
    # Publish only on the reviewed Tailscale IP; Docker DNS reaches the
    # Authentik/CLI backends and a separate bridge reaches Omada.
    ports:
      - 100.116.163.42:443:443/tcp
    networks:
      - proxy
      - omada-backend
    environment:
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/traefik_tailnet_aws_credentials
      AWS_REGION: us-east-1
      AWS_HOSTED_ZONE_ID: Z07741203I5VR48TBSMSA
    secrets:
      - traefik_tailnet_aws_credentials
    volumes:
      - /srv/home-lab-state/traefik-tailnet-data:/data
      - ./data/traefik-tailnet/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./data/traefik-tailnet/routes.yml:/etc/traefik/routes.yml:ro
      - ./data/traefik-tailnet/omada.pem:/etc/traefik/omada.pem:ro

secrets:
  traefik_tailnet_aws_credentials:
    file: /etc/docker-compose/credentials/traefik-tailnet-aws-credentials

networks:
  infra:
    ipam:
      driver: default
      config:
        - subnet: "172.22.0.0/16"
  proxy:
    ipam:
      driver: default
      config:
        - subnet: "172.23.0.0/16"
  omada-backend: {}
