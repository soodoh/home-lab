x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:v1.7.2@sha256:85784338c06994740d66ff377bfa4e350baf0b8e826ef9a58ddf2d1069cbb01c
    container_name: shelfmark
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun-shelfmark
    depends_on:
      gluetun-shelfmark:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      AUTH_METHOD: proxy
      PROXY_AUTH_USER_HEADER: X-authentik-username
      PROXY_AUTH_ADMIN_GROUP_HEADER: X-authentik-groups
      PROXY_AUTH_ADMIN_GROUP_NAME: App Operators
      PROXY_AUTH_LOGOUT_URL: https://shelfmark.diloreto.com/outpost.goauthentik.io/sign_out
      # Download destinations, naming and seeding policy are native Ansible-owned settings.
      PROWLARR_URL: http://gluetun:9696
      QBITTORRENT_URL: http://gluetun:8081
    volumes:
      - type: bind
        source: /srv/home-lab-state/shelfmark-data
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /srv/home-lab-state/bookorbit-data/book-dock
        target: /book-dock
        bind:
          create_host_path: false
      # Match qBittorrent exactly; Shelfmark cannot mutate seeded files.
      - type: bind
        source: ${MEDIA_PATH}/downloads
        target: /data/downloads
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8084/api/health]
      start_period: 90s
      timeout: 10s
      interval: 30s
      retries: 3

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    init: true
    container_name: seerr
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
      LOG_LEVEL: debug
      PORT: 5055 # Optional
    volumes:
      - /srv/home-lab-state/seerr-data:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - egress
      - admin-apps-ingress
      - seerr-arr

  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    hostname: gluetun
    restart: always
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /srv/home-lab-state/gluetun-data:/gluetun
      - ./data/gluetun:/scripts:ro
    environment:
      TZ: $TZ
      VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh /scripts/gluetun_up.sh
      MAM_ID_FILE: /run/secrets/mam_initial_id
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/wireguard_private_key
      WIREGUARD_ADDRESSES_SECRETFILE: /run/secrets/wireguard_addresses
      PORT_FORWARD_ONLY: "on"
      VPN_SERVICE_PROVIDER: $VPN_PROVIDER
      VPN_PORT_FORWARDING_PROVIDER: $VPN_PROVIDER
      VPN_PORT_FORWARDING: on
      # Use DoH instead of DoT — port 853 gets reset by ProtonVPN (gluetun#3121)
      DNS_UPSTREAM_RESOLVER_TYPE: doh
      # Keep the region stable; a country filter alone does not guarantee MAM's ASN.
      SERVER_COUNTRIES: $SERVER_COUNTRIES
    secrets:
      - wireguard_private_key
      - wireguard_addresses
      - mam_initial_id
    networks:
      - arr_network
      - arr-ingress
      - arr-internal
      - bookorbit-arr
      - shelfmark-arr
      - seerr-arr

  gluetun-comics:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun-comics
    hostname: gluetun-comics
    restart: always
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - gluetun_comics_data:/gluetun
    environment:
      TZ: $TZ
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/wireguard_comics_private_key
      WIREGUARD_ADDRESSES_SECRETFILE: /run/secrets/wireguard_comics_addresses
      VPN_SERVICE_PROVIDER: $VPN_PROVIDER
      # Use DoH instead of DoT — port 853 gets reset by ProtonVPN (gluetun#3121)
      DNS_UPSTREAM_RESOLVER_TYPE: doh
      SERVER_COUNTRIES: $SERVER_COUNTRIES
    secrets:
      - wireguard_comics_private_key
      - wireguard_comics_addresses
    networks:
      - egress
      - comics-ingress

  gluetun-shelfmark:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun-shelfmark
    hostname: gluetun-shelfmark
    restart: always
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - gluetun_shelfmark_data:/gluetun
    environment:
      TZ: $TZ
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/wireguard_shelfmark_private_key
      WIREGUARD_ADDRESSES_SECRETFILE: /run/secrets/wireguard_shelfmark_addresses
      VPN_SERVICE_PROVIDER: $VPN_PROVIDER
      # Use DoH instead of DoT — port 853 gets reset by ProtonVPN (gluetun#3121)
      DNS_UPSTREAM_RESOLVER_TYPE: doh
      SERVER_COUNTRIES: $SERVER_COUNTRIES
    secrets:
      - wireguard_shelfmark_private_key
      - wireguard_shelfmark_addresses
    networks:
      - egress
      - shelfmark-ingress
      - shelfmark-arr

  uchiyomi:
    image: ghcr.io/angelosha/uchiyomi:v0.109.0@sha256:06ae606993cec99664d8ea86fe0be9b18fb3b65c88c8090018f533aff54550a6
    container_name: uchiyomi
    restart: unless-stopped
    stop_grace_period: 40s
    logging: *default-logging
    network_mode: service:gluetun-comics
    depends_on:
      gluetun-comics:
        condition: service_healthy
        restart: true
      uchiyomi-engine:
        condition: service_healthy
    command: [node, --env-file=/run/secrets/uchiyomi_oidc, dist/server.js]
    environment:
      TZ: $TZ
      PUID: "1000"
      PGID: "1000"
      PUBLIC_ORIGIN: https://comics.diloreto.com
      LIBRARY_BACKEND: owned
      SUWAYOMI_URL: http://127.0.0.1:4569
      FLARESOLVERR_URL: http://127.0.0.1:8191
      AUTH_MODE: oidc-only
      OIDC_ISSUER: https://auth.diloreto.com/application/o/uchiyomi/
      OIDC_NAME: Authentik
      OIDC_ALLOW_SIGNUP: "true"
      OIDC_ADMIN_GROUP: App Operators
    secrets:
      - uchiyomi_oidc
    volumes:
      - type: bind
        source: /srv/home-lab-state/uchiyomi/data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: /srv/home-lab-state/uchiyomi/config
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: /srv/home-lab-state/uchiyomi/library
        target: /library
        bind: {create_host_path: false}
      - type: bind
        source: /mnt/storage/media/uchiyomi/downloads
        target: /library-dl
        bind: {create_host_path: false}
      - type: bind
        source: /srv/home-lab-state/uchiyomi/backups
        target: /backups
        bind: {create_host_path: false}
      - uchiyomi_cache:/cache
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/healthz]
      start_period: 90s
      interval: 30s
      timeout: 5s
      retries: 3

  uchiyomi-engine:
    # Use Uchiyomi's qualified engine version and independent app state.
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2512@sha256:27dd1b51c0497b8ed4ed7c22f8564483990ce04b376cacb73eab419e80022b75
    container_name: uchiyomi-engine
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun-comics
    depends_on:
      gluetun-comics:
        condition: service_healthy
        restart: true
      uchiyomi-solver:
        condition: service_healthy
    mem_limit: 2g
    environment:
      TZ: $TZ
      BIND_IP: 127.0.0.1
      BIND_PORT: "4569"
      JAVA_TOOL_OPTIONS: -Xmx768m -XX:+UseSerialGC
      MALLOC_ARENA_MAX: "2"
      WEB_UI_ENABLED: "false"
      AUTO_DOWNLOAD_CHAPTERS: "false"
      FLARESOLVERR_ENABLED: "true"
      FLARESOLVERR_URL: http://127.0.0.1:8191
    volumes:
      - type: bind
        source: /srv/home-lab-state/uchiyomi-engine
        target: /home/suwayomi/.local/share/Tachidesk
        bind: {create_host_path: false}
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4569;
          printf 'GET /api/v1/settings/about HTTP/1.0\r\n\r\n' >&3;
          head -1 <&3 | grep -q ' 200 '
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 3

  uchiyomi-solver:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: uchiyomi-solver
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun-comics
    depends_on:
      gluetun-comics:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: $TZ
      HOST: 127.0.0.1
      PORT: "8191"
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=5).close()"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    restart: always
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: $TZ
    volumes:
      - /srv/home-lab-state/flaresolverr-data:/config

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:3.1.0@sha256:2806c9b763810589c42157730d547c293639e55c7610e9f5069314854639ec48
    container_name: prowlarr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    logging: *default-logging
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      FILE__PROWLARR__AUTH__APIKEY: /run/secrets/prowlarr_api_key
      PROWLARR__SERVER__PORT: 9696
    secrets:
      - prowlarr_api_key
    volumes:
      - /srv/home-lab-state/prowlarr-data:/config

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
    container_name: recyclarr
    restart: unless-stopped
    user: 1000:1000
    networks:
      - arr_network
    volumes:
      - /srv/home-lab-state/recyclarr-data:/config
      - ./data/recyclarr/configs:/config/configs:ro
      - ./data/recyclarr/includes:/config/includes:ro
    secrets:
      - source: recyclarr_credentials
        target: /config/secrets.yml
    environment:
      TZ: $TZ
      SONARR_URL: $SONARR_URL
      RADARR_URL: $RADARR_URL

  sonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.20@sha256:339814bbf50599ac3b59077c252f29833d0138b59a062d0e82ce37bdc7f04f86
    container_name: sonarr
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      FILE__SONARR__AUTH__APIKEY: /run/secrets/sonarr_api_key
      SONARR__SERVER__PORT: 8989
    secrets:
      - sonarr_api_key
    volumes:
      - /srv/home-lab-state/sonarr-data:/config
      - ${MEDIA_PATH}:/data

  radarr:
    image: ghcr.io/linuxserver/radarr:7.0.3@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
    container_name: radarr
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      FILE__RADARR__AUTH__APIKEY: /run/secrets/radarr_api_key
      RADARR__SERVER__PORT: 7878
    secrets:
      - radarr_api_key
    volumes:
      - /srv/home-lab-state/radarr-data:/config
      - ${MEDIA_PATH}:/data

  unpackerr:
    image: golift/unpackerr:v1.0.1@sha256:fc8b69571033f197d4db5cf22a573acb3bb891c9f8033431b9a1fcf679ca3e9c
    container_name: unpackerr
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
      UN_SONARR_0_URL: $SONARR_URL
      UN_SONARR_0_API_KEY: filepath:/run/secrets/sonarr_api_key
      UN_SONARR_0_PATHS_0: /data/downloads/complete
      UN_RADARR_0_URL: $RADARR_URL
      UN_RADARR_0_API_KEY: filepath:/run/secrets/radarr_api_key
      UN_RADARR_0_PATHS_0: /data/downloads/complete
    secrets:
      - sonarr_api_key
      - radarr_api_key
    volumes:
      - ${MEDIA_PATH}/downloads:/data/downloads
    networks:
      - arr-internal

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:5.2.4@sha256:1ea873647c43d566f251a7122aee330b184509c57ee3257ed19f62dac0f8f24b
    container_name: qbittorrent
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      WEBUI_PORT: 8081
    volumes:
      - /srv/home-lab-state/qbittorrent-data:/config
      - ${VUETORRENT_PATH}:/vuetorrent
      - ${MEDIA_PATH}/downloads:/data/downloads

  sabnzbd:
    image: ghcr.io/linuxserver/sabnzbd:5.1.3@sha256:cc7abeeafa20dfba0637d30c60bc70b79656e427c60681cb411fd7b211a39435
    container_name: sabnzbd
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
    volumes:
      - /srv/home-lab-state/sabnzbd-data:/config
      - ${MEDIA_PATH}:/data

secrets:
  wireguard_private_key:
    file: /etc/docker-compose/credentials/wireguard-private-key
  wireguard_addresses:
    file: /etc/docker-compose/credentials/wireguard-addresses
  wireguard_comics_private_key:
    file: /etc/docker-compose/credentials/wireguard-comics-private-key
  wireguard_comics_addresses:
    file: /etc/docker-compose/credentials/wireguard-comics-addresses
  wireguard_shelfmark_private_key:
    file: /etc/docker-compose/credentials/wireguard-shelfmark-private-key
  wireguard_shelfmark_addresses:
    file: /etc/docker-compose/credentials/wireguard-shelfmark-addresses
  mam_initial_id:
    file: /etc/docker-compose/credentials/mam-initial-id
  sonarr_api_key:
    file: /etc/docker-compose/credentials/sonarr-api-key
  radarr_api_key:
    file: /etc/docker-compose/credentials/radarr-api-key
  prowlarr_api_key:
    file: /etc/docker-compose/credentials/prowlarr-api-key
  recyclarr_credentials:
    file: /etc/docker-compose/credentials/recyclarr-secrets.yml
  uchiyomi_oidc:
    file: /etc/docker-compose/credentials/uchiyomi-oidc.env

volumes:
  uchiyomi_cache:
  gluetun_comics_data:
  gluetun_shelfmark_data:

networks:
  arr_network:
    ipam:
      driver: default
      config:
        - subnet: "172.21.0.0/16"
  arr-ingress:
    internal: true
    ipam:
      config:
        - subnet: "172.26.15.0/28"
  arr-internal:
    internal: true
    ipam:
      config:
        - subnet: "172.26.16.0/28"
  comics-ingress:
    internal: true
    ipam:
      config:
        - subnet: "172.26.17.0/28"
  shelfmark-ingress:
    internal: true
    ipam:
      config:
        - subnet: "172.26.18.0/29"
  shelfmark-arr:
    internal: true
    ipam:
      config:
        - subnet: "172.26.19.0/29"
  seerr-arr:
    internal: true
    ipam:
      config:
        - subnet: "172.26.21.0/29"
