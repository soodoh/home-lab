x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
    init: true
    container_name: seerr
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      LOG_LEVEL: debug
      PORT: 5055 # Optional
    volumes:
      - /srv/home-lab-state/seerr-data:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    hostname: gluetun
    restart: always
    logging: *default-logging
    ports:
      # Suwayomi for local OPDS. qBittorrent WebUI is reachable through Authentik/Caddy over the proxy network.
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:4567:4567
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /srv/home-lab-state/gluetun-data:/gluetun
      - ./data/gluetun:/scripts:ro
    environment:
      TZ: $TZ
      VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh /scripts/gluetun_up.sh
      VPN_TYPE: openvpn
      OPENVPN_USER: $OPENVPN_USER
      OPENVPN_PASSWORD: $OPENVPN_PASSWORD
      VPN_SERVICE_PROVIDER: $VPN_PROVIDER
      VPN_PORT_FORWARDING_PROVIDER: $VPN_PROVIDER
      VPN_PORT_FORWARDING: on
      # Use DoH instead of DoT — port 853 gets reset by ProtonVPN (gluetun#3121)
      DNS_UPSTREAM_RESOLVER_TYPE: doh
      # Needed to maintain consistent ASN for MAM session
      SERVER_COUNTRIES: $SERVER_COUNTRIES
    networks:
      - proxy
      - arr_network

  tachidesk:
    # Same image on Dockerhub is outdated
    image: ghcr.io/suwayomi/tachidesk:v2.3.2361@sha256:c1888d3c331cdc139a49a5ec62260f02ca003739bc7f754114b8293a305bffd3
    container_name: tachidesk
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      DOWNLOAD_AS_CBZ: true
      WEB_UI_ENABLED: true
      WEB_UI_FLAVOR: WebUI
      WEB_UI_CHANNEL: preview
      WEB_UI_UPDATE_INTERVAL: 12
      AUTO_DOWNLOAD_CHAPTERS: true
      AUTO_DOWNLOAD_EXCLUDE_UNREAD: false
      AUTO_DOWNLOAD_AHEAD_LIMIT: 20
      UPDATE_EXCLUDE_UNREAD: false
      UPDATE_EXCLUDE_STARTED: false
      UPDATE_EXCLUDE_COMPLETED: true
      UPDATE_INTERVAL: 12
      UPDATE_MANGA_INFO: true
      FLARESOLVERR_ENABLED: true
      FLARESOLVERR_URL: http://gluetun:8191
      BIND_PORT: 4567
    volumes:
      - /srv/home-lab-state/tachidesk-data:/home/suwayomi/.local/share/Tachidesk
      - ${MEDIA_PATH}/tachidesk:/home/suwayomi/.local/share/Tachidesk/downloads

  caro-tachidesk:
    # Same image on Dockerhub is outdated
    image: ghcr.io/suwayomi/tachidesk:v2.3.2361@sha256:c1888d3c331cdc139a49a5ec62260f02ca003739bc7f754114b8293a305bffd3
    container_name: caro-tachidesk
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      DOWNLOAD_AS_CBZ: true
      WEB_UI_ENABLED: true
      WEB_UI_FLAVOR: WebUI
      WEB_UI_CHANNEL: preview
      WEB_UI_UPDATE_INTERVAL: 12
      AUTO_DOWNLOAD_CHAPTERS: true
      AUTO_DOWNLOAD_EXCLUDE_UNREAD: false
      AUTO_DOWNLOAD_AHEAD_LIMIT: 20
      UPDATE_EXCLUDE_UNREAD: false
      UPDATE_EXCLUDE_STARTED: false
      UPDATE_EXCLUDE_COMPLETED: true
      UPDATE_INTERVAL: 12
      UPDATE_MANGA_INFO: true
      FLARESOLVERR_ENABLED: true
      FLARESOLVERR_URL: http://gluetun:8191
      BIND_PORT: 4568
    volumes:
      - /srv/home-lab-state/caro-tachidesk-data:/home/suwayomi/.local/share/Tachidesk
      - type: bind
        source: ${MEDIA_PATH}/caro-tachidesk
        target: /home/suwayomi/.local/share/Tachidesk/downloads
        bind:
          create_host_path: false

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    restart: always
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: $TZ
    volumes:
      - /srv/home-lab-state/flaresolverr-data:/config

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:2.6.5-develop@sha256:85248c75ebf12f985bdd1d3b8f17deda23b7a5902aaa0888b9f13e57410580e9
    container_name: prowlarr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    logging: *default-logging
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      PROWLARR__AUTH__APIKEY: $PROWLARR_API_KEY
      PROWLARR__SERVER__PORT: 9696
    volumes:
      - /srv/home-lab-state/prowlarr-data:/config

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7.2@sha256:6e69e009e1cd7493ff6093e8e187b5d3788c75b4a2c0c5127b6a1beda1c19728
    container_name: recyclarr
    restart: unless-stopped
    user: 1000:1000
    networks:
      - arr_network
    volumes:
      - /srv/home-lab-state/recyclarr-data:/config
    environment:
      TZ: $TZ
      SONARR_URL: $SONARR_URL
      SONARR_API_KEY: $SONARR_API_KEY
      RADARR_URL: $RADARR_URL
      RADARR_API_KEY: $RADARR_API_KEY
      RADARR_4K_URL: $RADARR_4K_URL
      RADARR_4K_API_KEY: $RADARR_4K_API_KEY

  sonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.20@sha256:a5c1a5fecbef946927ab90ad68df319ac5fe644057e5fc18cd993f01ac07b2b2
    container_name: sonarr
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      SONARR__AUTH__APIKEY: $SONARR_API_KEY
      SONARR__SERVER__PORT: 8989
    volumes:
      - /srv/home-lab-state/sonarr-data:/config
      - ${MEDIA_PATH}:/data

  radarr:
    image: ghcr.io/linuxserver/radarr:6.4.4@sha256:c960f2b52ec6542dbe6707c5a21e696a7c74fd8b17997454f4d10a55dacee133
    container_name: radarr
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      RADARR__AUTH__APIKEY: $RADARR_API_KEY
      RADARR__SERVER__PORT: 7878
    volumes:
      - /srv/home-lab-state/radarr-data:/config
      - ${MEDIA_PATH}:/data

  radarr-4k:
    image: ghcr.io/linuxserver/radarr:6.4.4@sha256:c960f2b52ec6542dbe6707c5a21e696a7c74fd8b17997454f4d10a55dacee133
    container_name: radarr-4k
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      RADARR__AUTH__APIKEY: $RADARR_4K_API_KEY
      RADARR__SERVER__PORT: 7879
    volumes:
      - /srv/home-lab-state/radarr-4k-data:/config
      - ${MEDIA_PATH}:/data

  # Readarr replacement
  bookshelf:
    image: ghcr.io/pennydreadful/bookshelf:hardcover-v0.4.21.182@sha256:67498dd5ece516867d72ee642abd6c1a66b36a135c8f7da0127109564372beb1
    container_name: bookshelf
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      READARR__AUTH__APIKEY: $READARR_API_KEY
      READARR__SERVER__PORT: 8787
    volumes:
      - /srv/home-lab-state/bookshelf-data:/config
      - ${MEDIA_PATH}:/data
      - type: bind
        source: /srv/home-lab-state/calibre-data/books
        target: /books
        bind:
          create_host_path: false

  unpackerr:
    image: golift/unpackerr:0.15.2@sha256:057e34740d26c34d81ec8e2faf8ec11f8dbfc77489b7a42826f52b37e5ee1b6c
    container_name: unpackerr
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
      UN_SONARR_0_URL: $SONARR_URL
      UN_SONARR_0_API_KEY: $SONARR_API_KEY
      UN_SONARR_0_PATHS_0: /data/downloads/complete
      UN_RADARR_0_URL: $RADARR_URL
      UN_RADARR_0_API_KEY: $RADARR_API_KEY
      UN_RADARR_0_PATHS_0: /data/downloads/complete
      UN_RADARR_1_URL: $RADARR_4K_URL
      UN_RADARR_1_API_KEY: $RADARR_4K_API_KEY
      UN_RADARR_1_PATHS_0: /data/downloads/complete
      UN_READARR_0_URL: $READARR_URL
      UN_READARR_0_API_KEY: $READARR_API_KEY
      UN_READARR_0_PATHS_0: /data/downloads/complete
    volumes:
      - ${MEDIA_PATH}/downloads:/data/downloads
    networks:
      - arr_network

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:5.2.3@sha256:2be038f3421f60f62e8e4bf201f66f385b68e4fbc9ed3ab79051069ea22e2650
    container_name: qbittorrent
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      WEBUI_PORT: 8081
    volumes:
      - /srv/home-lab-state/qbittorrent-data:/config
      - ${VUETORRENT_PATH}:/vuetorrent
      - ${MEDIA_PATH}/downloads:/data/downloads

  sabnzbd:
    image: ghcr.io/linuxserver/sabnzbd:5.1.3@sha256:948ea3dc45d68943ec14b33ba37ffa1488da3e9837bf3ca0f75621e971614d85
    container_name: sabnzbd
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
    volumes:
      - /srv/home-lab-state/sabnzbd-data:/config
      - ${MEDIA_PATH}:/data

networks:
  arr_network:
    ipam:
      driver: default
      config:
        - subnet: "172.21.0.0/16"
