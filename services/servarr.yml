x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:v1.5.1@sha256:2d80ae3bcd631b8b64ca2a0a06735ed8218bc5c96bea502e62c65468aba82654
    container_name: shelfmark
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      AUTH_METHOD: proxy
      PROXY_AUTH_USER_HEADER: X-authentik-username
      PROXY_AUTH_ADMIN_GROUP_HEADER: X-authentik-groups
      PROXY_AUTH_ADMIN_GROUP_NAME: App Operators
      PROXY_AUTH_LOGOUT_URL: https://shelfmark.diloreto.com/outpost.goauthentik.io/sign_out
      # Download destinations, naming and seeding policy are native Ansible-owned settings.
      PROWLARR_URL: http://localhost:9696
      QBITTORRENT_URL: http://localhost:8081
    volumes:
      - type: bind
        source: /srv/home-lab-state/shelfmark-data
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /srv/home-lab-state/grimmory-bookdrop
        target: /grimmory-bookdrop
        bind:
          create_host_path: false
      # Match qBittorrent exactly; Shelfmark cannot mutate seeded files.
      - type: bind
        source: ${MEDIA_PATH}/downloads
        target: /data/downloads
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8084/api/health]
      start_period: 90s
      timeout: 10s
      interval: 30s
      retries: 3

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
    init: true
    container_name: seerr
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      LOG_LEVEL: debug
      PORT: 5055 # Optional
    volumes:
      - /srv/home-lab-state/seerr-data:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    hostname: gluetun
    restart: always
    logging: *default-logging
    ports:
      # Suwayomi for local OPDS. qBittorrent WebUI is reachable through Authentik/Traefik over the proxy network.
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:4567:4567
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /srv/home-lab-state/gluetun-data:/gluetun
      - ./data/gluetun:/scripts:ro
    environment:
      TZ: $TZ
      VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh /scripts/gluetun_up.sh
      MAM_ID_FILE: /run/secrets/mam_initial_id
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/wireguard_private_key
      WIREGUARD_ADDRESSES_SECRETFILE: /run/secrets/wireguard_addresses
      PORT_FORWARD_ONLY: "on"
      VPN_SERVICE_PROVIDER: $VPN_PROVIDER
      VPN_PORT_FORWARDING_PROVIDER: $VPN_PROVIDER
      VPN_PORT_FORWARDING: on
      # Use DoH instead of DoT — port 853 gets reset by ProtonVPN (gluetun#3121)
      DNS_UPSTREAM_RESOLVER_TYPE: doh
      # Keep the region stable; a country filter alone does not guarantee MAM's ASN.
      SERVER_COUNTRIES: $SERVER_COUNTRIES
    secrets:
      - wireguard_private_key
      - wireguard_addresses
      - mam_initial_id
    networks:
      - proxy
      - arr_network

  tachidesk:
    # Same image on Dockerhub is outdated
    image: ghcr.io/suwayomi/tachidesk:v2.4.2435@sha256:ca891c0a6915666d6a79f16b0119c52a63507d840e14dca0e8dbcc163f60d8b3
    container_name: tachidesk
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      DOWNLOAD_AS_CBZ: true
      WEB_UI_ENABLED: true
      WEB_UI_FLAVOR: WebUI
      WEB_UI_CHANNEL: preview
      WEB_UI_UPDATE_INTERVAL: 12
      AUTO_DOWNLOAD_CHAPTERS: true
      AUTO_DOWNLOAD_EXCLUDE_UNREAD: false
      AUTO_DOWNLOAD_AHEAD_LIMIT: 20
      UPDATE_EXCLUDE_UNREAD: false
      UPDATE_EXCLUDE_STARTED: false
      UPDATE_EXCLUDE_COMPLETED: true
      UPDATE_INTERVAL: 12
      UPDATE_MANGA_INFO: true
      FLARESOLVERR_ENABLED: true
      FLARESOLVERR_URL: http://gluetun:8191
      BIND_PORT: 4567
    volumes:
      - /srv/home-lab-state/tachidesk-data:/home/suwayomi/.local/share/Tachidesk
      - ${MEDIA_PATH}/tachidesk:/home/suwayomi/.local/share/Tachidesk/downloads

  caro-tachidesk:
    # Same image on Dockerhub is outdated
    image: ghcr.io/suwayomi/tachidesk:v2.4.2435@sha256:ca891c0a6915666d6a79f16b0119c52a63507d840e14dca0e8dbcc163f60d8b3
    container_name: caro-tachidesk
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      DOWNLOAD_AS_CBZ: true
      WEB_UI_ENABLED: true
      WEB_UI_FLAVOR: WebUI
      WEB_UI_CHANNEL: preview
      WEB_UI_UPDATE_INTERVAL: 12
      AUTO_DOWNLOAD_CHAPTERS: true
      AUTO_DOWNLOAD_EXCLUDE_UNREAD: false
      AUTO_DOWNLOAD_AHEAD_LIMIT: 20
      UPDATE_EXCLUDE_UNREAD: false
      UPDATE_EXCLUDE_STARTED: false
      UPDATE_EXCLUDE_COMPLETED: true
      UPDATE_INTERVAL: 12
      UPDATE_MANGA_INFO: true
      FLARESOLVERR_ENABLED: true
      FLARESOLVERR_URL: http://gluetun:8191
      BIND_PORT: 4568
    volumes:
      - /srv/home-lab-state/caro-tachidesk-data:/home/suwayomi/.local/share/Tachidesk
      - type: bind
        source: ${MEDIA_PATH}/caro-tachidesk
        target: /home/suwayomi/.local/share/Tachidesk/downloads
        bind:
          create_host_path: false

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    restart: always
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: $TZ
    volumes:
      - /srv/home-lab-state/flaresolverr-data:/config

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:2.7.0@sha256:04be30163fbaf48d6aeee7b5893c9f6614ffbad6d853971df0d6dcdf01c7f104
    container_name: prowlarr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    logging: *default-logging
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      FILE__PROWLARR__AUTH__APIKEY: /run/secrets/prowlarr_api_key
      PROWLARR__SERVER__PORT: 9696
    secrets:
      - prowlarr_api_key
    volumes:
      - /srv/home-lab-state/prowlarr-data:/config

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.0@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
    container_name: recyclarr
    restart: unless-stopped
    user: 1000:1000
    networks:
      - arr_network
    volumes:
      - /srv/home-lab-state/recyclarr-data:/config
      - ./data/recyclarr/configs:/config/configs:ro
      - ./data/recyclarr/includes:/config/includes:ro
    secrets:
      - source: recyclarr_credentials
        target: /config/secrets.yml
    environment:
      TZ: $TZ
      SONARR_URL: $SONARR_URL
      RADARR_URL: $RADARR_URL
      RADARR_4K_URL: $RADARR_4K_URL

  sonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.20@sha256:48e36b608b461273b9dae857725cd0561a127f2c694b687318f6d0c5ce63e5c9
    container_name: sonarr
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      FILE__SONARR__AUTH__APIKEY: /run/secrets/sonarr_api_key
      SONARR__SERVER__PORT: 8989
    secrets:
      - sonarr_api_key
    volumes:
      - /srv/home-lab-state/sonarr-data:/config
      - ${MEDIA_PATH}:/data

  radarr:
    image: ghcr.io/linuxserver/radarr:6.4.4@sha256:084b3b2ab1d0ef930660727259546a241f2bdf67c9ed085d54bf1486a6887c9b
    container_name: radarr
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      FILE__RADARR__AUTH__APIKEY: /run/secrets/radarr_api_key
      RADARR__SERVER__PORT: 7878
    secrets:
      - radarr_api_key
    volumes:
      - /srv/home-lab-state/radarr-data:/config
      - ${MEDIA_PATH}:/data

  radarr-4k:
    image: ghcr.io/linuxserver/radarr:6.4.4@sha256:084b3b2ab1d0ef930660727259546a241f2bdf67c9ed085d54bf1486a6887c9b
    container_name: radarr-4k
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      FILE__RADARR__AUTH__APIKEY: /run/secrets/radarr_4k_api_key
      RADARR__SERVER__PORT: 7879
    secrets:
      - radarr_4k_api_key
    volumes:
      - /srv/home-lab-state/radarr-4k-data:/config
      - ${MEDIA_PATH}:/data

  unpackerr:
    image: golift/unpackerr:0.16.1@sha256:244fc45cb207308f60e8f52dd703c2b3463385752de0f9517c58ff9d331ed15e
    container_name: unpackerr
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
      UN_SONARR_0_URL: $SONARR_URL
      UN_SONARR_0_API_KEY: filepath:/run/secrets/sonarr_api_key
      UN_SONARR_0_PATHS_0: /data/downloads/complete
      UN_RADARR_0_URL: $RADARR_URL
      UN_RADARR_0_API_KEY: filepath:/run/secrets/radarr_api_key
      UN_RADARR_0_PATHS_0: /data/downloads/complete
      UN_RADARR_1_URL: $RADARR_4K_URL
      UN_RADARR_1_API_KEY: filepath:/run/secrets/radarr_4k_api_key
      UN_RADARR_1_PATHS_0: /data/downloads/complete
    secrets:
      - sonarr_api_key
      - radarr_api_key
      - radarr_4k_api_key
    volumes:
      - ${MEDIA_PATH}/downloads:/data/downloads
    networks:
      - arr_network

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:5.3.0@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
    container_name: qbittorrent
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      WEBUI_PORT: 8081
    volumes:
      - /srv/home-lab-state/qbittorrent-data:/config
      - ${VUETORRENT_PATH}:/vuetorrent
      - ${MEDIA_PATH}/downloads:/data/downloads

  sabnzbd:
    image: ghcr.io/linuxserver/sabnzbd:5.1.3@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01
    container_name: sabnzbd
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
    volumes:
      - /srv/home-lab-state/sabnzbd-data:/config
      - ${MEDIA_PATH}:/data

secrets:
  wireguard_private_key:
    file: /etc/docker-compose/credentials/wireguard-private-key
  wireguard_addresses:
    file: /etc/docker-compose/credentials/wireguard-addresses
  mam_initial_id:
    file: /etc/docker-compose/credentials/mam-initial-id
  sonarr_api_key:
    file: /etc/docker-compose/credentials/sonarr-api-key
  radarr_api_key:
    file: /etc/docker-compose/credentials/radarr-api-key
  radarr_4k_api_key:
    file: /etc/docker-compose/credentials/radarr-4k-api-key
  prowlarr_api_key:
    file: /etc/docker-compose/credentials/prowlarr-api-key
  recyclarr_credentials:
    file: /etc/docker-compose/credentials/recyclarr-secrets.yml

networks:
  arr_network:
    ipam:
      driver: default
      config:
        - subnet: "172.21.0.0/16"
