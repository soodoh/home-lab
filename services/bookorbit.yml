---
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  bookorbit:
    image: ghcr.io/bookorbit/bookorbit:3.10.0@sha256:507a84c08c100244c27bce68ce59670da5dc8c3bc9054dd4aea3630977c42885
    container_name: bookorbit
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      TZ: $TZ
      APP_URL: https://books.diloreto.com
      DISABLE_LOCAL_AUTH: 'true'
      POSTGRES_HOST: bookorbit-db
      POSTGRES_DB: bookorbit
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD_FILE: /run/secrets/bookorbit_pg_app_password
      JWT_SECRET_FILE: /run/secrets/bookorbit_jwt_secret
      BOOK_REQUEST_ENCRYPTION_KEY_FILE: /run/secrets/bookorbit_request_encryption_key
      # v3.9.0 requires a setup token at production startup even in OIDC-only mode.
      SETUP_BOOTSTRAP_TOKEN_FILE: /run/secrets/bookorbit_bootstrap_token
      LIBRARY_BROWSE_ROOT: /libraries
      BOOK_DOCK_PATH: /data/book-dock
      PUID: '1000'
      PGID: '1000'
    secrets:
      - bookorbit_pg_app_password
      - bookorbit_jwt_secret
      - bookorbit_bootstrap_token
      - bookorbit_request_encryption_key
    depends_on:
      bookorbit-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - type: bind
        source: /srv/home-lab-state/bookorbit-media
        target: /libraries
        bind:
          create_host_path: false
      - type: bind
        source: /srv/home-lab-state/bookorbit-data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_PATH}/downloads/complete/bookorbit
        target: /acquisition/qbittorrent
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_PATH}/downloads/sabnzbd/complete/bookorbit
        target: /acquisition/sabnzbd
        read_only: true
        bind:
          create_host_path: false
    # Keep the application isolated on dedicated internal bridges and ICC-off egress.
    networks:
      - egress
      - bookorbit-db
      - bookorbit-ingress
      - bookorbit-arr

  bookorbit-db:
    image: pgvector/pgvector:0.8.7-pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    container_name: bookorbit-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
      POSTGRES_DB: bookorbit
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD_FILE: /run/secrets/bookorbit_pg_password
    secrets:
      - bookorbit_pg_password
    volumes:
      - type: bind
        source: /srv/home-lab-state/bookorbit-postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks:
      - bookorbit-db

secrets:
  bookorbit_pg_app_password:
    file: /etc/docker-compose/credentials/bookorbit-pg-app-password
  bookorbit_pg_password:
    file: /etc/docker-compose/credentials/bookorbit-pg-password
  bookorbit_jwt_secret:
    file: /etc/docker-compose/credentials/bookorbit-jwt-secret
  bookorbit_request_encryption_key:
    file: /etc/docker-compose/credentials/bookorbit-request-encryption-key
  bookorbit_bootstrap_token:
    file: /etc/docker-compose/credentials/bookorbit-bootstrap-token

networks:
  bookorbit-db:
    internal: true
  bookorbit-ingress:
    internal: true
  bookorbit-arr:
    internal: true
    ipam:
      config:
        - subnet: "172.26.20.0/29"
