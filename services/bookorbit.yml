---
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  bookorbit:
    image: ghcr.io/bookorbit/bookorbit:3.10.0@sha256:507a84c08c100244c27bce68ce59670da5dc8c3bc9054dd4aea3630977c42885
    container_name: bookorbit
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      TZ: $TZ
      APP_URL: https://books.diloreto.com
      DISABLE_LOCAL_AUTH: 'true'
      POSTGRES_HOST: bookorbit-db
      POSTGRES_DB: bookorbit
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD_FILE: /run/secrets/bookorbit_pg_app_password
      JWT_SECRET_FILE: /run/secrets/bookorbit_jwt_secret
      BOOK_REQUEST_ENCRYPTION_KEY_FILE: /run/secrets/bookorbit_request_encryption_key
      # v3.9.0 requires a setup token at production startup even in OIDC-only mode.
      SETUP_BOOTSTRAP_TOKEN_FILE: /run/secrets/bookorbit_bootstrap_token
      LIBRARY_BROWSE_ROOT: /libraries
      BOOK_DOCK_PATH: /data/book-dock
      PUID: '1000'
      PGID: '1000'
    secrets:
      - bookorbit_pg_app_password
      - bookorbit_jwt_secret
      - bookorbit_bootstrap_token
      - bookorbit_request_encryption_key
    depends_on:
      bookorbit-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - type: bind
        source: /srv/home-lab-state/bookorbit-media
        target: /libraries
        bind:
          create_host_path: false
      # Temporary mount while migrating the existing /books/paul library to /libraries/books.
      - type: bind
        source: /srv/home-lab-state/bookorbit-media
        target: /books
        bind:
          create_host_path: false
      - type: bind
        source: /srv/home-lab-state/bookorbit-data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_PATH}/downloads/complete/bookorbit
        target: /acquisition/qbittorrent
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_PATH}/downloads/sabnzbd/complete/bookorbit
        target: /acquisition/sabnzbd
        read_only: true
        bind:
          create_host_path: false
    # Keep the application out of the shared Arr namespace and bridge.
    networks:
      - bookorbit-egress
      - bookorbit-db
      - bookorbit-ingress
      - bookorbit-acquisition

  bookorbit-acquisition:
    image: traefik:v3.7.19@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    container_name: bookorbit-acquisition
    restart: unless-stopped
    logging: *default-logging
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 15s
      timeout: 5s
      retries: 4
    volumes:
      - type: bind
        source: ./data/bookorbit-acquisition/traefik.yml
        target: /etc/traefik/traefik.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/bookorbit-acquisition/routes.yml
        target: /etc/traefik/routes.yml
        read_only: true
        bind:
          create_host_path: false
    networks:
      bookorbit-acquisition:
        ipv4_address: 172.26.253.2
      arr_network: {}

  bookorbit-db:
    image: pgvector/pgvector:0.8.3-pg18@sha256:c8a919765f2ef63681329fa21021b830cd4d79d1165bdca730dd016014e4da84
    container_name: bookorbit-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
      POSTGRES_DB: bookorbit
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD_FILE: /run/secrets/bookorbit_pg_password
    secrets:
      - bookorbit_pg_password
    volumes:
      - type: bind
        source: /srv/home-lab-state/bookorbit-postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks:
      - bookorbit-db

secrets:
  bookorbit_pg_app_password:
    file: /etc/docker-compose/credentials/bookorbit-pg-app-password
  bookorbit_pg_password:
    file: /etc/docker-compose/credentials/bookorbit-pg-password
  bookorbit_jwt_secret:
    file: /etc/docker-compose/credentials/bookorbit-jwt-secret
  bookorbit_request_encryption_key:
    file: /etc/docker-compose/credentials/bookorbit-request-encryption-key
  bookorbit_bootstrap_token:
    file: /etc/docker-compose/credentials/bookorbit-bootstrap-token

networks:
  bookorbit-db:
    internal: true
  bookorbit-egress: {}
  bookorbit-ingress:
    internal: true
  bookorbit-acquisition:
    internal: true
    ipam:
      config:
        - subnet: 172.26.253.0/29
          # Reserve .2 for the proxy even if BookOrbit joins the bridge first.
          ip_range: 172.26.253.4/30
