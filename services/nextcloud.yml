x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

x-nextcloud-image: &nextcloud-image nextcloud:34.0.2-apache@sha256:d7666d54d87c58d52869ddda36d1acbd4a7f53faf8ab6b91293daf204f3434e8

x-nextcloud-volumes: &nextcloud-volumes
  - type: bind
    source: /srv/home-lab-state/nextcloud-html
    target: /var/www/html
    bind:
      create_host_path: false
  - type: bind
    source: ${MEDIA_PATH}/nextcloud/data
    target: /var/www/html/data
    bind:
      create_host_path: false
  - type: bind
    source: /srv/home-lab-state/nextcloud-config
    target: /var/www/html/config
    bind:
      create_host_path: false
  - type: bind
    source: /srv/home-lab-state/nextcloud-custom-apps
    target: /var/www/html/custom_apps
    bind:
      create_host_path: false
  - type: bind
    source: /srv/home-lab-state/nextcloud-themes
    target: /var/www/html/themes
    bind:
      create_host_path: false

services:
  nextcloud:
    image: *nextcloud-image
    container_name: nextcloud
    restart: always
    logging: *default-logging
    volumes: *nextcloud-volumes
    environment:
      TZ: $TZ
      REDIS_HOST: nextcloud-redis
      REDIS_HOST_PORT: 6379
      MYSQL_HOST: nextcloud-db
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_mysql_password
      MYSQL_DATABASE: $MYSQL_DATABASE
      MYSQL_USER: $MYSQL_USER
      APACHE_DISABLE_REWRITE_IP: "1"
      TRUSTED_PROXIES: 172.23.0.250
      NEXTCLOUD_INIT_HTACCESS: "true"
      PHP_MEMORY_LIMIT: 1G
    secrets:
      - nextcloud_mysql_password
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    networks:
      - proxy
      - nextcloud

  nextcloud-cron:
    image: *nextcloud-image
    container_name: nextcloud-cron
    restart: always
    entrypoint: /cron.sh
    logging: *default-logging
    environment:
      PHP_MEMORY_LIMIT: 1G
    volumes: *nextcloud-volumes
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    networks:
      - nextcloud

  nextcloud-db:
    image: mariadb:lts-ubi9@sha256:29dd37f5df222f7c2668b51d412536ffeff0efc4d4b68d849e9bcead913bffe0
    container_name: nextcloud-db
    restart: always
    # Read root-only Compose secrets before the official entrypoint drops to mysql.
    user: "0"
    logging: *default-logging
    command: --transaction-isolation=READ-COMMITTED
    volumes:
      - /srv/home-lab-state/nextcloud-db-data:/var/lib/mysql
    environment:
      TZ: $TZ
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DISABLE_UPGRADE_BACKUP: "1"
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/nextcloud_mariadb_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_mysql_password
      MYSQL_DATABASE: $MYSQL_DATABASE
      MYSQL_USER: $MYSQL_USER
    secrets:
      - nextcloud_mariadb_root_password
      - nextcloud_mysql_password
    networks:
      - nextcloud

  nextcloud-redis:
    image: redis:8.2-m01-alpine@sha256:73785dd3f61435fbea1a14bafd2c6509f9df112f50953e09eb31c94717c77e76
    container_name: nextcloud-redis
    restart: always
    logging: *default-logging
    environment:
      TZ: $TZ
    volumes:
      - /srv/home-lab-state/nextcloud-redis-data:/data
    networks:
      - nextcloud

secrets:
  nextcloud_mysql_password:
    file: /etc/docker-compose/credentials/nextcloud-mysql-password
  nextcloud_mariadb_root_password:
    file: /etc/docker-compose/credentials/nextcloud-mariadb-root-password

networks:
  nextcloud:
    ipam:
      driver: default
      config:
        - subnet: "172.24.0.0/16"
