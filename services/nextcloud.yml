x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

x-nextcloud-image: &nextcloud-image nextcloud:34.0.4-apache@sha256:a5ace30c695afe48c2c406e940ee7886a81e13fa382e57cd68b2416d1a66914c

x-nextcloud-smtp-environment: &nextcloud-smtp-environment
  SMTP_HOST: $NEXTCLOUD_SMTP_HOST
  SMTP_PORT: $NEXTCLOUD_SMTP_PORT
  SMTP_SECURE: $NEXTCLOUD_SMTP_SECURE
  SMTP_AUTHTYPE: $NEXTCLOUD_SMTP_AUTHTYPE
  SMTP_NAME: $NEXTCLOUD_SMTP_USERNAME
  SMTP_PASSWORD: $NEXTCLOUD_SMTP_PASSWORD
  MAIL_FROM_ADDRESS: $NEXTCLOUD_MAIL_FROM_ADDRESS
  MAIL_DOMAIN: $NEXTCLOUD_MAIL_DOMAIN

x-nextcloud-volumes: &nextcloud-volumes
  - type: bind
    source: /srv/home-lab-state/nextcloud-html
    target: /var/www/html
    bind:
      create_host_path: false
  - type: bind
    source: ${MEDIA_PATH}/nextcloud/data
    target: /var/www/html/data
    bind:
      create_host_path: false
  - type: bind
    source: /srv/home-lab-state/nextcloud-config
    target: /var/www/html/config
    bind:
      create_host_path: false
  - type: bind
    source: /srv/home-lab-state/nextcloud-custom-apps
    target: /var/www/html/custom_apps
    bind:
      create_host_path: false
  - type: bind
    source: /srv/home-lab-state/nextcloud-themes
    target: /var/www/html/themes
    bind:
      create_host_path: false

services:
  nextcloud:
    image: *nextcloud-image
    container_name: nextcloud
    restart: always
    logging: *default-logging
    volumes: *nextcloud-volumes
    environment:
      <<: *nextcloud-smtp-environment
      TZ: $TZ
      REDIS_HOST: nextcloud-redis
      REDIS_HOST_PORT: 6379
      MYSQL_HOST: nextcloud-db
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_mysql_password
      MYSQL_DATABASE: $NEXTCLOUD_DB
      MYSQL_USER: $NEXTCLOUD_DB_USER
      APACHE_DISABLE_REWRITE_IP: "1"
      TRUSTED_PROXIES: 172.23.0.250
      NEXTCLOUD_INIT_HTACCESS: "true"
      PHP_MEMORY_LIMIT: 1G
    secrets:
      - nextcloud_mysql_password
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    networks:
      - proxy
      - nextcloud

  nextcloud-cron:
    image: *nextcloud-image
    container_name: nextcloud-cron
    restart: always
    entrypoint: /cron.sh
    logging: *default-logging
    environment:
      <<: *nextcloud-smtp-environment
      PHP_MEMORY_LIMIT: 1G
    volumes: *nextcloud-volumes
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    networks:
      - nextcloud

  nextcloud-db:
    image: mariadb:11.8.9-ubi9@sha256:4d6c45144a18908d1244975e5c275fa56e688fbc77f889f27e68e1c5b8cb64d5
    container_name: nextcloud-db
    restart: always
    # Read root-only Compose secrets before the official entrypoint drops to mysql.
    user: "0"
    logging: *default-logging
    command: --transaction-isolation=READ-COMMITTED
    volumes:
      - /srv/home-lab-state/nextcloud-db-data:/var/lib/mysql
    environment:
      TZ: $TZ
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DISABLE_UPGRADE_BACKUP: "1"
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/nextcloud_mariadb_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_mysql_password
      MYSQL_DATABASE: $NEXTCLOUD_DB
      MYSQL_USER: $NEXTCLOUD_DB_USER
    secrets:
      - nextcloud_mariadb_root_password
      - nextcloud_mysql_password
    networks:
      - nextcloud

  nextcloud-redis:
    image: redis:8.10.1-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    container_name: nextcloud-redis
    restart: always
    logging: *default-logging
    environment:
      TZ: $TZ
    volumes:
      - /srv/home-lab-state/nextcloud-redis-data:/data
    networks:
      - nextcloud

secrets:
  nextcloud_mysql_password:
    file: /etc/docker-compose/credentials/nextcloud-mysql-password
  nextcloud_mariadb_root_password:
    file: /etc/docker-compose/credentials/nextcloud-mariadb-root-password

networks:
  nextcloud:
    ipam:
      driver: default
      config:
        - subnet: "172.24.0.0/16"
