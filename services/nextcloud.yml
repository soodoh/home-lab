x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

x-nextcloud-image: &nextcloud-image nextcloud:34.0.4-apache@sha256:a5ace30c695afe48c2c406e940ee7886a81e13fa382e57cd68b2416d1a66914c

x-nextcloud-smtp-environment: &nextcloud-smtp-environment
  SMTP_HOST: $NEXTCLOUD_SMTP_HOST
  SMTP_PORT: $NEXTCLOUD_SMTP_PORT
  SMTP_SECURE: $NEXTCLOUD_SMTP_SECURE
  SMTP_AUTHTYPE: $NEXTCLOUD_SMTP_AUTHTYPE
  SMTP_NAME: $NEXTCLOUD_SMTP_USERNAME
  SMTP_PASSWORD_FILE: /run/secrets/nextcloud_smtp_password
  MAIL_FROM_ADDRESS: $NEXTCLOUD_MAIL_FROM_ADDRESS
  MAIL_DOMAIN: $NEXTCLOUD_MAIL_DOMAIN

x-nextcloud-volumes: &nextcloud-volumes
  - type: bind
    source: /srv/home-lab-state/nextcloud-html
    target: /var/www/html
    bind:
      create_host_path: false
  - type: bind
    source: ${MEDIA_PATH}/nextcloud/data
    target: /var/www/html/data
    bind:
      create_host_path: false
  - type: bind
    source: /srv/home-lab-state/nextcloud-config
    target: /var/www/html/config
    bind:
      create_host_path: false
  - type: bind
    source: /srv/home-lab-state/nextcloud-custom-apps
    target: /var/www/html/custom_apps
    bind:
      create_host_path: false
  - type: bind
    source: /srv/home-lab-state/nextcloud-themes
    target: /var/www/html/themes
    bind:
      create_host_path: false

services:
  nextcloud:
    image: *nextcloud-image
    container_name: nextcloud
    restart: always
    logging: *default-logging
    volumes: *nextcloud-volumes
    environment:
      <<: *nextcloud-smtp-environment
      TZ: $TZ
      REDIS_HOST: nextcloud-redis
      REDIS_HOST_PORT: 6379
      MYSQL_HOST: nextcloud-db
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_mysql_password
      MYSQL_DATABASE: $NEXTCLOUD_DB
      MYSQL_USER: $NEXTCLOUD_DB_USER
      APACHE_DISABLE_REWRITE_IP: "1"
      TRUSTED_PROXIES: 172.26.4.2
      NEXTCLOUD_INIT_HTACCESS: "true"
      PHP_MEMORY_LIMIT: 1G
    secrets:
      - nextcloud_mysql_password
      - nextcloud_smtp_password
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    networks:
      - egress
      - nextcloud-data
      - nextcloud-ingress

  nextcloud-cron:
    image: *nextcloud-image
    container_name: nextcloud-cron
    init: true
    # This process is crond, not Apache; the image's SIGWINCH is inappropriate.
    stop_signal: SIGTERM
    restart: always
    entrypoint: /cron.sh
    logging: *default-logging
    environment:
      <<: *nextcloud-smtp-environment
      PHP_MEMORY_LIMIT: 1G
    secrets:
      - nextcloud_smtp_password
    volumes: *nextcloud-volumes
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    networks:
      - egress
      - nextcloud-data

  nextcloud-db:
    image: mariadb:11.8.9-ubi9@sha256:0f8b649f4e41fc883128593a2d35e3c417430f6c656903271182f812a8435672
    container_name: nextcloud-db
    restart: always
    # Read root-only Compose secrets before the official entrypoint drops to mysql.
    user: "0"
    logging: *default-logging
    command: --transaction-isolation=READ-COMMITTED
    volumes:
      - /srv/home-lab-state/nextcloud-db-data:/var/lib/mysql
    environment:
      TZ: $TZ
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DISABLE_UPGRADE_BACKUP: "1"
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/nextcloud_mariadb_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_mysql_password
      MYSQL_DATABASE: $NEXTCLOUD_DB
      MYSQL_USER: $NEXTCLOUD_DB_USER
    secrets:
      - nextcloud_mariadb_root_password
      - nextcloud_mysql_password
    networks:
      - nextcloud-data

  nextcloud-redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    container_name: nextcloud-redis
    restart: always
    logging: *default-logging
    environment:
      TZ: $TZ
    volumes:
      - /srv/home-lab-state/nextcloud-redis-data:/data
    networks:
      - nextcloud-data

secrets:
  nextcloud_smtp_password:
    file: /etc/docker-compose/credentials/nextcloud-smtp-password
  nextcloud_mysql_password:
    file: /etc/docker-compose/credentials/nextcloud-mysql-password
  nextcloud_mariadb_root_password:
    file: /etc/docker-compose/credentials/nextcloud-mariadb-root-password

networks:
  nextcloud-data:
    internal: true
    ipam:
      config:
        - subnet: "172.26.3.0/28"
  nextcloud-ingress:
    internal: true
    ipam:
      config:
        - subnet: "172.26.4.0/29"
          # Reserve .2 for Traefik so Nextcloud's TRUSTED_PROXIES stays stable.
          ip_range: "172.26.4.4/30"
