x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    container_name: jellyfin
    restart: unless-stopped
    logging: *default-logging
    ports:
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:8096:8096
    volumes:
      - type: bind
        source: /srv/home-lab-state/jellyfin-data/config
        target: /config
      - type: bind
        source: /srv/home-lab-state/jellyfin-data/cache
        target: /cache
      - type: bind
        source: ./data/authentik-ldap-ca.pem
        target: /etc/ssl/certs/authentik-ldap.pem
        read_only: true
      - ${MEDIA_PATH}/tv_shows:/tv_shows
      - ${MEDIA_PATH}/movies:/movies
      - ${MEDIA_PATH}/anime:/anime
      - type: tmpfs
        target: /cache/transcodes
        tmpfs:
          size: 17179869184
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      LIBVA_DRIVER_NAME: radeonsi
      JELLYFIN_SERVERS: $INTERNAL_HOST_IP
      JELLYFIN_PublishedServerUrl: $JELLYFIN_PublishedServerUrl
    networks:
      - egress
      - media-public-ingress
      - jellyfin-auth

  karaoke-eternal:
    image: radrootllc/karaoke-eternal:2.1.0@sha256:ea6ab55254702443bfc16fe9c21128aa0a79262c739a8419e8f72c67267ee0f1
    container_name: karaoke-eternal
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
    volumes:
      - /srv/home-lab-state/karaoke-eternal-data:/config
      - ${MEDIA_PATH}/karaoke:/mnt/karaoke
    networks:
      - egress
      - media-public-ingress

  vaultwarden:
    image: ghcr.io/dani-garcia/vaultwarden:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    container_name: vaultwarden
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
      SMTP_HOST: $VAULTWARDEN_SMTP_HOST
      SMTP_PORT: $VAULTWARDEN_SMTP_PORT
      SMTP_SECURITY: $VAULTWARDEN_SMTP_SECURITY
      SMTP_USERNAME: $VAULTWARDEN_SMTP_USERNAME
      SMTP_PASSWORD_FILE: /run/secrets/vaultwarden_smtp_password
      SMTP_FROM: $VAULTWARDEN_SMTP_FROM
      SMTP_FROM_NAME: $VAULTWARDEN_SMTP_FROM_NAME
      DOMAIN: $VAULTWARDEN_DOMAIN
      SSO_AUTHORITY: $VAULTWARDEN_SSO_AUTHORITY
      SSO_CLIENT_ID: $VAULTWARDEN_SSO_CLIENT_ID
      SSO_CLIENT_SECRET_FILE: /run/secrets/vaultwarden_sso_client_secret
      SSO_ENABLED: true
      SSO_SCOPES: email profile offline_access
      SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION: false
      # Cache discovery/JWKS briefly; account for this window when rotating signing keys.
      SSO_CLIENT_CACHE_EXPIRATION: 600
      SSO_ONLY: true
      SSO_SIGNUPS_MATCH_EMAIL: true
    secrets:
      - vaultwarden_smtp_password
      - vaultwarden_sso_client_secret
    volumes:
      - /srv/home-lab-state/vaultwarden-data:/data
    networks:
      - egress
      - vaultwarden-ingress

  mindwtr-cloud:
    image: ghcr.io/dongdongbh/mindwtr-cloud:1.3.9@sha256:9bd240a1da46f18e38ca93fe105faad7d79667d1bf12a156250a92700a28aede
    container_name: mindwtr-cloud
    init: true
    # Invoke the signal-handling server directly, not bun's workspace runner.
    command: ["bun", "/app/apps/cloud/src/server.ts", "--host", "0.0.0.0", "--port", "8787"]
    restart: unless-stopped
    logging: *default-logging
    # The image reads the protected file as root, then drops the server to bun.
    user: "0:0"
    secrets:
      - mindwtr_cloud_tokens
    environment:
      MINDWTR_CLOUD_AUTH_TOKENS_FILE: /run/secrets/mindwtr_cloud_tokens
      MINDWTR_CLOUD_CORS_ORIGIN: https://todo.diloreto.com
      MINDWTR_CLOUD_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/ready"]
      interval: 90s
      timeout: 10s
      start_period: 30s
      start_interval: 5s
      retries: 3
    volumes:
      - type: bind
        source: /srv/home-lab-state/mindwtr-data
        target: /data
        bind:
          create_host_path: false
    networks:
      - mindwtr-ingress

  mindwtr-app:
    image: ghcr.io/dongdongbh/mindwtr-app:1.3.9@sha256:91eb0e968593e898bbeae02e86879b76bc56b93f1bb03a5fa7a27e18c2db54cf
    container_name: mindwtr-app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mindwtr-cloud:
        condition: service_healthy
    networks:
      - mindwtr-ingress

secrets:
  vaultwarden_smtp_password:
    file: /etc/docker-compose/credentials/vaultwarden-smtp-password
  vaultwarden_sso_client_secret:
    file: /etc/docker-compose/credentials/vaultwarden-sso-client-secret
  mindwtr_cloud_tokens:
    file: /etc/docker-compose/credentials/mindwtr-cloud-tokens

networks:
  vaultwarden-ingress:
    internal: true
    ipam:
      config:
        - subnet: "172.26.11.0/29"
  media-public-ingress:
    internal: true
    ipam:
      config:
        - subnet: "172.26.12.0/28"
  mindwtr-ingress:
    internal: true
    ipam:
      config:
        - subnet: "172.26.13.0/28"
