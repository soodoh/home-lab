x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:12.1@sha256:008ec8024bdaaa6f0a3f0de468e185633eeba9d67c56936e8dbf5ef6b8d6200f
    container_name: jellyfin
    restart: unless-stopped
    logging: *default-logging
    ports:
      - ${INTERNAL_HOST_IP:?Set INTERNAL_HOST_IP in .env}:8096:8096
    volumes:
      - type: bind
        source: /srv/home-lab-state/jellyfin-data/config
        target: /config
      - type: bind
        source: /srv/home-lab-state/jellyfin-data/cache
        target: /cache
      - type: bind
        source: ./data/authentik-ldap-ca.pem
        target: /etc/ssl/certs/authentik-ldap.pem
        read_only: true
      - ${MEDIA_PATH}/tv_shows:/tv_shows
      - ${MEDIA_PATH}/movies:/movies
      - ${MEDIA_PATH}/anime:/anime
      - ${MEDIA_PATH}/books:/books
      - type: tmpfs
        target: /cache/transcodes
        tmpfs:
          size: 17179869184
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      LIBVA_DRIVER_NAME: radeonsi
      JELLYFIN_SERVERS: $INTERNAL_HOST_IP
      JELLYFIN_PublishedServerUrl: $JELLYFIN_PublishedServerUrl
    networks:
      - proxy
      - jellyfin-auth

  calibre:
    image: ghcr.io/linuxserver/calibre:9.15.0@sha256:8c7b77ada7133cbac1519791035ac7e305e37adae5cd06038270a90f99f4b4d6
    container_name: calibre
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
    volumes:
      - type: bind
        source: /srv/home-lab-state/calibre-data/config
        target: /config
      - type: bind
        source: /srv/home-lab-state/calibre-data/plugins
        target: /plugins
      - type: bind
        source: /srv/home-lab-state/calibre-data/books
        target: /books
        bind:
          create_host_path: false
      - ${MEDIA_PATH}/downloads:/downloads
    networks:
      proxy:
        ipv4_address: 172.23.0.99

  calibre-web-automated:
    image: ghcr.io/crocodilestick/calibre-web-automated:v4.0.6@sha256:c31a738b6d5ec6982c050063dd3f063b6943eb1051fc81144789f840d9093a8d
    container_name: calibre-web-automated
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
      FILE__HARDCOVER_TOKEN: /run/secrets/hardcover_token
      # If your library is on a network share (e.g., NFS/SMB), disable WAL to reduce locking issues
      # Accepts: true/false (default: false)
      NETWORK_SHARE_MODE: false
      CWA_PORT_OVERRIDE: 8083
    secrets:
      - hardcover_token
    volumes:
      - /srv/home-lab-state/calibre-web-data:/config
      - type: bind
        source: /srv/home-lab-state/calibre-data/books
        target: /calibre-library
        bind:
          create_host_path: false
      - /srv/home-lab-state/calibre-web-ingest:/cwa-book-ingest
    networks:
      - proxy

  karaoke-eternal:
    image: radrootllc/karaoke-eternal:latest@sha256:96a4ff5f14657aaa0e7308f1455fedab7065756e1e3e163522619ee3aa9f5c5f
    container_name: karaoke-eternal
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
    volumes:
      - /srv/home-lab-state/karaoke-eternal-data:/config
      - ${MEDIA_PATH}/karaoke:/mnt/karaoke
    networks:
      - proxy

  vaultwarden:
    image: ghcr.io/dani-garcia/vaultwarden:1.37.3@sha256:1587c45feaa479f1f5e8af3b00eded36bff77bcf1880cf8dbf0541706dd470e0
    container_name: vaultwarden
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: $TZ
      SMTP_HOST: $VAULTWARDEN_SMTP_HOST
      SMTP_PORT: $VAULTWARDEN_SMTP_PORT
      SMTP_SECURITY: $VAULTWARDEN_SMTP_SECURITY
      SMTP_USERNAME: $VAULTWARDEN_SMTP_USERNAME
      SMTP_PASSWORD_FILE: /run/secrets/vaultwarden_smtp_password
      SMTP_FROM: $VAULTWARDEN_SMTP_FROM
      SMTP_FROM_NAME: $VAULTWARDEN_SMTP_FROM_NAME
      DOMAIN: $VAULTWARDEN_DOMAIN
      SSO_AUTHORITY: $VAULTWARDEN_SSO_AUTHORITY
      SSO_CLIENT_ID: $VAULTWARDEN_SSO_CLIENT_ID
      SSO_CLIENT_SECRET_FILE: /run/secrets/vaultwarden_sso_client_secret
      SSO_ENABLED: true
      SSO_SCOPES: email profile offline_access
      SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION: false
      SSO_CLIENT_CACHE_EXPIRATION: 0
      SSO_ONLY: true
      SSO_SIGNUPS_MATCH_EMAIL: true
    secrets:
      - vaultwarden_smtp_password
      - vaultwarden_sso_client_secret
    volumes:
      - /srv/home-lab-state/vaultwarden-data:/data
    networks:
      - proxy

  mindwtr-cloud:
    image: ghcr.io/dongdongbh/mindwtr-cloud:1.2.6@sha256:45cd92a1113df5924a2c94d68303e77dbbce8a237420d7949cf08e1812acd77c
    container_name: mindwtr-cloud
    restart: unless-stopped
    logging: *default-logging
    # The image reads the protected file as root, then drops the server to bun.
    user: "0:0"
    secrets:
      - mindwtr_cloud_tokens
    environment:
      MINDWTR_CLOUD_AUTH_TOKENS_FILE: /run/secrets/mindwtr_cloud_tokens
      MINDWTR_CLOUD_CORS_ORIGIN: https://todo.diloreto.com
      MINDWTR_CLOUD_DATA_DIR: /data
    volumes:
      - type: bind
        source: /srv/home-lab-state/mindwtr-data
        target: /data
        bind:
          create_host_path: false
    networks:
      - proxy

  mindwtr-app:
    image: ghcr.io/dongdongbh/mindwtr-app:1.2.6@sha256:9195824477d6502cde53b6629e2557e0578636270f907f89715c9fc6c200c728
    container_name: mindwtr-app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mindwtr-cloud:
        condition: service_healthy
    networks:
      - proxy

secrets:
  hardcover_token:
    file: /etc/docker-compose/credentials/hardcover-token
  vaultwarden_smtp_password:
    file: /etc/docker-compose/credentials/vaultwarden-smtp-password
  vaultwarden_sso_client_secret:
    file: /etc/docker-compose/credentials/vaultwarden-sso-client-secret
  mindwtr_cloud_tokens:
    file: /etc/docker-compose/credentials/mindwtr-cloud-tokens
