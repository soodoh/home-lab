name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Set up source Python and package-download cache
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: controller/requirements*.txt

      - name: Install source-test controller
        uses: ./.github/actions/setup-controller
        with:
          lint: 'true'

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install and test local JavaScript tooling
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/home-lab-bun-cache
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run test:javascript

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: v1.13.9
          # Fixture helpers intentionally omit action-only environment variables.
          tofu_wrapper: false

      - name: Install source-validation system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes age jq rsync shellcheck

      - name: Test required CI admission behavior
        run: python scripts/test-ci.py

      - name: Enforce disposable-controller boundaries
        run: python scripts/check-source-boundaries.py

      - name: Validate Compose image policy
        run: python scripts/check-compose-image-pins.py

      - name: Validate Renovate configuration natively
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.234.1
        run: |
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          # The inner shell expands command -v, not the outer workflow shell.
          # shellcheck disable=SC2016
          npm exec --cache "$work/npm-cache" --yes --package "renovate@$RENOVATE_VERSION" -- \
            sh -eu -c '
              renovate-config-validator --strict renovate.json
              node scripts/test-renovate-policy.mjs "$(command -v renovate)"
            '

      - name: Validate pure routine Compose admission on source Python
        run: python scripts/test-compose-upgrade-admission.py

      - name: Validate backup and recovery behavior
        run: |
          python scripts/test-restic-runtime.py
          python scripts/test-restic-observer.py
          python scripts/test-wolf-security.py
          python scripts/test-wolf-start.py
          python scripts/test-compose-mounts.py
          python scripts/test-qbittorrent-password.py
          python scripts/test-mam-seedbox.py
          python scripts/test-gluetun-hooks.py
          python scripts/test-servarr-variables.py
          scripts/test-recovery-tools

      - name: Run native source validators
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-lint ansible/playbooks ansible/roles ansible/tests/controller-sops.yml
          yamllint . --no-warnings
          git ls-files -z | python -c '
          import pathlib, sys
          for name in sys.stdin.buffer.read().split(b"\0"):
              if name and pathlib.Path(name.decode()).read_bytes().split(b"\n", 1)[0] in (
                  b"#!/bin/sh", b"#!/bin/bash", b"#!/usr/bin/env bash",
              ):
                  sys.stdout.buffer.write(name + b"\0")
          ' | xargs -0 shellcheck
          docker compose config --no-env-resolution --no-interpolate --quiet
          tofu fmt -check -recursive

      - name: Cache public OpenTofu provider packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/opentofu/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-tofu-${{ hashFiles('infrastructure/tofu/**/.terraform.lock.hcl') }}

      - name: Bind the provider-package cache, never state or plans
        run: |
          mkdir -p "$HOME/.cache/opentofu/plugins"
          printf 'TF_PLUGIN_CACHE_DIR=%s\n' "$HOME/.cache/opentofu/plugins" >> "$GITHUB_ENV"

      - name: Validate OpenTofu roots
        env:
          AWS_REGION: us-east-1
        run: |
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          for root in infrastructure/tofu/{aws-foundation,authentik,omada,proxmox,proxmox-access,proxmox-firewall,servarr,tailscale}; do
            TF_DATA_DIR="$work/$(basename "$root")"
            export TF_DATA_DIR
            tofu -chdir="$root" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$root" validate
            # Native lock refresh must not add unpacked hashes for either supported platform.
            # Extra upstream ZIP hashes for unrelated platforms do not invalidate existing locks.
            # Use a private copy; never repair a PR lock silently or access remote state.
            lock_root="$work/locks/$(basename "$root")"
            mkdir -p "$lock_root"
            cp "$root/versions.tf" "$root/.terraform.lock.hcl" "$lock_root/"
            tofu -chdir="$lock_root" providers lock -platform=linux_amd64 -platform=darwin_arm64
            grep -E '^provider |^  (version|constraints) |"h1:' "$root/.terraform.lock.hcl" > "$work/lock-before"
            grep -E '^provider |^  (version|constraints) |"h1:' "$lock_root/.terraform.lock.hcl" > "$work/lock-after"
            cmp "$work/lock-before" "$work/lock-after"
          done

      - name: Test native Proxmox ownership declarations
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          scripts/test-proxmox-tofu
          ansible-playbook -i 'localhost,' -c local \
            ansible/tests/proxmox-cloud-init.yml -e ansible_become=false

      - name: Compile retained Python helpers
        run: python -m compileall -q scripts infrastructure ansible/roles

      - name: Validate provider observation inputs
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          python scripts/test-omada-export.py
          python scripts/test-omada-mail.py
          shellcheck scripts/check-omada-mail
          python scripts/controller/test-local-provider-credentials.py
          python scripts/controller/test-proxmox-hardware-identities.py
          python scripts/controller/test-proxmox-access-bindings.py
          python scripts/controller/test-authentik-tofu-foundation.py
          python scripts/test-authentik-tofu
          python scripts/controller/test-authentik-secret-readability.py
          python scripts/controller/test-compose-with-sops.py

      - name: Validate infrastructure policy
        run: infrastructure/policy/test-policy.sh

      - name: Syntax-check retained playbooks
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          while IFS= read -r playbook; do
            ansible-playbook "$playbook" --syntax-check
          done < <(find ansible/playbooks -type f -name '*.yml' -print | sort)

  host-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Set up host Python and package-download cache
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: controller/host-python-version
          cache: pip
          cache-dependency-path: controller/requirements*.txt

      - name: Install the independently maintained host controller
        uses: ./.github/actions/setup-controller

      - name: Install native controller system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes age rsync

      - name: Test source selection, admission and registry failure isolation
        run: |
          python scripts/test-compose-upgrade-admission.py
          python scripts/test-compose-source-selection.py
          python scripts/test-compose-image-pull.py
          python scripts/test-restic-observer.py

      - name: Test native scheduled execution and production ownership in disposable Linux
        run: |
          sudo env HOME_LAB_SYSTEMD_TEST_DISPOSABLE=true "$(command -v python)" scripts/test-compose-schedule-systemd.py
          sudo env HOME_LAB_LOCK_TEST_DISPOSABLE=true PATH="$PATH" "$(command -v python)" scripts/test-deployment-interfaces.py
          sudo env HOME_LAB_LOCK_TEST_DISPOSABLE=true PATH="$PATH" "$(command -v python)" scripts/test-apply-lock-clearance.py

      - name: Test the candidate Docker collection against a real inert container
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-playbook -i 'docker-host,' -c local ansible/tests/wolf-image-restart.yml \
            --become -e wolf_image_restart_runtime_test=true -e "ansible_python_interpreter=$(command -v python)"

      - name: Test the real pinned SOPS release and candidate collection with synthetic secrets
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        # Run the controller as root too: the lookup must read its private fixture files.
        run: |
          sudo env ANSIBLE_CONFIG="$ANSIBLE_CONFIG" PATH="$PATH" \
            ANSIBLE_COLLECTIONS_PATH="$HOME/.ansible/collections" \
            "$(command -v ansible-playbook)" -i 'localhost,' -c local ansible/tests/controller-sops.yml \
            -e "ansible_python_interpreter=$(command -v python)"

      - name: Test credential delivery once on the production Python line
        run: python scripts/controller/test-compose-credential-files.py --durations=0

      - name: Test native controller interfaces against synthetic APIs
        run: |
          python scripts/test-omada-mail-convergence.py --durations=0
          python scripts/controller/test-grimmory.py --durations=0

  native-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Set up host Python and package-download cache
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: controller/host-python-version
          cache: pip
          cache-dependency-path: controller/requirements*.txt

      - name: Install the independently maintained host controller
        uses: ./.github/actions/setup-controller

      - name: Install native recovery system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes age bzip2 curl jq mariadb-client rsync util-linux

      - name: Admit the pinned public Restic tool
        id: tool
        uses: ./.github/actions/setup-restic

      - name: Test native full capture and selective recovery
        env:
          RESTIC: ${{ steps.tool.outputs.restic }}
        run: |
          umask 077
          work=$(mktemp -d)
          trap 'sudo rm -rf -- "$work"' EXIT
          sudo env TMPDIR="$work" RESTIC_NATIVE_TEST_DISPOSABLE=true scripts/test-restic-native-restore "$RESTIC"
          RESTIC="$RESTIC" python scripts/test-simple-backups.py

  application-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Set up host Python and package-download cache
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: controller/host-python-version
          cache: pip
          cache-dependency-path: controller/requirements*.txt

      - name: Install the independently maintained host controller
        uses: ./.github/actions/setup-controller
        with:
          fixtures: 'true'

      - name: Install application fixture system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg rsync nftables iproute2

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: v1.13.9
          # Fixture helpers intentionally omit action-only environment variables.
          tofu_wrapper: false

      - name: Test native Wolf security behavior
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-playbook -i 'localhost,' -c local \
            ansible/tests/shelfmark-settings.yml -e ansible_become=false -e shelfmark_runtime_test=true
          ansible-playbook -i 'localhost,' -c local \
            ansible/tests/shelfmark-compose.yml -e ansible_become=false
          ansible-playbook -i 'localhost,' -c local \
            ansible/tests/wolf-admission.yml -e ansible_become=false
          ansible-playbook -i 'docker-host,' -c local \
            ansible/tests/wolf-image-pins.yml -e ansible_become=false
          ansible-playbook -i 'docker-host,' -c local \
            ansible/tests/wolf-image-restart.yml --become -e wolf_image_restart_runtime_test=true
          ansible-playbook -i 'localhost,' -c local ansible/tests/wolf-firewall.yml
          TF_DATA_DIR=$(mktemp -d)
          export TF_DATA_DIR
          trap 'rm -rf "$TF_DATA_DIR"' EXIT
          # Mock tests cannot execute native imports. Copy production definitions
          # unchanged, omitting only imports.tf; validate the full root above.
          test_root="$TF_DATA_DIR/source/infrastructure/tofu/tailscale"
          mkdir -p "$test_root" "$TF_DATA_DIR/source/services/data/wolf"
          rsync -a --exclude='imports.tf' --include='*.tf' --include='*.tfvars.json' \
            --include='.terraform.lock.hcl' --include='tests/***' --exclude='*' \
            infrastructure/tofu/tailscale/ "$test_root/"
          cp services/data/wolf/security.json "$TF_DATA_DIR/source/services/data/wolf/"
          tofu -chdir="$test_root" init -backend=false -input=false -lockfile=readonly
          tofu -chdir="$test_root" test

  validate:
    # A failure, cancellation, skip or missing dependency must refuse admission.
    if: ${{ always() }}
    needs: [source-validation, host-compatibility, native-recovery, application-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every candidate qualification job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = 'success success success success'
