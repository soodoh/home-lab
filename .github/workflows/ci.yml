name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check ansible-core==2.21.2

      - name: Enforce disposable-controller boundaries
        run: python scripts/check-source-boundaries.py

      - name: Validate native Compose source
        run: |
          python scripts/check-compose-image-pins.py
          python scripts/test-compose-native.py
          scripts/test-compose-secret-files

      - name: Validate backup and recovery source
        run: |
          python scripts/test-restic-runtime.py
          python scripts/test-restic-systemd.py
          scripts/test-recovery-tools

      - name: Validate provider observation inputs
        run: python scripts/test-omada-export.py

      - name: Validate infrastructure policy
        run: infrastructure/policy/test-policy.sh

      - name: Syntax-check retained playbooks
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          while IFS= read -r playbook; do
            ansible-playbook "$playbook" --syntax-check
          done < <(find ansible/playbooks -type f -name '*.yml' -print | sort)
