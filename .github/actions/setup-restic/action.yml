name: Set up verified Restic fixture tool
description: Cache only the pinned public binary; verify the installed checksum on every use.
outputs:
  restic:
    description: Absolute checksum-verified Restic binary path.
    value: ${{ steps.verify.outputs.restic }}
runs:
  using: composite
  steps:
    - name: Cache the pinned public tool
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/home-lab-restic-tool
        key: ${{ runner.os }}-${{ runner.arch }}-restic-${{ hashFiles('services/data/restic/policy.json') }}

    - name: Download and verify the pinned archive
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        umask 077
        work="$RUNNER_TEMP/home-lab-restic-tool"
        mkdir -p "$work"
        chmod 0700 "$work"
        policy=services/data/restic/policy.json
        curl --fail --silent --show-error --location \
          "$(jq -r .tools.restic.url "$policy")" --output "$work/restic.bz2"
        printf '%s  %s\n' "$(jq -r .tools.restic.archive_sha256 "$policy")" "$work/restic.bz2" | sha256sum --check --status
        bzip2 --decompress --stdout "$work/restic.bz2" >"$work/restic"
        rm -- "$work/restic.bz2"

    - name: Verify the installed binary even on a cache hit
      id: verify
      shell: bash
      run: |
        work="$RUNNER_TEMP/home-lab-restic-tool"
        printf '%s  %s\n' "$(jq -r .tools.restic.installed_sha256 services/data/restic/policy.json)" "$work/restic" | sha256sum --check --status
        chmod 0700 "$work" "$work/restic"
        printf 'restic=%s\n' "$work/restic" >> "$GITHUB_OUTPUT"
