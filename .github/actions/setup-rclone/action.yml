name: Set up verified rclone fixture tool
description: Cache the public pinned binary and verify its installed checksum on every use.
outputs:
  rclone:
    description: Absolute checksum-verified rclone binary path.
    value: ${{ steps.verify.outputs.rclone }}
runs:
  using: composite
  steps:
    - name: Cache the pinned public tool
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/home-lab-rclone-tool
        key: ${{ runner.os }}-${{ runner.arch }}-rclone-${{ hashFiles('services/data/restic/policy.json') }}

    - name: Download and verify the pinned archive
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        umask 077
        work="$RUNNER_TEMP/home-lab-rclone-tool"
        mkdir -p "$work"
        chmod 0700 "$work"
        policy=services/data/restic/policy.json
        curl --fail --silent --show-error --location \
          "$(jq -r .tools.rclone.url "$policy")" --output "$work/rclone.zip"
        printf '%s  %s\n' "$(jq -r .tools.rclone.archive_sha256 "$policy")" "$work/rclone.zip" | sha256sum --check --status
        python - "$work" <<'PY'
        import pathlib, sys, zipfile
        work = pathlib.Path(sys.argv[1])
        with zipfile.ZipFile(work / 'rclone.zip') as archive:
            names = [name for name in archive.namelist() if name.endswith('/rclone')]
            assert len(names) == 1
            (work / 'rclone').write_bytes(archive.read(names[0]))
        PY
        rm -- "$work/rclone.zip"

    - name: Verify the installed binary even on a cache hit
      id: verify
      shell: bash
      run: |
        work="$RUNNER_TEMP/home-lab-rclone-tool"
        printf '%s  %s\n' "$(jq -r .tools.rclone.installed_sha256 services/data/restic/policy.json)" "$work/rclone" | sha256sum --check --status
        chmod 0700 "$work" "$work/rclone"
        printf 'rclone=%s\n' "$work/rclone" >> "$GITHUB_OUTPUT"
