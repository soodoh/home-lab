---
version: 1
system_name: home-lab
system_timezone: America/Los_Angeles
lifecycle:
  version: 1
  states:
    - inert
    - bootstrap
    - production
    - maintenance
    - recovery
    - retired
  transitions:
    inert: [bootstrap]
    bootstrap: [production, recovery]
    production: [maintenance, recovery, retired]
    maintenance: [production, recovery]
    recovery: [production, retired]
    retired: []
  maintenance:
    package_plan:
      metadata_refresh: explicit-reviewed-operation
      max_metadata_age_seconds: 86400
      resolver: apt-get-simulate
      installed_inventory: dpkg-query-status-tsv-v1
      save_exact_versions: true
      apply_time_replan: false
      hosts:
        debian:
          candidate_scope: all-upgrades
          allowed_apply_scope: security-updates-only
          apply_authority: reviewed-ansible-transaction
          automatic_reboot: false
        proxmox:
          candidate_scope: all-upgrades
          allowed_apply_scope: reviewed-exact-set
          apply_authority: protected-session
          automatic_reboot: false
    reboot_plan:
      automatic: false
      one_host_per_transaction: true
      backup_max_age_hours: 24
      expected_current_kernel_required: true
      expected_target_kernel_required: true
      expected_boot_id_required: true
      console_required_hosts:
        - proxmox
  hosts:
    proxmox:
      desired_state: production
      current_mutation_owner: nix
      target_mutation_owner: ansible
      bootstrap_authority: physical-console
      steady_transport: tailscale-ssh
      break_glass: physical-console
      marker:
        path: /var/lib/home-lab/lifecycle-state.json
        owner: root
        group: root
        mode: "0600"
        adoption_state: complete
      domain_handoffs:
        timezone:
          current_owner: ansible
          target_owner: ansible
          state: transferred
          parity_required: true
          single_writer: true
        apt_repositories:
          current_owner: ansible
          target_owner: ansible
          state: transferred
          parity_required: true
          single_writer: true
        chrony_service:
          current_owner: ansible
          target_owner: ansible
          state: transferred
          parity_required: true
          single_writer: true
        boot_configuration:
          current_owner: ansible
          target_owner: ansible
          state: transferred
          parity_required: true
          single_writer: true
        zfs_dataset:
          current_owner: ansible
          target_owner: ansible
          state: transferred
          parity_required: true
          single_writer: true
        nfs_export_service:
          current_owner: ansible
          target_owner: ansible
          state: transferred
          parity_required: true
          single_writer: true
        network_interfaces:
          current_owner: ansible
          target_owner: ansible
          state: transferred
          parity_required: true
          single_writer: true
        tailscale_node:
          current_owner: ansible
          target_owner: ansible
          state: transferred
          parity_required: true
          single_writer: true
        package_set:
          current_owner: ansible
          target_owner: ansible
          state: transferred
          parity_required: true
          single_writer: true
        nix_mutation_engine:
          current_owner: nix
          target_owner: ansible
          state: ready
          parity_required: true
          single_writer: true
      access_cutover:
        state: ready
        target_identities:
          human: proxmox
          plan: ansible-plan
          apply: ansible-deploy
          firewall: firewall-apply
        retire_identities:
          - tofu-plan
          - tofu-apply
        retire_root_supplementary_groups:
          - apex
        root_key_attributions:
          "SHA256:Je+jcqxxdCTlcMc8sZToiF3oZrLIJ+N6mxNhiosUIXw": current-proxmox-root-identity
          "SHA256:xnvOo0mjS/Ghwrbf8JovxNp51qFXQncLO4ygGvZPR7w": personal-laptop
          "SHA256:6RaXU5sJ5bREB69ozsxdAFWVhYvCm9jlPAu7rSOx+dU": iphone-termius
          "SHA256:UKIt1zHVexMpz9we72AErUd+DBrQh4cyoGa1gqOGPmA": work-laptop
          "SHA256:/qSECkXxkpCIjTkBwa8XZZdRW2/seScon5uAKGlLC80": obsolete-proxmox-root-identity
          "SHA256:SNH3GBfBBvbkycl78DbrIjbaC0rJxkvue+KF9qhpXrs": obsolete-proxmox-root-identity
        required_tailnet_users:
          - proxmox
          - ansible-plan
          - ansible-deploy
          - firewall-apply
        forbidden_tailnet_users:
          - root
          - tofu-plan
          - tofu-apply
        plan_privilege_model: fixed-reduced-observer
        apply_privilege_model: saved-plan-bound
        firewall_privilege_model: fixed-transaction-transport
        firewall_magicdns_target: firewall-apply@proxmox
        conventional_keys_target: absent
        pubkey_authentication_target: false
        permit_root_login_target: false
        remove_conventional_keys_last: true
        physical_console_required: true
    debian:
      desired_state: production
      current_mutation_owner: ansible
      target_mutation_owner: ansible
      bootstrap_authority: physical-console-or-localhost
      steady_transport: tailscale-ssh
      break_glass: physical-console
      marker:
        path: /var/lib/home-lab/lifecycle-state.json
        owner: root
        group: root
        mode: "0600"
        adoption_state: complete
      access_cleanup:
        state: complete
        identity: ansible-deploy
        steady_transport: tailscale-ssh
        legacy_marker_path: /var/lib/home-lab/debian-inert-provisioned
        conventional_key_paths:
          - /home/ansible-deploy/.ssh/authorized_keys
          - /root/.ssh/authorized_keys
        target_pubkey_authentication: false
        target_permit_root_login: false
        remove_keys_before_tightening: true
        physical_console_required: true
        one_change_class_per_transaction: true
recovery:
  evidence_max_age_days: 90
  critical_rpo_hours: 24
  critical_rto_hours: 8
vm_100:
  vmid: 100
  host_name: docker-host
  network_identity: docker-host
  # Debian is the sole production and deployment authority.
  deployment_authority: debian
  workload_identity:
    user: docker
    uid: 1000
    primary_group: docker
    gid: 1000
    home: /home/docker
    shell: /bin/bash
    supplementary_groups:
      - input
      - render
      - uucp
  access:
    openssh_enabled: true
    authorized_login_keys: 2
    password_authentication: false
    keyboard_interactive_authentication: false
    permit_root_login: false
    allow_tcp_forwarding: false
    x11_forwarding: false
  networking:
    interface: ens18
    match_mac: BC:24:11:89:19:5A
    ipv4: 192.168.0.100/24
    gateway: 192.168.0.1
    dns:
      - 1.1.1.1
    dhcp: false
  storage:
    games:
      mountpoint: /mnt/games
      filesystem: ext4
      filesystem_uuid: 31602ce7-0054-498a-9f24-f51ca491e7b3
      label: games
      options:
        - noatime
    shared:
      mountpoint: /mnt/storage
      filesystem: nfs4
      source: 192.168.0.123:/storage/docker
      options:
        - defaults
  hardware:
    kernel_modules:
      - uhid
      - uinput
    gpu:
      vendor_device: 1002:744c
      render_node: /dev/dri/renderD128
      runtime_power_management: false
    bluetooth:
      vendor_device: 0bda:a729
    input:
      group: input
      mode: "0660"
    serial:
      vendor_device: 10c4:ea60
      group: uucp
      mode: "0660"
      protected_symlinks:
        - /dev/zigbee
        - /dev/zwave
    tun:
      path: /dev/net/tun
    qemu_guest_agent: true
    sysctls:
      fs.inotify.max_user_instances: 1024
      fs.inotify.max_user_watches: 1048576
      user.max_user_namespaces: 28633
network:
  cidr: 192.168.0.0/24
  gateway: 192.168.0.1
  dns:
    - 1.1.1.1
  bridge: vmbr0
  bridge_port: eno1
  ownership:
    interfaces_file:
      kind: managed-file
      projectable: true
      path: /etc/network/interfaces
      owner: root
      group: root
      mode: "0644"
    snippets_directory: /etc/network/interfaces.d
    permitted_active_snippets: []
    managed_header: "# Managed by the Home Lab Nix host workflow. Keep console/LAN rollback available during changes."
    bridge_stp: false
    bridge_forward_delay: 0
    resolver_management: excluded-from-this-handoff
    hosts_file_management: excluded-from-this-handoff
    runtime_activation: separately-authorized-watchdog
  proxmox:
    hostname: proxmox
    magicdns_name: proxmox
    ipv4: 192.168.0.123/24
    mac: E8:9C:25:46:62:3D
  docker_host:
    hostname: docker-host
    magicdns_name: docker-host
    ipv4: 192.168.0.100/24
    mac: BC:24:11:89:19:5A
proxmox:
  node: proxmox
  api_endpoint: https://proxmox:8006/api2/json
  grub:
    file:
      kind: managed-file
      projectable: true
      path: /etc/default/grub
      owner: root
      group: root
      mode: "0644"
    variable: GRUB_CMDLINE_LINUX_DEFAULT
    default_tokens:
      - quiet
      - amd_iommu=on
      - iommu=pt
  vfio:
    modules:
      - vfio
      - vfio_iommu_type1
      - vfio_pci
    device_ids:
      - 1002:744c
      - 1002:ab30
    prohibited_modules: []
    absence_policy:
      - kind: audit-absence
        projectable: true
        absence: matching-lines
        path: /etc/modules
        pattern: '^\s*(vfio|vfio_iommu_type1|vfio_pci|vfio_virqfd)(?:\s*(?:#.*)?)?$'
      - kind: audit-absence
        projectable: true
        absence: matching-lines
        path: /etc/modules-load.d/modules.conf
        pattern: '^\s*(vfio|vfio_iommu_type1|vfio_pci|vfio_virqfd)(?:\s*(?:#.*)?)?$'
      - kind: audit-absence
        projectable: true
        absence: file
        path: /etc/modprobe.d/vfio.conf
    modules_load_file:
      kind: managed-file
      projectable: true
      path: /etc/modules-load.d/home-lab-vfio.conf
      owner: root
      group: root
      mode: "0644"
    modprobe_file:
      kind: protected-managed-file
      projectable: false
      path: /etc/modprobe.d/home-lab-vfio.conf
      owner: root
      group: root
      mode: "0644"
    soft_dependencies:
      - module: amdgpu
        pre:
          - vfio-pci
      - module: snd_hda_intel
        pre:
          - vfio-pci
    recovery:
      executable_file:
        kind: managed-file
        projectable: true
        path: /usr/local/sbin/home-lab-vfio-recover
        owner: root
        group: root
        mode: "0750"
      policy_file:
        kind: managed-file
        projectable: true
        path: /etc/home-lab/vfio-recovery.json
        owner: root
        group: root
        mode: "0440"
      confirmation: recover-vm-100-vfio-group-14
      lock_path: /run/lock/home-lab-vfio-recovery.lock
  apt:
    repository_file_metadata:
      kind: managed-file-metadata
      projectable: true
      owner: root
      group: root
      mode: "0644"
    inactive_sources_list:
      file:
        kind: managed-file
        projectable: true
        path: /etc/apt/sources.list
        owner: root
        group: root
        mode: "0644"
      notice: "# Repository definitions are managed in /etc/apt/sources.list.d/*.sources."
    repositories:
      - name: debian
        file: /etc/apt/sources.list.d/debian.sources
        types: [deb]
        uris: [http://deb.debian.org/debian]
        suites: [trixie, trixie-updates]
        components: [main, contrib, non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
      - name: debian-security
        file: /etc/apt/sources.list.d/debian-security.sources
        types: [deb]
        uris: [http://security.debian.org/debian-security]
        suites: [trixie-security]
        components: [main, contrib, non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
      - name: pve-no-subscription
        file: /etc/apt/sources.list.d/pve-no-subscription.sources
        types: [deb]
        uris: [http://download.proxmox.com/debian/pve]
        suites: [trixie]
        components: [pve-no-subscription]
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
      - name: tailscale
        file: /etc/apt/sources.list.d/tailscale.sources
        types: [deb]
        uris: [https://pkgs.tailscale.com/stable/debian]
        suites: [trixie]
        components: [main]
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    permitted_keyrings:
      - name: debian
        file:
          kind: managed-file
          projectable: true
          path: /usr/share/keyrings/debian-archive-keyring.gpg
          owner: root
          group: root
          mode: "0644"
        sha256: 506b815cbb32d9b6066b4a2aa524071e071761e7e7f68c3ac74f3061ba852017
        source_url: null
        symlink_target: debian-archive-keyring.pgp
      - name: proxmox
        file:
          kind: managed-file
          projectable: true
          path: /usr/share/keyrings/proxmox-archive-keyring.gpg
          owner: root
          group: root
          mode: "0644"
        sha256: 136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
        source_url: null
        symlink_target: null
      - name: tailscale
        file:
          kind: managed-file
          projectable: true
          path: /usr/share/keyrings/tailscale-archive-keyring.gpg
          owner: root
          group: root
          mode: "0644"
        sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
        source_url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
        symlink_target: null
  services:
    - name: chrony.service
      enabled: true
      state: started
    - name: nfs-server.service
      enabled: true
      state: started
    - name: ssh.service
      enabled: true
      state: started
    - name: tailscaled.service
      enabled: true
      state: started
  access:
    sudo_validation:
      executable: /usr/sbin/visudo
      arguments:
        - --check
        - --file=%s
    service_accounts:
      - name: tofu-plan
        home: /home/tofu-plan
        shell: /bin/bash
        create_home: true
        password_lock: true
        groups: []
        ssh_directory:
          kind: runtime-protected-directory
          projectable: false
          materialization: metadata-only
          path: /home/tofu-plan/.ssh
          owner: tofu-plan
          group: tofu-plan
          mode: "0700"
        authorized_keys:
          file:
            kind: runtime-protected-file
            projectable: false
            materialization: metadata-only
            path: /home/tofu-plan/.ssh/authorized_keys
            owner: tofu-plan
            group: tofu-plan
            mode: "0600"
          secret_ref: PROXMOX_PLAN_SSH_PUBLIC_KEYS
          forced_command: 'restrict,command="sudo -n -- /usr/local/libexec/home-lab/proxmox-observer observe"'
        sudo:
          state: present
          file:
            kind: managed-file
            projectable: true
            path: /etc/sudoers.d/tofu-plan
            owner: root
            group: root
            mode: "0440"
          rule: "tofu-plan ALL=(root) NOPASSWD: /usr/local/libexec/home-lab/proxmox-observer observe"
      - name: tofu-apply
        home: /home/tofu-apply
        shell: /usr/local/libexec/home-lab/proxmox-apply-transport
        create_home: true
        password_lock: true
        groups: []
        ssh_directory:
          kind: runtime-protected-directory
          projectable: false
          materialization: metadata-only
          path: /home/tofu-apply/.ssh
          owner: tofu-apply
          group: tofu-apply
          mode: "0700"
        authorized_keys:
          file:
            kind: runtime-protected-file
            projectable: false
            materialization: metadata-only
            path: /home/tofu-apply/.ssh/authorized_keys
            owner: tofu-apply
            group: tofu-apply
            mode: "0600"
          secret_ref: PROXMOX_APPLY_SSH_PUBLIC_KEYS
          forced_command: 'restrict,command="/usr/local/libexec/home-lab/proxmox-apply-transport"'
        sudo:
          state: present
          file:
            kind: managed-file
            projectable: true
            path: /etc/sudoers.d/tofu-apply
            owner: root
            group: root
            mode: "0440"
          rule: "tofu-apply ALL=(root) NOPASSWD: /usr/local/libexec/home-lab/proxmox-private-preparer prepare, /usr/local/libexec/home-lab/proxmox-activator session"
      - name: firewall-apply
        home: /home/firewall-apply
        shell: /usr/local/libexec/home-lab/proxmox-firewall-transport
        create_home: true
        password_lock: true
        groups: []
        ssh_directory:
          kind: runtime-protected-directory
          projectable: false
          materialization: metadata-only
          path: /home/firewall-apply/.ssh
          owner: firewall-apply
          group: firewall-apply
          mode: "0700"
        authorized_keys:
          file:
            kind: runtime-protected-file
            projectable: false
            materialization: metadata-only
            path: /home/firewall-apply/.ssh/authorized_keys
            owner: firewall-apply
            group: firewall-apply
            mode: "0600"
          secret_ref: PROXMOX_FIREWALL_SSH_PUBLIC_KEYS
          forced_command: 'restrict,command="/usr/local/libexec/home-lab/proxmox-firewall-transport"'
        sudo:
          state: present
          file:
            kind: managed-file
            projectable: true
            path: /etc/sudoers.d/firewall-apply
            owner: root
            group: root
            mode: "0440"
          rule: "firewall-apply ALL=(root) NOPASSWD: /usr/local/libexec/home-lab/proxmox-firewall-transaction inspect, /usr/local/libexec/home-lab/proxmox-firewall-transaction begin, /usr/local/libexec/home-lab/proxmox-firewall-transaction status, /usr/local/libexec/home-lab/proxmox-firewall-transaction commit, /usr/local/libexec/home-lab/proxmox-firewall-transaction rollback"
      - name: ansible-plan
        home: /home/ansible-plan
        shell: /usr/local/libexec/home-lab/proxmox-ansible-plan-transport
        create_home: true
        password_lock: true
        groups: []
        ssh_directory:
          kind: runtime-protected-directory
          projectable: false
          materialization: metadata-only
          path: /home/ansible-plan/.ssh
          owner: ansible-plan
          group: ansible-plan
          mode: "0700"
        authorized_keys:
          state: absent
          files:
            - kind: runtime-protected-file
              projectable: false
              materialization: metadata-only
              path: /home/ansible-plan/.ssh/authorized_keys
              owner: ansible-plan
              group: ansible-plan
              mode: "0600"
            - kind: runtime-protected-file
              projectable: false
              materialization: metadata-only
              path: /home/ansible-plan/.ssh/authorized_keys2
              owner: ansible-plan
              group: ansible-plan
              mode: "0600"
        sudo:
          state: present
          file:
            kind: managed-file
            projectable: true
            path: /etc/sudoers.d/ansible-plan
            owner: root
            group: root
            mode: "0440"
          rule: "ansible-plan ALL=(root) NOPASSWD: /usr/local/libexec/home-lab/proxmox-observer observe"
      - name: ansible-deploy
        home: /home/ansible-deploy
        shell: /usr/local/libexec/home-lab/proxmox-ansible-deploy-transport
        create_home: true
        password_lock: true
        groups: []
        ssh_directory:
          kind: runtime-protected-directory
          projectable: false
          materialization: metadata-only
          path: /home/ansible-deploy/.ssh
          owner: ansible-deploy
          group: ansible-deploy
          mode: "0700"
        authorized_keys:
          state: absent
          files:
            - kind: runtime-protected-file
              projectable: false
              materialization: metadata-only
              path: /home/ansible-deploy/.ssh/authorized_keys
              owner: ansible-deploy
              group: ansible-deploy
              mode: "0600"
            - kind: runtime-protected-file
              projectable: false
              materialization: metadata-only
              path: /home/ansible-deploy/.ssh/authorized_keys2
              owner: ansible-deploy
              group: ansible-deploy
              mode: "0600"
        sudo:
          state: present
          file:
            kind: managed-file
            projectable: true
            path: /etc/sudoers.d/ansible-deploy
            owner: root
            group: root
            mode: "0440"
          rule: "ansible-deploy ALL=(root) NOPASSWD: /usr/local/libexec/home-lab/proxmox-ansible-deploy-activator, /usr/local/libexec/home-lab/proxmox-restic-recovery-transport"
    human_accounts:
      - name: proxmox
        comment: Home Lab Proxmox Administrator
        group: proxmox
        home: /home/proxmox
        shell: /bin/bash
        password_lock: true
        supplementary_groups: []
        ssh_directory:
          kind: runtime-protected-directory
          projectable: false
          materialization: metadata-only
          path: /home/proxmox/.ssh
          owner: proxmox
          group: proxmox
          mode: "0700"
        authorized_keys:
          state: absent
          files:
            - kind: runtime-protected-file
              projectable: false
              materialization: metadata-only
              path: /home/proxmox/.ssh/authorized_keys
              owner: proxmox
              group: proxmox
              mode: "0600"
            - kind: runtime-protected-file
              projectable: false
              materialization: metadata-only
              path: /home/proxmox/.ssh/authorized_keys2
              owner: proxmox
              group: proxmox
              mode: "0600"
        sudo:
          state: present
          file:
            kind: managed-file
            projectable: true
            path: /etc/sudoers.d/proxmox
            owner: root
            group: root
            mode: "0440"
          rule: "proxmox ALL=(root) NOPASSWD: ALL"
    pve:
      accounts:
        - user: root@pam
          token_name: tofu-plan
          token_escrow:
            directory:
              kind: runtime-protected-directory
              projectable: false
              materialization: metadata-only
              path: /root/.config/home-lab
              owner: root
              group: root
              mode: "0700"
            file:
              kind: runtime-protected-file
              projectable: false
              materialization: metadata-only
              path: /root/.config/home-lab/proxmox-plan-token.env
              owner: root
              group: root
              mode: "0600"
          privilege_separation: true
          primary_acl_path: /
          role: HomeLabTofuPlan
          privileges:
            - Datastore.Audit
            - Mapping.Audit
            - SDN.Audit
            - Sys.Audit
            - VM.Audit
          additional_acls:
            - path: /vms/100
              role: HomeLabTofuPlanDiskInspect
        - user: root@pam
          token_name: tofu-apply
          token_escrow:
            directory:
              kind: runtime-protected-directory
              projectable: false
              materialization: metadata-only
              path: /root/.config/home-lab
              owner: root
              group: root
              mode: "0700"
            file:
              kind: runtime-protected-file
              projectable: false
              materialization: metadata-only
              path: /root/.config/home-lab/proxmox-apply-token.env
              owner: root
              group: root
              mode: "0600"
          privilege_separation: true
          primary_acl_path: /
          role: HomeLabTofuApply
          privileges:
            - Datastore.Allocate
            - Datastore.AllocateSpace
            - Datastore.AllocateTemplate
            - Datastore.Audit
            - Mapping.Audit
            - Mapping.Modify
            - Mapping.Use
            - SDN.Audit
            - SDN.Use
            - Sys.Audit
            - Sys.Modify
            - VM.Allocate
            - VM.Audit
            - VM.Config.CDROM
