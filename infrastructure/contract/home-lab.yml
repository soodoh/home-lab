---
version: 1
system_name: home-lab
recovery:
  evidence_max_age_days: 90
  critical_rpo_hours: 24
  critical_rto_hours: 8
  recovery_age_recipient: age1vvzm5pczjum52v5alall8euucjen9q4v9xa5g0xmswhna5vare9qwv9rq6
vm_100:
  vmid: 100
  host_name: archlinux
  network_identity: docker-host
  # Arch remains authoritative until a decoupled-state replacement OS cutover is fully qualified.
  deployment_authority: arch
  workload_identity:
    user: docker
    uid: 1000
    primary_group: docker
    gid: 1000
    home: /home/docker
    shell: /bin/bash
    supplementary_groups:
      - input
      - render
      - uucp
  access:
    openssh_enabled: true
    authorized_login_keys: 0
    password_authentication: false
    keyboard_interactive_authentication: false
    permit_root_login: false
    allow_tcp_forwarding: false
    x11_forwarding: false
  networking:
    interface: ens18
    match_mac: BC:24:11:89:19:5A
    ipv4: 192.168.0.100/24
    gateway: 192.168.0.1
    dns:
      - 1.1.1.1
    dhcp: false
  storage:
    games:
      mountpoint: /mnt/games
      filesystem: ext4
      filesystem_uuid: 31602ce7-0054-498a-9f24-f51ca491e7b3
      label: games
      options:
        - noatime
    shared:
      mountpoint: /mnt/storage
      filesystem: nfs4
      source: 192.168.0.123:/storage/docker
      options:
        - defaults
  hardware:
    kernel_modules:
      - uhid
      - uinput
    gpu:
      vendor_device: 1002:744c
      render_node: /dev/dri/renderD128
      runtime_power_management: false
    bluetooth:
      vendor_device: 0bda:a729
    input:
      group: input
      mode: "0660"
    serial:
      vendor_device: 10c4:ea60
      group: uucp
      mode: "0660"
      protected_symlinks:
        - /dev/zigbee
        - /dev/zwave
    tun:
      path: /dev/net/tun
    qemu_guest_agent: true
    sysctls:
      fs.inotify.max_user_instances: 1024
      fs.inotify.max_user_watches: 1048576
      user.max_user_namespaces: 28633
network:
  cidr: 192.168.0.0/24
  gateway: 192.168.0.1
  dns:
    - 1.1.1.1
  bridge: vmbr0
  bridge_port: eno1
  ownership:
    interfaces_file:
      kind: managed-file
      projectable: true
      path: /etc/network/interfaces
      owner: root
      group: root
      mode: "0644"
    snippets_directory: /etc/network/interfaces.d
    permitted_active_snippets: []
    managed_header: "# Managed by the Home Lab Nix host workflow. Keep console/LAN rollback available during changes."
    bridge_stp: false
    bridge_forward_delay: 0
  proxmox:
    hostname: proxmox
    magicdns_name: proxmox
    ipv4: 192.168.0.123/24
    mac: E8:9C:25:46:62:3D
  arch:
    hostname: archlinux
    magicdns_name: docker-host
    ipv4: 192.168.0.100/24
    mac: BC:24:11:89:19:5A
proxmox:
  node: proxmox
  api_endpoint: https://proxmox:8006/api2/json
  grub:
    file:
      kind: managed-file
      projectable: true
      path: /etc/default/grub
      owner: root
      group: root
      mode: "0644"
    variable: GRUB_CMDLINE_LINUX_DEFAULT
    default_tokens:
      - quiet
      - amd_iommu=on
      - iommu=pt
  vfio:
    modules:
      - vfio
      - vfio_iommu_type1
      - vfio_pci
    device_ids:
      - 1002:744c
      - 1002:ab30
    prohibited_modules: []
    absence_policy:
      - kind: audit-absence
        projectable: true
        absence: matching-lines
        path: /etc/modules
        pattern: '^\s*(vfio|vfio_iommu_type1|vfio_pci|vfio_virqfd)(?:\s*(?:#.*)?)?$'
      - kind: audit-absence
        projectable: true
        absence: matching-lines
        path: /etc/modules-load.d/modules.conf
        pattern: '^\s*(vfio|vfio_iommu_type1|vfio_pci|vfio_virqfd)(?:\s*(?:#.*)?)?$'
      - kind: audit-absence
        projectable: true
        absence: file
        path: /etc/modprobe.d/vfio.conf
    modules_load_file:
      kind: managed-file
      projectable: true
      path: /etc/modules-load.d/home-lab-vfio.conf
      owner: root
      group: root
      mode: "0644"
    modprobe_file:
      kind: managed-file
      projectable: true
      path: /etc/modprobe.d/home-lab-vfio.conf
      owner: root
      group: root
      mode: "0644"
    soft_dependencies:
      - module: amdgpu
        pre:
          - vfio-pci
      - module: snd_hda_intel
        pre:
          - vfio-pci
    recovery:
      executable_file:
        kind: managed-file
        projectable: true
        path: /usr/local/sbin/home-lab-vfio-recover
        owner: root
        group: root
        mode: "0750"
      policy_file:
        kind: managed-file
        projectable: true
        path: /etc/home-lab/vfio-recovery.json
        owner: root
        group: root
        mode: "0440"
      confirmation: recover-vm-100-vfio-group-14
      lock_path: /run/lock/home-lab-vfio-recovery.lock
  apt:
    repository_file_metadata:
      kind: managed-file-metadata
      projectable: true
      owner: root
      group: root
      mode: "0644"
    inactive_sources_list:
      file:
        kind: managed-file
        projectable: true
        path: /etc/apt/sources.list
        owner: root
        group: root
        mode: "0644"
      notice: "# Repository definitions are managed in /etc/apt/sources.list.d/*.sources."
    repositories:
      - name: debian
        file: /etc/apt/sources.list.d/debian.sources
        types: [deb]
        uris: [http://deb.debian.org/debian]
        suites: [trixie, trixie-updates]
        components: [main, contrib, non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
      - name: debian-security
        file: /etc/apt/sources.list.d/debian-security.sources
        types: [deb]
        uris: [http://security.debian.org/debian-security]
        suites: [trixie-security]
        components: [main, contrib, non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
      - name: pve-no-subscription
        file: /etc/apt/sources.list.d/pve-no-subscription.sources
        types: [deb]
        uris: [http://download.proxmox.com/debian/pve]
        suites: [trixie]
        components: [pve-no-subscription]
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
      - name: tailscale
        file: /etc/apt/sources.list.d/tailscale.sources
        types: [deb]
        uris: [https://pkgs.tailscale.com/stable/debian]
        suites: [trixie]
        components: [main]
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    permitted_keyrings:
      - name: debian
        file:
          kind: managed-file
          projectable: true
          path: /usr/share/keyrings/debian-archive-keyring.gpg
          owner: root
          group: root
          mode: "0644"
        sha256: 506b815cbb32d9b6066b4a2aa524071e071761e7e7f68c3ac74f3061ba852017
        source_url: null
        symlink_target: debian-archive-keyring.pgp
      - name: proxmox
        file:
          kind: managed-file
          projectable: true
          path: /usr/share/keyrings/proxmox-archive-keyring.gpg
          owner: root
          group: root
          mode: "0644"
        sha256: 136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
        source_url: null
        symlink_target: null
      - name: tailscale
        file:
          kind: managed-file
          projectable: true
          path: /usr/share/keyrings/tailscale-archive-keyring.gpg
          owner: root
          group: root
          mode: "0644"
        sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
        source_url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
        symlink_target: null
  services:
    - name: chrony.service
      enabled: true
      state: started
    - name: nfs-server.service
      enabled: true
      state: started
    - name: ssh.service
      enabled: true
      state: started
    - name: tailscaled.service
      enabled: true
      state: started
  access:
    sudo_validation:
      executable: /usr/sbin/visudo
      arguments:
        - --check
        - --file=%s
    service_accounts:
      - name: tofu-plan
        home: /home/tofu-plan
        shell: /bin/bash
        create_home: true
        password_lock: true
        groups: []
        ssh_directory:
          kind: runtime-protected-directory
          projectable: false
          materialization: metadata-only
          path: /home/tofu-plan/.ssh
          owner: tofu-plan
          group: tofu-plan
          mode: "0700"
        authorized_keys:
          file:
            kind: runtime-protected-file
            projectable: false
            materialization: metadata-only
            path: /home/tofu-plan/.ssh/authorized_keys
            owner: tofu-plan
            group: tofu-plan
            mode: "0600"
          secret_ref: PROXMOX_PLAN_SSH_PUBLIC_KEYS
          forced_command: 'restrict,command="sudo -n -- /usr/local/libexec/home-lab/proxmox-observer observe"'
        sudo:
          state: present
          file:
            kind: managed-file
            projectable: true
            path: /etc/sudoers.d/tofu-plan
            owner: root
            group: root
            mode: "0440"
          rule: "tofu-plan ALL=(root) NOPASSWD: /usr/local/libexec/home-lab/proxmox-observer observe"
      - name: tofu-apply
        home: /home/tofu-apply
        shell: /usr/local/libexec/home-lab/proxmox-apply-transport
        create_home: true
        password_lock: true
        groups: []
        ssh_directory:
          kind: runtime-protected-directory
          projectable: false
          materialization: metadata-only
          path: /home/tofu-apply/.ssh
          owner: tofu-apply
          group: tofu-apply
          mode: "0700"
        authorized_keys:
          file:
            kind: runtime-protected-file
            projectable: false
            materialization: metadata-only
            path: /home/tofu-apply/.ssh/authorized_keys
            owner: tofu-apply
            group: tofu-apply
            mode: "0600"
          secret_ref: PROXMOX_APPLY_SSH_PUBLIC_KEYS
          forced_command: 'restrict,command="/usr/local/libexec/home-lab/proxmox-apply-transport"'
        sudo:
          state: present
          file:
            kind: managed-file
            projectable: true
            path: /etc/sudoers.d/tofu-apply
            owner: root
            group: root
            mode: "0440"
          rule: "tofu-apply ALL=(root) NOPASSWD: /usr/local/libexec/home-lab/proxmox-private-preparer prepare, /usr/local/libexec/home-lab/proxmox-activator session"
      - name: firewall-apply
        home: /home/firewall-apply
        shell: /usr/local/libexec/home-lab/proxmox-firewall-transport
        create_home: true
        password_lock: true
        groups: []
        ssh_directory:
          kind: runtime-protected-directory
          projectable: false
          materialization: metadata-only
          path: /home/firewall-apply/.ssh
          owner: firewall-apply
          group: firewall-apply
          mode: "0700"
        authorized_keys:
          file:
            kind: runtime-protected-file
            projectable: false
            materialization: metadata-only
            path: /home/firewall-apply/.ssh/authorized_keys
            owner: firewall-apply
            group: firewall-apply
            mode: "0600"
          secret_ref: PROXMOX_FIREWALL_SSH_PUBLIC_KEYS
          forced_command: 'restrict,command="/usr/local/libexec/home-lab/proxmox-firewall-transport"'
        sudo:
          state: present
          file:
            kind: managed-file
            projectable: true
            path: /etc/sudoers.d/firewall-apply
            owner: root
            group: root
            mode: "0440"
          rule: "firewall-apply ALL=(root) NOPASSWD: /usr/local/libexec/home-lab/proxmox-firewall-transaction inspect, /usr/local/libexec/home-lab/proxmox-firewall-transaction begin, /usr/local/libexec/home-lab/proxmox-firewall-transaction status, /usr/local/libexec/home-lab/proxmox-firewall-transaction commit, /usr/local/libexec/home-lab/proxmox-firewall-transaction rollback"
    human_accounts:
      - name: proxmox
        comment: Home Lab Proxmox Administrator
        group: proxmox
        home: /home/proxmox
        shell: /bin/bash
        password_lock: true
        supplementary_groups: []
        ssh_directory:
          kind: runtime-protected-directory
          projectable: false
          materialization: metadata-only
          path: /home/proxmox/.ssh
          owner: proxmox
          group: proxmox
          mode: "0700"
        authorized_keys:
          state: absent
          files:
            - kind: runtime-protected-file
              projectable: false
              materialization: metadata-only
              path: /home/proxmox/.ssh/authorized_keys
              owner: proxmox
              group: proxmox
              mode: "0600"
            - kind: runtime-protected-file
              projectable: false
              materialization: metadata-only
              path: /home/proxmox/.ssh/authorized_keys2
              owner: proxmox
              group: proxmox
              mode: "0600"
        sudo:
          state: present
          file:
            kind: managed-file
            projectable: true
            path: /etc/sudoers.d/proxmox
            owner: root
            group: root
            mode: "0440"
          rule: "proxmox ALL=(root) NOPASSWD: ALL"
    pve:
      accounts:
        - user: root@pam
          token_name: tofu-plan
          token_escrow:
            directory:
              kind: runtime-protected-directory
              projectable: false
              materialization: metadata-only
              path: /root/.config/home-lab
              owner: root
              group: root
              mode: "0700"
            file:
              kind: runtime-protected-file
              projectable: false
              materialization: metadata-only
              path: /root/.config/home-lab/proxmox-plan-token.env
              owner: root
              group: root
              mode: "0600"
          privilege_separation: true
          primary_acl_path: /
          role: HomeLabTofuPlan
          privileges:
            - Datastore.Audit
            - Mapping.Audit
            - SDN.Audit
            - Sys.Audit
            - VM.Audit
          additional_acls:
            - path: /vms/100
              role: HomeLabTofuPlanDiskInspect
        - user: root@pam
          token_name: tofu-apply
          token_escrow:
            directory:
              kind: runtime-protected-directory
              projectable: false
              materialization: metadata-only
              path: /root/.config/home-lab
              owner: root
              group: root
              mode: "0700"
            file:
              kind: runtime-protected-file
              projectable: false
              materialization: metadata-only
              path: /root/.config/home-lab/proxmox-apply-token.env
              owner: root
              group: root
              mode: "0600"
          privilege_separation: true
          primary_acl_path: /
          role: HomeLabTofuApply
          privileges:
            - Datastore.Allocate
            - Datastore.AllocateSpace
            - Datastore.AllocateTemplate
            - Datastore.Audit
            - Mapping.Audit
            - Mapping.Modify
            - Mapping.Use
            - SDN.Audit
            - SDN.Use
            - Sys.Audit
            - Sys.Modify
            - VM.Allocate
            - VM.Audit
            - VM.Config.CDROM
            - VM.Config.CPU
            - VM.Config.Cloudinit
            - VM.Config.Disk
            - VM.Config.HWType
            - VM.Config.Memory
            - VM.Config.Network
            - VM.Config.Options
            - VM.Migrate
            - VM.PowerMgmt
          additional_acls: []
      additional_roles:
        - role: HomeLabTofuPlanDiskInspect
          privileges:
            - VM.Config.Disk
            - VM.Audit
  ssh:
    service: ssh.service
    host_key_sentinel:
      kind: runtime-protected-file
      projectable: false
      materialization: metadata-only
      path: /etc/ssh/ssh_host_ed25519_key
      owner: root
      group: root
      mode: "0600"
    config_file:
      kind: managed-file
      projectable: true
      path: /etc/ssh/sshd_config.d/60-home-lab.conf
      owner: root
      group: root
      mode: "0644"
    pubkey_authentication: true
    password_authentication: false
    kbd_interactive_authentication: false
    permit_root_login: prohibit-password
    allow_users:
      - root
      - tofu-plan
      - tofu-apply
      - firewall-apply
  tailscale:
    package: tailscale
    service: tailscaled.service
    service_enabled: true
    service_state: started
    enrollment_timeout_seconds: 30
    enrollment_ssh: false
    hostname: proxmox
    advertise_tag: tag:proxmox
    advertise_routes: []
    accept_dns: false
    accept_routes: false
    netfilter_mode: "on"
    ssh: true
    auth_key_secret_ref: TAILSCALE_AUTH_KEY
  health:
    local_api_url: https://127.0.0.1:8006/api2/json/version
    local_api_validate_certs: false
    local_api_status_codes:
      - 200
      - 401
    tailscale_backend_state: Running
    require_vm: true
    vm_status: running
  planning_policy:
    max_observation_age_seconds: 1800
    service_policies:
      - { name: chrony.service, safety_class: guarded, automatic: true, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { name: nfs-server.service, safety_class: data-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { name: ssh.service, safety_class: access-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: true }
      - { name: tailscaled.service, safety_class: access-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: true }
    managed_file_policies:
      - { path: /etc/apt/sources.list, safety_class: guarded, automatic: true, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { path: /etc/apt/sources.list.d/debian-security.sources, safety_class: guarded, automatic: true, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { path: /etc/apt/sources.list.d/debian.sources, safety_class: guarded, automatic: true, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { path: /etc/apt/sources.list.d/pve-no-subscription.sources, safety_class: guarded, automatic: true, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { path: /etc/apt/sources.list.d/tailscale.sources, safety_class: guarded, automatic: true, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { path: /etc/home-lab/vfio-recovery.json, safety_class: protected-session, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { path: /etc/exports.d/home-lab.exports, safety_class: data-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { path: /etc/modprobe.d/zfs.conf, safety_class: reboot-bound, automatic: true, requires_approval: true, requires_reboot: true, requires_watchdog: false }
      - { path: /etc/modules-load.d/home-lab-vfio.conf, safety_class: reboot-bound, automatic: true, requires_approval: true, requires_reboot: true, requires_watchdog: false }
      - { path: /etc/network/interfaces, safety_class: access-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: true }
      - { path: /etc/ssh/sshd_config.d/60-home-lab.conf, safety_class: access-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: true }
      - { path: /etc/sudoers.d/firewall-apply, safety_class: access-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: true }
      - { path: /etc/sudoers.d/proxmox, safety_class: access-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: true }
      - { path: /etc/sudoers.d/tofu-apply, safety_class: access-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: true }
      - { path: /etc/sudoers.d/tofu-plan, safety_class: access-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: true }
      - { path: /usr/local/sbin/home-lab-vfio-recover, safety_class: protected-session, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: false }
    domains:
      - { domain: managed-files, safety_class: guarded, automatic: true, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { domain: managed-fragments, safety_class: reboot-bound, automatic: true, requires_approval: true, requires_reboot: true, requires_watchdog: false }
      - { domain: managed-artifacts, safety_class: guarded, automatic: true, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { domain: packages, safety_class: protected-session, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { domain: services, safety_class: guarded, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { domain: accounts, safety_class: access-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: true }
      - { domain: tailscale, safety_class: access-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: true }
      - { domain: pve-access, safety_class: access-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: false }
      - { domain: pve-firewall, safety_class: access-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: true }
      - { domain: pve-storage, safety_class: data-critical, automatic: false, requires_approval: true, requires_reboot: false, requires_watchdog: false }
  firewall:
    kind: api-owned
    ownership: pve-api
    activation: pve-api
    projectable: false
    compatibility_config_path: /etc/pve/firewall/cluster.fw
    options:
      enable: true
      policy_in: DROP
      policy_out: ACCEPT
    rules:
      - direction: IN
        action: ACCEPT
        source: 192.168.0.0/24
        protocol: tcp
        destination_port: 22
        log: nolog
      - direction: IN
        action: ACCEPT
        source: 192.168.0.0/24
        protocol: tcp
        destination_port: 8006
        log: nolog
      - direction: IN
        action: ACCEPT
        source: 192.168.0.100/32
        protocol: tcp
        destination_port: 2049
        log: nolog
      - direction: IN
        action: ACCEPT
        source: 0.0.0.0/0
        protocol: udp
        destination_port: 41641
        log: nolog
      - direction: IN
        action: ACCEPT
        source: 100.64.0.0/10
        protocol: tcp
        destination_port: 22
        log: nolog
      - direction: IN
        action: ACCEPT
        source: 100.64.0.0/10
        protocol: tcp
        destination_port: 8006
        log: nolog
  packages:
    architecture: amd64
    direct:
      - name: chrony
        version: 4.6.1-3+deb13u2
      - name: curl
        version: 8.14.1-2+deb13u4
      - name: git
        version: 1:2.47.3-0+deb13u1
      - name: ifupdown2
        version: 3.3.0-1+pmx12
      - name: jq
        version: 1.7.1-6+deb13u2
      - name: nfs-kernel-server
        version: 1:2.8.3-1
      - name: nvme-cli
        version: 2.13-2
      - name: openssh-server
        version: 1:10.0p1-7+deb13u4
