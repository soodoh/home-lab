---
# Direct Tailscale endpoint for the protected local controller.
# Planning and deployment use separately constrained credentials and host identities.
all:
  children:
    docker_host:
      hosts:
        docker-host-production:
          ansible_host: docker-host
          ansible_user: ansible-deploy
          ansible_python_interpreter: /usr/bin/python3
          # The controller reaches this host through the authenticated tailnet path
          # and keeps normal Ansible host-key verification enabled.
          ansible_ssh_common_args: >-
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
          # Debian production retains the dedicated controller account outside the Docker
          # group and its separately validated passwordless sudo policy.
          ansible_become: true
          ansible_become_method: sudo
