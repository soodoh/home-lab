---
# Native ownership of unit configuration on the existing server, not backup bootstrap.
restic_systemd_existing_host: true
restic_proton_uid: 60000
restic_proton_gid: 60000
restic_systemd:
  runner_path: /usr/local/libexec/home-lab/restic-backup
  lock_path: /run/lock/home-lab-backup.lock
  journal_path: /var/lib/home-lab-restic/interruption.json
  accepted_path: /var/lib/home-lab-restic/replication/accepted.json
  games_mountpoint: /mnt/games
  games_repository_path: /mnt/games/restic/home-lab
  nfs_mountpoint: /mnt/storage
  daily_calendar: "*-*-* 05:00:00"
  maintenance_calendar: monthly

# Existing-host pins: upgrades require coordinated installed runtime-policy changes.
# Keep the Proton-qualified beta; these are not independent Renovate updates.
restic_tools_existing_host: true
restic_version: "0.19.1"
restic_download_url: "https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2"
restic_archive_sha256: "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c"
restic_binary_sha256: "20d4142678d0d95ec11a4759def1b73fd9190abc9ca19e4b62d067c0b387e639"
restic_version_output: "restic 0.19.1 compiled with go1.26.4 on linux/amd64"
rclone_version: "1.76.0-beta.10267.220fe7619"
rclone_download_url: "https://beta.rclone.org/v1.76.0-beta.10267.220fe7619/rclone-v1.76.0-beta.10267.220fe7619-linux-amd64.zip"
rclone_archive_sha256: "8d836165cfc92b273f8735dc91e4158c55267dfa69f9e35ed838805802a89dec"
rclone_binary_sha256: "acd2c7aca2996c884a8cd0012b27d74213bc7d02c514d9711166b5023e51ca49"
rclone_version_output: "rclone v1.76.0-beta.10267.220fe7619"

# Native Compose adoption. This is deliberately independent of the legacy
# docker_host group variables and global contract.
compose_native_project_name: docker-compose
compose_native_controller_root: "{{ playbook_dir }}/../.."
compose_native_home: /home/docker
compose_native_deployment_root: /srv/docker-compose
compose_native_current_dir: /srv/docker-compose/current
compose_native_staging_root: /srv/docker-compose/staging
compose_native_runtime_env_path: /etc/docker-compose/production.env
compose_native_staged_env_root: /etc/docker-compose/staging
compose_native_artifact_identity_path: /var/lib/docker-compose/current-artifact.sha256
compose_native_apply_lock_path: /var/lib/iac-ansible-production.lock
compose_native_backup_lock_path: /run/lock/home-lab-backup.lock
compose_native_reconciliation_lock_paths:
  - /var/lib/home-lab/reconciliation/apply.lock
  - /var/lib/home-lab/reconciliation/operation.lock
compose_native_expected_service_count: 38
compose_native_required_healthy_containers:
  - gluetun
  - seerr
compose_native_wait_timeout: 600
compose_native_sops_path: /usr/local/bin/sops
compose_native_sops_sha256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
compose_native_age_path: /usr/local/bin/age
compose_native_age_sha256: 2e305637f2a0555305e21c17fb74446acbb39b53135d43d4b744e50c287133a5
compose_native_age_identity_path: /etc/sops/age/keys.txt
compose_native_secret_files:
  - /etc/docker-compose/credentials/nextcloud-mysql-password
  - /etc/docker-compose/credentials/nextcloud-mariadb-root-password
compose_native_mounts:
  - path: /mnt/games
    source: ""
    fstype: ext4
    uuid: 31602ce7-0054-498a-9f24-f51ca491e7b3
  - path: /srv/home-lab-state
    source: ""
    fstype: ext4
    uuid: d4a19647-7879-4079-9fc9-b3e79711b449
  - path: /mnt/storage
    source: 192.168.0.123:/storage/docker
    fstype: nfs4
    uuid: ""
compose_native_backup_paths:
  - path: /usr/local/libexec/home-lab/restic-backup
    mode: "0755"
  - path: /etc/home-lab/restic-policy.json
    mode: "0440"
  - path: /etc/home-lab/restic/files-from
    mode: "0440"
  - path: /etc/home-lab/restic/excludes
    mode: "0440"
compose_native_backup_writer_units:
  - home-lab-restic-daily-local.service
  - home-lab-restic-daily-proton.service
  - home-lab-restic-maintenance-local.service
  - home-lab-restic-maintenance-proton.service
