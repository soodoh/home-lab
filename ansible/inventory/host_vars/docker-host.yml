---
# Native ownership of unit configuration on the existing server, not backup bootstrap.
restic_systemd_existing_host: true
restic_proton_uid: 60000
restic_proton_gid: 60000
restic_systemd:
  runner_path: /usr/local/libexec/home-lab/restic-backup
  lock_path: /run/lock/home-lab-backup.lock
  journal_path: /var/lib/home-lab-restic/interruption.json
  accepted_path: /var/lib/home-lab-restic/replication/accepted.json
  games_mountpoint: /mnt/games
  games_repository_path: /mnt/games/restic/home-lab
  nfs_mountpoint: /mnt/storage
  daily_calendar: "*-*-* 05:00:00"
  maintenance_calendar: monthly

# Existing-host pins: upgrades require coordinated installed runtime-policy changes.
# Keep the Proton-qualified beta; these are not independent Renovate updates.
restic_tools_existing_host: true
