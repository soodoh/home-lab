---
# Native OpenSSH over fixed Omada-reserved LAN addresses. Tailscale is personal access only.
all:
  children:
    home_lab:
      vars:
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_become: true
        ansible_become_method: sudo
        ansible_ssh_common_args: >-
          -F /dev/null
          -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UpdateHostKeys=no
          -o GlobalKnownHostsFile=/dev/null
          -o UserKnownHostsFile=~/.ssh/known_hosts
          -o IdentityAgent=${SSH_AUTH_SOCK}
          -o IdentityFile={{ inventory_dir }}/keys/bitwarden-controller.pub
          -o IdentitiesOnly=yes
          -o PreferredAuthentications=publickey
          -o PubkeyAuthentication=yes
          -o PasswordAuthentication=no
          -o KbdInteractiveAuthentication=no
          -o GSSAPIAuthentication=no
          -o ClearAllForwardings=yes
          -o PermitLocalCommand=no
          -o ConnectTimeout=10
          -o ServerAliveInterval=15
          -o ServerAliveCountMax=2
      hosts:
        docker-host:
          ansible_host: 192.168.0.100
          ansible_user: ansible-deploy
          ansible_ssh_extra_args: -o HostKeyAlias=docker-host
          update_policy_manage_apt: true
        proxmox:
          ansible_host: 192.168.0.123
          ansible_user: ansible-deploy
          ansible_ssh_extra_args: -o HostKeyAlias=proxmox
