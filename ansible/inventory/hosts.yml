---
# SSH through the authenticated Tailscale network; native host credentials stay disabled.
all:
  children:
    home_lab:
      vars:
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_become: true
        ansible_become_method: sudo
        ansible_ssh_common_args: >-
          -F /dev/null
          -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UpdateHostKeys=no
          -o GlobalKnownHostsFile=/dev/null
          -o UserKnownHostsFile=~/.ssh/known_hosts
          -o IdentityAgent=none
          -o IdentityFile=none
          -o IdentitiesOnly=yes
          -o PreferredAuthentications=none
          -o PubkeyAuthentication=no
          -o PasswordAuthentication=no
          -o KbdInteractiveAuthentication=no
          -o GSSAPIAuthentication=no
          -o ClearAllForwardings=yes
          -o PermitLocalCommand=no
          -o ConnectTimeout=10
          -o ServerAliveInterval=15
          -o ServerAliveCountMax=2
      hosts:
        docker-host:
          ansible_host: docker-host.mora-rattlesnake.ts.net
          ansible_user: ansible-deploy
          ansible_ssh_extra_args: -o HostKeyAlias=docker-host
          update_policy_manage_apt: true
        proxmox:
          ansible_host: proxmox.mora-rattlesnake.ts.net
          ansible_user: ansible-deploy
          ansible_ssh_extra_args: -o HostKeyAlias=proxmox
