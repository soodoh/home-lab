---
# Exercises the real native file merge seam with synthetic secrets only.
- name: Test selective Shelfmark settings convergence
  hosts: "{{ shelfmark_test_host | default('localhost') }}"
  gather_facts: false
  vars:
    shelfmark_production_secrets:
      PROWLARR_API_KEY: synthetic-prowlarr-key-long-enough
      HARDCOVER_API_KEY: 'hc_pat_synthetic"quotes"$dollar\backslash'
    shelfmark_client_secrets:
      qbittorrent_username: synthetic
      qbittorrent_password: |
        synthetic "quotes" $dollar \backslash
        next line
      sabnzbd_api_key: synthetic-sabnzbd-key-long-enough-32
    shelfmark_fixture:
      downloads:
        BOOKS_OUTPUT_MODE: browser
        DESTINATION: /stale/inbox
        DESTINATION_AUDIOBOOK: /stale/audio
        FILE_ORGANIZATION: rename_and_group
        FILE_ORGANIZATION_AUDIOBOOK: rename
        HARDLINK_TORRENTS: true
        HARDLINK_TORRENTS_AUDIOBOOK: true
        MAX_CONCURRENT_DOWNLOADS: 7
        TEMPLATE_AUDIOBOOK_RENAME: '{Author} - {Title}'
      hardcover:
        HARDCOVER_API_KEY: stale
        HARDCOVER_ENABLED: false
        HARDCOVER_DEFAULT_SORT: newest
        HARDCOVER_AUTO_REMOVE_ON_DOWNLOAD: false
        _connected_user_id: '42'
        _connected_username: preserve-user
      prowlarr_config:
        PROWLARR_API_KEY: stale
        PROWLARR_INDEXERS: [3, 7]
        PROWLARR_ENABLED: true
      prowlarr_clients:
        QBITTORRENT_PASSWORD: stale
        QBITTORRENT_API_KEY: stale-priority-key
        QBITTORRENT_CATEGORY: stale-category
        QBITTORRENT_CATEGORY_AUDIOBOOK: stale-audio-category
        PROWLARR_TORRENT_ACTION: remove
        PROWLARR_USENET_ACTION: keep
  tasks:
    - name: Allocate synthetic settings under the task workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: shelfmark-settings-test.
        path: "{{ shelfmark_fixture_parent | default(lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp', true)) }}"
      register: shelfmark_fixture_root

    - name: Inspect the fixture identity
      ansible.builtin.stat:
        path: "{{ shelfmark_fixture_root.path }}"
        get_checksum: false
      register: shelfmark_fixture_metadata

    - name: Bind the real merge seam to the synthetic fixture
      ansible.builtin.set_fact:
        shelfmark_config_root: "{{ shelfmark_fixture_root.path }}"
        shelfmark_uid: "{{ shelfmark_fixture_metadata.stat.uid }}"
        shelfmark_gid: "{{ shelfmark_fixture_metadata.stat.gid }}"

    - name: Exercise selective changes preservation idempotency and refusals
      block:
        - name: Create the native plugin directory
          ansible.builtin.file:
            path: "{{ shelfmark_config_root }}/plugins"
            state: directory
            mode: '0755'

        - name: Write synthetic existing settings in native startup permissions
          ansible.builtin.copy:
            dest: "{{ shelfmark_config_root }}/plugins/{{ item.key }}.json"
            content: "{{ item.value | to_json }}"
            mode: '0644'
          loop: "{{ shelfmark_fixture | dict2items }}"

        - name: Exercise the production credential validation and binding seam
          ansible.builtin.import_role:
            name: shelfmark
            tasks_from: bind-settings

        - name: Require the production token binding
          ansible.builtin.assert:
            that:
              - shelfmark_settings.hardcover.HARDCOVER_API_KEY == shelfmark_production_secrets.HARDCOVER_API_KEY
              - shelfmark_settings.hardcover.keys() | list == ['HARDCOVER_API_KEY']

        - name: Exercise the production read and merge seam
          ansible.builtin.import_role:
            name: shelfmark
            tasks_from: read-settings

        - name: Require a credential and permission change
          ansible.builtin.assert:
            that: shelfmark_settings_changed

        - name: Exercise the production concurrent-writer guard
          ansible.builtin.import_role:
            name: shelfmark
            tasks_from: guard-settings

        - name: Exercise the production atomic write and full readback seam
          ansible.builtin.import_role:
            name: shelfmark
            tasks_from: write-settings

        - name: Require exact synthetic credentials and unrelated settings preservation
          ansible.builtin.assert:
            that:
              - shelfmark_settings_written.changed
              - shelfmark_settings_merged.hardcover.HARDCOVER_API_KEY == shelfmark_production_secrets.HARDCOVER_API_KEY
              - shelfmark_settings_merged.hardcover == shelfmark_fixture.hardcover | combine(shelfmark_settings.hardcover)
              - shelfmark_settings_merged.prowlarr_clients.QBITTORRENT_PASSWORD == shelfmark_settings.prowlarr_clients.QBITTORRENT_PASSWORD
              - shelfmark_settings_merged.prowlarr_clients.QBITTORRENT_API_KEY == ''
              - shelfmark_settings_merged.prowlarr_clients.QBITTORRENT_CATEGORY == 'shelfmark'
              - shelfmark_settings_merged.prowlarr_clients.QBITTORRENT_CATEGORY_AUDIOBOOK == 'shelfmark-audiobooks'
              - shelfmark_settings_merged.downloads == shelfmark_fixture.downloads | combine(shelfmark_settings.downloads)
              - shelfmark_settings_merged.downloads.DESTINATION == '/grimmory-bookdrop'
              - shelfmark_settings_merged.downloads.DESTINATION_AUDIOBOOK == '/grimmory-bookdrop'
              - shelfmark_settings_merged.downloads.FILE_ORGANIZATION_AUDIOBOOK == 'none'
              - not shelfmark_settings_merged.downloads.HARDLINK_TORRENTS
              - not shelfmark_settings_merged.downloads.HARDLINK_TORRENTS_AUDIOBOOK
              - shelfmark_settings_merged.prowlarr_clients.PROWLARR_TORRENT_ACTION == 'keep'
              - shelfmark_settings_merged.prowlarr_config.PROWLARR_INDEXERS == [3, 7]

        - name: Repeat production observation after the native merge
          ansible.builtin.import_role:
            name: shelfmark
            tasks_from: read-settings

        - name: Require semantic idempotency and private credential-file permissions
          ansible.builtin.assert:
            that: not shelfmark_settings_changed

        - name: Repeat production writes
          ansible.builtin.import_role:
            name: shelfmark
            tasks_from: write-settings

        - name: Require no repeated file replacements
          ansible.builtin.assert:
            that: not shelfmark_settings_written.changed

        - name: Rotate only the synthetic Hardcover token
          ansible.builtin.set_fact:
            shelfmark_production_secrets: "{{ shelfmark_production_secrets | combine({'HARDCOVER_API_KEY': 'hc_pat_rotated-synthetic-token'}) }}"

        - name: Bind the rotated synthetic token using the production seam
          ansible.builtin.import_role:
            name: shelfmark
            tasks_from: bind-settings

        - name: Observe the token-only rotation using the production seam
          ansible.builtin.import_role:
            name: shelfmark
            tasks_from: read-settings

        - name: Require token-only drift detection
          ansible.builtin.assert:
            that:
              - shelfmark_settings_changed
              - shelfmark_settings_current.downloads == shelfmark_settings_merged.downloads
              - shelfmark_settings_current.prowlarr_config == shelfmark_settings_merged.prowlarr_config
              - shelfmark_settings_current.prowlarr_clients == shelfmark_settings_merged.prowlarr_clients

        - name: Guard the token-only rotation using the production seam
          ansible.builtin.import_role:
            name: shelfmark
            tasks_from: guard-settings

        - name: Write the rotated token using the production seam
          ansible.builtin.import_role:
            name: shelfmark
            tasks_from: write-settings

        - name: Require only the token file to change and preserve application-owned fields
          ansible.builtin.assert:
            that:
              - shelfmark_settings_written.results | selectattr('changed') | map(attribute='item') | list == ['hardcover']
              - shelfmark_settings_merged.hardcover == shelfmark_fixture.hardcover | combine(shelfmark_settings.hardcover)

        - name: Observe again after token rotation
          ansible.builtin.import_role:
            name: shelfmark
            tasks_from: read-settings

        - name: Require token rotation idempotency
          ansible.builtin.assert:
            that: not shelfmark_settings_changed

        - name: Qualify the pinned native readers with isolated synthetic settings
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - -i
              - --network=none
              - --read-only
              - --tmpfs=/tmp:rw,size=128m,mode=1777
              - --tmpfs=/grimmory-bookdrop:rw,size=4m,mode=1777
              - --tmpfs=/config:rw,size=4m,mode=1777
              - --user=1000:1000
              - --env=CONFIG_DIR=/config
              - --env=LOG_ROOT=/tmp/logs
              - --entrypoint=python
              - "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../services/servarr.yml') | from_yaml).services.shelfmark.image }}"
              - -c
              - |
                import json, os, pathlib, subprocess, sys
                from shelfmark.core.models import DownloadTask
                from unittest.mock import patch
                fixture = json.load(sys.stdin)
                expected = fixture['settings']
                root = pathlib.Path('/config/plugins')
                root.mkdir(parents=True)
                for tab, values in expected.items():
                    (root / (tab + '.json')).write_text(json.dumps(values))
                from shelfmark.core.config import config
                for values in expected.values():
                    for key, value in values.items():
                        # Connection metadata is not a registered config setting.
                        if not key.startswith('_'):
                            assert config.get(key) == value, key
                            assert not config.is_from_env(key), key
                assert json.loads((root / 'hardcover.json').read_text()) == expected['hardcover']
                from shelfmark.core.user_db import UserDB
                db = UserDB(str(root.parent / 'users.db'))
                db.initialize()
                user = db.create_user('synthetic-reader')
                db.set_user_settings(user['id'], {'SUPPORTED_AUDIOBOOK_FORMATS': ['m4b', 'mp3', 'm4a']})
                config.refresh(force=True)
                for key, value in expected['downloads'].items():
                    assert config.get(key, user_id=user['id']) == value, key
                from shelfmark.download.postprocess.destination import get_final_destination
                from shelfmark.download.postprocess.transfer import process_directory, should_hardlink
                # Exercise native torrent-copy delivery for ebooks, M4B and ordered chapters.
                for number, (kind, names) in enumerate((('book (fiction)', ['Novel.epub']),
                                                        ('audiobook', ['Single.m4b']),
                                                        ('audiobook', ['01 - Opening.mp3', '02 - Ending.mp3']))):
                    source = pathlib.Path('/tmp/seeded') / str(number)
                    source.mkdir(parents=True)
                    for name in names:
                        (source / name).write_bytes(('synthetic-' + name).encode())
                    task = DownloadTask(task_id=str(number), source='prowlarr', title='Fixture',
                                        content_type=kind, original_download_path=str(source),
                                        user_id=user['id'], username=user['username'])
                    inbox = get_final_destination(task)
                    assert str(inbox) == expected['downloads']['DESTINATION']
                    assert not should_hardlink(task)
                    outputs, error = process_directory(source, inbox, task, allow_archive_extraction=False)
                    assert error is None, error
                    assert sorted(path.name for path in outputs) == sorted(names)
                    for path in outputs:
                        original = source / path.name
                        assert path.read_bytes() == original.read_bytes()
                        assert path.stat().st_ino != original.stat().st_ino
                db.set_user_settings(user['id'], {'DESTINATION_AUDIOBOOK': '/different/inbox'})
                config.refresh(force=True)
                assert config.get('DESTINATION_AUDIOBOOK', user_id=user['id']) != expected['downloads']['DESTINATION_AUDIOBOOK']
                # Execute the production reader/override gate; mock only outbound probes.
                preamble = '''
                from unittest.mock import patch
                for target in ('shelfmark.download.clients.settings._test_qbittorrent_connection',
                               'shelfmark.download.clients.settings._test_sabnzbd_connection',
                               'shelfmark.release_sources.prowlarr.settings._test_prowlarr_connection',
                               'shelfmark.metadata_providers.hardcover._test_hardcover_connection'):
                    patch(target, return_value={'success': True}).start()
                '''
                def check_reader(persisted, succeeds, overrides=None):
                    payload = {'persisted': persisted, 'documents': expected, 'expected': fixture['managed']}
                    result = subprocess.run([sys.executable, '-c', preamble + fixture['reader']],
                                            input=json.dumps(payload), capture_output=True, text=True,
                                            env={**os.environ, **(overrides or {})})
                    assert (result.returncode == 0) == succeeds, result.stdout + result.stderr
                check_reader(True, False)  # Divergent per-user destination must refuse.
                db.set_user_settings(user['id'], {'DESTINATION_AUDIOBOOK': None})
                check_reader(True, True)
                check_reader(False, True, {'INGEST_DIR': '/stale/inbox', 'HARDLINK_TORRENTS_AUDIOBOOK': 'true'})
                check_reader(True, False, {'INGEST_DIR': expected['downloads']['DESTINATION']})
                assert db.get_user_settings(user['id']) == {'SUPPORTED_AUDIOBOOK_FORMATS': ['m4b', 'mp3', 'm4a']}
                for tab, values in expected.items():
                    assert json.loads((root / (tab + '.json')).read_text()) == values, tab
                from shelfmark.metadata_providers.hardcover import HardcoverProvider, _test_hardcover_connection
                # Qualify the native read-only API probe without external requests.
                with patch.object(HardcoverProvider, '_execute_query', return_value={'me': [{'id': 99, 'username': 'synthetic-user'}]}) as query:
                    assert _test_hardcover_connection()['success']
                    query.assert_called_once_with('query { me { id, username } }', {})
                persisted = json.loads((root / 'hardcover.json').read_text())
                assert persisted['HARDCOVER_API_KEY'] == expected['hardcover']['HARDCOVER_API_KEY']
                assert persisted['_connected_user_id'] == '99'
                assert persisted['_connected_username'] == 'synthetic-user'
                for key in ('HARDCOVER_ENABLED', 'HARDCOVER_DEFAULT_SORT', 'HARDCOVER_AUTO_REMOVE_ON_DOWNLOAD'):
                    assert persisted[key] == expected['hardcover'][key], key
                print('pinned_shelfmark_native_readers=verified')
            stdin: >-
              {{ {'settings': shelfmark_settings_merged, 'managed': shelfmark_settings,
                  'reader': (lookup('ansible.builtin.file', playbook_dir ~ '/../roles/shelfmark/tasks/verify-connections.yml')
                             | from_yaml)[0]['ansible.builtin.command']['argv'][-1]} | to_json }}
          changed_when: false
          when: shelfmark_runtime_test | default(false) | bool

        - name: Preserve valid synthetic production credentials
          ansible.builtin.set_fact:
            shelfmark_valid_production_secrets: "{{ shelfmark_production_secrets }}"

        - name: Require missing malformed and header-prefixed tokens to refuse binding
          ansible.builtin.include_tasks: tasks/shelfmark-invalid-token.yml
          loop:
            - {}
            - {HARDCOVER_API_KEY: null}
            - {HARDCOVER_API_KEY: ''}
            - {HARDCOVER_API_KEY: "hc_pat_token\nnext-line"}
            - {HARDCOVER_API_KEY: 'hc_pat_token '}
            - {HARDCOVER_API_KEY: 'Bearer hc_pat_token'}
          loop_control:
            loop_var: shelfmark_invalid_token

        - name: Restore valid synthetic production credentials
          ansible.builtin.set_fact:
            shelfmark_production_secrets: "{{ shelfmark_valid_production_secrets }}"

        - name: Simulate an unrelated concurrent Hardcover settings edit
          ansible.builtin.copy:
            dest: "{{ shelfmark_config_root }}/plugins/hardcover.json"
            content: "{{ shelfmark_settings_merged.hardcover | combine({'HARDCOVER_DEFAULT_SORT': 'rating'}) | to_json }}"
            mode: '0600'

        - name: Require concurrent settings changes to refuse convergence
          block:
            - name: Exercise the production concurrent-edit guard
              ansible.builtin.import_role:
                name: shelfmark
                tasks_from: guard-settings

            - name: Fail if the concurrent edit was admitted
              ansible.builtin.fail:
                msg: Concurrent settings changes were accepted.
          rescue:
            - name: Require the actual guard refusal
              ansible.builtin.assert:
                that: >-
                  ansible_failed_task.name in ['Refuse native settings path replacements after observation',
                    'Refuse concurrent native settings edits rather than overwriting them']

        - name: Simulate an invalid native JSON document
          ansible.builtin.copy:
            dest: "{{ shelfmark_config_root }}/plugins/prowlarr_clients.json"
            content: '[]'
            mode: '0600'

        - name: Require non-object native settings to refuse convergence
          block:
            - name: Exercise the production native-format refusal
              ansible.builtin.import_role:
                name: shelfmark
                tasks_from: read-settings

            - name: Fail if the invalid native document was admitted
              ansible.builtin.fail:
                msg: Invalid native settings were accepted.
          rescue:
            - name: Require the actual native document admission refusal
              ansible.builtin.assert:
                that: ansible_failed_task.name == 'Require native JSON objects rather than replacing unknown documents'

        - name: Remove one synthetic file before testing a symlink
          ansible.builtin.file:
            path: "{{ shelfmark_config_root }}/plugins/prowlarr_clients.json"
            state: absent

        - name: Simulate a retargeted native credential file
          ansible.builtin.file:
            path: "{{ shelfmark_config_root }}/plugins/prowlarr_clients.json"
            src: "{{ shelfmark_config_root }}/plugins/prowlarr_config.json"
            state: link

        - name: Require retargeted credential files to refuse convergence
          block:
            - name: Exercise the production symlink refusal
              ansible.builtin.import_role:
                name: shelfmark
                tasks_from: read-settings

            - name: Fail if the retargeted native document was admitted
              ansible.builtin.fail:
                msg: A retargeted credential file was accepted.
          rescue:
            - name: Require the actual path admission refusal
              ansible.builtin.assert:
                that: ansible_failed_task.name == 'Refuse unsafe or uninitialized native settings paths'
      always:
        - name: Remove only the synthetic fixture
          ansible.builtin.file:
            path: "{{ shelfmark_fixture_root.path }}"
            state: absent
