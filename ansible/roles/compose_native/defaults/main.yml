---
compose_native_controller_root: "{{ playbook_dir }}/../.."
compose_native_project_name: docker-compose
compose_native_home: /home/docker
compose_native_deployment_root: /srv/docker-compose
compose_native_current_dir: /srv/docker-compose/current
compose_native_previous_dir: /srv/docker-compose/previous
compose_native_source_archive_path: /var/lib/docker-compose/source.tar
compose_native_source_candidate_path: /var/lib/docker-compose/source-candidate.tar
compose_native_artifact_identity_path: /var/lib/docker-compose/current-artifact.sha256
compose_native_runtime_env_path: /etc/docker-compose/production.env
compose_native_apply_lock_path: /var/lib/iac-ansible-production.lock
compose_native_expected_service_count: 0
compose_native_required_healthy_containers: []
compose_native_wait_timeout: 600
compose_native_apply_confirmed: false
# Choosing routine attests release review found no persistent-data/storage migration.
compose_native_change_class: data
compose_native_apply_operation: compose-native-deploy
compose_native_sops_file: "{{ compose_native_controller_root }}/secrets/production.sops.yaml"
compose_native_authentik_sops_file: "{{ compose_native_controller_root }}/infrastructure/tofu/authentik/client-secrets.sops.json"
compose_native_authentik_desired_file: "{{ compose_native_controller_root }}/infrastructure/tofu/authentik/desired.json"
compose_native_servarr_sops_file: "{{ compose_native_controller_root }}/secrets/servarr.sops.yaml"
compose_native_cli_proxy_sops_file: "{{ compose_native_controller_root }}/secrets/cli-proxy-api.sops.yaml"
compose_native_cli_proxy_config_path: /etc/docker-compose/credentials/cli-proxy-api-config.yaml
compose_native_sops_binary: sops
compose_native_sops_age_keyfile: "{{ lookup('ansible.builtin.env', 'SOPS_AGE_KEY_FILE') }}"
compose_native_secret_files: []
compose_native_credentials: "{{ lookup('ansible.builtin.file', compose_native_controller_root ~ '/services/credentials.json') | from_json }}"
compose_native_oidc_desired: "{{ lookup('ansible.builtin.file', compose_native_authentik_desired_file) | from_json }}"
compose_native_source_paths:
  - docker-compose.yml
  - services
  - secrets/production.sops.yaml
  - secrets/download-clients.sops.yaml
  - secrets/servarr.sops.yaml
  - secrets/cli-proxy-api.sops.yaml
  - infrastructure/tofu/authentik/client-secrets.sops.json
  - infrastructure/tofu/authentik/desired.json
  - ":(exclude)services/data/restic"
compose_native_files:
  - docker-compose.yml
compose_native_runtime_cli:
  - /usr/bin/docker
  - compose
  - --project-name
  - "{{ compose_native_project_name }}"
  - --project-directory
  - "{{ compose_native_current_dir }}"
  - --env-file
  - "{{ compose_native_runtime_env_path }}"
  - --file
  - "{{ compose_native_current_dir }}/docker-compose.yml"
