---
- name: Publish managed files and refresh their changed consumers
  ansible.builtin.include_tasks: publish.yml

- name: Converge the complete Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ compose_native_current_dir }}"
    project_name: "{{ compose_native_project_name }}"
    files: "{{ compose_native_files }}"
    env_files:
      - "{{ compose_native_runtime_env_path }}"
    state: present
    pull: never
    build: never
    # Model/image changes are native; bind-file changes were handled above.
    recreate: auto
    remove_orphans: true
    renew_anon_volumes: false
    wait: true
    wait_timeout: "{{ compose_native_wait_timeout }}"
  become: true
  environment:
    HOME: "{{ compose_native_home }}"
  register: compose_native_convergence
  no_log: true

- name: Require the expected Compose service count
  ansible.builtin.assert:
    that:
      - compose_native_convergence.containers | length == compose_native_expected_service_count | int
    fail_msg: Native Compose convergence did not return the expected service count.
  no_log: true

- name: Converge Wolf application image pins without changing host firewall policy
  ansible.builtin.include_role:
    name: wolf_security
    tasks_from: images
    apply:
      become: true

- name: Sync Shelfmark consumers from the existing encrypted credential authorities
  ansible.builtin.include_role:
    name: shelfmark
  vars:
    shelfmark_controller_root: "{{ compose_native_controller_root }}"

- name: Verify the complete deployed model and required health before accepting source
  ansible.builtin.include_tasks: observe.yml

- name: Publish the converged Compose artifact identity
  ansible.builtin.copy:
    content: "{{ compose_native_source_archives.results[1].stat.checksum }}\n"
    dest: "{{ compose_native_artifact_identity_path }}"
    owner: root
    group: root
    mode: "0444"
  become: true

- name: Accept the converged source archive
  ansible.builtin.command:
    argv:
      - /usr/bin/mv
      - --force
      - --
      - "{{ compose_native_source_candidate_path }}"
      - "{{ compose_native_source_archive_path }}"
  become: true
  changed_when: compose_native_source_changed | bool

- name: Remove the superseded source after successful convergence
  ansible.builtin.file:
    path: "{{ compose_native_previous_dir }}"
    state: absent
  become: true
  when: compose_native_source_changed | bool

- name: Report native Compose convergence
  ansible.builtin.debug:
    msg:
      project: "{{ compose_native_project_name }}"
      source_changed: "{{ compose_native_source_changed }}"
      bind_mount_recreations: "{{ compose_native_recreate_services }}"
      services: "{{ compose_native_convergence.containers | length }}"
      remove_orphans: true
