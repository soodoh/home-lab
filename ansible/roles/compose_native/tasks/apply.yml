---
- name: Require explicit deployment approval before taking production ownership
  ansible.builtin.assert:
    that:
      - ansible_check_mode or compose_native_apply_confirmed | bool
    fail_msg: Apply requires reviewed source and explicit deployment approval.

# Shared deployment interface: manual controllers and the scheduled local controller
# cross the same observation, ownership, admission and convergence seam.
- name: Re-observe the active Compose state
  ansible.builtin.import_tasks: observe.yml

- name: Acquire durable production ownership
  ansible.builtin.include_role:
    name: apply_lock
  vars:
    apply_lock_action: acquire
    apply_lock_path: "{{ compose_native_apply_lock_path }}"
    apply_lock_operation: "{{ compose_native_apply_operation }}"

- name: Re-observe active Compose state under production ownership
  ansible.builtin.import_tasks: observe.yml

- name: Admit the reviewed upgrade under exact production ownership
  ansible.builtin.import_tasks: admission.yml

- name: Archive and converge committed Compose source
  ansible.builtin.import_tasks: deploy.yml

- name: Release exact ownership only after complete success
  ansible.builtin.include_role:
    name: apply_lock
  vars:
    apply_lock_action: release
    apply_lock_path: "{{ compose_native_apply_lock_path }}"
    apply_lock_operation: "{{ compose_native_apply_operation }}"
