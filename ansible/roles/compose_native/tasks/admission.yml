---
- name: Require identity from successful production ownership
  ansible.builtin.assert:
    that:
      - apply_lock_owner_sha256 | default('') is match('^[0-9a-f]{64}$')
    fail_msg: Backup admission requires identity from successful lock acquisition or explicit adoption.
  when: not ansible_check_mode

- name: Establish fresh complete local protection before strict changes
  ansible.builtin.import_role:
    name: restic_backup
    tasks_from: fresh
  vars:
    restic_backup_observation_apply_owner_sha256: "{{ apply_lock_owner_sha256 }}"
  when:
    - not ansible_check_mode
    - compose_native_change_class == 'data'
    - (compose_native_admission_result | default({})).get('owner') != apply_lock_owner_sha256
      or not (compose_native_admission_result | default({})).get('strict', false)

- name: Admit the reviewed change again under exact production ownership
  ansible.builtin.import_role:
    name: restic_backup
    tasks_from: observe
  vars:
    restic_backup_admission: "{{ 'routine' if compose_native_change_class == 'routine' else 'strict' }}"
    restic_backup_observation_apply_owner_sha256: "{{ apply_lock_owner_sha256 }}"
    restic_backup_observation_scheduled_deployment: "{{ compose_native_automated | bool and ansible_connection == 'local' }}"
  when: not ansible_check_mode

- name: Record successful admission for this acquired owner only
  ansible.builtin.set_fact:
    compose_native_admission_result:
      owner: "{{ apply_lock_owner_sha256 }}"
      strict: >-
        {{ compose_native_change_class == 'data'
           or ((compose_native_admission_result | default({})).get('owner') == apply_lock_owner_sha256
               and (compose_native_admission_result | default({})).get('strict', false)) }}
    cacheable: false
  when: not ansible_check_mode
