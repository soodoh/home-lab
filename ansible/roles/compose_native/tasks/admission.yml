---
- name: Admit the reviewed change again under exact production ownership
  ansible.builtin.import_role:
    name: restic_backup
    tasks_from: observe
  vars:
    restic_backup_admission: "{{ 'routine' if compose_native_change_class == 'routine' else 'strict' }}"
    restic_backup_observation_apply_owner_sha256: >-
      {{ ('controller=' ~ (ansible_user | default('unknown')) ~ restic_backup_owner_newline ~
          'operation=' ~ compose_native_apply_operation ~ restic_backup_owner_newline ~
          'started=' ~ ansible_facts['date_time']['iso8601'] ~ restic_backup_owner_newline) | hash('sha256') }}
    restic_backup_owner_newline: "\n"
  when: not ansible_check_mode
