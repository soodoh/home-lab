---
- name: Require the adopted Compose observation identity
  ansible.builtin.assert:
    that:
      - compose_native_project_name == 'docker-compose'
      - compose_native_current_dir == '/srv/docker-compose/current'
      - compose_native_runtime_env_path == '/etc/docker-compose/production.env'
    fail_msg: Compose observation requires the adopted production identity.

- name: Inspect active Compose paths
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
    get_mime: false
  become: true
  register: compose_native_observed_paths
  loop:
    - {path: "{{ compose_native_current_dir }}", kind: directory, mode: "0755"}
    - {path: "{{ compose_native_runtime_env_path }}", kind: file, mode: "0600"}

- name: Require protected active Compose paths
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - not (item.stat.islnk | default(false))
      - >-
        (item.item.kind == 'directory' and item.stat.isdir | default(false)) or
        (item.item.kind == 'file' and item.stat.isreg | default(false))
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode == item.item.mode
    fail_msg: An active Compose path is missing or has unsafe metadata.
  loop: "{{ compose_native_observed_paths.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  no_log: true

- name: Inspect protected Compose secret files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  become: true
  register: compose_native_observed_secret_files
  loop: "{{ compose_native_secret_files }}"
  no_log: true

- name: Require protected Compose secret files
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode == '0600'
    fail_msg: A protected Compose secret file is missing or has unsafe metadata.
  loop: "{{ compose_native_observed_secret_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: Validate the active Compose model
  ansible.builtin.command:
    argv: "{{ compose_native_runtime_cli + ['config', '--quiet'] }}"
  become: true
  environment:
    HOME: "{{ compose_native_home }}"
  changed_when: false
  check_mode: false
  no_log: true

- name: List declared Compose services
  ansible.builtin.command:
    argv: "{{ compose_native_runtime_cli + ['config', '--services'] }}"
  become: true
  environment:
    HOME: "{{ compose_native_home }}"
  register: compose_native_declared_services
  changed_when: false
  check_mode: false
  no_log: true

- name: List running Compose services
  ansible.builtin.command:
    argv: "{{ compose_native_runtime_cli + ['ps', '--status', 'running', '--services'] }}"
  become: true
  environment:
    HOME: "{{ compose_native_home }}"
  register: compose_native_running_services
  changed_when: false
  check_mode: false
  no_log: true

- name: Require the complete running Compose service set
  ansible.builtin.assert:
    that:
      - compose_native_declared_services.stdout_lines | length > 0
      - compose_native_declared_services.stdout_lines | sort == compose_native_running_services.stdout_lines | sort
    fail_msg: Declared and running Compose services differ.
  no_log: true

- name: Require digest-pinned active images
  ansible.builtin.command:
    argv: "{{ compose_native_runtime_cli + ['config', '--images'] }}"
  become: true
  environment:
    HOME: "{{ compose_native_home }}"
  register: compose_native_declared_images
  changed_when: false
  check_mode: false
  no_log: true

- name: Assert every active image is digest pinned
  ansible.builtin.assert:
    that:
      - item is match('^(?:.+@)?sha256:[0-9a-f]{64}$')
    fail_msg: The active Compose model contains a mutable image reference.
  loop: "{{ compose_native_declared_images.stdout_lines }}"
  no_log: true

- name: Check required container health
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - inspect
      - --format
      - "{% raw %}{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}{% endraw %}"
      - "{{ item }}"
  become: true
  register: compose_native_required_health
  loop: "{{ compose_native_required_healthy_containers }}"
  changed_when: false
  check_mode: false
  no_log: true

- name: Require healthy container states
  ansible.builtin.assert:
    that:
      - item.stdout == 'healthy'
    fail_msg: "Required container {{ item.item }} is not healthy."
  loop: "{{ compose_native_required_health.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: Preview native Compose convergence
  community.docker.docker_compose_v2:
    project_src: "{{ compose_native_current_dir }}"
    project_name: "{{ compose_native_project_name }}"
    files: "{{ compose_native_files }}"
    env_files:
      - "{{ compose_native_runtime_env_path }}"
    state: present
    pull: never
    build: never
    recreate: auto
    remove_orphans: true
    renew_anon_volumes: false
    wait: false
  become: true
  environment:
    HOME: "{{ compose_native_home }}"
  register: compose_native_active_preview
  check_mode: true
  no_log: true

- name: Require the active Compose model to be converged
  ansible.builtin.assert:
    that:
      - not compose_native_active_preview.changed
      - compose_native_active_preview.containers | length == compose_native_declared_services.stdout_lines | length
    fail_msg: Live Compose state differs from the active model.
  no_log: true

- name: Publish the bounded Compose observation
  ansible.builtin.debug:
    msg:
      project: "{{ compose_native_project_name }}"
      declared_services: "{{ compose_native_declared_services.stdout_lines | length }}"
      running_services: "{{ compose_native_running_services.stdout_lines | length }}"
      digest_pinned_images: "{{ compose_native_declared_images.stdout_lines | length }}"
      active_model_drift: false
