---
- name: Read encrypted credential authorities into nonpersistent facts
  ansible.builtin.set_fact:
    compose_native_production_secrets: >-
      {{ lookup('community.sops.sops', compose_native_sops_file,
         input_type='yaml', output_type='yaml', age_keyfile=compose_native_sops_age_keyfile,
         sops_binary=compose_native_sops_binary) | from_yaml }}
    compose_native_production_dotenv: >-
      {{ lookup('community.sops.sops', compose_native_sops_file,
         input_type='yaml', output_type='dotenv', age_keyfile=compose_native_sops_age_keyfile,
         sops_binary=compose_native_sops_binary, rstrip=false) }}
    compose_native_oidc_secrets: >-
      {{ lookup('community.sops.sops', compose_native_authentik_sops_file,
         input_type='json', output_type='json', age_keyfile=compose_native_sops_age_keyfile,
         sops_binary=compose_native_sops_binary) | from_json }}
    compose_native_servarr_secrets: >-
      {{ lookup('community.sops.sops', compose_native_servarr_sops_file,
         input_type='yaml', output_type='yaml', age_keyfile=compose_native_sops_age_keyfile,
         sops_binary=compose_native_sops_binary) | from_yaml }}
    compose_native_cli_proxy_secrets: >-
      {{ lookup('community.sops.sops', compose_native_cli_proxy_sops_file,
         input_type='yaml', output_type='yaml', age_keyfile=compose_native_sops_age_keyfile,
         sops_binary=compose_native_sops_binary) | from_yaml }}
    cacheable: false
  no_log: true

- name: Require a single Vaultwarden OIDC authority and declared interpolation inputs
  ansible.builtin.assert:
    that:
      - compose_native_oidc_secrets.schemaVersion == 2
      - compose_native_oidc_secrets.oauthProviders['47'].client_secret is match('^[A-Za-z0-9_-]{48,}$')
      - compose_native_oidc_desired.oauthProviders['47'].client_id is match('^[A-Za-z0-9_-]+$')
      - compose_native_production_secrets.VAULTWARDEN_SSO_CLIENT_ID is not defined
      - compose_native_production_secrets.VAULTWARDEN_SSO_CLIENT_SECRET is not defined
      - compose_native_credentials.environment_keys | difference(compose_native_production_secrets.keys() | list) | length == 0
      - compose_native_production_secrets.TRAEFIK_TAILNET_AWS_ACCESS_KEY_ID is match('^[A-Z0-9]+$')
      - compose_native_production_secrets.TRAEFIK_TAILNET_AWS_SECRET_ACCESS_KEY is match('^[A-Za-z0-9/+=]+$')
      - >-
        compose_native_production_dotenv.splitlines() |
        select('match', '^([A-Za-z_][A-Za-z0-9_]*=|[ \t]*#|[ \t]*$)') | list | length ==
        compose_native_production_dotenv.splitlines() | length
      - >-
        compose_native_production_dotenv.splitlines() |
        select('match', '^(' ~ (compose_native_credentials.environment_keys | join('|')) ~ ')=') |
        list | length == compose_native_credentials.environment_keys | length
    fail_msg: Protected sources must match the reviewed credential bindings.
  no_log: true

- name: Require compatible IPv4-only WireGuard reader inputs
  ansible.builtin.assert:
    that:
      - compose_native_production_secrets.WIREGUARD_PRIVATE_KEY is string
      - compose_native_production_secrets.WIREGUARD_PRIVATE_KEY is match('^[A-Za-z0-9+/]{43}=$')
      - compose_native_production_secrets.WIREGUARD_ADDRESSES is string
      - >-
        compose_native_production_secrets.WIREGUARD_ADDRESSES is
        match('^' ~ compose_native_ipv4_cidr_pattern ~ '(,' ~ compose_native_ipv4_cidr_pattern ~ ')*$')
    fail_msg: Import a valid WireGuard key and only IPv4 tunnel addresses supported by this deployment.
  vars:
    compose_native_ipv4_octet_pattern: '(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
    compose_native_ipv4_cidr_pattern: >-
      (?:{{ compose_native_ipv4_octet_pattern }}\.){3}{{ compose_native_ipv4_octet_pattern }}/(?:[0-9]|[12][0-9]|3[0-2])
  no_log: true

- name: Require the existing Servarr MAM bootstrap authority
  ansible.builtin.assert:
    that:
      - compose_native_production_secrets.MAM_INITIAL_ID is not defined
      - compose_native_production_secrets.MAM_ID is not defined
      - compose_native_servarr_secrets.indexers['8'].mamId is string
      - compose_native_servarr_secrets.indexers['8'].mamId is match('^[!-~]+$')
      - compose_native_servarr_secrets.indexers['8'].mamId is not search('[\r\n\x00]')
      - not compose_native_servarr_secrets.indexers['8'].mamId.startswith('mam_id=')
    fail_msg: MAM must use the single raw session ID from Servarr SOPS.
  no_log: true

- name: Bind derived file credentials without duplicating their encrypted authorities
  ansible.builtin.set_fact:
    compose_native_production_secrets: >-
      {{ compose_native_production_secrets | combine({
         'VAULTWARDEN_SSO_CLIENT_SECRET': compose_native_oidc_secrets.oauthProviders['47'].client_secret,
         'MAM_INITIAL_ID': compose_native_servarr_secrets.indexers['8'].mamId}) }}
    cacheable: false
  no_log: true

- name: Require exact single-line raw credential values
  ansible.builtin.assert:
    that:
      - compose_native_production_secrets[item.key] is string
      - compose_native_production_secrets[item.key] | length > 0
      - compose_native_production_secrets[item.key] | trim == compose_native_production_secrets[item.key]
      - compose_native_production_secrets[item.key] is not search('[\r\n\x00]')
    fail_msg: A raw credential must retain its exact value under the native file reader.
  loop: "{{ compose_native_credentials.files | selectattr('key', 'defined') | list }}"
  no_log: true

- name: Inspect existing credential files before writing
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop: "{{ compose_native_credentials.files }}"
  become: true
  register: compose_native_credential_paths
  no_log: true

- name: Refuse credential symlinks and nonregular existing files
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not (item.stat.exists | default(false)) or item.stat.isreg | default(false)
      - not (item.stat.exists | default(false)) or item.stat.nlink == 1
      - not (item.stat.exists | default(false)) or item.stat.uid == item.item.owner | int
      - not (item.stat.exists | default(false)) or item.stat.mode in [item.item.mode, '0600']
    fail_msg: Inspect an unsafe existing credential file before convergence.
  loop: "{{ compose_native_credential_paths.results }}"
  no_log: true

- name: Install exact raw credential files
  ansible.builtin.copy:
    content: "{{ compose_native_production_secrets[item.key] }}"
    dest: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ compose_native_credentials.files | selectattr('key', 'defined') | list }}"
  become: true
  register: compose_native_raw_credentials
  diff: false
  no_log: true

- name: Render native structured credential files
  ansible.builtin.template:
    src: "{{ compose_native_controller_root }}/{{ item.template }}"
    dest: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  vars:
    cli_proxy_api_secrets: "{{ compose_native_cli_proxy_secrets }}"
  loop: "{{ compose_native_credentials.files | selectattr('template', 'defined') | list }}"
  become: true
  register: compose_native_structured_credentials
  diff: false
  no_log: true

- name: Record whether native file mounts must be recreated
  ansible.builtin.set_fact:
    compose_native_credentials_changed: >-
      {{ compose_native_raw_credentials.changed or compose_native_structured_credentials.changed }}
    cacheable: false
  no_log: true

- name: Install only declared Compose interpolation values
  ansible.builtin.copy:
    content: >-
      {{ (compose_native_production_dotenv.splitlines() |
          select('match', '^(' ~ (compose_native_credentials.environment_keys | join('|')) ~ ')=') |
          list | join(compose_native_environment_newline)) ~ compose_native_environment_newline ~
          'VAULTWARDEN_SSO_CLIENT_ID=' ~ compose_native_oidc_desired.oauthProviders['47'].client_id ~
          compose_native_environment_newline }}
    dest: "{{ compose_native_runtime_env_path }}"
    owner: root
    group: root
    mode: "0600"
  vars:
    compose_native_environment_newline: "\n"
  become: true
  diff: false
  no_log: true
