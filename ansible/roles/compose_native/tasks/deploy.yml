---
- name: Validate the native Compose deployment request
  ansible.builtin.assert:
    that:
      - compose_native_expected_service_count | int > 0
      - compose_native_source_paths | length > 0
      - compose_native_change_class in ['routine', 'data']
      - compose_native_source_paths | unique | length == compose_native_source_paths | length
      - ansible_check_mode or compose_native_apply_confirmed | bool
      - ansible_check_mode or compose_native_sops_age_keyfile | length > 0
    fail_msg: Compose deployment requires explicit apply confirmation and a nonempty source set.

- name: Inspect tracked controller checkout state
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - --no-optional-locks
      - status
      - --porcelain=v1
      - --untracked-files=no
    chdir: "{{ compose_native_controller_root }}"
  delegate_to: localhost
  become: false
  register: compose_native_controller_status
  changed_when: false
  check_mode: false
  environment:
    HOME: /
    LANG: C
    LC_ALL: C
    GIT_CONFIG_GLOBAL: /dev/null
    GIT_CONFIG_NOSYSTEM: "1"
    GIT_OPTIONAL_LOCKS: "0"
    GIT_TERMINAL_PROMPT: "0"

- name: Require deployment from committed controller source
  ansible.builtin.assert:
    that:
      - compose_native_controller_status.stdout == ''
    fail_msg: Commit or discard tracked controller changes before deploying Compose.

- name: Report the check-mode boundary
  ansible.builtin.debug:
    msg: Check mode validates the active Compose model; apply archives committed Git source and converges it natively.
  when: ansible_check_mode

- name: Archive and converge committed Compose source
  when: not ansible_check_mode
  block:
    - name: Inspect the controller age identity
      ansible.builtin.stat:
        path: "{{ compose_native_sops_age_keyfile }}"
        follow: false
        get_checksum: false
        get_mime: false
      delegate_to: localhost
      become: false
      register: compose_native_controller_age_identity
      no_log: true

    - name: Require a protected controller age identity
      ansible.builtin.assert:
        that:
          - compose_native_controller_age_identity.stat.isreg | default(false)
          - not (compose_native_controller_age_identity.stat.islnk | default(false))
          - compose_native_controller_age_identity.stat.mode in ['0400', '0600']
        fail_msg: SOPS deployment requires a protected controller age identity.
      no_log: true

    - name: Create a private controller archive
      ansible.builtin.tempfile:
        state: file
        suffix: .tar
      delegate_to: localhost
      become: false
      register: compose_native_controller_archive

    - name: Archive only committed Compose source deterministically
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/git', '--no-optional-locks', 'archive', '--format=tar',
              '--mtime=2000-01-01T00:00:00Z',
              '--output=' ~ compose_native_controller_archive.path,
              'HEAD^{tree}', '--'] + compose_native_source_paths }}
        chdir: "{{ compose_native_controller_root }}"
      delegate_to: localhost
      become: false
      changed_when: false
      environment:
        HOME: /
        LANG: C
        LC_ALL: C
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        GIT_OPTIONAL_LOCKS: "0"
        GIT_TERMINAL_PROMPT: "0"

    - name: Create stable Compose directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      become: true
      loop:
        - {path: "{{ compose_native_deployment_root }}", mode: "0755"}
        - {path: /etc/docker-compose, mode: "0700"}
        - {path: /etc/docker-compose/credentials, mode: "0700"}
        - {path: /var/lib/docker-compose, mode: "0711"}

    - name: Transfer the committed source archive
      ansible.builtin.copy:
        src: "{{ compose_native_controller_archive.path }}"
        dest: "{{ compose_native_source_candidate_path }}"
        owner: root
        group: root
        mode: "0600"
      become: true
      register: compose_native_archive_transfer

    - name: Inspect active and candidate source archives
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
        get_mime: false
      become: true
      register: compose_native_source_archives
      loop:
        - "{{ compose_native_source_archive_path }}"
        - "{{ compose_native_source_candidate_path }}"

    - name: Determine whether committed Compose source changed
      ansible.builtin.set_fact:
        compose_native_source_changed: >-
          {{ not (compose_native_source_archives.results[0].stat.exists | default(false)) or
             compose_native_source_archives.results[0].stat.checksum !=
             compose_native_source_archives.results[1].stat.checksum }}

    - name: Observe managed bind mount consumers before publication
      ansible.builtin.script:
        cmd: >-
          {{ compose_native_controller_root }}/scripts/compose-mounts.py
          --project {{ compose_native_project_name }}
          --source-root {{ compose_native_current_dir }}
          --credentials-root /etc/docker-compose/credentials
        executable: /usr/bin/python3
      become: true
      changed_when: false
      register: compose_native_mounts_before
      no_log: true

    - name: Publish changed Compose source
      when: compose_native_source_changed | bool
      block:
        - name: Refuse an unresolved previous Compose source tree
          ansible.builtin.stat:
            path: "{{ compose_native_previous_dir }}"
            follow: false
            get_checksum: false
            get_mime: false
          become: true
          register: compose_native_previous_source
          failed_when: compose_native_previous_source.stat.exists | default(false)

        - name: Create an incoming Compose source directory
          ansible.builtin.tempfile:
            state: directory
            path: "{{ compose_native_deployment_root }}"
            prefix: .incoming-
          become: true
          register: compose_native_incoming_source

        - name: Set the incoming Compose source directory identity
          ansible.builtin.file:
            path: "{{ compose_native_incoming_source.path }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          become: true

        - name: Extract committed Compose source
          ansible.builtin.unarchive:
            src: "{{ compose_native_source_candidate_path }}"
            dest: "{{ compose_native_incoming_source.path }}"
            remote_src: true
            owner: root
            group: root
            # Git tar archives default to group-writable source permissions.
            # Preserve executable bits, but grant writes only to root.
            mode: u=rwX,go=rX
          become: true

        - name: Preserve the current source during convergence
          ansible.builtin.command:
            argv:
              - /usr/bin/cp
              - --archive
              - --no-target-directory
              - --
              - "{{ compose_native_current_dir }}"
              - "{{ compose_native_previous_dir }}"
          become: true
          changed_when: true

        - name: Publish source while preserving unchanged file and directory mounts
          ansible.builtin.command:
            argv:
              - /usr/bin/rsync
              - --archive
              - --checksum
              - --delete
              - --delay-updates
              - "{{ compose_native_incoming_source.path }}/"
              - "{{ compose_native_current_dir }}/"
          become: true
          changed_when: true

    - name: Provision native credential files and minimal interpolation inputs
      ansible.builtin.include_tasks: credentials.yml

    - name: Create the protected CLIProxyAPI OAuth directory
      ansible.builtin.file:
        path: /srv/home-lab-state/cli-proxy-api/auths
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    - name: Inspect the Mindwtr cloud data directory before provisioning
      ansible.builtin.stat:
        path: /srv/home-lab-state/mindwtr-data
        follow: false
        get_checksum: false
        get_mime: false
      become: true
      register: compose_native_mindwtr_data

    - name: Refuse an unsafe existing Mindwtr data directory
      ansible.builtin.assert:
        that:
          - not (compose_native_mindwtr_data.stat.islnk | default(false))
          - not (compose_native_mindwtr_data.stat.exists | default(false)) or (compose_native_mindwtr_data.stat.isdir | default(false))
          - not (compose_native_mindwtr_data.stat.exists | default(false)) or compose_native_mindwtr_data.stat.uid == 1000
          - not (compose_native_mindwtr_data.stat.exists | default(false)) or compose_native_mindwtr_data.stat.gid == 1000
          - not (compose_native_mindwtr_data.stat.exists | default(false)) or compose_native_mindwtr_data.stat.mode == '0700'
        fail_msg: An existing Mindwtr data directory must be inspected before convergence.

    - name: Create the Mindwtr cloud data directory
      ansible.builtin.file:
        path: /srv/home-lab-state/mindwtr-data
        state: directory
        owner: '1000'
        group: '1000'
        mode: '0700'
      become: true

    - name: Inspect the Traefik certificate store before provisioning
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      become: true
      register: compose_native_traefik_paths
      loop:
        - /srv/home-lab-state/traefik-data
        - /srv/home-lab-state/traefik-data/acme.json

    - name: Refuse unsafe existing Traefik certificate paths
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
          - not (item.stat.exists | default(false)) or (item.stat.isdir | default(false) if item.item == '/srv/home-lab-state/traefik-data' else item.stat.isreg | default(false))
          - not (item.stat.exists | default(false)) or item.stat.pw_name == 'root'
          - not (item.stat.exists | default(false)) or item.stat.gr_name == 'root'
          - not (item.stat.exists | default(false)) or item.stat.mode == ('0700' if item.item == '/srv/home-lab-state/traefik-data' else '0600')
        fail_msg: An existing Traefik certificate path is not protected; inspect it before convergence.
      loop: "{{ compose_native_traefik_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Create the protected Traefik certificate directory
      ansible.builtin.file:
        path: /srv/home-lab-state/traefik-data
        state: directory
        owner: root
        group: root
        mode: '0700'
      become: true

    - name: Initialize the Traefik certificate store without overwriting existing certificates
      ansible.builtin.copy:
        content: "{}\n"
        dest: /srv/home-lab-state/traefik-data/acme.json
        owner: root
        group: root
        mode: '0600'
        force: false
      become: true
      diff: false
      no_log: true

    - name: Inspect the private Traefik staging certificate paths before provisioning
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      become: true
      register: compose_native_tailnet_traefik_paths
      loop:
        - /srv/home-lab-state/traefik-tailnet-data
        - /srv/home-lab-state/traefik-tailnet-data/acme-staging.json

    - name: Refuse unsafe existing private Traefik staging paths
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
          - >-
            not (item.stat.exists | default(false)) or
            (item.stat.isdir | default(false) if item.item == '/srv/home-lab-state/traefik-tailnet-data'
             else item.stat.isreg | default(false))
          - not (item.stat.exists | default(false)) or item.stat.pw_name == 'root'
          - not (item.stat.exists | default(false)) or item.stat.gr_name == 'root'
          - >-
            not (item.stat.exists | default(false)) or
            item.stat.mode == ('0700' if item.item == '/srv/home-lab-state/traefik-tailnet-data' else '0600')
        fail_msg: An existing private Traefik staging certificate path is not protected; inspect it before convergence.
      loop: "{{ compose_native_tailnet_traefik_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Create the protected private Traefik staging certificate directory
      ansible.builtin.file:
        path: /srv/home-lab-state/traefik-tailnet-data
        state: directory
        owner: root
        group: root
        mode: '0700'
      become: true

    - name: Initialize the private Traefik staging certificate store without overwriting it
      ansible.builtin.copy:
        content: "{}\n"
        dest: /srv/home-lab-state/traefik-tailnet-data/acme-staging.json
        owner: root
        group: root
        mode: '0600'
        force: false
      become: true
      diff: false
      no_log: true

    - name: Inspect the private Traefik production certificate store before provisioning
      ansible.builtin.stat:
        path: /srv/home-lab-state/traefik-tailnet-data/acme.json
        follow: false
        get_checksum: false
        get_mime: false
      become: true
      register: compose_native_tailnet_traefik_production_store

    - name: Refuse an unsafe existing private Traefik production certificate store
      ansible.builtin.assert:
        that:
          - not (compose_native_tailnet_traefik_production_store.stat.islnk | default(false))
          - >-
            not (compose_native_tailnet_traefik_production_store.stat.exists | default(false)) or
            (compose_native_tailnet_traefik_production_store.stat.isreg | default(false))
          - >-
            not (compose_native_tailnet_traefik_production_store.stat.exists | default(false)) or
            compose_native_tailnet_traefik_production_store.stat.pw_name == 'root'
          - >-
            not (compose_native_tailnet_traefik_production_store.stat.exists | default(false)) or
            compose_native_tailnet_traefik_production_store.stat.gr_name == 'root'
          - >-
            not (compose_native_tailnet_traefik_production_store.stat.exists | default(false)) or
            compose_native_tailnet_traefik_production_store.stat.mode == '0600'
        fail_msg: An existing private Traefik production certificate store is not protected; inspect it before convergence.

    - name: Initialize the private Traefik production certificate store without overwriting it
      ansible.builtin.copy:
        content: "{}\n"
        dest: /srv/home-lab-state/traefik-tailnet-data/acme.json
        owner: root
        group: root
        mode: '0600'
        force: false
      become: true
      diff: false
      no_log: true

    - name: Validate the published Compose model
      ansible.builtin.command:
        argv: "{{ compose_native_runtime_cli + ['config', '--quiet'] }}"
      become: true
      environment:
        HOME: "{{ compose_native_home }}"
      changed_when: false
      no_log: true

    - name: List services in the published model without resolving private values
      ansible.builtin.command:
        argv: "{{ compose_native_runtime_cli + ['config', '--services'] }}"
      become: true
      environment:
        HOME: "{{ compose_native_home }}"
      register: compose_native_new_services
      changed_when: false
      no_log: true

    - name: Pull missing digest-pinned images
      community.docker.docker_compose_v2_pull:
        project_src: "{{ compose_native_current_dir }}"
        project_name: "{{ compose_native_project_name }}"
        files: "{{ compose_native_files }}"
        env_files:
          - "{{ compose_native_runtime_env_path }}"
        ignore_buildable: true
        policy: missing
      become: true
      environment:
        HOME: "{{ compose_native_home }}"
      no_log: true

    - name: Observe managed bind mount consumers after publication
      ansible.builtin.script:
        cmd: >-
          {{ compose_native_controller_root }}/scripts/compose-mounts.py
          --project {{ compose_native_project_name }}
          --source-root {{ compose_native_current_dir }}
          --credentials-root /etc/docker-compose/credentials
        executable: /usr/bin/python3
      become: true
      changed_when: false
      register: compose_native_mounts_after
      no_log: true

    - name: Initialize explicit bind mount recreation set
      ansible.builtin.set_fact:
        compose_native_recreate_services: []

    - name: Select only declared consumers of changed bind mounts
      ansible.builtin.set_fact:
        compose_native_recreate_services: "{{ compose_native_recreate_services + [item.key] }}"
      loop: "{{ (compose_native_mounts_before.stdout | from_json) | dict2items }}"
      when:
        - item.key in compose_native_new_services.stdout_lines
        - item.value != (compose_native_mounts_after.stdout | from_json)[item.key]
      no_log: true

    - name: Recreate only consumers of changed managed bind mounts
      community.docker.docker_compose_v2:
        project_src: "{{ compose_native_current_dir }}"
        project_name: "{{ compose_native_project_name }}"
        files: "{{ compose_native_files }}"
        env_files:
          - "{{ compose_native_runtime_env_path }}"
        services: "{{ compose_native_recreate_services }}"
        dependencies: false
        state: present
        pull: never
        build: never
        recreate: always
        remove_orphans: false
        renew_anon_volumes: false
        wait: true
        wait_timeout: "{{ compose_native_wait_timeout }}"
      become: true
      environment:
        HOME: "{{ compose_native_home }}"
      when: compose_native_recreate_services | length > 0
      no_log: true

    - name: Converge the complete Compose project
      community.docker.docker_compose_v2:
        project_src: "{{ compose_native_current_dir }}"
        project_name: "{{ compose_native_project_name }}"
        files: "{{ compose_native_files }}"
        env_files:
          - "{{ compose_native_runtime_env_path }}"
        state: present
        pull: never
        build: never
        # Model/image changes are native; bind-file changes were handled above.
        recreate: auto
        remove_orphans: true
        renew_anon_volumes: false
        wait: true
        wait_timeout: "{{ compose_native_wait_timeout }}"
      become: true
      environment:
        HOME: "{{ compose_native_home }}"
      register: compose_native_convergence
      no_log: true

    - name: Require the expected Compose service count
      ansible.builtin.assert:
        that:
          - compose_native_convergence.containers | length == compose_native_expected_service_count | int
        fail_msg: Native Compose convergence did not return the expected service count.
      no_log: true

    - name: Publish the converged Compose artifact identity
      ansible.builtin.copy:
        content: "{{ compose_native_source_archives.results[1].stat.checksum }}\n"
        dest: "{{ compose_native_artifact_identity_path }}"
        owner: root
        group: root
        mode: "0444"
      become: true

    - name: Accept the converged source archive
      ansible.builtin.command:
        argv:
          - /usr/bin/mv
          - --force
          - --
          - "{{ compose_native_source_candidate_path }}"
          - "{{ compose_native_source_archive_path }}"
      become: true
      changed_when: compose_native_source_changed | bool

    - name: Remove the superseded source after successful convergence
      ansible.builtin.file:
        path: "{{ compose_native_previous_dir }}"
        state: absent
      become: true
      when: compose_native_source_changed | bool

    - name: Report native Compose convergence
      ansible.builtin.debug:
        msg:
          project: "{{ compose_native_project_name }}"
          source_changed: "{{ compose_native_source_changed }}"
          bind_mount_recreations: "{{ compose_native_recreate_services }}"
          services: "{{ compose_native_convergence.containers | length }}"
          remove_orphans: true
  always:
    - name: Clear protected credential facts after convergence or failure
      ansible.builtin.set_fact:
        compose_native_production_secrets: {}
        compose_native_production_dotenv: ''
        compose_native_oidc_secrets: {}
        compose_native_cli_proxy_secrets: {}
        compose_native_raw_credentials: {}
        compose_native_structured_credentials: {}
        cacheable: false
      no_log: true

    - name: Remove the private controller archive
      ansible.builtin.file:
        path: "{{ compose_native_controller_archive.path | default('/nonexistent-compose-controller-archive') }}"
        state: absent
      delegate_to: localhost
      become: false
      when: compose_native_controller_archive.path | default('') | length > 0

    - name: Remove an unpublished incoming source directory
      ansible.builtin.file:
        path: "{{ compose_native_incoming_source.path | default('/nonexistent-compose-incoming') }}"
        state: absent
      become: true
      when: compose_native_incoming_source.path | default('') | length > 0
