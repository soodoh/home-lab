---
- name: Validate the native Compose deployment request
  ansible.builtin.assert:
    that:
      - compose_native_expected_service_count | int > 0
      - compose_native_source_paths | length > 0
      - compose_native_source_paths | unique | length == compose_native_source_paths | length
      - ansible_check_mode or compose_native_apply_confirmed | bool
      - ansible_check_mode or compose_native_sops_age_keyfile | length > 0
    fail_msg: Compose deployment requires explicit apply confirmation and a nonempty source set.

- name: Inspect tracked controller checkout state
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - --no-optional-locks
      - status
      - --porcelain=v1
      - --untracked-files=no
    chdir: "{{ compose_native_controller_root }}"
  delegate_to: localhost
  become: false
  register: compose_native_controller_status
  changed_when: false
  check_mode: false
  environment:
    HOME: /
    LANG: C
    LC_ALL: C
    GIT_CONFIG_GLOBAL: /dev/null
    GIT_CONFIG_NOSYSTEM: "1"
    GIT_OPTIONAL_LOCKS: "0"
    GIT_TERMINAL_PROMPT: "0"

- name: Require deployment from committed controller source
  ansible.builtin.assert:
    that:
      - compose_native_controller_status.stdout == ''
    fail_msg: Commit or discard tracked controller changes before deploying Compose.

- name: Report the check-mode boundary
  ansible.builtin.debug:
    msg: Check mode validates the active Compose model; apply archives committed Git source and converges it natively.
  when: ansible_check_mode

- name: Archive and converge committed Compose source
  when: not ansible_check_mode
  block:
    - name: Inspect the controller age identity
      ansible.builtin.stat:
        path: "{{ compose_native_sops_age_keyfile }}"
        follow: false
        get_checksum: false
        get_mime: false
      delegate_to: localhost
      become: false
      register: compose_native_controller_age_identity
      no_log: true

    - name: Require a protected controller age identity
      ansible.builtin.assert:
        that:
          - compose_native_controller_age_identity.stat.isreg | default(false)
          - not (compose_native_controller_age_identity.stat.islnk | default(false))
          - compose_native_controller_age_identity.stat.mode in ['0400', '0600']
        fail_msg: SOPS deployment requires a protected controller age identity.
      no_log: true

    - name: Create a private controller archive
      ansible.builtin.tempfile:
        state: file
        suffix: .tar
      delegate_to: localhost
      become: false
      register: compose_native_controller_archive

    - name: Archive only committed Compose source deterministically
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/git', '--no-optional-locks', 'archive', '--format=tar',
              '--mtime=2000-01-01T00:00:00Z',
              '--output=' ~ compose_native_controller_archive.path,
              'HEAD^{tree}', '--'] + compose_native_source_paths }}
        chdir: "{{ compose_native_controller_root }}"
      delegate_to: localhost
      become: false
      changed_when: false
      environment:
        HOME: /
        LANG: C
        LC_ALL: C
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        GIT_OPTIONAL_LOCKS: "0"
        GIT_TERMINAL_PROMPT: "0"

    - name: Create stable Compose directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      become: true
      loop:
        - {path: "{{ compose_native_deployment_root }}", mode: "0755"}
        - {path: /etc/docker-compose, mode: "0700"}
        - {path: /etc/docker-compose/credentials, mode: "0700"}
        - {path: /var/lib/docker-compose, mode: "0711"}

    - name: Transfer the committed source archive
      ansible.builtin.copy:
        src: "{{ compose_native_controller_archive.path }}"
        dest: "{{ compose_native_source_candidate_path }}"
        owner: root
        group: root
        mode: "0600"
      become: true
      register: compose_native_archive_transfer

    - name: Inspect active and candidate source archives
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
        get_mime: false
      become: true
      register: compose_native_source_archives
      loop:
        - "{{ compose_native_source_archive_path }}"
        - "{{ compose_native_source_candidate_path }}"

    - name: Determine whether committed Compose source changed
      ansible.builtin.set_fact:
        compose_native_source_changed: >-
          {{ not (compose_native_source_archives.results[0].stat.exists | default(false)) or
             compose_native_source_archives.results[0].stat.checksum !=
             compose_native_source_archives.results[1].stat.checksum }}

    - name: Publish changed Compose source
      when: compose_native_source_changed | bool
      block:
        - name: Refuse an unresolved previous Compose source tree
          ansible.builtin.stat:
            path: "{{ compose_native_previous_dir }}"
            follow: false
            get_checksum: false
            get_mime: false
          become: true
          register: compose_native_previous_source
          failed_when: compose_native_previous_source.stat.exists | default(false)

        - name: Create an incoming Compose source directory
          ansible.builtin.tempfile:
            state: directory
            path: "{{ compose_native_deployment_root }}"
            prefix: .incoming-
          become: true
          register: compose_native_incoming_source

        - name: Set the incoming Compose source directory identity
          ansible.builtin.file:
            path: "{{ compose_native_incoming_source.path }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          become: true

        - name: Extract committed Compose source
          ansible.builtin.unarchive:
            src: "{{ compose_native_source_candidate_path }}"
            dest: "{{ compose_native_incoming_source.path }}"
            remote_src: true
            owner: root
            group: root
          become: true

        - name: Preserve the current source during convergence
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --no-target-directory
              - --
              - "{{ compose_native_current_dir }}"
              - "{{ compose_native_previous_dir }}"
          become: true
          changed_when: true

        - name: Publish the incoming source tree
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --no-target-directory
              - --
              - "{{ compose_native_incoming_source.path }}"
              - "{{ compose_native_current_dir }}"
          become: true
          changed_when: true

    - name: Install the protected production environment through community.sops
      ansible.builtin.copy:
        content: >-
          {{ lookup('community.sops.sops', compose_native_sops_file,
             input_type='yaml', output_type='dotenv',
             age_keyfile=compose_native_sops_age_keyfile,
             sops_binary=compose_native_sops_binary, rstrip=false) }}
        dest: "{{ compose_native_runtime_env_path }}"
        owner: root
        group: root
        mode: "0600"
      become: true
      diff: false
      no_log: true

    - name: Create the protected CLIProxyAPI OAuth directory
      ansible.builtin.file:
        path: /srv/home-lab-state/cli-proxy-api/auths
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    - name: Install the protected CLIProxyAPI configuration
      ansible.builtin.template:
        src: "{{ compose_native_controller_root }}/services/data/cli-proxy-api/config.yaml.j2"
        dest: "{{ compose_native_cli_proxy_config_path }}"
        owner: root
        group: root
        mode: "0600"
      vars:
        cli_proxy_api_secrets: >-
          {{ lookup('community.sops.sops', compose_native_cli_proxy_sops_file,
             input_type='yaml', output_type='yaml',
             age_keyfile=compose_native_sops_age_keyfile,
             sops_binary=compose_native_sops_binary) | from_yaml }}
      become: true
      diff: false
      no_log: true

    - name: Validate the published Compose model
      ansible.builtin.command:
        argv: "{{ compose_native_runtime_cli + ['config', '--quiet'] }}"
      become: true
      environment:
        HOME: "{{ compose_native_home }}"
      changed_when: false
      no_log: true

    - name: Pull missing digest-pinned images
      community.docker.docker_compose_v2_pull:
        project_src: "{{ compose_native_current_dir }}"
        project_name: "{{ compose_native_project_name }}"
        files: "{{ compose_native_files }}"
        env_files:
          - "{{ compose_native_runtime_env_path }}"
        ignore_buildable: true
        policy: missing
      become: true
      environment:
        HOME: "{{ compose_native_home }}"
      no_log: true

    - name: Converge the complete Compose project
      community.docker.docker_compose_v2:
        project_src: "{{ compose_native_current_dir }}"
        project_name: "{{ compose_native_project_name }}"
        files: "{{ compose_native_files }}"
        env_files:
          - "{{ compose_native_runtime_env_path }}"
        state: present
        pull: never
        build: never
        recreate: "{{ 'always' if compose_native_source_changed | bool else 'auto' }}"
        remove_orphans: true
        renew_anon_volumes: false
        wait: true
        wait_timeout: "{{ compose_native_wait_timeout }}"
      become: true
      environment:
        HOME: "{{ compose_native_home }}"
      register: compose_native_convergence
      no_log: true

    - name: Require the expected Compose service count
      ansible.builtin.assert:
        that:
          - compose_native_convergence.containers | length == compose_native_expected_service_count | int
        fail_msg: Native Compose convergence did not return the expected service count.
      no_log: true

    - name: Publish the converged Compose artifact identity
      ansible.builtin.copy:
        content: "{{ compose_native_source_archives.results[1].stat.checksum }}\n"
        dest: "{{ compose_native_artifact_identity_path }}"
        owner: root
        group: root
        mode: "0444"
      become: true

    - name: Accept the converged source archive
      ansible.builtin.command:
        argv:
          - /usr/bin/mv
          - --force
          - --
          - "{{ compose_native_source_candidate_path }}"
          - "{{ compose_native_source_archive_path }}"
      become: true
      changed_when: compose_native_source_changed | bool

    - name: Remove the superseded source after successful convergence
      ansible.builtin.file:
        path: "{{ compose_native_previous_dir }}"
        state: absent
      become: true
      when: compose_native_source_changed | bool

    - name: Report native Compose convergence
      ansible.builtin.debug:
        msg:
          project: "{{ compose_native_project_name }}"
          source_changed: "{{ compose_native_source_changed }}"
          services: "{{ compose_native_convergence.containers | length }}"
          remove_orphans: true
  always:
    - name: Remove the private controller archive
      ansible.builtin.file:
        path: "{{ compose_native_controller_archive.path | default('/nonexistent-compose-controller-archive') }}"
        state: absent
      delegate_to: localhost
      become: false
      when: compose_native_controller_archive.path | default('') | length > 0

    - name: Remove an unpublished incoming source directory
      ansible.builtin.file:
        path: "{{ compose_native_incoming_source.path | default('/nonexistent-compose-incoming') }}"
        state: absent
      become: true
      when: compose_native_incoming_source.path | default('') | length > 0
