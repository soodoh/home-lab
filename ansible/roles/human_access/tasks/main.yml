---
- name: Require at least one human-access account
  ansible.builtin.assert:
    that:
      - human_access_accounts | length > 0
    fail_msg: "The human-access role requires at least one declared account."

- name: Validate the human-access account contract
  ansible.builtin.assert:
    that:
      - item.name | length > 0
      - item.group | length > 0
      - item.home is match('^/home/[a-z_][a-z0-9_-]*$')
      - item.shell.startswith('/')
      - (item.sudo.file.path | default(item.sudoers_path)) is match('^/etc/sudoers\.d/[a-z_][a-z0-9_-]*$')
      - "(item.sudo.rule | default(item.sudo_rule | default(item.name ~ ' ALL=(root) NOPASSWD: ALL'))) | length > 0"
    fail_msg: "Every human-access account requires a name, primary group, /home path, shell, and sudoers path."
  loop: "{{ human_access_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Inspect the required sudoers validator before convergence
  ansible.builtin.stat:
    path: "{{ human_access_visudo_executable }}"
    checksum_algorithm: sha256
    follow: false
  register: human_access_visudo
  check_mode: false

- name: Require the exact protected sudoers validator before convergence
  ansible.builtin.assert:
    that:
      - human_access_visudo.stat.isreg | default(false)
      - not (human_access_visudo.stat.islnk | default(false))
      - human_access_visudo.stat.pw_name == 'root'
      - human_access_visudo.stat.gr_name == 'root'
      - human_access_visudo.stat.mode == '0755'
    fail_msg: Refusing human-access convergence without the exact protected visudo executable.

- name: Inspect human-access accounts before convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - passwd
      - "{{ item.name }}"
  register: human_access_account_inspection
  failed_when: false
  changed_when: false
  check_mode: false
  loop: "{{ human_access_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Record existing human-access accounts
  ansible.builtin.set_fact:
    human_access_existing_accounts: >-
      {{ human_access_account_inspection.results |
         selectattr('rc', 'equalto', 0) |
         map(attribute='item.name') |
         list }}

- name: Inspect human-access password locks before convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/passwd
      - --status
      - "{{ item.name }}"
  register: human_access_password_inspection
  failed_when: false
  changed_when: false
  check_mode: false
  become: true
  loop: "{{ human_access_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Inspect human-access primary groups before convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - --group
      - --name
      - "{{ item.name }}"
  register: human_access_primary_group_inspection
  failed_when: false
  changed_when: false
  check_mode: false
  loop: "{{ human_access_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Inspect human-access group sets before convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - --name
      - --groups
      - "{{ item.name }}"
  register: human_access_groups_inspection
  failed_when: false
  changed_when: false
  check_mode: false
  loop: "{{ human_access_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Keep human-access primary groups present
  ansible.builtin.group:
    name: "{{ item.group }}"
    state: present
  become: true
  loop: "{{ human_access_accounts }}"
  loop_control:
    label: "{{ item.group }}"

- name: Create or safely adopt human-access accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment }}"
    group: "{{ item.group }}"
    groups: "{{ item.supplementary_groups | default([]) | join(',') }}"
    append: false
    home: "{{ item.home }}"
    shell: "{{ item.shell }}"
    create_home: true
    move_home: true
    password_lock: "{{ item.password_lock | default(true) }}"
    state: present
  become: true
  loop: "{{ human_access_accounts }}"
  loop_control:
    index_var: account_index
    label: "{{ item.name }}"
  when: >-
    item.name not in human_access_existing_accounts or
    human_access_account_inspection.results[account_index].stdout.split(':')[4] != item.comment or
    human_access_account_inspection.results[account_index].stdout.split(':')[5] != item.home or
    human_access_account_inspection.results[account_index].stdout.split(':')[6] != item.shell or
    human_access_password_inspection.results[account_index].stdout.split() | length < 2 or
    human_access_password_inspection.results[account_index].stdout.split()[1] != 'L' or
    human_access_primary_group_inspection.results[account_index].stdout != item.group or
    (human_access_groups_inspection.results[account_index].stdout.split() | sort) !=
      (([item.group] + (item.supplementary_groups | default([]))) | sort)

- name: Remove contract-declared conventional OpenSSH authorized-key files for human accounts
  ansible.builtin.file:
    path: "{{ item.1.path }}"
    state: absent
  become: true
  loop: "{{ query('ansible.builtin.subelements', human_access_accounts, 'authorized_keys.files', {'skip_missing': true}) }}"
  loop_control:
    label: "{{ item.0.name }}:{{ item.1.path }}"
  when:
    - item.0.authorized_keys.state == 'absent'
    - not ansible_check_mode or item.0.name in human_access_existing_accounts

- name: Preserve legacy Arch authorized-key removal behavior
  ansible.builtin.file:
    path: "{{ item.0.home }}/.ssh/{{ item.1 }}"
    state: absent
  become: true
  loop: "{{ human_access_accounts | selectattr('authorized_keys', 'undefined') | product(['authorized_keys', 'authorized_keys2']) | list }}"
  loop_control:
    label: "{{ item.0.name }}:{{ item.1 }}"
  when:
    - item.0.remove_authorized_keys | default(true)
    - not ansible_check_mode or item.0.name in human_access_existing_accounts

- name: Install validated passwordless sudo policies for human accounts
  ansible.builtin.copy:
    content: "{{ item.sudo.rule | default(item.sudo_rule | default(item.name ~ ' ALL=(root) NOPASSWD: ALL')) }}\n"
    dest: "{{ item.sudo.file.path | default(item.sudoers_path) }}"
    owner: "{{ item.sudo.file.owner | default('root') }}"
    group: "{{ item.sudo.file.group | default('root') }}"
    mode: "{{ item.sudo.file.mode | default('0440') }}"
    backup: false
    validate: "{{ human_access_visudo_executable }} {{ human_access_visudo_arguments | join(' ') }}"
  become: true
  loop: "{{ human_access_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Inspect converged human-access identities
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - passwd
      - "{{ item.name }}"
  register: human_access_identity_result
  changed_when: false
  check_mode: false
  loop: "{{ human_access_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Inspect converged human-access password locks
  ansible.builtin.command:
    argv:
      - /usr/bin/passwd
      - --status
      - "{{ item.name }}"
  register: human_access_password_result
  changed_when: false
  check_mode: false
  become: true
  loop: "{{ human_access_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Inspect converged human-access supplementary groups
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - --name
      - --groups
      - "{{ item.name }}"
  register: human_access_groups_result
  changed_when: false
  check_mode: false
  loop: "{{ human_access_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Verify passwordless sudo from human-access accounts
  ansible.builtin.command:
    argv:
      - /usr/bin/sudo
      - --non-interactive
      - --user
      - "{{ item.name }}"
      - --
      - /usr/bin/sudo
      - --non-interactive
      - --
      - /usr/bin/true
  changed_when: false
  check_mode: false
  become: true
  loop: "{{ human_access_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Assert human-access account convergence
  ansible.builtin.assert:
    that:
      - human_access_identity_result.results[account_index].stdout.split(':')[0] == item.name
      - human_access_identity_result.results[account_index].stdout.split(':')[5] == item.home
      - human_access_identity_result.results[account_index].stdout.split(':')[6] == item.shell
      - human_access_password_result.results[account_index].stdout.split()[1] == 'L'
      - >-
        (human_access_groups_result.results[account_index].stdout.split() | sort) ==
        (([item.group] + (item.supplementary_groups | default([]))) | sort)
    fail_msg: "The human-access identity, password lock, home, shell, or group boundary differs from the declared state."
  loop: "{{ human_access_accounts }}"
  loop_control:
    index_var: account_index
    label: "{{ item.name }}"
  when: not ansible_check_mode
