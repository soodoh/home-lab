---
- name: Create fixed Proxmox firewall transaction directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /usr/local/libexec/home-lab, mode: "0755" }
    - { path: /usr/local/share/home-lab, mode: "0755" }
    - { path: /var/lib/home-lab/firewall-transaction, mode: "0700" }
    - { path: /etc/systemd/system/pve-firewall.service.d, mode: "0755" }
    - { path: /etc/systemd/system/proxmox-firewall.service.d, mode: "0755" }

- name: Install the fixed pvesh-only firewall transaction helper
  ansible.builtin.copy:
    src: proxmox-firewall-transaction.py
    dest: /usr/local/libexec/home-lab/proxmox-firewall-transaction
    owner: root
    group: root
    mode: "0755"
    validate: /usr/bin/python3 -m py_compile %s

- name: Install the fixed firewall-only forced-command transport
  ansible.builtin.copy:
    src: proxmox-firewall-transport
    dest: /usr/local/libexec/home-lab/proxmox-firewall-transport
    owner: root
    group: root
    mode: "0755"

- name: Install the fixed boot firewall recovery loop
  ansible.builtin.copy:
    src: proxmox-firewall-boot-recovery
    dest: /usr/local/libexec/home-lab/proxmox-firewall-boot-recovery
    owner: root
    group: root
    mode: "0755"

- name: Install the canonical API-owned firewall policy
  ansible.builtin.template:
    src: proxmox-firewall-policy.json.j2
    dest: /usr/local/share/home-lab/proxmox-firewall-policy.json
    owner: root
    group: root
    mode: "0644"

- name: Inspect the host firewall attestation key
  ansible.builtin.stat:
    path: /var/lib/home-lab/firewall-transaction/attestation.key
    get_checksum: false
  register: proxmox_firewall_attestation_key

- name: Create the host firewall attestation key once
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - rand
      - -out
      - /var/lib/home-lab/firewall-transaction/attestation.key
      - "32"
  changed_when: true
  when:
    - not ansible_check_mode
    - not (proxmox_firewall_attestation_key.stat.exists | default(false))
  no_log: true

- name: Enforce firewall attestation key metadata
  ansible.builtin.file:
    path: /var/lib/home-lab/firewall-transaction/attestation.key
    state: file
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode or (proxmox_firewall_attestation_key.stat.exists | default(false))
  no_log: true

- name: Install fixed Proxmox firewall systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - home-lab-proxmox-firewall-rollback.service
    - home-lab-proxmox-firewall-rollback.timer
    - home-lab-proxmox-firewall-config-recovery.service
    - home-lab-proxmox-firewall-post-recovery.service
    - home-lab-proxmox-firewall-backend-stop.service
  register: proxmox_firewall_units

- name: Install fixed firewall backend recovery dependencies
  ansible.builtin.copy:
    src: 50-home-lab-firewall-recovery.conf
    dest: "/etc/systemd/system/{{ item }}/50-home-lab-firewall-recovery.conf"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pve-firewall.service.d
    - proxmox-firewall.service.d
  register: proxmox_firewall_dropins

- name: Reload systemd after firewall asset changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - proxmox_firewall_units.changed or proxmox_firewall_dropins.changed

- name: Enable boot firewall recovery units without activation
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - home-lab-proxmox-firewall-config-recovery.service
    - home-lab-proxmox-firewall-post-recovery.service
    - home-lab-proxmox-firewall-rollback.timer
  when: not ansible_check_mode

- name: Keep the persistent firewall rollback watchdog continuously active
  ansible.builtin.systemd_service:
    name: home-lab-proxmox-firewall-rollback.timer
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Audit the fixed firewall transaction state without activation
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/home-lab/proxmox-firewall-transaction
      - status
  register: proxmox_firewall_transaction_status
  changed_when: false
  check_mode: false
  when: proxmox_firewall_attestation_key.stat.exists | default(false)

- name: Require a closed firewall transaction status
  ansible.builtin.assert:
    that:
      - >-
        (proxmox_firewall_transaction_status.stdout | from_json).status in ['idle', 'committed', 'rolled-back']
  when: proxmox_firewall_attestation_key.stat.exists | default(false)
