---
- name: Read and normalize the native Proxmox firewall state
  ansible.builtin.command:
    argv: [/usr/bin/python3, -I, -B, -]
    stdin: |
      import json
      import os
      import re
      import subprocess

      ENV = {"LANG": "C.UTF-8", "LC_ALL": "C.UTF-8", "PATH": "/usr/sbin:/usr/bin:/sbin:/bin"}
      HEX40 = re.compile(r"^[0-9a-f]{40}$")

      def run(argv, accepted=(0,)):
          result = subprocess.run(argv, stdin=subprocess.DEVNULL, capture_output=True, env=ENV, timeout=30)
          if result.returncode not in accepted:
              raise RuntimeError("native firewall command failed")
          return result

      policy = json.loads(os.environ["HOME_LAB_FIREWALL_POLICY"])
      options_result = run(["/usr/bin/pvesh", "get", "/cluster/firewall/options", "--output-format", "json"], (0, 255))
      if options_result.returncode == 255:
          expected = (
              b"unknown schema type (not an object?)\n"
              b"Compilation failed in require at /usr/bin/pvesh line 6.\n"
              b"BEGIN failed--compilation aborted at /usr/bin/pvesh line 6.\n"
          )
          if options_result.stderr != expected:
              raise RuntimeError("native firewall option response differs")
          options_result = run([
              "/usr/bin/perl", "-MPVE::Firewall", "-MJSON", "-e",
              "my $c=PVE::Firewall::load_clusterfw_conf(); print encode_json(PVE::Firewall::copy_opject_with_digest($c->{options}));",
          ])
      elif options_result.stderr:
          raise RuntimeError("native firewall option response differs")
      options = json.loads(options_result.stdout)
      rules_result = run(["/usr/bin/pvesh", "get", "/cluster/firewall/rules", "--output-format", "json"])
      if rules_result.stderr:
          raise RuntimeError("native firewall rule response differs")
      rules = json.loads(rules_result.stdout)

      def enabled(value, default=False):
          if value is None:
              return default
          if value in (True, 1, "1"):
              return True
          if value in (False, 0, "0"):
              return False
          raise RuntimeError("native firewall boolean differs")

      def normalize_rule(value):
          allowed = {
              "action", "comment", "dest", "digest", "direction", "destination_port", "dport",
              "enable", "iface", "ipversion", "log", "macro", "pos", "proto", "protocol", "source", "type",
          }
          if not isinstance(value, dict) or not set(value).issubset(allowed):
              raise RuntimeError("native firewall rule shape differs")
          if not enabled(value.get("enable"), True):
              raise RuntimeError("disabled native firewall rule differs")
          direction = value.get("type", value.get("direction"))
          action = value.get("action")
          protocol = value.get("proto", value.get("protocol"))
          port = int(value.get("dport", value.get("destination_port")))
          if isinstance(direction, str):
              direction = direction.upper()
          if isinstance(action, str):
              action = action.upper()
          if isinstance(protocol, str):
              protocol = protocol.lower()
          if direction != "IN" or action != "ACCEPT" or protocol not in {"tcp", "udp"} or not 1 <= port <= 65535:
              raise RuntimeError("native firewall rule value differs")
          if value.get("log", "nolog") != "nolog" or value.get("ipversion") not in (None, 0, "0", 4, "4"):
              raise RuntimeError("native firewall rule option differs")
          if any(value.get(name) not in (None, "") for name in ("comment", "iface", "macro", "dest")):
              raise RuntimeError("native firewall rule scope differs")
          if "digest" in value and (not isinstance(value["digest"], str) or HEX40.fullmatch(value["digest"]) is None):
              raise RuntimeError("native firewall digest differs")
          source = value.get("source")
          if not isinstance(source, str) or not source:
              raise RuntimeError("native firewall source differs")
          return {
              "action": "ACCEPT", "destination_port": port, "direction": "IN",
              "log": "nolog", "protocol": protocol, "source": source,
          }

      observed_options = {
          "enable": enabled(options.get("enable"), False),
          "policy_in": options.get("policy_in", "ACCEPT"),
          "policy_out": options.get("policy_out", "ACCEPT"),
      }
      normalized = [normalize_rule(rule) for rule in rules]
      canonical = lambda value: json.dumps(value, sort_keys=True, separators=(",", ":"))
      if observed_options != policy["options"] or sorted(map(canonical, normalized)) != sorted(map(canonical, policy["rules"])):
          raise RuntimeError("native firewall policy differs")
      for service in ("pve-firewall.service", "proxmox-firewall.service"):
          result = run(["/usr/bin/systemctl", "is-active", service])
          if result.stderr or result.stdout.strip() != b"active":
              raise RuntimeError("native firewall backend differs")
      status = run(["/usr/sbin/pve-firewall", "status"])
      if status.stderr or status.stdout.strip() != b"Status: enabled/running":
          raise RuntimeError("native firewall activation differs")
      print(json.dumps({"backend": "active", "policy": "matches"}, sort_keys=True, separators=(",", ":")))
    stdin_add_newline: false
  environment:
    HOME_LAB_FIREWALL_POLICY: >-
      {{ lookup('ansible.builtin.file', role_path ~ '/../../../infrastructure/proxmox-firewall/host/proxmox-firewall-policy.json') }}
    http_proxy: ''
    https_proxy: ''
    all_proxy: ''
    HTTP_PROXY: ''
    HTTPS_PROXY: ''
    ALL_PROXY: ''
  register: proxmox_observe_firewall
  changed_when: false
  check_mode: false
  no_log: true
  timeout: 120

- name: Require the reviewed native firewall policy and active backends
  ansible.builtin.assert:
    that:
      - proxmox_observe_firewall.rc == 0
      - proxmox_observe_firewall.stderr == ''
      - (proxmox_observe_firewall.stdout | from_json) == {'backend':'active', 'policy':'matches'}
    fail_msg: Native Proxmox firewall state differs; no repair was attempted.
  no_log: true
