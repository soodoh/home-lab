---
- name: Verify adopted fstab entries without managing them
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - --fixed-strings
      - --line-regexp
      - --
      - "{{ item }}"
      - /etc/fstab
  loop: "{{ audit_expected_fstab_entries }}"
  loop_control:
    label: "{{ item.split()[1] }}"
  changed_when: false
  check_mode: false

- name: Inspect adopted mount source, filesystem type, and stable UUID
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --noheadings
      - --output
      - SOURCE,FSTYPE,UUID
      - --target
      - "{{ item.path }}"
  register: storage_mount_results
  loop: "{{ audit_expected_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: false
  check_mode: false

- name: Assert adopted mounts remain available and unchanged
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout.split() | length >= 2
      - item.stdout.split()[1] == item.item.fstype
      - >-
        (
          item.item.filesystem_uuid is defined and
          item.stdout.split() | length == 3 and
          item.stdout.split()[2] == item.item.filesystem_uuid
        ) or (
          item.item.filesystem_uuid is not defined and
          item.stdout.split()[0] == item.item.source
        )
    fail_msg: "Required mount {{ item.item.path }} differs or is unavailable; refusing convergence."
  loop: "{{ storage_mount_results.results }}"
  loop_control:
    label: "{{ item.item.path }}"
