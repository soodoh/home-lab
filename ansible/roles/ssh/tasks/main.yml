---
- name: Inspect the SSH host-key sentinel before generation
  ansible.builtin.stat:
    path: "{{ ssh_host_key_sentinel_path }}"
    follow: false
    get_checksum: false
  register: ssh_host_key_sentinel_before
  changed_when: false
  check_mode: false

- name: Ensure host SSH keys exist
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh-keygen
      - -A
  args:
    creates: "{{ ssh_host_key_sentinel_path }}"

- name: Keep the SSH host-key sentinel metadata protected
  ansible.builtin.file:
    path: "{{ ssh_host_key_sentinel_path }}"
    state: file
    owner: "{{ ssh_host_key_sentinel_owner }}"
    group: "{{ ssh_host_key_sentinel_group }}"
    mode: "{{ ssh_host_key_sentinel_mode }}"
  when:
    - not ansible_check_mode or (ssh_host_key_sentinel_before.stat.exists | default(false))

- name: Require proven key and Tailscale access before disabling passwords
  ansible.builtin.assert:
    that:
      - ssh_access_proven | bool
    fail_msg: "Password authentication may be disabled only after key and Tailscale access are proven."
  when: not (ssh_password_authentication | bool)

- name: Converge managed OpenSSH policy
  ansible.builtin.copy:
    dest: "{{ ssh_config_path }}"
    owner: "{{ ssh_config_owner }}"
    group: "{{ ssh_config_group }}"
    mode: "{{ ssh_config_mode }}"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      PubkeyAuthentication {{ ssh_pubkey_authentication | ternary('yes', 'no') }}
      PasswordAuthentication {{ ssh_password_authentication | ternary('yes', 'no') }}
      KbdInteractiveAuthentication {{ ssh_kbd_interactive_authentication | ternary('yes', 'no') }}
      PermitRootLogin {{ ssh_permit_root_login }}
      {% if ssh_allow_users | length > 0 %}
      AllowUsers {{ ssh_allow_users | join(' ') }}
      {% endif %}
  notify: Reload SSH
