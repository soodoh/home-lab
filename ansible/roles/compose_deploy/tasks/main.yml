---
- name: Validate the Compose deployment contract
  ansible.builtin.assert:
    that:
      - compose_artifact_hash is match('^[0-9a-f]{64}$')
      - ansible_check_mode or (compose_deploy_confirmed | default(false) | ansible.builtin.bool)
    fail_msg: >-
      Compose deployment requires the exact staged artifact hash and compose_deploy_confirmed=true
      outside check mode.

- name: Inspect candidate and active deployment inputs
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  become: true
  register: compose_deploy_paths
  loop:
    - "{{ compose_staging_root }}/{{ compose_artifact_hash }}"
    - "{{ compose_staged_env_path }}"
    - "{{ compose_current_dir }}"
    - "{{ compose_runtime_env_path }}"
    - "{{ compose_staged_inventory_path }}"
    - "{{ compose_runtime_inventory_path }}"
    - "{{ compose_image_override_path }}"

- name: Require complete root-owned candidate and active inputs
  ansible.builtin.assert:
    that:
      - compose_deploy_paths.results[0].stat.isdir | default(false)
      - compose_deploy_paths.results[1].stat.isreg | default(false)
      - compose_deploy_paths.results[1].stat.pw_name == 'root'
      - compose_deploy_paths.results[1].stat.mode == '0600'
      - >-
        (compose_deploy_paths.results[2].stat.isdir | default(false)) or
        ((compose_deploy_paths.results[2].stat.islnk | default(false)) and
         compose_deploy_paths.results[2].stat.lnk_source == compose_legacy_current_target)
      - compose_deploy_paths.results[3].stat.isreg | default(false)
      - compose_deploy_paths.results[3].stat.pw_name == 'root'
      - compose_deploy_paths.results[3].stat.mode == '0600'
      - compose_deploy_paths.results[4].stat.isreg | default(false)
      - compose_deploy_paths.results[5].stat.isreg | default(false)
      - compose_deploy_paths.results[6].stat.isreg | default(false)
      - compose_deploy_paths.results[6].stat.pw_name == 'root'
      - compose_deploy_paths.results[6].stat.mode == '0644'
    fail_msg: "Candidate staging, active deployment, environment, or inventory input is missing."

- name: Recheck protected Nextcloud database secret files before deployment
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter }}"
      - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/scripts/materialize-compose-secret-files.py"
      - --dotenv
      - "{{ compose_staged_env_path }}"
      - --directory
      - "{{ nextcloud.secrets.application_password.destination | dirname }}"
      - --secret
      - "{{ nextcloud.secrets.application_password.source_secret_ref }}={{ nextcloud.secrets.application_password.destination | basename }}"
      - --secret
      - "{{ nextcloud.secrets.root_password.source_secret_ref }}={{ nextcloud.secrets.root_password.destination | basename }}"
      - --check
  become: true
  changed_when: false
  no_log: true
- name: Recompute candidate and current artifact identities
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter }}"
      - "{{ item.root }}/scripts/compose-artifact.py"
      - --root
      - "{{ item.root }}"
      - --no-git
      - hash
  become: true
  register: compose_deploy_artifact_hashes
  changed_when: false
  check_mode: false
  loop:
    - root: "{{ compose_staging_root }}/{{ compose_artifact_hash }}"
    - root: "{{ compose_current_dir }}"


- name: Require exact candidate and active artifact identities
  ansible.builtin.assert:
    that:
      - compose_deploy_artifact_hashes.results[0].stdout == compose_artifact_hash
    fail_msg: "Candidate artifact identity differs from the reviewed state."
  no_log: true

- name: Remove stale root-only deployment plan files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  changed_when: false
  check_mode: false
  no_log: true
  loop:
    - /run/docker-compose-deploy-actions.json
    - /run/docker-compose-deploy-plan.json
    - /run/docker-compose-deploy-post.json

- name: Produce the root-only candidate action plan
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/../../../scripts/compose-action-plan.py
      --project-name {{ compose_project_name }}
      --project-directory {{ compose_staging_root }}/{{ compose_artifact_hash }}
      --env-file {{ compose_staged_env_path }}
      --compose-file {{ compose_staging_root }}/{{ compose_artifact_hash }}/docker-compose.yml
      --override-file {{ compose_image_override_path }}
      --bind-root-override {{ compose_current_dir }}
      --output /run/docker-compose-deploy-actions.json
    executable: "{{ ansible_python_interpreter }}"
  become: true
  environment:
    HOME: "{{ compose_home_dir }}"
  changed_when: false
  check_mode: false
  no_log: true

- name: Produce the root-only combined deployment plan
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/../../../scripts/compose-deployment-diff.py
      --desired {{ compose_staged_inventory_path }}
      --runtime {{ compose_runtime_inventory_path }}
      --actions /run/docker-compose-deploy-actions.json
      --candidate-root {{ compose_staging_root }}/{{ compose_artifact_hash }}
      --current-root {{ compose_current_dir }}
      --candidate-hash {{ compose_artifact_hash }}
      --deployed-hash {{ compose_deploy_artifact_hashes.results[1].stdout }}
      --canary-service {{ compose_canary_service }}
      --canary-path {{ compose_canary_path }}
      --output /run/docker-compose-deploy-plan.json
    executable: "{{ ansible_python_interpreter }}"
  become: true
  changed_when: false
  check_mode: false
  no_log: true

- name: Read the root-only combined deployment plan
  ansible.builtin.slurp:
    src: /run/docker-compose-deploy-plan.json
  become: true
  register: compose_deploy_plan_file
  changed_when: false
  check_mode: false
  no_log: true

- name: Parse the secret-free deployment plan
  ansible.builtin.set_fact:
    compose_deploy_plan: "{{ compose_deploy_plan_file.content | b64decode | from_json }}"
  no_log: true

- name: Identify the exact reviewed Nextcloud migration deployment lane
  ansible.builtin.set_fact:
    compose_deploy_nextcloud_migration: >-
      {{
        (compose_deploy_nextcloud_migration_confirmation | default('')) ==
          'deploy-reviewed-nextcloud-five-mount-migration' and
        compose_deploy_plan.missing_runtime_services == [nextcloud.cron_service] and
        compose_deploy_plan.unexpected_runtime_services | length == 0 and
        compose_deploy_plan.forbidden_actions | length == 1 and
        compose_deploy_plan.forbidden_actions[0].service == nextcloud.cron_service and
        compose_deploy_plan.forbidden_actions[0].action in ['Create', 'Creating', 'Created'] and
        compose_deploy_plan.manual_only_paths == ['services/data/Caddyfile']
      }}
  no_log: true

- name: Identify the exact reviewed Restic policy artifact lane
  ansible.builtin.set_fact:
    compose_deploy_restic_policy_artifact: >-
      {{
        backups.restic.migration_state == 'active' and
        backups.legacy_offen.retirement.state == 'retired' and
        (compose_deploy_restic_policy_confirmation | default('')) ==
          'deploy-reviewed-restic-policy:' ~ compose_artifact_hash and
        compose_deploy_plan.missing_runtime_services | length == 0 and
        compose_deploy_plan.unexpected_runtime_services | length == 0 and
        compose_deploy_plan.forbidden_actions | length == 0 and
        compose_deploy_plan.manual_only_paths == [
          'services/data/restic/excludes',
          'services/data/restic/files-from'
        ]
      }}
  no_log: true

- name: Identify the exact reviewed unused-service retirement lane
  ansible.builtin.set_fact:
    compose_deploy_unused_service_retirement: >-
      {{
        (compose_deploy_unused_service_retirement_confirmation | default('')) ==
          'retire-unused-services:' ~ compose_artifact_hash and
        compose_deploy_plan.missing_runtime_services | length == 0 and
        compose_deploy_plan.unexpected_runtime_services == ['audiobookshelf', 'pihole'] and
        compose_deploy_plan.forbidden_actions | length == 0 and
        compose_deploy_plan.changed_paths == [
          'secrets/production.env.keys',
          'secrets/production.env.layout.json',
          'secrets/production.sops.env',
          'services/apps.yml',
          'services/data/Caddyfile',
          'services/data/restic/excludes',
          'services/data/restic/files-from',
          'services/infra.yml'
        ] and
        compose_deploy_plan.manual_only_paths == [
          'services/data/Caddyfile',
          'services/data/restic/excludes',
          'services/data/restic/files-from'
        ] and
        compose_deploy_plan.recreate_services == [] and
        compose_deploy_plan.image_services == [] and
        compose_deploy_plan.stateful_recreate_services == []
      }}
  no_log: true

- name: Identify an interrupted Calibre local rollback retry
  ansible.builtin.set_fact:
    compose_deploy_calibre_local_rollback_resume: >-
      {{
        compose_deploy_plan.changed_paths == [] and
        compose_deploy_artifact_hashes.results[1].stdout == compose_artifact_hash and
        compose_deploy_plan.recreate_services == [
          'bookshelf',
          'calibre',
          'calibre-web-automated'
        ] and
        compose_deploy_plan.image_services == [] and
        compose_deploy_plan.stateful_recreate_services == []
      }}
  no_log: true

- name: Restrict Compose deployment resume to the exact interrupted Calibre transaction
  ansible.builtin.assert:
    that:
      - not (compose_deploy_resume | default(false) | bool) or compose_deploy_calibre_local_rollback_resume
    fail_msg: "Compose deployment resume is valid only for the exact interrupted Calibre rollback state."
  no_log: true

- name: Identify the exact reviewed Calibre local rollback lane
  ansible.builtin.set_fact:
    compose_deploy_calibre_local_rollback: >-
      {{
        (compose_deploy_calibre_local_rollback_confirmation | default('')) ==
          'rollback-calibre-to-local:' ~ compose_artifact_hash and
        (
          (compose_deploy_restic_policy_artifact and
           compose_deploy_plan.changed_paths == [
             'services/apps.yml',
             'services/data/restic/excludes',
             'services/data/restic/files-from',
             'services/servarr.yml'
           ]) or
          compose_deploy_calibre_local_rollback_resume
        ) and
        compose_deploy_plan.recreate_services == [
          'bookshelf',
          'calibre',
          'calibre-web-automated'
        ] and
        compose_deploy_plan.image_services == [] and
        compose_deploy_plan.stateful_recreate_services == []
      }}
  no_log: true

- name: Require exact Calibre rollback authorization for the local mount transition
  ansible.builtin.assert:
    that:
      - >-
        compose_deploy_calibre_local_rollback or (
          compose_deploy_plan.changed_paths != [
            'services/apps.yml',
            'services/data/restic/excludes',
            'services/data/restic/files-from',
            'services/servarr.yml'
          ] and
          not compose_deploy_calibre_local_rollback_resume
        )
    fail_msg: "The Calibre local mount transition requires exact artifact-bound rollback authorization."
  no_log: true

- name: Remove root-only deployment plan files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  changed_when: false
  check_mode: false
  no_log: true
  loop:
    - /run/docker-compose-deploy-actions.json
    - /run/docker-compose-deploy-plan.json

- name: Select changes permitted by the requested deployment lane
  ansible.builtin.set_fact:
    compose_deploy_effective_changes: >-
      {{
        (compose_deploy_plan.has_changes or compose_deploy_plan.recreate_services | length > 0) and
        (
          ((compose_deploy_artifact_only | default(false) | ansible.builtin.bool) and
           compose_deploy_plan.artifact_only_eligible) or
          (not (compose_deploy_artifact_only | default(false) | ansible.builtin.bool) and
           (not (compose_deploy_canary_only | default(false) | ansible.builtin.bool) or
            compose_deploy_plan.canary_eligible))
        )
      }}

- name: Display only the secret-free deployment plan
  ansible.builtin.debug:
    var: compose_deploy_plan

- name: Report the deterministic secret-free deployment plan identity
  ansible.builtin.debug:
    msg: >-
      compose_deploy_plan_sha256={{ (compose_deploy_plan | to_json) | hash('sha256') }}

- name: Require a deployment with no unreviewed service-set or data-file changes
  ansible.builtin.assert:
    that:
      - >-
        (
          compose_deploy_plan.missing_runtime_services | length == 0 and
          compose_deploy_plan.unexpected_runtime_services | length == 0 and
          compose_deploy_plan.forbidden_actions | length == 0 and
          compose_deploy_plan.manual_only_paths | length == 0
        ) or compose_deploy_nextcloud_migration or compose_deploy_restic_policy_artifact or
        compose_deploy_unused_service_retirement
    fail_msg: >-
      Deployment refuses service additions/removals, forbidden Compose actions, and data-file changes
      without their exact operation-specific approval.

- name: Report the check-mode deployment boundary
  ansible.builtin.debug:
    msg:
      candidate_hash: "{{ compose_artifact_hash }}"
      recreate_services: "{{ compose_deploy_plan.recreate_services }}"
      image_services: "{{ compose_deploy_plan.image_services }}"
      stateful_recreate_services: "{{ compose_deploy_plan.stateful_recreate_services }}"
  changed_when: compose_deploy_effective_changes
  when: ansible_check_mode

- name: Deploy the exact staged Compose artifact
  when:
    - not ansible_check_mode
    - compose_deploy_effective_changes
  block:
    - name: Capture the active image set for rollback before pulls
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/scripts/compose-image-lock.py"
          - capture
          - --project
          - "{{ compose_project_name }}"
          - --output
          - /run/docker-compose-previous-images.json
      become: true
      changed_when: true
      no_log: true
    - name: Reuse the prefetched changed-service images without refreshing tags
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/docker', 'compose', '--project-name', compose_project_name,
              '--project-directory', compose_staging_root ~ '/' ~ compose_artifact_hash,
              '--env-file', compose_staged_env_path,
              '--file', compose_staging_root ~ '/' ~ compose_artifact_hash ~ '/docker-compose.yml',
              'pull', '--policy', 'missing', '--ignore-buildable'] + compose_deploy_plan.image_services }}
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      no_log: true
      when: compose_deploy_plan.image_services | length > 0
      changed_when: true

    - name: Create an incoming current artifact directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ compose_deployment_root }}"
        prefix: .deploy-
      become: true
      register: compose_deploy_incoming

    - name: Copy the immutable candidate into the incoming current directory
      ansible.builtin.copy:
        src: "{{ compose_staging_root }}/{{ compose_artifact_hash }}/"
        dest: "{{ compose_deploy_incoming.path }}/"
        remote_src: true
        owner: root
        group: root
        mode: preserve
        directory_mode: "0755"
      become: true

    - name: Recompute the incoming current artifact identity
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_deploy_incoming.path }}/scripts/compose-artifact.py"
          - --root
          - "{{ compose_deploy_incoming.path }}"
          - --no-git
          - hash
      become: true
      register: compose_deploy_incoming_hash
      changed_when: false

    - name: Require the incoming current artifact identity
      ansible.builtin.assert:
        that:
          - compose_deploy_incoming_hash.stdout == compose_artifact_hash
        fail_msg: "Incoming current artifact differs from the approved candidate."

    - name: Remove the older tracked previous artifact
      ansible.builtin.file:
        path: "{{ compose_previous_dir }}"
        state: absent
      become: true

    - name: Preserve the active environment for rollback
      ansible.builtin.copy:
        src: "{{ compose_runtime_env_path }}"
        dest: "{{ compose_previous_env_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true

    - name: Atomically rotate current and previous artifacts before Docker convergence
      block:
        - name: Materialize the exact legacy current artifact for rollback
          ansible.builtin.command:
            argv:
              - /usr/bin/cp
              - --archive
              - --dereference
              - --
              - "{{ compose_current_dir }}"
              - "{{ compose_previous_dir }}"
          become: true
          changed_when: true
          when: compose_deploy_paths.results[2].stat.islnk | default(false)

        - name: Verify the materialized legacy rollback artifact
          ansible.builtin.command:
            argv:
              - "{{ ansible_python_interpreter }}"
              - "{{ compose_previous_dir }}/scripts/compose-artifact.py"
              - --root
              - "{{ compose_previous_dir }}"
              - --no-git
              - hash
          become: true
          register: compose_deploy_materialized_previous_hash
          changed_when: false
          when: compose_deploy_paths.results[2].stat.islnk | default(false)

        - name: Require the materialized legacy rollback identity
          ansible.builtin.assert:
            that:
              - compose_deploy_materialized_previous_hash.stdout == compose_deploy_artifact_hashes.results[1].stdout
            fail_msg: "Materialized legacy rollback artifact differs from the active artifact."
          when: compose_deploy_paths.results[2].stat.islnk | default(false)

        - name: Remove the verified legacy current symlink
          ansible.builtin.file:
            path: "{{ compose_current_dir }}"
            state: absent
          become: true
          when: compose_deploy_paths.results[2].stat.islnk | default(false)

        - name: Move a directory-backed current artifact to previous
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --
              - "{{ compose_current_dir }}"
              - "{{ compose_previous_dir }}"
          become: true
          changed_when: true
          when: compose_deploy_paths.results[2].stat.isdir | default(false)

        - name: Publish the incoming artifact as current
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --
              - "{{ compose_deploy_incoming.path }}"
              - "{{ compose_current_dir }}"
          become: true
          changed_when: true
      rescue:
        - name: Inspect current after interrupted pre-Docker artifact rotation
          ansible.builtin.stat:
            path: "{{ compose_current_dir }}"
          become: true
          register: compose_deploy_rescue_current

        - name: Restore previous as current only before Docker convergence
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --
              - "{{ compose_previous_dir }}"
              - "{{ compose_current_dir }}"
          become: true
          when: not (compose_deploy_rescue_current.stat.exists | default(false))
          changed_when: true

        - name: Stop after pre-Docker artifact rotation failure
          ansible.builtin.fail:
            msg: "Artifact publication failed before Docker convergence; current was restored when absent."

    - name: Activate the reviewed root-only candidate environment
      ansible.builtin.copy:
        src: "{{ compose_staged_env_path }}"
        dest: "{{ compose_runtime_env_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true

    - name: Inspect retired service containers before deletion
      ansible.builtin.command:
        argv: [/usr/bin/docker, container, inspect, "{{ item }}"]
      become: true
      register: compose_deploy_retired_containers
      changed_when: false
      failed_when: compose_deploy_retired_containers.rc not in [0, 1]
      loop:
        - audiobookshelf
        - pihole
      when: compose_deploy_unused_service_retirement

    - name: Remove retired service containers
      ansible.builtin.command:
        argv: [/usr/bin/docker, container, rm, --force, "{{ item.item }}"]
      become: true
      changed_when: true
      loop: "{{ compose_deploy_retired_containers.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - compose_deploy_unused_service_retirement
        - item.rc == 0

    - name: Delete retired service state roots
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - /srv/home-lab-state/audiobookshelf-data
        - /srv/home-lab-state/pihole-data
      when: compose_deploy_unused_service_retirement

    - name: Verify the live Calibre rollback boundary
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          nfs_path=/mnt/storage/media/calibre/books
          local_path=/srv/home-lab-state/calibre-data/books
          test "$(/usr/bin/realpath --canonicalize-existing -- "$nfs_path")" = "$nfs_path"
          test "$(/usr/bin/realpath --canonicalize-existing -- "$local_path")" = "$local_path"
          test "$nfs_path" != "$local_path"
          read -r nfs_target nfs_source nfs_fstype < <(/usr/bin/findmnt --raw --noheadings --target "$nfs_path" --output TARGET,SOURCE,FSTYPE)
          test "$nfs_target" = {{ backups.restic.repositories.nfs.mountpoint | quote }}
          test "$nfs_source" = {{ backups.restic.repositories.nfs.mount_source | quote }}
          test "$nfs_fstype" = {{ backups.restic.repositories.nfs.filesystem | quote }}
          read -r local_target local_source local_fstype local_uuid < <(
            /usr/bin/findmnt --raw --noheadings --target "$local_path" \
              --output TARGET,SOURCE,FSTYPE,UUID
          )
          test "$local_target" = {{ proxmox.vm.state_disk.mountpoint | quote }}
          test "$local_fstype" = {{ proxmox.vm.state_disk.filesystem | quote }}
          test "$local_uuid" = {{ proxmox.vm.state_disk.filesystem_uuid | quote }}
          test "$local_source" != "$nfs_source"
          test "$(/usr/bin/stat --format=%d -- "$nfs_path")" != "$(/usr/bin/stat --format=%d -- "$local_path")"
          for path in "$nfs_path" "$local_path"; do
            test -d "$path"
            test ! -L "$path"
          done
          source_bytes=$(/usr/bin/du --bytes --summarize /mnt/storage/media/calibre/books | /usr/bin/cut -f1)
          free_bytes=$(/usr/bin/df --output=avail --block-size=1 /srv/home-lab-state/calibre-data/books | /usr/bin/tail -1 | /usr/bin/tr -d ' ')
          test "$source_bytes" -gt 0
          test "$free_bytes" -ge "$((source_bytes + 1073741824))"
          /usr/bin/docker inspect calibre calibre-web-automated bookshelf |
            /usr/bin/python3 -c '
          import json, sys
          expected = {
              "calibre": ("/books", "/mnt/storage/media/calibre/books"),
              "calibre-web-automated": ("/calibre-library", "/mnt/storage/media/calibre/books"),
              "bookshelf": ("/books", "/mnt/storage/media/calibre/books"),
          }
          expected_running = {{ (not compose_deploy_calibre_local_rollback_resume) | ternary('True', 'False') }}
          rows = json.load(sys.stdin)
          if {row["Name"].lstrip("/") for row in rows} != set(expected): raise SystemExit(1)
          for row in rows:
              name = row["Name"].lstrip("/")
              if bool(row["State"]["Running"]) != expected_running: raise SystemExit(1)
              target, source = expected[name]
              mounts = [entry for entry in row["Mounts"] if entry["Destination"] == target]
              if len(mounts) != 1 or mounts[0]["Source"] != source: raise SystemExit(1)
          '
          echo calibre_local_rollback_boundary=verified
      become: true
      changed_when: false
      no_log: true
      when: compose_deploy_calibre_local_rollback

    - name: Stop Restic timers during Calibre authority reconciliation
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      become: true
      loop:
        - home-lab-restic-daily.timer
        - home-lab-restic-maintenance.timer
      when: compose_deploy_calibre_local_rollback

    - name: Require the Restic operation mutex to be idle
      ansible.builtin.command:
        argv:
          - /usr/bin/flock
          - --exclusive
          - --nonblock
          - --
          - "{{ backups.restic.runner.lock_path }}"
          - /usr/bin/true
      become: true
      changed_when: false
      no_log: true
      when: compose_deploy_calibre_local_rollback

    - name: Stop exact Calibre library writers before local reconciliation
      ansible.builtin.command:
        argv: [/usr/bin/docker, stop, calibre-web-automated, calibre, bookshelf]
      become: true
      changed_when: true
      no_log: true
      when: compose_deploy_calibre_local_rollback

    - name: Require exact Calibre writers to be stopped
      ansible.builtin.command:
        argv: [/usr/bin/docker, inspect, --format, "{{ '{{.State.Running}}' }}", "{{ item }}"]
      become: true
      register: compose_deploy_calibre_stopped
      changed_when: false
      failed_when: compose_deploy_calibre_stopped.rc != 0 or compose_deploy_calibre_stopped.stdout != 'false'
      loop: [calibre-web-automated, calibre, bookshelf]
      no_log: true
      when: compose_deploy_calibre_local_rollback

    - name: Reconcile the authoritative NFS Calibre library into retained local storage
      ansible.builtin.command:
        argv:
          - /usr/bin/flock
          - --exclusive
          - --nonblock
          - --
          - "{{ backups.restic.runner.lock_path }}"
          - /usr/bin/rsync
          - --archive
          - --hard-links
          - --acls
          - --xattrs
          - --numeric-ids
          - --one-file-system
          - --checksum
          - --delete
          - /mnt/storage/media/calibre/books/
          - /srv/home-lab-state/calibre-data/books/
      become: true
      changed_when: true
      no_log: true
      when: compose_deploy_calibre_local_rollback

    - name: Verify complete local Calibre reconciliation
      ansible.builtin.command:
        argv:
          - /usr/bin/flock
          - --exclusive
          - --nonblock
          - --
          - "{{ backups.restic.runner.lock_path }}"
          - /usr/bin/rsync
          - --archive
          - --hard-links
          - --acls
          - --xattrs
          - --numeric-ids
          - --one-file-system
          - --checksum
          - --no-times
          - --delete
          - --dry-run
          - --itemize-changes
          - /mnt/storage/media/calibre/books/
          - /srv/home-lab-state/calibre-data/books/
      become: true
      register: compose_deploy_calibre_verify
      changed_when: false
      failed_when: compose_deploy_calibre_verify.rc != 0 or compose_deploy_calibre_verify.stdout | length > 0
      no_log: true
      when: compose_deploy_calibre_local_rollback

    - name: Verify the reconciled local Calibre SQLite database
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os
          import sqlite3

          path = "/srv/home-lab-state/calibre-data/books/metadata.db"
          info = os.lstat(path)
          if not os.path.isfile(path) or os.path.islink(path) or info.st_nlink != 1:
              raise SystemExit(1)
          connection = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
          try:
              result = connection.execute("PRAGMA integrity_check").fetchall()
          finally:
              connection.close()
          if result != [("ok",)]:
              raise SystemExit(1)
          print("calibre_sqlite_integrity=verified")
          PY
      become: true
      changed_when: false
      no_log: true
      when: compose_deploy_calibre_local_rollback

    - name: Install reconciled Restic source policy files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: restic-proton
        mode: "0440"
        remote_src: true
      become: true
      loop:
        - src: "{{ compose_current_dir }}/services/data/restic/files-from"
          dest: /etc/home-lab/restic/files-from
        - src: "{{ compose_current_dir }}/services/data/restic/excludes"
          dest: /etc/home-lab/restic/excludes
      no_log: true
      when: compose_deploy_calibre_local_rollback

    - name: Install reconciled Restic policy JSON
      ansible.builtin.copy:
        content: "{{ backups.restic | to_nice_json }}\n"
        dest: /etc/home-lab/restic-policy.json
        owner: root
        group: restic-proton
        mode: "0440"
      become: true
      no_log: true
      when: compose_deploy_calibre_local_rollback

    - name: Verify installed Restic source policy file identities
      ansible.builtin.command:
        argv: [/usr/bin/cmp, --silent, --, "{{ item.src }}", "{{ item.dest }}"]
      become: true
      changed_when: false
      loop:
        - src: "{{ compose_current_dir }}/services/data/restic/files-from"
          dest: /etc/home-lab/restic/files-from
        - src: "{{ compose_current_dir }}/services/data/restic/excludes"
          dest: /etc/home-lab/restic/excludes
      no_log: true
      when: compose_deploy_calibre_local_rollback

    - name: Read installed reconciled Restic policy JSON
      ansible.builtin.slurp:
        src: /etc/home-lab/restic-policy.json
      become: true
      register: compose_deploy_calibre_restic_policy_file
      changed_when: false
      no_log: true
      when: compose_deploy_calibre_local_rollback

    - name: Verify installed reconciled Restic policy semantics
      ansible.builtin.assert:
        that:
          - (compose_deploy_calibre_restic_policy_file.content | b64decode | from_json) == backups.restic
        fail_msg: "Installed Restic policy differs after Calibre authority reconciliation."
      no_log: true
      when: compose_deploy_calibre_local_rollback
    - name: Restart Restic timers after local policy activation
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      become: true
      loop:
        - home-lab-restic-daily.timer
        - home-lab-restic-maintenance.timer
      when: compose_deploy_calibre_local_rollback

    - name: Require the bounded Nextcloud migration service set
      ansible.builtin.assert:
        that:
          - >-
            compose_deploy_plan.recreate_services |
            difference([nextcloud.database_service, nextcloud.web_service]) |
            length == 0
          - nextcloud.database_service in compose_deploy_plan.recreate_services
          - nextcloud.web_service in compose_deploy_plan.recreate_services
        fail_msg: "Nextcloud migration proposes an unexpected service recreation set."
      when: compose_deploy_nextcloud_migration

    - name: Converge running Nextcloud migration services in dependency order
      ansible.builtin.command:
        argv: >-
          {{ compose_runtime_cli + ['up', '--detach', '--no-build', '--pull', 'never', '--no-deps', item] }}
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      loop:
        - "{{ nextcloud.database_service }}"
        - "{{ nextcloud.web_service }}"
      when:
        - compose_deploy_nextcloud_migration
        - item in compose_deploy_plan.recreate_services
      changed_when: true
      no_log: true

    - name: Restart Caddy to load the reviewed bind-mounted configuration
      ansible.builtin.command:
        argv: "{{ compose_runtime_cli + ['restart', 'caddy'] }}"
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      when:
        - compose_deploy_nextcloud_migration
        - compose_deploy_plan.manual_only_paths == ['services/data/Caddyfile']
      changed_when: true
      no_log: true

    - name: Derive stopped services for the bounded Nextcloud migration
      ansible.builtin.set_fact:
        compose_deploy_nextcloud_migration_stopped_services:
          - "{{ nextcloud.cron_service }}"
      when: compose_deploy_nextcloud_migration
      no_log: true

    - name: Converge changed Nextcloud cron without starting it
      ansible.builtin.command:
        argv: >-
          {{ compose_runtime_cli + ['up', '--no-start', '--no-build', '--pull', 'never', '--no-deps'] +
             compose_deploy_nextcloud_migration_stopped_services }}
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      when: compose_deploy_nextcloud_migration
      changed_when: true
      no_log: true

    - name: Remove any stale dependency-aware apply plan
      ansible.builtin.file:
        path: /run/docker-compose-deploy-apply.json
        state: absent
      become: true
      changed_when: false
      no_log: true
      when:
        - not compose_deploy_nextcloud_migration
        - compose_deploy_plan.recreate_services | length > 0

    - name: Plan the exact dependency-aware convergence command
      ansible.builtin.script:
        cmd: >-
          {{ role_path }}/../../../scripts/compose-action-plan.py
          --project-name {{ compose_project_name }}
          --project-directory {{ compose_current_dir }}
          --env-file {{ compose_runtime_env_path }}
          --compose-file {{ compose_current_dir }}/docker-compose.yml
          --override-file {{ compose_image_override_path }}
          --operation up
          --service {{ compose_deploy_plan.recreate_services | sort | join(' --service ') }}
          --output /run/docker-compose-deploy-apply.json
        executable: "{{ ansible_python_interpreter }}"
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      changed_when: false
      no_log: true
      when:
        - not compose_deploy_nextcloud_migration
        - compose_deploy_plan.recreate_services | length > 0

    - name: Read the dependency-aware apply plan
      ansible.builtin.slurp:
        src: /run/docker-compose-deploy-apply.json
      become: true
      register: compose_deploy_apply_plan_file
      changed_when: false
      no_log: true
      when:
        - not compose_deploy_nextcloud_migration
        - compose_deploy_plan.recreate_services | length > 0

    - name: Parse the dependency-aware apply plan
      ansible.builtin.set_fact:
        compose_deploy_apply_plan: "{{ compose_deploy_apply_plan_file.content | b64decode | from_json }}"
      no_log: true
      when:
        - not compose_deploy_nextcloud_migration
        - compose_deploy_plan.recreate_services | length > 0

    - name: Remove the dependency-aware apply plan
      ansible.builtin.file:
        path: /run/docker-compose-deploy-apply.json
        state: absent
      become: true
      changed_when: false
      no_log: true
      when:
        - not compose_deploy_nextcloud_migration
        - compose_deploy_plan.recreate_services | length > 0

    - name: Require the exact dependency-aware apply boundary
      ansible.builtin.assert:
        that:
          - compose_deploy_apply_plan.operation == 'up'
          - compose_deploy_apply_plan.dependency_mode == 'complete'
          - compose_deploy_apply_plan.requested_services == compose_deploy_plan.recreate_services | sort
          - compose_deploy_apply_plan.recreate_services == compose_deploy_plan.recreate_services | sort
          - compose_deploy_apply_plan.forbidden_actions | length == 0
          - compose_deploy_apply_plan.action_services | difference(compose_deploy_plan.recreate_services) | length == 0
          - compose_deploy_apply_plan.start_services | difference(compose_deploy_plan.recreate_services) | length == 0
          - compose_deploy_apply_plan.stop_services | difference(compose_deploy_plan.recreate_services) | length == 0
        fail_msg: "Dependency-aware Compose convergence differs from the complete reviewed service boundary."
      no_log: true
      when:
        - not compose_deploy_nextcloud_migration
        - compose_deploy_plan.recreate_services | length > 0
    - name: Converge only the reviewed services without builds, removal, or orphan removal
      ansible.builtin.command:
        argv: >-
          {{ compose_runtime_cli + ['up', '--detach', '--no-build', '--pull', 'never']
             + (compose_deploy_plan.recreate_services | sort) }}
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      register: compose_deploy_converge
      failed_when: false
      no_log: true
      when:
        - not compose_deploy_nextcloud_migration
        - compose_deploy_plan.recreate_services | length > 0
      changed_when: true

    - name: Retain protected Compose convergence diagnostics
      ansible.builtin.copy:
        content: |-
          rc={{ 0 if compose_deploy_nextcloud_migration else compose_deploy_converge.rc }}
          migration_lane={{ compose_deploy_nextcloud_migration }}
        dest: "/var/lib/docker-compose/deploy-{{ compose_artifact_hash }}.log"
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true
      when: compose_deploy_plan.recreate_services | length > 0

    - name: Require successful reviewed Compose convergence
      ansible.builtin.assert:
        that:
          - compose_deploy_nextcloud_migration or compose_deploy_plan.recreate_services | length == 0 or compose_deploy_converge.rc == 0
        fail_msg: "Compose convergence failed; inspect the protected host deployment log."
      no_log: true

    - name: Produce the root-only post-deployment action plan
      ansible.builtin.script:
        cmd: >-
          {{ role_path }}/../../../scripts/compose-action-plan.py
          --project-name {{ compose_project_name }}
          --project-directory {{ compose_current_dir }}
          --env-file {{ compose_runtime_env_path }}
          --compose-file {{ compose_current_dir }}/docker-compose.yml
          --override-file {{ compose_image_override_path }}
          --output /run/docker-compose-deploy-post.json
        executable: "{{ ansible_python_interpreter }}"
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      changed_when: false
      no_log: true

    - name: Read the root-only post-deployment action plan
      ansible.builtin.slurp:
        src: /run/docker-compose-deploy-post.json
      become: true
      register: compose_deploy_post_file
      changed_when: false
      no_log: true

    - name: Parse the secret-free post-deployment action plan
      ansible.builtin.set_fact:
        compose_deploy_post_plan: "{{ compose_deploy_post_file.content | b64decode | from_json }}"
      no_log: true

    - name: Remove the root-only post-deployment action plan
      ansible.builtin.file:
        path: /run/docker-compose-deploy-post.json
        state: absent
      become: true
      changed_when: false
      no_log: true

    - name: Require an idempotent post-deployment action plan
      ansible.builtin.assert:
        that:
          - compose_deploy_post_plan.action_count == 0
          - compose_deploy_post_plan.recreate_services | length == 0
          - compose_deploy_post_plan.forbidden_actions | length == 0
        fail_msg: "Post-deployment Compose plan still proposes convergence."
      no_log: true

    - name: Create the protected image-lock directory
      ansible.builtin.file:
        path: "{{ maintenance_compose_current_image_lock_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0711"
      become: true

    - name: Retain the exact pre-deployment image set
      ansible.builtin.copy:
        src: /run/docker-compose-previous-images.json
        dest: "{{ maintenance_compose_previous_image_lock_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true

    - name: Capture the exact converged image set
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_current_dir }}/scripts/compose-image-lock.py"
          - capture
          - --project
          - "{{ compose_project_name }}"
          - --output
          - "{{ maintenance_compose_current_image_lock_path }}"
      become: true
      changed_when: true
      no_log: true

    - name: Remove transient pre-deployment image state
      ansible.builtin.file:
        path: /run/docker-compose-previous-images.json
        state: absent
      become: true
      changed_when: false
      no_log: true

    - name: Publish the exact active Compose artifact identity for Restic acceptance
      ansible.builtin.copy:
        content: "{{ compose_artifact_hash }}\n"
        dest: /var/lib/docker-compose/current-artifact.sha256
        owner: root
        group: root
        mode: "0444"
      become: true
