---
- name: Validate the Compose deployment contract
  ansible.builtin.assert:
    that:
      - compose_artifact_hash is match('^[0-9a-f]{64}$')
      - ansible_check_mode or (compose_deploy_confirmed | default(false) | ansible.builtin.bool)
    fail_msg: >-
      Compose deployment requires the exact staged artifact hash and compose_deploy_confirmed=true
      outside check mode.

- name: Inspect candidate and active deployment inputs
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  become: true
  register: compose_deploy_paths
  loop:
    - "{{ compose_staging_root }}/{{ compose_artifact_hash }}"
    - "{{ compose_staged_env_path }}"
    - "{{ compose_current_dir }}"
    - "{{ compose_runtime_env_path }}"
    - "{{ compose_staged_inventory_path }}"
    - "{{ compose_runtime_inventory_path }}"
    - "{{ compose_image_override_path }}"

- name: Require complete root-owned candidate and active inputs
  ansible.builtin.assert:
    that:
      - compose_deploy_paths.results[0].stat.isdir | default(false)
      - compose_deploy_paths.results[1].stat.isreg | default(false)
      - compose_deploy_paths.results[1].stat.pw_name == 'root'
      - compose_deploy_paths.results[1].stat.mode == '0600'
      - >-
        (compose_deploy_paths.results[2].stat.isdir | default(false)) or
        ((compose_deploy_paths.results[2].stat.islnk | default(false)) and
         compose_deploy_paths.results[2].stat.lnk_source == compose_legacy_current_target)
      - compose_deploy_paths.results[3].stat.isreg | default(false)
      - compose_deploy_paths.results[3].stat.pw_name == 'root'
      - compose_deploy_paths.results[3].stat.mode == '0600'
      - compose_deploy_paths.results[4].stat.isreg | default(false)
      - compose_deploy_paths.results[5].stat.isreg | default(false)
      - compose_deploy_paths.results[6].stat.isreg | default(false)
      - compose_deploy_paths.results[6].stat.pw_name == 'root'
      - compose_deploy_paths.results[6].stat.mode == '0644'
    fail_msg: "Candidate staging, active deployment, environment, or inventory input is missing."

- name: Recheck protected Nextcloud database secret files before deployment
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter }}"
      - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/scripts/materialize-compose-secret-files.py"
      - --dotenv
      - "{{ compose_staged_env_path }}"
      - --directory
      - "{{ nextcloud.secrets.application_password.destination | dirname }}"
      - --secret
      - "{{ nextcloud.secrets.application_password.source_secret_ref }}={{ nextcloud.secrets.application_password.destination | basename }}"
      - --secret
      - "{{ nextcloud.secrets.root_password.source_secret_ref }}={{ nextcloud.secrets.root_password.destination | basename }}"
      - --check
  become: true
  changed_when: false
  no_log: true
- name: Recompute candidate and current artifact identities
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter }}"
      - "{{ item.root }}/scripts/compose-artifact.py"
      - --root
      - "{{ item.root }}"
      - --no-git
      - hash
  become: true
  register: compose_deploy_artifact_hashes
  changed_when: false
  check_mode: false
  loop:
    - root: "{{ compose_staging_root }}/{{ compose_artifact_hash }}"
    - root: "{{ compose_current_dir }}"


- name: Require exact candidate and active artifact identities
  ansible.builtin.assert:
    that:
      - compose_deploy_artifact_hashes.results[0].stdout == compose_artifact_hash
    fail_msg: "Candidate artifact identity differs from the reviewed state."
  no_log: true

- name: Remove stale root-only deployment plan files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  changed_when: false
  check_mode: false
  no_log: true
  loop:
    - /run/docker-compose-deploy-actions.json
    - /run/docker-compose-deploy-plan.json
    - /run/docker-compose-deploy-post.json

- name: Produce the root-only candidate action plan
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/../../../scripts/compose-action-plan.py
      --project-name {{ compose_project_name }}
      --project-directory {{ compose_staging_root }}/{{ compose_artifact_hash }}
      --env-file {{ compose_staged_env_path }}
      --compose-file {{ compose_staging_root }}/{{ compose_artifact_hash }}/docker-compose.yml
      --override-file {{ compose_image_override_path }}
      --bind-root-override {{ compose_current_dir }}
      --output /run/docker-compose-deploy-actions.json
    executable: "{{ ansible_python_interpreter }}"
  become: true
  environment:
    HOME: "{{ compose_home_dir }}"
  changed_when: false
  check_mode: false
  no_log: true

- name: Produce the root-only combined deployment plan
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/../../../scripts/compose-deployment-diff.py
      --desired {{ compose_staged_inventory_path }}
      --runtime {{ compose_runtime_inventory_path }}
      --actions /run/docker-compose-deploy-actions.json
      --candidate-root {{ compose_staging_root }}/{{ compose_artifact_hash }}
      --current-root {{ compose_current_dir }}
      --candidate-hash {{ compose_artifact_hash }}
      --deployed-hash {{ compose_deploy_artifact_hashes.results[1].stdout }}
      --canary-service {{ compose_canary_service }}
      --canary-path {{ compose_canary_path }}
      --output /run/docker-compose-deploy-plan.json
    executable: "{{ ansible_python_interpreter }}"
  become: true
  changed_when: false
  check_mode: false
  no_log: true

- name: Read the root-only combined deployment plan
  ansible.builtin.slurp:
    src: /run/docker-compose-deploy-plan.json
  become: true
  register: compose_deploy_plan_file
  changed_when: false
  check_mode: false
  no_log: true

- name: Parse the secret-free deployment plan
  ansible.builtin.set_fact:
    compose_deploy_plan: "{{ compose_deploy_plan_file.content | b64decode | from_json }}"
  no_log: true

- name: Identify the exact reviewed Nextcloud migration deployment lane
  ansible.builtin.set_fact:
    compose_deploy_nextcloud_migration: >-
      {{
        (compose_deploy_nextcloud_migration_confirmation | default('')) ==
          'deploy-reviewed-nextcloud-five-mount-migration' and
        compose_deploy_plan.missing_runtime_services == [nextcloud.cron_service] and
        compose_deploy_plan.unexpected_runtime_services | length == 0 and
        compose_deploy_plan.forbidden_actions | length == 1 and
        compose_deploy_plan.forbidden_actions[0].service == nextcloud.cron_service and
        compose_deploy_plan.forbidden_actions[0].action in ['Create', 'Creating', 'Created'] and
        compose_deploy_plan.manual_only_paths == ['services/data/Caddyfile']
      }}
  no_log: true

- name: Remove root-only deployment plan files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  changed_when: false
  check_mode: false
  no_log: true
  loop:
    - /run/docker-compose-deploy-actions.json
    - /run/docker-compose-deploy-plan.json

- name: Select changes permitted by the requested deployment lane
  ansible.builtin.set_fact:
    compose_deploy_effective_changes: >-
      {{
        (compose_deploy_plan.has_changes or compose_deploy_plan.recreate_services | length > 0) and
        (
          ((compose_deploy_artifact_only | default(false) | ansible.builtin.bool) and
           compose_deploy_plan.artifact_only_eligible) or
          (not (compose_deploy_artifact_only | default(false) | ansible.builtin.bool) and
           (not (compose_deploy_canary_only | default(false) | ansible.builtin.bool) or
            compose_deploy_plan.canary_eligible))
        )
      }}

- name: Display only the secret-free deployment plan
  ansible.builtin.debug:
    var: compose_deploy_plan

- name: Report the deterministic secret-free deployment plan identity
  ansible.builtin.debug:
    msg: >-
      compose_deploy_plan_sha256={{ (compose_deploy_plan | to_json) | hash('sha256') }}

- name: Require a deployment with no unreviewed service-set or data-file changes
  ansible.builtin.assert:
    that:
      - >-
        (
          compose_deploy_plan.missing_runtime_services | length == 0 and
          compose_deploy_plan.unexpected_runtime_services | length == 0 and
          compose_deploy_plan.forbidden_actions | length == 0 and
          (
            compose_deploy_plan.manual_only_paths | length == 0 or
            (
              (compose_deploy_manual_paths_confirmation | default('')) == 'deploy-reviewed-two-path-backups' and
              compose_deploy_plan.manual_only_paths == ['services/data/replicate-local-backup'] and
              'daily-local-backup' in compose_deploy_plan.recreate_services
            )
          )
        ) or compose_deploy_nextcloud_migration
    fail_msg: >-
      Deployment refuses service additions/removals, forbidden Compose actions, and data-file changes
      without their exact operation-specific restart approval.

- name: Preserve dependencies for the exact two-path backup rollout
  ansible.builtin.set_fact:
    compose_deploy_dependency_args: >-
      {{
        []
        if (
          (compose_deploy_manual_paths_confirmation | default('')) == 'deploy-reviewed-two-path-backups' and
          compose_deploy_plan.manual_only_paths == ['services/data/replicate-local-backup'] and
          'daily-local-backup' in compose_deploy_plan.recreate_services
        )
        else ['--no-deps']
      }}
- name: Report the check-mode deployment boundary
  ansible.builtin.debug:
    msg:
      candidate_hash: "{{ compose_artifact_hash }}"
      recreate_services: "{{ compose_deploy_plan.recreate_services }}"
      image_services: "{{ compose_deploy_plan.image_services }}"
      stateful_recreate_services: "{{ compose_deploy_plan.stateful_recreate_services }}"
  changed_when: compose_deploy_effective_changes
  when: ansible_check_mode

- name: Deploy the exact staged Compose artifact
  when:
    - not ansible_check_mode
    - compose_deploy_effective_changes
  block:
    - name: Capture the active image set for rollback before pulls
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/scripts/compose-image-lock.py"
          - capture
          - --project
          - "{{ compose_project_name }}"
          - --output
          - /run/docker-compose-previous-images.json
      become: true
      changed_when: true
      no_log: true
    - name: Reuse the prefetched changed-service images without refreshing tags
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/docker', 'compose', '--project-name', compose_project_name,
              '--project-directory', compose_staging_root ~ '/' ~ compose_artifact_hash,
              '--env-file', compose_staged_env_path,
              '--file', compose_staging_root ~ '/' ~ compose_artifact_hash ~ '/docker-compose.yml',
              'pull', '--policy', 'missing', '--ignore-buildable'] + compose_deploy_plan.image_services }}
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      no_log: true
      when: compose_deploy_plan.image_services | length > 0
      changed_when: true

    - name: Create an incoming current artifact directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ compose_deployment_root }}"
        prefix: .deploy-
      become: true
      register: compose_deploy_incoming

    - name: Copy the immutable candidate into the incoming current directory
      ansible.builtin.copy:
        src: "{{ compose_staging_root }}/{{ compose_artifact_hash }}/"
        dest: "{{ compose_deploy_incoming.path }}/"
        remote_src: true
        owner: root
        group: root
        mode: preserve
        directory_mode: "0755"
      become: true

    - name: Recompute the incoming current artifact identity
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_deploy_incoming.path }}/scripts/compose-artifact.py"
          - --root
          - "{{ compose_deploy_incoming.path }}"
          - --no-git
          - hash
      become: true
      register: compose_deploy_incoming_hash
      changed_when: false

    - name: Require the incoming current artifact identity
      ansible.builtin.assert:
        that:
          - compose_deploy_incoming_hash.stdout == compose_artifact_hash
        fail_msg: "Incoming current artifact differs from the approved candidate."

    - name: Remove the older tracked previous artifact
      ansible.builtin.file:
        path: "{{ compose_previous_dir }}"
        state: absent
      become: true

    - name: Preserve the active environment for rollback
      ansible.builtin.copy:
        src: "{{ compose_runtime_env_path }}"
        dest: "{{ compose_previous_env_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true

    - name: Atomically rotate current and previous artifacts before Docker convergence
      block:
        - name: Materialize the exact legacy current artifact for rollback
          ansible.builtin.command:
            argv:
              - /usr/bin/cp
              - --archive
              - --dereference
              - --
              - "{{ compose_current_dir }}"
              - "{{ compose_previous_dir }}"
          become: true
          changed_when: true
          when: compose_deploy_paths.results[2].stat.islnk | default(false)

        - name: Verify the materialized legacy rollback artifact
          ansible.builtin.command:
            argv:
              - "{{ ansible_python_interpreter }}"
              - "{{ compose_previous_dir }}/scripts/compose-artifact.py"
              - --root
              - "{{ compose_previous_dir }}"
              - --no-git
              - hash
          become: true
          register: compose_deploy_materialized_previous_hash
          changed_when: false
          when: compose_deploy_paths.results[2].stat.islnk | default(false)

        - name: Require the materialized legacy rollback identity
          ansible.builtin.assert:
            that:
              - compose_deploy_materialized_previous_hash.stdout == compose_deploy_artifact_hashes.results[1].stdout
            fail_msg: "Materialized legacy rollback artifact differs from the active artifact."
          when: compose_deploy_paths.results[2].stat.islnk | default(false)

        - name: Remove the verified legacy current symlink
          ansible.builtin.file:
            path: "{{ compose_current_dir }}"
            state: absent
          become: true
          when: compose_deploy_paths.results[2].stat.islnk | default(false)

        - name: Move a directory-backed current artifact to previous
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --
              - "{{ compose_current_dir }}"
              - "{{ compose_previous_dir }}"
          become: true
          changed_when: true
          when: compose_deploy_paths.results[2].stat.isdir | default(false)

        - name: Publish the incoming artifact as current
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --
              - "{{ compose_deploy_incoming.path }}"
              - "{{ compose_current_dir }}"
          become: true
          changed_when: true
      rescue:
        - name: Inspect current after interrupted pre-Docker artifact rotation
          ansible.builtin.stat:
            path: "{{ compose_current_dir }}"
          become: true
          register: compose_deploy_rescue_current

        - name: Restore previous as current only before Docker convergence
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --
              - "{{ compose_previous_dir }}"
              - "{{ compose_current_dir }}"
          become: true
          when: not (compose_deploy_rescue_current.stat.exists | default(false))
          changed_when: true

        - name: Stop after pre-Docker artifact rotation failure
          ansible.builtin.fail:
            msg: "Artifact publication failed before Docker convergence; current was restored when absent."

    - name: Activate the reviewed root-only candidate environment
      ansible.builtin.copy:
        src: "{{ compose_staged_env_path }}"
        dest: "{{ compose_runtime_env_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true

    - name: Require the bounded Nextcloud migration service set
      ansible.builtin.assert:
        that:
          - >-
            compose_deploy_plan.recreate_services |
            difference([nextcloud.database_service, nextcloud.web_service,
                        'daily-local-backup', 'weekly-remote-backup']) | length == 0
          - nextcloud.database_service in compose_deploy_plan.recreate_services
          - nextcloud.web_service in compose_deploy_plan.recreate_services
        fail_msg: "Nextcloud migration proposes an unexpected service recreation set."
      when: compose_deploy_nextcloud_migration

    - name: Converge running Nextcloud migration services in dependency order
      ansible.builtin.command:
        argv: >-
          {{ compose_runtime_cli + ['up', '--detach', '--no-build', '--pull', 'never', '--no-deps', item] }}
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      loop:
        - "{{ nextcloud.database_service }}"
        - "{{ nextcloud.web_service }}"
      when:
        - compose_deploy_nextcloud_migration
        - item in compose_deploy_plan.recreate_services
      changed_when: true
      no_log: true

    - name: Restart Caddy to load the reviewed bind-mounted configuration
      ansible.builtin.command:
        argv: "{{ compose_runtime_cli + ['restart', 'caddy'] }}"
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      when:
        - compose_deploy_nextcloud_migration
        - compose_deploy_plan.manual_only_paths == ['services/data/Caddyfile']
      changed_when: true
      no_log: true

    - name: Derive stopped services for the bounded Nextcloud migration
      ansible.builtin.set_fact:
        compose_deploy_nextcloud_migration_stopped_services: >-
          {{ ([nextcloud.cron_service] +
              (compose_deploy_plan.recreate_services |
               intersect(['daily-local-backup', 'weekly-remote-backup']))) | unique | sort }}
      when: compose_deploy_nextcloud_migration
      no_log: true

    - name: Converge changed backup schedulers and Nextcloud cron without starting them
      ansible.builtin.command:
        argv: >-
          {{ compose_runtime_cli + ['up', '--no-start', '--no-build', '--pull', 'never', '--no-deps'] +
             compose_deploy_nextcloud_migration_stopped_services }}
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      when: compose_deploy_nextcloud_migration
      changed_when: true
      no_log: true
    - name: Converge only the reviewed services without builds, removal, or orphan removal
      ansible.builtin.command:
        argv: >-
          {{ compose_runtime_cli + ['up', '--detach', '--no-build', '--pull', 'never']
             + compose_deploy_dependency_args
             + (compose_deploy_plan.recreate_services | sort) }}
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      register: compose_deploy_converge
      failed_when: false
      no_log: true
      when:
        - not compose_deploy_nextcloud_migration
        - compose_deploy_plan.recreate_services | length > 0
      changed_when: true

    - name: Retain protected Compose convergence diagnostics
      ansible.builtin.copy:
        content: |-
          rc={{ 0 if compose_deploy_nextcloud_migration else compose_deploy_converge.rc }}
          migration_lane={{ compose_deploy_nextcloud_migration }}
        dest: "/var/lib/docker-compose/deploy-{{ compose_artifact_hash }}.log"
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true
      when: compose_deploy_plan.recreate_services | length > 0

    - name: Require successful reviewed Compose convergence
      ansible.builtin.assert:
        that:
          - compose_deploy_nextcloud_migration or compose_deploy_plan.recreate_services | length == 0 or compose_deploy_converge.rc == 0
        fail_msg: "Compose convergence failed; inspect the protected host deployment log."
      no_log: true

    - name: Produce the root-only post-deployment action plan
      ansible.builtin.script:
        cmd: >-
          {{ role_path }}/../../../scripts/compose-action-plan.py
          --project-name {{ compose_project_name }}
          --project-directory {{ compose_current_dir }}
          --env-file {{ compose_runtime_env_path }}
          --compose-file {{ compose_current_dir }}/docker-compose.yml
          --override-file {{ compose_image_override_path }}
          --output /run/docker-compose-deploy-post.json
        executable: "{{ ansible_python_interpreter }}"
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      changed_when: false
      no_log: true

    - name: Read the root-only post-deployment action plan
      ansible.builtin.slurp:
        src: /run/docker-compose-deploy-post.json
      become: true
      register: compose_deploy_post_file
      changed_when: false
      no_log: true

    - name: Parse the secret-free post-deployment action plan
      ansible.builtin.set_fact:
        compose_deploy_post_plan: "{{ compose_deploy_post_file.content | b64decode | from_json }}"
      no_log: true

    - name: Remove the root-only post-deployment action plan
      ansible.builtin.file:
        path: /run/docker-compose-deploy-post.json
        state: absent
      become: true
      changed_when: false
      no_log: true

    - name: Require an idempotent post-deployment action plan
      ansible.builtin.assert:
        that:
          - compose_deploy_post_plan.recreate_services | length == 0
          - compose_deploy_post_plan.forbidden_actions | length == 0
        fail_msg: "Post-deployment Compose plan still proposes convergence."
      no_log: true

    - name: Create the protected image-lock directory
      ansible.builtin.file:
        path: "{{ maintenance_compose_current_image_lock_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    - name: Retain the exact pre-deployment image set
      ansible.builtin.copy:
        src: /run/docker-compose-previous-images.json
        dest: "{{ maintenance_compose_previous_image_lock_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true

    - name: Capture the exact converged image set
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_current_dir }}/scripts/compose-image-lock.py"
          - capture
          - --project
          - "{{ compose_project_name }}"
          - --output
          - "{{ maintenance_compose_current_image_lock_path }}"
      become: true
      changed_when: true
      no_log: true

    - name: Remove transient pre-deployment image state
      ansible.builtin.file:
        path: /run/docker-compose-previous-images.json
        state: absent
      become: true
      changed_when: false
      no_log: true
