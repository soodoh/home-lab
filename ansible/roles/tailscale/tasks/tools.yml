---
# Tools only: admission and installation do not prove process or boot closure.
- name: Require inactive Tailscale tool platform and direct contract bindings
  ansible.builtin.assert:
    that:
      - lifecycle_profile in ['inert', 'recovery']
      - lifecycle_contract_host == 'debian'
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == debian.version
      - ansible_facts.distribution_release == debian.release
      - ansible_python_interpreter == '/usr/bin/python3'
      - tailscale.docker_host_client.installation == 'official-static-archive'
      - tailscale.docker_host_client.architecture == 'linux_amd64'
      - tailscale.docker_host_client.client_path == '/usr/bin/tailscale'
      - tailscale.docker_host_client.daemon_path == '/usr/sbin/tailscaled'
      - tailscale_client_path == tailscale.docker_host_client.client_path
      - tailscale_client_sha256 == tailscale.docker_host_client.client_sha256
      - tailscale_daemon_path == tailscale.docker_host_client.daemon_path
      - tailscale_daemon_sha256 == tailscale.docker_host_client.daemon_sha256
      - tailscale_expected_version == tailscale.docker_host_client.version
    fail_msg: Tailscale tools require an inactive contracted Debian platform and exact direct-contract bindings.

# Conservative prerequisites, not qualified image facts: these ancestors must be
# real root-owned directories, not symlinks. Never create or repair shared paths.
- name: Inspect Tailscale installation parents without following symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop: [/usr, /usr/bin, /usr/sbin, /var, /var/tmp]
  register: tailscale_tools_parents

- name: Require trusted Tailscale installation parents
  ansible.builtin.assert:
    that:
      - item.stat.isdir | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode == ('1777' if item.item == '/var/tmp' else '0755')
    fail_msg: Tailscale tools require real root-owned 0755 ancestors and a root-owned 1777 /var/tmp; topology changes require separate review.
  loop: "{{ tailscale_tools_parents.results }}"

- name: Inspect existing Tailscale tool destinations
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
    follow: false
  loop:
    - path: /usr/bin/tailscale
      sha256: "{{ tailscale_client_sha256 }}"
    - path: /usr/sbin/tailscaled
      sha256: "{{ tailscale_daemon_sha256 }}"
  register: tailscale_tools_existing

- name: Refuse unsafe or drifted existing Tailscale tools
  ansible.builtin.assert:
    that:
      - >-
        not (item.stat.exists | default(false)) or
        ((item.stat.isreg | default(false)) and
        not (item.stat.islnk | default(false)) and
        (item.stat.nlink | default(0) | int) == 1 and
        item.stat.pw_name == 'root' and item.stat.gr_name == 'root' and
        item.stat.mode == '0755' and item.stat.checksum == item.item.sha256)
    fail_msg: Existing Tailscale tools differ; use separately approved access-critical recovery, not inactive installation to repair or upgrade.
  loop: "{{ tailscale_tools_existing.results }}"

- name: Record missing Tailscale tool destinations
  ansible.builtin.set_fact:
    tailscale_tools_missing: "{{ tailscale_tools_existing.results | selectattr('stat.exists', 'equalto', false) | map(attribute='item') | list }}"

- name: Report missing Tailscale tools during check mode
  ansible.builtin.debug:
    msg: Pinned Tailscale tools are missing; installation does not configure or activate the daemon.
  changed_when: true
  when:
    - ansible_check_mode
    - tailscale_tools_missing | length > 0

- name: Stage and install only missing Tailscale tools outside check mode
  when:
    - not ansible_check_mode
    - tailscale_tools_missing | length > 0
  block:
    - name: Create a root-only Tailscale tool workspace
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        prefix: tailscale-tools-
      register: tailscale_tools_workspace

    - name: Download the exact contracted Tailscale archive
      ansible.builtin.get_url:
        url: "{{ tailscale.docker_host_client.archive_url }}"
        dest: "{{ tailscale_tools_workspace.path }}/tailscale.tgz"
        checksum: "sha256:{{ tailscale.docker_host_client.archive_sha256 }}"
        mode: "0600"

    - name: Extract only both regular Tailscale tool members
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - -I
          - -B
          - -S
          - -c
          - |
            import shutil, sys, tarfile
            with tarfile.open(sys.argv[1], 'r:gz') as archive:
                members = [archive.getmember(sys.argv[2] + '/' + name) for name in ('tailscale', 'tailscaled')]
                if not all(member.isfile() and not member.islnk() and not member.issym() for member in members):
                    sys.exit('non-regular Tailscale member refused')
                for member, name in zip(members, ('tailscale', 'tailscaled')):
                    with archive.extractfile(member) as source, open(sys.argv[3] + '/' + name, 'xb') as destination:
                        shutil.copyfileobj(source, destination)
          - "{{ tailscale_tools_workspace.path }}/tailscale.tgz"
          - "tailscale_{{ tailscale_expected_version }}_amd64"
          - "{{ tailscale_tools_workspace.path }}"
      changed_when: true

    - name: Inspect both staged Tailscale tool identities before publication
      ansible.builtin.stat:
        path: "{{ tailscale_tools_workspace.path }}/{{ item.name }}"
        checksum_algorithm: sha256
        follow: false
      loop:
        - name: tailscale
          sha256: "{{ tailscale_client_sha256 }}"
        - name: tailscaled
          sha256: "{{ tailscale_daemon_sha256 }}"
      register: tailscale_tools_staged

    - name: Require both exact regular staged Tailscale tools before publication
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.nlink | default(0) | int == 1
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
          - item.stat.checksum == item.item.sha256
        fail_msg: Staged Tailscale tool identity differs; no binary may be published.
      loop: "{{ tailscale_tools_staged.results }}"

    # Pathname rechecks assume trusted ancestry and cooperating host ownership;
    # they are not descriptor-relative race-free no-clobber or pair atomicity.
    - name: Reinspect Tailscale destinations before publication
      ansible.builtin.stat:
        path: "{{ item.item.path }}"
        checksum_algorithm: sha256
        follow: false
      loop: "{{ tailscale_tools_existing.results }}"
      register: tailscale_tools_before_publish

    - name: Refuse Tailscale destination changes before publication
      ansible.builtin.assert:
        that:
          - item.stat.exists == item.item.stat.exists
          - >-
            not item.stat.exists or
            ((item.stat.isreg | default(false)) and not (item.stat.islnk | default(false)) and
            item.stat.nlink == 1 and item.stat.pw_name == 'root' and item.stat.gr_name == 'root' and
            item.stat.mode == '0755' and item.stat.checksum == item.item.item.sha256 and
            item.stat.dev == item.item.stat.dev and item.stat.inode == item.item.stat.inode)
        fail_msg: Tailscale destination changed during staging; separately review recovery before another attempt.
      loop: "{{ tailscale_tools_before_publish.results }}"

    - name: Publish only missing Tailscale tools
      ansible.builtin.copy:
        src: "{{ tailscale_tools_workspace.path }}/{{ item.path | basename }}"
        dest: "{{ item.path }}"
        remote_src: true
        follow: false
        force: false
        owner: root
        group: root
        mode: "0755"
      loop: "{{ tailscale_tools_missing }}"
  always:
    # Ordinary failure cleanup only. Interruption can retain the workspace and a
    # partial binary pair; the existing failed host lock needs separate recovery.
    - name: Remove the Tailscale tool workspace
      ansible.builtin.file:
        path: "{{ tailscale_tools_workspace.path }}"
        state: absent
      when: tailscale_tools_workspace.path is defined

- name: Verify installed Tailscale tool identities
  ansible.builtin.stat:
    path: "{{ item.item.path }}"
    checksum_algorithm: sha256
    follow: false
  loop: "{{ tailscale_tools_existing.results }}"
  register: tailscale_tools_installed
  when: not ansible_check_mode or tailscale_tools_missing | length == 0

- name: Require exact installed Tailscale tools without invoking them
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.nlink | default(0) | int == 1
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode == '0755'
      - item.stat.checksum == item.item.item.sha256
    fail_msg: Installed Tailscale tool identity differs; separately reviewed access-critical recovery is required.
  loop: "{{ tailscale_tools_installed.results }}"
  when: not ansible_check_mode or tailscale_tools_missing | length == 0
