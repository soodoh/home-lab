---
- name: Gather package facts before planning Tailscale bootstrap
  ansible.builtin.package_facts:
    manager: auto

- name: Keep the Tailscale package present through native pacman
  ansible.builtin.include_role:
    name: pacman_packages
  vars:
    pacman_packages_requested:
      - "{{ tailscale_package }}"
  when: ansible_facts.distribution == 'Archlinux'

- name: Keep the Tailscale package present through the detected non-pacman manager
  ansible.builtin.package:
    name: "{{ tailscale_package }}"
    state: present
  become: "{{ not ansible_check_mode }}"
  when:
    - ansible_facts.distribution != 'Archlinux'
    - not ansible_check_mode or tailscale_package in ansible_facts.packages

- name: Keep tailscaled enabled and started without restarting it
  ansible.builtin.systemd_service:
    name: "{{ tailscale_service }}"
    enabled: true
    state: started
    daemon_reload: false
  become: "{{ not ansible_check_mode }}"
  when: not ansible_check_mode or tailscale_package in ansible_facts.packages

- name: Initialize the observed Tailscale backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: Absent
  no_log: true

- name: Inspect Tailscale status without exposing tailnet identity
  ansible.builtin.command:
    argv:
      - /usr/bin/tailscale
      - status
      - --json
  register: tailscale_status_before
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode or tailscale_package in ansible_facts.packages

- name: Record the current Tailscale backend state privately
  ansible.builtin.set_fact:
    tailscale_backend_state: "{{ (tailscale_status_before.stdout | from_json).BackendState | default('Unknown') }}"
  no_log: true
  when:
    - tailscale_status_before is not skipped
    - tailscale_status_before.rc == 0
    - tailscale_status_before.stdout | length > 0

- name: Require the selected one-use auth key only when enrollment is needed
  ansible.builtin.assert:
    that:
      - tailscale_auth_key | length > 0
    fail_msg: >-
      TAILSCALE_AUTH_KEY must contain a short-lived, preauthorized, one-use key for {{ tailscale_advertise_tags }}.
  no_log: true
  when:
    - not ansible_check_mode
    - tailscale_backend_state != 'Running'

- name: Enroll the host from a root-only temporary auth-key file
  become: true
  no_log: true
  when:
    - not ansible_check_mode
    - tailscale_backend_state != 'Running'
  block:
    - name: Create the temporary Tailscale auth-key file
      ansible.builtin.tempfile:
        state: file
        path: /run
        prefix: tailscale-auth-
      register: tailscale_auth_key_file

    - name: Write the selected one-use auth key with root-only permissions
      ansible.builtin.copy:
        content: "{{ tailscale_auth_key }}"
        dest: "{{ tailscale_auth_key_file.path }}"
        owner: root
        group: root
        mode: "0600"
        backup: false

    - name: Enroll with no DNS, accepted routes, advertised routes, or Tailscale SSH
      ansible.builtin.command:
        argv:
          - /usr/bin/tailscale
          - up
          - "--auth-key=file:{{ tailscale_auth_key_file.path }}"
          - "--hostname={{ tailscale_hostname }}"
          - "--advertise-tags={{ tailscale_advertise_tags }}"
          - "--advertise-routes={{ tailscale_advertise_routes | join(',') }}"
          - "--accept-dns={{ tailscale_accept_dns | ternary('true', 'false') }}"
          - "--accept-routes={{ tailscale_accept_routes | ternary('true', 'false') }}"
          - "--netfilter-mode={{ tailscale_netfilter_mode }}"
          - --ssh=false
          - --timeout=30s
      changed_when: true
  always:
    - name: Remove the temporary Tailscale auth-key file
      ansible.builtin.file:
        path: "{{ tailscale_auth_key_file.path | default('') }}"
        state: absent
      when: tailscale_auth_key_file.path | default('') | length > 0

- name: Inspect Tailscale preferences without exposing node identity
  ansible.builtin.command:
    argv:
      - /usr/bin/tailscale
      - debug
      - prefs
  register: tailscale_preferences_before
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Converge complete Tailscale preferences
  ansible.builtin.command:
    argv:
      - /usr/bin/tailscale
      - set
      - "--hostname={{ tailscale_hostname }}"
      - "--advertise-routes={{ tailscale_advertise_routes | join(',') }}"
      - "--accept-dns={{ tailscale_accept_dns | ternary('true', 'false') }}"
      - "--accept-routes={{ tailscale_accept_routes | ternary('true', 'false') }}"
      - "--netfilter-mode={{ tailscale_netfilter_mode }}"
      - "--ssh={{ tailscale_ssh | ternary('true', 'false') }}"
  become: true
  changed_when: true
  vars:
    tailscale_expected_netfilter_mode: >-
      {{ {'off': 0, 'nodivert': 1, 'on': 2}[tailscale_netfilter_mode] }}
  when:
    - not ansible_check_mode
    - >-
      ((tailscale_preferences_before.stdout | from_json).RunSSH | default(false) | bool) != (tailscale_ssh | bool) or
      ((tailscale_preferences_before.stdout | from_json).CorpDNS | default(false) | bool) != (tailscale_accept_dns | bool) or
      ((tailscale_preferences_before.stdout | from_json).RouteAll | default(false) | bool) != (tailscale_accept_routes | bool) or
      ((tailscale_preferences_before.stdout | from_json).Hostname | default('')) != tailscale_hostname or
      (((tailscale_preferences_before.stdout | from_json).AdvertiseRoutes | default([], true)) | sort) != (tailscale_advertise_routes | sort) or
      ((tailscale_preferences_before.stdout | from_json).NetfilterMode | default(0) | int) != (tailscale_expected_netfilter_mode | int)

- name: Verify Tailscale reaches the running backend state
  ansible.builtin.command:
    argv:
      - /usr/bin/tailscale
      - status
      - --json
  register: tailscale_status_after
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Verify the host has a Tailscale IPv4 address
  ansible.builtin.command:
    argv:
      - /usr/bin/tailscale
      - ip
      - --4
  register: tailscale_ipv4
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Assert local Tailscale verification passed
  ansible.builtin.assert:
    that:
      - (tailscale_status_after.stdout | from_json).BackendState == 'Running'
      - tailscale_ipv4.stdout | length > 0
      - tailscale_advertise_tags in ((tailscale_status_after.stdout | from_json).Self.Tags | default([]))
    fail_msg: >-
      Tailscale did not reach Running with the expected IPv4 address and device tag. Keep LAN SSH and Proxmox console recovery available.
  no_log: true
  when: not ansible_check_mode

- name: Report deferred Tailscale changes during check mode
  ansible.builtin.debug:
    msg: >-
      Check mode never starts tailscaled, consumes an auth key, enrolls the host, or enables Tailscale SSH.
      Those management-plane changes require a separately approved normal bootstrap.
  when: ansible_check_mode
