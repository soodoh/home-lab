---
- name: Require inactive Debian and the closed declaration tag API
  ansible.builtin.assert:
    that:
      - lifecycle_contract_host == 'debian'
      - lifecycle_profile in ['inert', 'recovery']
      - (ansible_run_tags | list) in [['docker'], ['compose']]
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture == debian.baseline.architecture
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == debian.version
      - ansible_facts.distribution_release == debian.release
    fail_msg: Workload declarations require inactive Debian and one explicit docker or compose tag, even in check mode.

# Schema constants delimit the supported renderer, not a second desired state.
# Render only the loaded contract after matching its exact supported grammar.
- name: Bind every declaration field and reused command and graph to supported contract policy
  ansible.builtin.assert:
    that:
      - debian.systemd == (lookup('ansible.builtin.file', playbook_dir ~ '/../../infrastructure/contract/schema.json') | from_json).properties.debian.properties.systemd.const
      - debian.transaction.compose_command == (lookup('ansible.builtin.file', playbook_dir ~ '/../../infrastructure/contract/schema.json') | from_json).properties.debian.properties.transaction.properties.compose_command.const
      - debian.transaction.production_systemd_dependencies == (lookup('ansible.builtin.file', playbook_dir ~ '/../../infrastructure/contract/schema.json') | from_json).properties.debian.properties.transaction.properties.production_systemd_dependencies.const
      - debian.transaction.compose_artifact_path == debian.transaction.compose_command[9]
      - debian.transaction.compose_artifact_path | dirname == debian.transaction.compose_command[5]
      - debian.transaction.storage_activation_path == '/etc/home-lab/allow-storage-activation'
      - lookup('ansible.builtin.file', role_path ~ '/../' ~ debian.systemd.assets.guard_helper.source, rstrip=False) | hash('sha256') == debian.systemd.guard.sha256
      - lookup('ansible.builtin.file', role_path ~ '/../' ~ debian.systemd.assets.guard_helper.source, rstrip=False) | length == debian.systemd.guard.size
    fail_msg: Unsupported declaration policy, descriptor, command, graph or retained helper; no unbound fields or directive injection are admitted.

- name: Bind the bounded system unit search topology
  ansible.builtin.set_fact:
    unit_declaration_roots:
      - /etc/systemd/system.control
      - /run/systemd/system.control
      - /run/systemd/transient
      - /run/systemd/generator.early
      - /etc/systemd/system
      - /etc/systemd/system.attached
      - /run/systemd/system
      - /run/systemd/system.attached
      - /run/systemd/generator
      - /usr/local/lib/systemd/system
      - /usr/lib/systemd/system
      - /run/systemd/generator.late

- name: Refuse redirected search topology
  ansible.builtin.assert:
    that:
      - unit_declaration_roots == ['/etc/systemd/system.control', '/run/systemd/system.control', '/run/systemd/transient', '/run/systemd/generator.early', '/etc/systemd/system', '/etc/systemd/system.attached', '/run/systemd/system', '/run/systemd/system.attached', '/run/systemd/generator', '/usr/local/lib/systemd/system', '/usr/lib/systemd/system', '/run/systemd/generator.late']
    fail_msg: Overriding the bounded unit search topology is forbidden.

# Pathname checks assume cooperating trusted ancestry and the existing host lock.
# stat follow:false is not descriptor confinement (symlink metadata may resolve paths).
- name: Inspect declaration ancestry metadata without content probes
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ ['/', '/etc', '/etc/systemd', '/etc/home-lab', '/run', '/run/systemd', '/var', '/var/lib', '/var/lib/home-lab', '/usr', '/usr/local', '/usr/local/sbin', '/usr/local/lib', '/usr/local/lib/systemd', '/usr/lib', '/usr/lib/systemd'] + unit_declaration_roots }}"
  register: unit_declaration_ancestry
  become: true

- name: Require trusted ancestry without repairing missing parents
  ansible.builtin.assert:
    that:
      - item.stat.exists or item.item not in ['/', '/etc', '/etc/systemd', '/etc/systemd/system', '/run', '/run/systemd', '/var', '/var/lib', '/usr', '/usr/local', '/usr/local/sbin', '/usr/lib', '/usr/lib/systemd', '/usr/lib/systemd/system']
      - >-
        not item.stat.exists or
        (item.stat.isdir and not item.stat.islnk and item.stat.uid == 0 and item.stat.gid == 0 and
         item.stat.mode in ['0755', '0750', '0700'])
    fail_msg: Declaration ancestry is absent or unsafe; ordinary declarations cannot repair topology.
  loop: "{{ unit_declaration_ancestry.results }}"

- name: Inspect manager unit search roots
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, show, --property=UnitPath]
  register: unit_declaration_unit_path
  changed_when: false
  check_mode: false

- name: Require supported manager search roots
  ansible.builtin.assert:
    that:
      - unit_declaration_unit_path.rc == 0
      - unit_declaration_unit_path.stdout_lines | length == 1
      - unit_declaration_unit_path.stdout is match('^UnitPath=/')
      - unit_declaration_unit_path.stdout[9:].split() | difference(unit_declaration_roots + ['/lib/systemd/system']) | length == 0
      - "'/etc/systemd/system' in unit_declaration_unit_path.stdout[9:].split()"
    fail_msg: Unsupported UnitPath; bounded discovery cannot establish absence.

- name: Inspect the optional merged usr alias metadata
  ansible.builtin.stat:
    path: /lib
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: unit_declaration_lib_alias
  when: "'/lib/systemd/system' in unit_declaration_unit_path.stdout[9:].split()"

- name: Require the exact merged usr alias
  ansible.builtin.assert:
    that:
      - unit_declaration_lib_alias.stat.exists
      - unit_declaration_lib_alias.stat.islnk
      - unit_declaration_lib_alias.stat.uid == 0
      - unit_declaration_lib_alias.stat.gid == 0
      - unit_declaration_lib_alias.stat.lnk_target == 'usr/lib'
    fail_msg: Only the exact root owned merged usr alias is supported.
  when: "'/lib/systemd/system' in unit_declaration_unit_path.stdout[9:].split()"

- name: Discover unit root entries using bounded metadata only
  ansible.builtin.find:
    paths: "{{ item.item }}"
    recurse: false
    file_type: any
    hidden: true
    follow: false
  loop: "{{ unit_declaration_ancestry.results }}"
  when: item.item in unit_declaration_roots and item.stat.exists
  register: unit_declaration_root_entries
  become: true

- name: Require complete root metadata discovery
  ansible.builtin.assert:
    that:
      - item.skipped_paths | default({}) | length == 0
    fail_msg: Incomplete unit root discovery is not absence evidence.
  loop: "{{ unit_declaration_root_entries.results }}"
  when: not (item.skipped | default(false))

- name: Refuse competing fragments and applicable type prefix and exact overrides
  ansible.builtin.assert:
    that:
      - item.path | basename not in ['service.d', 'socket.d', 'home-.service.d', 'home-lab-.service.d', 'home-lab-production-.service.d', 'home-lab-production-guard.service.d', 'home-lab-compose.service.d', 'docker.socket.d']
      - item.path | basename != 'docker.service.d' or item.path == '/etc/systemd/system/docker.service.d'
      - item.path | basename not in ['home-lab-production-guard.service', 'home-lab-compose.service'] or item.path | dirname == '/etc/systemd/system'
      - item.path | basename not in debian.systemd.vendor_units or item.path == debian.systemd.vendor_units[item.path | basename]
    fail_msg: Foreign fragment or applicable override requires separate review; capability drop ins are deliberately not admitted here.
  loop: "{{ unit_declaration_root_entries.results | selectattr('files', 'defined') | map(attribute='files') | flatten }}"

- name: Inspect the sole supported drop in directory metadata
  ansible.builtin.stat:
    path: /etc/systemd/system/docker.service.d
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: unit_declaration_drop_directory
  become: true

- name: Require an absent or safe named drop in directory
  ansible.builtin.assert:
    that:
      - >-
        not unit_declaration_drop_directory.stat.exists or
        (unit_declaration_drop_directory.stat.isdir and not unit_declaration_drop_directory.stat.islnk and
         unit_declaration_drop_directory.stat.uid == 0 and unit_declaration_drop_directory.stat.gid == 0 and
         unit_declaration_drop_directory.stat.mode == '0755')
    fail_msg: Unsafe Docker drop in directory; no repair is allowed.

- name: Discover the existing named drop in directory metadata
  ansible.builtin.find:
    paths: /etc/systemd/system/docker.service.d
    recurse: false
    file_type: any
    hidden: true
    follow: false
  register: unit_declaration_drop_entries
  when: unit_declaration_drop_directory.stat.exists
  become: true

- name: Require complete discovery of only the retained Docker drop in
  ansible.builtin.assert:
    that:
      - unit_declaration_drop_entries.skipped_paths | default({}) | length == 0
      - unit_declaration_drop_entries.files | map(attribute='path') | difference([debian.systemd.assets.docker_dependencies.path]) | length == 0
    fail_msg: Foreign or capability Docker drop in requires separate review; declarations must precede capability installation.
  when: unit_declaration_drop_directory.stat.exists

- name: Require safe pull in directories before bounded second level discovery
  ansible.builtin.assert:
    that:
      - item.isdir
      - not item.islnk
      - item.uid == 0
      - item.gid == 0
      - item.mode in ['0755', '0750', '0700']
    fail_msg: Unsafe systemd pull in directory.
  loop: "{{ unit_declaration_root_entries.results | selectattr('files', 'defined') | map(attribute='files') | flatten }}"
  when: item.path is match('.*\.(wants|requires|upholds)$')

- name: Discover pull in entry metadata without recursion
  ansible.builtin.find:
    paths: "{{ item.path }}"
    recurse: false
    file_type: any
    hidden: true
    follow: false
  loop: "{{ unit_declaration_root_entries.results | selectattr('files', 'defined') | map(attribute='files') | flatten }}"
  when: item.path is match('.*\.(wants|requires|upholds)$')
  register: unit_declaration_pull_ins
  become: true

- name: Require complete pull in discovery
  ansible.builtin.assert:
    that:
      - item.skipped_paths | default({}) | length == 0
    fail_msg: Incomplete pull in discovery is not absence evidence.
  loop: "{{ unit_declaration_pull_ins.results }}"
  when: not (item.skipped | default(false))

- name: Refuse named pull in entries including dangling enable links
  ansible.builtin.assert:
    that:
      - item.path | basename not in ['docker.service', 'docker.socket', 'home-lab-compose.service', 'home-lab-production-guard.service']
    fail_msg: Workload or guard pull in entry exists, even if its target is absent or unloaded.
  loop: "{{ unit_declaration_pull_ins.results | selectattr('files', 'defined') | map(attribute='files') | flatten }}"

- name: Inspect discovered symlink metadata for differently named aliases
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ (unit_declaration_root_entries.results + unit_declaration_pull_ins.results) | selectattr('files', 'defined') | map(attribute='files') | flatten }}"
  when: item.islnk | default(false)
  register: unit_declaration_aliases
  become: true

- name: Refuse discovered aliases to protected workload names
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.islnk
      - item.stat.lnk_target | basename not in ['docker.service', 'docker.socket', 'home-lab-compose.service', 'home-lab-production-guard.service']
      - item.stat.lnk_source | basename not in ['docker.service', 'docker.socket', 'home-lab-compose.service', 'home-lab-production-guard.service']
    fail_msg: Workload alias or unstable symlink metadata requires separate review.
  loop: "{{ unit_declaration_aliases.results }}"
  when: not (item.skipped | default(false))

- name: Inspect only Home Lab declaration content digests
  ansible.builtin.stat:
    path: "{{ item.value.path }}"
    follow: false
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  loop: "{{ debian.systemd.assets | dict2items }}"
  register: unit_declaration_assets
  become: true

- name: Require absent or exact existing Home Lab declaration bytes and metadata
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists or
        (item.stat.isreg and not item.stat.islnk and item.stat.nlink == 1 and
         item.stat.uid == 0 and item.stat.gid == 0 and item.stat.mode == item.item.value.mode and
         item.stat.checksum == lookup('ansible.builtin.file' if item.item.key == 'guard_helper' else 'ansible.builtin.template', role_path ~ '/../' ~ item.item.value.source, rstrip=False) | hash('sha256'))
    fail_msg: Existing Home Lab declaration differs; divergent or unsafe files are never replaced or repaired.
  loop: "{{ unit_declaration_assets.results }}"

- name: Inspect designated vendor fragment metadata only
  ansible.builtin.stat:
    path: "{{ item.value }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ debian.systemd.vendor_units | dict2items }}"
  register: unit_declaration_vendors
  become: true

- name: Require absent or safe designated vendor fragments without claiming package identity
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists or
        (item.stat.isreg and not item.stat.islnk and item.stat.nlink == 1 and
         item.stat.uid == 0 and item.stat.gid == 0 and item.stat.mode == '0644')
    fail_msg: Unsafe designated vendor fragment; only path ownership and inactivity can be admitted, not vendor body or package identity.
  loop: "{{ unit_declaration_vendors.results }}"

- name: Inspect guard workload and vendor socket manager state immediately before publication
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --property=SubState
      - --property=UnitFileState
      - --property=FragmentPath
      - --property=DropInPaths
      - --property=Names
      - --property=Job
      - "{{ item }}"
  loop: [home-lab-production-guard.service, home-lab-compose.service, docker.service, docker.socket]
  register: unit_declaration_loaded
  changed_when: false
  check_mode: false

- name: Require inactive unaliased unqueued manager state and consistent designated fragments
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout_lines | length == 8
      - "'ActiveState=inactive' in item.stdout_lines"
      - "'SubState=dead' in item.stdout_lines"
      - "'Job=' in item.stdout_lines"
      - "('Names=' ~ item.item) in item.stdout_lines"
      - >-
        'DropInPaths=' in item.stdout_lines or
        (item.item == 'docker.service' and (unit_declaration_assets.results | selectattr('item.key', 'equalto', 'docker_dependencies') | map(attribute='stat.exists') | first) and
         ('DropInPaths=' ~ debian.systemd.assets.docker_dependencies.path) in item.stdout_lines)
      - >-
        ('LoadState=not-found' in item.stdout_lines and 'UnitFileState=' in item.stdout_lines and 'FragmentPath=' in item.stdout_lines and
         (unit_index < 2 or not (unit_declaration_vendors.results | selectattr('item.key', 'equalto', item.item) | map(attribute='stat.exists') | first))) or
        ('LoadState=loaded' in item.stdout_lines and
         ('UnitFileState=static' if unit_index == 0 else 'UnitFileState=disabled') in item.stdout_lines and
         (('FragmentPath=' ~ debian.systemd.assets.guard_unit.path) in item.stdout_lines and (unit_declaration_assets.results | selectattr('item.key', 'equalto', 'guard_unit') | map(attribute='stat.exists') | first) if unit_index == 0 else
          ('FragmentPath=' ~ debian.systemd.assets.compose_unit.path) in item.stdout_lines and (unit_declaration_assets.results | selectattr('item.key', 'equalto', 'compose_unit') | map(attribute='stat.exists') | first) if unit_index == 1 else
          ('FragmentPath=' ~ debian.systemd.vendor_units[item.item]) in item.stdout_lines and (unit_declaration_vendors.results | selectattr('item.key', 'equalto', item.item) | map(attribute='stat.exists') | first)))
      - item.item != 'docker.service' or 'LoadState=loaded' in item.stdout_lines or 'DropInPaths=' in item.stdout_lines
    fail_msg: Unit is active cached enabled masked aliased queued foreign or inconsistent; disk declarations are not loaded readiness.
  loop: "{{ unit_declaration_loaded.results }}"
  loop_control:
    index_var: unit_index

- name: Inspect only gate absence metadata after all declaration admission
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - "{{ debian.transaction.storage_activation_path }}"
    - /var/lib/home-lab/debian-production-activation.json
    - /run/home-lab-production-transaction
  register: unit_declaration_gates
  become: true

- name: Require all activation gates absent without reading or manufacturing them
  ansible.builtin.assert:
    that: [not item.stat.exists]
    fail_msg: Activation gate metadata exists; ordinary declarations cannot read adopt create or remove gates.
  loop: "{{ unit_declaration_gates.results }}"
