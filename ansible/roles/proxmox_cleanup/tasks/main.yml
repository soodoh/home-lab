---
- name: Record destructive cleanup and exact kernel retention policy
  ansible.builtin.set_fact:
    proxmox_cleanup_requested: >-
      {{ ansible_check_mode or (proxmox_cleanup_migration_confirmed | bool) }}
    proxmox_cleanup_retained_kernel_releases: >-
      {{ [proxmox.kernels.current, proxmox.kernels.fallback] | unique | list }}
    proxmox_cleanup_distinct_fallback: >-
      {{ proxmox.kernels.current != proxmox.kernels.fallback }}
    proxmox_cleanup_fallback_evidence:
      rc: 0

- name: Search boot history for the exact fallback kernel
  ansible.builtin.shell: |
    set -euo pipefail
    while read -r boot _; do
      /usr/bin/journalctl -b "$boot" -k --no-pager |
        /usr/bin/grep -F -m1 "Linux version {{ proxmox.kernels.fallback }} " && exit 0
    done < <(/usr/bin/journalctl --list-boots --no-pager --no-legend)
    exit 1
  args:
    executable: /bin/bash
  register: proxmox_cleanup_fallback_evidence
  failed_when: false
  changed_when: false
  check_mode: false
  when: proxmox_cleanup_distinct_fallback | bool

- name: Inspect the verified fallback marker
  ansible.builtin.stat:
    path: "{{ proxmox_cleanup_fallback_marker }}"
    get_checksum: false
  register: proxmox_cleanup_fallback_state

- name: Read the verified fallback marker
  ansible.builtin.slurp:
    src: "{{ proxmox_cleanup_fallback_marker }}"
  register: proxmox_cleanup_fallback_marker_content
  when: proxmox_cleanup_fallback_state.stat.isreg | default(false)

- name: Validate the fallback marker against the exact contract release
  ansible.builtin.set_fact:
    proxmox_cleanup_fallback_marker_valid: >-
      {{ not (proxmox_cleanup_distinct_fallback | bool) or
         (proxmox_cleanup_fallback_state.stat.isreg | default(false) and
          (proxmox_cleanup_fallback_marker_content.content | default('') | b64decode | trim) ==
          'fallback=' ~ proxmox.kernels.fallback) }}

- name: Require evidence before accepting the exact fallback kernel
  ansible.builtin.assert:
    that:
      - recovery_console_confirmed | default(false) | bool
      - >-
        proxmox_cleanup_fallback_evidence.rc == 0 or
        ansible_facts.kernel == proxmox.kernels.fallback
    fail_msg: "Fallback verification requires boot-history proof or a console-backed boot into the exact fallback kernel."
  when:
    - not ansible_check_mode
    - proxmox_cleanup_fallback_verification_confirmed | bool
    - proxmox_cleanup_distinct_fallback | bool

- name: Ensure the home-lab state directory exists for fallback evidence
  ansible.builtin.file:
    path: "{{ proxmox_cleanup_fallback_marker | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when:
    - not ansible_check_mode
    - proxmox_cleanup_fallback_verification_confirmed | bool
    - proxmox_cleanup_distinct_fallback | bool

- name: Record the exact verified fallback kernel
  ansible.builtin.copy:
    dest: "{{ proxmox_cleanup_fallback_marker }}"
    owner: root
    group: root
    mode: "0640"
    content: "fallback={{ proxmox.kernels.fallback }}\n"
  when:
    - not ansible_check_mode
    - proxmox_cleanup_fallback_verification_confirmed | bool
    - proxmox_cleanup_distinct_fallback | bool
    - >-
      proxmox_cleanup_fallback_evidence.rc == 0 or
      ansible_facts.kernel == proxmox.kernels.fallback

- name: Report fallback verification drift in check mode
  ansible.builtin.debug:
    msg: "Exact fallback kernel {{ proxmox.kernels.fallback }} still requires reviewed boot-history or boot-test evidence."
  changed_when: true
  when:
    - ansible_check_mode
    - not (proxmox_cleanup_fallback_marker_valid | bool)
    - proxmox_cleanup_distinct_fallback | bool

- name: Inspect VM 100 before destructive cleanup
  ansible.builtin.command:
    argv:
      - /usr/sbin/qm
      - status
      - "{{ proxmox.vm.vmid }}"
  register: proxmox_cleanup_vm_state
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - proxmox_cleanup_migration_confirmed | bool

- name: Inspect required post-reboot validation evidence
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop:
    - "{{ proxmox_cleanup_storage_validation_marker }}"
    - "{{ proxmox_cleanup_passthrough_validation_marker }}"
  register: proxmox_cleanup_post_reboot_evidence
  when:
    - not ansible_check_mode
    - proxmox_cleanup_migration_confirmed | bool

- name: Require all destructive cleanup safety gates
  ansible.builtin.assert:
    that:
      - recovery_console_confirmed | default(false) | bool
      - "'status: stopped' in proxmox_cleanup_vm_state.stdout"
      - ansible_facts.kernel == proxmox.kernels.current
      - >-
        not (proxmox_cleanup_distinct_fallback | bool) or
        proxmox_cleanup_fallback_marker_valid | bool or
        (proxmox_cleanup_fallback_verification_confirmed | bool and
         (proxmox_cleanup_fallback_evidence.rc == 0 or
          ansible_facts.kernel == proxmox.kernels.fallback))
      - proxmox_cleanup_post_reboot_evidence.results | map(attribute='stat.isreg') | min
    fail_msg: "Cleanup requires stopped VM 100, the pinned current kernel, verified fallback, console access, and ZFS/VFIO post-reboot evidence."
  when:
    - not ansible_check_mode
    - proxmox_cleanup_migration_confirmed | bool

- name: Preserve infrastructure-critical root paths
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop: "{{ proxmox.root_cleanup.preserve_paths }}"
  register: proxmox_cleanup_preserved_paths

- name: Require every infrastructure-critical root path
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Required preserved path {{ item.item }} is missing."
  loop: "{{ proxmox_cleanup_preserved_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Preserve exact Proxmox token files
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop:
    - /root/.config/home-lab/proxmox-plan-token.env
    - /root/.config/home-lab/proxmox-apply-token.env
  register: proxmox_cleanup_token_files

- name: Require protected Proxmox token files
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.mode == '0600'
    fail_msg: "Protected Proxmox token file {{ item.item }} is missing or has unsafe permissions."
  loop: "{{ proxmox_cleanup_token_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Remove only contract-listed prohibited packages
  ansible.builtin.apt:
    name: "{{ proxmox.packages.prohibited }}"
    state: absent
    purge: true
    autoremove: false
  when: proxmox_cleanup_requested | bool

- name: Remove only known root-local legacy paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ proxmox.root_cleanup.remove_paths }}"
  when: proxmox_cleanup_requested | bool

- name: Reset root to the approved standard shell
  ansible.builtin.user:
    name: root
    shell: "{{ proxmox.root_cleanup.approved_shell }}"
  when: proxmox_cleanup_requested | bool

- name: Install matching headers for every retained kernel
  ansible.builtin.apt:
    name: "proxmox-headers-{{ item }}"
    state: present
  loop: "{{ proxmox_cleanup_retained_kernel_releases }}"
  when:
    - not ansible_check_mode
    - proxmox_cleanup_migration_confirmed | bool

- name: Identify package owners for exact retained kernels and headers
  ansible.builtin.shell: |
    set -euo pipefail
    for release in {{ proxmox_cleanup_retained_kernel_releases | map('quote') | join(' ') }}; do
      image="/boot/vmlinuz-$release"
      [[ -e $image ]]
      image_owner=$(/usr/bin/dpkg-query -S "$image" | /usr/bin/sed 's/: \/.*//')
      header_path=$(/usr/bin/find /usr/src -maxdepth 1 -type d -name "*${release}*" -print -quit)
      [[ -n $header_path ]]
      header_owner=$(/usr/bin/dpkg-query -S "$header_path" | /usr/bin/sed 's/: \/.*//')
      printf '%s\t%s\n' "$release" "$image_owner"
      printf '%s\t%s\n' "$release" "$header_owner"
    done
  args:
    executable: /bin/bash
  register: proxmox_cleanup_retained_kernel_owners
  failed_when: false
  changed_when: false
  check_mode: false

- name: Report missing exact kernel or matching header ownership
  ansible.builtin.debug:
    msg: "Every exact retained kernel image and matching header must be installed before pruning."
  changed_when: true
  when:
    - ansible_check_mode
    - proxmox_cleanup_retained_kernel_owners.rc != 0

- name: Require exact retained kernel and header package ownership before pruning
  ansible.builtin.assert:
    that:
      - proxmox_cleanup_retained_kernel_owners.rc == 0
      - >-
        proxmox_cleanup_retained_kernel_owners.stdout_lines | length ==
        (proxmox_cleanup_retained_kernel_releases | length * 2)
    fail_msg: "Exact retained kernel images or matching headers are missing; refusing kernel pruning."
  when:
    - not ansible_check_mode
    - proxmox_cleanup_migration_confirmed | bool

- name: Inventory all installed Proxmox and generic kernel packages
  ansible.builtin.shell: |
    set -euo pipefail
    /usr/bin/dpkg-query -W -f='${binary:Package}\t${db:Status-Status}\n' \
      'proxmox-kernel-*' 'proxmox-headers-*' 'linux-image-*' 'linux-headers-*' 2>/dev/null |
      /usr/bin/awk '$2 == "installed" {print $1}' |
      /usr/bin/sort -u || true
  args:
    executable: /bin/bash
  register: proxmox_cleanup_installed_kernel_packages
  changed_when: false
  check_mode: false

- name: Record exact kernel package retention and pruning sets
  ansible.builtin.set_fact:
    proxmox_cleanup_retained_kernel_packages: >-
      {{ proxmox_cleanup_retained_kernel_owners.stdout_lines |
         default([]) |
         map('split', '\t') |
         map('last') |
         unique |
         list }}
    proxmox_cleanup_kernel_packages_to_remove: >-
      {{ proxmox_cleanup_installed_kernel_packages.stdout_lines |
         difference(
           proxmox_cleanup_retained_kernel_owners.stdout_lines |
           default([]) |
           map('split', '\t') |
           map('last') |
           unique |
           list
         ) }}

- name: Report old Proxmox and generic kernel packages in check mode
  ansible.builtin.debug:
    msg: "Kernel packages require pruning: {{ proxmox_cleanup_kernel_packages_to_remove }}"
  changed_when: true
  when:
    - ansible_check_mode
    - proxmox_cleanup_kernel_packages_to_remove | length > 0

- name: Remove only kernel packages outside the exact retained owner set
  ansible.builtin.apt:
    name: "{{ proxmox_cleanup_kernel_packages_to_remove }}"
    state: absent
    purge: true
    autoremove: false
  register: proxmox_cleanup_kernel_prune
  when:
    - not ansible_check_mode
    - proxmox_cleanup_migration_confirmed | bool
    - proxmox_cleanup_kernel_packages_to_remove | length > 0

- name: Regenerate initramfs after kernel pruning
  ansible.builtin.command:
    argv:
      - /usr/sbin/update-initramfs
      - -u
      - -k
      - all
  changed_when: true
  when:
    - not ansible_check_mode
    - proxmox_cleanup_kernel_prune.changed | default(false)

- name: Refresh Proxmox boot entries after kernel pruning
  ansible.builtin.command:
    argv:
      - /usr/sbin/proxmox-boot-tool
      - refresh
  changed_when: true
  when:
    - not ansible_check_mode
    - proxmox_cleanup_kernel_prune.changed | default(false)

- name: Refresh GRUB after kernel pruning
  ansible.builtin.command:
    argv:
      - /usr/sbin/update-grub
  changed_when: true
  when:
    - not ansible_check_mode
    - proxmox_cleanup_kernel_prune.changed | default(false)

- name: Inventory final Proxmox kernel boot images
  ansible.builtin.shell: |
    set -o pipefail
    /usr/bin/find /boot -maxdepth 1 -type f -name 'vmlinuz-*-pve' -printf '%f\n' |
      /usr/bin/sed 's/^vmlinuz-//' |
      /usr/bin/sort -u
  args:
    executable: /bin/bash
  register: proxmox_cleanup_boot_images
  changed_when: false
  check_mode: false

- name: Require only exact retained Proxmox boot images
  ansible.builtin.assert:
    that:
      - >-
        proxmox_cleanup_boot_images.stdout_lines | sort ==
        proxmox_cleanup_retained_kernel_releases | sort
    fail_msg: "Proxmox boot images differ from the exact kernel retention policy."
  when:
    - not ansible_check_mode
    - proxmox_cleanup_migration_confirmed | bool

- name: Validate refreshed Proxmox boot synchronization status
  ansible.builtin.command:
    argv:
      - /usr/sbin/proxmox-boot-tool
      - status
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - proxmox_cleanup_migration_confirmed | bool

- name: Inventory manually installed packages
  ansible.builtin.command:
    argv:
      - /usr/bin/apt-mark
      - showmanual
  register: proxmox_cleanup_manual_packages
  changed_when: false
  check_mode: false

- name: Calculate installed dependency closure for approved package seeds
  ansible.builtin.shell: |
    set -o pipefail
    /usr/bin/apt-cache depends --recurse --installed \
      {{ (proxmox.packages.required +
          proxmox.packages.permitted_manual +
          proxmox_cleanup_retained_kernel_packages) | map('quote') | join(' ') }} |
      /usr/bin/awk '/^[^ <|]/ {name=$1; sub(/:[^:]+$/, "", name); print name}' |
      /usr/bin/sort -u
  args:
    executable: /bin/bash
  register: proxmox_cleanup_approved_dependency_packages
  changed_when: false
  check_mode: false

- name: Record unknown manually installed packages
  ansible.builtin.set_fact:
    proxmox_cleanup_unknown_manual_packages: >-
      {{ proxmox_cleanup_manual_packages.stdout_lines |
         difference(
           proxmox.packages.required +
           proxmox.packages.permitted_manual +
           proxmox.packages.prohibited +
           proxmox_cleanup_retained_kernel_packages +
           proxmox_cleanup_approved_dependency_packages.stdout_lines
         ) |
         reject('match', '^(proxmox-(kernel|headers)-|linux-(image|headers)-)') |
         sort }}

- name: Audit root-local paths against explicit preserve and removal policy
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../scripts/controller/audit-root-local-paths.py') }}"
      - --policy-json
      - "{{ proxmox.root_cleanup | to_json }}"
  register: proxmox_cleanup_root_local_audit_json
  changed_when: false
  check_mode: false

- name: Record unknown root-local paths
  ansible.builtin.set_fact:
    proxmox_cleanup_unknown_root_local_paths: >-
      {{ (proxmox_cleanup_root_local_audit_json.stdout | from_json).unknown }}

- name: Fail and report unknown manual packages
  ansible.builtin.assert:
    that:
      - proxmox_cleanup_unknown_manual_packages | length == 0
    fail_msg: "Unknown manually installed packages require contract review: {{ proxmox_cleanup_unknown_manual_packages }}"

- name: Fail and report unknown root-local paths
  ansible.builtin.assert:
    that:
      - proxmox_cleanup_unknown_root_local_paths | length == 0
    fail_msg: "Unknown root-local paths require review and are not deleted: {{ proxmox_cleanup_unknown_root_local_paths }}"
