---
- name: Allow check mode without apply confirmation
  ansible.builtin.assert:
    that:
      - >-
        ansible_check_mode or
        (iac_apply_confirmed | default(false) | ansible.builtin.bool)
    fail_msg: >-
      Refusing a normal run. Use --check for planning. A separately approved apply requires
      -e iac_apply_confirmed=true and exactly one approved -e iac_apply_tag=<tag> matching --tags.

- name: Require Debian production authority
  ansible.builtin.assert:
    that:
      - vm_100.deployment_authority == 'debian'
    fail_msg: >-
      Normal convergence requires Debian to remain VM 100 deployment authority.
  when: not ansible_check_mode

- name: Require one explicitly selected convergence tag for a normal run
  ansible.builtin.assert:
    that:
      - iac_apply_tag | default('') in apply_guard_allowed_tags
      - ansible_run_tags | length == 1
      - iac_apply_tag == ansible_run_tags | first
    fail_msg: >-
      Refusing a broad apply. Select exactly one approved convergence tag and pass the same value as
      -e iac_apply_tag=<tag>.
  when: not ansible_check_mode
