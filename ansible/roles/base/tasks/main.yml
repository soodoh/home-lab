---
- name: Keep approved Debian base packages present without upgrades
  ansible.builtin.include_role:
    name: apt_packages
  vars:
    apt_packages_requested: "{{ base_packages }}"

- name: Set the contracted default Debian locale
  ansible.builtin.copy:
    content: "LANG={{ debian_locale }}\n"
    dest: /etc/locale.conf
    owner: root
    group: root
    mode: '0644'
    backup: false
  become: "{{ not ansible_check_mode }}"

- name: Keep the Debian default locale compatibility link
  ansible.builtin.file:
    path: /etc/default/locale
    src: ../locale.conf
    state: link
    owner: root
    group: root
    force: true
  become: "{{ not ansible_check_mode }}"

- name: Inspect generated Debian locales
  ansible.builtin.command:
    argv:
      - /usr/bin/locale
      - -a
  register: base_generated_locales
  changed_when: false
  check_mode: false

- name: Require the contracted Debian locale
  ansible.builtin.assert:
    that:
      - debian_locale == 'C.UTF-8'
      - "'C.utf8' in base_generated_locales.stdout_lines"
    fail_msg: The contracted Debian locale is unavailable after base convergence.

- name: Resolve timezone mutation ownership
  ansible.builtin.set_fact:
    base_timezone_mutation_authorized: >-
      {{
        inventory_hostname not in (groups.get('proxmox_host', [])) or
        (
          lifecycle.hosts.proxmox.domain_handoffs.timezone.current_owner == 'ansible' and
          lifecycle.hosts.proxmox.domain_handoffs.timezone.state == 'transferred'
        )
      }}
  changed_when: false

- name: Inspect the configured system timezone
  ansible.builtin.command:
    argv:
      - /usr/bin/timedatectl
      - show
      - --property=Timezone
      - --value
  register: base_timezone
  changed_when: false
  check_mode: false

- name: Inspect the contracted timezone definition
  ansible.builtin.stat:
    path: "/usr/share/zoneinfo/{{ system_timezone }}"
    follow: false
  register: base_timezone_definition

- name: Require the contracted timezone definition
  ansible.builtin.assert:
    that:
      - system_timezone == 'America/Los_Angeles'
      - base_timezone_definition.stat.isreg | default(false)
      - not (base_timezone_definition.stat.islnk | default(false))
    fail_msg: The contracted system timezone is unavailable or unsupported.

- name: Report system timezone drift during check mode
  ansible.builtin.debug:
    msg: "System timezone would change from {{ base_timezone.stdout }} to {{ system_timezone }}."
  changed_when: true
  when:
    - ansible_check_mode
    - base_timezone.stdout != system_timezone

- name: Converge the system timezone outside check mode
  ansible.builtin.command:
    argv:
      - /usr/bin/timedatectl
      - set-timezone
      - "{{ system_timezone }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - base_timezone_mutation_authorized | bool
    - base_timezone.stdout != system_timezone

- name: Verify the configured system timezone
  ansible.builtin.command:
    argv:
      - /usr/bin/timedatectl
      - show
      - --property=Timezone
      - --value
  register: base_timezone_verified
  changed_when: false
  check_mode: false

- name: Require the configured system timezone after convergence
  ansible.builtin.assert:
    that:
      - base_timezone_verified.stdout == system_timezone
    fail_msg: The configured system timezone differs from the infrastructure contract.
  when: not ansible_check_mode or base_timezone.stdout == system_timezone

- name: Keep approved base services enabled and started without restarting them
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: false
  become: "{{ not ansible_check_mode }}"
  loop: "{{ base_services }}"
