---
- name: Require the inactive Debian platform and direct baseline bindings before mutation
  ansible.builtin.assert:
    that:
      - lifecycle_contract_host == 'debian'
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == debian.version
      - ansible_facts.distribution_release == debian.release
      - ansible_facts.architecture == debian.baseline.architecture
      - ansible_facts.kernel == debian.qualification.kernel_release
      - debian_locale == debian.locale
      - apt_packages_requested == debian.baseline.packages
      - apt_packages_policy_rc_d is integer
      - apt_packages_policy_rc_d == 101
      - base_services == []
      - >-
        debian_base_hostname ==
        (debian.transaction.qualification_canary_hostname
         if inventory_hostname == debian.transaction.qualification_canary_inventory_host
         else vm_100.host_name)
    fail_msg: Inactive base convergence requires the contracted Debian platform, hostname, package bindings and service-start suppression.

- name: Require image-provided Python APT bindings without bootstrapping dependencies
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -B
      - -c
      - import apt
  changed_when: false
  check_mode: false

- name: Inspect required image packages before package facts or baseline writes
  ansible.builtin.command:
    argv:
      - /usr/bin/dpkg-query
      - --show
      - --showformat=${db:Status-Status}
      - "{{ item }}"
  loop: "{{ debian.baseline.image_packages }}"
  register: base_image_packages
  changed_when: false
  check_mode: false

- name: Require image prerequisites to be fully installed
  ansible.builtin.assert:
    that:
      - item.stdout == 'installed'
    fail_msg: Required Debian image packages are absent or incomplete; baseline convergence cannot bootstrap them.
  loop: "{{ base_image_packages.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Keep inactive Debian baseline packages present under the exact package gate
  ansible.builtin.include_role:
    name: apt_packages

- name: Set the contracted inactive Debian hostname
  ansible.builtin.hostname:
    name: "{{ debian_base_hostname }}"
    use: systemd
  become: "{{ not ansible_check_mode }}"

# The Debian QGA unit is static; do not attempt to enable it or restart it.
- name: Keep the inactive Debian guest agent started without enabling it
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    daemon_reload: false
  become: "{{ not ansible_check_mode }}"
  loop: "{{ debian.baseline.services }}"
