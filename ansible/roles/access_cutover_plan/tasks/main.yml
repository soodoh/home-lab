---
- name: Require Proxmox lifecycle context for access planning
  ansible.builtin.assert:
    that:
      - lifecycle_contract_host == 'proxmox'
      - lifecycle.hosts.proxmox.access_cutover is defined
      - lifecycle_state_observation is defined
    fail_msg: Access cutover planning requires the contracted Proxmox lifecycle observation context.

- name: Observe reduced Proxmox account and transport metadata
  become: true
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import grp
        import hashlib
        import json
        import os
        import pwd
        import stat
        import subprocess
        import sys

        policy = json.loads(sys.argv[1])
        expected = json.loads(sys.argv[2])
        contracted_accounts = {item["name"]: item for item in json.loads(sys.argv[3])}
        names = sorted(set([
            *policy["target_identities"].values(),
            *policy["retire_identities"],
            "root",
        ]))
        environment = {"LC_ALL": "C", "PATH": "/usr/sbin:/usr/bin:/sbin:/bin"}

        def metadata(path):
            try:
                value = os.lstat(path)
            except FileNotFoundError:
                return {"exists": False}
            result = {
                "exists": True,
                "group_gid": value.st_gid,
                "is_regular": stat.S_ISREG(value.st_mode),
                "is_symlink": stat.S_ISLNK(value.st_mode),
                "mode": format(stat.S_IMODE(value.st_mode), "04o"),
                "owner_uid": value.st_uid,
                "size": value.st_size,
            }
            if result["is_regular"] and value.st_size <= 1024 * 1024:
                with open(path, "rb") as handle:
                    result["sha256"] = hashlib.sha256(handle.read()).hexdigest()
            return result

        accounts = []
        for name in names:
            try:
                account = pwd.getpwnam(name)
            except KeyError:
                accounts.append({"exists": False, "name": name})
                continue
            status = subprocess.run(
                ["/usr/bin/passwd", "--status", name],
                stdin=subprocess.DEVNULL,
                capture_output=True,
                text=True,
                env=environment,
                timeout=10,
            )
            fields = status.stdout.split()
            groups = sorted({grp.getgrgid(gid).gr_name for gid in os.getgrouplist(name, account.pw_gid)})
            accounts.append({
                "exists": True,
                "gid": account.pw_gid,
                "groups": groups,
                "home": account.pw_dir,
                "name": name,
                "password_locked": status.returncode == 0 and len(fields) > 1 and fields[1] in {"L", "LK"},
                "shell": account.pw_shell,
                "uid": account.pw_uid,
            })

        sudoers = {
            name: metadata("/etc/sudoers.d/" + name)
            for name in sorted(set(policy["target_identities"].values()) - {"proxmox"})
        }
        account_by_name = {item["name"]: item for item in accounts}
        capabilities = {}
        for name, specification in sorted(expected.items()):
            helpers = {path: metadata(path) for path in sorted(specification["helpers"])}
            helper_matches = all(
                helpers[path].get("exists") is True
                and helpers[path].get("is_regular") is True
                and helpers[path].get("is_symlink") is False
                and helpers[path].get("owner_uid") == 0
                and helpers[path].get("group_gid") == 0
                and helpers[path].get("mode") == "0755"
                and helpers[path].get("sha256") == expected_sha256.strip()
                for path, expected_sha256 in specification["helpers"].items()
            )
            sudo = metadata(specification["sudo_path"])
            contracted_rule = contracted_accounts[specification["account"]]["sudo"]["rule"]
            expected_sudo_sha256 = hashlib.sha256((contracted_rule + "\n").encode()).hexdigest()
            sudo_matches = (
                sudo.get("exists") is True
                and sudo.get("is_regular") is True
                and sudo.get("is_symlink") is False
                and sudo.get("owner_uid") == 0
                and sudo.get("group_gid") == 0
                and sudo.get("mode") == "0440"
                and sudo.get("sha256") == expected_sudo_sha256
            )
            account = account_by_name.get(specification["account"], {})
            account_matches = (
                account.get("exists") is True
                and account.get("password_locked") is True
                and account.get("shell") == specification["shell"]
                and account.get("groups") == [specification["account"]]
            )
            capabilities[name] = {
                "account_matches": account_matches,
                "helpers": helpers,
                "expected_helper_sha256": {path: value.strip() for path, value in specification["helpers"].items()},
                "helpers_match": helper_matches,
                "sudo": sudo,
                "sudo_matches": sudo_matches,
                "verified": account_matches and helper_matches and sudo_matches,
            }
        evidence = {
            "version": 2,
            "accounts": accounts,
            "capabilities": capabilities,
            "sudoers": sudoers,
        }
        canonical = json.dumps(evidence, sort_keys=True, separators=(",", ":")).encode()
        evidence["evidence_sha256"] = hashlib.sha256(canonical).hexdigest()
        print(json.dumps(evidence, sort_keys=True, separators=(",", ":")))
      - "{{ lifecycle.hosts.proxmox.access_cutover | to_json }}"
      - "{{ access_cutover_plan_expected_capabilities | to_json }}"
      - "{{ proxmox.access.service_accounts | to_json }}"
  register: access_cutover_plan_raw
  changed_when: false
  check_mode: false

- name: Decode reduced access evidence
  ansible.builtin.set_fact:
    access_cutover_plan_evidence: "{{ access_cutover_plan_raw.stdout | from_json }}"
    access_cutover_plan_policy: "{{ lifecycle.hosts.proxmox.access_cutover }}"

- name: Publish pending access cutover readiness
  ansible.builtin.set_fact:
    access_cutover_plan_observation:
      version: 1
      policy: "{{ access_cutover_plan_policy }}"
      evidence: "{{ access_cutover_plan_evidence }}"
      conventional_key_files: "{{ lifecycle_state_observation.conventional_authorized_key_files }}"
      sshd: "{{ lifecycle_state_observation.sshd }}"
      target_compliant: "{{ lifecycle_state_observation.target_compliant }}"
      capabilities: "{{ access_cutover_plan_evidence.capabilities }}"
      ready: false
      authorized: false
      blockers: >-
        {{
          (
            (
              ['ansible-plan-account-absent'] if
                access_cutover_plan_evidence.accounts |
                selectattr('name', 'equalto', access_cutover_plan_policy.target_identities.plan) |
                selectattr('exists', 'equalto', false) | list | length == 1
              else []
            ) +
            (
              ['ansible-deploy-account-absent'] if
                access_cutover_plan_evidence.accounts |
                selectattr('name', 'equalto', access_cutover_plan_policy.target_identities.apply) |
                selectattr('exists', 'equalto', false) | list | length == 1
              else []
            ) +
            ([] if lifecycle_state_observation.conventional_authorized_key_files | length == 0 else ['conventional-authorized-keys-present']) +
            ([] if lifecycle_state_observation.sshd.pubkey_authentication == 'no' else ['openssh-pubkey-authentication-enabled']) +
            ([] if lifecycle_state_observation.sshd.permit_root_login == 'no' else ['openssh-root-login-enabled']) +
            (
              ['unexpected-root-supplementary-groups'] if
                (
                  access_cutover_plan_evidence.accounts |
                  selectattr('name', 'equalto', 'root') |
                  map(attribute='groups') | first | difference(['root']) | length
                ) > 0
              else []
            ) +
            ([] if access_cutover_plan_policy.state == 'ready' else ['access-cutover-state-not-ready']) +
            ([] if access_cutover_plan_evidence.capabilities.plan.verified else ['plan-fixed-observer-helper-required']) +
            ([] if access_cutover_plan_evidence.capabilities.deploy.verified else ['deploy-saved-plan-helper-required']) +
            ([] if access_cutover_plan_evidence.capabilities.firewall.verified else ['firewall-fixed-transport-helper-required']) +
            [
              'tailnet-ssh-policy-and-tests-required',
              'root-key-owner-attribution-required',
              'independent-live-session-canaries-required',
              'physical-console-attestation-required',
              'saved-access-cutover-plan-required',
              'separate-access-cutover-authorization-required'
            ]
          ) | unique | list
        }}

- name: Emit pending access cutover readiness
  ansible.builtin.debug:
    var: access_cutover_plan_observation
  when: access_cutover_plan_emit | bool
