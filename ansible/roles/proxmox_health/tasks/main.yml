---
- name: Verify the Proxmox API responds locally
  ansible.builtin.uri:
    url: "{{ proxmox_health_local_api_url }}"
    validate_certs: "{{ proxmox_health_local_api_validate_certs }}"
    status_code: "{{ proxmox_health_local_api_status_codes }}"
  register: proxmox_health_api

- name: Verify direct Tailscale is running
  ansible.builtin.command:
    argv:
      - /usr/bin/tailscale
      - status
      - --json
  register: proxmox_health_tailscale_status
  changed_when: false
  check_mode: false
  no_log: true

- name: Verify VM startup state when required
  ansible.builtin.command:
    argv:
      - /usr/sbin/qm
      - status
      - "{{ proxmox.vm.vmid }}"
  register: proxmox_health_vm
  changed_when: false
  check_mode: false
  when: proxmox_health_require_vm | bool

- name: Verify storage and NFS startup state
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [/usr/sbin/zpool, list, -H, "{{ storage.zfs.pool }}"]
    - [/usr/sbin/exportfs, -s]
  register: proxmox_health_storage_commands
  changed_when: false
  check_mode: false

- name: Assert Proxmox health gates
  ansible.builtin.assert:
    that:
      - (proxmox_health_tailscale_status.stdout | from_json).BackendState == proxmox_health_tailscale_backend_state
      - "not (proxmox_health_require_vm | bool) or 'status: ' ~ proxmox_health_vm_status in proxmox_health_vm.stdout"
      - proxmox_health_storage_commands.results | map(attribute='rc') | max == 0
    fail_msg: "Proxmox API, Tailscale, VM startup, ZFS, or NFS health failed."
  no_log: true
