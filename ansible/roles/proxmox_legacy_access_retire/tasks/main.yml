---
- name: Require the exact attended legacy-access retirement gate
  ansible.builtin.assert:
    that:
      - proxmox_legacy_access_retirement_confirmed | default('') == 'retire-committed-legacy-access'
    fail_msg: Legacy helper and access retirement requires its exact operation gate.

- name: Find retained operation-specific journals without following links
  ansible.builtin.find:
    paths: "{{ item }}"
    patterns: "*.json"
    recurse: true
    file_type: file
    follow: false
  loop:
    - /var/lib/home-lab/boot-configuration-transactions
    - /var/lib/home-lab/boot-ownership-transactions
    - /var/lib/home-lab/zfs-ownership-transactions
    - /var/lib/home-lab/nfs-ownership-transactions
    - /var/lib/home-lab/network-ownership-transactions
    - /var/lib/home-lab/tailscale-ownership-transactions
    - /var/lib/home-lab/package-ownership-transactions
  register: proxmox_legacy_journal_finds
  changed_when: false

- name: Require exactly one retained record in every retired operation domain
  ansible.builtin.assert:
    that:
      - item.matched == 1
    fail_msg: Retained operation journal count changed; stop for recovery review.
  loop: "{{ proxmox_legacy_journal_finds.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: Read retained operation journal status for retirement refusal
  ansible.builtin.slurp:
    src: "{{ item.files[0].path }}"
  loop: "{{ proxmox_legacy_journal_finds.results }}"
  register: proxmox_legacy_journals
  no_log: true

- name: Require every retired operation domain to be committed
  ansible.builtin.assert:
    that:
      - (item.content | b64decode | from_json).status == 'committed'
    fail_msg: A retained operation is not committed; keep the legacy recovery helper.
  loop: "{{ proxmox_legacy_journals.results }}"
  no_log: true

- name: Read package transaction journals without changing them
  ansible.builtin.find:
    paths: /var/lib/home-lab/package-transactions
    patterns: "*.json"
    recurse: false
    file_type: file
    follow: false
  register: proxmox_legacy_package_journal_find
  changed_when: false

- name: Read package transaction statuses for retirement refusal
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ proxmox_legacy_package_journal_find.files }}"
  register: proxmox_legacy_package_journals
  no_log: true

- name: Require only the reviewed committed or prepared package history
  ansible.builtin.assert:
    that:
      - proxmox_legacy_package_journal_find.matched == 4
      - >-
        (proxmox_legacy_package_journals.results |
         map(attribute='content') | map('b64decode') | map('from_json') |
         map(attribute='status') | select('equalto', 'prepared') | list | length) == 1
      - >-
        (proxmox_legacy_package_journals.results |
         map(attribute='content') | map('b64decode') | map('from_json') |
         map(attribute='status') | select('equalto', 'committed') | list | length) == 3
    fail_msg: Package transaction history changed; stop for operation-specific review.
  no_log: true

- name: Verify the persistent operation mutex is not currently held
  ansible.builtin.command:
    argv:
      - /usr/bin/lslocks
      - --json
      - --output
      - PATH
  register: proxmox_legacy_operation_locks
  changed_when: false
  failed_when: >-
    proxmox_legacy_operation_locks.rc != 0 or
    '/var/lib/home-lab/reconciliation/operation.lock' in proxmox_legacy_operation_locks.stdout
  check_mode: false
  no_log: true

- name: Define legacy files retired by this cutover
  ansible.builtin.set_fact:
    proxmox_legacy_retired_files:
      - /usr/local/libexec/home-lab/proxmox-observer
      - /usr/local/libexec/home-lab/proxmox-private-preparer
      - /usr/local/libexec/home-lab/proxmox-ansible-plan-transport
      - /usr/local/libexec/home-lab/proxmox-ansible-deploy-activator
      - /usr/local/libexec/home-lab/proxmox-package-candidate-observer
      - /usr/local/libexec/home-lab/proxmox-controller-observer
      - /usr/local/libexec/home-lab/proxmox-apply-transport
      - /etc/sudoers.d/tofu-plan
      - /etc/sudoers.d/tofu-apply
      - /etc/sudoers.d/ansible-plan
    proxmox_legacy_backup_root: /var/lib/home-lab/legacy-access-retirement/2026-09-16
    proxmox_legacy_retired_checksums:
      /usr/local/libexec/home-lab/proxmox-observer: edb7ff95e6b8bfbfaa0227a07c521c2fe26e1f53e92b29d21d67ea17c4f3553f
      /usr/local/libexec/home-lab/proxmox-private-preparer: 7d667609e11f4b66be75b45c5c04176fc4c6712fdc72e1f6254d220eab494b75
      /usr/local/libexec/home-lab/proxmox-ansible-plan-transport: 7210d4cbf51da161db9946ff95e407ef55775646c9fac4bd1110455bab481522
      /usr/local/libexec/home-lab/proxmox-ansible-deploy-activator: 7d27fafa16e962eb99fe256dd34557a8c234e3651414efd18a3fa370aca8c999
      /usr/local/libexec/home-lab/proxmox-package-candidate-observer: e67e1d05149a35476ab8449f8d369d7f9921fd4474b0508064aaa7c1ef603070
      /etc/sudoers.d/ansible-plan: 40d2e94a05d23d48e3e368b2b059260c08e94ced8815cd2ac23635c869d05166
    proxmox_legacy_original_checksums:
      /usr/local/libexec/home-lab/proxmox-ansible-deploy-transport: 78ea4536a580dce08ffed3edd43a19b77c12407a9ed8d35c2f1bf17a808e8a39
      /etc/sudoers.d/ansible-deploy: e5044677b990c7be9eb6baa87af2247827b7659b71b7f21c54a42e1ef3ec01cd
    proxmox_legacy_desired_checksums:
      /usr/local/libexec/home-lab/proxmox-ansible-deploy-transport: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../infrastructure/proxmox-access/host/proxmox-ansible-deploy-transport', rstrip=false) | hash('sha256') }}"
      /etc/sudoers.d/ansible-deploy: "{{ 'ansible-deploy ALL=(root) NOPASSWD: /usr/local/libexec/home-lab/proxmox-restic-recovery-transport\n' | hash('sha256') }}"
    proxmox_legacy_expected_modes:
      /usr/local/libexec/home-lab/proxmox-observer: '0755'
      /usr/local/libexec/home-lab/proxmox-private-preparer: '0755'
      /usr/local/libexec/home-lab/proxmox-ansible-plan-transport: '0755'
      /usr/local/libexec/home-lab/proxmox-ansible-deploy-activator: '0755'
      /usr/local/libexec/home-lab/proxmox-package-candidate-observer: '0755'
      /usr/local/libexec/home-lab/proxmox-controller-observer: '0755'
      /usr/local/libexec/home-lab/proxmox-apply-transport: '0755'
      /etc/sudoers.d/tofu-plan: '0440'
      /etc/sudoers.d/tofu-apply: '0440'
      /etc/sudoers.d/ansible-plan: '0440'
      /usr/local/libexec/home-lab/proxmox-ansible-deploy-transport: '0755'
      /etc/sudoers.d/ansible-deploy: '0440'
    proxmox_legacy_before_image_checksums:
      proxmox-observer: edb7ff95e6b8bfbfaa0227a07c521c2fe26e1f53e92b29d21d67ea17c4f3553f
      proxmox-private-preparer: 7d667609e11f4b66be75b45c5c04176fc4c6712fdc72e1f6254d220eab494b75
      proxmox-ansible-plan-transport: 7210d4cbf51da161db9946ff95e407ef55775646c9fac4bd1110455bab481522
      proxmox-ansible-deploy-activator: 7d27fafa16e962eb99fe256dd34557a8c234e3651414efd18a3fa370aca8c999
      proxmox-package-candidate-observer: e67e1d05149a35476ab8449f8d369d7f9921fd4474b0508064aaa7c1ef603070
      ansible-plan: 40d2e94a05d23d48e3e368b2b059260c08e94ced8815cd2ac23635c869d05166
      proxmox-ansible-deploy-transport: 78ea4536a580dce08ffed3edd43a19b77c12407a9ed8d35c2f1bf17a808e8a39
      ansible-deploy: e5044677b990c7be9eb6baa87af2247827b7659b71b7f21c54a42e1ef3ec01cd

- name: Read legacy target metadata without following links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    checksum_algorithm: sha256
    get_checksum: true
  loop: "{{ proxmox_legacy_retired_files + ['/usr/local/libexec/home-lab/proxmox-ansible-deploy-transport', '/etc/sudoers.d/ansible-deploy'] }}"
  register: proxmox_legacy_target_stats

- name: Refuse unexpected installed legacy target types or ownership
  ansible.builtin.assert:
    that:
      - not item.stat.exists or item.stat.isreg
      - not item.stat.exists or not item.stat.islnk
      - not item.stat.exists or item.stat.pw_name == 'root'
      - not item.stat.exists or item.stat.gr_name == 'root'
      - not item.stat.exists or item.stat.nlink == 1
      - not item.stat.exists or item.stat.mode == proxmox_legacy_expected_modes[item.item]
      - >-
        not item.stat.exists or
        (item.item in proxmox_legacy_retired_checksums and
         (item.stat.checksum | default('')) == proxmox_legacy_retired_checksums[item.item]) or
        (item.item in proxmox_legacy_original_checksums and
         (item.stat.checksum | default('')) in
         [proxmox_legacy_original_checksums[item.item], proxmox_legacy_desired_checksums[item.item]])
    fail_msg: Installed legacy target identity differs; no file was retired.
  loop: "{{ proxmox_legacy_target_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: Create the permanent root-only retirement before-image directory
  ansible.builtin.file:
    path: "{{ proxmox_legacy_backup_root }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Preserve installed bytes before replacement or unlink
  ansible.builtin.copy:
    src: "{{ item.item }}"
    dest: "{{ proxmox_legacy_backup_root }}/{{ item.item | basename }}"
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "0600"
  loop: "{{ proxmox_legacy_target_stats.results }}"
  when:
    - item.stat.exists
    - not ansible_check_mode
  no_log: true

- name: Read every expected retirement before-image
  ansible.builtin.stat:
    path: "{{ proxmox_legacy_backup_root }}/{{ item.key }}"
    follow: false
    checksum_algorithm: sha256
    get_checksum: true
  loop: "{{ proxmox_legacy_before_image_checksums | dict2items }}"
  register: proxmox_legacy_backup_stats
  no_log: true

- name: Require exact permanent root-only before-images
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.nlink == 1
      - item.stat.mode == '0600'
      - (item.stat.checksum | default('')) == item.item.value
    fail_msg: A retirement before-image differs; no legacy source was unlinked.
  loop: "{{ proxmox_legacy_backup_stats.results }}"
  no_log: true

- name: Read the retained Restic recovery transport identity
  ansible.builtin.stat:
    path: /usr/local/libexec/home-lab/proxmox-restic-recovery-transport
    follow: false
    checksum_algorithm: sha256
    get_checksum: true
  register: proxmox_legacy_recovery_transport

- name: Verify the exact retained Restic recovery transport
  ansible.builtin.assert:
    that:
      - proxmox_legacy_recovery_transport.stat.exists
      - proxmox_legacy_recovery_transport.stat.isreg
      - not proxmox_legacy_recovery_transport.stat.islnk
      - proxmox_legacy_recovery_transport.stat.pw_name == 'root'
      - proxmox_legacy_recovery_transport.stat.gr_name == 'root'
      - proxmox_legacy_recovery_transport.stat.nlink == 1
      - proxmox_legacy_recovery_transport.stat.mode == '0755'
      - (proxmox_legacy_recovery_transport.stat.checksum | default('')) == '186d6adf91649182d063165e50a4ab961968876c8a65254be53b6258bd2e95e1'
    fail_msg: The retained Restic recovery transport identity differs; no sudo capability was published.

- name: Install the Restic-only deploy transport
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../infrastructure/proxmox-access/host/proxmox-ansible-deploy-transport"
    dest: /usr/local/libexec/home-lab/proxmox-ansible-deploy-transport
    owner: root
    group: root
    mode: "0755"
    backup: true
  register: proxmox_legacy_deploy_transport_install

- name: Restrict ansible-deploy sudo to Restic recovery
  ansible.builtin.copy:
    content: "ansible-deploy ALL=(root) NOPASSWD: /usr/local/libexec/home-lab/proxmox-restic-recovery-transport\n"
    dest: /etc/sudoers.d/ansible-deploy
    owner: root
    group: root
    mode: "0440"
    backup: true
    validate: /usr/sbin/visudo -cf %s
  register: proxmox_legacy_deploy_sudo_install

- name: Disable retired plan/apply service-account shells
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /usr/sbin/nologin
    password_lock: true
  loop:
    - tofu-plan
    - tofu-apply
    - ansible-plan

- name: Remove obsolete helpers and sudo grants after preserving before-images
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ proxmox_legacy_retired_files }}"

- name: Re-read retired and retained target metadata
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ proxmox_legacy_retired_files + ['/usr/local/libexec/home-lab/proxmox-ansible-deploy-transport', '/etc/sudoers.d/ansible-deploy'] }}"
  register: proxmox_legacy_post_stats
  when: not ansible_check_mode

- name: Verify exact installed retirement boundary
  ansible.builtin.assert:
    that:
      - >-
        (proxmox_legacy_post_stats.results[:(proxmox_legacy_retired_files | length)] |
         selectattr('stat.exists', 'equalto', true) | list | length) == 0
      - proxmox_legacy_post_stats.results[-2].stat.isreg
      - proxmox_legacy_post_stats.results[-2].stat.mode == '0755'
      - proxmox_legacy_post_stats.results[-2].stat.checksum == proxmox_legacy_deploy_transport_install.checksum
      - proxmox_legacy_post_stats.results[-1].stat.isreg
      - proxmox_legacy_post_stats.results[-1].stat.mode == '0440'
      - proxmox_legacy_post_stats.results[-1].stat.checksum == proxmox_legacy_deploy_sudo_install.checksum
    fail_msg: Installed legacy access retirement postcondition differs.
  when: not ansible_check_mode
