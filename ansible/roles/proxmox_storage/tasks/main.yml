---

- name: Initialize protected storage identity collection
  ansible.builtin.set_fact:
    proxmox_storage_zfs_member_paths: []
  no_log: true
- name: Read each expected storage member identity from the protected environment
  ansible.builtin.set_fact:
    proxmox_storage_zfs_member_paths: "{{ (proxmox_storage_zfs_member_paths | default([])) + [lookup('ansible.builtin.env', item.secret_ref)] }}"
  loop: "{{ storage.zfs.members }}"
  no_log: true

- name: Require all stable storage identities
  ansible.builtin.assert:
    that:
      - proxmox_storage_zfs_member_paths | length == 12
      - proxmox_storage_zfs_member_paths | unique | length == 12
      - proxmox_storage_zfs_member_paths | reject('match', '^/dev/disk/by-id/[A-Za-z0-9._:+-]+$') | list | length == 0
    fail_msg: "All twelve unique SOPS-protected ZFS by-id identities are required."
  no_log: true

- name: Initialize the exact protected mirror topology
  ansible.builtin.set_fact:
    proxmox_storage_expected_mirrors: []
  no_log: true

- name: Group protected storage identities by exact mirror index
  ansible.builtin.set_fact:
    proxmox_storage_expected_mirrors: >-
      {{ proxmox_storage_expected_mirrors +
         [proxmox_storage_zfs_member_paths[(item * 2):(item * 2 + 2)]] }}
  loop: "{{ range(0, 6) | list }}"
  no_log: true

- name: Inspect whether the exact ZFS pool is imported
  ansible.builtin.command:
    argv:
      - /usr/sbin/zpool
      - list
      - -H
      - -o
      - name
      - "{{ storage.zfs.pool }}"
  register: proxmox_storage_zpool_list
  failed_when: false
  changed_when: false
  check_mode: false

- name: Require explicit recovery import authorization
  ansible.builtin.assert:
    that:
      - proxmox_storage_recovery_mode | bool
      - proxmox_storage_recovery_import_confirmed | bool
      - recovery_console_confirmed | default(false) | bool
    fail_msg: "A missing pool can only be imported in explicit console-backed recovery mode."
  when: proxmox_storage_zpool_list.rc != 0

- name: Verify every expected pool member exists before recovery import
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
    get_checksum: false
    get_mime: false
  loop: "{{ proxmox_storage_zfs_member_paths }}"
  register: proxmox_storage_zfs_members
  no_log: true
  when: proxmox_storage_zpool_list.rc != 0

- name: Stop if any expected member is absent
  ansible.builtin.assert:
    that:
      - proxmox_storage_zfs_members.results | map(attribute='stat.exists') | min
    fail_msg: "Expected ZFS member set is incomplete; refusing import."
  no_log: true
  when: proxmox_storage_zpool_list.rc != 0

- name: Import only the exact known pool GUID in recovery mode
  ansible.builtin.command:
    argv:
      - /usr/sbin/zpool
      - import
      - -d
      - /dev/disk/by-id
      - "{{ proxmox_storage_pool_guid }}"
  changed_when: true
  when: proxmox_storage_zpool_list.rc != 0

- name: Record whether runtime pool checks are available
  ansible.builtin.set_fact:
    proxmox_storage_pool_runtime_available: >-
      {{ not ansible_check_mode or proxmox_storage_zpool_list.rc == 0 }}

- name: Read pool health
  ansible.builtin.command:
    argv:
      - /usr/sbin/zpool
      - list
      - -H
      - -o
      - health
      - "{{ storage.zfs.pool }}"
  register: proxmox_storage_zpool_health
  changed_when: false
  check_mode: false
  when: proxmox_storage_pool_runtime_available | bool

- name: Read the imported ZFS pool GUID
  ansible.builtin.command:
    argv:
      - /usr/sbin/zpool
      - get
      - -H
      - -o
      - value
      - guid
      - "{{ storage.zfs.pool }}"
  register: proxmox_storage_zpool_guid
  changed_when: false
  no_log: true
  check_mode: false
  when: proxmox_storage_pool_runtime_available | bool

- name: Read the complete imported ZFS vdev hierarchy
  ansible.builtin.command:
    argv:
      - /usr/sbin/zpool
      - status
      - -P
      - "{{ storage.zfs.pool }}"
  register: proxmox_storage_zpool_status
  changed_when: false
  check_mode: false
  when: proxmox_storage_pool_runtime_available | bool

- name: Parse the ZFS vdev hierarchy without changing the host
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../scripts/controller/parse-zpool-status.py') }}"
      - --pool
      - "{{ storage.zfs.pool }}"
    stdin: "{{ proxmox_storage_zpool_status.stdout }}"
  register: proxmox_storage_zpool_topology_json
  changed_when: false
  check_mode: false
  when: proxmox_storage_pool_runtime_available | bool

- name: Record the parsed protected ZFS topology
  ansible.builtin.set_fact:
    proxmox_storage_zpool_topology: "{{ proxmox_storage_zpool_topology_json.stdout | from_json }}"
  no_log: true
  when: proxmox_storage_pool_runtime_available | bool

- name: Require exactly six online mirror vdevs and no other vdev classes
  ansible.builtin.assert:
    that:
      - proxmox_storage_zpool_topology.pool.state == storage.zfs.expected_health
      - proxmox_storage_zpool_topology.mirrors | length == 6
      - proxmox_storage_zpool_topology.unexpected_data | length == 0
      - proxmox_storage_zpool_topology.extras | dict2items | map(attribute='value') | map('length') | sum == 0
      - "'resilver in progress' not in (proxmox_storage_zpool_topology.scan | lower)"
      - "'removal in progress' not in (proxmox_storage_zpool_topology.scan | lower)"
      - "'replacing' not in (proxmox_storage_zpool_topology.scan | lower)"
    fail_msg: "Protected ZFS pool has an unexpected vdev class, active replacement/removal/resilver, or non-ONLINE state."
  no_log: true
  when: proxmox_storage_pool_runtime_available | bool

- name: Require each exact protected mirror and both leaves to be online
  ansible.builtin.assert:
    that:
      - proxmox_storage_zpool_topology.mirrors[item].name == 'mirror-' ~ (item | string)
      - proxmox_storage_zpool_topology.mirrors[item].state == storage.zfs.expected_health
      - proxmox_storage_zpool_topology.mirrors[item].leaves | length == 2
      - proxmox_storage_zpool_topology.mirrors[item].leaves | map(attribute='state') | unique == [storage.zfs.expected_health]
      - proxmox_storage_zpool_topology.mirrors[item].leaves | map(attribute='name') | sort == proxmox_storage_expected_mirrors[item] | sort
    fail_msg: "ZFS mirror {{ item }} differs from its exact protected two-disk ONLINE grouping."
  loop: "{{ range(0, 6) | list }}"
  no_log: true
  when: proxmox_storage_pool_runtime_available | bool

- name: Require the imported pool GUID
  ansible.builtin.assert:
    that:
      - proxmox_storage_zpool_guid.stdout == proxmox_storage_pool_guid
    fail_msg: "Imported ZFS pool GUID differs from the protected contract."
  no_log: true
  when: proxmox_storage_pool_runtime_available | bool

- name: Calculate the current corrected checksum count
  ansible.builtin.shell: >-
    set -o pipefail &&
    /usr/sbin/zpool status -P {{ storage.zfs.pool }} |
    /usr/bin/awk '/\/dev\/disk\/by-id\// {sum += $5} END {print sum + 0}'
  args:
    executable: /bin/bash
  register: proxmox_storage_zpool_checksum_count
  changed_when: false
  no_log: true
  check_mode: false
  when: proxmox_storage_pool_runtime_available | bool

- name: Block degraded health or increased checksum errors
  ansible.builtin.assert:
    that:
      - proxmox_storage_zpool_health.stdout == storage.zfs.expected_health
      - proxmox_storage_zpool_checksum_count.stdout | int <= storage.zfs.corrected_checksum_baseline
    fail_msg: "ZFS health degraded or corrected checksum count increased; stop all applies."
  when: proxmox_storage_pool_runtime_available | bool

- name: Verify ZFS userspace and kernel module versions align
  ansible.builtin.shell: |
    set -euo pipefail
    userspace=$(/usr/sbin/zfs version | /usr/bin/awk -F- '$1 == "zfs" && $2 != "kmod" {print $2 "-" $3}')
    module=$(/usr/sbin/modinfo -F version zfs)
    [[ -n $userspace && $userspace == "$module" ]]
  args:
    executable: /bin/bash
  register: proxmox_storage_zfs_version_alignment
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true
  when: proxmox_storage_pool_runtime_available | bool

- name: Block routine convergence while ZFS versions mismatch
  ansible.builtin.assert:
    that:
      - proxmox_storage_zfs_version_alignment.rc == 0
    fail_msg: "ZFS userspace/kernel mismatch requires a reviewed package and reboot migration."
  when:
    - proxmox_storage_pool_runtime_available | bool
    - not (proxmox_storage_version_migration_reviewed | default(false) | bool)
    - not ansible_check_mode

- name: Report required ZFS package and reboot migration during check mode
  ansible.builtin.debug:
    msg: "ZFS userspace and kernel-module versions differ; package alignment and a console-backed reboot are required before apply."
  changed_when: true
  when:
    - ansible_check_mode
    - proxmox_storage_pool_runtime_available | bool
    - proxmox_storage_zfs_version_alignment.rc != 0

- name: Inspect the managed PVE storage entry
  ansible.builtin.command:
    argv:
      - /usr/sbin/pvesm
      - status
      - --storage
      - "{{ storage.zfs.pve_storage.id }}"
  register: proxmox_storage_pve_status
  failed_when: false
  changed_when: false
  check_mode: false

- name: Read the managed PVE storage fields
  ansible.builtin.command:
    argv:
      - /usr/bin/pvesh
      - get
      - "/storage/{{ storage.zfs.pve_storage.id }}"
      - --output-format
      - json
  register: proxmox_storage_pve_config_json
  changed_when: false
  check_mode: false
  when: proxmox_storage_pve_status.rc == 0

- name: Record managed PVE storage drift
  ansible.builtin.set_fact:
    proxmox_storage_pve_config: >-
      {{ (proxmox_storage_pve_config_json.stdout | from_json)
         if proxmox_storage_pve_status.rc == 0 else {} }}
    proxmox_storage_pve_drift: >-
      {{ proxmox_storage_pve_status.rc != 0 or
         (proxmox_storage_pve_config_json.stdout | default('{}') | from_json).pool | default('') != storage.zfs.pve_storage.pool or
         (proxmox_storage_pve_config_json.stdout | default('{}') | from_json).mountpoint | default('') != storage.zfs.pve_storage.mountpoint or
         (
           (proxmox_storage_pve_config_json.stdout | default('{}') | from_json).content |
           default('') | split(',') | sort
         ) != (storage.zfs.pve_storage.content | sort) or
         (
           (proxmox_storage_pve_config_json.stdout | default('{}') | from_json).nodes |
           default('') | split(',') | sort
         ) != (storage.zfs.pve_storage.nodes | sort) }}

- name: Refuse to replace an incompatible PVE storage entry
  ansible.builtin.assert:
    that:
      - proxmox_storage_pve_config.type == storage.zfs.pve_storage.type
    fail_msg: "PVE storage ID storage exists with an unexpected type; refusing replacement."
  when: proxmox_storage_pve_status.rc == 0

- name: Report managed PVE storage drift in check mode
  ansible.builtin.debug:
    msg: "PVE storage entry {{ storage.zfs.pve_storage.id }} requires creation or field correction."
  changed_when: true
  when:
    - ansible_check_mode
    - proxmox_storage_pve_drift | bool

- name: Create only the absent protected PVE storage entry
  ansible.builtin.command:
    argv:
      - /usr/sbin/pvesm
      - add
      - "{{ storage.zfs.pve_storage.type }}"
      - "{{ storage.zfs.pve_storage.id }}"
      - --pool
      - "{{ storage.zfs.pve_storage.pool }}"
      - --mountpoint
      - "{{ storage.zfs.pve_storage.mountpoint }}"
      - --content
      - "{{ storage.zfs.pve_storage.content | join(',') }}"
      - --nodes
      - "{{ storage.zfs.pve_storage.nodes | join(',') }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - proxmox_storage_pve_status.rc != 0

- name: Correct only fields on the compatible PVE storage entry
  ansible.builtin.command:
    argv:
      - /usr/sbin/pvesm
      - set
      - "{{ storage.zfs.pve_storage.id }}"
      - --pool
      - "{{ storage.zfs.pve_storage.pool }}"
      - --mountpoint
      - "{{ storage.zfs.pve_storage.mountpoint }}"
      - --content
      - "{{ storage.zfs.pve_storage.content | join(',') }}"
      - --nodes
      - "{{ storage.zfs.pve_storage.nodes | join(',') }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - proxmox_storage_pve_status.rc == 0
    - proxmox_storage_pve_drift | bool

- name: Re-read the managed PVE storage entry after mutation
  ansible.builtin.command:
    argv:
      - /usr/bin/pvesh
      - get
      - "/storage/{{ storage.zfs.pve_storage.id }}"
      - --output-format
      - json
  register: proxmox_storage_pve_final_json
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Validate the final managed PVE storage fields
  ansible.builtin.assert:
    that:
      - (proxmox_storage_pve_final_json.stdout | from_json).type == storage.zfs.pve_storage.type
      - (proxmox_storage_pve_final_json.stdout | from_json).pool == storage.zfs.pve_storage.pool
      - (proxmox_storage_pve_final_json.stdout | from_json).mountpoint == storage.zfs.pve_storage.mountpoint
      - >-
        ((proxmox_storage_pve_final_json.stdout | from_json).content | split(',') | sort) ==
        (storage.zfs.pve_storage.content | sort)
      - >-
        ((proxmox_storage_pve_final_json.stdout | from_json).nodes | split(',') | sort) ==
        (storage.zfs.pve_storage.nodes | sort)
    fail_msg: "Managed PVE storage fields did not converge."
  when: not ansible_check_mode

- name: Stage the contract ZFS ARC maximum for the next boot
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    owner: root
    group: root
    mode: "0644"
    content: "options zfs zfs_arc_max={{ storage.zfs.arc_max_bytes }}\n"
  notify: Rebuild Proxmox initramfs

- name: Inspect completion of ZFS post-reboot validation
  ansible.builtin.stat:
    path: "{{ proxmox_storage_validation_marker }}"
    get_checksum: false
  register: proxmox_storage_validation_state

- name: Record whether ZFS runtime validation is required
  ansible.builtin.set_fact:
    proxmox_storage_validate_runtime: >-
      {{ proxmox_storage_post_reboot_validation | bool or
         proxmox_storage_validation_state.stat.isreg | default(false) }}

- name: Read the effective ZFS ARC maximum
  ansible.builtin.slurp:
    src: /sys/module/zfs/parameters/zfs_arc_max
  register: proxmox_storage_effective_arc_max
  when: proxmox_storage_pool_runtime_available | bool

- name: Report a staged ARC value that still requires a controlled reboot
  ansible.builtin.debug:
    msg: "ZFS ARC maximum is staged but not effective; a separately approved controlled reboot is required."
  changed_when: true
  when:
    - proxmox_storage_pool_runtime_available | bool
    - proxmox_storage_effective_arc_max.content | b64decode | trim | int != storage.zfs.arc_max_bytes

- name: Validate the effective ARC maximum after the controlled reboot
  ansible.builtin.assert:
    that:
      - proxmox_storage_effective_arc_max.content | b64decode | trim | int == storage.zfs.arc_max_bytes
    fail_msg: "The running ZFS module does not use the contract ARC maximum."
  when:
    - proxmox_storage_pool_runtime_available | bool
    - proxmox_storage_validate_runtime | bool

- name: Ensure the home-lab state directory exists for ZFS validation
  ansible.builtin.file:
    path: "{{ proxmox_storage_validation_marker | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when:
    - not ansible_check_mode
    - proxmox_storage_post_reboot_validation | bool

- name: Record successful ZFS post-reboot validation
  ansible.builtin.copy:
    dest: "{{ proxmox_storage_validation_marker }}"
    owner: root
    group: root
    mode: "0640"
    content: "kernel={{ ansible_facts.kernel }} arc_max={{ storage.zfs.arc_max_bytes }}\n"
  when:
    - not ansible_check_mode
    - proxmox_storage_post_reboot_validation | bool
    - proxmox_storage_pool_runtime_available | bool
    - proxmox_storage_effective_arc_max.content | b64decode | trim | int == storage.zfs.arc_max_bytes

- name: Inspect completion of the restricted NFS migration
  ansible.builtin.stat:
    path: "{{ proxmox_storage_nfs_migration_marker }}"
    get_checksum: false
  register: proxmox_storage_nfs_migration

- name: Record whether NFS target convergence is authorized
  ansible.builtin.set_fact:
    proxmox_storage_nfs_convergence_authorized: >-
      {{ proxmox_storage_nfs_migration.stat.isreg | default(false) or
         proxmox_storage_migration_confirmed | bool }}

- name: Report the gated NFS migration when it has not run
  ansible.builtin.debug:
    msg: "Restricted NFS migration is pending; review SMART/scrub evidence and set proxmox_storage_migration_confirmed for the one-time cutover."
  changed_when: true
  when: not (proxmox_storage_nfs_convergence_authorized | bool)

- name: Inspect SMART and scrub review evidence for the one-time migration
  ansible.builtin.stat:
    path: "{{ proxmox_storage_review_evidence_path }}"
    get_checksum: true
  register: proxmox_storage_evidence
  when:
    - proxmox_storage_migration_confirmed | bool
    - not (proxmox_storage_nfs_migration.stat.isreg | default(false))

- name: Require reviewed evidence before the one-time NFS migration
  ansible.builtin.assert:
    that:
      - proxmox_storage_evidence.stat.isreg | default(false)
    fail_msg: "Record reviewed SMART and scrub evidence before storage/NFS migration."
  when:
    - proxmox_storage_migration_confirmed | bool
    - not (proxmox_storage_nfs_migration.stat.isreg | default(false))

- name: Verify VM 100 reports the contract NFS client address
  ansible.builtin.command:
    argv:
      - /usr/sbin/qm
      - guest
      - cmd
      - "{{ storage.nfs.client_vmid }}"
      - network-get-interfaces
  register: proxmox_storage_nfs_client_interfaces
  changed_when: false
  check_mode: false
  when:
    - proxmox_storage_migration_confirmed | bool
    - not (proxmox_storage_nfs_migration.stat.isreg | default(false))

- name: Require VM 100 to be the reachable declared NFS client
  ansible.builtin.assert:
    that:
      - storage.nfs.client.split('/')[0] in proxmox_storage_nfs_client_interfaces.stdout
    fail_msg: "VM 100 does not report the sole contract NFS client address."
  when:
    - proxmox_storage_migration_confirmed | bool
    - not (proxmox_storage_nfs_migration.stat.isreg | default(false))

- name: Verify the client currently sees the NFS mount before cutover
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --noheadings
      - --target
      - "{{ storage.nfs.mountpoint }}"
  delegate_to: "{{ proxmox_storage_nfs_client_inventory_host }}"
  become: true
  changed_when: false
  check_mode: false
  when:
    - proxmox_storage_migration_confirmed | bool
    - not (proxmox_storage_nfs_migration.stat.isreg | default(false))

- name: Read the ZFS-generated share property
  ansible.builtin.command:
    argv:
      - /usr/sbin/zfs
      - get
      - -H
      - -o
      - value
      - sharenfs
      - "{{ storage.zfs.dataset }}"
  register: proxmox_storage_zfs_sharenfs
  changed_when: false
  check_mode: false
  when:
    - proxmox_storage_pool_runtime_available | bool
    - proxmox_storage_nfs_convergence_authorized | bool

- name: Report ZFS-generated export drift in check mode
  ansible.builtin.debug:
    msg: "The ZFS sharenfs property must be disabled."
  changed_when: true
  when:
    - ansible_check_mode
    - proxmox_storage_nfs_convergence_authorized | bool
    - proxmox_storage_zfs_sharenfs.stdout != 'off'

- name: Disable the ZFS-generated world export
  ansible.builtin.command:
    argv:
      - /usr/sbin/zfs
      - set
      - sharenfs=off
      - "{{ storage.zfs.dataset }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - proxmox_storage_nfs_convergence_authorized | bool
    - proxmox_storage_zfs_sharenfs.stdout != 'off'
    - proxmox_storage_pool_runtime_available | bool
  notify: Reload NFS exports

- name: Export the Docker dataset only to the Arch VM
  ansible.builtin.template:
    src: home-lab.exports.j2
    dest: /etc/exports.d/home-lab.exports
    owner: root
    group: root
    mode: "0644"
  when: proxmox_storage_nfs_convergence_authorized | bool
  notify: Reload NFS exports

- name: Remove only the known legacy subnet-wide export
  ansible.builtin.lineinfile:
    path: /etc/exports
    regexp: '^\s*{{ storage.nfs.export | regex_escape }}\s+{{ network.cidr | regex_escape }}(?:\s|\(|$)'
    state: absent
    backup: true
  when: proxmox_storage_nfs_convergence_authorized | bool
  notify: Reload NFS exports

- name: Apply pending restricted NFS export changes
  ansible.builtin.meta: flush_handlers
  when:
    - not ansible_check_mode
    - proxmox_storage_nfs_convergence_authorized | bool

- name: Read effective NFS exports
  ansible.builtin.command:
    argv:
      - /usr/sbin/exportfs
      - -v
  register: proxmox_storage_effective_exports
  changed_when: false
  check_mode: false
  when:
    - proxmox_storage_nfs_convergence_authorized | bool
    - not ansible_check_mode or (proxmox_storage_nfs_migration.stat.isreg | default(false))

- name: Require only the exact /32 NFS client
  ansible.builtin.assert:
    that:
      - storage.nfs.client in proxmox_storage_effective_exports.stdout
      - network.cidr not in proxmox_storage_effective_exports.stdout
      - not (proxmox_storage_effective_exports.stdout is search('(^|[\\s])\\*([\\s(]|$)'))
    fail_msg: "Effective NFS exports contain a subnet-wide or world client, or omit VM 100's /32."
  when:
    - proxmox_storage_nfs_convergence_authorized | bool
    - not ansible_check_mode or (proxmox_storage_nfs_migration.stat.isreg | default(false))

- name: Perform a read-write NFS test from VM 100
  ansible.builtin.shell: |
    set -euo pipefail
    test_file=$(mktemp "{{ storage.nfs.mountpoint }}/.home-lab-nfs-test.XXXXXX")
    trap 'rm -f -- "$test_file"' EXIT
    token="home-lab-nfs-$RANDOM-$RANDOM"
    printf '%s\n' "$token" >"$test_file"
    test "$(cat "$test_file")" = "$token"
  args:
    executable: /bin/bash
  delegate_to: "{{ proxmox_storage_nfs_client_inventory_host }}"
  become: true
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - proxmox_storage_migration_confirmed | bool
    - not (proxmox_storage_nfs_migration.stat.isreg | default(false))

- name: Ensure the home-lab state directory exists
  ansible.builtin.file:
    path: "{{ proxmox_storage_nfs_migration_marker | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when:
    - not ansible_check_mode
    - proxmox_storage_migration_confirmed | bool
    - not (proxmox_storage_nfs_migration.stat.isreg | default(false))

- name: Record successful restricted NFS migration
  ansible.builtin.copy:
    dest: "{{ proxmox_storage_nfs_migration_marker }}"
    owner: root
    group: root
    mode: "0640"
    content: "client={{ storage.nfs.client }} vmid={{ storage.nfs.client_vmid }}\n"
  when:
    - not ansible_check_mode
    - proxmox_storage_migration_confirmed | bool
    - not (proxmox_storage_nfs_migration.stat.isreg | default(false))

- name: Verify dataset mountpoint identity
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --noheadings
      - --output
      - SOURCE,FSTYPE
      - --target
      - "{{ storage.zfs.mountpoint }}"
  register: proxmox_storage_mount
  changed_when: false
  check_mode: false
  when: proxmox_storage_pool_runtime_available | bool

- name: Assert the expected ZFS dataset is mounted
  ansible.builtin.assert:
    that:
      - storage.zfs.dataset in proxmox_storage_mount.stdout
      - "'zfs' in proxmox_storage_mount.stdout"
    fail_msg: "The expected storage/docker dataset is not mounted."
  when: proxmox_storage_pool_runtime_available | bool
