---
- name: Assert the Proxmox platform
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.virtualization_role != 'guest'
    fail_msg: "This role may run only on the Proxmox host."

- name: Install the pinned Tailscale repository signing key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
    checksum: sha256:3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
  register: proxmox_host_tailscale_key

- name: Install each canonical Deb822 repository definition
  ansible.builtin.copy:
    dest: "{{ item.file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: {{ item.types | join(' ') }}
      URIs: {{ item.uris | join(' ') }}
      Suites: {{ item.suites | join(' ') }}
      Components: {{ item.components | join(' ') }}
      Signed-By: {{ item.signed_by }}
  loop: "{{ proxmox.apt.repositories }}"
  loop_control:
    label: "{{ item.name }}"
  register: proxmox_host_repository_results

- name: Keep the legacy aggregate source file inactive
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: "0644"
    content: "# Repository definitions are managed in /etc/apt/sources.list.d/*.sources.\n"
  register: proxmox_host_legacy_source_list

- name: Remove only known stale or duplicate repository definitions
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ proxmox_host_known_stale_repository_files }}"
  register: proxmox_host_stale_repository_cleanup

- name: Remove only known orphaned third-party signing keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ proxmox_host_known_orphaned_key_files }}"
  register: proxmox_host_orphaned_key_cleanup

- name: Inventory active APT source definition files
  ansible.builtin.shell: |
    set -euo pipefail
    shopt -s nullglob
    for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
      [[ -f $file ]] || continue
      if /usr/bin/awk '!/^[[:space:]]*(#|$)/ {found=1; exit} END {exit !found}' "$file"; then
        printf '%s\n' "$file"
      fi
    done
  args:
    executable: /bin/bash
  register: proxmox_host_active_repository_files
  changed_when: false
  check_mode: false

- name: Reject future unapproved APT source definitions
  ansible.builtin.assert:
    that:
      - >-
        proxmox_host_active_repository_files.stdout_lines |
        difference((proxmox.apt.repositories | map(attribute='file') | list) +
                   proxmox_host_known_stale_repository_files) |
        length == 0
    fail_msg: "Unapproved APT source URI, suite, component, signing key, or definition file detected."

- name: Validate the final active APT source file set after apply
  ansible.builtin.assert:
    that:
      - >-
        proxmox_host_active_repository_files.stdout_lines | sort ==
        proxmox.apt.repositories | map(attribute='file') | list | sort
    fail_msg: "Canonical APT repository files did not converge."
  when: not ansible_check_mode

- name: Install required host packages without upgrading the distribution
  ansible.builtin.apt:
    name: "{{ proxmox_packages }}"
    state: present
    update_cache: >-
      {{ proxmox_host_repository_results.changed or
         proxmox_host_tailscale_key.changed or
         proxmox_host_legacy_source_list.changed or
         proxmox_host_stale_repository_cleanup.changed or
         proxmox_host_orphaned_key_cleanup.changed }}
  when: not ansible_check_mode

- name: Keep required host services enabled and started
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ proxmox_services }}"
  when: not ansible_check_mode

- name: Inspect required host packages during check mode
  ansible.builtin.command:
    argv:
      - /usr/bin/dpkg-query
      - --show
      - "--showformat=${db:Status-Status}"
      - "{{ item }}"
  register: proxmox_host_package_inspection
  failed_when: false
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_packages }}"
  when: ansible_check_mode

- name: Inspect required service enablement during check mode
  ansible.builtin.command:
    argv:
      - /bin/systemctl
      - is-enabled
      - --quiet
      - "{{ item }}"
  register: proxmox_host_service_enablement
  failed_when: false
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_services }}"
  when: ansible_check_mode

- name: Inspect required service state during check mode
  ansible.builtin.command:
    argv:
      - /bin/systemctl
      - is-active
      - --quiet
      - "{{ item }}"
  register: proxmox_host_service_state
  failed_when: false
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_services }}"
  when: ansible_check_mode

- name: Report package and service drift during check mode
  ansible.builtin.debug:
    msg:
      packages: "{{ proxmox_packages }}"
      services: "{{ proxmox_services }}"
  changed_when: >-
    proxmox_host_package_inspection.results | rejectattr('stdout', 'equalto', 'installed') | list | length > 0 or
    proxmox_host_service_enablement.results | rejectattr('rc', 'equalto', 0) | list | length > 0 or
    proxmox_host_service_state.results | rejectattr('rc', 'equalto', 0) | list | length > 0
  when: ansible_check_mode
- name: Inspect infrastructure SSH service users before convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - passwd
      - "{{ item }}"
  register: proxmox_host_ssh_user_inspection
  failed_when: false
  changed_when: false
  check_mode: false
  loop:
    - tofu-plan
    - tofu-apply

- name: Retain existing infrastructure SSH user identities
  ansible.builtin.set_fact:
    proxmox_host_existing_ssh_users: >-
      {{ proxmox_host_ssh_user_inspection.results |
         selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}
- name: Create locked infrastructure SSH service users
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
    create_home: true
    password_lock: true
    groups: "{{ item.groups | default(omit) }}"
    state: present
  loop:
    - name: tofu-plan
    - name: tofu-apply
      groups: sudo

- name: Create service-user SSH directories
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop:
    - name: tofu-plan
    - name: tofu-apply
  when: not ansible_check_mode or item.name in proxmox_host_existing_ssh_users

- name: Install account-specific bootstrap-authorized public keys
  ansible.builtin.copy:
    dest: "/home/{{ item.name }}/.ssh/authorized_keys"
    content: "{{ item['keys'] | reject('equalto', '') | join('\n') }}\n"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  loop:
    - name: tofu-plan
      keys: "{{ proxmox_plan_ssh_public_keys }}"
    - name: tofu-apply
      keys: "{{ proxmox_apply_ssh_public_keys }}"
  when:
    - item['keys'] | reject('equalto', '') | list | length > 0
    - not ansible_check_mode or item.name in proxmox_host_existing_ssh_users
  no_log: true

- name: Install the audited apply-account sudo policy
  ansible.builtin.copy:
    dest: /etc/sudoers.d/tofu-apply
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      tofu-apply ALL=(root) NOPASSWD: ALL
  when: not ansible_check_mode or 'tofu-apply' in proxmox_host_existing_ssh_users

- name: Inspect the API control plane in check mode
  ansible.builtin.include_tasks: api-check.yml
  when: ansible_check_mode

- name: Reconcile the API control plane outside check mode
  ansible.builtin.include_tasks: api.yml
  when: not ansible_check_mode
