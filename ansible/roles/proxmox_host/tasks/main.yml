---
- name: Assert the Proxmox platform
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.virtualization_role != 'guest'
    fail_msg: "This role may run only on the Proxmox host."

- name: Install the pinned Tailscale repository signing key
  ansible.builtin.get_url:
    url: "{{ proxmox_host_tailscale_keyring.source_url }}"
    dest: "{{ proxmox_host_tailscale_keyring.path }}"
    owner: root
    group: root
    mode: "0644"
    checksum: "sha256:{{ proxmox_host_tailscale_keyring.sha256 }}"
  vars:
    proxmox_host_tailscale_keyring: >-
      {{ proxmox.apt.permitted_keyrings |
         selectattr('name', 'equalto', 'tailscale') | first }}
  register: proxmox_host_tailscale_key

- name: Inspect every declared APT signing-key path without following links
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
  register: proxmox_host_keyring_metadata_inspection
  changed_when: false
  check_mode: false
  loop: "{{ proxmox.apt.permitted_keyrings }}"
  loop_control:
    label: "{{ item.name }}"

- name: Inspect every declared APT signing-key target checksum
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: true
    get_checksum: true
    checksum_algorithm: sha256
  register: proxmox_host_keyring_content_inspection
  changed_when: false
  check_mode: false
  loop: "{{ proxmox.apt.permitted_keyrings }}"
  loop_control:
    label: "{{ item.name }}"

- name: Report APT signing-key metadata or checksum drift in check mode
  ansible.builtin.debug:
    msg: "APT signing keyring {{ item.item.name }} requires metadata or checksum reconciliation."
  vars:
    proxmox_host_keyring_content: "{{ proxmox_host_keyring_content_inspection.results[keyring_index] }}"
  changed_when: >-
    not (proxmox_host_keyring_content.stat.isreg | default(false)) or
    (proxmox_host_keyring_content.stat.checksum | default('')) != item.item.sha256 or
    (
      item.item.symlink_target is none and
      (not (item.stat.isreg | default(false)) or (item.stat.islnk | default(false)))
    ) or
    (
      item.item.symlink_target is not none and
      (not (item.stat.islnk | default(false)) or
       (item.stat.lnk_target | default('')) != item.item.symlink_target)
    )
  when: ansible_check_mode
  loop: "{{ proxmox_host_keyring_metadata_inspection.results }}"
  loop_control:
    index_var: keyring_index
    label: "{{ item.item.name }}"

- name: Require exact APT signing-key metadata and checksums before package operations
  ansible.builtin.assert:
    that:
      - proxmox_host_keyring_content.stat.isreg | default(false)
      - (proxmox_host_keyring_content.stat.checksum | default('')) == item.item.sha256
      - >-
        (item.item.symlink_target is none and
         item.stat.isreg | default(false) and
         not (item.stat.islnk | default(false))) or
        (item.item.symlink_target is not none and
         item.stat.islnk | default(false) and
         (item.stat.lnk_target | default('')) == item.item.symlink_target)
    fail_msg: >-
      APT signing keyring {{ item.item.name }} has an unreviewed file type, link target, or SHA-256;
      reinstall its reviewed upstream package or checksum-bound artifact before continuing.
  vars:
    proxmox_host_keyring_content: "{{ proxmox_host_keyring_content_inspection.results[keyring_index] }}"
  when: not ansible_check_mode
  loop: "{{ proxmox_host_keyring_metadata_inspection.results }}"
  loop_control:
    index_var: keyring_index
    label: "{{ item.item.name }}"

- name: Install each canonical Deb822 repository definition
  ansible.builtin.copy:
    dest: "{{ item.file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: {{ item.types | join(' ') }}
      URIs: {{ item.uris | join(' ') }}
      Suites: {{ item.suites | join(' ') }}
      Components: {{ item.components | join(' ') }}
      Signed-By: {{ item.signed_by }}
  loop: "{{ proxmox.apt.repositories }}"
  loop_control:
    label: "{{ item.name }}"
  register: proxmox_host_repository_results

- name: Keep the legacy aggregate source file inactive
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: "0644"
    content: "# Repository definitions are managed in /etc/apt/sources.list.d/*.sources.\n"
  register: proxmox_host_legacy_source_list

- name: Remove only known stale or duplicate repository definitions
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ proxmox_host_known_stale_repository_files }}"
  register: proxmox_host_stale_repository_cleanup

- name: Remove only known orphaned third-party signing keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ proxmox_host_known_orphaned_key_files }}"
  register: proxmox_host_orphaned_key_cleanup

- name: Inventory active APT source definition files
  ansible.builtin.shell: |
    set -euo pipefail
    shopt -s nullglob
    for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
      [[ -f $file ]] || continue
      if /usr/bin/awk '!/^[[:space:]]*(#|$)/ {found=1; exit} END {exit !found}' "$file"; then
        printf '%s\n' "$file"
      fi
    done
  args:
    executable: /bin/bash
  register: proxmox_host_active_repository_files
  changed_when: false
  check_mode: false

- name: Reject future unapproved APT source definitions
  ansible.builtin.assert:
    that:
      - >-
        proxmox_host_active_repository_files.stdout_lines |
        difference((proxmox.apt.repositories | map(attribute='file') | list) +
                   proxmox_host_known_stale_repository_files +
                   proxmox_host_known_transitional_repository_files) |
        length == 0
    fail_msg: "Unapproved APT source URI, suite, component, signing key, or definition file detected."

- name: Validate the final active APT source file set after apply
  ansible.builtin.assert:
    that:
      - >-
        proxmox_host_active_repository_files.stdout_lines | sort ==
        proxmox.apt.repositories | map(attribute='file') | list | sort
    fail_msg: "Canonical APT repository files did not converge."
  when: not ansible_check_mode

- name: Install required host packages without upgrading the distribution
  ansible.builtin.apt:
    name: "{{ proxmox_packages }}"
    state: present
    update_cache: >-
      {{ proxmox_host_repository_results.changed or
         proxmox_host_tailscale_key.changed or
         proxmox_host_legacy_source_list.changed or
         proxmox_host_stale_repository_cleanup.changed or
         proxmox_host_orphaned_key_cleanup.changed }}
  when: not ansible_check_mode

- name: Keep required host services enabled and started
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ proxmox_services }}"
  when: not ansible_check_mode

- name: Inspect required host packages during check mode
  ansible.builtin.command:
    argv:
      - /usr/bin/dpkg-query
      - --show
      - "--showformat=${db:Status-Status}"
      - "{{ item }}"
  register: proxmox_host_package_inspection
  failed_when: false
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_packages }}"
  when: ansible_check_mode

- name: Inspect required service enablement during check mode
  ansible.builtin.command:
    argv:
      - /bin/systemctl
      - is-enabled
      - --quiet
      - "{{ item }}"
  register: proxmox_host_service_enablement
  failed_when: false
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_services }}"
  when: ansible_check_mode

- name: Inspect required service state during check mode
  ansible.builtin.command:
    argv:
      - /bin/systemctl
      - is-active
      - --quiet
      - "{{ item }}"
  register: proxmox_host_service_state
  failed_when: false
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_services }}"
  when: ansible_check_mode

- name: Report package and service drift during check mode
  ansible.builtin.debug:
    msg:
      packages: "{{ proxmox_packages }}"
      services: "{{ proxmox_services }}"
  changed_when: >-
    proxmox_host_package_inspection.results | rejectattr('stdout', 'equalto', 'installed') | list | length > 0 or
    proxmox_host_service_enablement.results | rejectattr('rc', 'equalto', 0) | list | length > 0 or
    proxmox_host_service_state.results | rejectattr('rc', 'equalto', 0) | list | length > 0
  when: ansible_check_mode
- name: Inspect infrastructure SSH service users before convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - passwd
      - "{{ item }}"
  register: proxmox_host_ssh_user_inspection
  failed_when: false
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_service_accounts | map(attribute='name') | list }}"

- name: Retain existing infrastructure SSH user identities
  ansible.builtin.set_fact:
    proxmox_host_existing_ssh_users: >-
      {{ proxmox_host_ssh_user_inspection.results |
         selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}
- name: Create locked infrastructure SSH service users
  ansible.builtin.user:
    name: "{{ item.name }}"
    home: "{{ item.home }}"
    shell: "{{ item.shell }}"
    create_home: "{{ item.create_home }}"
    password_lock: "{{ item.password_lock }}"
    groups: "{{ item.groups | join(',') }}"
    append: false
    state: present
  loop: "{{ proxmox_service_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create service-user SSH directories
  ansible.builtin.file:
    path: "{{ item.home }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ proxmox_service_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode or item.name in proxmox_host_existing_ssh_users

- name: Install account-specific bootstrap-authorized public keys
  ansible.builtin.copy:
    dest: "{{ item.authorized_keys_path }}"
    content: "{{ proxmox_host_service_account_keys | reject('equalto', '') | join('\n') }}\n"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  vars:
    proxmox_host_service_account_keys: >-
      {{ lookup('ansible.builtin.env', item.authorized_keys_secret_ref).splitlines() }}
  loop: "{{ proxmox_service_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - proxmox_host_service_account_keys | reject('equalto', '') | list | length > 0
    - not ansible_check_mode or item.name in proxmox_host_existing_ssh_users
  no_log: true

- name: Install audited service-account sudo policies
  ansible.builtin.copy:
    dest: "{{ item.sudoers_path }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: "{{ item.sudo_rule }}\n"
  loop: "{{ proxmox_service_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.sudoers_path is not none
    - not ansible_check_mode or item.name in proxmox_host_existing_ssh_users

- name: Remove undeclared service-account sudo policies
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.name }}"
    state: absent
  loop: "{{ proxmox_service_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.sudoers_path is none

- name: Inspect effective service-account groups
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - --name
      - --groups
      - "{{ item.name }}"
  register: proxmox_host_service_account_groups
  changed_when: false
  check_mode: false
  failed_when: false
  loop: "{{ proxmox_service_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Report effective service-account group drift
  ansible.builtin.debug:
    msg: "Service account {{ item.item.name }} has unexpected supplementary groups."
  changed_when: >-
    item.rc != 0 or
    item.stdout.split() != ([item.item.name] + item.item.groups)
  loop: "{{ proxmox_host_service_account_groups.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Require exact effective service-account groups after apply
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout.split() == [item.item.name] + item.item.groups
    fail_msg: "Service-account primary or supplementary groups did not converge."
  when: not ansible_check_mode
  loop: "{{ proxmox_host_service_account_groups.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Inspect the API control plane in check mode
  ansible.builtin.include_tasks: api-check.yml
  when: ansible_check_mode

- name: Reconcile the API control plane outside check mode
  ansible.builtin.include_tasks: api.yml
  when: not ansible_check_mode
