---
- name: Verify the exact package manifest
  block:
    - name: Allocate the temporary expected package manifest
      ansible.builtin.tempfile:
        state: file
        prefix: home-lab-proxmox-package-manifest.
        suffix: .json
      register: proxmox_host_package_manifest_fixture
      check_mode: false
      changed_when: false

    - name: Transfer the non-secret expected package manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ proxmox.packages.manifest.path }}"
        dest: "{{ proxmox_host_package_manifest_fixture.path }}"
        owner: root
        group: root
        mode: "0600"
      check_mode: false
      changed_when: false

    - name: Run the exact package manifest helper
      ansible.builtin.script:
        cmd: >-
          {{ role_path }}/files/check-apt-availability.py
          --policy-base64 {{ (proxmox_host_apt_availability_policy | to_json | b64encode) | quote }}
          --manifest {{ proxmox_host_package_manifest_fixture.path | quote }}
          {{ proxmox_host_package_helper_mode_arguments }}
        executable: /usr/bin/python3
      vars:
        proxmox_host_package_helper_mode_arguments: >-
          {{
            '--verify-installed-only'
            if proxmox_host_verify_installed_only | default(false) | bool
            else
            ('--allow-existing-extras '
             if ansible_check_mode or (proxmox_cleanup_migration_confirmed | bool)
             else '') ~
            ('--apply' if not ansible_check_mode else '')
          }}
        proxmox_host_apt_availability_policy:
          repositories: "{{ proxmox.apt.repositories }}"
          keyrings: "{{ proxmox.apt.permitted_keyrings }}"
          manifest_sha256: "{{ proxmox.packages.manifest.sha256 }}"
          packages: "{{ proxmox_package_entries }}"
      register: proxmox_host_package_transaction
      changed_when: >-
        not ansible_check_mode and
        not (proxmox_host_verify_installed_only | default(false) | bool) and
        'changed=true' in proxmox_host_package_transaction.stdout
      check_mode: false
  always:
    - name: Remove the temporary expected package manifest
      ansible.builtin.file:
        path: "{{ proxmox_host_package_manifest_fixture.path | default('') }}"
        state: absent
      when: proxmox_host_package_manifest_fixture.path | default('') | length > 0
      check_mode: false
      changed_when: false
