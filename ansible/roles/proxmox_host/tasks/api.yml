---
- name: Inspect Proxmox API users
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - user
      - list
      - --output-format
      - json
  register: proxmox_host_api_users
  changed_when: false

- name: Create missing separated Proxmox API users
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - user
      - add
      - "{{ item.user }}"
  when: >-
    item.user not in (proxmox_host_api_users.stdout | from_json |
    map(attribute='userid') | list)
  changed_when: true
  loop: "{{ proxmox_api_accounts }}"
  loop_control:
    label: "{{ item.user }}"

- name: Inspect Proxmox API roles
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - role
      - list
      - --output-format
      - json
  register: proxmox_host_api_roles
  changed_when: false

- name: Create missing separated Proxmox API roles
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - role
      - add
      - "{{ item.role }}"
      - --privs
      - "{{ item.privileges | join(' ') }}"
  when: item.role not in (proxmox_host_api_roles.stdout | from_json | map(attribute='roleid') | list)
  changed_when: true
  loop: "{{ proxmox_api_accounts + proxmox_api_additional_roles }}"
  loop_control:
    label: "{{ item.role }}"

- name: Re-read Proxmox API roles
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - role
      - list
      - --output-format
      - json
  register: proxmox_host_api_roles_after
  changed_when: false

- name: Converge drift in separated Proxmox API roles
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - role
      - modify
      - "{{ item.role }}"
      - --privs
      - "{{ item.privileges | join(' ') }}"
  vars:
    proxmox_host_api_role_current: >-
      {{ (proxmox_host_api_roles_after.stdout | from_json |
          selectattr('roleid', 'equalto', item.role) | first).privs }}
  when: >-
    (proxmox_host_api_role_current | regex_replace(',', ' ') | split | sort) !=
    (item.privileges | sort)
  changed_when: true
  loop: "{{ proxmox_api_accounts + proxmox_api_additional_roles }}"
  loop_control:
    label: "{{ item.role }}"


- name: Create missing separated Proxmox API tokens
  ansible.builtin.include_tasks: api-token.yml
  loop: "{{ proxmox_api_accounts }}"
  loop_control:
    loop_var: proxmox_host_api_account
    label: "{{ proxmox_host_api_account.user }}!{{ proxmox_host_api_account.token_name }}"

- name: Re-read ACLs after token creation
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - acl
      - list
      - --output-format
      - json
  register: proxmox_host_token_acls
  changed_when: false

- name: Remove unreviewed privilege-separated token ACLs
  ansible.builtin.include_tasks: api-acl.yml
  loop: "{{ proxmox_api_accounts }}"
  loop_control:
    loop_var: proxmox_host_api_account
    label: "{{ proxmox_host_api_account.user }}!{{ proxmox_host_api_account.token_name }}"

- name: Grant each privilege-separated token only its reviewed role
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - acl
      - modify
      - "{{ item.primary_acl_path }}"
      - --tokens
      - "{{ item.user }}!{{ item.token_name }}"
      - --roles
      - "{{ item.role }}"
  when: >-
    proxmox_host_token_acls.stdout | from_json |
    selectattr('path', 'equalto', item.primary_acl_path) |
    selectattr('ugid', 'equalto', item.user ~ '!' ~ item.token_name) |
    selectattr('roleid', 'equalto', item.role) |
    list | length == 0
  changed_when: true
  loop: "{{ proxmox_api_accounts }}"
  loop_control:
    label: "{{ item.user }}!{{ item.token_name }}"

- name: Grant reviewed VM-scoped inspection ACLs
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - acl
      - modify
      - "{{ item.1.path }}"
      - --tokens
      - "{{ item.0.user }}!{{ item.0.token_name }}"
      - --roles
      - "{{ item.1.role }}"
  when: >-
    proxmox_host_token_acls.stdout | from_json |
    selectattr('path', 'equalto', item.1.path) |
    selectattr('ugid', 'equalto', item.0.user ~ '!' ~ item.0.token_name) |
    selectattr('roleid', 'equalto', item.1.role) |
    list | length == 0
  changed_when: true
  loop: "{{ proxmox_api_accounts | subelements('additional_acls') }}"
  loop_control:
    label: "{{ item.0.user }}!{{ item.0.token_name }}:{{ item.1.path }}"

- name: Re-read final privilege-separated token ACLs
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - acl
      - list
      - --output-format
      - json
  register: proxmox_host_final_token_acls
  changed_when: false

- name: Require the exact reviewed ACL count per privilege-separated token
  ansible.builtin.assert:
    that:
      - >-
        proxmox_host_final_token_acls.stdout | from_json |
        selectattr('ugid', 'equalto', item.user ~ '!' ~ item.token_name) |
        list | length == 1 + (item.additional_acls | length)
      - >-
        proxmox_host_final_token_acls.stdout | from_json |
        selectattr('path', 'equalto', item.primary_acl_path) |
        selectattr('ugid', 'equalto', item.user ~ '!' ~ item.token_name) |
        selectattr('roleid', 'equalto', item.role) |
        list | length == 1
    fail_msg: "A privilege-separated Proxmox token has an unreviewed ACL."
  loop: "{{ proxmox_api_accounts }}"
  loop_control:
    label: "{{ item.user }}!{{ item.token_name }}"

- name: Require every reviewed VM-scoped inspection ACL
  ansible.builtin.assert:
    that:
      - >-
        proxmox_host_final_token_acls.stdout | from_json |
        selectattr('path', 'equalto', item.1.path) |
        selectattr('ugid', 'equalto', item.0.user ~ '!' ~ item.0.token_name) |
        selectattr('roleid', 'equalto', item.1.role) |
        list | length == 1
  loop: "{{ proxmox_api_accounts | subelements('additional_acls') }}"
  loop_control:
    label: "{{ item.0.user }}!{{ item.0.token_name }}:{{ item.1.path }}"

- name: Verify escrow files exist for every active API token
  ansible.builtin.stat:
    path: "{{ item.token_path }}"
    follow: false
    get_checksum: false
  register: proxmox_host_token_escrow_files
  loop: "{{ proxmox_api_accounts }}"
  loop_control:
    label: "{{ item.token_path }}"
  no_log: true

- name: Verify escrow directories for every active API token
  ansible.builtin.stat:
    path: "{{ item.token_path | dirname }}"
    follow: false
    get_checksum: false
  register: proxmox_host_token_escrow_directories
  loop: "{{ proxmox_api_accounts }}"
  loop_control:
    label: "{{ item.token_path | dirname }}"
  no_log: true

- name: Require manual rotation when one-time token escrow is unavailable
  ansible.builtin.assert:
    that:
      - item.0.stat.isreg | default(false)
      - not (item.0.stat.islnk | default(false))
      - (item.0.stat.uid | default(-1) | int) == 0
      - (item.0.stat.gid | default(-1) | int) == 0
      - item.0.stat.mode == '0600'
      - item.1.stat.isdir | default(false)
      - not (item.1.stat.islnk | default(false))
      - (item.1.stat.uid | default(-1) | int) == 0
      - (item.1.stat.gid | default(-1) | int) == 0
      - item.1.stat.mode == '0700'
      - (item.0.item.token_path | dirname) == '/root/.config/home-lab'
    fail_msg: >-
      An active Proxmox API token lacks its root-owned, non-symlink mode-0600 escrow file
      beneath the root-owned mode-0700 credential directory; rotate it deliberately.
  loop: >-
    {{ proxmox_host_token_escrow_files.results |
       zip(proxmox_host_token_escrow_directories.results) | list }}
  loop_control:
    label: "{{ item.0.item.user }}"
  no_log: true
