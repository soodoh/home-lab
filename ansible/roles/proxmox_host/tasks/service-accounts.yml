---
- name: Select infrastructure SSH service accounts for convergence
  ansible.builtin.set_fact:
    proxmox_host_service_accounts_in_scope: >-
      {{ proxmox_host_selected_service_accounts | default(proxmox_service_accounts) }}

- name: Inspect infrastructure SSH service users before convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - passwd
      - "{{ item }}"
  register: proxmox_host_ssh_user_inspection
  failed_when: false
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_host_service_accounts_in_scope | map(attribute='name') | list }}"

- name: Retain existing infrastructure SSH user identities
  ansible.builtin.set_fact:
    proxmox_host_existing_ssh_users: >-
      {{ proxmox_host_ssh_user_inspection.results |
         selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}

- name: Create locked infrastructure SSH service users
  ansible.builtin.user:
    name: "{{ item.name }}"
    home: "{{ item.home }}"
    shell: "{{ item.shell }}"
    create_home: "{{ item.create_home }}"
    password_lock: "{{ item.password_lock }}"
    groups: "{{ item.groups | join(',') }}"
    append: false
    state: present
  loop: "{{ proxmox_host_service_accounts_in_scope }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create service-user SSH directories
  ansible.builtin.file:
    path: "{{ item.ssh_directory.path }}"
    state: directory
    owner: "{{ item.ssh_directory.owner }}"
    group: "{{ item.ssh_directory.group }}"
    mode: "{{ item.ssh_directory.mode }}"
  loop: "{{ proxmox_host_service_accounts_in_scope }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode or item.name in proxmox_host_existing_ssh_users

- name: Install account-specific bootstrap-authorized public keys
  ansible.builtin.copy:
    dest: "{{ item.authorized_keys.file.path }}"
    content: "{{ proxmox_host_service_account_rendered_keys | reject('equalto', '') | join('\n') }}\n"
    owner: "{{ item.authorized_keys.file.owner }}"
    group: "{{ item.authorized_keys.file.group }}"
    mode: "{{ item.authorized_keys.file.mode }}"
  vars:
    proxmox_host_service_account_keys: >-
      {{ lookup('ansible.builtin.env', item.authorized_keys.secret_ref).splitlines() }}
    proxmox_host_service_account_key_prefix: >-
      {{ ((item.authorized_keys.forced_command | default('', true)) ~ ' ')
         if (item.authorized_keys.forced_command | default('', true) | length > 0) else '' }}
    proxmox_host_service_account_rendered_keys: >-
      {{ proxmox_host_service_account_keys |
         map('regex_replace', '^', proxmox_host_service_account_key_prefix) | list }}
  loop: "{{ proxmox_host_service_accounts_in_scope }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - proxmox_host_service_account_keys | reject('equalto', '') | list | length > 0
    - not ansible_check_mode or item.name in proxmox_host_existing_ssh_users
  no_log: true

- name: Install audited service-account sudo policies
  ansible.builtin.copy:
    dest: "{{ item.sudo.file.path }}"
    owner: "{{ item.sudo.file.owner }}"
    group: "{{ item.sudo.file.group }}"
    mode: "{{ item.sudo.file.mode }}"
    validate: >-
      {{ proxmox.access.sudo_validation.executable }}
      {{ proxmox.access.sudo_validation.arguments | join(' ') }}
    content: "{{ item.sudo.rule }}\n"
  loop: "{{ proxmox_host_service_accounts_in_scope }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - (item.sudo.state | default('')) == 'present'
    - not ansible_check_mode or item.name in proxmox_host_existing_ssh_users

- name: Remove undeclared service-account sudo policies
  ansible.builtin.file:
    path: "{{ item.sudo.path }}"
    state: absent
  loop: "{{ proxmox_host_service_accounts_in_scope }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - (item.sudo.kind | default('')) == 'audit-absence'
    - (item.sudo.absence | default('')) == 'file'

- name: Inspect effective service-account groups
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - --name
      - --groups
      - "{{ item.name }}"
  register: proxmox_host_service_account_groups
  changed_when: false
  check_mode: false
  failed_when: false
  loop: "{{ proxmox_host_service_accounts_in_scope }}"
  loop_control:
    label: "{{ item.name }}"

- name: Report effective service-account group drift
  ansible.builtin.debug:
    msg: "Service account {{ item.item.name }} has unexpected supplementary groups."
  changed_when: >-
    item.rc != 0 or
    item.stdout.split() != ([item.item.name] + item.item.groups)
  loop: "{{ proxmox_host_service_account_groups.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Require exact effective service-account groups after apply
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout.split() == [item.item.name] + item.item.groups
    fail_msg: "Service-account primary or supplementary groups did not converge."
  when: not ansible_check_mode
  loop: "{{ proxmox_host_service_account_groups.results }}"
  loop_control:
    label: "{{ item.item.name }}"
