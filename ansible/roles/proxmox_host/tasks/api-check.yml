---
- name: Inspect Proxmox API users in check mode
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - user
      - list
      - --output-format
      - json
  register: proxmox_host_check_users
  changed_when: false
  check_mode: false

- name: Inspect Proxmox API roles in check mode
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - role
      - list
      - --output-format
      - json
  register: proxmox_host_check_roles
  changed_when: false
  check_mode: false

- name: Inspect Proxmox ACLs in check mode
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - acl
      - list
      - --output-format
      - json
  register: proxmox_host_check_acls
  changed_when: false
  check_mode: false

- name: Inspect existing privilege-separated tokens in check mode
  ansible.builtin.command:
    argv:
      - /usr/sbin/pveum
      - user
      - token
      - list
      - "{{ item.user }}"
      - --output-format
      - json
  register: proxmox_host_check_tokens
  changed_when: false
  check_mode: false
  when: >-
    item.user in (proxmox_host_check_users.stdout | from_json |
    map(attribute='userid') | list)
  loop: "{{ proxmox_api_accounts }}"
  loop_control:
    label: "{{ item.user }}"
  no_log: true

- name: Inspect root-only token escrow files in check mode
  ansible.builtin.stat:
    path: "{{ item.token_path }}"
    follow: false
    get_checksum: false
  register: proxmox_host_check_escrow
  loop: "{{ proxmox_api_accounts }}"
  loop_control:
    label: "{{ item.token_path }}"
  no_log: true

- name: Inspect root-only token escrow directories in check mode
  ansible.builtin.stat:
    path: "{{ item.token_path | dirname }}"
    follow: false
    get_checksum: false
  register: proxmox_host_check_escrow_directories
  loop: "{{ proxmox_api_accounts }}"
  loop_control:
    label: "{{ item.token_path | dirname }}"
  no_log: true

- name: Report drift in VM-scoped inspection roles
  ansible.builtin.debug:
    msg: "A VM-scoped Proxmox inspection role requires reconciliation."
  vars:
    proxmox_host_check_role_record: >-
      {{ proxmox_host_check_roles.stdout | from_json |
         selectattr('roleid', 'equalto', item.role) | first | default({}) }}
    proxmox_host_check_role_privileges: >-
      {{ (proxmox_host_check_role_record.privs | default('')) |
         regex_replace(',', ' ') | split | sort }}
  changed_when: >-
    item.role not in (proxmox_host_check_roles.stdout | from_json | map(attribute='roleid') | list) or
    proxmox_host_check_role_privileges != (item.privileges | sort)
  loop: "{{ proxmox_api_additional_roles }}"
  loop_control:
    label: "{{ item.role }}"

- name: Report exact separated API-control-plane drift
  ansible.builtin.debug:
    msg: "The separated Proxmox API account requires reconciliation."
  vars:
    proxmox_host_check_user_ids: >-
      {{ proxmox_host_check_users.stdout | from_json | map(attribute='userid') | list }}
    proxmox_host_check_role_records: >-
      {{ proxmox_host_check_roles.stdout | from_json |
         selectattr('roleid', 'equalto', item.role) | list }}
    proxmox_host_check_current_privileges: >-
      {{ ((proxmox_host_check_role_records | first | default({})).privs | default('')) |
         regex_replace(',', ' ') | split | sort }}
    proxmox_host_check_acl_records: "{{ proxmox_host_check_acls.stdout | from_json }}"
    proxmox_host_check_token_result: >-
      {{ proxmox_host_check_tokens.results |
         selectattr('item.user', 'equalto', item.user) |
         selectattr('item.token_name', 'equalto', item.token_name) | first | default({}) }}
    proxmox_host_check_token_records: >-
      {{ (proxmox_host_check_token_result.stdout | default('[]')) | from_json }}
    proxmox_host_check_token_ids: >-
      {{ proxmox_host_check_token_records | map(attribute='tokenid') | list }}
    proxmox_host_check_token_record: >-
      {{ proxmox_host_check_token_records |
         selectattr('tokenid', 'equalto', item.token_name) | first | default({}) }}
    proxmox_host_check_escrow_result: >-
      {{ proxmox_host_check_escrow.results |
         selectattr('item.user', 'equalto', item.user) |
         selectattr('item.token_name', 'equalto', item.token_name) | first }}
    proxmox_host_check_escrow_directory_result: >-
      {{ proxmox_host_check_escrow_directories.results |
         selectattr('item.user', 'equalto', item.user) |
         selectattr('item.token_name', 'equalto', item.token_name) | first }}
  changed_when: >-
    item.user not in proxmox_host_check_user_ids or
    item.role not in (proxmox_host_check_roles.stdout | from_json | map(attribute='roleid') | list) or
    proxmox_host_check_current_privileges != (item.privileges | sort) or
    item.token_name not in proxmox_host_check_token_ids or
    (proxmox_host_check_token_record.privsep | default(-1) | int) !=
      (item.privilege_separation | ternary(1, 0)) or
    (proxmox_host_check_acl_records |
      selectattr('path', 'equalto', item.primary_acl_path) |
      selectattr('ugid', 'equalto', item.user ~ '!' ~ item.token_name) |
      selectattr('roleid', 'equalto', item.role) | list | length == 0) or
    (proxmox_host_check_acl_records |
      selectattr('ugid', 'equalto', item.user ~ '!' ~ item.token_name) |
      list | length != 1 + (item.additional_acls | length)) or
    not (proxmox_host_check_escrow_result.stat.isreg | default(false)) or
    (proxmox_host_check_escrow_result.stat.islnk | default(false)) or
    (proxmox_host_check_escrow_result.stat.uid | default(-1) | int) != 0 or
    (proxmox_host_check_escrow_result.stat.gid | default(-1) | int) != 0 or
    (proxmox_host_check_escrow_result.stat.mode | default('')) != '0600' or
    not (proxmox_host_check_escrow_directory_result.stat.isdir | default(false)) or
    (proxmox_host_check_escrow_directory_result.stat.islnk | default(false)) or
    (proxmox_host_check_escrow_directory_result.stat.uid | default(-1) | int) != 0 or
    (proxmox_host_check_escrow_directory_result.stat.gid | default(-1) | int) != 0 or
    (proxmox_host_check_escrow_directory_result.stat.mode | default('')) != '0700'
  loop: "{{ proxmox_api_accounts }}"
  loop_control:
    label: "{{ item.user }}!{{ item.token_name }}"

- name: Report drift in VM-scoped token ACLs
  ansible.builtin.debug:
    msg: "A VM-scoped Proxmox token ACL requires reconciliation."
  changed_when: >-
    proxmox_host_check_acls.stdout | from_json |
    selectattr('path', 'equalto', item.1.path) |
    selectattr('ugid', 'equalto', item.0.user ~ '!' ~ item.0.token_name) |
    selectattr('roleid', 'equalto', item.1.role) |
    list | length != 1
  loop: "{{ proxmox_api_accounts | subelements('additional_acls') }}"
  loop_control:
    label: "{{ item.0.user }}!{{ item.0.token_name }}:{{ item.1.path }}"
