---
- name: Validate the Compose staging contract
  ansible.builtin.assert:
    that:
      - compose_artifact_hash is match('^[0-9a-f]{64}$')
      - compose_artifact_controller_dir | length > 0
      - ansible_check_mode or (compose_stage_confirmed | default(false) | ansible.builtin.bool)
    fail_msg: >-
      Compose staging requires a 64-character artifact hash, an exact controller artifact directory,
      and compose_stage_confirmed=true outside check mode.

- name: Recompute the controller artifact hash
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ compose_artifact_controller_dir }}/scripts/compose-artifact.py"
      - --root
      - "{{ compose_artifact_controller_dir }}"
      - --no-git
      - hash
  delegate_to: localhost
  become: false
  register: compose_stage_controller_hash
  changed_when: false
  check_mode: false

- name: Require the reviewed controller artifact hash
  ansible.builtin.assert:
    that:
      - compose_stage_controller_hash.stdout == compose_artifact_hash
    fail_msg: "Controller artifact hash differs from the reviewed hash."

- name: Inspect the final artifact and candidate environment paths
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  become: true
  register: compose_stage_existing_paths
  loop:
    - "{{ compose_staging_root }}/{{ compose_artifact_hash }}"
    - "{{ compose_staged_env_path }}"

- name: Report the expected staging changes in check mode
  ansible.builtin.debug:
    msg: >-
      Artifact {{ compose_artifact_hash }} and its root-only candidate environment will be installed
      under inactive hash-addressed staging paths.
  changed_when: >-
    not compose_stage_existing_paths.results[0].stat.exists or
    not compose_stage_existing_paths.results[1].stat.exists
  when: ansible_check_mode

- name: Stage and validate the exact Compose artifact
  when: not ansible_check_mode
  block:
    - name: Create stable Compose deployment directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      become: true
      loop: >-
        {{
          [
            {'path': compose_deployment_root, 'mode': '0755'},
            {'path': compose_staging_root, 'mode': '0755'},
            {'path': '/etc/docker-compose', 'mode': '0700'},
            {'path': compose_staged_env_root, 'mode': '0700'},
            {'path': '/var/lib/docker-compose', 'mode': '0700'}
          ]
          + (
            [] if (compose_stage_fresh_recovery | default(false) | bool)
            else [
              {'path': compose_current_dir, 'mode': '0755'},
              {'path': compose_previous_dir, 'mode': '0755'}
            ]
          )
        }}

    - name: Materialize and transfer only the deterministic Compose artifact
      when: not compose_stage_existing_paths.results[0].stat.exists
      block:
        - name: Create a private controller artifact directory
          ansible.builtin.tempfile:
            state: directory
            prefix: home-lab-compose-artifact-
          delegate_to: localhost
          become: false
          register: compose_stage_controller_artifact

        - name: Materialize only the selected deterministic artifact paths
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ compose_artifact_controller_dir }}/scripts/compose-artifact.py"
              - --no-git
              - --root
              - "{{ compose_artifact_controller_dir }}"
              - copy
              - "{{ compose_stage_controller_artifact.path }}"
          delegate_to: localhost
          become: false
          register: compose_stage_materialized_hash
          changed_when: true

        - name: Require the materialized controller artifact hash
          ansible.builtin.assert:
            that:
              - compose_stage_materialized_hash.stdout == compose_artifact_hash
            fail_msg: "Materialized controller artifact differs from the reviewed hash."

        - name: Create an incoming root-owned artifact directory
          ansible.builtin.tempfile:
            state: directory
            path: "{{ compose_staging_root }}"
            prefix: .incoming-
          become: true
          register: compose_stage_incoming

        - name: Copy only the materialized deterministic artifact
          ansible.builtin.copy:
            src: "{{ compose_stage_controller_artifact.path }}/"
            dest: "{{ compose_stage_incoming.path }}/"
            owner: root
            group: root
            mode: preserve
            directory_mode: "0755"
          become: true
      rescue:
        - name: Remove a partial incoming host artifact
          ansible.builtin.file:
            path: "{{ compose_stage_incoming.path | default('/nonexistent-compose-stage-incoming') }}"
            state: absent
          become: true
          when: compose_stage_incoming.path | default('') | length > 0

        - name: Stop after deterministic artifact transfer failure
          ansible.builtin.fail:
            msg: "Deterministic Compose artifact transfer failed; partial host staging was removed."
      always:
        - name: Remove the private controller artifact directory
          ansible.builtin.file:
            path: "{{ compose_stage_controller_artifact.path | default('/nonexistent-compose-controller-artifact') }}"
            state: absent
          delegate_to: localhost
          become: false
          when: compose_stage_controller_artifact.path | default('') | length > 0

    - name: Recompute the incoming host artifact hash
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_stage_incoming.path }}/scripts/compose-artifact.py"
          - --root
          - "{{ compose_stage_incoming.path }}"
          - --no-git
          - hash
      become: true
      register: compose_stage_incoming_hash
      changed_when: false
      when: not compose_stage_existing_paths.results[0].stat.exists

    - name: Require the incoming host artifact hash
      ansible.builtin.assert:
        that:
          - compose_stage_incoming_hash.stdout == compose_artifact_hash
        fail_msg: "Incoming host artifact hash differs from the reviewed hash."
      when: not compose_stage_existing_paths.results[0].stat.exists

    - name: Atomically publish the immutable staging directory
      ansible.builtin.command:
        argv:
          - /usr/bin/mv
          - --
          - "{{ compose_stage_incoming.path }}"
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}"
      become: true
      changed_when: true
      when: not compose_stage_existing_paths.results[0].stat.exists

    - name: Recompute the published host artifact hash
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/scripts/compose-artifact.py"
          - --root
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}"
          - --no-git
          - hash
      become: true
      register: compose_stage_host_hash
      changed_when: false

    - name: Require the published host artifact hash
      ansible.builtin.assert:
        that:
          - compose_stage_host_hash.stdout == compose_artifact_hash
        fail_msg: "Published host artifact hash differs from the reviewed hash."

    - name: Create a root-only decryption workspace
      ansible.builtin.tempfile:
        state: directory
        path: /etc/docker-compose
        prefix: .decrypt-
      become: true
      register: compose_stage_decrypt_workspace
      no_log: true

    - name: Decrypt the canonical production environment in the root-only workspace
      ansible.builtin.command:
        argv:
          - /usr/local/bin/sops
          - decrypt
          - --input-type
          - dotenv
          - --output-type
          - dotenv
          - --output
          - "{{ compose_stage_decrypt_workspace.path }}/canonical.env"
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/secrets/production.sops.env"
      environment:
        SOPS_AGE_KEY_FILE: "{{ compose_age_identity_path }}"
      become: true
      no_log: true
      changed_when: true

    - name: Restore the exact non-secret dotenv layout
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/scripts/restore-dotenv-layout.py"
          - "{{ compose_stage_decrypt_workspace.path }}/canonical.env"
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/secrets/production.env.layout.json"
          - "{{ compose_stage_decrypt_workspace.path }}/production.env"
      become: true
      no_log: true
      changed_when: true

    - name: Materialize protected Nextcloud database secret files
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/scripts/materialize-compose-secret-files.py"
          - --dotenv
          - "{{ compose_stage_decrypt_workspace.path }}/canonical.env"
          - --directory
          - "{{ nextcloud.secrets.application_password.destination | dirname }}"
          - --secret
          - "{{ nextcloud.secrets.application_password.source_secret_ref }}={{ nextcloud.secrets.application_password.destination | basename }}"
          - --secret
          - "{{ nextcloud.secrets.root_password.source_secret_ref }}={{ nextcloud.secrets.root_password.destination | basename }}"
      become: true
      register: compose_stage_nextcloud_secret_materialization
      changed_when: "'changed=0' not in compose_stage_nextcloud_secret_materialization.stdout"
      no_log: true

    - name: Recheck protected Nextcloud database secret files idempotently
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/scripts/materialize-compose-secret-files.py"
          - --dotenv
          - "{{ compose_stage_decrypt_workspace.path }}/canonical.env"
          - --directory
          - "{{ nextcloud.secrets.application_password.destination | dirname }}"
          - --secret
          - "{{ nextcloud.secrets.application_password.source_secret_ref }}={{ nextcloud.secrets.application_password.destination | basename }}"
          - --secret
          - "{{ nextcloud.secrets.root_password.source_secret_ref }}={{ nextcloud.secrets.root_password.destination | basename }}"
          - --check
      become: true
      changed_when: false
      no_log: true

    - name: Inspect protected Nextcloud database secret files
      ansible.builtin.stat:
        path: "{{ item.destination }}"
        get_checksum: false
        get_mime: false
        follow: false
      become: true
      register: compose_stage_nextcloud_secret_files
      loop: "{{ nextcloud.secrets.values() | list }}"
      no_log: true

    - name: Require protected Nextcloud database secret-file identities
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.nlink == 1
          - item.stat.pw_name == item.item.owner
          - item.stat.gr_name == item.item.group
          - item.stat.mode == item.item.mode
        fail_msg: "Nextcloud database secret file identity differs from the contract."
      loop: "{{ compose_stage_nextcloud_secret_files.results }}"
      no_log: true
    - name: Atomically install the root-only candidate environment
      ansible.builtin.copy:
        src: "{{ compose_stage_decrypt_workspace.path }}/production.env"
        dest: "{{ compose_staged_env_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      become: true
      diff: false
      no_log: true

    - name: Validate staged Compose without displaying the resolved model
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - compose
          - --project-name
          - "{{ compose_project_name }}"
          - --project-directory
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}"
          - --env-file
          - "{{ compose_staged_env_path }}"
          - --file
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/docker-compose.yml"
          - --file
          - "{{ compose_image_override_path }}"
          - config
          - --quiet
      become: true
      changed_when: false
      no_log: true
      environment:
        HOME: "{{ compose_home_dir }}"

    - name: Produce the secret-free staged model inventory
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/scripts/compose-model-inventory.py"
          - desired
          - --artifact-root
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}"
          - --project-directory
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}"
          - --env-file
          - "{{ compose_staged_env_path }}"
          - --override-file
          - "{{ compose_image_override_path }}"
          - --project-name
          - "{{ compose_project_name }}"
          - --bind-root-override
          - "{{ compose_current_dir }}"
          - --output
          - "{{ compose_stage_decrypt_workspace.path }}/staged-model.json"
      become: true
      changed_when: false
      no_log: true
      environment:
        HOME: "{{ compose_home_dir }}"

    - name: Produce the secret-free runtime model inventory
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/scripts/compose-model-inventory.py"
          - runtime
          - --project-name
          - "{{ compose_project_name }}"
          - --output
          - "{{ compose_stage_decrypt_workspace.path }}/runtime-model.json"
      become: true
      changed_when: false
      no_log: true

    - name: Install the secret-free model inventories
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "{{ item.destination }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      become: true
      loop:
        - source: "{{ compose_stage_decrypt_workspace.path }}/staged-model.json"
          destination: "{{ compose_staged_inventory_path }}"
        - source: "{{ compose_stage_decrypt_workspace.path }}/runtime-model.json"
          destination: "{{ compose_runtime_inventory_path }}"

    - name: Validate the Compose model before candidate image prefetch
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - compose
          - --project-name
          - "{{ compose_project_name }}"
          - --project-directory
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}"
          - --env-file
          - "{{ compose_staged_env_path }}"
          - --file
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/docker-compose.yml"
          - --file
          - "{{ compose_image_override_path }}"
          - config
          - --quiet
      become: true
      register: compose_stage_dry_run
      changed_when: false
      no_log: true
      environment:
        HOME: "{{ compose_home_dir }}"

    - name: Prefetch only missing images from the exact staged Compose artifact
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - compose
          - --project-name
          - "{{ compose_project_name }}"
          - --project-directory
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}"
          - --env-file
          - "{{ compose_staged_env_path }}"
          - --file
          - "{{ compose_staging_root }}/{{ compose_artifact_hash }}/docker-compose.yml"
          - --file
          - "{{ compose_image_override_path }}"
          - pull
          - --policy
          - missing
          - --ignore-buildable
          - --quiet
      become: true
      changed_when: true
      no_log: true
      environment:
        HOME: "{{ compose_home_dir }}"
      when: compose_image_override_path | length == 0

    - name: Report the reviewed dry-run identity without model data
      ansible.builtin.debug:
        msg:
          artifact_hash: "{{ compose_artifact_hash }}"
          dry_run_sha256: "{{ compose_stage_dry_run.stdout | hash('sha256') }}"
          dry_run_lines: "{{ compose_stage_dry_run.stdout_lines | length }}"

  always:
    - name: Remove any remaining incoming staging workspace
      ansible.builtin.file:
        path: "{{ compose_stage_incoming.path | default('/nonexistent') }}"
        state: absent
      become: true
      when:
        - not ansible_check_mode
        - compose_stage_incoming is defined

    - name: Remove the root-only decryption workspace
      ansible.builtin.file:
        path: "{{ compose_stage_decrypt_workspace.path | default('/nonexistent') }}"
        state: absent
      become: true
      no_log: true
      when:
        - not ansible_check_mode
        - compose_stage_decrypt_workspace is defined
