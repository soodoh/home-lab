---
- name: Require independently reviewed snapshot installation approval
  ansible.builtin.assert:
    that:
      - ansible_check_mode or zfs_backup_snapshot_apply_confirmed | default(false) | bool
      - zfs_backup_snapshot_dataset_guid is match('^[1-9][0-9]{0,19}$')
      - zfs_backup_snapshot_tailscale_ipv4 is match('^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$')
      - ansible_check_mode or zfs_backup_snapshot_install_owner | default('') is match('^[0-9a-f]{64}$')
    quiet: true

- name: Verify this role is under the exact acquired host owner before changing authority
  ansible.builtin.stat:
    path: /var/lib/iac-ansible-production.lock/owner
    follow: false
    checksum_algorithm: sha256
    get_mime: false
  register: zfs_backup_snapshot_owner
  when: not ansible_check_mode

- name: Require the acquired owner still matches its native file
  ansible.builtin.assert:
    that: zfs_backup_snapshot_owner.stat.checksum | default('') == zfs_backup_snapshot_install_owner
    quiet: true
  when: not ansible_check_mode

- name: Inspect broker coordination and executable identities before crossing its gate
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - /run/lock/home-lab-zfs-backup-snapshot.lock
    - /usr/local/libexec/home-lab/zfs-backup-snapshot
  register: zfs_backup_snapshot_gate

- name: Refuse an unfamiliar coordination inode or an interrupted missing gate
  ansible.builtin.assert:
    that:
      - >-
        not zfs_backup_snapshot_gate.results[0].stat.exists or
        (zfs_backup_snapshot_gate.results[0].stat.isreg and
         not zfs_backup_snapshot_gate.results[0].stat.islnk and
         zfs_backup_snapshot_gate.results[0].stat.uid == 0 and
         zfs_backup_snapshot_gate.results[0].stat.nlink == 1 and
         zfs_backup_snapshot_gate.results[0].stat.mode == '0600')
      - zfs_backup_snapshot_gate.results[0].stat.exists or not zfs_backup_snapshot_gate.results[1].stat.exists
    quiet: true

- name: Cross the native broker gate after publishing ownership and before replacing authority
  ansible.builtin.command:
    argv: [/usr/bin/flock, --exclusive, --nonblock, '--', /run/lock/home-lab-zfs-backup-snapshot.lock, /usr/bin/true]
  changed_when: false
  check_mode: false
  when: zfs_backup_snapshot_gate.results[0].stat.exists

- name: Read actual dataset identity before installing any authority
  ansible.builtin.command:
    argv: [/usr/sbin/zfs, get, '-H', '-p', '-o', value, guid, storage/docker]
  changed_when: false
  check_mode: false
  register: zfs_backup_snapshot_observed

- name: Refuse a replaced or unfamiliar source dataset
  ansible.builtin.assert:
    that: zfs_backup_snapshot_observed.stdout == zfs_backup_snapshot_dataset_guid
    quiet: true

- name: Inspect outstanding backup snapshot identities before replacing their authority
  ansible.builtin.command:
    argv: [/usr/sbin/zfs, list, '-H', '-r', '-d', '1', '-t', snapshot, '-o', name, storage/docker]
  changed_when: false
  check_mode: false
  register: zfs_backup_snapshot_pending

- name: Refuse authority replacement while snapshots still need their current implementation
  ansible.builtin.assert:
    that: zfs_backup_snapshot_pending.stdout_lines | select('match', '^storage/docker@home-lab-nextcloud-') | list | length == 0
    quiet: true

- name: Verify the pinned endpoint is the actual Tailscale peer identity
  ansible.builtin.command:
    argv: [/usr/bin/tailscale, ip, '-4']
  changed_when: false
  check_mode: false
  register: zfs_backup_snapshot_peer

- name: Refuse a changed peer address instead of listening on another interface
  ansible.builtin.assert:
    that: zfs_backup_snapshot_peer.stdout == zfs_backup_snapshot_tailscale_ipv4
    quiet: true

- name: Inspect existing socket unit identity
  ansible.builtin.stat:
    path: /etc/systemd/system/home-lab-zfs-backup-snapshot.socket
    follow: false
    get_checksum: false
    get_mime: false
  register: zfs_backup_snapshot_socket

- name: Refuse an unfamiliar socket unit file
  ansible.builtin.assert:
    that: >-
      not zfs_backup_snapshot_socket.stat.exists or
      (zfs_backup_snapshot_socket.stat.isreg and not zfs_backup_snapshot_socket.stat.islnk and
       zfs_backup_snapshot_socket.stat.uid == 0 and zfs_backup_snapshot_socket.stat.gid == 0 and
       zfs_backup_snapshot_socket.stat.nlink == 1 and zfs_backup_snapshot_socket.stat.mode == '0644')
    quiet: true

- name: Read native listener state before changing an existing endpoint
  ansible.builtin.command:
    argv: [systemctl, show, '--property=ActiveState,Listen,BindToDevice', home-lab-zfs-backup-snapshot.socket]
  changed_when: false
  check_mode: false
  register: zfs_backup_snapshot_listener
  when: zfs_backup_snapshot_socket.stat.exists

- name: Observe the dedicated port without claiming an existing foreign listener
  ansible.builtin.command:
    argv: [/usr/bin/ss, '-H', '-lnt', sport, '=', ':2444']
  changed_when: false
  check_mode: false
  register: zfs_backup_snapshot_port

- name: Refuse a foreign endpoint or broader binding instead of adopting it
  ansible.builtin.assert:
    that:
      - >-
        zfs_backup_snapshot_port.stdout == '' or
        'ActiveState=active' in zfs_backup_snapshot_listener.stdout_lines | default([])
      - >-
        'ActiveState=active' not in zfs_backup_snapshot_listener.stdout_lines | default([]) or
        (('Listen=' + zfs_backup_snapshot_tailscale_ipv4 + ':2444 (Stream)') in zfs_backup_snapshot_listener.stdout_lines and
         'BindToDevice=tailscale0' in zfs_backup_snapshot_listener.stdout_lines)
    quiet: true

- name: Inspect existing snapshot configuration and executable parents
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
    get_mime: false
  loop: [/etc/home-lab, /usr/local/libexec/home-lab, /etc/tmpfiles.d, /etc/systemd/system]
  register: zfs_backup_snapshot_parents

- name: Refuse unfamiliar parent identities instead of changing their permissions
  ansible.builtin.assert:
    that: >-
      not item.stat.exists or
      (item.stat.isdir and not item.stat.islnk and item.stat.uid == 0 and item.stat.gid == 0 and
       item.stat.mode[-2] not in ['2', '3', '6', '7'] and item.stat.mode[-1] not in ['2', '3', '6', '7'])
    quiet: true
  loop: '{{ zfs_backup_snapshot_parents.results }}'
  loop_control:
    label: '{{ item.item }}'

- name: Create only missing root-controlled snapshot configuration and executable directories
  ansible.builtin.file:
    path: '{{ item.item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: '{{ zfs_backup_snapshot_parents.results }}'
  loop_control:
    label: '{{ item.item }}'
  when: not item.stat.exists

- name: Install the fixed-command snapshot adapter
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../../scripts/zfs-backup-snapshot'
    dest: /usr/local/libexec/home-lab/zfs-backup-snapshot
    owner: root
    group: root
    mode: '0755'

- name: Pin the independently observed dataset identity
  ansible.builtin.copy:
    content: "{{ {'dataset_guid': zfs_backup_snapshot_dataset_guid} | to_nice_json }}\n"
    dest: /etc/home-lab/zfs-backup-snapshot.json
    owner: root
    group: root
    mode: '0600'

- name: Declare the native root-only snapshot coordination inode
  ansible.builtin.copy:
    content: |
      f /run/lock/home-lab-zfs-backup-snapshot.lock 0600 root root - -
    dest: /etc/tmpfiles.d/home-lab-zfs-backup-snapshot.conf
    owner: root
    group: root
    mode: '0644'

- name: Create coordination without replacing an existing locked inode
  ansible.builtin.command:
    argv: [/usr/bin/systemd-tmpfiles, --create, /etc/tmpfiles.d/home-lab-zfs-backup-snapshot.conf]
  changed_when: false
  when: not ansible_check_mode

- name: Install native connection-limited interface-bound socket activation
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - home-lab-zfs-backup-snapshot.socket
    - home-lab-zfs-backup-snapshot@.service
  register: zfs_backup_snapshot_units

- name: Enable only the snapshot RPC listener without any login or forwarding service
  ansible.builtin.systemd_service:
    name: home-lab-zfs-backup-snapshot.socket
    daemon_reload: '{{ zfs_backup_snapshot_units.changed }}'
    enabled: true
    state: '{{ "restarted" if zfs_backup_snapshot_units.changed else "started" }}'
  when: not ansible_check_mode
