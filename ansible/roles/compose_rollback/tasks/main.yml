---
- name: Validate the previous-artifact rollback contract
  ansible.builtin.assert:
    that:
      - compose_artifact_hash is match('^[0-9a-f]{64}$')
      - compose_rollback_target_hash is match('^[0-9a-f]{64}$')
      - compose_artifact_hash != compose_rollback_target_hash
      - ansible_check_mode or (compose_rollback_confirmed | default(false) | ansible.builtin.bool)
      - ansible_check_mode or compose_rollback_expected_plan_hash is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Compose rollback requires distinct current and previous artifact hashes, the exact reviewed plan
      hash, and compose_rollback_confirmed=true outside check mode.

- name: Inspect current and previous deployment inputs
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  become: true
  register: compose_rollback_paths
  loop:
    - "{{ compose_current_dir }}"
    - "{{ compose_runtime_env_path }}"
    - "{{ compose_previous_dir }}"
    - "{{ compose_previous_env_path }}"

- name: Require complete protected current and previous inputs
  ansible.builtin.assert:
    that:
      - compose_rollback_paths.results[0].stat.isdir | default(false)
      - compose_rollback_paths.results[0].stat.pw_name == 'root'
      - compose_rollback_paths.results[0].stat.gr_name == 'root'
      - compose_rollback_paths.results[0].stat.mode in ['0700', '0750', '0755']
      - compose_rollback_paths.results[1].stat.isreg | default(false)
      - compose_rollback_paths.results[1].stat.pw_name == 'root'
      - compose_rollback_paths.results[1].stat.gr_name == 'root'
      - compose_rollback_paths.results[1].stat.mode == '0600'
      - compose_rollback_paths.results[2].stat.isdir | default(false)
      - compose_rollback_paths.results[2].stat.pw_name == 'root'
      - compose_rollback_paths.results[2].stat.gr_name == 'root'
      - compose_rollback_paths.results[2].stat.mode in ['0700', '0750', '0755']
      - compose_rollback_paths.results[3].stat.isreg | default(false)
      - compose_rollback_paths.results[3].stat.pw_name == 'root'
      - compose_rollback_paths.results[3].stat.gr_name == 'root'
      - compose_rollback_paths.results[3].stat.mode == '0600'
    fail_msg: "Current or previous rollback input is missing, writable, or incorrectly owned."

- name: Verify both rollback image sets remain locally and remotely available
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter }}"
      - "{{ compose_current_dir }}/scripts/compose-image-lock.py"
      - verify
      - --current
      - "{{ maintenance_compose_current_image_lock_path }}"
      - --previous
      - "{{ maintenance_compose_previous_image_lock_path }}"
      - --check-registry
  become: true
  changed_when: false
  check_mode: false
  no_log: true

- name: Derive services whose immutable image IDs differ across rollback locks
  ansible.builtin.command:
    argv: >-
      {{ [ansible_python_interpreter, compose_current_dir ~ '/scripts/compose-image-lock.py',
          'diff', '--current', maintenance_compose_current_image_lock_path,
          '--previous', maintenance_compose_previous_image_lock_path] +
         (['--allow-removed-service', nextcloud.cron_service]
          if (compose_rollback_nextcloud_migration_confirmation | default('')) ==
             'rollback-reviewed-nextcloud-five-mount-migration'
          else []) }}
  become: true
  register: compose_rollback_locked_image_diff
  changed_when: false
  check_mode: false
  no_log: true

- name: Bind mutable rollback references to the exact previous image IDs
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter }}"
      - "{{ compose_current_dir }}/scripts/compose-image-lock.py"
      - activate
      - --lock
      - "{{ maintenance_compose_previous_image_lock_path }}"
  become: true
  changed_when: true
  no_log: true
  when: not ansible_check_mode

- name: Recompute current and previous artifact identities
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter }}"
      - "{{ item }}/scripts/compose-artifact.py"
      - --root
      - "{{ item }}"
      - --no-git
      - hash
  become: true
  register: compose_rollback_artifact_hashes
  changed_when: false
  check_mode: false
  loop:
    - "{{ compose_current_dir }}"
    - "{{ compose_previous_dir }}"

- name: Compute current and previous environment identities without displaying them
  ansible.builtin.command:
    argv:
      - /usr/bin/sha256sum
      - "{{ item }}"
  become: true
  register: compose_rollback_environment_hashes
  changed_when: false
  check_mode: false
  loop:
    - "{{ compose_runtime_env_path }}"
    - "{{ compose_previous_env_path }}"
  no_log: true

- name: Compute current and previous image-lock identities
  ansible.builtin.command:
    argv:
      - /usr/bin/sha256sum
      - "{{ item }}"
  become: true
  register: compose_rollback_image_lock_hashes
  changed_when: false
  check_mode: false
  loop:
    - "{{ maintenance_compose_current_image_lock_path }}"
    - "{{ maintenance_compose_previous_image_lock_path }}"
  no_log: true

- name: Require exact artifacts and an unchanged rollback environment
  ansible.builtin.assert:
    that:
      - compose_rollback_artifact_hashes.results[0].stdout == compose_artifact_hash
      - compose_rollback_artifact_hashes.results[1].stdout == compose_rollback_target_hash
      - (compose_rollback_environment_hashes.results[0].stdout.split() | first) == (compose_rollback_environment_hashes.results[1].stdout.split() | first)
    fail_msg: >-
      Current, previous, or environment identity differs from the reviewed rollback. Environment
      changes require a separate recovery plan and cannot use artifact-only rollback.
  no_log: true

- name: List current and previous declared services without displaying configuration
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/docker', 'compose', '--project-name', compose_project_name,
          '--project-directory', item.root, '--env-file', item.env,
          '--file', item.root ~ '/docker-compose.yml', 'config', '--services'] }}
  become: true
  environment:
    HOME: "{{ compose_home_dir }}"
  register: compose_rollback_service_sets
  changed_when: false
  check_mode: false
  loop:
    - root: "{{ compose_current_dir }}"
      env: "{{ compose_runtime_env_path }}"
    - root: "{{ compose_previous_dir }}"
      env: "{{ compose_previous_env_path }}"
  no_log: true

- name: Identify the exact Nextcloud migration rollback service-set boundary
  ansible.builtin.set_fact:
    compose_rollback_nextcloud_migration: >-
      {{
        (compose_rollback_nextcloud_migration_confirmation | default('')) ==
          'rollback-reviewed-nextcloud-five-mount-migration' and
        (compose_rollback_service_sets.results[0].stdout_lines |
         difference(compose_rollback_service_sets.results[1].stdout_lines)) == [nextcloud.cron_service] and
        (compose_rollback_service_sets.results[1].stdout_lines |
         difference(compose_rollback_service_sets.results[0].stdout_lines)) | length == 0
      }}
  no_log: true
- name: Require rollback to preserve the complete service set
  ansible.builtin.assert:
    that:
      - >-
        ((compose_rollback_service_sets.results[0].stdout_lines | sort) ==
         (compose_rollback_service_sets.results[1].stdout_lines | sort)) or
        compose_rollback_nextcloud_migration
      - compose_rollback_service_sets.results[0].stdout_lines | length == audit_expected_compose_service_count
      - >-
        compose_rollback_service_sets.results[1].stdout_lines | length == audit_expected_compose_service_count or
        (compose_rollback_nextcloud_migration and
         compose_rollback_service_sets.results[1].stdout_lines | length == audit_expected_compose_service_count - 1)
    fail_msg: "Previous artifact changes the adopted Compose service set."
  no_log: true

- name: Remove stale root-only rollback planning files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  changed_when: false
  check_mode: false
  no_log: true
  loop:
    - /run/docker-compose-rollback-plan.json
    - /run/docker-compose-rollback-apply-plan.json
    - /run/docker-compose-rollback-target.json
    - /run/docker-compose-rollback-target-post.json
    - /run/docker-compose-rollback-current-post.json

- name: Produce the root-only previous-artifact action plan
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/../../../scripts/compose-action-plan.py
      --project-name {{ compose_project_name }}
      --project-directory {{ compose_previous_dir }}
      --env-file {{ compose_previous_env_path }}
      --compose-file {{ compose_previous_dir }}/docker-compose.yml
      --bind-root-override {{ compose_current_dir }}
      --output /run/docker-compose-rollback-plan.json
    executable: "{{ ansible_python_interpreter }}"
  become: true
  environment:
    HOME: "{{ compose_home_dir }}"
  changed_when: false
  check_mode: false
  no_log: true

- name: Read the root-only previous-artifact action plan
  ansible.builtin.slurp:
    src: /run/docker-compose-rollback-plan.json
  become: true
  register: compose_rollback_plan_file
  changed_when: false
  check_mode: false
  no_log: true

- name: Parse and bind the secret-free rollback plan to immutable image IDs
  ansible.builtin.set_fact:
    compose_rollback_plan: "{{ compose_rollback_plan_file.content | b64decode | from_json }}"
    compose_rollback_recreate_services: >-
      {{
        ((compose_rollback_plan_file.content | b64decode | from_json).recreate_services
        + (compose_rollback_locked_image_diff.stdout | from_json)) | unique | sort
      }}
    compose_rollback_effective_action_count: >-
      {{
        (compose_rollback_plan_file.content | b64decode | from_json).action_count
        + ((compose_rollback_locked_image_diff.stdout | from_json) |
           difference((compose_rollback_plan_file.content | b64decode | from_json).recreate_services) | length)
      }}
  no_log: true

- name: Remove the root-only rollback plan
  ansible.builtin.file:
    path: /run/docker-compose-rollback-plan.json
    state: absent
  become: true
  changed_when: false
  check_mode: false
  no_log: true

- name: Build the private deterministic rollback identity
  ansible.builtin.set_fact:
    compose_rollback_plan_identity:
      current_hash: "{{ compose_artifact_hash }}"
      target_hash: "{{ compose_rollback_target_hash }}"
      environment_sha256: "{{ compose_rollback_environment_hashes.results[0].stdout.split() | first }}"
      current_image_lock_sha256: "{{ compose_rollback_image_lock_hashes.results[0].stdout.split() | first }}"
      previous_image_lock_sha256: "{{ compose_rollback_image_lock_hashes.results[1].stdout.split() | first }}"
      recreate_services: "{{ compose_rollback_recreate_services }}"
      forbidden_actions: "{{ compose_rollback_plan.forbidden_actions }}"
      action_count: "{{ compose_rollback_effective_action_count }}"
    compose_rollback_plan_hash: >-
      {{ ({
        'current_hash': compose_artifact_hash,
        'target_hash': compose_rollback_target_hash,
        'environment_sha256': compose_rollback_environment_hashes.results[0].stdout.split() | first,
        'current_image_lock_sha256': compose_rollback_image_lock_hashes.results[0].stdout.split() | first,
        'previous_image_lock_sha256': compose_rollback_image_lock_hashes.results[1].stdout.split() | first,
        'recreate_services': compose_rollback_recreate_services,
        'forbidden_actions': compose_rollback_plan.forbidden_actions,
        'action_count': compose_rollback_effective_action_count
      } | to_json) | hash('sha256') }}
  no_log: true

- name: Display only the secret-free rollback boundary
  ansible.builtin.debug:
    msg:
      current_hash: "{{ compose_artifact_hash }}"
      target_hash: "{{ compose_rollback_target_hash }}"
      recreate_services: "{{ compose_rollback_recreate_services }}"
      forbidden_action_count: "{{ compose_rollback_plan.forbidden_actions | length }}"
      environment_unchanged: true

- name: Report the deterministic private rollback plan identity
  ansible.builtin.debug:
    msg: "compose_rollback_plan_sha256={{ compose_rollback_plan_hash }}"

- name: Require the safe rollback boundary and exact apply-time plan
  ansible.builtin.assert:
    that:
      - >-
          compose_rollback_plan.forbidden_actions | length == 0 or
          (
            compose_rollback_nextcloud_migration and
            compose_rollback_plan.forbidden_actions | length == 1 and
            compose_rollback_plan.forbidden_actions[0].service == nextcloud.cron_service and
            compose_rollback_plan.forbidden_actions[0].action in ['Remove', 'Removing', 'Removed']
          )
      - ansible_check_mode or compose_rollback_plan_hash == compose_rollback_expected_plan_hash
    fail_msg: "Rollback proposes create/removal actions or differs from the exact reviewed plan."
  no_log: true

- name: Report the check-mode rollback boundary
  ansible.builtin.debug:
    msg:
      current_artifact_hash: "{{ compose_artifact_hash }}"
      target_artifact_hash: "{{ compose_rollback_target_hash }}"
      recreation_services: "{{ compose_rollback_recreate_services }}"
  changed_when: true
  when: ansible_check_mode

- name: Converge and atomically activate the exact reviewed previous artifact
  when: not ansible_check_mode
  block:
    - name: Regenerate the exact normalized target and action plan immediately before convergence
      ansible.builtin.script:
        cmd: >-
          {{ role_path }}/../../../scripts/compose-action-plan.py
          --project-name {{ compose_project_name }}
          --project-directory {{ compose_previous_dir }}
          --env-file {{ compose_previous_env_path }}
          --compose-file {{ compose_previous_dir }}/docker-compose.yml
          --bind-root-override {{ compose_current_dir }}
          --normalized-output /run/docker-compose-rollback-target.json
          --output /run/docker-compose-rollback-apply-plan.json
        executable: "{{ ansible_python_interpreter }}"
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      changed_when: false
      no_log: true

    - name: Read the immediate apply-time rollback action plan
      ansible.builtin.slurp:
        src: /run/docker-compose-rollback-apply-plan.json
      become: true
      register: compose_rollback_apply_plan_file
      changed_when: false
      no_log: true

    - name: Parse the immediate apply-time rollback action plan
      ansible.builtin.set_fact:
        compose_rollback_apply_plan: "{{ compose_rollback_apply_plan_file.content | b64decode | from_json }}"
      no_log: true

    - name: Require the apply-time action set to match the reviewed plan
      ansible.builtin.assert:
        that:
          - (compose_rollback_apply_plan.recreate_services | sort) == (compose_rollback_plan.recreate_services | sort)
          - compose_rollback_apply_plan.forbidden_actions == compose_rollback_plan.forbidden_actions
          - compose_rollback_apply_plan.action_count == compose_rollback_plan.action_count
        fail_msg: "Apply-time rollback actions differ from the reviewed plan."
      no_log: true

    - name: Stop Nextcloud writers before migration rollback
      ansible.builtin.command:
        argv: [/usr/bin/docker, stop, "{{ nextcloud.cron_service }}", "{{ nextcloud.web_service }}"]
      when: compose_rollback_nextcloud_migration
      changed_when: true
      no_log: true

    - name: Remove only the approved Nextcloud cron container before previous-model convergence
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - container
          - rm
          - --force
          - "{{ nextcloud.cron_service }}"
      when: compose_rollback_nextcloud_migration
      changed_when: true
      no_log: true
    - name: Recreate only the reviewed rollback services without pulls or builds
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/docker', 'compose', '--project-name', compose_project_name,
              '--project-directory', compose_current_dir, '--env-file', compose_runtime_env_path,
              '--file', '/run/docker-compose-rollback-target.json', 'up', '--detach', '--no-build',
              '--pull', 'never', '--no-deps', '--force-recreate'] + compose_rollback_recreate_services }}
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      no_log: true
      when: compose_rollback_recreate_services | length > 0
      changed_when: true

    - name: Require target-model convergence before artifact activation
      ansible.builtin.script:
        cmd: >-
          {{ role_path }}/../../../scripts/compose-action-plan.py
          --project-name {{ compose_project_name }}
          --project-directory {{ compose_current_dir }}
          --env-file {{ compose_runtime_env_path }}
          --compose-file /run/docker-compose-rollback-target.json
          --output /run/docker-compose-rollback-target-post.json
        executable: "{{ ansible_python_interpreter }}"
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      changed_when: false
      no_log: true

    - name: Read the target-model post-convergence plan
      ansible.builtin.slurp:
        src: /run/docker-compose-rollback-target-post.json
      become: true
      register: compose_rollback_target_post_file
      changed_when: false
      no_log: true

    - name: Parse the target-model post-convergence plan
      ansible.builtin.set_fact:
        compose_rollback_target_post: "{{ compose_rollback_target_post_file.content | b64decode | from_json }}"
      no_log: true

    - name: Require idempotent target-model convergence
      ansible.builtin.assert:
        that:
          - compose_rollback_target_post.recreate_services | length == 0
          - compose_rollback_target_post.forbidden_actions | length == 0
        fail_msg: "Rollback target model still proposes container convergence."
      no_log: true

    - name: Atomically exchange current and previous artifacts after Docker convergence
      ansible.builtin.command:
        argv:
          - /usr/bin/mv
          - --exchange
          - --no-target-directory
          - --
          - "{{ compose_current_dir }}"
          - "{{ compose_previous_dir }}"
      become: true
      no_log: true
      changed_when: true

    - name: Atomically exchange current and previous image locks
      ansible.builtin.command:
        argv:
          - /usr/bin/mv
          - --exchange
          - --no-target-directory
          - --
          - "{{ maintenance_compose_current_image_lock_path }}"
          - "{{ maintenance_compose_previous_image_lock_path }}"
      become: true
      no_log: true
      changed_when: true

    - name: Recompute activated current and retained previous artifact identities
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ item }}/scripts/compose-artifact.py"
          - --root
          - "{{ item }}"
          - --no-git
          - hash
      become: true
      register: compose_rollback_activated_hashes
      changed_when: false
      loop:
        - "{{ compose_current_dir }}"
        - "{{ compose_previous_dir }}"

    - name: Require exact artifact exchange identities
      ansible.builtin.assert:
        that:
          - compose_rollback_activated_hashes.results[0].stdout == compose_rollback_target_hash
          - compose_rollback_activated_hashes.results[1].stdout == compose_artifact_hash
        fail_msg: "Atomic artifact exchange produced unexpected identities."
      no_log: true

    - name: Produce the active-artifact post-rollback action plan
      ansible.builtin.script:
        cmd: >-
          {{ role_path }}/../../../scripts/compose-action-plan.py
          --project-name {{ compose_project_name }}
          --project-directory {{ compose_current_dir }}
          --env-file {{ compose_runtime_env_path }}
          --compose-file {{ compose_current_dir }}/docker-compose.yml
          --output /run/docker-compose-rollback-current-post.json
        executable: "{{ ansible_python_interpreter }}"
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      changed_when: false
      no_log: true

    - name: Read the active-artifact post-rollback action plan
      ansible.builtin.slurp:
        src: /run/docker-compose-rollback-current-post.json
      become: true
      register: compose_rollback_current_post_file
      changed_when: false
      no_log: true

    - name: Parse the active-artifact post-rollback action plan
      ansible.builtin.set_fact:
        compose_rollback_current_post: "{{ compose_rollback_current_post_file.content | b64decode | from_json }}"
      no_log: true

    - name: Require an idempotent active-artifact post-rollback plan
      ansible.builtin.assert:
        that:
          - compose_rollback_current_post.recreate_services | length == 0
          - compose_rollback_current_post.forbidden_actions | length == 0
        fail_msg: "Activated rollback artifact still proposes container convergence."
      no_log: true

    - name: Publish the exact active rollback artifact identity for Restic acceptance
      ansible.builtin.copy:
        content: "{{ compose_rollback_target_hash }}\n"
        dest: /var/lib/docker-compose/current-artifact.sha256
        owner: root
        group: root
        mode: "0444"
      become: true
  always:
    - name: Remove root-only normalized rollback and action files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      changed_when: false
      no_log: true
      loop:
        - /run/docker-compose-rollback-apply-plan.json
        - /run/docker-compose-rollback-target.json
        - /run/docker-compose-rollback-target-post.json
        - /run/docker-compose-rollback-current-post.json
