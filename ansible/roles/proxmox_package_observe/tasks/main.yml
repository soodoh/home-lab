---
- name: Require the native Proxmox package inventory scope
  ansible.builtin.assert:
    that:
      - inventory_hostname == 'proxmox'
      - ansible_connection == 'ssh'
      - ansible_become | bool

- name: Gather installed packages using the native APT bindings
  ansible.builtin.package_facts:
    manager: apt
    strategy: first
  no_log: true
  timeout: 60

- name: Check dpkg for unfinished package configuration without repairing it
  ansible.builtin.command:
    argv: [/usr/bin/dpkg, --audit]
  register: proxmox_package_audit
  changed_when: false
  check_mode: false
  no_log: true
  timeout: 60

- name: Refuse unfinished package configuration
  ansible.builtin.assert:
    that:
      - proxmox_package_audit.rc == 0
      - proxmox_package_audit.stdout == ''
      - proxmox_package_audit.stderr == ''
    fail_msg: dpkg requires separate inspection; no package repair was attempted.
  no_log: true

- name: Read held package selections without changing them
  ansible.builtin.command:
    argv: [/usr/bin/apt-mark, showhold]
  register: proxmox_package_holds
  changed_when: false
  check_mode: false
  no_log: true
  timeout: 60

- name: Require successful native package reads
  ansible.builtin.assert:
    that:
      - ansible_facts.packages is mapping
      - ansible_facts.packages | length > 0
      - proxmox_package_holds.rc == 0
      - proxmox_package_holds.stderr == ''
  no_log: true

- name: Report installed inventory without predicting a solver transaction
  ansible.builtin.debug:
    msg:
      installed_package_names: "{{ ansible_facts.packages | length }}"
      held_packages: "{{ proxmox_package_holds.stdout_lines | length }}"
      dpkg_audit: clean
      metadata_refresh_performed: false
      candidate_preview_performed: false
      apply_authorized: false
      scope: Nonexclusive installed inventory; not a solver preview, recovery decision or maintenance authorization.
