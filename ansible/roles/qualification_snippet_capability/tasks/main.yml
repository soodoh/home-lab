---
- name: Load the direct lifecycle contract for isolation refusal
  ansible.builtin.set_fact:
    qualification_snippet_capability_contract: "{{ lookup('ansible.builtin.file', role_path ~ '/../../../infrastructure/contract/home-lab.yml') | from_yaml }}"
  no_log: true

- name: Validate accepted production-PVE qualification capability inputs
  ansible.builtin.assert:
    that:
      - inventory_hostname == 'proxmox-qualification-bootstrap'
      - lifecycle_profile == 'maintenance'
      - ansible_user == 'proxmox'
      - ansible_host | length > 0
      - >-
        ansible_host in [qualification_snippet_capability_contract.proxmox.node,
        (qualification_snippet_capability_contract.network.proxmox.ipv4 | split('/') | first)]
      - qualification_snippet_capability_contract.lifecycle.qualification_route.mode == 'production-pve-disposable-vm'
      - not qualification_snippet_capability_contract.lifecycle.qualification_route.production_vm_mutation_allowed
      - not qualification_snippet_capability_contract.lifecycle.qualification_route.production_disk_attachment_allowed
      - not qualification_snippet_capability_contract.lifecycle.qualification_route.production_state_allowed
      - disposable_pve_admission_sha256 is match('^[0-9a-f]{64}$')
      - disposable_pve_target_id == 'production-pve-vm9900-qualification'
      - disposable_pve_node_name == qualification_snippet_capability_contract.proxmox.node
      - qualification_snippet_capability_contract.lifecycle.qualification_route.temporary_tailnet_user == 'qualification-apply'
      - not qualification_snippet_capability_contract.lifecycle.qualification_route.conventional_ssh_key_allowed
      - ansible_check_mode or (qualification_capability_confirmation | default('')) == 'install-production-pve-vm9900-qualification-capability'
    fail_msg: Qualification capability installation is restricted to the accepted production-PVE/VM9900 route.

- name: Bind capability source identities
  ansible.builtin.set_fact:
    qualification_snippet_capability_helper_source: >-
      {{ lookup('ansible.builtin.file',
      role_path ~ '/../../../infrastructure/qualification/host/debian-qualification-snippet-transaction') }}
    qualification_snippet_capability_transport_source: >-
      {{ lookup('ansible.builtin.file',
      role_path ~ '/../../../infrastructure/qualification/host/debian-qualification-snippet-transport') }}
    qualification_snippet_capability_helper_sha256: >-
      {{ lookup('ansible.builtin.file',
      role_path ~ '/../../../infrastructure/qualification/host/debian-qualification-snippet-transaction') | hash('sha256') }}
    qualification_snippet_capability_transport_sha256: >-
      {{ lookup('ansible.builtin.file',
      role_path ~ '/../../../infrastructure/qualification/host/debian-qualification-snippet-transport') | hash('sha256') }}
  no_log: true

- name: Report the bounded check-mode capability plan
  ansible.builtin.debug:
    msg:
      admission_sha256: "{{ disposable_pve_admission_sha256 }}"
      target_id: "{{ disposable_pve_target_id }}"
      node_name: "{{ disposable_pve_node_name }}"
      uid_gid: 1900
      helper_sha256: "{{ qualification_snippet_capability_helper_sha256 }}"
      transport_sha256: "{{ qualification_snippet_capability_transport_sha256 }}"
      mutation_authorized: false
  changed_when: true
  when: ansible_check_mode

- name: Inspect fixed qualification UID
  ansible.builtin.command:
    argv: [/usr/bin/getent, passwd, '1900']
  register: qualification_snippet_capability_uid
  changed_when: false
  failed_when: qualification_snippet_capability_uid.rc not in [0, 2]
  check_mode: false

- name: Refuse a conflicting qualification UID
  ansible.builtin.assert:
    that:
      - qualification_snippet_capability_uid.rc == 2 or qualification_snippet_capability_uid.stdout.split(':')[0] == 'qualification-apply'
    fail_msg: Fixed qualification UID 1900 is already owned by another account.

- name: Inspect production local storage content types
  ansible.builtin.command:
    argv:
      - /usr/bin/pvesh
      - get
      - /storage/local
      - --output-format
      - json
  register: qualification_snippet_capability_local_storage
  changed_when: false
  check_mode: false

- name: Bind and validate the local storage precondition
  ansible.builtin.set_fact:
    qualification_snippet_capability_local_storage_value: >-
      {{ qualification_snippet_capability_local_storage.stdout | from_json }}
    qualification_snippet_capability_local_content: >-
      {{ (qualification_snippet_capability_local_storage.stdout | from_json).content.split(',') | sort }}
  no_log: true

- name: Refuse unexpected production local storage configuration
  ansible.builtin.assert:
    that:
      - qualification_snippet_capability_local_storage_value.storage == 'local'
      - qualification_snippet_capability_local_storage_value.type == 'dir'
      - qualification_snippet_capability_local_storage_value.path == '/var/lib/vz'
      - >-
        qualification_snippet_capability_local_content in [
        ['backup', 'import', 'iso', 'vztmpl'],
        ['backup', 'import', 'iso', 'snippets', 'vztmpl']]
    fail_msg: Production local storage differs from the exact additive snippets transition.
  no_log: true

- name: Enable snippets as the sole local storage content addition
  ansible.builtin.command:
    argv:
      - /usr/bin/pvesh
      - set
      - /storage/local
      - --content
      - backup,import,iso,snippets,vztmpl
  when:
    - not ansible_check_mode
    - "'snippets' not in qualification_snippet_capability_local_content"
  changed_when: true

- name: Create the fixed local snippets directory
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode

- name: Create fixed qualification group
  ansible.builtin.group:
    name: qualification-apply
    gid: 1900
    system: true
    state: present
  when: not ansible_check_mode

- name: Create locked fixed-transport qualification account
  ansible.builtin.user:
    name: qualification-apply
    uid: 1900
    group: qualification-apply
    groups: []
    append: false
    create_home: true
    home: /home/qualification-apply
    shell: /usr/local/libexec/home-lab/debian-qualification-snippet-transport
    password_lock: true
    system: true
    state: present
  when: not ansible_check_mode

- name: Create qualification executable root
  ansible.builtin.file:
    path: /usr/local/libexec/home-lab
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode

- name: Install fixed qualification host transaction
  ansible.builtin.copy:
    content: "{{ qualification_snippet_capability_helper_source }}"
    dest: /usr/local/libexec/home-lab/debian-qualification-snippet-transaction
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode
  no_log: true

- name: Install fixed qualification forced transport
  ansible.builtin.copy:
    content: "{{ qualification_snippet_capability_transport_source }}"
    dest: /usr/local/libexec/home-lab/debian-qualification-snippet-transport
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode
  no_log: true

- name: Remove conventional qualification authorized-key files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/qualification-apply/.ssh/authorized_keys
    - /home/qualification-apply/.ssh/authorized_keys2
  when: not ansible_check_mode
- name: Install fixed qualification sudo boundary
  ansible.builtin.copy:
    content: >-
      qualification-apply ALL=(root) NOPASSWD:
      /usr/local/libexec/home-lab/debian-qualification-snippet-transaction observe,
      /usr/local/libexec/home-lab/debian-qualification-snippet-transaction first-boot,
      /usr/local/libexec/home-lab/debian-qualification-snippet-transaction apply *,
      /usr/local/libexec/home-lab/debian-qualification-snippet-transaction host-key *,
      /usr/local/libexec/home-lab/debian-qualification-snippet-transaction hold-lock *
    dest: /etc/sudoers.d/qualification-apply
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo --check --file=%s
  when: not ansible_check_mode

- name: Reinspect local storage after capability installation
  ansible.builtin.command:
    argv:
      - /usr/bin/pvesh
      - get
      - /storage/local
      - --output-format
      - json
  register: qualification_snippet_capability_local_storage_after
  changed_when: false
  when: not ansible_check_mode

- name: Verify additive local snippets content
  ansible.builtin.assert:
    that:
      - >-
        ((qualification_snippet_capability_local_storage_after.stdout | from_json).content.split(',') | sort) ==
        ['backup', 'import', 'iso', 'snippets', 'vztmpl']
    fail_msg: Local storage snippets content was not enabled exactly.
  when: not ansible_check_mode

- name: Inspect installed qualification artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
    follow: false
  loop:
    - /usr/local/libexec/home-lab/debian-qualification-snippet-transaction
    - /usr/local/libexec/home-lab/debian-qualification-snippet-transport
    - /etc/sudoers.d/qualification-apply
  register: qualification_snippet_capability_installed
  when: not ansible_check_mode
  no_log: true

- name: Verify installed qualification capability identities
  ansible.builtin.assert:
    that:
      - qualification_snippet_capability_installed.results[0].stat.checksum == qualification_snippet_capability_helper_sha256
      - qualification_snippet_capability_installed.results[1].stat.checksum == qualification_snippet_capability_transport_sha256
      - qualification_snippet_capability_installed.results | map(attribute='stat.isreg') | select('equalto', true) | list | length == 3
      - qualification_snippet_capability_installed.results | map(attribute='stat.islnk') | select('equalto', true) | list | length == 0
    fail_msg: Installed qualification capability differs from reviewed source.
  when: not ansible_check_mode
  no_log: true

- name: Inspect forbidden conventional qualification keys
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /home/qualification-apply/.ssh/authorized_keys
    - /home/qualification-apply/.ssh/authorized_keys2
  register: qualification_snippet_capability_authorized_keys
  when: not ansible_check_mode

- name: Require conventional qualification keys absent
  ansible.builtin.assert:
    that:
      - >-
        qualification_snippet_capability_authorized_keys.results |
        map(attribute='stat.exists') | select('equalto', true) | list | length == 0
    fail_msg: Conventional qualification authorized keys remain present.
  when: not ansible_check_mode
