---
- name: Inspect adopted Restic runtime ancestors
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - /
    - /etc
    - /etc/home-lab
    - /etc/home-lab/restic
    - /usr
    - /usr/local
    - /usr/local/libexec
    - /usr/local/libexec/home-lab
  register: restic_runtime_ancestors # noqa: var-naming[no-role-prefix]

- name: Require root-controlled Restic runtime ancestors
  ansible.builtin.assert:
    that:
      - item.stat.isdir | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.uid == 0
      - item.stat.mode[-2] not in ['2', '3', '6', '7']
      - item.stat.mode[-1] not in ['2', '3', '6', '7']
    fail_msg: Restic runtime ancestors must be existing root-controlled directories.
    quiet: true
  loop: "{{ restic_runtime_ancestors.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect adopted Restic runtime files and interruption journal
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - /etc/home-lab/restic-policy.json
    - /usr/local/libexec/home-lab/restic-backup
    - /etc/home-lab/restic/files-from
    - /etc/home-lab/restic/excludes
    - "{{ restic_systemd.journal_path }}"
  register: restic_runtime_paths # noqa: var-naming[no-role-prefix]

- name: Refuse unsafe adopted Restic files or an interrupted snapshot window
  ansible.builtin.assert:
    that:
      - not (restic_runtime_paths.results[4].stat.exists | default(false))
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.nlink == 1
      - item.stat.uid == 0
      - item.stat.mode[-2] not in ['2', '3', '6', '7']
      - item.stat.mode[-1] not in ['2', '3', '6', '7']
    fail_msg: Restic convergence requires safe adopted files and no interruption journal.
    quiet: true
  loop: "{{ restic_runtime_paths.results[:4] }}"
  loop_control:
    label: "{{ item.item }}"

- name: Require reviewed Restic policy and runtime bindings
  ansible.builtin.assert:
    that:
      - policy.policy_version == 1
      - restic_systemd.runner_path == '/usr/local/libexec/home-lab/restic-backup'
      - policy.runner.path == '/usr/local/libexec/home-lab/restic-backup'
      - policy.runner.policy_path == '/etc/home-lab/restic-policy.json'
      - policy.runner.files_from_path == '/etc/home-lab/restic/files-from'
      - policy.runner.exclude_file_path == '/etc/home-lab/restic/excludes'
      - runner_sha256 == policy.runner.sha256
    fail_msg: Reviewed Restic policy, runner and generated inputs must agree exactly.
    quiet: true
  vars:
    policy: >-
      {{ lookup('ansible.builtin.file', playbook_dir + '/../../services/data/restic/policy.json') | from_json }}
    runner_sha256: >-
      {{ lookup('ansible.builtin.file', playbook_dir + '/../../scripts/restic-backup',
         rstrip=false, lstrip=false) | hash('sha256') }}
  no_log: true

- name: Install reviewed Restic policy
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../services/data/restic/policy.json"
    dest: /etc/home-lab/restic-policy.json
    owner: root
    group: restic-proton
    mode: "0440"

- name: Install reviewed Restic inputs
  ansible.builtin.import_tasks: inputs.yml

- name: Install reviewed Restic runner
  ansible.builtin.import_tasks: runner.yml
