---
- name: Require Restic tool platform and contract bindings before effects
  ansible.builtin.assert:
    that:
      - lifecycle_contract_host == 'debian'
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == debian.version
      - ansible_facts.distribution_release == debian.release
      - ansible_python_interpreter == '/usr/bin/python3'
      - backups.restic.tools.restic.architecture == 'linux_amd64'
      - backups.restic.tools.restic.installed_path == '/usr/local/bin/restic'
      - restic_version == backups.restic.tools.restic.version
      - restic_download_url == backups.restic.tools.restic.url
      - restic_archive_sha256 == backups.restic.tools.restic.archive_sha256
      - restic_binary_sha256 == backups.restic.tools.restic.installed_sha256
      - backups.restic.tools.rclone.architecture == 'linux_amd64'
      - backups.restic.tools.rclone.installed_path == '/usr/local/bin/rclone'
      - rclone_version == backups.restic.tools.rclone.version
      - rclone_download_url == backups.restic.tools.rclone.url
      - rclone_archive_sha256 == backups.restic.tools.rclone.archive_sha256
      - rclone_binary_sha256 == backups.restic.tools.rclone.installed_sha256
      - restic_version_output == backups.restic.tools.restic.version_output
      - rclone_version_output == backups.restic.tools.rclone.version_output_prefix
    fail_msg: Pinned tools require the contracted Debian platform and exact direct-contract bindings.

- name: Install and verify shared pinned Restic tools
  ansible.builtin.import_tasks: tools-install.yml
