---
- name: Install Restic runner
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - src: "{{ playbook_dir }}/../../scripts/restic-backup"
      dest: /usr/local/libexec/home-lab/restic-backup
      mode: '0755'
