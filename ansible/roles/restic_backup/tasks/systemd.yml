---
- name: Require explicit existing-host backup configuration
  ansible.builtin.assert:
    that:
      - restic_systemd_existing_host | default(false) == true
      - restic_systemd is defined
    fail_msg: This entrypoint configures existing backups only; it does not bootstrap or qualify them.
    quiet: true

- name: Inspect existing Restic unit definitions
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop: "{{ restic_systemd_unit_names }}"
  register: restic_backup_systemd_existing_units

- name: Require all adopted Restic unit files before configuration
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
    fail_msg: All nine Restic units must already be installed as regular files; bootstrap is out of scope.
    quiet: true
  loop: "{{ restic_backup_systemd_existing_units.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Render shared Restic unit definitions
  ansible.builtin.import_tasks: units.yml
