---
- name: Keep the dedicated controller user present
  ansible.builtin.user:
    name: "{{ deploy_user_account_name }}"
    comment: "{{ deploy_user_account_comment }}"
    home: "{{ deploy_user_account_home }}"
    shell: "{{ deploy_user_account_shell }}"
    create_home: true
    state: present
  become: "{{ not ansible_check_mode }}"

- name: Inspect the controller-user password lock before convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/passwd
      - --status
      - "{{ deploy_user_account_name }}"
  become: true
  register: deploy_user_password_before
  changed_when: false
  when: not ansible_check_mode

- name: Lock the controller-user password when needed
  ansible.builtin.command:
    argv:
      - /usr/bin/usermod
      - --lock
      - "{{ deploy_user_account_name }}"
  become: true
  changed_when: true
  when:
    - not ansible_check_mode
    - deploy_user_password_before.stdout.split()[1] != 'L'

- name: Inspect the controller-user password lock after convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/passwd
      - --status
      - "{{ deploy_user_account_name }}"
  become: true
  register: deploy_user_password_result
  changed_when: false
  when: not ansible_check_mode

- name: Assert the controller-user password is locked
  ansible.builtin.assert:
    that:
      - deploy_user_password_result.stdout.split()[1] == 'L'
    fail_msg: "The controller user must have a locked password."
  when: not ansible_check_mode

- name: Report the planned controller sudo policy in check mode
  ansible.builtin.debug:
    msg: >-
      A normal approved bootstrap will install {{ deploy_user_account_sudoers_path }} with mode 0440 and visudo
      validation. The user remains outside every supplementary group, including docker.
  when: ansible_check_mode

- name: Install the controller-user sudo policy only during an approved normal bootstrap
  ansible.builtin.copy:
    content: "{{ deploy_user_account_sudoers_content }}"
    dest: "{{ deploy_user_account_sudoers_path }}"
    owner: root
    group: root
    mode: "0440"
    backup: false
    validate: /usr/sbin/visudo --check --file=%s
  become: true
  when: not ansible_check_mode

- name: Inspect controller-user group membership before convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - --name
      - --groups
      - "{{ deploy_user_account_name }}"
  register: deploy_user_groups_before
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Remove every supplementary group from the controller user
  ansible.builtin.command:
    argv:
      - /usr/bin/usermod
      - --groups=
      - "{{ deploy_user_account_name }}"
  become: true
  changed_when: true
  when:
    - not ansible_check_mode
    - deploy_user_groups_before.stdout.split() | difference([deploy_user_account_name]) | length > 0

- name: Inspect controller-user group membership after convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - --name
      - --groups
      - "{{ deploy_user_account_name }}"
  register: deploy_user_groups_result
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Assert the controller user has no supplementary groups
  ansible.builtin.assert:
    that:
      - deploy_user_groups_result.stdout.split() | sort == [deploy_user_account_name]
    fail_msg: "The controller user must have only its private primary group."
  when: not ansible_check_mode
