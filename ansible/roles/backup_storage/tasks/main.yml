---
- name: Create the ordered local backup destinations
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ backups.local_paths }}"
  become: true

- name: Inspect the local backup destinations without following links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_attributes: false
    get_checksum: false
    get_mime: false
  loop: "{{ backups.local_paths }}"
  register: backup_storage_paths

- name: Require exact safe local backup directories after convergence
  ansible.builtin.assert:
    that:
      - ansible_check_mode or (backup_storage_paths.results[0].stat.isdir | default(false))
      - ansible_check_mode or not (backup_storage_paths.results[0].stat.islnk | default(false))
      - ansible_check_mode or (backup_storage_paths.results[1].stat.isdir | default(false))
      - ansible_check_mode or not (backup_storage_paths.results[1].stat.islnk | default(false))
      - ansible_check_mode or (backup_storage_paths.results[2].stat.isdir | default(false))
      - ansible_check_mode or not (backup_storage_paths.results[2].stat.islnk | default(false))
    quiet: true

- name: Verify independent filesystems and tiered retention capacity
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/../../../scripts/check-backup-storage.py
      --path {{ backups.local_paths[0] | quote }}
      --path {{ backups.local_paths[1] | quote }}
      --path {{ backups.local_paths[2] | quote }}
      --home-retention-days {{ backups.home_retention_days }}
      --replica-retention-days {{ backups.local_retention_days }}
      --estimated-archive-bytes {{ backups.estimated_archive_bytes }}
    executable: "{{ ansible_python_interpreter }}"
  register: backup_storage_capacity
  changed_when: false
  become: true
  check_mode: false
  when:
    - backup_storage_paths.results[0].stat.isdir | default(false)
    - backup_storage_paths.results[1].stat.isdir | default(false)
    - backup_storage_paths.results[2].stat.isdir | default(false)
