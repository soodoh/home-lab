---
- name: List running services from the active Compose artifact
  ansible.builtin.command:
    argv: "{{ compose_runtime_cli + ['ps', '--status', 'running', '--services'] }}"
  environment:
    HOME: "{{ compose_home_dir }}"
  register: health_running_services
  changed_when: false
  check_mode: false
  until: ansible_check_mode or health_running_services.stdout_lines | length == audit_expected_running_compose_service_count | int
  retries: 30
  delay: 10

- name: List all materialized services from the active Compose artifact
  ansible.builtin.command:
    argv: "{{ compose_runtime_cli + ['ps', '--all', '--services'] }}"
  environment:
    HOME: "{{ compose_home_dir }}"
  register: health_materialized_services
  changed_when: false
  check_mode: false

- name: Assert adopted Compose services remain in the contract scheduler state
  ansible.builtin.assert:
    that:
      - ansible_check_mode or health_materialized_services.stdout_lines | length in audit_allowed_materialized_compose_service_counts
      - ansible_check_mode or health_running_services.stdout_lines | length == audit_expected_running_compose_service_count | int
      - >-
        ansible_check_mode or
        (health_materialized_services.stdout_lines | difference(health_running_services.stdout_lines) | sort) ==
        (audit_expected_stopped_compose_services | sort) or
        (backups.legacy_offen.retirement.state in ['retirement-planned', 'retirement-finalizing'] and
         (health_materialized_services.stdout_lines | difference(health_running_services.stdout_lines) | length) == 0)
    fail_msg: One or more adopted Compose services differ from the contract scheduler state.

- name: Inspect required container health without exposing container configuration
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - inspect
      - --format
      - "{{ audit_container_health_format }}"
      - "{{ item.key }}"
  register: health_blocker_results
  loop: "{{ audit_expected_health | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  check_mode: false
  until: health_blocker_results.stdout == item.key ~ '|running|' ~ item.value
  retries: 30
  delay: 10

- name: Assert required container health remains stable
  ansible.builtin.assert:
    that:
      - item.stdout == item.item.key ~ '|running|' ~ item.item.value
    fail_msg: "{{ item.item.key }} state or health changed; review before convergence."
  loop: "{{ health_blocker_results.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Report the healthy Compose baseline
  ansible.builtin.debug:
    msg: >-
      Gluetun and Seerr are healthy. This check preserves the current baseline and does not authorize
      Compose convergence.
