---
- name: Pin Arch repositories to the immutable recovery snapshot
  ansible.builtin.copy:
    dest: /etc/pacman.d/mirrorlist
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible for deterministic recovery.
      Server = https://archive.archlinux.org/repos/{{ arch.repository_snapshot }}/$repo/os/$arch
  register: arch_packages_mirrorlist
  notify: Refresh package databases

- name: Refresh package databases before package convergence
  ansible.builtin.meta: flush_handlers

- name: Keep Arch hardware and runtime prerequisites present without upgrades
  ansible.builtin.include_role:
    name: pacman_packages
  vars:
    pacman_packages_requested:
      - bluez
      - cloud-guest-utils
      - curl
      - dkms
      - e2fsprogs
      - gnupg
      - jq
      - linux-headers
      - nfs-utils
      - openssh
      - pciutils
      - qemu-guest-agent
      - smartmontools
      - sudo
      - usbutils
