---
- name: Inspect the exact games filesystem mount target
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --noheadings
      - --raw
      - --source
      - UUID=31602ce7-0054-498a-9f24-f51ca491e7b3
      - --output
      - TARGET
  register: backup_temp_preflight_games_target
  changed_when: false
  check_mode: false

- name: Inspect games filesystem mount options
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --noheadings
      - --raw
      - --mountpoint
      - /mnt/games
      - --output
      - OPTIONS
  register: backup_temp_preflight_games_options
  changed_when: false
  check_mode: false

- name: Inspect available games filesystem capacity
  ansible.builtin.command:
    argv:
      - /usr/bin/df
      - --block-size=1
      - --output=avail
      - /mnt/games
  register: backup_temp_preflight_games_capacity
  changed_when: false
  check_mode: false

- name: Inspect backup and temporary-directory metadata
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - /mnt/games
    - /mnt/games/backups
    - /mnt/games/backups/.tmp
  register: backup_temp_preflight_path_stats

- name: Require the fail-closed backup temporary-storage baseline
  ansible.builtin.assert:
    that:
      - backup_temp_preflight_games_target.stdout_lines == ['/mnt/games']
      - "'rw' in backup_temp_preflight_games_options.stdout.split(',')"
      - backup_temp_preflight_games_capacity.stdout_lines | length == 2
      - backup_temp_preflight_games_capacity.stdout_lines[1] | trim | int >= 107374182400
      - backup_temp_preflight_path_stats.results | length == 3
      - backup_temp_preflight_path_stats.results[0].stat.exists
      - backup_temp_preflight_path_stats.results[0].stat.isdir
      - not backup_temp_preflight_path_stats.results[0].stat.islnk
      - backup_temp_preflight_path_stats.results[1].stat.exists
      - backup_temp_preflight_path_stats.results[1].stat.isdir
      - not backup_temp_preflight_path_stats.results[1].stat.islnk
      - backup_temp_preflight_path_stats.results[1].stat.pw_name == 'root'
      - backup_temp_preflight_path_stats.results[1].stat.gr_name == 'root'
      - backup_temp_preflight_path_stats.results[1].stat.mode == '0700'
      - backup_temp_preflight_path_stats.results[2].stat.exists
      - backup_temp_preflight_path_stats.results[2].stat.isdir
      - not backup_temp_preflight_path_stats.results[2].stat.islnk
      - backup_temp_preflight_path_stats.results[2].stat.pw_name == 'root'
      - backup_temp_preflight_path_stats.results[2].stat.gr_name == 'root'
      - backup_temp_preflight_path_stats.results[2].stat.mode == '0700'
      - backup_temp_preflight_path_stats.results[1].stat.dev == backup_temp_preflight_path_stats.results[0].stat.dev
      - backup_temp_preflight_path_stats.results[2].stat.dev == backup_temp_preflight_path_stats.results[0].stat.dev
    fail_msg: >-
      Backup temporary storage is not the exact root-owned directory on the mounted,
      writable games filesystem with at least 100 GiB available; refuse staging or deployment.
