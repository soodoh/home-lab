---
- name: Keep required hardware modules persistent
  ansible.builtin.copy:
    dest: /etc/modules-load.d/home-lab-hardware.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      uhid
      uinput

- name: Load required hardware modules idempotently
  ansible.builtin.command:
    argv:
      - /usr/bin/modprobe
      - "{{ item }}"
  changed_when: false
  loop:
    - uinput
    - uhid

- name: Disable runtime power-down for the dedicated Wolf GPU
  ansible.builtin.copy:
    dest: /etc/modprobe.d/home-lab-amdgpu.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      options amdgpu runpm=0
  register: arch_hardware_amdgpu_runtime_pm
  notify: Rebuild Arch initramfs

- name: Rebuild the initramfs before activating a new GPU power policy
  ansible.builtin.meta: flush_handlers
  when:
    - arch_hardware_amdgpu_runtime_pm.changed
    - not ansible_check_mode

- name: Reboot the guest to activate a new GPU power policy
  ansible.builtin.reboot:
    reboot_timeout: 300
  when:
    - arch_hardware_amdgpu_runtime_pm.changed
    - not ansible_check_mode

- name: Create required hardware groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - input
    - render
    - uucp

- name: Create the unprivileged workload user
  ansible.builtin.user:
    name: "{{ arch.user }}"
    home: "/home/{{ arch.user }}"
    shell: /bin/bash
    create_home: true
    password_lock: true
    state: present
- name: Grant workload user only required device groups
  ansible.builtin.user:
    name: "{{ arch.user }}"
    append: true
    groups:
      - docker
      - input
      - render
      - uucp

- name: Resolve protected USB serial identities
  ansible.builtin.set_fact:
    arch_hardware_zigbee_serial: "{{ lookup('ansible.builtin.env', proxmox.vm.usb.zigbee.serial_secret_ref) }}"
    arch_hardware_zwave_serial: "{{ lookup('ansible.builtin.env', proxmox.vm.usb.zwave.serial_secret_ref) }}"
  no_log: true

- name: Require both protected USB serial identities
  ansible.builtin.assert:
    that:
      - arch_hardware_zigbee_serial | length > 0
      - arch_hardware_zwave_serial | length > 0
      - arch_hardware_zigbee_serial is match('^[A-Za-z0-9._-]+$')
      - arch_hardware_zwave_serial is match('^[A-Za-z0-9._-]+$')
      - arch_hardware_zigbee_serial != arch_hardware_zwave_serial
    fail_msg: "Distinct SOPS-protected Zigbee and Z-Wave serial identities are required."
  no_log: true

- name: Inspect attached USB identities without exposing device metadata
  ansible.builtin.command:
    argv:
      - /usr/bin/udevadm
      - info
      - --export-db
  register: arch_hardware_udev_database
  changed_when: false
  check_mode: false
  no_log: true

- name: Require both protected USB devices to be physically attached
  ansible.builtin.assert:
    that:
      - arch_hardware_zigbee_serial in arch_hardware_udev_database.stdout
      - arch_hardware_zwave_serial in arch_hardware_udev_database.stdout
    fail_msg: "Both protected USB devices must be attached before symlink convergence."
  no_log: true

- name: Install stable USB serial symlinks
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/71-home-lab-usb-serial.rules
    owner: root
    group: root
    mode: "0600"
    content: |
      {{ arch_hardware_zigbee_rule }}
      {{ arch_hardware_zwave_rule }}
  vars:
    arch_hardware_zigbee_rule: >-
      SUBSYSTEM=="tty", ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea60",
      ATTRS{serial}=="{{ arch_hardware_zigbee_serial }}", SYMLINK+="zigbee", GROUP="uucp", MODE="0660"
    arch_hardware_zwave_rule: >-
      SUBSYSTEM=="tty", ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea60",
      ATTRS{serial}=="{{ arch_hardware_zwave_serial }}", SYMLINK+="zwave", GROUP="uucp", MODE="0660"
  no_log: true
  register: arch_hardware_usb_rules
  notify: Reload hardware rules
- name: Install explicit hardware permissions
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/70-home-lab-hardware.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      KERNEL=="uinput", GROUP="input", MODE="0660"
      KERNEL=="uhid", GROUP="input", MODE="0660"
      SUBSYSTEM=="tty", ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea60", GROUP="uucp", MODE="0660"
  notify: Reload hardware rules

- name: Converge Wolf host sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-home-lab-wolf.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      fs.inotify.max_user_instances = 1024
      fs.inotify.max_user_watches = 1048576
      user.max_user_namespaces = 28633
  notify: Apply Wolf sysctls

- name: Keep qemu guest agent enabled and running
  ansible.builtin.systemd_service:
    name: qemu-guest-agent.service
    enabled: true
    state: started

- name: Apply hardware handlers before runtime verification
  ansible.builtin.meta: flush_handlers

- name: Inspect the active AMD GPU runtime power policy
  ansible.builtin.command:
    argv:
      - /usr/bin/cat
      - /sys/module/amdgpu/parameters/runpm
  register: arch_hardware_amdgpu_runpm_active
  changed_when: false
  check_mode: false
  when: not ansible_check_mode or not arch_hardware_amdgpu_runtime_pm.changed

- name: Require the dedicated Wolf GPU to remain active
  ansible.builtin.assert:
    that:
      - arch_hardware_amdgpu_runpm_active.stdout == '0'
    fail_msg: "The dedicated Wolf GPU must boot with amdgpu.runpm=0."
  when: not ansible_check_mode or not arch_hardware_amdgpu_runtime_pm.changed

- name: Verify required device paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /dev/dri/renderD128
    - /dev/zigbee
    - /dev/zwave
    - /dev/uhid
    - /dev/uinput
  register: arch_hardware_devices

- name: Assert all modeled device dependencies exist
  ansible.builtin.assert:
    that:
      - arch_hardware_devices.results[0].stat.exists
      - arch_hardware_devices.results[3].stat.exists
      - arch_hardware_devices.results[4].stat.exists
      - >-
        (ansible_check_mode and arch_hardware_usb_rules.changed) or
        (
          arch_hardware_devices.results[1].stat.exists and
          arch_hardware_devices.results[2].stat.exists
        )
    fail_msg: "A required GPU, USB, or Wolf device is absent."
