---
- name: Test the real request network and refuse an unauthenticated qBittorrent backend
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - bookorbit
      - node
      - -e
      - >-
        Promise.all([
          fetch('http://bookorbit-acquisition:8081/api/v2/app/version', {redirect:'manual', signal: AbortSignal.timeout(5000)}),
          fetch('http://bookorbit-acquisition:8081/api/v2/app/preferences', {redirect:'manual', signal: AbortSignal.timeout(5000)})
        ]).then(([version, prefs]) => {
          if (![401, 403].includes(version.status) || prefs.status !== 404) process.exitCode = 1;
        }).catch(() => { process.exitCode = 1; });
  become: true
  changed_when: false
  check_mode: false
