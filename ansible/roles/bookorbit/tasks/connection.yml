---
- name: Read native connection summaries (credentials are not returned)
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/admin/{{ bookorbit_record.collection }}"
  register: bookorbit_connection_list
  changed_when: false
  check_mode: false

- name: Find the existing record by its managed name
  ansible.builtin.set_fact:
    bookorbit_existing_connections: >-
      {{ bookorbit_connection_list.json[bookorbit_record.list_key] |
         selectattr('name', 'equalto', bookorbit_record.fields.name) | list }}
    cacheable: false

- name: Refuse ambiguous records, wrong types or missing encryption before writes
  ansible.builtin.assert:
    that:
      - bookorbit_connection_list.json.encryptionConfigured
      - bookorbit_existing_connections | length <= 1
      - >-
        bookorbit_existing_connections | length == 0 or
        (bookorbit_existing_connections[0][bookorbit_record.discriminator] == bookorbit_record.adapter and
        bookorbit_existing_connections[0].baseUrl == bookorbit_record.fields.baseUrl)

- name: Create the missing managed connection or resubmit the current authoritative credentials
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/admin/{{ bookorbit_record.collection }}{{ bookorbit_existing_suffix }}"
    method: "{{ 'PUT' if bookorbit_existing_suffix else 'POST' }}"
    status_code: "{{ [200] if bookorbit_existing_suffix else [201] }}"
    body: >-
      {{ bookorbit_record.fields if bookorbit_existing_suffix else
         bookorbit_record.fields | combine({bookorbit_record.discriminator: bookorbit_record.adapter}) }}
  vars:
    bookorbit_existing_suffix: "{{ '/' ~ bookorbit_existing_connections[0].id if bookorbit_existing_connections | length == 1 else '' }}"
  register: bookorbit_updated_connection
  changed_when: true
  when: not ansible_check_mode

- name: Check authentication using the stored credential without submitting downloads
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/admin/{{ bookorbit_record.collection }}/{{ bookorbit_updated_connection.json.id }}/test"
    method: POST
  register: bookorbit_connection_test
  failed_when: bookorbit_connection_test.status != 200 or not (bookorbit_connection_test.json.success | default(false))
  changed_when: false
  when: not ansible_check_mode

- name: Require a successful Prowlarr catalog sync, not merely a successful connection update
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/admin/request-indexer-managers/{{ bookorbit_updated_connection.json.id }}/sync"
    method: POST
  changed_when: false
  when: not ansible_check_mode and bookorbit_record.adapter == 'prowlarr'
