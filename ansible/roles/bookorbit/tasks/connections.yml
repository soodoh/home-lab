---
- name: Converge the native connection records without replacing their IDs
  vars:
    bookorbit_records:
      - collection: request-indexer-managers
        list_key: managers
        discriminator: type
        adapter: prowlarr
        fields:
          name: Home Lab Prowlarr
          baseUrl: http://gluetun:9696
          allowPrivateAddress: true
          syncNewIndexers: false
          inheritSeedLimits: true
          enabled: true
          credential: "{{ bookorbit_production.PROWLARR_API_KEY }}"
      - collection: download-clients
        list_key: clients
        discriminator: adapterType
        adapter: qbittorrent
        fields: >-
          {{ bookorbit_persistence_client_settings | combine({
             'name': 'Home Lab qBittorrent', 'baseUrl': 'http://gluetun:8081', 'enabled': true,
             'username': bookorbit_download_clients.qbittorrent_username, 'password': bookorbit_download_clients.qbittorrent_password,
             'pathMappings': [{'remotePath': bookorbit_qbit_path, 'localPath': '/acquisition/qbittorrent'}]}) }}
      - collection: download-clients
        list_key: clients
        discriminator: adapterType
        adapter: sabnzbd
        fields: >-
          {{ bookorbit_persistence_client_settings | combine({
             'name': 'Home Lab SABnzbd', 'baseUrl': 'http://gluetun:8080', 'enabled': bookorbit_sab_enabled,
             'password': bookorbit_download_clients.sabnzbd_api_key,
             'pathMappings': [{'remotePath': bookorbit_sab_path, 'localPath': '/acquisition/sabnzbd'}]}) }}
  module_defaults:
    ansible.builtin.uri:
      headers:
        X-Api-Key: "{{ bookorbit_production.BOOKORBIT_CONVERGENCE_API_KEY }}"
      follow_redirects: none
      use_netrc: false
      use_proxy: false
      return_content: true
      body_format: json
  delegate_to: localhost
  become: false
  no_log: true
  block:
    - name: Read automatic-grab settings before making clients available
      ansible.builtin.uri:
        url: "{{ bookorbit_api_url }}/admin/book-request-automation"
      register: bookorbit_automation
      changed_when: false
      check_mode: false

    - name: Apply only the reviewed automatic-grab policy
      ansible.builtin.uri:
        url: "{{ bookorbit_api_url }}/admin/book-request-automation"
        method: PUT
        body:
          autoGrabEnabled: "{{ bookorbit_auto_grab_enabled }}"
      changed_when: true
      when: not ansible_check_mode and bookorbit_automation.json.autoGrabEnabled != bookorbit_auto_grab_enabled

    - name: Upsert and test each managed connection
      ansible.builtin.include_tasks: connection.yml
      loop: "{{ bookorbit_records }}"
      loop_control:
        loop_var: bookorbit_record
        label: "{{ bookorbit_record.adapter }}"
