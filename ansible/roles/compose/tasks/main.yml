---
- name: Validate the active Compose artifact without displaying resolved configuration
  ansible.builtin.command:
    argv: "{{ compose_runtime_cli + ['config', '--quiet'] }}"
  environment:
    HOME: "{{ compose_home_dir }}"
  changed_when: false
  check_mode: false

- name: List declared Compose services from the active artifact
  ansible.builtin.command:
    argv: "{{ compose_runtime_cli + ['config', '--services'] }}"
  environment:
    HOME: "{{ compose_home_dir }}"
  register: compose_declared_services
  changed_when: false
  check_mode: false

- name: List declared Compose volumes from the active artifact
  ansible.builtin.command:
    argv: "{{ compose_runtime_cli + ['config', '--volumes'] }}"
  environment:
    HOME: "{{ compose_home_dir }}"
  register: compose_declared_volumes
  changed_when: false
  check_mode: false

- name: Assert the adopted Compose model counts remain unchanged
  ansible.builtin.assert:
    that:
      - compose_declared_services.stdout_lines | length in audit_allowed_declared_compose_service_counts
      - compose_declared_volumes.stdout_lines | length == audit_expected_declared_volume_count
    fail_msg: "Compose model counts changed; refusing adoption."

- name: Verify preserved legacy Docker volumes exist
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - volume
      - inspect
      - "{{ item.engine_name }}"
  loop: "{{ audit_legacy_volumes }}"
  loop_control:
    label: "{{ item.logical_name }}"
  changed_when: false
  check_mode: false

- name: Simulate active Compose create without builds, pulls, orphan removal, or changes
  ansible.builtin.command:
    argv: "{{ compose_runtime_cli + ['--dry-run', 'create', '--no-build', '--pull', 'never'] }}"
  environment:
    HOME: "{{ compose_home_dir }}"
  changed_when: false
  check_mode: false
