---
- name: Require the explicit Compose declaration tag
  ansible.builtin.assert:
    that:
      - (ansible_run_tags | list) == ['compose']
    fail_msg: Inactive Compose and its retained guard declarations require only the compose tag, including in check mode.

- name: Admit the whole inactive workload definition closure and publish only Compose assets
  ansible.builtin.import_role:
    name: debian_lifecycle_transaction
    tasks_from: inactive-units
