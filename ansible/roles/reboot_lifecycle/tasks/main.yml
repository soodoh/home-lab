---
- name: Require lifecycle observation context for reboot planning
  ansible.builtin.assert:
    that:
      - lifecycle is defined
      - lifecycle_contract_host in ['debian', 'proxmox']
      - lifecycle_state_observation is defined
    fail_msg: Reboot planning requires the lifecycle_state role and a contracted host identity.

- name: Build reduced read-only reboot evidence
  become: true
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import datetime
        import functools
        import glob
        import hashlib
        import json
        import os
        import subprocess
        import stat
        import sys
        from zoneinfo import ZoneInfo

        host = sys.argv[1]
        accepted_path = sys.argv[2]
        backup_max_age_hours = int(sys.argv[3])
        inactive_backup_units = json.loads(sys.argv[4])
        conflict_lock_paths = set(json.loads(sys.argv[5]))
        window_policy = json.loads(sys.argv[6])
        pending_package_transaction_sha256 = sys.argv[7] or None
        environment = {"LC_ALL": "C", "PATH": "/usr/sbin:/usr/bin:/sbin:/bin"}

        def run(arguments, timeout=30):
            return subprocess.run(
                arguments,
                stdin=subprocess.DEVNULL,
                capture_output=True,
                text=True,
                env=environment,
                timeout=timeout,
            )

        def compare_versions(left, right):
            if run(["/usr/bin/dpkg", "--compare-versions", left, "lt", right]).returncode == 0:
                return -1
            if run(["/usr/bin/dpkg", "--compare-versions", left, "gt", right]).returncode == 0:
                return 1
            return 0

        now = int(datetime.datetime.now(datetime.timezone.utc).timestamp())
        current_kernel = os.uname().release
        boot_id = open("/proc/sys/kernel/random/boot_id", encoding="utf-8").read().strip()
        uptime_seconds = int(float(open("/proc/uptime", encoding="utf-8").read().split()[0]))
        kernel_pattern = "/boot/vmlinuz-*-pve" if host == "proxmox" else "/boot/vmlinuz-*+deb13-amd64"
        installed_kernels = sorted(
            (os.path.basename(path).removeprefix("vmlinuz-") for path in glob.glob(kernel_pattern)),
            key=functools.cmp_to_key(compare_versions),
        )
        target_kernel = installed_kernels[-1] if installed_kernels else None

        reboot_required_packages = []
        reboot_required_packages_path = "/var/run/reboot-required.pkgs"
        if os.path.isfile(reboot_required_packages_path):
            reboot_required_packages = sorted({
                line.strip() for line in open(reboot_required_packages_path, encoding="utf-8") if line.strip()
            })

        health = {}
        if host == "debian":
            compose = run(["/usr/bin/systemctl", "is-active", "home-lab-compose.service"])
            health["compose_service"] = compose.stdout.strip() or "unknown"
            mounts = {}
            for mountpoint in ("/srv/home-lab-state", "/mnt/games", "/mnt/storage"):
                result = run(["/usr/bin/findmnt", "--noheadings", "--output", "TARGET", "--target", mountpoint])
                mounts[mountpoint] = result.returncode == 0 and result.stdout.strip() == mountpoint
            health["mounts"] = mounts
        else:
            zpool = run(["/usr/sbin/zpool", "status", "-x", "storage"])
            vm = run(["/usr/sbin/qm", "status", "100"])
            health["zpool_storage"] = zpool.returncode == 0 and "is healthy" in zpool.stdout
            health["vm_100"] = vm.stdout.strip()

        backup_unit_states = {}
        for unit in inactive_backup_units:
            state = run(["/usr/bin/systemctl", "is-active", unit])
            backup_unit_states[unit] = state.stdout.strip() or "unknown"

        lock_result = run(["/usr/bin/lslocks", "--json", "--output", "PATH,PID,COMMAND"])
        active_conflict_locks = []
        if lock_result.returncode == 0:
            for record in json.loads(lock_result.stdout).get("locks", []):
                normalized = {str(key).lower(): value for key, value in record.items()}
                if normalized.get("path") in conflict_lock_paths:
                    active_conflict_locks.append({"command": normalized.get("command"), "path": normalized["path"], "pid": normalized.get("pid")})
        for path in conflict_lock_paths:
            if path.endswith("active.json") and os.path.lexists(path) and not any(item["path"] == path for item in active_conflict_locks):
                active_conflict_locks.append({"command": "retained-journal", "path": path, "pid": None})
        active_conflict_locks.sort(key=lambda item: item["path"])

        tailscale = run(["/usr/bin/tailscale", "status", "--json"])
        tailscale_backend_state = None
        if tailscale.returncode == 0:
            tailscale_backend_state = json.loads(tailscale.stdout).get("BackendState")
        local_now = datetime.datetime.now(ZoneInfo(window_policy["timezone"]))
        window_eligible = host != "debian" or (
            local_now.weekday() == window_policy["weekday"] and
            local_now.hour == window_policy["start_hour"] and
            local_now.minute < window_policy["max_duration_seconds"] // 60
        )

        backup = {
            "accepted_path": accepted_path,
            "accepted_mtime_epoch": None,
            "accepted_sha256": None,
            "age_seconds": None,
            "durable_chain_clear": False,
            "exists": False,
            "pending_records": None,
            "proton_copy_records": None,
            "service_results": {},
        }
        if host == "debian":
            for unit in ("home-lab-restic-daily-local.service", "home-lab-restic-daily-proton.service"):
                result = run([
                    "/usr/bin/systemctl", "show", unit,
                    "--property=Result", "--property=ExecMainExitTimestamp",
                ])
                values = dict(
                    line.split("=", 1) for line in result.stdout.splitlines() if "=" in line
                )
                backup["service_results"][unit] = {
                    "result": values.get("Result", ""),
                    "exit_timestamp": values.get("ExecMainExitTimestamp", ""),
                }
            try:
                descriptor = os.open(accepted_path, os.O_RDONLY | os.O_NOFOLLOW)
                try:
                    metadata = os.fstat(descriptor)
                    if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1 or \
                            metadata.st_size > 1024 * 1024:
                        raise ValueError("accepted_metadata")
                    with os.fdopen(descriptor, "rb") as handle:
                        descriptor = -1
                        accepted_raw = handle.read(1024 * 1024 + 1)
                finally:
                    if descriptor >= 0:
                        os.close(descriptor)
                if len(accepted_raw) != metadata.st_size:
                    raise ValueError("accepted_size")
                value = json.loads(accepted_raw)
                if set(value) - {"version", "pending", "proton_copies"} or value.get("version") != 1:
                    raise ValueError("accepted_schema")
                pending = value.get("pending")
                proton_copies = value.get("proton_copies", {})
                if not isinstance(pending, list) or not isinstance(proton_copies, dict):
                    raise ValueError("accepted_schema")
                backup["exists"] = True
                backup["accepted_mtime_epoch"] = int(metadata.st_mtime)
                backup["accepted_sha256"] = hashlib.sha256(accepted_raw).hexdigest()
                backup["age_seconds"] = max(0, now - backup["accepted_mtime_epoch"])
                backup["pending_records"] = len(pending)
                backup["proton_copy_records"] = len(proton_copies)
                backup["durable_chain_clear"] = (
                    not pending and
                    bool(proton_copies) and
                    backup["age_seconds"] <= backup_max_age_hours * 3600 and
                    all(item["result"] == "success" for item in backup["service_results"].values())
                )
            except (FileNotFoundError, json.JSONDecodeError, OSError, TypeError, ValueError):
                pass

        evidence_material = {
            "host": host,
            "boot_id": boot_id,
            "current_kernel": current_kernel,
            "installed_kernels": installed_kernels,
            "target_kernel": target_kernel,
            "reboot_required_file": os.path.isfile("/var/run/reboot-required"),
            "reboot_required_packages": reboot_required_packages,
            "health": health,
            "backup": backup,
            "backup_unit_states": backup_unit_states,
            "active_conflict_locks": active_conflict_locks,
            "tailscale_backend_state": tailscale_backend_state,
            "window_eligible": window_eligible,
            "pending_package_transaction_sha256": pending_package_transaction_sha256,
        }
        canonical = json.dumps(evidence_material, sort_keys=True, separators=(",", ":")).encode()
        evidence_material.update({
            "version": 1,
            "observed_at": datetime.datetime.fromtimestamp(now, datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "uptime_seconds": uptime_seconds,
            "reboot_indicated": os.path.isfile("/var/run/reboot-required") or (
                target_kernel is not None and target_kernel != current_kernel
            ),
            "evidence_sha256": hashlib.sha256(canonical).hexdigest(),
        })
        print(json.dumps(evidence_material, sort_keys=True, separators=(",", ":")))
      - "{{ lifecycle_contract_host }}"
      - "{{ backups.restic.runner.accepted_path }}"
      - "{{ lifecycle.maintenance.reboot_plan.backup_max_age_hours | string }}"
      - "{{ lifecycle.maintenance.reboot_plan.inactive_backup_units | to_json }}"
      - "{{ lifecycle.maintenance.reboot_plan.conflict_locks | to_json }}"
      - "{{ lifecycle.maintenance.reboot_plan.debian_window | to_json }}"
      - "{{ reboot_lifecycle_pending_package_transaction_sha256 }}"
  register: reboot_lifecycle_raw
  changed_when: false
  check_mode: false

- name: Decode reduced reboot evidence
  ansible.builtin.set_fact:
    reboot_lifecycle_evidence: "{{ reboot_lifecycle_raw.stdout | from_json }}"
    reboot_lifecycle_policy: "{{ lifecycle.maintenance.reboot_plan }}"

- name: Publish reboot plan readiness without authorizing reboot
  ansible.builtin.set_fact:
    reboot_lifecycle_observation:
      version: 1
      contract_host: "{{ lifecycle_contract_host }}"
      policy: "{{ reboot_lifecycle_policy }}"
      evidence: "{{ reboot_lifecycle_evidence }}"
      expected:
        current_kernel: "{{ reboot_lifecycle_expected_current_kernel }}"
        target_kernel: "{{ reboot_lifecycle_expected_target_kernel }}"
        boot_id: "{{ reboot_lifecycle_expected_boot_id }}"
        pending_package_transaction_sha256: "{{ reboot_lifecycle_pending_package_transaction_sha256 }}"
        workload_order: "{{ reboot_lifecycle_policy.workload_order[lifecycle_contract_host] }}"
        postchecks: "{{ reboot_lifecycle_policy.postchecks[lifecycle_contract_host] }}"
      console_attested: "{{ reboot_lifecycle_console_attested | bool }}"
      backup_attested: "{{ reboot_lifecycle_backup_attested | bool }}"
      active_lifecycle_locks: "{{ lifecycle_state_observation.locks.active }}"
      plan_inputs_complete: >-
        {{
          reboot_lifecycle_expected_current_kernel | length > 0 and
          reboot_lifecycle_expected_target_kernel | length > 0 and
          reboot_lifecycle_expected_boot_id | length > 0 and
          (
            not reboot_lifecycle_evidence.reboot_indicated or
            reboot_lifecycle_pending_package_transaction_sha256 is match('^[0-9a-f]{64}$')
          )
        }}
      preconditions_met: >-
        {{
          lifecycle_state_observation.current_compliant and
          lifecycle_state_observation.locks.active | length == 0 and
          reboot_lifecycle_evidence.active_conflict_locks | length == 0 and
          reboot_lifecycle_evidence.backup_unit_states.values() | select('equalto', 'active') | list | length == 0 and
          reboot_lifecycle_evidence.tailscale_backend_state == 'Running' and
          reboot_lifecycle_evidence.window_eligible and
          (
            reboot_lifecycle_evidence.backup.durable_chain_clear or
            reboot_lifecycle_backup_attested | bool
          ) and
          (
            lifecycle_contract_host != 'proxmox' or
            reboot_lifecycle_console_attested | bool
          )
        }}
      reboot_authorized: false
      blockers: >-
        {{
          (
            ([] if lifecycle_state_observation.current_compliant else ['lifecycle-noncompliant']) +
            ([] if lifecycle_state_observation.locks.active | length == 0 else ['active-lifecycle-lock']) +
            ([] if reboot_lifecycle_expected_current_kernel | length > 0 else ['expected-current-kernel-missing']) +
            ([] if reboot_lifecycle_expected_target_kernel | length > 0 else ['expected-target-kernel-missing']) +
            ([] if reboot_lifecycle_expected_boot_id | length > 0 else ['expected-boot-id-missing']) +
            (
              [] if
                not reboot_lifecycle_evidence.reboot_indicated or
                reboot_lifecycle_pending_package_transaction_sha256 is match('^[0-9a-f]{64}$')
              else ['pending-package-transaction-missing']
            ) +
            ([] if reboot_lifecycle_evidence.active_conflict_locks | length == 0 else ['active-conflict-lock']) +
            (
              [] if
                reboot_lifecycle_evidence.backup_unit_states.values() |
                select('equalto', 'active') | list | length == 0
              else ['backup-unit-active']
            ) +
            ([] if reboot_lifecycle_evidence.tailscale_backend_state == 'Running' else ['tailscale-unhealthy']) +
            ([] if reboot_lifecycle_evidence.window_eligible else ['outside-maintenance-window']) +
            (
              [] if reboot_lifecycle_evidence.backup.durable_chain_clear or reboot_lifecycle_backup_attested | bool
              else ['recent-backup-unproven']
            ) +
            (
              [] if lifecycle_contract_host != 'proxmox' or reboot_lifecycle_console_attested | bool
              else ['console-unattested']
            ) +
            ['saved-reviewed-plan-required', 'separate-reboot-authorization-required']
          ) | unique | list
        }}

- name: Emit reduced reboot plan readiness
  ansible.builtin.debug:
    var: reboot_lifecycle_observation
  when: reboot_lifecycle_emit | bool
