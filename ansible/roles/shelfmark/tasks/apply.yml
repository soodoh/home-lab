---
- name: Stop only Shelfmark before merging application-owned settings
  community.docker.docker_compose_v2:
    project_src: "{{ compose_native_current_dir }}"
    project_name: "{{ compose_native_project_name }}"
    files: "{{ compose_native_files }}"
    env_files: ["{{ compose_native_runtime_env_path }}"]
    services: [shelfmark]
    dependencies: false
    state: stopped
  become: true
  environment:
    HOME: "{{ compose_native_home }}"
  no_log: true

- name: Refuse settings changed by another writer after observation
  ansible.builtin.include_tasks: guard-settings.yml

- name: Write only changed settings through native atomic file replacement
  ansible.builtin.include_tasks: write-settings.yml

- name: Start Shelfmark with its complete native dependency model and require healthy startup
  community.docker.docker_compose_v2:
    project_src: "{{ compose_native_current_dir }}"
    project_name: "{{ compose_native_project_name }}"
    files: "{{ compose_native_files }}"
    env_files: ["{{ compose_native_runtime_env_path }}"]
    services: [shelfmark]
    # --no-deps drops dependency fields from the model/hash in Compose 2.26.
    # Native auto preserves unchanged Gluetun while retaining the full model.
    dependencies: true
    state: present
    pull: never
    build: never
    recreate: auto
    remove_orphans: false
    wait: true
    wait_timeout: "{{ compose_native_wait_timeout }}"
  become: true
  environment:
    HOME: "{{ compose_native_home }}"
  no_log: true
