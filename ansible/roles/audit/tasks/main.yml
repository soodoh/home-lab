---
- name: Assert the operating-system baseline
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == audit_expected_distribution
      - ansible_facts.kernel == audit_expected_running_kernel
    fail_msg: >-
      Phase 0 stop gate: observed OS or running kernel differs from the authoritative infrastructure contract.

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Assert baseline package versions
  ansible.builtin.assert:
    that:
      - item.key in ansible_facts.packages
      - item.value in (ansible_facts.packages[item.key] | map(attribute='version') | list)
    fail_msg: "Phase 0 stop gate: package {{ item.key }} differs from {{ item.value }}."
  loop: "{{ audit_expected_packages | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Assert deferred packages remain absent
  ansible.builtin.assert:
    that:
      - item not in ansible_facts.packages
    fail_msg: "Phase 0 stop gate: deferred package {{ item }} is unexpectedly installed."
  loop: "{{ audit_expected_absent_packages }}"

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Assert baseline services are enabled and running
  ansible.builtin.assert:
    that:
      - item.key in ansible_facts.services
      - ansible_facts.services[item.key].state == item.value.state
      - ansible_facts.services[item.key].status == item.value.status
    fail_msg: "Phase 0 stop gate: {{ item.key }} is not enabled and running."
  loop: "{{ audit_expected_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Inspect guarded oneshot unit state
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - --property=ActiveState
      - --property=UnitFileState
      - --value
      - "{{ item.key }}"
  loop: "{{ audit_expected_guarded_units | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: audit_guarded_unit_states
  changed_when: false
  check_mode: false

- name: Assert guarded oneshot units retain exact active state
  ansible.builtin.assert:
    that:
      - item.stdout_lines == ['active', item.item.value]
    fail_msg: "Phase 0 stop gate: {{ item.item.key }} is not active with unit state {{ item.item.value }}."
  loop: "{{ audit_guarded_unit_states.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Inspect the active root-only Compose environment metadata
  ansible.builtin.stat:
    path: "{{ compose_runtime_env_path }}"
    get_checksum: false
    get_mime: false
  become: true
  register: audit_env_stat

- name: Inspect the protected home directory metadata
  ansible.builtin.stat:
    path: "{{ audit_home_dir }}"
    get_checksum: false
    get_mime: false
  register: audit_home_stat

- name: Assert active environment-file protection matches the adopted baseline
  ansible.builtin.assert:
    that:
      - audit_env_stat.stat.exists
      - audit_env_stat.stat.isreg
      - audit_env_stat.stat.mode == '0600'
      - audit_env_stat.stat.pw_name == 'root'
      - audit_env_stat.stat.gr_name == 'root'
      - audit_home_stat.stat.isdir
      - audit_home_stat.stat.mode == '0700'
    fail_msg: >-
      Phase 0 stop gate: active production environment metadata or the protected home directory changed.
      Contents were not read.

- name: Verify exact adopted fstab entries without changing mounts
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - --fixed-strings
      - --line-regexp
      - --
      - "{{ item }}"
      - /etc/fstab
  loop: "{{ audit_expected_fstab_entries }}"
  loop_control:
    label: "{{ item.split()[1] }}"
  changed_when: false
  check_mode: false

- name: Inspect active mount source and filesystem type
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --noheadings
      - --output
      - SOURCE,FSTYPE
      - --target
      - "{{ item.path }}"
  register: audit_mount_results
  loop: "{{ audit_expected_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: false
  check_mode: false

- name: Assert required mounts match the adopted runtime baseline
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout.split() | first == item.item.source
      - item.stdout.split() | last == item.item.fstype
    fail_msg: "Phase 0 stop gate: required mount {{ item.item.path }} differs or is unavailable."
  loop: "{{ audit_mount_results.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Inspect Docker client and daemon versions
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - version
      - --format
      - "{{ audit_docker_version_format }}"
  register: audit_docker_version
  changed_when: false
  check_mode: false

- name: Inspect Docker Compose version
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - version
      - --short
  register: audit_compose_version
  changed_when: false
  check_mode: false

- name: Inspect standalone Tailscale version
  ansible.builtin.command:
    argv:
      - /usr/bin/tailscale
      - version
  register: audit_tailscale_version
  changed_when: false
  check_mode: false

- name: Inspect standalone Tailscale binary provenance
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
    follow: false
  loop:
    - path: /usr/bin/tailscale
      sha256: "{{ audit_expected_tailscale_client_sha256 }}"
    - path: /usr/sbin/tailscaled
      sha256: "{{ audit_expected_tailscale_daemon_sha256 }}"
  register: audit_tailscale_binaries

- name: Inspect standalone Tailscale update preferences privately
  ansible.builtin.command:
    argv: [/usr/bin/tailscale, debug, prefs]
  register: audit_tailscale_preferences
  changed_when: false
  check_mode: false
  no_log: true

- name: Assert Docker, Compose, and Tailscale runtime versions
  ansible.builtin.assert:
    that:
      - audit_docker_version.stdout == audit_expected_docker_client_version ~ '|' ~ audit_expected_docker_server_version
      - audit_compose_version.stdout == audit_expected_compose_version
      - audit_tailscale_version.stdout_lines | first == audit_expected_tailscale_version
      - audit_tailscale_binaries.results | length == 2
      - audit_tailscale_binaries.results | map(attribute='stat.isreg') | list == [true, true]
      - audit_tailscale_binaries.results | map(attribute='stat.islnk') | list == [false, false]
      - audit_tailscale_binaries.results | map(attribute='stat.nlink') | map('int') | list == [1, 1]
      - audit_tailscale_binaries.results | map(attribute='stat.pw_name') | list == ['root', 'root']
      - audit_tailscale_binaries.results | map(attribute='stat.gr_name') | list == ['root', 'root']
      - audit_tailscale_binaries.results | map(attribute='stat.mode') | list == ['0755', '0755']
      - audit_tailscale_binaries.results[0].stat.checksum == audit_expected_tailscale_client_sha256
      - audit_tailscale_binaries.results[1].stat.checksum == audit_expected_tailscale_daemon_sha256
      - ((audit_tailscale_preferences.stdout | from_json).AutoUpdate.Apply | bool) == (audit_expected_tailscale_auto_update_apply | bool)
      - ((audit_tailscale_preferences.stdout | from_json).RunSSH | bool) == (audit_expected_tailscale_run_ssh | bool)
      - ((audit_tailscale_preferences.stdout | from_json).AutoUpdate.Check | bool) == (audit_expected_tailscale_update_check | bool)
    fail_msg: >-
      Docker client, daemon, Compose, or Tailscale version differs from the adopted Debian production baseline.

- name: Validate the active resolved Compose model without displaying it
  ansible.builtin.command:
    argv: "{{ compose_runtime_cli + ['config', '--quiet'] }}"
  environment:
    HOME: "{{ compose_home_dir }}"
  changed_when: false
  check_mode: false

- name: List declared services from the active Compose artifact
  ansible.builtin.command:
    argv: "{{ compose_runtime_cli + ['config', '--services'] }}"
  environment:
    HOME: "{{ compose_home_dir }}"
  register: audit_declared_services
  changed_when: false
  check_mode: false

- name: List declared volumes from the active Compose artifact
  ansible.builtin.command:
    argv: "{{ compose_runtime_cli + ['config', '--volumes'] }}"
  environment:
    HOME: "{{ compose_home_dir }}"
  register: audit_declared_volumes
  changed_when: false
  check_mode: false

- name: List running services from the active Compose project
  ansible.builtin.command:
    argv: "{{ compose_runtime_cli + ['ps', '--status', 'running', '--services'] }}"
  environment:
    HOME: "{{ compose_home_dir }}"
  register: audit_running_services
  changed_when: false
  check_mode: false

- name: List active Compose container identifiers
  ansible.builtin.command:
    argv: "{{ compose_runtime_cli + ['ps', '--quiet', '--all'] }}"
  environment:
    HOME: "{{ compose_home_dir }}"
  register: audit_container_ids
  changed_when: false
  check_mode: false

- name: Assert Compose service and declared-volume counts
  ansible.builtin.assert:
    that:
      - audit_declared_services.stdout_lines | length in audit_allowed_declared_compose_service_counts
      - audit_running_services.stdout_lines | length == audit_expected_running_compose_service_count | int
      - audit_container_ids.stdout_lines | length in audit_allowed_materialized_compose_service_counts
      - audit_declared_volumes.stdout_lines | length == audit_expected_declared_volume_count
      - >-
        (audit_declared_services.stdout_lines | difference(audit_running_services.stdout_lines) | sort) ==
        (audit_expected_stopped_compose_services | sort)
    fail_msg: Compose definitions, materialized containers, or contract scheduler state changed.

- name: Inspect required container health without exposing configuration
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - inspect
      - --format
      - "{{ audit_container_health_format }}"
      - "{{ item.key }}"
  register: audit_health_results
  loop: "{{ audit_expected_health | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  check_mode: false

- name: Assert known container health differences remain explicit
  ansible.builtin.assert:
    that:
      - item.stdout == item.item.key ~ '|running|' ~ item.item.value
    fail_msg: "Phase 0 stop gate: {{ item.item.key }} state or health differs from the recorded baseline."
  loop: "{{ audit_health_results.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Count Compose-project volumes without inspecting their data
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - volume
      - ls
      - --filter
      - label=com.docker.compose.project=docker-compose
      - --quiet
  register: audit_compose_project_volumes
  changed_when: false
  check_mode: false

- name: Assert Compose-project volume count includes preserved legacy volumes
  ansible.builtin.assert:
    that:
      - audit_compose_project_volumes.stdout_lines | length == audit_expected_compose_project_volume_count
    fail_msg: "Phase 0 stop gate: the Compose-project volume count changed; do not prune or recreate volumes."

- name: Verify preserved legacy volume metadata exists
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - volume
      - inspect
      - "{{ item.engine_name }}"
  loop: "{{ audit_legacy_volumes }}"
  loop_control:
    label: "{{ item.logical_name }}"
  changed_when: false
  check_mode: false

- name: Inspect required loaded kernel modules
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - --extended-regexp
      - "^{{ item }} "
      - /proc/modules
  register: audit_module_results
  failed_when: false
  loop: "{{ audit_expected_modules }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  check_mode: false

- name: Assert required kernel modules are loaded
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: "Phase 0 stop gate: kernel module {{ item.item }} is not loaded."
  loop: "{{ audit_module_results.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect required host device paths
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  register: audit_device_results
  loop: "{{ audit_expected_devices }}"
  loop_control:
    label: "{{ item }}"

- name: Assert required host device paths exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Phase 0 stop gate: required device path {{ item.item }} is missing."
  loop: "{{ audit_device_results.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect running container bind and device sources
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/docker', 'inspect', '--format', audit_mount_device_format]
         + audit_container_ids.stdout_lines }}
  register: audit_runtime_paths
  changed_when: false
  check_mode: false

- name: Inspect each running bind or device source
  ansible.builtin.stat:
    path: "{{ item | regex_replace('^(bind|device)\\|', '') }}"
    get_checksum: false
    get_mime: false
  register: audit_runtime_path_stats
  loop: "{{ audit_runtime_paths.stdout_lines | reject('equalto', '') | unique | list }}"
  loop_control:
    label: "{{ item }}"

- name: Assert every running bind and device source still exists
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Phase 0 stop gate: running container source {{ item.item }} is missing."
  loop: "{{ audit_runtime_path_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Compare tracked Wolf files with host copies
  ansible.builtin.command:
    argv:
      - /usr/bin/cmp
      - --silent
      - --
      - "{{ item.tracked }}"
      - "{{ item.host }}"
  register: audit_wolf_compare
  failed_when: false
  loop: "{{ audit_wolf_file_pairs }}"
  loop_control:
    label: "{{ item.host }}"
  changed_when: false
  check_mode: false

- name: Assert tracked Wolf files match host copies
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: "Phase 0 stop gate: tracked and host Wolf file differ at {{ item.item.host }}."
  loop: "{{ audit_wolf_compare.results }}"
  loop_control:
    label: "{{ item.item.host }}"


- name: Inspect root cron metadata without privilege or content access
  ansible.builtin.stat:
    path: "{{ audit_root_cron_path }}"
    get_checksum: false
    get_mime: false
  register: audit_root_cron_stat
  when: audit_root_cron_required | bool

- name: Assert the unadopted root crontab file still exists
  ansible.builtin.assert:
    that:
      - audit_root_cron_stat.stat.exists
    fail_msg: "Phase 0 stop gate: root cron metadata changed; inspect it with separately approved privilege."
  when: audit_root_cron_required | bool

- name: Require exact Offen retirement absence after attestation
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      test "$(systemctl is-active home-lab-restic-daily.timer)" = active
      test "$(systemctl is-active home-lab-restic-maintenance.timer)" = active
      for service in daily-local-backup weekly-remote-backup; do
        ! docker inspect "$service" >/dev/null 2>&1
      done
      {% for item in offen_retirement_manifest.local.archives + offen_retirement_manifest.local.metadata_files %}
      test ! -e {{ item.path | quote }}
      test ! -L {{ item.path | quote }}
      {% endfor %}
      {% for directory in offen_retirement_manifest.local.protected_directories %}
      test ! -e {{ directory.path | quote }}
      test ! -L {{ directory.path | quote }}
      {% endfor %}
      ! docker image inspect {{ offen_retirement_manifest.compose.image | quote }} >/dev/null 2>&1
      echo offen_retirement_absence=verified
  vars:
    offen_retirement_manifest: >-
      {{ lookup('ansible.builtin.file', playbook_dir + '/../../infrastructure/retirement/offen-retirement-manifest.json') | from_json }}
  changed_when: false
  check_mode: false
  register: audit_offen_retirement_absence
  when: backups.legacy_offen.retirement.state == 'retired'

- name: Assert exact Offen retirement absence passed
  ansible.builtin.assert:
    that:
      - audit_offen_retirement_absence.stdout == 'offen_retirement_absence=verified'
  when: backups.legacy_offen.retirement.state == 'retired'

- name: Simulate active Compose create without builds, pulls, or changes
  ansible.builtin.command:
    argv: "{{ compose_runtime_cli + ['--dry-run', 'create', '--no-build', '--pull', 'never'] }}"
  environment:
    HOME: "{{ compose_home_dir }}"
  changed_when: false
  check_mode: false

- name: Inspect whether inert Restic deployment is installed
  ansible.builtin.stat:
    path: /etc/home-lab/restic-policy.json
    follow: false
  register: audit_restic_policy

- name: Audit inert Restic deployment when installed
  ansible.builtin.include_tasks: restic.yml
  when:
    - audit_restic_policy.stat.isreg | default(false)
    - not (audit_restic_policy.stat.islnk | default(false))
