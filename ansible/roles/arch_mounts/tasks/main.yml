---
- name: Create storage mountpoints without writing workload data
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ storage.nfs.mountpoint }}"
    - "{{ arch.games_mountpoint }}"
    - "{{ proxmox.vm.state_disk.mountpoint }}"

- name: Resolve the games filesystem by exact UUID
  ansible.builtin.command:
    argv:
      - /usr/bin/blkid
      - -U
      - "{{ proxmox.vm.games_disk.filesystem_uuid }}"
  register: arch_mounts_games_device
  changed_when: false
  check_mode: false

- name: Require the exact existing games filesystem
  ansible.builtin.assert:
    that:
      - arch_mounts_games_device.stdout | length > 0
      - arch_mounts_games_device.stdout is match('^/dev/')
    fail_msg: "Games filesystem UUID is absent; never format the disk."

- name: Resolve the application-state filesystem by exact UUID
  ansible.builtin.command:
    argv:
      - /usr/bin/blkid
      - -U
      - "{{ proxmox.vm.state_disk.filesystem_uuid }}"
  register: arch_mounts_state_device
  changed_when: false
  check_mode: false

- name: Require the exact application-state filesystem
  ansible.builtin.assert:
    that:
      - arch_mounts_state_device.stdout == '/dev/sdc1'
    fail_msg: "Application-state filesystem UUID is absent or on the wrong device; never write workload state."

- name: Manage exact storage fstab entries
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ item }}"
    regexp: "^[^#]+[[:space:]]+{{ item.split()[1] | regex_escape }}[[:space:]]+"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ network.proxmox.ipv4.split('/')[0] }}:{{ storage.nfs.export }} {{ storage.nfs.mountpoint }} nfs defaults 0 0"
    - "UUID={{ proxmox.vm.games_disk.filesystem_uuid }} {{ arch.games_mountpoint }} ext4 defaults,noatime 0 2"
    - "UUID={{ proxmox.vm.state_disk.filesystem_uuid }} {{ proxmox.vm.state_disk.mountpoint }} ext4 defaults,noatime 0 2"

- name: Mount only the declared filesystems
  ansible.builtin.command:
    argv:
      - /usr/bin/mount
      - "{{ item }}"
  register: arch_mounts_commands
  changed_when: arch_mounts_commands.rc == 0
  failed_when: arch_mounts_commands.rc != 0 and 'already mounted' not in arch_mounts_commands.stderr
  loop:
    - "{{ storage.nfs.mountpoint }}"
    - "{{ arch.games_mountpoint }}"
    - "{{ proxmox.vm.state_disk.mountpoint }}"
  when: item not in ansible_facts.mounts | map(attribute='mount') | list

- name: Read mount identities before any workload write
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --noheadings
      - --output
      - SOURCE,FSTYPE,UUID
      - --target
      - "{{ item }}"
  loop:
    - "{{ storage.nfs.mountpoint }}"
    - "{{ arch.games_mountpoint }}"
    - "{{ proxmox.vm.state_disk.mountpoint }}"
  register: arch_mounts_identities
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert NFS, games, and application-state filesystem identities
  ansible.builtin.assert:
    that:
      - network.proxmox.ipv4.split('/')[0] ~ ':' ~ storage.nfs.export in arch_mounts_identities.results[0].stdout
      - "'nfs' in arch_mounts_identities.results[0].stdout"
      - proxmox.vm.games_disk.filesystem_uuid in arch_mounts_identities.results[1].stdout
      - "'ext4' in arch_mounts_identities.results[1].stdout"
      - proxmox.vm.state_disk.filesystem_uuid in arch_mounts_identities.results[2].stdout
      - "'ext4' in arch_mounts_identities.results[2].stdout"
    fail_msg: "Required mount identity is wrong; refusing every workload write."
  when:
    - not ansible_check_mode or (arch_mounts_identities.results | map(attribute='rc') | max == 0)
