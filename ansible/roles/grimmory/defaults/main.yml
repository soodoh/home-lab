---
grimmory_controller_root: "{{ playbook_dir }}/../.."
grimmory_base_url: https://books.diloreto.com
grimmory_admin_username: grimmory-admin
grimmory_admin_email: grimmory-admin@diloreto.com
grimmory_state_directories:
  - {path: /srv/home-lab-state/grimmory-data, uid: 1000}
  - {path: /srv/home-lab-state/grimmory-bookdrop, uid: 1000}
  - {path: /srv/home-lab-state/grimmory-db-data, uid: 999}
  - {path: /mnt/storage/media/books, uid: 1000}
  - {path: /mnt/storage/media/books/paul, uid: 1000}
  - {path: /mnt/storage/media/books/sarabeth, uid: 1000}
  - {path: /mnt/storage/media/audiobooks, uid: 1000}
grimmory_storage_findmnt_path: /usr/bin/findmnt
grimmory_storage_mountpoint: /mnt/storage
grimmory_storage_mount_source: 192.168.0.123:/storage/docker
grimmory_storage_filesystem: nfs4
grimmory_initialize_confirmed: false
# Opt in only for the two-account linking window, then converge the default again.
grimmory_allow_local_account_linking: false
grimmory_sops_age_keyfile: "{{ lookup('ansible.builtin.env', 'SOPS_AGE_KEY_FILE') }}"
grimmory_sops_file: "{{ grimmory_controller_root }}/secrets/production.sops.yaml"
grimmory_oidc_sops_file: "{{ grimmory_controller_root }}/infrastructure/tofu/authentik/client-secrets.sops.json"
grimmory_oidc_desired_file: "{{ grimmory_controller_root }}/infrastructure/tofu/authentik/desired.json"
