---
- name: Require the reviewed Grimmory HTTPS endpoint and encrypted authorities
  ansible.builtin.assert:
    that:
      - grimmory_base_url == 'https://books.diloreto.com'
      - grimmory_sops_age_keyfile | length > 0
      - grimmory_admin_username not in ['paul', 'sarabeth']
    fail_msg: Grimmory convergence requires its reviewed HTTPS route and separate protected administrator.

- name: Read Grimmory credentials only on the controller
  ansible.builtin.set_fact:
    grimmory_production_secrets: >-
      {{ lookup('community.sops.sops', grimmory_sops_file, input_type='yaml', output_type='yaml',
         age_keyfile=grimmory_sops_age_keyfile) | from_yaml }}
    grimmory_oidc_secrets: >-
      {{ lookup('community.sops.sops', grimmory_oidc_sops_file, input_type='json', output_type='json',
         age_keyfile=grimmory_sops_age_keyfile) | from_json }}
    grimmory_oidc_desired: "{{ lookup('ansible.builtin.file', grimmory_oidc_desired_file) | from_json }}"
    cacheable: false
  no_log: true

- name: Require a single Grimmory OIDC authority and protected bootstrap password
  ansible.builtin.assert:
    that:
      - grimmory_oidc_secrets.schemaVersion == 2
      - grimmory_oidc_secrets.oauthProviders.grimmory.client_secret is match('^[A-Za-z0-9_-]{48,}$')
      - grimmory_production_secrets.GRIMMORY_ADMIN_PASSWORD is match('^[A-Za-z0-9_-]{48,72}$')
      - grimmory_production_secrets.GRIMMORY_OIDC_CLIENT_SECRET is not defined
      - grimmory_production_secrets.GRIMMORY_OIDC_CLIENT_ID is not defined
      - grimmory_oidc_desired.applications.grimmory.provider_id == 'grimmory'
    fail_msg: Grimmory must use Authentik's encrypted OIDC source, not duplicated credentials.
  no_log: true

- name: Converge native Grimmory authentication and adopted import settings
  ansible.builtin.include_tasks:
    file: controller.yml
    apply:
      delegate_to: localhost
      become: false
      no_log: true
      module_defaults:
        ansible.builtin.uri:
          validate_certs: true
          follow_redirects: none
          unredirected_headers: [Authorization]
          timeout: 30
          use_proxy: false
