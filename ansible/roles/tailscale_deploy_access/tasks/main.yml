---
- name: Validate Tailscale deployment access policy
  ansible.builtin.assert:
    that:
      - inventory_hostname in ['docker-host', 'proxmox']
      - ansible_connection == 'ssh'
      - ansible_become | bool
      - tailscale_deploy_access_user == 'ansible-deploy'
      - tailscale_deploy_access_sudoers_path == '/etc/sudoers.d/ansible-deploy'
    fail_msg: Tailscale deployment access requires the reviewed hosts and account.

- name: Define the deployment sudo policy
  ansible.builtin.set_fact:
    tailscale_deploy_access_sudoers_content: "{{ tailscale_deploy_access_user }} ALL=(root) NOPASSWD: ALL\n"
  no_log: true

- name: Read the deployment account
  ansible.builtin.command:
    argv: [/usr/bin/getent, passwd, ansible-deploy]
  register: tailscale_deploy_access_existing_account
  changed_when: false
  check_mode: false
  no_log: true

- name: Inspect the deployment sudo policy path
  ansible.builtin.stat:
    path: "{{ tailscale_deploy_access_sudoers_path }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: tailscale_deploy_access_existing_sudoers

- name: Read the existing deployment sudo policy
  ansible.builtin.slurp:
    path: "{{ tailscale_deploy_access_sudoers_path }}"
  when:
    - tailscale_deploy_access_existing_sudoers.stat.exists
    - tailscale_deploy_access_existing_sudoers.stat.isreg | default(false)
  register: tailscale_deploy_access_existing_sudoers_content
  no_log: true

- name: Admit only the reviewed deployment account and sudo policy
  ansible.builtin.assert:
    that:
      - tailscale_deploy_access_existing_account.stdout.split(':') | length == 7
      - tailscale_deploy_access_existing_account.stdout.split(':')[5] == '/home/ansible-deploy'
      - tailscale_deploy_access_existing_account.stdout.split(':')[6] == '/bin/bash'
      - >-
        not tailscale_deploy_access_existing_sudoers.stat.exists or
        (tailscale_deploy_access_existing_sudoers.stat.isreg and
         (tailscale_deploy_access_existing_sudoers_content.content | b64decode) ==
         tailscale_deploy_access_sudoers_content)
    fail_msg: Existing deployment access differs from the reviewed account and sudo policy.
  no_log: true

- name: Verify native authentication before converging deployment access
  ansible.builtin.import_tasks: verify.yml

- name: Maintain the Tailscale SSH deployment account
  ansible.builtin.user:
    name: "{{ tailscale_deploy_access_user }}"
    create_home: true
    shell: /bin/bash
    password_lock: true
    state: present

- name: Grant the deployment account noninteractive root escalation
  ansible.builtin.copy:
    dest: "{{ tailscale_deploy_access_sudoers_path }}"
    content: "{{ tailscale_deploy_access_sudoers_content }}"
    owner: root
    group: root
    mode: '0440'
    follow: false
    validate: /usr/sbin/visudo -cf %s

- name: Summarize Tailscale deployment access convergence
  ansible.builtin.debug:
    msg:
      account: ansible-deploy
      authentication: tailscale-ssh-policy
      native_authentication: disabled
      privilege_escalation: noninteractive-root
