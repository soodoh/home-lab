---
- name: Require lifecycle observation context for package planning
  ansible.builtin.assert:
    that:
      - lifecycle is defined
      - lifecycle_contract_host in ['debian', 'proxmox']
      - lifecycle_state_observation is defined
    fail_msg: Package planning requires the lifecycle_state role and a contracted host identity.

- name: Build a reduced read-only package proposal from existing APT metadata
  become: true
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        {{
          lookup(
            'ansible.builtin.file',
            role_path + '/../../../infrastructure/maintenance/host/package-candidate-observer'
          ) |
          replace(
            '@EXPECTED_PACKAGES_BASE64@',
            package_lifecycle_expected_packages | to_json | b64encode
          )
        }}
      - observe
      - "{{ lifecycle_contract_host }}"
  register: package_lifecycle_raw
  changed_when: false
  check_mode: false

- name: Decode the reduced package proposal
  ansible.builtin.set_fact:
    package_lifecycle_proposal: "{{ package_lifecycle_raw.stdout | from_json }}"
    package_lifecycle_policy: "{{ lifecycle.maintenance.package_plan }}"
    package_lifecycle_host_policy: "{{ lifecycle.maintenance.package_plan.hosts[lifecycle_contract_host] }}"

- name: Publish package proposal readiness without authorizing apply
  ansible.builtin.set_fact:
    package_lifecycle_observation:
      version: 1
      contract_host: "{{ lifecycle_contract_host }}"
      policy: "{{ package_lifecycle_host_policy }}"
      metadata_refresh_policy: "{{ package_lifecycle_policy.metadata_refresh }}"
      metadata_fresh: >-
        {{
          package_lifecycle_proposal.metadata_age_seconds is not none and
          package_lifecycle_proposal.metadata_age_seconds <= package_lifecycle_policy.max_metadata_age_seconds
        }}
      proposal: "{{ package_lifecycle_proposal }}"
      active_lifecycle_locks: "{{ lifecycle_state_observation.locks.active }}"
      proposal_valid: >-
        {{
          package_lifecycle_proposal.version == 2 and
          package_lifecycle_proposal.solver.returncode == 0 and
          package_lifecycle_proposal.metadata_age_seconds is not none and
          package_lifecycle_proposal.metadata_age_seconds <= package_lifecycle_policy.max_metadata_age_seconds and
          package_lifecycle_proposal.manifest_matches and
          package_lifecycle_proposal.apt_tree_safe and
          package_lifecycle_proposal.size_parse_complete and
          package_lifecycle_proposal.active_lifecycle_locks | length == 0 and
          package_lifecycle_proposal.holds | length == 0 and
          package_lifecycle_proposal.kept_back | length == 0 and
          package_lifecycle_proposal.change_counts.remove == 0 and
          package_lifecycle_proposal.change_counts.downgrade == 0 and
          lifecycle_state_observation.locks.active | length == 0
        }}
      apply_authorized: false
      apply_blockers: >-
        {{
          (
            ([] if package_lifecycle_proposal.solver.returncode == 0 else ['solver-failed']) +
            (
              [] if
                package_lifecycle_proposal.metadata_age_seconds is not none and
                package_lifecycle_proposal.metadata_age_seconds <= package_lifecycle_policy.max_metadata_age_seconds
              else ['apt-metadata-stale']
            ) +
            ([] if package_lifecycle_proposal.apt_tree_safe else ['apt-state-tree-unsafe']) +
            ([] if package_lifecycle_proposal.size_parse_complete else ['package-size-evidence-incomplete']) +
            ([] if package_lifecycle_proposal.active_lifecycle_locks | length == 0 else ['active-lifecycle-lock']) +
            ([] if package_lifecycle_proposal.holds | length == 0 else ['held-packages']) +
            ([] if package_lifecycle_proposal.kept_back | length == 0 else ['kept-back-packages']) +
            ([] if package_lifecycle_proposal.manifest_matches else ['installed-package-manifest-drift']) +
            ([] if package_lifecycle_proposal.change_counts.remove == 0 else ['package-removal']) +
            ([] if package_lifecycle_proposal.change_counts.downgrade == 0 else ['package-downgrade']) +
            ([] if lifecycle_state_observation.locks.active | length == 0 else ['active-lifecycle-lock']) +
            ['saved-reviewed-plan-required']
          ) | unique | list
        }}

- name: Emit the reduced package proposal
  ansible.builtin.debug:
    var: package_lifecycle_observation
  when: package_lifecycle_emit | bool
