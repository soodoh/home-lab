---
- name: Validate the exact legacy marker removal plan
  ansible.builtin.assert:
    that:
      - debian_access_cleanup_plan.format == 'home-lab-debian-access-cleanup-plan-v1'
      - debian_access_cleanup_plan.host == 'debian'
      - debian_access_cleanup_plan.kind == 'legacy-marker-removal'
      - debian_access_cleanup_plan.sequence == 1
      - debian_access_cleanup_plan.authorized == false
      - debian_access_cleanup_plan.action.path == lifecycle.hosts.debian.access_cleanup.legacy_marker_path
      - not debian_access_cleanup_plan.action.after.exists
      - debian_access_cleanup_plan.action.after | length == 1
      - debian_access_cleanup_plan.action.before.exists
      - debian_access_cleanup_plan.action.before.regular
      - not debian_access_cleanup_plan.action.before.symlink
      - debian_access_cleanup_plan.action.before.size == 0
    fail_msg: Legacy marker removal differs from its exact saved plan.
  tags:
    - debian_legacy_marker

- name: Inspect the legacy marker before removal
  ansible.builtin.stat:
    path: "{{ debian_access_cleanup_plan.action.path }}"
    follow: false
    checksum_algorithm: sha256
  register: debian_access_cleanup_legacy_marker_before
  tags:
    - debian_legacy_marker

- name: Require the exact legacy marker before-state
  ansible.builtin.assert:
    that:
      - debian_access_cleanup_legacy_marker_before.stat.exists
      - debian_access_cleanup_legacy_marker_before.stat.isreg
      - not debian_access_cleanup_legacy_marker_before.stat.islnk
      - debian_access_cleanup_legacy_marker_before.stat.uid == debian_access_cleanup_plan.action.before.uid
      - debian_access_cleanup_legacy_marker_before.stat.gid == debian_access_cleanup_plan.action.before.gid
      - debian_access_cleanup_legacy_marker_before.stat.mode == debian_access_cleanup_plan.action.before.mode
      - debian_access_cleanup_legacy_marker_before.stat.nlink == debian_access_cleanup_plan.action.before.nlink
      - debian_access_cleanup_legacy_marker_before.stat.size == 0
      - debian_access_cleanup_legacy_marker_before.stat.checksum == debian_access_cleanup_plan.action.before.sha256
    fail_msg: Legacy marker changed after planning.
  tags:
    - debian_legacy_marker

- name: Remove only the reviewed legacy marker
  tags:
    - debian_legacy_marker
  block:
    - name: Remove the empty legacy marker
      ansible.builtin.file:
        path: "{{ debian_access_cleanup_plan.action.path }}"
        state: absent
      become: true
      register: debian_access_cleanup_legacy_marker_removed

    - name: Verify the legacy marker is absent
      ansible.builtin.stat:
        path: "{{ debian_access_cleanup_plan.action.path }}"
        follow: false
      register: debian_access_cleanup_legacy_marker_after

    - name: Require one marker removal and its postcondition
      ansible.builtin.assert:
        that:
          - debian_access_cleanup_legacy_marker_removed.changed
          - not debian_access_cleanup_legacy_marker_after.stat.exists
        fail_msg: Legacy marker removal postcondition failed.
  rescue:
    - name: Restore the exact empty legacy marker after failure
      ansible.builtin.copy:
        content: ""
        dest: "{{ debian_access_cleanup_plan.action.path }}"
        owner: root
        group: root
        mode: "{{ debian_access_cleanup_plan.action.before.mode }}"
        force: true
      become: true

    - name: Stop after restoring the legacy marker
      ansible.builtin.fail:
        msg: Legacy marker removal failed and its exact empty before-state was restored.


- name: Validate the exact conventional key removal plan
  ansible.builtin.assert:
    that:
      - debian_access_cleanup_plan.format == 'home-lab-debian-access-cleanup-plan-v1'
      - debian_access_cleanup_plan.host == 'debian'
      - debian_access_cleanup_plan.kind == 'conventional-key-removal'
      - debian_access_cleanup_plan.sequence == 2
      - debian_access_cleanup_plan.authorized == false
      - debian_access_cleanup_plan_sha256 is match('^[0-9a-f]{64}$')
      - debian_access_cleanup_operation in ['apply', 'rollback']
      - debian_access_cleanup_plan.action.paths.keys() | sort == lifecycle.hosts.debian.access_cleanup.conventional_key_paths | sort
      - lifecycle.hosts.debian.access_cleanup.remove_keys_before_tightening
    fail_msg: Conventional key removal differs from its exact saved plan.
  tags:
    - debian_conventional_keys

- name: Apply or roll back the exact conventional key plan
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import fcntl
        import hashlib
        import json
        import os
        from pathlib import Path
        import stat
        import sys

        plan = json.loads(sys.argv[1])
        plan_sha256 = sys.argv[2]
        operation = sys.argv[3]
        paths = sorted(plan["action"]["paths"])
        expected_paths = [
            "/home/ansible-deploy/.ssh/authorized_keys",
            "/root/.ssh/authorized_keys",
        ]
        if paths != expected_paths or operation not in {"apply", "rollback"}:
            raise SystemExit(65)
        lock_path = "/run/lock/home-lab-debian-access-cleanup.lock"
        lock_fd = os.open(lock_path, os.O_RDWR | os.O_CREAT | os.O_NOFOLLOW, 0o600)
        fcntl.flock(lock_fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
        rollback_root = Path("/var/lib/home-lab/access-rollback")
        rollback = rollback_root / plan_sha256
        names = {
            "/home/ansible-deploy/.ssh/authorized_keys": "ansible-deploy-authorized-keys",
            "/root/.ssh/authorized_keys": "root-authorized-keys",
        }

        def canonical(value):
            return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode()

        def inspect(path):
            info = os.lstat(path)
            if not stat.S_ISREG(info.st_mode) or stat.S_ISLNK(info.st_mode) or info.st_nlink != 1 or info.st_size > 65536:
                raise ValueError("unsafe conventional key file")
            fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
            try:
                raw = os.read(fd, 65537)
            finally:
                os.close(fd)
            return info, raw

        def restore():
            manifest = json.loads((rollback / "manifest.json").read_bytes())
            for path in paths:
                item = manifest[path]
                source = rollback / names[path]
                raw = source.read_bytes()
                if hashlib.sha256(raw).hexdigest() != item["sha256"]:
                    raise ValueError("rollback key hash differs")
                target = Path(path)
                temporary = target.parent / f".{target.name}.{os.getpid()}.restore"
                fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                try:
                    os.write(fd, raw)
                    os.fsync(fd)
                finally:
                    os.close(fd)
                os.chown(temporary, item["uid"], item["gid"])
                os.chmod(temporary, int(item["mode"], 8))
                os.replace(temporary, target)
            print(json.dumps({"status": "rolled-back"}, sort_keys=True, separators=(",", ":")))

        if operation == "rollback":
            restore()
            raise SystemExit(0)

        rollback_root.mkdir(mode=0o700, parents=True, exist_ok=True)
        root_info = os.lstat(rollback_root)
        if not stat.S_ISDIR(root_info.st_mode) or root_info.st_uid != 0 or root_info.st_gid != 0 or stat.S_IMODE(root_info.st_mode) != 0o700:
            raise ValueError("rollback root is unsafe")
        rollback.mkdir(mode=0o700)
        manifest = {}
        removed = []
        try:
            for path in paths:
                expected = plan["action"]["paths"][path]["before"]
                info, raw = inspect(path)
                observed = {
                    "uid": info.st_uid,
                    "gid": info.st_gid,
                    "mode": format(stat.S_IMODE(info.st_mode), "04o"),
                    "nlink": info.st_nlink,
                    "size": info.st_size,
                    "sha256": hashlib.sha256(raw).hexdigest(),
                }
                for key in observed:
                    if observed[key] != expected[key]:
                        raise ValueError("conventional key changed after planning")
                backup = rollback / names[path]
                fd = os.open(backup, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                try:
                    os.write(fd, raw)
                    os.fsync(fd)
                finally:
                    os.close(fd)
                os.chown(backup, 0, 0)
                manifest[path] = observed
            manifest_path = rollback / "manifest.json"
            fd = os.open(manifest_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
            try:
                os.write(fd, canonical(manifest))
                os.fsync(fd)
            finally:
                os.close(fd)
            for path in paths:
                os.unlink(path)
                removed.append(path)
            if any(os.path.lexists(path) for path in paths):
                raise ValueError("conventional key postcondition failed")
        except Exception:
            if removed:
                restore()
            raise
        print(json.dumps({"rollback_retained": True, "status": "applied"}, sort_keys=True, separators=(",", ":")))
      - "{{ debian_access_cleanup_plan | to_json }}"
      - "{{ debian_access_cleanup_plan_sha256 }}"
      - "{{ debian_access_cleanup_operation }}"
  become: true
  register: debian_access_cleanup_key_transaction
  changed_when: (debian_access_cleanup_key_transaction.stdout | from_json).status == 'applied'
  no_log: true
  tags:
    - debian_conventional_keys


- name: Validate the exact OpenSSH tightening plan
  ansible.builtin.assert:
    that:
      - debian_access_cleanup_plan.format == 'home-lab-debian-access-cleanup-plan-v1'
      - debian_access_cleanup_plan.host == 'debian'
      - debian_access_cleanup_plan.kind == 'openssh-tightening'
      - debian_access_cleanup_plan.sequence == 3
      - debian_access_cleanup_plan.authorized == false
      - debian_access_cleanup_plan_sha256 is match('^[0-9a-f]{64}$')
      - debian_access_cleanup_operation in ['apply', 'commit', 'rollback']
      - debian_access_cleanup_plan.action.config_path == '/etc/ssh/sshd_config.d/60-home-lab.conf'
      - debian_access_cleanup_plan.action.after.pubkey_authentication == 'no'
      - debian_access_cleanup_plan.action.after.permit_root_login == 'no'
      - lifecycle.hosts.debian.access_cleanup.remove_keys_before_tightening
    fail_msg: OpenSSH tightening differs from its exact saved plan.
  tags:
    - debian_sshd_tightening

- name: Apply, commit, or roll back the exact OpenSSH plan
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import fcntl
        import hashlib
        import json
        import os
        from pathlib import Path
        import stat
        import subprocess
        import sys

        plan = json.loads(sys.argv[1])
        plan_sha256 = sys.argv[2]
        operation = sys.argv[3]
        target = Path("/etc/ssh/sshd_config.d/60-home-lab.conf")
        if plan["action"]["config_path"] != str(target) or operation not in {"apply", "commit", "rollback"}:
            raise SystemExit(65)
        lock_path = "/run/lock/home-lab-debian-access-cleanup.lock"
        lock_fd = os.open(lock_path, os.O_RDWR | os.O_CREAT | os.O_NOFOLLOW, 0o600)
        fcntl.flock(lock_fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
        rollback = Path("/var/lib/home-lab/access-rollback") / (plan_sha256 + "-sshd")
        backup = rollback / "60-home-lab.conf"
        manifest_path = rollback / "manifest.json"
        rollback_script = rollback / "rollback.sh"
        unit = "home-lab-debian-ssh-rollback-" + plan_sha256[:12]
        environment = {"LC_ALL": "C", "PATH": "/usr/sbin:/usr/bin:/sbin:/bin"}
        desired = (
            "PubkeyAuthentication no\n"
            "PasswordAuthentication no\n"
            "KbdInteractiveAuthentication no\n"
            "PermitRootLogin no\n"
            "AllowUsers ansible-plan ansible-deploy\n"
        ).encode()

        def inspect(path):
            info = os.lstat(path)
            if not stat.S_ISREG(info.st_mode) or stat.S_ISLNK(info.st_mode) or info.st_nlink != 1 or info.st_size > 65536:
                raise ValueError("unsafe SSH policy file")
            fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
            try:
                raw = os.read(fd, 65537)
            finally:
                os.close(fd)
            return info, raw

        def stop_watchdog():
            subprocess.run(["/usr/bin/systemctl", "stop", unit + ".timer"], env=environment, capture_output=True)
            subprocess.run(["/usr/bin/systemctl", "reset-failed", unit + ".timer", unit + ".service"], env=environment, capture_output=True)

        def restore():
            item = json.loads(manifest_path.read_bytes())
            raw = backup.read_bytes()
            if hashlib.sha256(raw).hexdigest() != item["sha256"]:
                raise ValueError("SSH rollback hash differs")
            temporary = target.parent / f".{target.name}.{os.getpid()}.restore"
            fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
            try:
                os.write(fd, raw)
                os.fsync(fd)
            finally:
                os.close(fd)
            os.chown(temporary, item["uid"], item["gid"])
            os.chmod(temporary, int(item["mode"], 8))
            os.replace(temporary, target)
            subprocess.run(["/usr/sbin/sshd", "-t"], env=environment, check=True, capture_output=True)
            subprocess.run(["/usr/bin/systemctl", "reload", "sshd.service"], env=environment, check=True, capture_output=True)
            stop_watchdog()

        if operation == "rollback":
            restore()
            print(json.dumps({"status": "rolled-back"}, sort_keys=True, separators=(",", ":")))
            raise SystemExit(0)
        if operation == "commit":
            stop_watchdog()
            rollback_script.unlink(missing_ok=True)
            print(json.dumps({"rollback_retained": True, "status": "committed"}, sort_keys=True, separators=(",", ":")))
            raise SystemExit(0)

        if any(os.path.lexists(path) for path in ("/home/ansible-deploy/.ssh/authorized_keys", "/root/.ssh/authorized_keys")):
            raise ValueError("conventional key files remain")
        expected = plan["action"]["config_before"]
        info, raw = inspect(target)
        observed = {
            "uid": info.st_uid,
            "gid": info.st_gid,
            "mode": format(stat.S_IMODE(info.st_mode), "04o"),
            "nlink": info.st_nlink,
            "size": info.st_size,
            "sha256": hashlib.sha256(raw).hexdigest(),
        }
        for key in observed:
            if observed[key] != expected[key]:
                raise ValueError("SSH policy changed after planning")
        rollback.mkdir(mode=0o700)
        fd = os.open(backup, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
        try:
            os.write(fd, raw)
            os.fsync(fd)
        finally:
            os.close(fd)
        os.chown(backup, 0, 0)
        fd = os.open(manifest_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
        try:
            os.write(fd, (json.dumps(observed, sort_keys=True, separators=(",", ":")) + "\n").encode())
            os.fsync(fd)
        finally:
            os.close(fd)
        script = (
            "#!/bin/sh\nset -eu\n"
            f"install -o {observed['uid']} -g {observed['gid']} -m {observed['mode']} '{backup}' '{target}'\n"
            "/usr/sbin/sshd -t\n/usr/bin/systemctl reload sshd.service\n"
        ).encode()
        fd = os.open(rollback_script, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o700)
        try:
            os.write(fd, script)
            os.fsync(fd)
        finally:
            os.close(fd)
        subprocess.run(
            ["/usr/bin/systemd-run", "--quiet", "--unit", unit, "--on-active=120s", "/bin/sh", str(rollback_script)],
            env=environment,
            check=True,
            capture_output=True,
        )
        try:
            temporary = target.parent / f".{target.name}.{os.getpid()}.new"
            fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o644)
            try:
                os.write(fd, desired)
                os.fsync(fd)
            finally:
                os.close(fd)
            os.chown(temporary, 0, 0)
            os.chmod(temporary, 0o644)
            subprocess.run(["/usr/sbin/sshd", "-t", "-f", str(temporary)], env=environment, check=True, capture_output=True)
            os.replace(temporary, target)
            subprocess.run(["/usr/sbin/sshd", "-t"], env=environment, check=True, capture_output=True)
            subprocess.run(["/usr/bin/systemctl", "reload", "sshd.service"], env=environment, check=True, capture_output=True)
        except Exception:
            restore()
            raise
        print(json.dumps({"status": "applied", "watchdog_active": True}, sort_keys=True, separators=(",", ":")))
      - "{{ debian_access_cleanup_plan | to_json }}"
      - "{{ debian_access_cleanup_plan_sha256 }}"
      - "{{ debian_access_cleanup_operation }}"
  become: true
  register: debian_access_cleanup_sshd_transaction
  changed_when: (debian_access_cleanup_sshd_transaction.stdout | from_json).status == 'applied'
  no_log: true
  tags:
    - debian_sshd_tightening
