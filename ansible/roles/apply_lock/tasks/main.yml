---
- name: Validate the production apply-lock action
  ansible.builtin.assert:
    that:
      - apply_lock_action in ['acquire', 'release']
      - >-
        apply_lock_expected_owner_sha256 | length == 0
        or apply_lock_expected_owner_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: "apply_lock_action and optional expected owner SHA-256 must be valid."

- name: Ensure the Proxmox shared operation-lock directory exists
  ansible.builtin.file:
    path: "{{ apply_lock_guard_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  changed_when: false
  when:
    - not ansible_check_mode
    - apply_lock_action == 'acquire'
    - apply_lock_guard_path | length > 0

- name: Ensure the Proxmox shared operation-lock file has fixed metadata
  ansible.builtin.file:
    path: "{{ apply_lock_guard_path }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  become: true
  changed_when: false
  when:
    - not ansible_check_mode
    - apply_lock_action == 'acquire'
    - apply_lock_guard_path | length > 0

- name: Atomically publish the owned production apply lock
  ansible.builtin.command:
    argv:
      - /usr/bin/flock
      - --exclusive
      - --nonblock
      - --
      - "{{ apply_lock_guard_path if apply_lock_guard_path | length > 0 else apply_lock_backup_guard_path }}"
      - /usr/bin/bash
      - -c
      - >-
        set -euo pipefail;
        lock=$1;
        controller=$2;
        operation=$3;
        started=$4;
        competing_lock=$5;
        if test -n "$competing_lock"; then
        test ! -e "$competing_lock";
        test ! -L "$competing_lock";
        fi;
        staging=$(/usr/bin/mktemp --directory "${lock}.acquiring.XXXXXXXXXX");
        cleanup() {
        if test -d "$staging"; then
        /usr/bin/rm --force -- "$staging/owner";
        /usr/bin/rmdir -- "$staging";
        fi;
        };
        trap cleanup EXIT HUP INT TERM;
        /usr/bin/printf 'controller=%s\noperation=%s\nstarted=%s\n' "$controller" "$operation" "$started" > "$staging/owner";
        /usr/bin/chown root:root "$staging" "$staging/owner";
        /usr/bin/chmod 0700 "$staging";
        /usr/bin/chmod 0600 "$staging/owner";
        test ! -e "$lock";
        /usr/bin/mv --no-target-directory -- "$staging" "$lock";
        trap - EXIT HUP INT TERM
      - apply-lock-acquire
      - "{{ apply_lock_path }}"
      - "{{ ansible_user | default('unknown') }}"
      - "{{ apply_lock_operation | default(iac_apply_tag | default('unspecified')) }}"
      - "{{ ansible_facts['date_time']['iso8601'] }}"
      - "{{ '/var/lib/home-lab/reconciliation/apply.lock' if apply_lock_guard_path | length > 0 else '' }}"
  become: true
  changed_when: false
  when:
    - not ansible_check_mode
    - apply_lock_action == 'acquire'
- name: Atomically detach and release the exact production apply lock
  ansible.builtin.command:
    argv:
      - /usr/bin/flock
      - --exclusive
      - --nonblock
      - --
      - "{{ apply_lock_guard_path if apply_lock_guard_path | length > 0 else apply_lock_backup_guard_path }}"
      - /usr/bin/bash
      - -c
      - >-
        set -euo pipefail;
        lock=$1;
        expected_controller=$2;
        expected_operation=$3;
        expected_owner_sha256=$4;
        owner="$lock/owner";
        test "$(/usr/bin/stat --format='%U:%G:%a:%F' -- "$lock")" = 'root:root:700:directory';
        test "$(/usr/bin/stat --format='%U:%G:%a:%h:%F' -- "$owner")" = 'root:root:600:1:regular file';
        test "$(/usr/bin/find "$lock" -mindepth 1 -maxdepth 1 -printf x | /usr/bin/wc -c)" -eq 1;
        /usr/bin/grep --fixed-strings --line-regexp -- "controller=$expected_controller" "$owner" >/dev/null;
        /usr/bin/grep --fixed-strings --line-regexp -- "operation=$expected_operation" "$owner" >/dev/null;
        test "$(/usr/bin/grep --extended-regexp --count '^started=[0-9]{4}-[0-9]{2}-[0-9]{2}T' "$owner")" -eq 1;
        if test -n "$expected_owner_sha256"; then
        test "$(/usr/bin/sha256sum "$owner" | /usr/bin/cut --delimiter=' ' --fields=1)" = "$expected_owner_sha256";
        fi;
        tombstone="${lock}.released.$$";
        test ! -e "$tombstone";
        /usr/bin/mv --no-target-directory -- "$lock" "$tombstone";
        /usr/bin/rm -- "$tombstone/owner";
        /usr/bin/rmdir -- "$tombstone"
      - apply-lock-release
      - "{{ apply_lock_path }}"
      - "{{ ansible_user | default('unknown') }}"
      - "{{ apply_lock_operation | default(iac_apply_tag | default('unspecified')) }}"
      - "{{ apply_lock_expected_owner_sha256 }}"
  become: true
  changed_when: false
  when:
    - not ansible_check_mode
    - apply_lock_action == 'release'
