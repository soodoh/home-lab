---
- name: Inspect required loaded hardware modules
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - --extended-regexp
      - "^{{ item }} "
      - /proc/modules
  register: hardware_module_results
  failed_when: false
  loop: "{{ audit_expected_modules }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  check_mode: false

- name: Assert required hardware modules are loaded
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: "Required module {{ item.item }} is not loaded; refusing convergence."
  loop: "{{ hardware_module_results.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect required hardware device paths
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  register: hardware_device_results
  loop: "{{ audit_expected_devices }}"
  loop_control:
    label: "{{ item }}"

- name: Assert required hardware device paths exist
  ansible.builtin.assert:
    that:
      - >-
        item.stat.exists or
        (
          ansible_check_mode and
          (arch_hardware_usb_rules.changed | default(false)) and
          item.item in ['/dev/zigbee', '/dev/zwave']
        )
    fail_msg: "Required device {{ item.item }} is missing; refusing convergence."
  loop: "{{ hardware_device_results.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect Gasket DKMS status without managing the patched AUR package
  ansible.builtin.command:
    argv:
      - /usr/bin/dkms
      - status
  register: hardware_dkms_status
  changed_when: false
  check_mode: false

- name: Assert the approved Gasket DKMS build remains installed
  ansible.builtin.assert:
    that:
      - "'gasket/' in hardware_dkms_status.stdout"
      - audit_expected_dkms_kernel in hardware_dkms_status.stdout
      - "'installed' in hardware_dkms_status.stdout"
    fail_msg: >-
      The Coral role did not converge the approved Gasket DKMS build for the running kernel.
