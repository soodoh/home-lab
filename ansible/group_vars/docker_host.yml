---
audit_home_dir: /home/docker

audit_expected_distribution: Debian
audit_expected_running_kernel: "{{ debian.qualification.kernel_release }}"
audit_expected_packages:
  linux-image-amd64: 6.12.105-1
  docker.io: 26.1.5+dfsg1-9+deb13u1
  docker-cli: 26.1.5+dfsg1-9+deb13u1
  docker-compose: 2.26.1-4
  openssh-server: 1:10.0p1-7+deb13u4
# Tailscale is an exact standalone install and OpenTofu remains deferred.
audit_expected_absent_packages:
  - opentofu

audit_expected_services:
  docker.service:
    state: running
    status: enabled
  ssh.service:
    state: running
    status: enabled
  tailscaled.service:
    state: running
    status: enabled
audit_expected_guarded_units:
  home-lab-production-guard.service: static
  home-lab-compose.service: enabled
restic_audit_inert_units:
  home-lab-restic-daily.timer: "{{ 'enabled' if backups.restic.migration_state == 'active' else 'disabled' }}"
  home-lab-restic-daily.target: static
  home-lab-restic-daily-local.service: static
  home-lab-restic-daily-proton.service: static
  home-lab-restic-maintenance.timer: "{{ 'enabled' if backups.restic.migration_state == 'active' else 'disabled' }}"
  home-lab-restic-maintenance.target: static
  home-lab-restic-maintenance-local.service: static
  home-lab-restic-maintenance-proton.service: static
  home-lab-restic-recover.service: "{{ 'enabled' if backups.restic.migration_state == 'active' else 'disabled' }}"

audit_expected_docker_client_version: 26.1.5+dfsg1
audit_expected_docker_server_version: "{{ audit_expected_docker_client_version }}"
audit_expected_compose_version: 2.26.1-4
audit_expected_tailscale_version: "{{ tailscale.docker_host_client.version }}"
audit_expected_tailscale_client_sha256: "{{ tailscale.docker_host_client.client_sha256 }}"
audit_expected_tailscale_daemon_sha256: "{{ tailscale.docker_host_client.daemon_sha256 }}"
audit_expected_tailscale_auto_update_apply: "{{ tailscale.docker_host_client.auto_update_apply }}"
audit_expected_tailscale_run_ssh: "{{ tailscale.docker_host_client.run_ssh }}"
audit_expected_tailscale_update_check: "{{ tailscale.docker_host_client.update_check }}"
audit_expected_compose_service_count: "{{ backups.legacy_offen.retirement.planned_source_service_count }}"
audit_allowed_declared_compose_service_counts:
  - "{{ audit_expected_compose_service_count }}"
audit_allowed_materialized_compose_service_counts: "{{ audit_allowed_declared_compose_service_counts }}"
audit_expected_stopped_compose_services: []
audit_expected_running_compose_service_count: "{{ audit_expected_compose_service_count }}"

# Pinned standalone SOPS and age tooling. No package transaction is used.
sops_version: 3.13.3
sops_download_url: https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
sops_sha256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
age_version: 1.3.1
age_download_url: https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
age_archive_sha256: bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
age_binary_sha256: 2e305637f2a0555305e21c17fb74446acbb39b53135d43d4b744e50c287133a5
age_keygen_binary_sha256: c56ef69834e18ca4d3b953117f4481522c35fb6862a5d2871685aa4685893664

# Pinned official Restic and rclone binaries. The role installs no distribution packages.
restic_version: "{{ backups.restic.tools.restic.version }}"
restic_download_url: "{{ backups.restic.tools.restic.url }}"
restic_archive_sha256: "{{ backups.restic.tools.restic.archive_sha256 }}"
restic_binary_sha256: "{{ backups.restic.tools.restic.installed_sha256 }}"
rclone_version: "{{ backups.restic.tools.rclone.version }}"
rclone_download_url: "{{ backups.restic.tools.rclone.url }}"
rclone_archive_sha256: "{{ backups.restic.tools.rclone.archive_sha256 }}"
rclone_binary_sha256: "{{ backups.restic.tools.rclone.installed_sha256 }}"
restic_sops_ciphertext_source: "{{ playbook_dir }}/../../secrets/production.sops.env"
restic_sops_ciphertext_path: /etc/home-lab/restic/production.sops.env
restic_credentials_bootstrap_enabled: "{{ backups.restic.credentials.bootstrap_enabled }}"
restic_proton_uid: 60000
restic_proton_gid: 60000

compose_project_name: docker-compose
apply_lock_path: /var/lib/iac-ansible-production.lock
compose_home_dir: /home/docker
compose_deployment_root: /srv/docker-compose
compose_current_dir: /srv/docker-compose/current
compose_legacy_current_target: /var/lib/home-lab/compose-staging/d23478a665cfc668efc8bf1296783f05b75a8c84080758c33eb264f45f1e3d5c
compose_staging_root: /srv/docker-compose/staging
compose_previous_dir: /srv/docker-compose/previous
compose_runtime_env_path: /etc/docker-compose/production.env
compose_staged_env_root: /etc/docker-compose/staging
compose_staged_env_path: "{{ compose_staged_env_root }}/{{ compose_artifact_hash }}.env"
compose_previous_env_path: /etc/docker-compose/previous.env
compose_age_identity_path: /etc/sops/age/keys.txt
compose_image_override_path: /var/lib/home-lab/production-image-override.json
compose_runtime_cli:
  - /usr/bin/docker
  - compose
  - --project-name
  - "{{ compose_project_name }}"
  - --project-directory
  - "{{ compose_current_dir }}"
  - --env-file
  - "{{ compose_runtime_env_path }}"
  - --file
  - "{{ compose_current_dir }}/docker-compose.yml"
  - --file
  - "{{ compose_image_override_path }}"
compose_staged_inventory_path: /var/lib/docker-compose/staged-model.json
compose_runtime_inventory_path: /var/lib/docker-compose/runtime-model.json
maintenance_compose_current_image_lock_path: /var/lib/docker-compose/current-images.json
maintenance_compose_previous_image_lock_path: /var/lib/docker-compose/previous-images.json
compose_canary_service: flaresolverr
compose_canary_path: services/servarr.yml

audit_expected_declared_volume_count: 0
audit_expected_compose_project_volume_count: 0

audit_legacy_volumes: []

audit_expected_health:
  gluetun: healthy
  seerr: healthy

audit_nfs_source: "{{ network.proxmox.ipv4.split('/')[0] }}:{{ storage.nfs.export }}"
audit_expected_fstab_entries: []
audit_expected_mounts:
  - path: "{{ storage.nfs.mountpoint }}"
    source: "{{ audit_nfs_source }}"
    fstype: nfs4
  - path: "{{ vm_100.storage.games.mountpoint }}"
    source: /dev/sdb1
    fstype: ext4
  - path: "{{ proxmox.vm.state_disk.mountpoint }}"
    source: /dev/sda1
    fstype: ext4

audit_expected_modules:
  - uinput
  - uhid

audit_expected_devices:
  - /dev/dri
  - /dev/dri/renderD128
  - /dev/net/tun
  - /dev/zigbee
  - /dev/zwave
  - /dev/uhid
  - /dev/uinput

audit_wolf_file_pairs:
  - tracked: "{{ compose_current_dir }}/services/data/wolf/waybar-disabled"
    host: /mnt/games/wolf/cfg/waybar-disabled
  - tracked: "{{ compose_current_dir }}/services/data/wolf/sway-borderless-frontends.conf"
    host: /mnt/games/wolf/cfg/sway-borderless-frontends.conf
  - tracked: "{{ compose_current_dir }}/services/data/wolf/es-de/es_systems.xml"
    host: /mnt/games/wolf/cfg/es-de/es_systems.xml
  - tracked: "{{ compose_current_dir }}/services/data/wolf/es-de/wolf-xbox-one.cfg"
    host: /mnt/games/wolf/cfg/es-de/wolf-xbox-one.cfg
  - tracked: "{{ compose_current_dir }}/services/data/wolf/es-de/dolphin-config.sh"
    host: "/mnt/games/roms/dolphin-config/Configure Dolphin.sh"

audit_root_cron_path: /var/spool/cron/crontabs/root
audit_root_cron_required: false

# Phase 3 routine desired state. Management-plane changes use bootstrap.yml only.
apply_guard_allowed_tags:
  - host_files
  - base
  - storage
  - hardware
  - docker
  - compose
  - ssh
  - sops_age
  - restic_backup
  - tailscale
bootstrap_allowed_apply_tags:
  - management_plane

base_packages:
  - rsync
base_services: []

docker_packages:
  - docker.io
  - docker-cli
  - docker-compose
docker_services:
  - docker.service

maintenance_manage_root_cron: true

# The auth key is controller environment only and must be short-lived,
# preauthorized, one-use, and scoped to the contract's Docker-host tag.
tailscale_client_path: "{{ tailscale.docker_host_client.client_path }}"
tailscale_client_sha256: "{{ tailscale.docker_host_client.client_sha256 }}"
tailscale_daemon_path: "{{ tailscale.docker_host_client.daemon_path }}"
tailscale_daemon_sha256: "{{ tailscale.docker_host_client.daemon_sha256 }}"
tailscale_expected_version: "{{ tailscale.docker_host_client.version }}"
tailscale_auto_update_apply: "{{ tailscale.docker_host_client.auto_update_apply }}"
tailscale_ssh: "{{ tailscale.docker_host_client.run_ssh }}"
tailscale_update_check: "{{ tailscale.docker_host_client.update_check }}"
tailscale_service: tailscaled.service
tailscale_hostname: "{{ vm_100.host_name }}"
tailscale_advertise_tags: "{{ tailscale.tags.docker_host }}"
tailscale_advertise_routes: []
tailscale_accept_dns: false
tailscale_accept_routes: false
tailscale_auth_key: "{{ lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY') }}"

human_access_visudo_path: /usr/sbin/visudo
human_access_accounts:
  - name: docker
    comment: Home Lab Docker Administrator
    group: docker
    supplementary_groups: "{{ vm_100.workload_identity.supplementary_groups }}"
    home: /home/docker
    shell: /bin/bash
    sudoers_path: /etc/sudoers.d/docker

deploy_user_name: ansible-deploy
deploy_user_home: /home/ansible-deploy
deploy_user_shell: /bin/bash
deploy_user_sudoers_path: /etc/sudoers.d/ansible-deploy
deploy_user_sudoers_content: |
  ansible-deploy ALL=(root) NOPASSWD: ALL

plan_user_name: ansible-plan
plan_user_home: /home/ansible-plan
plan_user_shell: /bin/bash
plan_user_sudoers_path: /etc/sudoers.d/ansible-plan
plan_user_docker_version_helper: /usr/local/sbin/iac-read-docker-version
plan_user_sudoers_content: |
  ansible-plan ALL=(root) NOPASSWD: /usr/local/sbin/iac-read-docker-version ""

managed_host_files:
  - source: services/data/wolf/wolf-input.conf
    destination: /etc/modules-load.d/wolf-input.conf
    owner: root
    group: root
    mode: "0644"
  - source: services/data/wolf/85-wolf-virtual-inputs.rules
    destination: /etc/udev/rules.d/85-wolf-virtual-inputs.rules
    owner: root
    group: root
    mode: "0644"
  - source: services/data/wolf/waybar-disabled
    destination: /mnt/games/wolf/cfg/waybar-disabled
    owner: docker
    group: docker
    mode: "0755"
  - source: services/data/wolf/sway-borderless-frontends.conf
    destination: /mnt/games/wolf/cfg/sway-borderless-frontends.conf
    owner: root
    group: root
    mode: "0644"
  - source: services/data/wolf/es-de/es_systems.xml
    destination: /mnt/games/wolf/cfg/es-de/es_systems.xml
    owner: root
    group: root
    mode: "0644"
  - source: services/data/wolf/es-de/wolf-xbox-one.cfg
    destination: /mnt/games/wolf/cfg/es-de/wolf-xbox-one.cfg
    owner: root
    group: root
    mode: "0644"
  - source: services/data/wolf/es-de/dolphin-config.sh
    destination: "/mnt/games/roms/dolphin-config/Configure Dolphin.sh"
    owner: docker
    group: docker
    mode: "0755"

# Docker Go templates are wrapped in Jinja raw blocks so Ansible passes them unchanged.
audit_docker_version_format: '{% raw %}{{.Client.Version}}|{{.Server.Version}}{% endraw %}'
audit_container_health_format: >-
  {% raw %}{{ index .Config.Labels "com.docker.compose.service" }}|{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}{% endraw %}
audit_mount_device_format: >-
  {% raw %}{{range .Mounts}}{{if eq .Type "bind"}}bind|{{println .Source}}{{end}}{{end}}{{range .HostConfig.Devices}}device|{{println .PathOnHost}}{{end}}{% endraw %}
