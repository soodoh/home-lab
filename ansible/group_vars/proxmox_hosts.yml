---
proxmox_package_entries: "{{ proxmox.packages.direct + proxmox.packages.critical }}"
proxmox_package_names: "{{ proxmox_package_entries | map(attribute='name') | list }}"
proxmox_apt_sanitized_environment:
  APT_CONFIG: /dev/null
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  NO_PROXY: ""
proxmox_services: "{{ proxmox.services }}"
proxmox_network_apply_confirmed: false
proxmox_network_snippet_migration_confirmed: false
proxmox_network_reviewed_active_snippets: []
proxmox_firewall_apply_confirmed: false
proxmox_storage_migration_confirmed: false
proxmox_storage_post_reboot_validation: false
proxmox_passthrough_legacy_cleanup_confirmed: false
proxmox_passthrough_post_reboot_validation: false
proxmox_passthrough_usb_mapping_cleanup_confirmed: false
proxmox_cleanup_fallback_verification_confirmed: false
proxmox_cleanup_migration_confirmed: false
proxmox_storage_recovery_mode: false
proxmox_storage_recovery_import_confirmed: false
proxmox_storage_review_evidence_path: /var/lib/home-lab/storage-review.json
proxmox_storage_pool_guid: "{{ lookup('ansible.builtin.env', storage.zfs.pool_guid_secret_ref) }}"
proxmox_service_accounts: "{{ proxmox.access.service_accounts }}"
proxmox_api_accounts: "{{ proxmox.access.pve.accounts }}"
proxmox_api_additional_roles: "{{ proxmox.access.pve.additional_roles }}"
proxmox_tailscale_auth_key: >-
  {{ lookup('ansible.builtin.env', proxmox.tailscale.auth_key_secret_ref) }}
proxmox_health_local_api_url: "{{ proxmox.health.local_api_url }}"
proxmox_health_local_api_validate_certs: "{{ proxmox.health.local_api_validate_certs }}"
proxmox_health_local_api_status_codes: "{{ proxmox.health.local_api_status_codes }}"
proxmox_health_tailscale_backend_state: "{{ proxmox.health.tailscale_backend_state }}"
proxmox_health_vm_status: "{{ proxmox.health.vm_status }}"
proxmox_health_require_vm: "{{ proxmox.health.require_vm }}"

human_access_visudo_executable: "{{ proxmox.access.sudo_validation.executable }}"
human_access_visudo_arguments: "{{ proxmox.access.sudo_validation.arguments }}"
human_access_accounts: "{{ proxmox.access.human_accounts }}"
