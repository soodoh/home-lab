---
# Explicit, one-host native package maintenance. Normal runs require exact
# name=version specs and retain the role's APT safety refusals.
- name: Review native Proxmox package maintenance
  hosts: proxmox
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  roles:
    - role: proxmox_observe
    - role: proxmox_package_observe
    - role: proxmox_package_maintenance
