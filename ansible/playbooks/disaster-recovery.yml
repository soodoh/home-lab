---
- name: Verify explicitly selected critical-data recovery
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  vars:
    recovery_remote_backup_pattern: >-
      ^weekly-backup-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}\.tar\.gz\.gpg$
  pre_tasks:
    - name: Validate destructive recovery gates and the reviewed latest S3 fallback
      ansible.builtin.assert:
        that:
          - recovery_remote_backup_id | default('') is match(recovery_remote_backup_pattern)
          - recovery_remote_backup_sha256 | default('') is match('^[0-9a-f]{64}$')
          - recovery_expected_backup_identity_sha256 | default('') is match('^[0-9a-f]{64}$')
          - recovery_backup_url | default('') is match('^https://')
          - recovery_backup_version_id | default('') is match('^[A-Za-z0-9._~+-]{1,1024}$')
          - recovery_remote_backup_latest_confirmed | default(false) | bool
          - recovery_restore_confirmed | default(false) | bool
          - recovery_target_approved_empty | default(false) | bool
          - recovery_target | default('') is match('^/srv/home-lab-recovery/[A-Za-z0-9._-]+$')
          - not (recovery_retain_existing_bind_data | default(false) | bool) or (recovery_retained_bind_review_confirmed | default(false) | bool)
        fail_msg: "Recovery requires the reviewed latest weekly S3 fallback and explicit target/restore/retained-bind approval."

    - name: Acquire the shared host-side mutation lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: disaster-recovery
  tasks:
    - name: Create protected recovery helper directory
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Install the reviewed safe archive extractor
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/restore-critical-archive.py"
        dest: /usr/local/libexec/home-lab-restore-critical-archive.py
        owner: root
        group: root
        mode: "0755"
    - name: Create the exact approved empty recovery target
      ansible.builtin.file:
        path: "{{ recovery_target }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      no_log: true
    - name: Restore only the exact verified backup
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../../scripts/restore-critical-backup
          --remote-backup-id {{ recovery_remote_backup_id | quote }}
          --confirmed-empty-target
      register: disaster_recovery_restore
      no_log: true
      environment:
        RECOVERY_BACKUP_URL: "{{ recovery_backup_url | default('') }}"
        RECOVERY_BACKUP_VERSION_ID: "{{ recovery_backup_version_id | default('') }}"
        RECOVERY_REMOTE_BACKUP_SHA256: "{{ recovery_remote_backup_sha256 | default('') }}"
        RECOVERY_REMOTE_BACKUP_LATEST_CONFIRMED: "{{ recovery_remote_backup_latest_confirmed | bool | lower }}"
        RECOVERY_EXPECTED_BACKUP_IDENTITY_SHA256: "{{ recovery_expected_backup_identity_sha256 }}"
        RECOVERY_TARGET: "{{ recovery_target }}"
        RECOVERY_GPG_KEY_FILE: "{{ recovery_gpg_key_file }}"
        RECOVERY_GPG_PASSPHRASE_FILE: "{{ recovery_gpg_passphrase_file | default('') }}"
        RECOVERY_BACKUP_IDENTITY_FILE: /run/home-lab-recovery-backup-identity.json
        RECOVERY_STATUS_FILE: /run/home-lab-recovery-restore-status

  post_tasks:
    - name: Release the shared host-side mutation lock after success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
