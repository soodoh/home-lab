---
- name: Complete the exact interrupted Frigate 0.18.0 Compose convergence
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  vars:
    frigate_recovery_desired_commit: bcd9795100d007c309a277f9836b722c24cfb890
    frigate_recovery_owner_sha256: 0c68401f7ac046b1e511f60bdfa8b2bfa0ad7fc3a146c56ac0d24645fc5711c7
    frigate_recovery_previous_artifact: 66bb23135a1d020ccb05ad3f060f37832f5cc1aa0d235089d90af867b1e303e2
    frigate_recovery_candidate_artifact: 435df3fbdffb4f5d74d3f35700043a20665723d2d4e9ab2ffa1116283e2876f0
    frigate_recovery_backup: /var/lib/home-lab-upgrades/frigate/0.17.2-20260920T204505Z
    frigate_recovery_playbook: ansible/playbooks/recover-frigate-0-18.yml
    frigate_recovery_previous_image: >-
      ghcr.io/blakeblackshear/frigate:0.17.2@sha256:d4351369984d4a9e2a49ac59736f6490856a7ea11f7790040746d21496967010
    frigate_recovery_candidate_image: >-
      ghcr.io/blakeblackshear/frigate:0.18.0@sha256:9678a83a76e4730ac7d9ea7428370e32ae656d6b312aaad30d6c69f3fef14d35
  pre_tasks:
    - name: Inspect the exact controller recovery source boundary
      ansible.builtin.shell: |
        set -euo pipefail
        test "$(/usr/bin/git status --porcelain=v1 --untracked-files=no)" = ""
        /usr/bin/git merge-base --is-ancestor "{{ frigate_recovery_desired_commit }}" HEAD
        test "$(/usr/bin/git diff --name-only "{{ frigate_recovery_desired_commit }}"..HEAD)" = \
          "{{ frigate_recovery_playbook }}"
        test "$(
          {{ ansible_playbook_python }} scripts/compose-artifact.py --root . hash
        )" = "{{ frigate_recovery_candidate_artifact }}"
      args:
        chdir: "{{ playbook_dir }}/../.."
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false

    - name: Inspect the exact retained publication and running-service boundary
      ansible.builtin.shell: |
        set -euo pipefail
        lock={{ compose_native_apply_lock_path | quote }}
        owner="$lock/owner"
        previous={{ compose_native_deployment_root | quote }}/.before-{{ frigate_recovery_previous_artifact }}
        previous_env={{ compose_native_runtime_env_path | dirname | quote }}/.before-{{ frigate_recovery_previous_artifact }}.env
        candidate={{ compose_native_staging_root | quote }}/{{ frigate_recovery_candidate_artifact }}
        candidate_env={{ compose_native_staged_env_root | quote }}/{{ frigate_recovery_candidate_artifact }}.env
        test "$(stat --format='%U:%G:%a:%F' -- "$lock")" = 'root:root:700:directory'
        test "$(stat --format='%U:%G:%a:%h:%F' -- "$owner")" = 'root:root:600:1:regular file'
        test "$(find "$lock" -mindepth 1 -maxdepth 1 -printf x | wc -c)" -eq 1
        test "$(sha256sum "$owner" | cut --delimiter=' ' --fields=1)" = "{{ frigate_recovery_owner_sha256 }}"
        grep --fixed-strings --line-regexp 'controller={{ ansible_user }}' "$owner" >/dev/null
        grep --fixed-strings --line-regexp 'operation=native-site-convergence' "$owner" >/dev/null
        test "$(cat {{ compose_native_artifact_identity_path | quote }})" = \
          "{{ frigate_recovery_previous_artifact }}"
        for path in {{ compose_native_current_dir | quote }} "$candidate"; do
          test "$(
            {{ ansible_python_interpreter }} "$path/scripts/compose-artifact.py" \
              --root "$path" --no-git hash
          )" = "{{ frigate_recovery_candidate_artifact }}"
        done
        test "$(
          {{ ansible_python_interpreter }} "$previous/scripts/compose-artifact.py" \
            --root "$previous" --no-git hash
        )" = "{{ frigate_recovery_previous_artifact }}"
        cmp --silent -- "$candidate_env" {{ compose_native_runtime_env_path | quote }}
        cmp --silent -- "$previous_env" {{ compose_native_runtime_env_path | quote }}
        test ! -e {{ compose_native_backup_journal_path | quote }}
        flock --exclusive --nonblock -- {{ compose_native_backup_lock_path | quote }} /bin/true
        for unit in {{ compose_native_backup_writer_units | join(' ') }}; do
          test "$(systemctl show --property=ActiveState --value "$unit")" = inactive
        done
        test -f {{ frigate_recovery_backup | quote }}/frigate.db
        test -f {{ frigate_recovery_backup | quote }}/config.yml -o \
          -f {{ frigate_recovery_backup | quote }}/config.yaml
        (cd {{ frigate_recovery_backup | quote }} && sha256sum --check --status SHA256SUMS)
        test "$(docker inspect frigate | {{ ansible_python_interpreter }} -c \
          'import json,sys; print(json.load(sys.stdin)[0]["Config"]["Image"])')" = \
          "{{ frigate_recovery_previous_image }}"
        test "$(docker inspect frigate | {{ ansible_python_interpreter }} -c \
          'import json,sys; print(json.load(sys.stdin)[0]["State"]["Health"]["Status"])')" = healthy
      args:
        executable: /bin/bash
      become: true
      changed_when: false
      check_mode: false
      no_log: true

    - name: List the published declared services without rendering configuration
      ansible.builtin.command:
        argv: "{{ compose_native_runtime_cli + ['config', '--services'] }}"
      become: true
      environment:
        HOME: "{{ compose_native_home }}"
      register: compose_native_declared_services
      changed_when: false
      check_mode: false
      no_log: true

    - name: Adopt only the exact interrupted native site owner
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: adopt
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: native-site-convergence
        apply_lock_expected_owner_sha256: "{{ frigate_recovery_owner_sha256 }}"

  tasks:
    - name: Prune only unused images older than the reviewed retention window
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - image
          - prune
          - --all
          - --force
          - --filter
          - until=168h
      become: true
      register: frigate_recovery_prune
      changed_when: "'Total reclaimed space: 0B' not in frigate_recovery_prune.stdout"
      when: not ansible_check_mode
      no_log: true

    - name: Require enough Docker storage for the reviewed Frigate image
      ansible.builtin.shell: |
        set -euo pipefail
        available=$(df --output=avail -B1 /var/lib/docker | tail -1)
        test "$available" -ge 6000000000
      args:
        executable: /bin/bash
      become: true
      changed_when: false
      when: not ansible_check_mode

    - name: Complete the exact committed Compose generation
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: deploy
      vars:
        compose_native_authoritative_reconcile: true
        compose_native_apply_confirmed: true

  post_tasks:
    - name: Verify the completed Frigate migration before consuming rollback inputs
      ansible.builtin.shell: |
        set -euo pipefail
        previous={{ compose_native_deployment_root | quote }}/.before-{{ frigate_recovery_previous_artifact }}
        previous_env={{ compose_native_runtime_env_path | dirname | quote }}/.before-{{ frigate_recovery_previous_artifact }}.env
        test "$(
          {{ ansible_python_interpreter }} {{ compose_native_current_dir | quote }}/scripts/compose-artifact.py \
            --root {{ compose_native_current_dir | quote }} --no-git hash
        )" = "{{ frigate_recovery_candidate_artifact }}"
        test "$(cat {{ compose_native_artifact_identity_path | quote }})" = \
          "{{ frigate_recovery_candidate_artifact }}"
        test "$(
          {{ ansible_python_interpreter }} "$previous/scripts/compose-artifact.py" \
            --root "$previous" --no-git hash
        )" = "{{ frigate_recovery_previous_artifact }}"
        cmp --silent -- "$previous_env" {{ compose_native_runtime_env_path | quote }}
        test "$(docker inspect frigate | {{ ansible_python_interpreter }} -c \
          'import json,sys; print(json.load(sys.stdin)[0]["Config"]["Image"])')" = \
          "{{ frigate_recovery_candidate_image }}"
        test "$(docker inspect frigate | {{ ansible_python_interpreter }} -c \
          'import json,sys; print(json.load(sys.stdin)[0]["State"]["Health"]["Status"])')" = healthy
        version=$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:5000/api/version)
        case "$version" in 0.18.0*) ;; *) exit 1;; esac
        (cd {{ frigate_recovery_backup | quote }} && sha256sum --check --status SHA256SUMS)
      args:
        executable: /bin/bash
      become: true
      changed_when: false
      when: not ansible_check_mode
      no_log: true

    - name: Remove only the consumed transaction before-images
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - "{{ compose_native_deployment_root }}/.before-{{ frigate_recovery_previous_artifact }}"
        - "{{ compose_native_runtime_env_path | dirname }}/.before-{{ frigate_recovery_previous_artifact }}.env"
      when: not ansible_check_mode
      no_log: true

    - name: Release only the adopted owner after complete convergence
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: native-site-convergence
        apply_lock_expected_owner_sha256: "{{ frigate_recovery_owner_sha256 }}"

- name: Verify the recovered native Docker host state
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  tasks:
    - name: Observe final coordination and active Compose state
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe
      when: not ansible_check_mode
