---
- name: Build read-only host package proposals from existing metadata
  hosts: docker_host:proxmox_host
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
  roles:
    - role: lifecycle_state
      vars:
        lifecycle_state_enforce: false
        lifecycle_state_emit_observation: false
    - role: package_lifecycle
      vars:
        package_lifecycle_emit: true
        package_lifecycle_expected_packages: >-
          {{
            (
              lookup(
                'ansible.builtin.file',
                playbook_dir + '/../../' + proxmox.packages.manifest.path
              ) | from_json
            ).packages
            if lifecycle_contract_host == 'proxmox'
            else []
          }}
