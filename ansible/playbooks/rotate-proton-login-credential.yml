---
- name: Rotate only the installed Proton login credential for the retained transaction
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  vars:
    proton_credential_rotation_script_sha256: 42f9dcbf90839c77f2ff381102a3c71244b0f7dd310604fdbf2a48953568e6e2
  tasks:
    - name: Require exact Proton login credential rotation approval
      ansible.builtin.assert:
        that:
          - proton_credential_rotation_confirmed | default(false) | bool
          - proton_credential_rotation_confirmation | default('') == 'rotate-only-proton-login-password'
          - proton_credential_rotation_expected_transaction_sha256 | default('') is match('^[0-9a-f]{64}$')
          - proton_credential_rotation_expected_auth_evidence_sha256 | default('') is match('^[0-9a-f]{64}$')
          - backups.restic.migration_state == 'inert'
          - backups.restic.qualification.state == 'ready'
          - backups.restic.credentials.state == 'provisioned'
          - backups.legacy_offen.scheduler_state == 'quiesced'
          - backups.legacy_offen.migration_retention_hold.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.review_deadline > now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')
        fail_msg: Proton login credential rotation requires its exact reviewed state and confirmation.

    - name: Inspect retained qualification lock and owner for credential rotation
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop:
        - "{{ apply_lock_path }}"
        - "{{ apply_lock_path }}/owner"
      become: true
      register: proton_credential_rotation_lock_paths

    - name: Inspect retained qualification lock contents for credential rotation
      ansible.builtin.find:
        paths: "{{ apply_lock_path }}"
        hidden: true
        recurse: false
        file_type: any
      become: true
      register: proton_credential_rotation_lock_entries
      when: proton_credential_rotation_lock_paths.results[0].stat.isdir | default(false)

    - name: Read retained qualification owner for credential rotation
      ansible.builtin.slurp:
        src: "{{ apply_lock_path }}/owner"
      become: true
      register: proton_credential_rotation_lock_owner
      no_log: true
      when: proton_credential_rotation_lock_paths.results[1].stat.isreg | default(false)

    - name: Require exact retained qualification lock for credential rotation
      ansible.builtin.assert:
        that:
          - proton_credential_rotation_lock_paths.results[0].stat.isdir | default(false)
          - proton_credential_rotation_lock_paths.results[0].stat.pw_name == 'root'
          - proton_credential_rotation_lock_paths.results[0].stat.mode == '0700'
          - proton_credential_rotation_lock_paths.results[1].stat.isreg | default(false)
          - proton_credential_rotation_lock_paths.results[1].stat.pw_name == 'root'
          - proton_credential_rotation_lock_paths.results[1].stat.mode == '0600'
          - proton_credential_rotation_lock_entries.matched == 1
          - "'controller=ansible-deploy' in (proton_credential_rotation_lock_owner.content | b64decode).splitlines()"
          - "'operation=proton-qualification' in (proton_credential_rotation_lock_owner.content | b64decode).splitlines()"
          - (proton_credential_rotation_lock_owner.content | b64decode | hash('sha256')) == proton_credential_rotation_expected_transaction_sha256
        fail_msg: Retained lock is not the explicitly reviewed failed Proton qualification transaction.
      no_log: true

    - name: Set transaction-specific credential rotation paths
      ansible.builtin.set_fact:
        proton_credential_rotation_transaction_sha256: "{{ proton_credential_rotation_lock_owner.content | b64decode | hash('sha256') }}"
        proton_credential_rotation_auth_evidence_path: >-
          /var/lib/home-lab-restic/proton-auth-diagnostic-{{ proton_credential_rotation_lock_owner.content | b64decode | hash('sha256') }}.json
        proton_credential_rotation_evidence_path: >-
          /var/lib/home-lab-restic/proton-credential-rotation-{{ proton_credential_rotation_lock_owner.content | b64decode | hash('sha256') }}.json
        proton_credential_rotation_ciphertext_temp: >-
          /run/proton-credential-rotation-{{ proton_credential_rotation_lock_owner.content | b64decode | hash('sha256') }}.sops.env
        proton_credential_rotation_script_temp: >-
          /run/proton-credential-rotation-{{ proton_credential_rotation_lock_owner.content | b64decode | hash('sha256') }}
      no_log: true

    - name: Require no concurrent Restic or rclone process during credential rotation
      ansible.builtin.command:
        argv: [/usr/bin/pgrep, --exact, "{{ item }}"]
      loop: [restic, rclone]
      register: proton_credential_rotation_processes
      changed_when: false
      failed_when: proton_credential_rotation_processes.rc != 1
      check_mode: false

    - name: Inspect stopped Offen scheduler states during credential rotation
      ansible.builtin.command:
        argv: [/usr/bin/docker, inspect, --format, "{{ '{{.State.Running}}' }}", "{{ item }}"]
      loop: "{{ backups.legacy_offen.scheduler_services }}"
      register: proton_credential_rotation_offen_states
      changed_when: false
      check_mode: false

    - name: Require Offen schedulers to remain stopped during credential rotation
      ansible.builtin.assert:
        that:
          - item.stdout == 'false'
        fail_msg: An Offen scheduler is not quiesced during Proton credential rotation.
      loop: "{{ proton_credential_rotation_offen_states.results }}"

    - name: Inspect protected Proton credential rotation prerequisites
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
      loop:
        - { name: policy, path: /etc/home-lab/restic-policy.json, owner: root, group: restic-proton, mode: '0440' }
        - { name: rclone, path: /usr/local/bin/rclone, owner: root, group: root, mode: '0755', checksum: "{{ backups.restic.tools.rclone.installed_sha256 }}" }
        - { name: rclone_config, path: /var/lib/restic-proton/rclone.conf, owner: restic-proton, group: restic-proton, mode: '0600' }
        - { name: config_parent, path: /var/lib/restic-proton, owner: restic-proton, group: restic-proton, mode: '0700', directory: true }
        - { name: backup_mutex, path: /run/lock/home-lab-backup.lock, owner: root, group: restic-proton, mode: '0660' }
        - { name: evidence_parent, path: /var/lib/home-lab-restic, owner: root, group: root, mode: '0750', directory: true }
        - { name: sops, path: /usr/local/bin/sops, owner: root, group: root, mode: '0755', checksum: "{{ sops_sha256 }}" }
        - { name: age_identity, path: /etc/sops/age/keys.txt, owner: root, group: root, mode: '0600' }
      become: true
      register: proton_credential_rotation_prerequisites

    - name: Require exact protected Proton credential rotation prerequisites
      ansible.builtin.assert:
        that:
          - >-
            (item.item.directory | default(false) | bool and item.stat.isdir | default(false))
            or (not (item.item.directory | default(false) | bool) and item.stat.isreg | default(false))
          - not (item.stat.islnk | default(false))
          - item.item.directory | default(false) | bool or item.stat.nlink == 1
          - item.stat.pw_name == item.item.owner
          - item.stat.gr_name == item.item.group
          - item.stat.mode == item.item.mode
          - item.item.checksum is not defined or item.stat.checksum == item.item.checksum
        fail_msg: "Protected Proton credential rotation prerequisite {{ item.item.name }} differs."
      loop: "{{ proton_credential_rotation_prerequisites.results }}"

    - name: Read installed policy during Proton credential rotation
      ansible.builtin.slurp:
        src: /etc/home-lab/restic-policy.json
      become: true
      register: proton_credential_rotation_installed_policy
      no_log: true

    - name: Require installed policy to equal reviewed credential rotation contract
      ansible.builtin.assert:
        that:
          - (proton_credential_rotation_installed_policy.content | b64decode | from_json) == backups.restic
        fail_msg: Installed Restic policy differs during Proton credential rotation.
      no_log: true

    - name: Inspect transaction evidence before Proton credential rotation
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
      loop:
        - { name: auth_evidence, path: "{{ proton_credential_rotation_auth_evidence_path }}", present: true }
        - { name: rotation_evidence, path: "{{ proton_credential_rotation_evidence_path }}", present: false }
        - { name: qualification_result, path: "{{ backups.restic.qualification.result_path }}", present: false }
        - { name: qualification_evidence, path: "{{ backups.restic.qualification.host_evidence_path }}", present: false }
        - name: recovery_evidence
          path: "/var/lib/home-lab-restic/proton-qualification-recovery-{{ proton_credential_rotation_transaction_sha256 }}.json"
          present: false
      become: true
      register: proton_credential_rotation_evidence_paths

    - name: Require exact prior and absent transaction evidence
      ansible.builtin.assert:
        that:
          - item.stat.exists == item.item.present
          - not item.item.present or item.stat.isreg | default(false)
          - not item.item.present or not (item.stat.islnk | default(false))
          - not item.item.present or item.stat.nlink == 1
          - not item.item.present or item.stat.pw_name == 'root'
          - not item.item.present or item.stat.gr_name == 'root'
          - not item.item.present or item.stat.mode == '0600'
          - item.item.name != 'auth_evidence' or item.stat.checksum == proton_credential_rotation_expected_auth_evidence_sha256
        fail_msg: "Proton credential rotation evidence prerequisite {{ item.item.name }} differs."
      loop: "{{ proton_credential_rotation_evidence_paths.results }}"

    - name: Report exact Proton credential rotation in check mode
      ansible.builtin.debug:
        msg: >-
          Would decrypt the reviewed SOPS ciphertext only through a protected stdin pipe, acquire the
          existing backup mutex through root-authorized flock, atomically claim transaction evidence,
          update only the obscured Proton login password, remove only a complete client cache when
          present, preserve every other rclone field, retain redacted evidence, and retain the lock.
      changed_when: true
      when: ansible_check_mode

    - name: Stage protected ephemeral Proton credential rotation inputs
      when: not ansible_check_mode
      block:
        - name: Stage encrypted SOPS ciphertext for Proton credential rotation
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../secrets/production.sops.env"
            dest: "{{ proton_credential_rotation_ciphertext_temp }}"
            owner: root
            group: root
            mode: "0600"
          become: true
          no_log: true

        - name: Stage hash-pinned Proton credential rotation supervisor
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../scripts/diagnose-proton-auth"
            dest: "{{ proton_credential_rotation_script_temp }}"
            owner: root
            group: root
            mode: "0700"
          become: true
          no_log: true

        - name: Rotate only the installed Proton login credential under the backup mutex
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail &&
              PATH=/usr/local/bin:/usr/bin:/bin
              SOPS_AGE_KEY_FILE=/etc/sops/age/keys.txt
              /usr/local/bin/sops --decrypt --output-type dotenv
              {{ proton_credential_rotation_ciphertext_temp | quote }} |
              PATH=/usr/local/bin:/usr/bin:/bin
              /usr/bin/python3
              {{ proton_credential_rotation_script_temp | quote }}
              rotate-supervise
              {{ proton_credential_rotation_transaction_sha256 | quote }}
              {{ proton_credential_rotation_script_sha256 | quote }}
              {{ proton_credential_rotation_expected_auth_evidence_sha256 | quote }}
            executable: /bin/bash
          become: true
          register: proton_credential_rotation_run
          changed_when: true
          failed_when: false
          no_log: true
      always:
        - name: Remove only ephemeral Proton credential rotation inputs
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ proton_credential_rotation_ciphertext_temp }}"
            - "{{ proton_credential_rotation_script_temp }}"
          become: true
          no_log: true

    - name: Capture only a controlled Proton credential rotation failure
      ansible.builtin.set_fact:
        proton_credential_rotation_failure_report: >-
          {{
            (
              rotation_failure_output
              | regex_search('(?m)^proton_auth_diagnostic=failed reason=[a-z0-9_.-]+\\r?$')
              | default('', true)
              | trim
            )
            if (
              rotation_failure_output
              | regex_search('(?m)^proton_auth_diagnostic=failed reason=[a-z0-9_.-]+\\r?$')
              | default('', true)
              | length
            ) > 0
            else 'proton_credential_rotation=failed reason=unclassified_output_sha256_'
              ~ (rotation_failure_output | hash('sha256'))
          }}
      vars:
        rotation_failure_output: >-
          {{
            (proton_credential_rotation_run.stdout | default(''))
            ~ '\n' ~ (proton_credential_rotation_run.stderr | default(''))
            ~ '\n' ~ (proton_credential_rotation_run.msg | default('') | string)
          }}
      no_log: true
      when:
        - not ansible_check_mode
        - proton_credential_rotation_run.rc != 0

    - name: Require atomic Proton credential rotation success
      ansible.builtin.assert:
        that:
          - proton_credential_rotation_run.rc == 0
          - proton_credential_rotation_run.stdout is match('^proton_credential_rotation=passed evidence_sha256=[0-9a-f]{64}$')
        fail_msg: "{{ proton_credential_rotation_failure_report | default('proton_credential_rotation=failed reason=unclassified') }}"
      no_log: true
      when: not ansible_check_mode

    - name: Read transaction-bound Proton credential rotation evidence
      ansible.builtin.slurp:
        src: "{{ proton_credential_rotation_evidence_path }}"
      become: true
      register: proton_credential_rotation_evidence
      no_log: true
      when: not ansible_check_mode

    - name: Require exact Proton credential rotation evidence
      ansible.builtin.assert:
        that:
          - evidence.keys() | sort == expected_keys | sort
          - evidence.account_username_sha256 == backups.restic.qualification.username_sha256
          - evidence.auth_diagnostic_evidence_sha256 == proton_credential_rotation_expected_auth_evidence_sha256
          - evidence.cache_invalidation == 'pass'
          - evidence.password_rotation == 'pass'
          - evidence.rotated_at is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - evidence.state == 'rotated'
          - evidence.transaction_sha256 == proton_credential_rotation_transaction_sha256
          - evidence.version == 1
          - proton_credential_rotation_run.stdout == 'proton_credential_rotation=passed evidence_sha256=' ~ evidence_sha256
        fail_msg: Proton credential rotation evidence differs from the reviewed transaction schema.
      vars:
        evidence: "{{ proton_credential_rotation_evidence.content | b64decode | from_json }}"
        evidence_sha256: "{{ proton_credential_rotation_evidence.content | b64decode | hash('sha256') }}"
        expected_keys:
          - account_username_sha256
          - auth_diagnostic_evidence_sha256
          - cache_invalidation
          - password_rotation
          - rotated_at
          - state
          - transaction_sha256
          - version
      no_log: true
      when: not ansible_check_mode

    - name: Re-read retained qualification owner after credential rotation
      ansible.builtin.slurp:
        src: "{{ apply_lock_path }}/owner"
      become: true
      register: proton_credential_rotation_final_lock_owner
      no_log: true
      when: not ansible_check_mode

    - name: Confirm credential rotation retained exact qualification lock
      ansible.builtin.assert:
        that:
          - proton_credential_rotation_final_lock_owner.content == proton_credential_rotation_lock_owner.content
        fail_msg: Proton credential rotation did not retain the exact failed qualification owner bytes.
      no_log: true
      when: not ansible_check_mode
