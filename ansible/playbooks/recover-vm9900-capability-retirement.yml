---
- name: Resume only the exact retained VM9900 capability retirement
  hosts: proxmox
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  pre_tasks:
    - name: Require an exact retained owner identity
      ansible.builtin.assert:
        that:
          - vm9900_capability_retirement_owner_sha256 | default('') is match('^[0-9a-f]{64}$')
        fail_msg: Recovery requires the observed retained VM9900 retirement owner SHA-256.

    - name: Adopt only the exact retained shared operation owner
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: adopt
        apply_lock_operation: vm9900-capability-retirement
        apply_lock_expected_owner_sha256: "{{ vm9900_capability_retirement_owner_sha256 }}"
        apply_lock_guard_path: /var/lib/home-lab/reconciliation/operation.lock
  roles:
    - role: vm9900_capability_retire
  post_tasks:
    - name: Release the exact retained owner after complete success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_operation: vm9900-capability-retirement
        apply_lock_expected_owner_sha256: "{{ vm9900_capability_retirement_owner_sha256 }}"
        apply_lock_guard_path: /var/lib/home-lab/reconciliation/operation.lock
