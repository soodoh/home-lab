---
- name: Remove the exact stale zero-byte Proxmox APT source
  hosts: proxmox_hosts
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/proxmox_hosts.yml"
  pre_tasks:
    - name: Require the exact Proxmox host and explicit stale-source approval
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.virtualization_role != 'guest'
          - ansible_facts.hostname == proxmox.node
          - ansible_check_mode or (proxmox_stale_apt_source_removal_confirmed | default(false) | bool)
        fail_msg: "Stale APT source removal requires the intended host and explicit approval."

    - name: Inspect the exact stale APT source without following links
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/debian.griffo.io.list
        follow: false
        get_checksum: false
      register: stale_proxmox_apt_source_before
      check_mode: false

    - name: Require exact safe stale-source metadata before removal
      ansible.builtin.assert:
        that:
          - >-
            not (stale_proxmox_apt_source_before.stat.exists | default(false)) or
            (stale_proxmox_apt_source_before.stat.isreg | default(false))
          - >-
            not (stale_proxmox_apt_source_before.stat.exists | default(false)) or
            not (stale_proxmox_apt_source_before.stat.islnk | default(false))
          - >-
            not (stale_proxmox_apt_source_before.stat.exists | default(false)) or
            stale_proxmox_apt_source_before.stat.uid == 0
          - >-
            not (stale_proxmox_apt_source_before.stat.exists | default(false)) or
            stale_proxmox_apt_source_before.stat.gid == 0
          - >-
            not (stale_proxmox_apt_source_before.stat.exists | default(false)) or
            stale_proxmox_apt_source_before.stat.size == 0
          - >-
            not (stale_proxmox_apt_source_before.stat.exists | default(false)) or
            stale_proxmox_apt_source_before.stat.nlink == 1
        fail_msg: "The exact stale APT source is not a root-owned, single-link, zero-byte regular file."

    - name: Acquire the shared host-side mutation lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: proxmox-stale-apt-source-removal

  tasks:
    - name: Remove only the exact reviewed stale APT source
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/debian.griffo.io.list
        state: absent
      when: not ansible_check_mode

    - name: Verify the stale APT source is absent
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/debian.griffo.io.list
        follow: false
        get_checksum: false
      register: stale_proxmox_apt_source_after
      changed_when: false
      check_mode: false

    - name: Require exact stale-source absence
      ansible.builtin.assert:
        that:
          - not (stale_proxmox_apt_source_after.stat.exists | default(false))
        fail_msg: "The exact stale APT source remains present."
      when: not ansible_check_mode

  post_tasks:
    - name: Release the shared host-side mutation lock after success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
