---
- name: Observe declared host lifecycle state without changing it
  hosts: docker_host:proxmox_host
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
  roles:
    - role: lifecycle_state
      vars:
        lifecycle_state_enforce: false
        lifecycle_state_emit_observation: true
      tags:
        - lifecycle
        - audit
