---
- name: Deploy the first exact Compose artifact on a recovered Arch host
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Acquire the shared host-side mutation lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: compose-recovery
  roles:
    - role: compose_recovery
  post_tasks:
    - name: Verify complete service health after recovery
      ansible.builtin.import_role:
        name: health

    - name: Remove only the exact verified recovery staging root after health passes
      ansible.builtin.file:
        path: "{{ recovery_target }}"
        state: absent
      no_log: true

    - name: Remove the consumed selected-backup identity after health passes
      ansible.builtin.file:
        path: /run/home-lab-recovery-backup-identity.json
        state: absent
      no_log: true

    - name: Release the shared host-side mutation lock after success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
