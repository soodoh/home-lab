---
- name: Guardedly create the first chained Restic recovery point
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Require exact first-run approvals and clean reviewed state
      ansible.builtin.assert:
        that:
          - restic_first_run_confirmed | default(false) | bool
          - restic_first_run_confirmation | default('') == backups.restic.first_run.confirmation
          - restic_first_run_exclusive_client_confirmation | default('') == backups.restic.first_run.exclusive_client_confirmation
          - restic_first_run_reviewed_commit | default('') is match('^[0-9a-f]{40}$')
          - restic_first_run_sops_binary | default('') is match('^/')
          - restic_first_run_aws_binary | default('') is match('^/')
          - restic_first_run_sops_sha256 | default('') is match('^[0-9a-f]{64}$')
          - restic_first_run_aws_sha256 | default('') is match('^[0-9a-f]{64}$')
          - backups.restic.migration_state == 'inert'
          - backups.restic.initialization.state == 'initialized'
          - backups.restic.first_run.state == 'ready'
          - backups.restic.first_run.snapshots.values() | select('ne', none) | list | length == 0
          - backups.restic.qualification.state == 'qualified'
          - backups.legacy_offen.scheduler_state == 'quiesced'
          - backups.legacy_offen.migration_archive_preservation.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.review_deadline > now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')

    - name: Inspect controller commit and cleanliness
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/git', '-C', playbook_dir ~ '/../..'] + item }}"
      loop:
        - [rev-parse, HEAD]
        - [status, --porcelain]
      delegate_to: localhost
      become: false
      register: restic_first_run_controller_git
      changed_when: false
      check_mode: false

    - name: Require exact clean reviewed controller commit
      ansible.builtin.assert:
        that:
          - restic_first_run_controller_git.results[0].stdout == restic_first_run_reviewed_commit
          - restic_first_run_controller_git.results[1].stdout == ''

    - name: Verify repository-backed AWS proof helper hash
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../scripts/prove-aws-recovery-hold"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: restic_first_run_aws_helper

    - name: Require exact AWS proof helper
      ansible.builtin.assert:
        that:
          - restic_first_run_aws_helper.stat.isreg | default(false)
          - restic_first_run_aws_helper.stat.checksum == backups.restic.first_run.aws_proof_helper_sha256

    - name: Inspect pinned operator credential and AWS binaries
      ansible.builtin.stat:
        path: "{{ item.path }}"
        checksum_algorithm: sha256
        follow: false
      loop:
        - {path: "{{ restic_first_run_sops_binary }}", checksum: "{{ restic_first_run_sops_sha256 }}"}
        - {path: "{{ restic_first_run_aws_binary }}", checksum: "{{ restic_first_run_aws_sha256 }}"}
      delegate_to: localhost
      become: false
      register: restic_first_run_operator_binaries

    - name: Require pinned operator binaries before credential access
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.checksum == item.item.checksum
          - (item.stat.nlink | default(0) | int) == 1
          - item.stat.pw_name in ['root', lookup('env', 'USER')]
          - not (item.stat.wgrp | default(true))
          - not (item.stat.woth | default(true))
      loop: "{{ restic_first_run_operator_binaries.results }}"

    - name: Produce fresh bounded AWS recovery-hold proof
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/../../scripts/prove-aws-recovery-hold"
          - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
      environment:
        HOME_LAB_SOPS_BINARY: "{{ restic_first_run_sops_binary }}"
        HOME_LAB_AWS_BINARY: "{{ restic_first_run_aws_binary }}"
        HOME_LAB_SOPS_FILE: "{{ playbook_dir }}/../../secrets/production.sops.env"
        SOPS_AGE_KEY_FILE: "{{ restic_first_run_age_key_file }}"
      delegate_to: localhost
      become: false
      register: restic_first_run_aws_proof
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require exact bounded AWS proof
      ansible.builtin.assert:
        that:
          - aws.state == 'verified'
          - aws.versioning == 'enabled'
          - aws.principal_arn_sha256 == backups.legacy_offen.migration_retention_hold.expected_principal_arn_sha256
          - aws.lifecycle_rule_id == backups.legacy_offen.migration_retention_hold.lifecycle_rule_id
          - aws.delete_marker_rule_id == backups.legacy_offen.migration_retention_hold.delete_marker_rule_id
          - aws.current_days == 365
          - aws.noncurrent_days == 1
          - aws.multipart_days == 1
          - aws.delete_marker_cleanup | bool
          - aws.object_key == backups.legacy_offen.migration_retention_hold.recovery_object_key
          - aws.object_size == backups.legacy_offen.migration_retention_hold.recovery_object_bytes
          - aws.object_last_modified == backups.legacy_offen.migration_retention_hold.recovery_object_last_modified
          - aws.object_storage_class == backups.legacy_offen.migration_retention_hold.recovery_object_storage_class
          - aws.version_id_sha256 == backups.restic.first_run.aws_version_id_sha256
          - aws.verified_at is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T')
      vars:
        aws: "{{ restic_first_run_aws_proof.stdout | from_json }}"
      no_log: true

    - name: Inspect fresh first-run paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ backups.restic.first_run.journal_path }}"
        - "{{ backups.restic.first_run.result_path }}"
        - "{{ backups.restic.first_run.host_evidence_path }}"
        - "{{ backups.restic.first_run.authorization_path }}"
        - "{{ backups.restic.first_run.proton_token_path }}"
        - "{{ backups.restic.first_run.proton_consumed_token_path }}"
        - "{{ backups.restic.first_run.aws_evidence_path }}"
        - "{{ backups.restic.runner.accepted_path }}"
        - "{{ backups.restic.runner.journal_path }}"
      become: true
      register: restic_first_run_paths

    - name: Require fresh first-run transaction paths
      ansible.builtin.assert:
        that: [not item.stat.exists]
      loop: "{{ restic_first_run_paths.results }}"

    - name: Require a complete quiesced source-state audit
      ansible.builtin.import_role:
        name: audit
      vars:
        audit_expected_stopped_compose_services: "{{ backups.legacy_offen.scheduler_services }}"
        audit_expected_running_compose_service_count: "{{ audit_expected_compose_service_count - (backups.legacy_offen.scheduler_services | length) }}"

    - name: Acquire owner-bearing first-run production lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: restic-first-run

  tasks:
    - name: Publish identical transient and durable AWS proof bytes for the owner-bound transaction
      ansible.builtin.copy:
        content: "{{ restic_first_run_aws_proof.stdout }}\n"
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - "{{ backups.restic.first_run.aws_proof_path }}"
        - "{{ backups.restic.first_run.aws_evidence_path }}"
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Fetch the durable AWS proof artifact before mutation
      ansible.builtin.fetch:
        src: "{{ backups.restic.first_run.aws_evidence_path }}"
        dest: "{{ playbook_dir }}/../../{{ backups.restic.first_run.aws_evidence_file }}"
        flat: true
        validate_checksum: true
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Run exactly one chained first-run target through its supervisor
      ansible.builtin.command:
        argv: [/usr/local/libexec/home-lab/run-first-restic-backup, run]
      become: true
      register: restic_first_run_result
      changed_when: true
      failed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Require controlled first-run success
      ansible.builtin.assert:
        that:
          - restic_first_run_result.rc == 0
          - restic_first_run_result.stdout is match('^restic_first_run=passed evidence_sha256=[0-9a-f]{64}$')
        fail_msg: >-
          {{ (restic_first_run_result.stderr | default('') | regex_search('(?m)^restic_first_run=failed reason=[a-z0-9_.-]+$') | default('', true))
             or 'restic_first_run=failed reason=unclassified_stderr_sha256_' ~ (restic_first_run_result.stderr | default('') | hash('sha256')) }}
      no_log: true
      when: not ansible_check_mode

    - name: Fetch bounded first-run evidence
      ansible.builtin.fetch:
        src: "{{ backups.restic.first_run.host_evidence_path }}"
        dest: "{{ playbook_dir }}/../../{{ backups.restic.first_run.evidence_file }}"
        flat: true
        validate_checksum: true
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Report retained owner-bound first-run seam
      ansible.builtin.debug:
        msg: First-run evidence is ready for contract attestation; the production lock intentionally remains held.
      changed_when: true
