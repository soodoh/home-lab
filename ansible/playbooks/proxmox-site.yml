---
- name: Reconcile the steady Proxmox host
  hosts: proxmox_hosts
  gather_facts: true
  any_errors_fatal: true
  force_handlers: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/proxmox_hosts.yml"
  pre_tasks:
    - name: Require the exact Proxmox host and explicit steady apply approval
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.virtualization_role != 'guest'
          - ansible_facts.hostname == proxmox.node
          - ansible_check_mode or (proxmox_steady_apply_confirmed | default(false) | bool)
        fail_msg: "Proxmox steady convergence requires the intended host and explicit apply approval."
    - name: Verify the Proxmox installation before any host mutation
      ansible.builtin.command:
        argv:
          - /usr/bin/pveversion
      changed_when: false
      check_mode: false
    - name: Acquire the shared host-side mutation lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: proxmox-site
  roles:
    - role: proxmox_firewall
    - role: proxmox_host
    - role: human_access
    - role: proxmox_network
    - role: proxmox_passthrough
    - role: proxmox_storage
    - role: tailscale
      vars:
        tailscale_package: "{{ proxmox.tailscale.package }}"
        tailscale_service: "{{ proxmox.tailscale.service }}"
        tailscale_service_enabled: "{{ proxmox.tailscale.service_enabled }}"
        tailscale_service_state: "{{ proxmox.tailscale.service_state }}"
        tailscale_enrollment_timeout_seconds: "{{ proxmox.tailscale.enrollment_timeout_seconds }}"
        tailscale_enrollment_ssh: "{{ proxmox.tailscale.enrollment_ssh }}"
        tailscale_expected_backend_state: "{{ proxmox.health.tailscale_backend_state }}"
        tailscale_hostname: "{{ proxmox.tailscale.hostname }}"
        tailscale_advertise_tags: "{{ proxmox.tailscale.advertise_tag }}"
        tailscale_advertise_routes: "{{ proxmox.tailscale.advertise_routes }}"
        tailscale_accept_dns: "{{ proxmox.tailscale.accept_dns }}"
        tailscale_accept_routes: "{{ proxmox.tailscale.accept_routes }}"
        tailscale_netfilter_mode: "{{ proxmox.tailscale.netfilter_mode }}"
        tailscale_ssh: "{{ proxmox.tailscale.ssh }}"
        tailscale_auth_key: "{{ proxmox_tailscale_auth_key }}"
    - role: ssh
      vars:
        ssh_service_name: "{{ proxmox.ssh.service }}"
        ssh_host_key_sentinel_path: "{{ proxmox.ssh.host_key_sentinel.path }}"
        ssh_host_key_sentinel_owner: "{{ proxmox.ssh.host_key_sentinel.owner }}"
        ssh_host_key_sentinel_group: "{{ proxmox.ssh.host_key_sentinel.group }}"
        ssh_host_key_sentinel_mode: "{{ proxmox.ssh.host_key_sentinel.mode }}"
        ssh_config_path: "{{ proxmox.ssh.config_file.path }}"
        ssh_config_owner: "{{ proxmox.ssh.config_file.owner }}"
        ssh_config_group: "{{ proxmox.ssh.config_file.group }}"
        ssh_config_mode: "{{ proxmox.ssh.config_file.mode }}"
        ssh_pubkey_authentication: "{{ proxmox.ssh.pubkey_authentication }}"
        ssh_password_authentication: "{{ proxmox.ssh.password_authentication }}"
        ssh_kbd_interactive_authentication: "{{ proxmox.ssh.kbd_interactive_authentication }}"
        ssh_permit_root_login: "{{ proxmox.ssh.permit_root_login }}"
        ssh_access_proven: "{{ proxmox_ssh_access_proven | default(false) }}"
        ssh_allow_users: "{{ proxmox.ssh.allow_users }}"
    - role: proxmox_health
    - role: proxmox_cleanup
  post_tasks:
    - name: Verify the final complete installed package map after cleanup
      ansible.builtin.include_role:
        name: proxmox_host
        tasks_from: verify-exact-packages
      vars:
        proxmox_host_verify_installed_only: true
      when: not ansible_check_mode

    - name: Release the shared host-side mutation lock after success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
