---
- name: Complete the exact interrupted authentik 2026.8.3 Compose publication
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  vars:
    authentik_recovery_desired_commit: 2c7e7227e7191a00934c65295c4f75d108471e7b
    authentik_recovery_owner_sha256: ea9724f99a176817be48825f92e94e949652d250e2b976b091084fa8b92531db
    authentik_recovery_active_artifact: e7368f001e267f64b5ee44a243c96f7866a5f7c8e5745e69eb4419dca4381c50
    authentik_recovery_candidate_artifact: 66bb23135a1d020ccb05ad3f060f37832f5cc1aa0d235089d90af867b1e303e2
    authentik_recovery_playbook: ansible/playbooks/recover-authentik-2026-8-3.yml
  pre_tasks:
    - name: Inspect the exact controller recovery source boundary
      ansible.builtin.shell: |
        set -euo pipefail
        test "$(/usr/bin/git status --porcelain=v1 --untracked-files=no)" = ""
        /usr/bin/git merge-base --is-ancestor "{{ authentik_recovery_desired_commit }}" HEAD
        test "$(/usr/bin/git diff --name-only "{{ authentik_recovery_desired_commit }}"..HEAD)" = "{{ authentik_recovery_playbook }}"
        test "$(
          {{ ansible_playbook_python }} scripts/compose-artifact.py --root . hash
        )" = "{{ authentik_recovery_candidate_artifact }}"
      args:
        chdir: "{{ playbook_dir }}/../.."
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false

    - name: Inspect the retained owner and pre-publication host boundary
      ansible.builtin.shell: |
        set -euo pipefail
        lock={{ compose_native_apply_lock_path | quote }}
        owner="$lock/owner"
        test "$(stat --format='%U:%G:%a:%F' -- "$lock")" = 'root:root:700:directory'
        test "$(stat --format='%U:%G:%a:%h:%F' -- "$owner")" = 'root:root:600:1:regular file'
        test "$(find "$lock" -mindepth 1 -maxdepth 1 -printf x | wc -c)" -eq 1
        test "$(sha256sum "$owner" | cut --delimiter=' ' --fields=1)" = "{{ authentik_recovery_owner_sha256 }}"
        grep --fixed-strings --line-regexp 'controller={{ ansible_user }}' "$owner" >/dev/null
        grep --fixed-strings --line-regexp 'operation=native-site-convergence' "$owner" >/dev/null
        test "$(grep --extended-regexp --count '^started=[0-9]{4}-[0-9]{2}-[0-9]{2}T' "$owner")" -eq 1
        test "$(cat {{ compose_native_artifact_identity_path | quote }})" = "{{ authentik_recovery_active_artifact }}"
        test "$(
          {{ ansible_python_interpreter }} {{ compose_native_current_dir | quote }}/scripts/compose-artifact.py \
            --root {{ compose_native_current_dir | quote }} --no-git hash
        )" = "{{ authentik_recovery_active_artifact }}"
        test ! -e {{ compose_native_staging_root | quote }}/{{ authentik_recovery_candidate_artifact }}
        test ! -e {{ compose_native_staged_env_root | quote }}/{{ authentik_recovery_candidate_artifact }}.env
        test ! -e {{ compose_native_current_dir | quote }}.before-{{ authentik_recovery_candidate_artifact }}
        test ! -e {{ compose_native_runtime_env_path | quote }}.before-{{ authentik_recovery_candidate_artifact }}
        test ! -e {{ compose_native_backup_journal_path | quote }}
        flock --exclusive --nonblock -- {{ compose_native_backup_lock_path | quote }} /bin/true
        for unit in {{ compose_native_backup_writer_units | join(' ') }}; do
          test "$(systemctl show --property=ActiveState --value "$unit")" = inactive
        done
        for container in authentik-server authentik-postgres; do
          test "$(docker inspect "$container" | {{ ansible_python_interpreter }} -c \
            'import json,sys; print(json.load(sys.stdin)[0]["State"]["Health"]["Status"])')" = healthy
        done
        for container in authentik-server authentik-worker; do
          test "$(docker inspect "$container" | {{ ansible_python_interpreter }} -c \
            'import json,sys; print(json.load(sys.stdin)[0]["Config"]["Image"])')" = \
            'ghcr.io/goauthentik/server:2026.5.7@sha256:76bf433fd434c067cb25dc3e197cee793998441cda912441ea275293e76cc32c'
        done
      args:
        executable: /bin/bash
      become: true
      changed_when: false
      check_mode: false
      no_log: true

    - name: Adopt only the exact interrupted native site owner
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: adopt
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: native-site-convergence
        apply_lock_expected_owner_sha256: "{{ authentik_recovery_owner_sha256 }}"

  tasks:
    - name: Complete the exact committed Compose generation
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: deploy
      vars:
        compose_native_authoritative_reconcile: true
        compose_native_apply_confirmed: true

  post_tasks:
    - name: Release only the adopted owner after complete convergence
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: native-site-convergence
        apply_lock_expected_owner_sha256: "{{ authentik_recovery_owner_sha256 }}"

- name: Verify the recovered native Docker host state
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  tasks:
    - name: Observe final coordination and active Compose state
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe
      when: not ansible_check_mode
