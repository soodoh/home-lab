---
- name: Resize only the reviewed VM 100 root disk
  hosts: proxmox_hosts
  gather_facts: false
  any_errors_fatal: true
  vars:
    proxmox_root_disk_growth_action: inspect
    proxmox_root_disk_growth_environment:
      HOMELAB_GAMES_DISK_BY_ID: "{{ lookup('ansible.builtin.env', 'HOMELAB_GAMES_DISK_BY_ID') }}"
      PROXMOX_ROOT_DISK_GROWTH_CONFIRMED: "{{ proxmox_root_disk_growth_confirmation | default('') }}"
  tasks:
    - name: Validate the protected disk-growth inputs
      ansible.builtin.assert:
        that:
          - proxmox_root_disk_growth_action in ['inspect', 'apply']
          - proxmox_root_disk_growth_environment.HOMELAB_GAMES_DISK_BY_ID.startswith('/dev/disk/by-id/')
          - >-
            proxmox_root_disk_growth_action == 'inspect' or
            proxmox_root_disk_growth_environment.PROXMOX_ROOT_DISK_GROWTH_CONFIRMED == 'grow-reviewed-docker-root-disk'
        quiet: true
      no_log: true

    - name: Inspect the exact Proxmox root-disk growth state
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../../scripts/grow-proxmox-vm-root-disk inspect"
        executable: /usr/bin/bash
      environment: "{{ proxmox_root_disk_growth_environment }}"
      register: proxmox_root_disk_growth_inspect
      changed_when: proxmox_root_disk_growth_inspect.rc == 2
      failed_when: proxmox_root_disk_growth_inspect.rc not in [0, 2]
      become: true
      check_mode: false
      no_log: true

    - name: Grow only VM 100 scsi0 to 550 GiB
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../../scripts/grow-proxmox-vm-root-disk apply"
        executable: /usr/bin/bash
      environment: "{{ proxmox_root_disk_growth_environment }}"
      when:
        - proxmox_root_disk_growth_action == 'apply'
        - proxmox_root_disk_growth_inspect.rc == 2
      become: true
      no_log: true

    - name: Verify the exact Proxmox root-disk growth state
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../../scripts/grow-proxmox-vm-root-disk inspect"
        executable: /usr/bin/bash
      environment: "{{ proxmox_root_disk_growth_environment }}"
      register: proxmox_root_disk_growth_verify
      changed_when: false
      become: true
      check_mode: false
      no_log: true
      when: proxmox_root_disk_growth_action == 'apply'
