---
- name: Converge the complete native Docker host state
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  pre_tasks:
    - name: Observe active Compose state before convergence
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe

    - name: Acquire production ownership for native site convergence
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: native-site-convergence

  tasks:
    - name: Admit complete site convergence before any host changes
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: admission
      vars:
        compose_native_change_class: data
        compose_native_apply_operation: native-site-convergence

    - name: Converge Tailscale deployment SSH access
      ansible.builtin.import_role:
        name: tailscale_deploy_access

    - name: Observe the Docker host Tailscale identity for private ingress
      ansible.builtin.command:
        argv: [/usr/bin/tailscale, status, --json]
      register: private_ingress_node_status
      changed_when: false
      check_mode: false

    - name: Require the reviewed Docker host tailnet identity
      ansible.builtin.assert:
        that:
          - private_ingress_node.BackendState == 'Running'
          - private_ingress_node.Self.DNSName | trim('.') == hostvars['docker-host'].ansible_host
          - >-
            private_ingress_node.Self.TailscaleIPs |
            select('match', '^[0-9.]+$') | list | length == 1
        fail_msg: Private ingress requires the reviewed Docker host tailnet identity.
      vars:
        private_ingress_node: "{{ private_ingress_node_status.stdout | from_json }}"

    - name: Read the Docker host's public resolver
      ansible.builtin.command:
        argv: [/usr/bin/resolvectl, dns]
      register: private_ingress_host_resolver
      changed_when: false
      check_mode: false

    - name: Require GOST DNS to match the observed host resolver
      ansible.builtin.assert:
        that:
          - "private_ingress_host_resolver.stdout is search('(?m)^Link [0-9]+ \\(ens18\\): 1\\.1\\.1\\.1(?: |$)')"
          - >-
            ((lookup('ansible.builtin.file', playbook_dir ~ '/../../services/infra.yml') |
              from_yaml).services['tailscale-control-proxy'].dns | default([])) ==
            ['100.100.100.100', '1.1.1.1']
          - >-
            ((lookup('ansible.builtin.file', playbook_dir ~ '/../../services/infra.yml') |
              from_yaml).services['tailscale-control-proxy'].extra_hosts | default([])) | length == 0
        fail_msg: GOST must use the tailnet and observed public resolvers without a stale host alias.

    - name: Re-observe active Compose state under production ownership
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe

    - name: Inspect the existing Home Assistant secrets file
      ansible.builtin.stat:
        path: /srv/home-lab-state/hass-data/secrets.yaml
        follow: false
        get_checksum: false
        get_mime: false
      become: true
      register: hass_secrets_file
      no_log: true

    - name: Refuse an absent or unexpectedly owned Home Assistant secrets file
      ansible.builtin.assert:
        that:
          - hass_secrets_file.stat.isreg | default(false)
          - not (hass_secrets_file.stat.islnk | default(false))
          - hass_secrets_file.stat.uid == 0
          - hass_secrets_file.stat.gid == 0
        fail_msg: Inspect the existing Home Assistant secrets file before changing its permissions.

    - name: Protect Home Assistant secrets from other host users
      ansible.builtin.file:
        path: /srv/home-lab-state/hass-data/secrets.yaml
        state: file
        owner: root
        group: root
        mode: "0600"
        follow: false
      become: true

    - name: Inspect the Home Assistant OIDC configuration before managing its secret
      ansible.builtin.slurp:
        src: /srv/home-lab-state/hass-data/configuration.yaml
      become: true
      register: hass_oidc_configuration
      no_log: true
      when: not ansible_check_mode

    - name: Require the existing Home Assistant OIDC client and secret reference
      ansible.builtin.assert:
        that:
          - >-
            (hass_oidc_configuration.content | b64decode) is search('(?m)^openid:\\s*$')
          - >-
            (hass_oidc_configuration.content | b64decode) is search('(?m)^  client_secret: !secret hass_oidc_client_secret\\s*$')
          - >-
            (hass_oidc_configuration.content | b64decode) is search('(?m)^  client_id: ' ~ oidc_desired.oauthProviders['21'].client_id ~ '\\s*$')
        fail_msg: Home Assistant OIDC configuration differs from the reviewed client; inspect it before convergence.
      vars:
        oidc_desired: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../infrastructure/tofu/authentik/desired.json') | from_json }}"
      no_log: true
      when: not ansible_check_mode

    - name: Inspect Home Assistant secret keys without logging their values
      ansible.builtin.slurp:
        src: /srv/home-lab-state/hass-data/secrets.yaml
      become: true
      register: hass_secret_entries
      no_log: true
      when: not ansible_check_mode

    - name: Require exactly one existing Home Assistant OIDC secret entry
      ansible.builtin.assert:
        that:
          - ((hass_secret_entries.content | b64decode) | regex_findall('(?m)^hass_oidc_client_secret:')) | length == 1
        fail_msg: Inspect the existing Home Assistant OIDC secret entry before convergence.
      no_log: true
      when: not ansible_check_mode

    - name: Require a single-line Home Assistant OIDC secret
      ansible.builtin.assert:
        that:
          - oidc_secrets.schemaVersion == 2
          - oidc_secrets.oauthProviders['21'].client_secret is match('^[A-Za-z0-9_-]{48,}$')
        fail_msg: The encrypted OIDC secret must be safe for the existing Home Assistant YAML entry.
      vars:
        oidc_secrets: >-
          {{ lookup('community.sops.sops', playbook_dir ~ '/../../infrastructure/tofu/authentik/client-secrets.sops.json',
             input_type='json', output_type='json',
             age_keyfile=lookup('ansible.builtin.env', 'SOPS_AGE_KEY_FILE'),
             sops_binary='sops') | from_json }}
      no_log: true
      when: not ansible_check_mode

    - name: Converge the Home Assistant OIDC secret from Authentik's encrypted source
      ansible.builtin.lineinfile:
        path: /srv/home-lab-state/hass-data/secrets.yaml
        regexp: '^hass_oidc_client_secret:'
        line: "hass_oidc_client_secret: {{ oidc_secrets.oauthProviders['21'].client_secret }}"
        state: present
        create: false
        owner: root
        group: root
        mode: "0600"
      vars:
        oidc_secrets: >-
          {{ lookup('community.sops.sops', playbook_dir ~ '/../../infrastructure/tofu/authentik/client-secrets.sops.json',
             input_type='json', output_type='json',
             age_keyfile=lookup('ansible.builtin.env', 'SOPS_AGE_KEY_FILE'),
             sops_binary='sops') | from_json }}
      become: true
      diff: false
      no_log: true
      when: not ansible_check_mode

    - name: Create CLIProxyAPI OAuth directory before extending backup policy
      ansible.builtin.file:
        path: /srv/home-lab-state/cli-proxy-api/auths
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true
      when: not ansible_check_mode

    - name: Converge pinned backup tools
      ansible.builtin.import_role:
        name: restic_backup
        tasks_from: tools-native

    - name: Preserve the confined backup account
      ansible.builtin.import_role:
        name: restic_backup
        tasks_from: identity-native

    - name: Converge protected backup runtime files
      ansible.builtin.import_role:
        name: restic_backup
        tasks_from: runtime-native

    - name: Converge backup systemd definitions
      ansible.builtin.import_role:
        name: restic_backup
        tasks_from: systemd

    - name: Converge native Docker maintenance
      ansible.builtin.import_role:
        name: docker_maintenance

    - name: Reconcile the complete committed Compose project
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: deploy
      vars:
        compose_native_apply_confirmed: true

  post_tasks:
    - name: Release production ownership after complete native convergence
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: native-site-convergence

- name: Verify the converged native Docker host state
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  tasks:
    - name: Observe final Compose state
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe

    - name: Verify GOST resolves both MagicDNS peers and the public control plane
      ansible.builtin.command:
        argv: [/usr/bin/docker, exec, tailscale-control-proxy, getent, hosts, "{{ item }}"]
      loop:
        - "{{ hostvars['docker-host'].ansible_host }}"
        - "{{ hostvars['proxmox'].ansible_host }}"
        - controlplane.tailscale.com
      become: true
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Verify CLIProxyAPI management UI through strict tailnet TLS
      ansible.builtin.command:
        argv:
          - /usr/bin/curl
          - --fail
          - --silent
          - --show-error
          - --connect-timeout
          - '10'
          - --max-time
          - '30'
          - --output
          - /dev/null
          - --resolve
          - >-
            llm.ts.diloreto.com:443:{{
              (private_ingress_node_status.stdout | from_json).Self.TailscaleIPs |
              select('match', '^[0-9.]+$') | first
            }}
          - https://llm.ts.diloreto.com/management.html
      changed_when: false
      check_mode: false
      retries: 12
      delay: 5
      register: cli_proxy_ui_health
      until: cli_proxy_ui_health.rc == 0
      when: not ansible_check_mode
