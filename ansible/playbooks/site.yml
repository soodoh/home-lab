---
- name: Check or converge the approved Docker host state
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Enforce the apply safety contract
      ansible.builtin.import_role:
        name: apply_guard
      tags:
        - always

    - name: Acquire the host-side production apply lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
      tags:
        - always
  roles:
    - role: arch_packages
      tags:
        - base
    - role: base
      tags:
        - base
    - role: arch_network
      tags:
        - arch_network
    - role: tailscale
      tags:
        - tailscale
    - role: arch_mounts
      tags:
        - storage
    - role: storage
      tags:
        - storage
    - role: backup_storage
      tags:
        - storage
    - role: docker
      tags:
        - docker
    - role: sops_age
      tags:
        - sops_age
    - role: arch_hardware
      tags:
        - hardware
    - role: hardware
      tags:
        - hardware
    - role: coral
      tags:
        - coral
    - role: ssh
      vars:
        ssh_service_name: sshd.service
        ssh_password_authentication: false
        ssh_access_proven: "{{ arch_ssh_access_proven | default(false) }}"
        ssh_allow_users:
          - docker
          - ansible-plan
          - ansible-deploy
      tags:
        - ssh
    - role: host_files
      tags:
        - host_files
    - role: maintenance
      tags:
        - maintenance
    - role: compose
      tags:
        - compose
    - role: health
      tags:
        - health
  post_tasks:
    - name: Release the host-side production apply lock after success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
      tags:
        - always
