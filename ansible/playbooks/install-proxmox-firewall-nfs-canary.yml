---
- name: Install the inert Proxmox firewall NFS canary on Debian
  hosts: docker-host
  gather_facts: true
  any_errors_fatal: true
  vars:
    firewall_nfs_canary_expected_hostname: docker-host
  pre_tasks:
    - name: Require the exact Debian host and explicit NFS canary install approval
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.hostname == firewall_nfs_canary_expected_hostname
          - ansible_check_mode or (proxmox_firewall_nfs_canary_install_confirmed | default(false) | bool)
        fail_msg: "Firewall NFS canary installation requires the intended Debian host and explicit approval."

    - name: Acquire the host-side production apply lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: proxmox-firewall-nfs-canary-install

  roles:
    - role: firewall_nfs_canary

  post_tasks:
    - name: Release the host-side production apply lock after success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
