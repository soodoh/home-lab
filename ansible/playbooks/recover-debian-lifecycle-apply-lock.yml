---
- name: Recover one exact retained Debian lifecycle apply lock
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
  vars:
    recovery_plan: "{{ debian_lifecycle_lock_recovery_plan }}"
    recovery_observation: "{{ debian_lifecycle_lock_recovery_plan.precondition }}"
  pre_tasks:
    - name: Validate the canonical retained-lock recovery plan
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - ansible_run_tags | length == 1
          - ansible_run_tags | first == 'debian_lifecycle_lock_recovery'
          - >-
            recovery_plan.keys() | sort ==
            [
              'authorized', 'automatic_apply', 'base_commit', 'bindings',
              'blockers', 'created_at', 'expires_at', 'failed_plan_sha256',
              'format', 'precondition', 'profile', 'target'
            ] | sort
          - >-
            recovery_plan.format ==
            'home-lab-debian-lifecycle-retained-lock-recovery-plan-v1'
          - recovery_plan.target == 'debian'
          - recovery_plan.profile == 'inert'
          - recovery_plan.authorized == false
          - recovery_plan.automatic_apply == false
          - >-
            recovery_plan.blockers ==
            ['saved-reviewed-plan-required', 'separate-exact-authorization-required']
          - debian_lifecycle_lock_recovery_plan_sha256 is match('^[0-9a-f]{64}$')
          - >-
            debian_lifecycle_lock_recovery_plan_json | hash('sha256') ==
            debian_lifecycle_lock_recovery_plan_sha256
          - >-
            debian_lifecycle_lock_recovery_plan_json | from_json == recovery_plan
          - >-
            debian_lifecycle_lock_recovery_confirmation ==
            'release-debian-lifecycle-retained-lock-' ~
            debian_lifecycle_lock_recovery_plan_sha256
          - >-
            recovery_plan.base_commit ==
            lookup(
              'ansible.builtin.pipe',
              'git -C ' ~ playbook_dir ~ '/../.. rev-parse HEAD')
          - >-
            recovery_plan.base_commit ==
            lookup(
              'ansible.builtin.pipe',
              'git -C ' ~ playbook_dir ~ '/../.. rev-parse origin/main')
          - >-
            lookup(
              'ansible.builtin.pipe',
              'git -C ' ~ playbook_dir ~
              '/../.. status --porcelain=v1 --untracked-files=all') | length == 0
          - >-
            recovery_plan.created_at | to_datetime('%Y-%m-%dT%H:%M:%SZ') <=
            ansible_facts['date_time']['iso8601'] | to_datetime('%Y-%m-%dT%H:%M:%SZ')
          - >-
            recovery_plan.expires_at | to_datetime('%Y-%m-%dT%H:%M:%SZ') >=
            ansible_facts['date_time']['iso8601'] | to_datetime('%Y-%m-%dT%H:%M:%SZ')
          - >-
            ((recovery_plan.expires_at | to_datetime('%Y-%m-%dT%H:%M:%SZ')) -
            (recovery_plan.created_at | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).total_seconds() == 900
        fail_msg: The retained-lock plan, digest, revision, freshness, or confirmation differs.
      tags: always

    - name: Validate recovery plan source bindings
      ansible.builtin.assert:
        that:
          - >-
            recovery_plan.bindings.keys() | sort ==
            [
              'contract_sha256', 'controller_sha256', 'inventory_sha256',
              'observation_sha256', 'playbook_sha256'
            ] | sort
          - >-
            recovery_plan.bindings.contract_sha256 ==
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../../infrastructure/contract/home-lab.yml',
              rstrip=False) | hash('sha256')
          - >-
            recovery_plan.bindings.inventory_sha256 ==
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../inventory/debian-qualification.yml',
              rstrip=False) | hash('sha256')
          - >-
            recovery_plan.bindings.controller_sha256 ==
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../../scripts/controller/debian-lifecycle-transactions.py',
              rstrip=False) | hash('sha256')
          - >-
            recovery_plan.bindings.playbook_sha256 ==
            lookup('ansible.builtin.file', playbook_path, rstrip=False) | hash('sha256')
        fail_msg: Retained-lock recovery source bindings differ.
      tags: always

    - name: Validate exact retained-lock observation
      ansible.builtin.assert:
        that:
          - >-
            recovery_observation.keys() | sort ==
            [
              'apply_lock_exists', 'canary_receipt_exists', 'host_lock_exists',
              'lock_gid', 'lock_mode', 'lock_uid', 'owner_gid', 'owner_mode',
              'owner_nlink', 'owner_sha256', 'owner_text', 'owner_uid'
            ] | sort
          - recovery_observation.apply_lock_exists == true
          - recovery_observation.canary_receipt_exists == false
          - recovery_observation.host_lock_exists == false
          - recovery_observation.lock_uid == 0
          - recovery_observation.lock_gid == 0
          - recovery_observation.lock_mode == '0700'
          - recovery_observation.owner_uid == 0
          - recovery_observation.owner_gid == 0
          - recovery_observation.owner_mode == '0600'
          - recovery_observation.owner_nlink == 1
          - recovery_observation.owner_sha256 is match('^[0-9a-f]{64}$')
          - recovery_plan.failed_plan_sha256 is match('^[0-9a-f]{64}$')
          - >-
            recovery_observation.owner_text is search(
              '^controller=' ~ ansible_user ~ '\noperation=debian-lifecycle-qualification-canary-' ~
              recovery_plan.failed_plan_sha256 ~ '\nstarted=[^\n]+\n$')
        fail_msg: Retained-lock recovery observation differs.
      tags: always

    - name: Inspect retained apply-lock directory
      ansible.builtin.stat:
        path: "{{ debian.transaction.host_apply_lock_path }}"
        follow: false
      register: recovery_lock
      become: true
      tags: always

    - name: Inspect retained apply-lock owner
      ansible.builtin.stat:
        path: "{{ debian.transaction.host_apply_lock_path }}/owner"
        checksum_algorithm: sha256
        follow: false
      register: recovery_owner
      become: true
      tags: always

    - name: Inspect failed canary and host-lock postconditions
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - >-
          {{ debian.transaction.qualification_canary_receipt_root }}/{{
          recovery_plan.failed_plan_sha256 }}.json
        - /run/lock/home-lab-debian-lifecycle-transaction.lock
      register: recovery_postconditions
      become: true
      tags: always

    - name: Require exact retained lock and no partial host mutation
      ansible.builtin.assert:
        that:
          - recovery_lock.stat.isdir | default(false)
          - not (recovery_lock.stat.islnk | default(false))
          - recovery_lock.stat.pw_name == 'root'
          - recovery_lock.stat.gr_name == 'root'
          - recovery_lock.stat.mode == '0700'
          - recovery_owner.stat.isreg | default(false)
          - not (recovery_owner.stat.islnk | default(false))
          - recovery_owner.stat.nlink | int == 1
          - recovery_owner.stat.pw_name == 'root'
          - recovery_owner.stat.gr_name == 'root'
          - recovery_owner.stat.mode == '0600'
          - recovery_owner.stat.checksum == recovery_observation.owner_sha256
          - not (recovery_postconditions.results[0].stat.exists | default(false))
          - not (recovery_postconditions.results[1].stat.exists | default(false))
        fail_msg: Retained lock or failed-transaction postconditions changed.
      tags: always

  tasks:
    - name: Adopt the exact retained lifecycle apply lock
      ansible.builtin.include_role:
        name: apply_lock
      vars:
        apply_lock_action: adopt
        apply_lock_path: "{{ debian.transaction.host_apply_lock_path }}"
        apply_lock_operation: >-
          debian-lifecycle-qualification-canary-{{ recovery_plan.failed_plan_sha256 }}
        apply_lock_expected_owner_sha256: "{{ recovery_observation.owner_sha256 }}"
      tags: always

    - name: Release the exact adopted lifecycle apply lock
      ansible.builtin.include_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_path: "{{ debian.transaction.host_apply_lock_path }}"
        apply_lock_operation: >-
          debian-lifecycle-qualification-canary-{{ recovery_plan.failed_plan_sha256 }}
        apply_lock_expected_owner_sha256: "{{ recovery_observation.owner_sha256 }}"
      tags: always
