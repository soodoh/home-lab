---
- name: Safely enable Jellyfin LDAP user creation
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  vars:
    jellyfin_ldap_plugin_id: 958aad66-3784-4d2a-b89a-a7b6fab6e25c
    jellyfin_ldap_provider: Jellyfin.Plugin.LDAP_Auth.LdapAuthenticationProviderPlugin
    jellyfin_default_provider: Jellyfin.Server.Implementations.Users.DefaultAuthenticationProvider
    jellyfin_default_reset_provider: Jellyfin.Server.Implementations.Users.DefaultPasswordResetProvider
    jellyfin_ldap_expected_usernames:
      - carodilo
      - eabbado
      - parents
      - paul
      - sarabeth
    jellyfin_ldap_user_filter: >-
      (memberOf=cn=Jellyfin,ou=groups,dc=jellyfin,dc=ldap,dc=diloreto,dc=com)
    jellyfin_ldap_creation_backup_root: >-
      /srv/home-lab-state/jellyfin-upgrades/ldap-user-creation-{{ lookup('ansible.builtin.pipe', 'date -u +%Y%m%dT%H%M%SZ') }}
    controller_plan_credentials_path: >-
      {{ lookup('ansible.builtin.env', 'HOME') }}/.config/home-lab/controller/plan-credentials.json

  pre_tasks:
    - name: Require a clean committed controller source
      ansible.builtin.shell: |
        set -euo pipefail
        test "$(/usr/bin/git status --porcelain=v1 --untracked-files=no)" = ""
        test -n "$(/usr/bin/git rev-parse HEAD)"
      args:
        chdir: "{{ playbook_dir }}/../.."
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false

    - name: Acquire production ownership for LDAP user creation
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: jellyfin-ldap-user-creation

    - name: Require healthy Jellyfin and LDAP outpost containers
      ansible.builtin.shell: |
        set -euo pipefail
        test "$(docker inspect jellyfin | {{ ansible_python_interpreter }} -c \
          'import json,sys; print(json.load(sys.stdin)[0]["State"]["Health"]["Status"])')" = healthy
        test "$(docker inspect authentik-ldap | {{ ansible_python_interpreter }} -c \
          'import json,sys; print(json.load(sys.stdin)[0]["State"]["Status"])')" = running
      args:
        executable: /bin/bash
      become: true
      changed_when: false
      no_log: true

  tasks:
    - name: Read the protected controller planning credential
      ansible.builtin.set_fact:
        authentik_plan_credential: >-
          {{ lookup('ansible.builtin.file', controller_plan_credentials_path) | from_json }}
      delegate_to: localhost
      become: false
      no_log: true

    - name: Read the exact Authentik Jellyfin access group
      ansible.builtin.uri:
        url: >-
          {{ authentik_plan_credential.AUTHENTIK_URL }}/api/v3/core/users/?groups_by_name=Jellyfin&page_size=100&ordering=username
        method: GET
        headers:
          Authorization: "Bearer {{ authentik_plan_credential.AUTHENTIK_TOKEN }}"
        return_content: true
        status_code: 200
      delegate_to: localhost
      become: false
      register: authentik_jellyfin_users
      no_log: true

    - name: Require the exact active LDAP creation boundary
      ansible.builtin.assert:
        that:
          - authentik_jellyfin_users.json.results | length == 5
          - >-
            authentik_jellyfin_users.json.results | map(attribute='username') | sort | list ==
            jellyfin_ldap_expected_usernames | sort | list
          - >-
            authentik_jellyfin_users.json.results |
            selectattr('is_active', 'equalto', true) | list | length == 5
          - >-
            authentik_jellyfin_users.json.results |
            selectattr('type', 'equalto', 'internal') | list | length == 5
          - >-
            authentik_jellyfin_users.json.results |
            map(attribute='uid') | unique | list | length == 5
          - >-
            authentik_jellyfin_users.json.results |
            map(attribute='uid') | map('length') | unique | list == [64]
        fail_msg: Authentik Jellyfin membership or stable LDAP identities differ from the reviewed five-user boundary.
      no_log: true

    - name: Select the existing LDAP identities
      ansible.builtin.set_fact:
        authentik_paul: >-
          {{ authentik_jellyfin_users.json.results |
             selectattr('username', 'equalto', 'paul') | first }}
        authentik_carodilo: >-
          {{ authentik_jellyfin_users.json.results |
             selectattr('username', 'equalto', 'carodilo') | first }}
      no_log: true

    - name: Forget the controller provider credential after the bounded read
      ansible.builtin.set_fact:
        authentik_plan_credential: {}
      no_log: true

    - name: Read the existing Jellyfin API key only into memory
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - -c
          - >-
            import sqlite3;
            c=sqlite3.connect('file:/srv/home-lab-state/jellyfin-data/config/data/jellyfin.db?mode=ro',uri=True);
            rows=c.execute('select AccessToken from ApiKeys').fetchall();
            assert len(rows)==1 and isinstance(rows[0][0],str) and len(rows[0][0])>=32;
            print(rows[0][0])
      become: true
      register: jellyfin_api_key
      changed_when: false
      no_log: true

    - name: Discover the private Jellyfin API endpoint
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - --format
          - "{% raw %}{{range .NetworkSettings.Networks}}{{.IPAddress}}{{\"\\n\"}}{{end}}{% endraw %}"
          - jellyfin
      become: true
      register: jellyfin_private_addresses
      changed_when: false
      no_log: true

    - name: Select one exact private Jellyfin API address
      ansible.builtin.set_fact:
        jellyfin_api_url: "http://{{ jellyfin_private_addresses.stdout_lines | first }}:8096"
      no_log: true

    - name: Read all Jellyfin users before enabling creation
      ansible.builtin.uri:
        url: "{{ jellyfin_api_url }}/Users"
        method: GET
        headers:
          Authorization: "MediaBrowser Token=\"{{ jellyfin_api_key.stdout }}\""
        return_content: true
        status_code: 200
      register: jellyfin_users_before
      no_log: true

    - name: Read the qualified LDAP plugin configuration
      ansible.builtin.uri:
        url: "{{ jellyfin_api_url }}/Plugins/{{ jellyfin_ldap_plugin_id }}/Configuration"
        method: GET
        headers:
          Authorization: "MediaBrowser Token=\"{{ jellyfin_api_key.stdout }}\""
        return_content: true
        status_code: 200
      register: jellyfin_ldap_before
      no_log: true

    - name: Select the preserved Jellyfin identities
      ansible.builtin.set_fact:
        jellyfin_paul: >-
          {{ jellyfin_users_before.json | selectattr('Name', 'equalto', 'paul') | first }}
        jellyfin_carodilo: >-
          {{ jellyfin_users_before.json | selectattr('Name', 'equalto', 'carodilo') | first }}
        jellyfin_admin: >-
          {{ jellyfin_users_before.json |
             selectattr('Policy.IsAdministrator', 'equalto', true) | first }}
      no_log: true

    - name: Require existing identities and safe LDAP settings before creation
      ansible.builtin.assert:
        that:
          - jellyfin_users_before.json | length == 3
          - jellyfin_paul.Policy.AuthenticationProviderId == jellyfin_ldap_provider
          - jellyfin_carodilo.Policy.AuthenticationProviderId == jellyfin_ldap_provider
          - jellyfin_paul.Policy.EnableAllFolders | bool
          - jellyfin_carodilo.Policy.EnableAllFolders | bool
          - jellyfin_admin.Name == 'admin'
          - jellyfin_admin.Policy.AuthenticationProviderId == jellyfin_default_provider
          - jellyfin_admin.Policy.PasswordResetProviderId == jellyfin_default_reset_provider
          - not (jellyfin_ldap_before.json.CreateUsersFromLdap | bool)
          - not (jellyfin_ldap_before.json.AllowPassChange | bool)
          - jellyfin_ldap_before.json.LdapAdminFilter == '_disabled_'
          - not (jellyfin_ldap_before.json.SkipSslVerify | bool)
          - jellyfin_ldap_before.json.LdapSearchFilter == jellyfin_ldap_user_filter
          - jellyfin_ldap_before.json.LdapUidAttribute == 'uid'
          - jellyfin_ldap_before.json.LdapUsernameAttribute == 'cn'
          - jellyfin_ldap_before.json.LdapUsers | length == 1
          - >-
            (jellyfin_ldap_before.json.LdapUsers[0].LinkedJellyfinUserId |
             replace('-', '') | lower) == (jellyfin_paul.Id | replace('-', '') | lower)
          - jellyfin_ldap_before.json.LdapUsers[0].LdapUid == authentik_paul.uid
        fail_msg: Existing users, LDAP linkage, or creation safety settings differ from the reviewed state.
      no_log: true

    - name: Build stable UID links for both preserved LDAP users
      ansible.builtin.set_fact:
        jellyfin_ldap_preserved_links:
          - LinkedJellyfinUserId: "{{ jellyfin_paul.Id }}"
            LdapUid: "{{ authentik_paul.uid }}"
            ProfileImageHash: "{{ jellyfin_ldap_before.json.LdapUsers[0].ProfileImageHash | default('') }}"
          - LinkedJellyfinUserId: "{{ jellyfin_carodilo.Id }}"
            LdapUid: "{{ authentik_carodilo.uid }}"
            ProfileImageHash: ""
      no_log: true

    - name: Build the exact LDAP creation configuration
      ansible.builtin.set_fact:
        jellyfin_ldap_creation_configuration: >-
          {{ jellyfin_ldap_before.json | combine({
            'LdapUsers': jellyfin_ldap_preserved_links,
            'CreateUsersFromLdap': true,
            'EnableAllFolders': true,
            'EnabledFolders': []
          }, recursive=true) }}
      no_log: true

    - name: Create the root-only LDAP creation rollback directory
      ansible.builtin.file:
        path: "{{ jellyfin_ldap_creation_backup_root }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    - name: Preserve the exact pre-creation LDAP configuration
      ansible.builtin.copy:
        content: "{{ jellyfin_ldap_before.json | to_nice_json }}\n"
        dest: "{{ jellyfin_ldap_creation_backup_root }}/LDAP-Auth-before.json"
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true

    - name: Enable bounded LDAP user creation with preserved UID links
      ansible.builtin.uri:
        url: "{{ jellyfin_api_url }}/Plugins/{{ jellyfin_ldap_plugin_id }}/Configuration"
        method: POST
        headers:
          Authorization: "MediaBrowser Token=\"{{ jellyfin_api_key.stdout }}\""
        body_format: json
        body: "{{ jellyfin_ldap_creation_configuration }}"
        status_code: 204
      no_log: true

    - name: Re-test verified LDAPS bind and base search
      ansible.builtin.uri:
        url: "{{ jellyfin_api_url }}/Ldap/TestServerBind"
        method: POST
        headers:
          Authorization: "MediaBrowser Token=\"{{ jellyfin_api_key.stdout }}\""
        body_format: json
        body:
          LdapServer: "{{ jellyfin_ldap_creation_configuration.LdapServer }}"
          LdapPort: "{{ jellyfin_ldap_creation_configuration.LdapPort }}"
          UseSsl: "{{ jellyfin_ldap_creation_configuration.UseSsl }}"
          UseStartTls: "{{ jellyfin_ldap_creation_configuration.UseStartTls }}"
          SkipSslVerify: "{{ jellyfin_ldap_creation_configuration.SkipSslVerify }}"
          AllowPassChange: "{{ jellyfin_ldap_creation_configuration.AllowPassChange }}"
          LdapBindUser: "{{ jellyfin_ldap_creation_configuration.LdapBindUser }}"
          LdapBindPassword: "{{ jellyfin_ldap_creation_configuration.LdapBindPassword }}"
          LdapBaseDn: "{{ jellyfin_ldap_creation_configuration.LdapBaseDn }}"
          PasswordResetUrl: "{{ jellyfin_ldap_creation_configuration.PasswordResetUrl }}"
          LdapClientCertPath: "{{ jellyfin_ldap_creation_configuration.LdapClientCertPath }}"
          LdapClientKeyPath: "{{ jellyfin_ldap_creation_configuration.LdapClientKeyPath }}"
          LdapRootCaPath: "{{ jellyfin_ldap_creation_configuration.LdapRootCaPath }}"
        return_content: true
        status_code: 200
      register: jellyfin_ldap_bind_test
      no_log: true

    - name: Require successful verified LDAPS bind and search
      ansible.builtin.assert:
        that:
          - >-
            (jellyfin_ldap_bind_test.json.Connect |
             default(jellyfin_ldap_bind_test.json.connect)) == 'Success'
          - >-
            (jellyfin_ldap_bind_test.json.Bind |
             default(jellyfin_ldap_bind_test.json.bind)) == 'Success'
          - >-
            (jellyfin_ldap_bind_test.json.BaseSearch |
             default(jellyfin_ldap_bind_test.json.baseSearch)) is match('^Found [1-9][0-9]* Entities$')
          - >-
            (jellyfin_ldap_bind_test.json.Error |
             default(jellyfin_ldap_bind_test.json.error, true) | default('')) | length == 0
        fail_msg: Jellyfin LDAP failed its verified bind or base search after enabling creation.
      no_log: true

    - name: Re-test the exact five-user filter with LDAP administrators disabled
      ansible.builtin.uri:
        url: "{{ jellyfin_api_url }}/Ldap/TestLdapFilters"
        method: POST
        headers:
          Authorization: "MediaBrowser Token=\"{{ jellyfin_api_key.stdout }}\""
        body_format: json
        body:
          LdapSearchFilter: "{{ jellyfin_ldap_user_filter }}"
          LdapAdminFilter: _disabled_
          EnableLdapAdminFilterMemberUid: false
        return_content: true
        status_code: 200
      register: jellyfin_ldap_filter_test
      no_log: true

    - name: Require exactly five eligible users and no LDAP administrators
      ansible.builtin.assert:
        that:
          - >-
            (jellyfin_ldap_filter_test.json.Users |
             default(jellyfin_ldap_filter_test.json.users)) | int == 5
          - >-
            (jellyfin_ldap_filter_test.json.Admins |
             default(jellyfin_ldap_filter_test.json.admins)) | int == 0
          - >-
            (jellyfin_ldap_filter_test.json.IsSubset |
             default(jellyfin_ldap_filter_test.json.isSubset)) | bool
        fail_msg: LDAP creation escaped the reviewed five-user, zero-administrator boundary.
      no_log: true

    - name: Read the effective LDAP creation configuration
      ansible.builtin.uri:
        url: "{{ jellyfin_api_url }}/Plugins/{{ jellyfin_ldap_plugin_id }}/Configuration"
        method: GET
        headers:
          Authorization: "MediaBrowser Token=\"{{ jellyfin_api_key.stdout }}\""
        return_content: true
        status_code: 200
      register: jellyfin_ldap_effective
      no_log: true

    - name: Read all Jellyfin users after enabling creation
      ansible.builtin.uri:
        url: "{{ jellyfin_api_url }}/Users"
        method: GET
        headers:
          Authorization: "MediaBrowser Token=\"{{ jellyfin_api_key.stdout }}\""
        return_content: true
        status_code: 200
      register: jellyfin_users_after
      no_log: true

    - name: Require safe creation settings without eager or duplicate accounts
      ansible.builtin.assert:
        that:
          - jellyfin_ldap_effective.json.CreateUsersFromLdap | bool
          - jellyfin_ldap_effective.json.EnableAllFolders | bool
          - jellyfin_ldap_effective.json.EnabledFolders | length == 0
          - not (jellyfin_ldap_effective.json.AllowPassChange | bool)
          - jellyfin_ldap_effective.json.LdapAdminFilter == '_disabled_'
          - not (jellyfin_ldap_effective.json.SkipSslVerify | bool)
          - jellyfin_ldap_effective.json.LdapSearchFilter == jellyfin_ldap_user_filter
          - jellyfin_ldap_effective.json.LdapUsers | length == 2
          - >-
            jellyfin_ldap_effective.json.LdapUsers |
            map(attribute='LdapUid') | sort | list ==
            [authentik_paul.uid, authentik_carodilo.uid] | sort | list
          - >-
            jellyfin_ldap_effective.json.LdapUsers |
            map(attribute='LinkedJellyfinUserId') | map('replace', '-', '') | map('lower') | sort | list ==
            [jellyfin_paul.Id, jellyfin_carodilo.Id] | map('replace', '-', '') | map('lower') | sort | list
          - jellyfin_users_after.json | length == 3
          - >-
            jellyfin_users_after.json | map(attribute='Id') | sort | list ==
            jellyfin_users_before.json | map(attribute='Id') | sort | list
          - >-
            jellyfin_users_after.json |
            selectattr('Policy.IsAdministrator', 'equalto', true) |
            selectattr('Policy.AuthenticationProviderId', 'equalto', jellyfin_default_provider) |
            list | length == 1
        fail_msg: Effective LDAP creation settings, stable links, or existing Jellyfin identities are unsafe.
      no_log: true

  post_tasks:
    - name: Release production ownership after enabling LDAP user creation
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: jellyfin-ldap-user-creation
