---
- name: Diagnose only the retained Proton qualification authentication failure
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  vars:
    proton_auth_diagnostic_script_sha256: 39c62450ccb94165bc0d53dff0af9f5aced61af547f72d3c77cc8fa241046b61
  tasks:
    - name: Require exact Proton authentication diagnostic approval
      ansible.builtin.assert:
        that:
          - proton_auth_diagnostic_confirmed | default(false) | bool
          - proton_auth_diagnostic_confirmation | default('') == 'diagnose-only-proton-authentication'
          - backups.restic.migration_state == 'inert'
          - backups.restic.qualification.state == 'ready'
          - backups.restic.qualification.username_sha256 is match('^[0-9a-f]{64}$')
          - backups.restic.credentials.state == 'provisioned'
          - backups.legacy_offen.scheduler_state == 'quiesced'
          - backups.legacy_offen.migration_archive_preservation.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.current_object_retention_days >= 365
          - backups.legacy_offen.migration_retention_hold.review_deadline > now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')
        fail_msg: Proton authentication diagnosis requires its exact reviewed state and confirmation.

    - name: Inspect the retained failed qualification lock and owner for diagnosis
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop:
        - "{{ apply_lock_path }}"
        - "{{ apply_lock_path }}/owner"
      become: true
      register: proton_auth_diagnostic_lock_paths

    - name: Inspect retained failed qualification lock contents for diagnosis
      ansible.builtin.find:
        paths: "{{ apply_lock_path }}"
        hidden: true
        recurse: false
        file_type: any
      become: true
      register: proton_auth_diagnostic_lock_entries
      when: proton_auth_diagnostic_lock_paths.results[0].stat.isdir | default(false)

    - name: Read retained failed qualification owner for diagnosis
      ansible.builtin.slurp:
        src: "{{ apply_lock_path }}/owner"
      become: true
      register: proton_auth_diagnostic_lock_owner
      no_log: true
      when: proton_auth_diagnostic_lock_paths.results[1].stat.isreg | default(false)

    - name: Require the exact owner-bearing failed qualification lock for diagnosis
      ansible.builtin.assert:
        that:
          - proton_auth_diagnostic_lock_paths.results[0].stat.isdir | default(false)
          - proton_auth_diagnostic_lock_paths.results[0].stat.pw_name == 'root'
          - proton_auth_diagnostic_lock_paths.results[0].stat.mode == '0700'
          - proton_auth_diagnostic_lock_paths.results[1].stat.isreg | default(false)
          - proton_auth_diagnostic_lock_paths.results[1].stat.pw_name == 'root'
          - proton_auth_diagnostic_lock_paths.results[1].stat.mode == '0600'
          - proton_auth_diagnostic_lock_entries.matched == 1
          - "'controller=ansible-deploy' in (proton_auth_diagnostic_lock_owner.content | b64decode).splitlines()"
          - "'operation=proton-qualification' in (proton_auth_diagnostic_lock_owner.content | b64decode).splitlines()"
          - (proton_auth_diagnostic_lock_owner.content | b64decode).splitlines() | select('match', '^started=[0-9]{4}-[0-9]{2}-[0-9]{2}T') | list | length == 1
        fail_msg: Retained production lock is not the exact failed Proton qualification lock.
      no_log: true

    - name: Bind authentication diagnosis to the retained transaction
      ansible.builtin.set_fact:
        proton_auth_diagnostic_transaction_sha256: "{{ proton_auth_diagnostic_lock_owner.content | b64decode | hash('sha256') }}"
        proton_auth_diagnostic_evidence_path: >-
          /var/lib/home-lab-restic/proton-auth-diagnostic-{{ proton_auth_diagnostic_lock_owner.content | b64decode | hash('sha256') }}.json
      no_log: true

    - name: Require the explicitly reviewed retained transaction hash
      ansible.builtin.assert:
        that:
          - proton_auth_diagnostic_expected_transaction_sha256 | default('') == proton_auth_diagnostic_transaction_sha256
        fail_msg: Proton authentication diagnosis is not bound to the explicitly reviewed retained transaction.
      no_log: true

    - name: Require no concurrent Restic or rclone process during diagnosis
      ansible.builtin.command:
        argv: [/usr/bin/pgrep, --exact, "{{ item }}"]
      loop: [restic, rclone]
      register: proton_auth_diagnostic_processes
      changed_when: false
      failed_when: proton_auth_diagnostic_processes.rc != 1
      check_mode: false

    - name: Inspect stopped Offen scheduler states during diagnosis
      ansible.builtin.command:
        argv: [/usr/bin/docker, inspect, --format, "{{ '{{.State.Running}}' }}", "{{ item }}"]
      loop: "{{ backups.legacy_offen.scheduler_services }}"
      register: proton_auth_diagnostic_offen_states
      changed_when: false
      check_mode: false

    - name: Require Offen schedulers to remain stopped during diagnosis
      ansible.builtin.assert:
        that:
          - item.stdout == 'false'
        fail_msg: An Offen scheduler is not quiesced during Proton authentication diagnosis.
      loop: "{{ proton_auth_diagnostic_offen_states.results }}"

    - name: Inspect protected Proton authentication diagnostic prerequisites
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
      loop:
        - { name: policy, path: /etc/home-lab/restic-policy.json, owner: root, group: restic-proton, mode: '0440' }
        - name: helper
          path: /usr/local/libexec/home-lab/qualify-proton-backup
          owner: root
          group: restic-proton
          mode: "0750"
          checksum: "{{ backups.restic.qualification.helper_sha256 }}"
        - { name: rclone, path: /usr/local/bin/rclone, owner: root, group: root, mode: '0755', checksum: "{{ backups.restic.tools.rclone.installed_sha256 }}" }
        - { name: rclone_config, path: /var/lib/restic-proton/rclone.conf, owner: restic-proton, group: restic-proton, mode: '0600' }
        - { name: cache, path: /var/lib/restic-proton/cache, owner: restic-proton, group: restic-proton, mode: '0700', directory: true }
        - { name: backup_mutex, path: /run/lock/home-lab-backup.lock, owner: root, group: restic-proton, mode: '0660' }
        - { name: evidence_parent, path: /var/lib/home-lab-restic, owner: root, group: root, mode: '0750', directory: true }
      become: true
      register: proton_auth_diagnostic_prerequisites

    - name: Require exact protected Proton authentication diagnostic prerequisites
      ansible.builtin.assert:
        that:
          - >-
            (item.item.directory | default(false) | bool and item.stat.isdir | default(false))
            or (not (item.item.directory | default(false) | bool) and item.stat.isreg | default(false))
          - not (item.stat.islnk | default(false))
          - item.item.directory | default(false) | bool or item.stat.nlink == 1
          - item.stat.pw_name == item.item.owner
          - item.stat.gr_name == item.item.group
          - item.stat.mode == item.item.mode
          - item.item.checksum is not defined or item.stat.checksum == item.item.checksum
        fail_msg: "Protected Proton authentication diagnostic prerequisite {{ item.item.name }} differs."
      loop: "{{ proton_auth_diagnostic_prerequisites.results }}"

    - name: Read installed policy during Proton authentication diagnosis
      ansible.builtin.slurp:
        src: /etc/home-lab/restic-policy.json
      become: true
      register: proton_auth_diagnostic_installed_policy
      no_log: true

    - name: Require installed policy to equal the reviewed diagnostic contract
      ansible.builtin.assert:
        that:
          - (proton_auth_diagnostic_installed_policy.content | b64decode | from_json) == backups.restic
        fail_msg: Installed Restic policy differs during Proton authentication diagnosis.
      no_log: true

    - name: Inspect prior Proton transaction results and diagnostic evidence
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop:
        - "{{ backups.restic.qualification.result_path }}"
        - "{{ backups.restic.qualification.host_evidence_path }}"
        - "/var/lib/home-lab-restic/proton-qualification-recovery-{{ proton_auth_diagnostic_transaction_sha256 }}.json"
        - "{{ proton_auth_diagnostic_evidence_path }}"
      become: true
      register: proton_auth_diagnostic_prior_evidence

    - name: Refuse diagnosis after result or evidence publication
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: Existing Proton transaction evidence prohibits another authentication diagnosis.
      loop: "{{ proton_auth_diagnostic_prior_evidence.results }}"

    - name: Report bounded Proton authentication diagnosis in check mode
      ansible.builtin.debug:
        msg: >-
          Would run one transaction-bound diagnostic supervisor that atomically claims its evidence,
          acquires the exact backup mutex through root-authorized flock, validates the retained owner
          and protected config under that mutex, invokes exactly one non-mutating lsjson through
          runuser as restic-proton, atomically finalizes only redacted evidence, and retains the lock.
      changed_when: true
      when: ansible_check_mode

    - name: Run one atomic redacted Proton authentication diagnosis
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../../scripts/diagnose-proton-auth
          supervise
          {{ proton_auth_diagnostic_transaction_sha256 }}
          {{ proton_auth_diagnostic_script_sha256 }}
        executable: /usr/bin/python3
      become: true
      register: proton_auth_diagnostic_run
      changed_when: true
      failed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Capture only a controlled Proton authentication diagnostic failure
      ansible.builtin.set_fact:
        proton_auth_diagnostic_failure_report: >-
          {{
            (
              diagnostic_failure_output
              | regex_search('(?m)^proton_auth_diagnostic=failed reason=[a-z0-9_.-]+\\r?$')
              | default('', true)
              | trim
            )
            if (
              diagnostic_failure_output
              | regex_search('(?m)^proton_auth_diagnostic=failed reason=[a-z0-9_.-]+\\r?$')
              | default('', true)
              | length
            ) > 0
            else 'proton_auth_diagnostic=failed reason=unclassified_output_sha256_'
              ~ (diagnostic_failure_output | hash('sha256'))
          }}
      vars:
        diagnostic_failure_output: >-
          {{
            (proton_auth_diagnostic_run.stdout | default(''))
            ~ '\n' ~ (proton_auth_diagnostic_run.stderr | default(''))
            ~ '\n' ~ (proton_auth_diagnostic_run.msg | default('') | string)
          }}
      no_log: true
      when:
        - not ansible_check_mode
        - proton_auth_diagnostic_run.rc != 0

    - name: Require atomic Proton authentication diagnostic success
      ansible.builtin.assert:
        that:
          - proton_auth_diagnostic_run.rc == 0
          - >-
            proton_auth_diagnostic_run.stdout is match(
              '^proton_auth_diagnostic=observed category='
              ~ '(reachable|api_captcha|invalid_credentials|two_factor_rejected|account_key_incompatible|'
              ~ 'rate_limited|network_failure|rclone_unclassified) evidence_sha256=[0-9a-f]{64}$'
            )
        fail_msg: "{{ proton_auth_diagnostic_failure_report | default('proton_auth_diagnostic=failed reason=unclassified') }}"
      no_log: true
      when: not ansible_check_mode

    - name: Read atomic Proton authentication diagnostic evidence
      ansible.builtin.slurp:
        src: "{{ proton_auth_diagnostic_evidence_path }}"
      become: true
      register: proton_auth_diagnostic_evidence
      no_log: true
      when: not ansible_check_mode

    - name: Require exact transaction-bound Proton authentication diagnostic evidence
      ansible.builtin.assert:
        that:
          - evidence.keys() | sort == expected_keys | sort
          - evidence.account_username_sha256 == backups.restic.qualification.username_sha256
          - evidence.category in expected_categories
          - evidence.observed_at is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - evidence.operation == 'lsjson'
          - evidence.remote_directory == backups.restic.qualification.remote_directory
          - evidence.rclone_rc is integer
          - evidence.state == 'observed'
          - evidence.stderr_sha256 is match('^[0-9a-f]{64}$')
          - evidence.stdout_sha256 is match('^[0-9a-f]{64}$')
          - evidence.transaction_sha256 == proton_auth_diagnostic_transaction_sha256
          - evidence.version == 1
          - proton_auth_diagnostic_run.stdout == 'proton_auth_diagnostic=observed category=' ~ evidence.category ~ ' evidence_sha256=' ~ evidence_sha256
        fail_msg: Proton authentication diagnostic evidence differs from the reviewed transaction schema.
      vars:
        evidence: "{{ proton_auth_diagnostic_evidence.content | b64decode | from_json }}"
        evidence_sha256: "{{ proton_auth_diagnostic_evidence.content | b64decode | hash('sha256') }}"
        expected_categories:
          - reachable
          - api_captcha
          - invalid_credentials
          - two_factor_rejected
          - account_key_incompatible
          - rate_limited
          - network_failure
          - rclone_unclassified
        expected_keys:
          - account_username_sha256
          - category
          - observed_at
          - operation
          - remote_directory
          - rclone_rc
          - state
          - stderr_sha256
          - stdout_sha256
          - transaction_sha256
          - version
      no_log: true
      when: not ansible_check_mode

    - name: Re-read retained failed qualification owner after diagnosis
      ansible.builtin.slurp:
        src: "{{ apply_lock_path }}/owner"
      become: true
      register: proton_auth_diagnostic_final_lock_owner
      no_log: true
      when: not ansible_check_mode

    - name: Confirm diagnosis retained the exact failed Proton qualification lock
      ansible.builtin.assert:
        that:
          - proton_auth_diagnostic_final_lock_owner.content == proton_auth_diagnostic_lock_owner.content
        fail_msg: Proton authentication diagnosis did not retain the exact failed qualification owner bytes.
      no_log: true
      when: not ansible_check_mode
