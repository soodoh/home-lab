---
- name: Deploy only password-only Proton artifacts under the retained transaction
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  vars:
    proton_password_only_old_bootstrap_sha256: d7041cec2867491ed67b0aace14d48c910599017d5663e248246aa3f576cb56d
    proton_password_only_new_bootstrap_sha256: 4d3cea8501dd040ab8114ec62ad5e71eae3d58af329c2f7818d331316d8c8398
    proton_password_only_old_qualification_sha256: fc7b52f32bdd255fedaea54278b9aa7772854e141de9610c4ffc38bb32b01fc3
    proton_password_only_legacy_policy_sha256: c2fe0f70557f4ce7c7e44ec9fb5df1dba252eb13565ce71d6407fdb0e0cb3c7c
    proton_password_only_installed_ciphertext_sha256: b362f230ad1cea031d56e719d47b3070e99b497cd293e9479fc45b7503c8caf1
    proton_password_only_new_ciphertext_sha256: 17589e69023bf995b8c3d4adb1a0807966aaa67d414143900062a195a6622524
  tasks:
    - name: Require exact password-only artifact deployment approval
      ansible.builtin.assert:
        that:
          - proton_password_only_deployment_confirmed | default(false) | bool
          - proton_password_only_deployment_confirmation | default('') == 'deploy-only-password-only-proton-artifacts'
          - proton_password_only_deployment_expected_transaction_sha256 | default('') is match('^[0-9a-f]{64}$')
          - proton_password_only_deployment_expected_transition_evidence_sha256 | default('') is match('^[0-9a-f]{64}$')
          - backups.restic.migration_state == 'inert'
          - backups.restic.proton.authentication_mode == 'password-only'
          - backups.restic.qualification.state == 'ready'
          - "backups.restic.credentials == {'bootstrap_enabled': true, 'state': 'provisioned'}"
          - backups.restic.credential_refs.proton_totp_seed is not defined
          - backups.legacy_offen.scheduler_state == 'quiesced'
          - backups.legacy_offen.migration_retention_hold.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.review_deadline > now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')
        fail_msg: Password-only artifact deployment requires its exact reviewed state and confirmation.

    - name: Inspect retained qualification lock and owner
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop:
        - "{{ apply_lock_path }}"
        - "{{ apply_lock_path }}/owner"
      become: true
      register: proton_password_only_deployment_lock_paths

    - name: Inspect retained qualification lock contents
      ansible.builtin.find:
        paths: "{{ apply_lock_path }}"
        hidden: true
        recurse: false
        file_type: any
      become: true
      register: proton_password_only_deployment_lock_entries
      when: proton_password_only_deployment_lock_paths.results[0].stat.isdir | default(false)

    - name: Read retained qualification owner
      ansible.builtin.slurp:
        src: "{{ apply_lock_path }}/owner"
      become: true
      register: proton_password_only_deployment_lock_owner
      no_log: true
      when: proton_password_only_deployment_lock_paths.results[1].stat.isreg | default(false)

    - name: Require exact retained qualification lock
      ansible.builtin.assert:
        that:
          - proton_password_only_deployment_lock_paths.results[0].stat.isdir | default(false)
          - proton_password_only_deployment_lock_paths.results[0].stat.pw_name == 'root'
          - proton_password_only_deployment_lock_paths.results[0].stat.mode == '0700'
          - proton_password_only_deployment_lock_paths.results[1].stat.isreg | default(false)
          - proton_password_only_deployment_lock_paths.results[1].stat.pw_name == 'root'
          - proton_password_only_deployment_lock_paths.results[1].stat.mode == '0600'
          - proton_password_only_deployment_lock_entries.matched == 1
          - "'controller=ansible-deploy' in (proton_password_only_deployment_lock_owner.content | b64decode).splitlines()"
          - "'operation=proton-qualification' in (proton_password_only_deployment_lock_owner.content | b64decode).splitlines()"
          - >-
            (proton_password_only_deployment_lock_owner.content | b64decode | hash('sha256'))
            == proton_password_only_deployment_expected_transaction_sha256
        fail_msg: Retained lock is not the explicitly reviewed failed Proton qualification transaction.
      no_log: true

    - name: Set transaction-specific artifact deployment paths
      ansible.builtin.set_fact:
        proton_password_only_deployment_transaction_sha256: >-
          {{ proton_password_only_deployment_lock_owner.content | b64decode | hash('sha256') }}
        proton_password_only_transition_evidence_path: >-
          /var/lib/home-lab-restic/proton-password-only-transition-{{ proton_password_only_deployment_lock_owner.content | b64decode | hash('sha256') }}.json
        proton_password_only_deployment_evidence_path: >-
          /var/lib/home-lab-restic/proton-password-only-deployment-{{ proton_password_only_deployment_lock_owner.content | b64decode | hash('sha256') }}.json
      no_log: true

    - name: Require no concurrent Restic or rclone process
      ansible.builtin.command:
        argv: [/usr/bin/pgrep, --exact, "{{ item }}"]
      loop: [restic, rclone]
      register: proton_password_only_deployment_processes
      changed_when: false
      failed_when: proton_password_only_deployment_processes.rc != 1
      check_mode: false

    - name: Inspect stopped Offen scheduler states
      ansible.builtin.command:
        argv: [/usr/bin/docker, inspect, --format, "{{ '{{.State.Running}}' }}", "{{ item }}"]
      loop: "{{ backups.legacy_offen.scheduler_services }}"
      register: proton_password_only_deployment_offen_states
      changed_when: false
      check_mode: false

    - name: Require Offen schedulers to remain stopped
      ansible.builtin.assert:
        that:
          - item.stdout == 'false'
        fail_msg: An Offen scheduler is not quiesced during password-only artifact deployment.
      loop: "{{ proton_password_only_deployment_offen_states.results }}"

    - name: Inspect immutable transition evidence
      ansible.builtin.stat:
        path: "{{ proton_password_only_transition_evidence_path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
      become: true
      register: proton_password_only_transition_evidence

    - name: Require exact immutable transition evidence
      ansible.builtin.assert:
        that:
          - proton_password_only_transition_evidence.stat.isreg | default(false)
          - not (proton_password_only_transition_evidence.stat.islnk | default(false))
          - proton_password_only_transition_evidence.stat.nlink == 1
          - proton_password_only_transition_evidence.stat.pw_name == 'root'
          - proton_password_only_transition_evidence.stat.gr_name == 'root'
          - proton_password_only_transition_evidence.stat.mode == '0600'
          - >-
            proton_password_only_transition_evidence.stat.checksum
            == proton_password_only_deployment_expected_transition_evidence_sha256
        fail_msg: Password-only transition evidence is not the explicitly reviewed immutable result.

    - name: Read immutable transition evidence
      ansible.builtin.slurp:
        src: "{{ proton_password_only_transition_evidence_path }}"
      become: true
      register: proton_password_only_transition_evidence_content
      no_log: true

    - name: Require exact immutable transition evidence contents
      ansible.builtin.assert:
        that:
          - transition.keys() | sort == expected_keys | sort
          - transition.account_username_sha256 == backups.restic.qualification.username_sha256
          - transition.cache_state == 'absent'
          - transition.provider_requests == 0
          - transition.removed_field == 'otp_secret_key'
          - transition.state == 'password-only'
          - transition.transaction_sha256 == proton_password_only_deployment_transaction_sha256
          - transition.version == 1
        fail_msg: Password-only transition evidence content differs from the reviewed transaction.
      vars:
        transition: "{{ proton_password_only_transition_evidence_content.content | b64decode | from_json }}"
        expected_keys:
          - account_username_sha256
          - auth_diagnostic_evidence_sha256
          - cache_state
          - credential_rotation_evidence_sha256
          - provider_requests
          - removed_field
          - state
          - transaction_sha256
          - transitioned_at
          - version
      no_log: true

    - name: Inspect artifact deployment evidence claim
      ansible.builtin.stat:
        path: "{{ proton_password_only_deployment_evidence_path }}"
        follow: false
        get_checksum: false
        get_mime: false
      become: true
      register: proton_password_only_deployment_claim

    - name: Read resumable artifact deployment claim
      ansible.builtin.slurp:
        src: "{{ proton_password_only_deployment_evidence_path }}"
      become: true
      register: proton_password_only_deployment_claim_content
      no_log: true
      when: proton_password_only_deployment_claim.stat.exists

    - name: Require exact resumable artifact deployment claim
      ansible.builtin.assert:
        that:
          - proton_password_only_deployment_claim.stat.isreg | default(false)
          - not (proton_password_only_deployment_claim.stat.islnk | default(false))
          - proton_password_only_deployment_claim.stat.nlink == 1
          - proton_password_only_deployment_claim.stat.pw_name == 'root'
          - proton_password_only_deployment_claim.stat.gr_name == 'root'
          - proton_password_only_deployment_claim.stat.mode == '0600'
          - claim.keys() | sort == expected_keys | sort
          - claim.account_username_sha256 == backups.restic.qualification.username_sha256
          - >-
            claim.transition_evidence_sha256
            == proton_password_only_deployment_expected_transition_evidence_sha256
          - claim.state == 'started'
          - claim.transaction_sha256 == proton_password_only_deployment_transaction_sha256
          - claim.version == 1
        fail_msg: Existing password-only artifact deployment claim is not resumable.
      vars:
        claim: "{{ proton_password_only_deployment_claim_content.content | b64decode | from_json }}"
        expected_keys:
          - account_username_sha256
          - started_at
          - state
          - transaction_sha256
          - transition_evidence_sha256
          - version
      no_log: true
      when: proton_password_only_deployment_claim.stat.exists

    - name: Record whether artifact deployment is resuming
      ansible.builtin.set_fact:
        proton_password_only_deployment_resuming: "{{ proton_password_only_deployment_claim.stat.exists }}"

    - name: Inspect current password-only seam artifacts
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
      loop:
        - name: policy
          path: /etc/home-lab/restic-policy.json
          owner: root
          group: restic-proton
          mode: "0440"
        - name: bootstrap
          path: /usr/local/libexec/home-lab/bootstrap-restic-credentials
          owner: root
          group: root
          mode: "0750"
        - name: qualification
          path: /usr/local/libexec/home-lab/qualify-proton-backup
          owner: root
          group: restic-proton
          mode: "0750"
        - name: ciphertext
          path: /etc/home-lab/restic/production.sops.env
          owner: root
          group: root
          mode: "0400"
        - name: sops
          path: /usr/local/bin/sops
          owner: root
          group: root
          mode: "0755"
          checksum: "{{ sops_sha256 }}"
        - name: age_identity
          path: /etc/sops/age/keys.txt
          owner: root
          group: root
          mode: "0600"
        - name: backup_mutex
          path: /run/lock/home-lab-backup.lock
          owner: root
          group: restic-proton
          mode: "0660"
      become: true
      register: proton_password_only_current_artifacts

    - name: Require protected current password-only seam artifacts
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.nlink == 1
          - item.stat.pw_name == item.item.owner
          - item.stat.gr_name == item.item.group
          - item.stat.mode == item.item.mode
          - item.item.checksum is not defined or item.stat.checksum == item.item.checksum
        fail_msg: "Current password-only seam artifact {{ item.item.name }} is not protected."
      loop: "{{ proton_password_only_current_artifacts.results }}"

    - name: Read current installed Restic policy
      ansible.builtin.slurp:
        src: /etc/home-lab/restic-policy.json
      become: true
      register: proton_password_only_current_policy
      no_log: true

    - name: Require an exact initial or resumable artifact seam
      ansible.builtin.assert:
        that:
          - >-
            (
              not proton_password_only_deployment_resuming
              and policy_checksum == proton_password_only_legacy_policy_sha256
            )
            or (
              proton_password_only_deployment_resuming
              and (
                policy_checksum == proton_password_only_legacy_policy_sha256
                or current_policy
              )
            )
          - >-
            (not proton_password_only_deployment_resuming and bootstrap_checksum == proton_password_only_old_bootstrap_sha256)
            or (
              proton_password_only_deployment_resuming
              and bootstrap_checksum in [
                proton_password_only_old_bootstrap_sha256,
                proton_password_only_new_bootstrap_sha256
              ]
            )
          - >-
            (not proton_password_only_deployment_resuming and qualification_checksum == proton_password_only_old_qualification_sha256)
            or (
              proton_password_only_deployment_resuming
              and qualification_checksum in [
                proton_password_only_old_qualification_sha256,
                backups.restic.qualification.helper_sha256
              ]
            )
          - >-
            (not proton_password_only_deployment_resuming and ciphertext_checksum == proton_password_only_installed_ciphertext_sha256)
            or (
              proton_password_only_deployment_resuming
              and ciphertext_checksum in [
                proton_password_only_installed_ciphertext_sha256,
                proton_password_only_new_ciphertext_sha256
              ]
            )
        fail_msg: Current password-only artifact seam is neither the exact initial nor resumable state.
      vars:
        installed: "{{ proton_password_only_current_policy.content | b64decode | from_json }}"
        current_policy: "{{ installed == backups.restic }}"
        policy_checksum: "{{ proton_password_only_current_artifacts.results[0].stat.checksum }}"
        bootstrap_checksum: "{{ proton_password_only_current_artifacts.results[1].stat.checksum }}"
        qualification_checksum: "{{ proton_password_only_current_artifacts.results[2].stat.checksum }}"
        ciphertext_checksum: "{{ proton_password_only_current_artifacts.results[3].stat.checksum }}"
      no_log: true

    - name: Inspect only installed rclone field names
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            from configparser import ConfigParser, Error as ConfigError
            from pathlib import Path
            import hashlib
            import sys

            parser = ConfigParser(interpolation=None)
            try:
                with Path(sys.argv[1]).open(encoding="utf-8") as stream:
                    parser.read_file(stream)
            except (OSError, UnicodeDecodeError, ConfigError):
                raise SystemExit(1)
            if parser.sections() != ["proton-backup"]:
                raise SystemExit(1)
            remote = parser["proton-backup"]
            expected = {"type", "username", "password", "replace_existing_draft", "enable_caching", "original_file_size"}
            if set(remote) != expected or hashlib.sha256(remote["username"].encode()).hexdigest() != sys.argv[2]:
                raise SystemExit(1)
            print("password_only_config=ready")
          - /var/lib/restic-proton/rclone.conf
          - "{{ backups.restic.qualification.username_sha256 }}"
      become: true
      register: proton_password_only_deployment_config
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require exact installed password-only rclone config
      ansible.builtin.assert:
        that:
          - proton_password_only_deployment_config.stdout == 'password_only_config=ready'
        fail_msg: Installed rclone config is not the exact password-only static shape.
      no_log: true

    - name: Preflight exact controller-side password-only sources
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
      loop:
        - name: bootstrap
          path: "{{ playbook_dir }}/../../scripts/bootstrap-restic-credentials"
          checksum: "{{ proton_password_only_new_bootstrap_sha256 }}"
        - name: qualification
          path: "{{ playbook_dir }}/../../scripts/qualify-proton-backup"
          checksum: "{{ backups.restic.qualification.helper_sha256 }}"
        - name: ciphertext
          path: "{{ playbook_dir }}/../../secrets/production.sops.env"
          checksum: "{{ proton_password_only_new_ciphertext_sha256 }}"
      delegate_to: localhost
      become: false
      register: proton_password_only_deployment_sources

    - name: Require exact controller-side password-only source hashes
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.nlink == 1
          - item.stat.checksum == item.item.checksum
        fail_msg: "Controller-side password-only source {{ item.item.name }} differs from its pin."
      loop: "{{ proton_password_only_deployment_sources.results }}"

    - name: Report exact password-only artifact deployment in check mode
      ansible.builtin.debug:
        msg: >-
          Would claim resumable transaction evidence; atomically install only the reviewed Restic policy,
          credential bootstrap helper, qualification helper, and 93-key encrypted SOPS ciphertext; run
          protected credential materialization as a required no-op under the backup mutex; prove exact
          hashes and password-only config; make zero Proton requests; and retain the production lock.
      changed_when: true
      when: ansible_check_mode

    - name: Claim password-only artifact deployment transaction
      ansible.builtin.copy:
        content: >-
          {{
            {
              'account_username_sha256': backups.restic.qualification.username_sha256,
              'started_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
              'state': 'started',
              'transaction_sha256': proton_password_only_deployment_transaction_sha256,
              'transition_evidence_sha256': proton_password_only_deployment_expected_transition_evidence_sha256,
              'version': 1
            } | to_json
          }}
        dest: "{{ proton_password_only_deployment_evidence_path }}"
        owner: root
        group: root
        mode: "0600"
        force: false
      become: true
      register: proton_password_only_deployment_claim_write
      no_log: true
      when: not ansible_check_mode

    - name: Require single-writer artifact deployment claim
      ansible.builtin.assert:
        that:
          - >-
            proton_password_only_deployment_resuming
            or proton_password_only_deployment_claim_write.changed
        fail_msg: Another artifact deployment claimed this transaction first.
      no_log: true
      when: not ansible_check_mode

    - name: Re-read claimed artifact deployment transaction
      ansible.builtin.slurp:
        src: "{{ proton_password_only_deployment_evidence_path }}"
      become: true
      register: proton_password_only_deployment_active_claim
      no_log: true
      when: not ansible_check_mode

    - name: Require exact active artifact deployment claim
      ansible.builtin.assert:
        that:
          - claim.keys() | sort == expected_keys | sort
          - claim.account_username_sha256 == backups.restic.qualification.username_sha256
          - claim.state == 'started'
          - claim.transaction_sha256 == proton_password_only_deployment_transaction_sha256
          - >-
            claim.transition_evidence_sha256
            == proton_password_only_deployment_expected_transition_evidence_sha256
          - claim.version == 1
        fail_msg: Active artifact deployment claim differs before mutation.
      vars:
        claim: "{{ proton_password_only_deployment_active_claim.content | b64decode | from_json }}"
        expected_keys:
          - account_username_sha256
          - started_at
          - state
          - transaction_sha256
          - transition_evidence_sha256
          - version
      no_log: true
      when: not ansible_check_mode

    - name: Install reviewed password-only policy
      ansible.builtin.copy:
        content: "{{ backups.restic | to_nice_json }}\n"
        dest: /etc/home-lab/restic-policy.json
        owner: root
        group: restic-proton
        mode: "0440"
      become: true
      when: not ansible_check_mode

    - name: Install reviewed password-only helpers
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: "{{ item.group }}"
        mode: "0750"
      loop:
        - src: "{{ playbook_dir }}/../../scripts/bootstrap-restic-credentials"
          dest: /usr/local/libexec/home-lab/bootstrap-restic-credentials
          group: root
        - src: "{{ playbook_dir }}/../../scripts/qualify-proton-backup"
          dest: /usr/local/libexec/home-lab/qualify-proton-backup
          group: restic-proton
      become: true
      when: not ansible_check_mode

    - name: Install reviewed password-only SOPS ciphertext
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../secrets/production.sops.env"
        dest: /etc/home-lab/restic/production.sops.env
        owner: root
        group: root
        mode: "0400"
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Validate protected password-only credential materialization as a no-op
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          /usr/bin/flock --exclusive --nonblock --conflict-exit-code 75
          {{ backups.restic.runner.lock_path | quote }}
          /bin/bash -c
          'set -o pipefail &&
          PATH=/usr/local/bin:/usr/bin:/bin SOPS_AGE_KEY_FILE=/etc/sops/age/keys.txt
          /usr/local/bin/sops --decrypt --output-type dotenv
          /etc/home-lab/restic/production.sops.env |
          PATH=/usr/local/bin:/usr/bin:/bin /usr/bin/python3
          /usr/local/libexec/home-lab/bootstrap-restic-credentials 60000 60000 --check &&
          PATH=/usr/local/bin:/usr/bin:/bin SOPS_AGE_KEY_FILE=/etc/sops/age/keys.txt
          /usr/local/bin/sops --decrypt --output-type dotenv
          /etc/home-lab/restic/production.sops.env |
          PATH=/usr/local/bin:/usr/bin:/bin /usr/bin/python3
          /usr/local/libexec/home-lab/bootstrap-restic-credentials 60000 60000'
        executable: /bin/bash
      become: true
      register: proton_password_only_materialization
      changed_when: false
      failed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Require password-only credential materialization no-op
      ansible.builtin.assert:
        that:
          - proton_password_only_materialization.rc == 0
          - >-
            proton_password_only_materialization.stdout
            == 'restic_credentials=validated state=noop\nrestic_credentials=materialized state=noop'
        fail_msg: Password-only credential materialization was not the required protected no-op.
      no_log: true
      when: not ansible_check_mode

    - name: Inspect deployed password-only artifacts
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
      loop:
        - name: bootstrap
          path: /usr/local/libexec/home-lab/bootstrap-restic-credentials
          owner: root
          group: root
          mode: "0750"
          checksum: "{{ proton_password_only_new_bootstrap_sha256 }}"
        - name: qualification
          path: /usr/local/libexec/home-lab/qualify-proton-backup
          owner: root
          group: restic-proton
          mode: "0750"
          checksum: "{{ backups.restic.qualification.helper_sha256 }}"
        - name: ciphertext
          path: /etc/home-lab/restic/production.sops.env
          owner: root
          group: root
          mode: "0400"
          checksum: "{{ proton_password_only_new_ciphertext_sha256 }}"
      become: true
      register: proton_password_only_deployed_artifacts
      when: not ansible_check_mode

    - name: Require exact deployed password-only artifact hashes
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.nlink == 1
          - item.stat.pw_name == item.item.owner
          - item.stat.gr_name == item.item.group
          - item.stat.mode == item.item.mode
          - item.stat.checksum == item.item.checksum
        fail_msg: "Deployed password-only artifact {{ item.item.name }} differs."
      loop: "{{ proton_password_only_deployed_artifacts.results }}"
      when: not ansible_check_mode

    - name: Read deployed Restic policy
      ansible.builtin.slurp:
        src: /etc/home-lab/restic-policy.json
      become: true
      register: proton_password_only_deployed_policy
      no_log: true
      when: not ansible_check_mode

    - name: Require deployed Restic policy to equal reviewed contract
      ansible.builtin.assert:
        that:
          - (proton_password_only_deployed_policy.content | b64decode | from_json) == backups.restic
        fail_msg: Deployed password-only Restic policy differs from the reviewed contract.
      no_log: true
      when: not ansible_check_mode

    - name: Finalize password-only artifact deployment evidence
      ansible.builtin.copy:
        content: >-
          {{
            {
              'account_username_sha256': backups.restic.qualification.username_sha256,
              'bootstrap_helper_sha256': proton_password_only_deployed_artifacts.results[0].stat.checksum,
              'ciphertext_sha256': proton_password_only_deployed_artifacts.results[2].stat.checksum,
              'credential_materialization': 'noop',
              'deployed_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
              'policy_sha256': proton_password_only_deployed_policy.content | b64decode | hash('sha256'),
              'provider_requests': 0,
              'qualification_helper_sha256': proton_password_only_deployed_artifacts.results[1].stat.checksum,
              'state': 'deployed',
              'transaction_sha256': proton_password_only_deployment_transaction_sha256,
              'transition_evidence_sha256': proton_password_only_deployment_expected_transition_evidence_sha256,
              'version': 1
            } | to_json
          }}
        dest: "{{ proton_password_only_deployment_evidence_path }}"
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Read finalized password-only artifact deployment evidence
      ansible.builtin.slurp:
        src: "{{ proton_password_only_deployment_evidence_path }}"
      become: true
      register: proton_password_only_deployment_evidence
      no_log: true
      when: not ansible_check_mode

    - name: Require exact finalized password-only artifact deployment evidence
      ansible.builtin.assert:
        that:
          - evidence.keys() | sort == expected_keys | sort
          - evidence.account_username_sha256 == backups.restic.qualification.username_sha256
          - evidence.bootstrap_helper_sha256 == proton_password_only_new_bootstrap_sha256
          - evidence.ciphertext_sha256 == proton_password_only_new_ciphertext_sha256
          - evidence.credential_materialization == 'noop'
          - evidence.deployed_at is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - evidence.policy_sha256 == (proton_password_only_deployed_policy.content | b64decode | hash('sha256'))
          - evidence.provider_requests == 0
          - evidence.qualification_helper_sha256 == backups.restic.qualification.helper_sha256
          - evidence.state == 'deployed'
          - evidence.transaction_sha256 == proton_password_only_deployment_transaction_sha256
          - >-
            evidence.transition_evidence_sha256
            == proton_password_only_deployment_expected_transition_evidence_sha256
          - evidence.version == 1
        fail_msg: Password-only artifact deployment evidence differs from the reviewed transaction schema.
      vars:
        evidence: "{{ proton_password_only_deployment_evidence.content | b64decode | from_json }}"
        expected_keys:
          - account_username_sha256
          - bootstrap_helper_sha256
          - ciphertext_sha256
          - credential_materialization
          - deployed_at
          - policy_sha256
          - provider_requests
          - qualification_helper_sha256
          - state
          - transaction_sha256
          - transition_evidence_sha256
          - version
      no_log: true
      when: not ansible_check_mode

    - name: Re-read retained qualification owner after artifact deployment
      ansible.builtin.slurp:
        src: "{{ apply_lock_path }}/owner"
      become: true
      register: proton_password_only_deployment_final_lock_owner
      no_log: true
      when: not ansible_check_mode

    - name: Confirm artifact deployment retained exact qualification lock
      ansible.builtin.assert:
        that:
          - >-
            proton_password_only_deployment_final_lock_owner.content
            == proton_password_only_deployment_lock_owner.content
        fail_msg: Artifact deployment did not retain the exact failed qualification owner bytes.
      no_log: true
      when: not ansible_check_mode
