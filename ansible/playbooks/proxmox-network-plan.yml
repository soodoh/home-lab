---
- name: Build read-only Proxmox networking and Tailscale parity
  hosts: proxmox_host
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
  roles:
    - role: lifecycle_state
      vars:
        lifecycle_state_emit_observation: false
        lifecycle_state_enforce: false
    - role: proxmox_storage_lifecycle
    - role: proxmox_network_lifecycle

- name: Build read-only Debian networking-consumer parity
  hosts: docker_host
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
  roles:
    - role: lifecycle_state
      vars:
        lifecycle_state_emit_observation: false
        lifecycle_state_enforce: false
    - role: proxmox_storage_consumers
    - role: proxmox_network_consumers
