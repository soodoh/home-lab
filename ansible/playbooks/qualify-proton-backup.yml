---
- name: Guardedly qualify the dedicated Proton Drive backup backend
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Require exact Proton qualification approval and desired state
      ansible.builtin.assert:
        that:
          - proton_qualification_confirmed | default(false) | bool
          - proton_qualification_confirmation | default('') == backups.restic.qualification.confirmation
          - backups.restic.migration_state == 'inert'
          - >-
            backups.restic.credentials ==
            {'bootstrap_enabled': true, 'state': 'provisioned'}
          - backups.restic.qualification.state == 'ready'
          - backups.restic.qualification.username_sha256 is match('^[0-9a-f]{64}$')
          - backups.restic.qualification.evidence_sha256 is none
          - backups.restic.qualification.verified_at is none
          - backups.restic.repositories.values() | map(attribute='id') | select('ne', none) | list | length == 0
          - backups.legacy_offen.scheduler_state == 'quiesced'
          - backups.legacy_offen.migration_archive_preservation.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.current_object_retention_days >= 365
          - backups.legacy_offen.migration_retention_hold.review_deadline > now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')
        fail_msg: Proton qualification requires the exact reviewed ready state and confirmation.

    - name: Inspect reviewed qualification artifacts before lock acquisition
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
      loop:
        - { name: policy, path: /etc/home-lab/restic-policy.json, owner: root, group: restic-proton, mode: '0440' }
        - name: helper
          path: /usr/local/libexec/home-lab/qualify-proton-backup
          owner: root
          group: restic-proton
          mode: "0750"
          checksum: "{{ backups.restic.qualification.helper_sha256 }}"
        - { name: rclone, path: /usr/local/bin/rclone, owner: root, group: root, mode: '0755', checksum: "{{ backups.restic.tools.rclone.installed_sha256 }}" }
      become: true
      register: proton_qualification_reviewed_artifacts

    - name: Require exact reviewed qualification artifact metadata and hashes
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.nlink == 1
          - item.stat.pw_name == item.item.owner
          - item.stat.gr_name == item.item.group
          - item.stat.mode == item.item.mode
          - item.item.checksum is not defined or item.stat.checksum == item.item.checksum
        fail_msg: "Reviewed Proton qualification artifact {{ item.item.name }} differs."
      loop: "{{ proton_qualification_reviewed_artifacts.results }}"

    - name: Read the installed Restic policy before lock acquisition
      ansible.builtin.slurp:
        src: /etc/home-lab/restic-policy.json
      become: true
      register: proton_qualification_installed_policy
      no_log: true

    - name: Require the installed policy to equal the reviewed contract
      ansible.builtin.assert:
        that:
          - (proton_qualification_installed_policy.content | b64decode | from_json) == backups.restic
        fail_msg: Installed Restic policy differs from the reviewed contract.
      no_log: true

    - name: Inspect the pinned rclone version before lock acquisition
      ansible.builtin.command:
        argv: [/usr/local/bin/rclone, version]
      environment:
        HOME: /var/lib/restic-proton
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
        PATH: /usr/local/bin:/usr/bin:/bin
      register: proton_qualification_rclone_version
      changed_when: false
      check_mode: false

    - name: Require the exact pinned rclone version before lock acquisition
      ansible.builtin.assert:
        that:
          - proton_qualification_rclone_version.stdout_lines | length > 0
          - proton_qualification_rclone_version.stdout_lines[0] == backups.restic.tools.rclone.version_output_prefix
        fail_msg: Installed rclone version differs from the reviewed contract.

    - name: Refuse prior qualification result or host evidence before lock acquisition
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop:
        - "{{ backups.restic.qualification.result_path }}"
        - "{{ backups.restic.qualification.host_evidence_path }}"
      become: true
      register: proton_qualification_prior_results

    - name: Require qualification to be a fresh one-shot operation
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: Prior Proton qualification evidence requires attestation or reviewed recovery, not a rerun.
      loop: "{{ proton_qualification_prior_results.results }}"

    - name: Acquire the shared production mutation lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: proton-qualification

  tasks:
    - name: Require a complete quiesced source-state audit before Proton qualification
      ansible.builtin.import_role:
        name: audit
      vars:
        audit_expected_stopped_compose_services: "{{ backups.legacy_offen.scheduler_services }}"
        audit_expected_running_compose_service_count: "{{ audit_expected_compose_service_count - (backups.legacy_offen.scheduler_services | length) }}"

    - name: Inspect exact backup mount identities before Proton qualification
      ansible.builtin.command:
        argv: [/usr/bin/findmnt, --json, --target, "{{ item.mountpoint }}", --output, "TARGET,SOURCE,FSTYPE,UUID"]
      loop:
        - mountpoint: "{{ backups.restic.repositories.games.mountpoint }}"
          filesystem: "{{ backups.restic.repositories.games.filesystem }}"
          filesystem_uuid: "{{ backups.restic.repositories.games.filesystem_uuid }}"
          mount_source: ""
        - mountpoint: "{{ backups.restic.repositories.nfs.mountpoint }}"
          filesystem: "{{ backups.restic.repositories.nfs.filesystem }}"
          filesystem_uuid: ""
          mount_source: "{{ backups.restic.repositories.nfs.mount_source }}"
      register: proton_qualification_mounts
      changed_when: false
      check_mode: false

    - name: Require exact backup mount identities before Proton qualification
      ansible.builtin.assert:
        that:
          - observed | length == 1
          - observed[0].target == item.item.mountpoint
          - observed[0].fstype == item.item.filesystem
          - item.item.filesystem_uuid | length == 0 or observed[0].uuid == item.item.filesystem_uuid
          - item.item.mount_source | length == 0 or observed[0].source == item.item.mount_source
        fail_msg: Refusing Proton qualification without the exact contract backup mounts.
      loop: "{{ proton_qualification_mounts.results }}"
      vars:
        observed: "{{ (item.stdout | from_json).filesystems }}"

    - name: Require no concurrent Restic or rclone process
      ansible.builtin.command:
        argv: [/usr/bin/pgrep, --exact, "{{ item }}"]
      loop: [restic, rclone]
      register: proton_qualification_processes
      changed_when: false
      failed_when: proton_qualification_processes.rc != 1
      check_mode: false

    - name: Inspect stopped Offen scheduler states
      ansible.builtin.command:
        argv: [/usr/bin/docker, inspect, --format, "{{ '{{.State.Running}}' }}", "{{ item }}"]
      loop: "{{ backups.legacy_offen.scheduler_services }}"
      register: proton_qualification_offen_states
      changed_when: false
      check_mode: false

    - name: Require Offen schedulers to remain stopped and defined
      ansible.builtin.assert:
        that:
          - item.stdout == 'false'
        fail_msg: An Offen scheduler is not quiesced before Proton qualification.
      loop: "{{ proton_qualification_offen_states.results }}"

    - name: Inspect credential, qualification, and repository paths
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop:
        - { name: local_password, path: /etc/home-lab/restic/credentials/local-password, owner: root, group: restic-proton, mode: '0440', state: file }
        - { name: proton_password, path: /etc/home-lab/restic/credentials/proton-password, owner: root, group: restic-proton, mode: '0440', state: file }
        - { name: rclone_config, path: /var/lib/restic-proton/rclone.conf, owner: restic-proton, group: restic-proton, mode: '0600', state: file }
        - { name: qualification_tool, path: /usr/local/libexec/home-lab/qualify-proton-backup, owner: root, group: restic-proton, mode: '0750', state: file }
        - { name: qualification_result, path: "{{ backups.restic.qualification.result_path }}", state: absent }
        - { name: qualification_evidence, path: "{{ backups.restic.qualification.host_evidence_path }}", state: absent }
        - { name: games_config, path: "{{ backups.restic.repositories.games.path }}/config", state: absent }
        - { name: nfs_config, path: "{{ backups.restic.repositories.nfs.path }}/config", state: absent }
      register: proton_qualification_paths
      become: true

    - name: Require exact credential and qualification path states
      ansible.builtin.assert:
        that:
          - >-
            (item.item.state == 'absent' and not item.stat.exists) or
            (item.item.state == 'file' and item.stat.isreg | default(false) and
             not (item.stat.islnk | default(false)) and item.stat.nlink == 1 and
             item.stat.pw_name == item.item.owner and item.stat.gr_name == item.item.group and
             item.stat.mode == item.item.mode)
        fail_msg: "Protected Proton qualification path {{ item.item.name }} differs."
      loop: "{{ proton_qualification_paths.results }}"

    - name: Inspect inert Restic unit activity before Proton qualification
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-active, "{{ item }}"]
      loop: "{{ restic_audit_inert_units.keys() }}"
      register: proton_qualification_units
      changed_when: false
      failed_when: proton_qualification_units.rc not in [0, 3]
      check_mode: false

    - name: Require every Restic unit to remain inactive
      ansible.builtin.assert:
        that:
          - item.stdout == 'inactive'
        fail_msg: A Restic unit is active before Proton qualification.
      loop: "{{ proton_qualification_units.results }}"

    - name: Report the bounded Proton qualification plan in check mode
      ansible.builtin.debug:
        msg: >-
          Would invalidate only cached Proton client tokens, reauthenticate through the protected
          password-only account, exercise one 4096-byte object under the dedicated qualification
          directory, remove that exact object and directory, and retain redacted evidence.
      changed_when: true
      when: ansible_check_mode

    - name: Run the bounded Proton qualification under the shared backup mutex
      ansible.builtin.command:
        argv:
          - /usr/bin/flock
          - --exclusive
          - --nonblock
          - --
          - "{{ backups.restic.runner.lock_path }}"
          - /usr/sbin/runuser
          - --user
          - restic-proton
          - --
          - /usr/local/libexec/home-lab/qualify-proton-backup
          - qualify
      become: true
      register: proton_qualification_run
      changed_when: true
      failed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Capture only a controlled bounded qualification failure
      ansible.builtin.set_fact:
        proton_qualification_failure_report: >-
          {{
            (
              proton_qualification_run.stderr
              | default('')
              | regex_search('(?m)^proton_qualification=failed reason=[a-z0-9_.-]+\r?$')
              | default('', true)
              | trim
            )
            if (
              proton_qualification_run.stderr
              | default('')
              | regex_search('(?m)^proton_qualification=failed reason=[a-z0-9_.-]+\r?$')
              | default('', true)
              | length
            ) > 0
            else 'proton_qualification=failed reason=unclassified_stderr_sha256_'
              ~ (proton_qualification_run.stderr | default('') | hash('sha256'))
          }}
      no_log: true
      when:
        - not ansible_check_mode
        - proton_qualification_run.rc != 0

    - name: Require bounded Proton qualification helper success
      ansible.builtin.assert:
        that:
          - proton_qualification_run.rc == 0
        fail_msg: "{{ proton_qualification_failure_report | default('proton_qualification=failed reason=unclassified') }}"
      when: not ansible_check_mode

    - name: Inspect protected qualification result
      ansible.builtin.stat:
        path: "{{ backups.restic.qualification.result_path }}"
        follow: false
        get_checksum: false
        get_mime: false
      become: true
      register: proton_qualification_result_stat
      when: not ansible_check_mode

    - name: Read protected qualification result
      ansible.builtin.slurp:
        src: "{{ backups.restic.qualification.result_path }}"
      become: true
      register: proton_qualification_result
      no_log: true
      when: not ansible_check_mode

    - name: Require exact bounded and redacted Proton qualification evidence
      ansible.builtin.assert:
        that:
          - proton_qualification_result_stat.stat.isreg | default(false)
          - not (proton_qualification_result_stat.stat.islnk | default(false))
          - proton_qualification_result_stat.stat.nlink == 1
          - proton_qualification_result_stat.stat.pw_name == 'restic-proton'
          - proton_qualification_result_stat.stat.gr_name == 'restic-proton'
          - proton_qualification_result_stat.stat.mode == '0600'
          - evidence.keys() | sort == expected_keys | sort
          - evidence.version == 1
          - evidence.state == 'qualified'
          - evidence.account_username_sha256 == backups.restic.qualification.username_sha256
          - evidence.minimum_allocated_bytes == backups.restic.repositories.proton.minimum_allocated_bytes
          - evidence.observed_total_bytes >= backups.restic.repositories.proton.minimum_allocated_bytes
          - evidence.free_bytes >= backups.restic.proton.minimum_free_bytes
          - evidence.fixture_bytes == backups.restic.qualification.fixture_bytes
          - evidence.fixture_sha256 is match('^[0-9a-f]{64}$')
          - evidence.range_offset == backups.restic.qualification.range_offset
          - evidence.range_count == backups.restic.qualification.range_count
          - evidence.operations == ['about', 'lsjson', 'copyto', 'cat', 'moveto', 'deletefile', 'rmdir']
          - evidence.cache_invalidation == 'pass'
          - evidence.password_reauthentication == 'pass'
          - evidence.original_file_size == 'pass'
          - evidence.replace_existing_draft == 'pass'
          - evidence.remote_cleanup == 'pass'
          - evidence.trash_cleanup == 'manual-only'
          - evidence.verified_at is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - proton_qualification_run.stdout == 'proton_qualification=passed evidence_sha256=' ~ result_sha256
        fail_msg: Proton qualification result differs from the exact reviewed evidence schema.
      vars:
        evidence: "{{ proton_qualification_result.content | b64decode | from_json }}"
        result_sha256: "{{ proton_qualification_result.content | b64decode | hash('sha256') }}"
        expected_keys:
          - account_username_sha256
          - minimum_allocated_bytes
          - observed_total_bytes
          - cache_invalidation
          - fixture_bytes
          - fixture_sha256
          - free_bytes
          - operations
          - original_file_size
          - password_reauthentication
          - range_count
          - range_offset
          - remote_cleanup
          - replace_existing_draft
          - state
          - trash_cleanup
          - used_bytes
          - verified_at
          - version
      no_log: true
      when: not ansible_check_mode

    - name: Publish root-owned Proton qualification evidence on the host
      ansible.builtin.copy:
        content: "{{ proton_qualification_result.content | b64decode }}"
        dest: "{{ backups.restic.qualification.host_evidence_path }}"
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Fetch bounded Proton qualification evidence for reviewed attestation
      ansible.builtin.fetch:
        src: "{{ backups.restic.qualification.host_evidence_path }}"
        dest: "{{ playbook_dir }}/../../{{ backups.restic.qualification.evidence_file }}"
        flat: true
        validate_checksum: true
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Verify fetched evidence hash on the controller
      ansible.builtin.command:
        argv:
          - /usr/bin/shasum
          - -a
          - "256"
          - "{{ playbook_dir }}/../../{{ backups.restic.qualification.evidence_file }}"
      delegate_to: localhost
      become: false
      register: proton_qualification_fetched_hash
      changed_when: false
      when: not ansible_check_mode

    - name: Require fetched evidence to match the protected host result
      ansible.builtin.assert:
        that:
          - proton_qualification_fetched_hash.stdout.split()[0] == (proton_qualification_result.content | b64decode | hash('sha256'))
        fail_msg: Fetched Proton qualification evidence differs from the host result.
      no_log: true
      when: not ansible_check_mode

    - name: Remove only the transient user-owned qualification result
      ansible.builtin.file:
        path: "{{ backups.restic.qualification.result_path }}"
        state: absent
      become: true
      when: not ansible_check_mode

  post_tasks:
    - name: Release the shared production mutation lock after verified qualification
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_operation: proton-qualification
