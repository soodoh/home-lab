---
- name: Preserve reviewed Offen archive generations outside active pruning
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  force_handlers: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Require exact additive archive-preservation approval
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - offen_archive_preservation_confirmed | default(false) | bool
          - offen_archive_preservation_confirmation | default('') == 'copy-both-offen-generations-to-protected-replicas'
          - backups.legacy_offen.scheduler_state == 'active'
          - backups.legacy_offen.migration_archive_preservation.state == 'planned'
          - backups.legacy_offen.migration_archive_preservation.protected_subdirectory == '.migration-preserved-offen'
          - backups.legacy_offen.migration_archive_preservation.replica_roots == ['/mnt/games/backups', '/mnt/storage/backups']
          - backups.legacy_offen.migration_archive_preservation.archives | length == 2
          - backups.legacy_offen.migration_archive_preservation.verified_at is none
        fail_msg: The additive Offen archive-preservation action requires its exact planned contract and confirmation.

    - name: Acquire the shared production mutation lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: offen-archive-preservation
  tasks:
    - name: Inspect exact backup mount identities before archive preservation
      ansible.builtin.command:
        argv: [/usr/bin/findmnt, --json, --target, "{{ item.mountpoint }}", --output, "TARGET,SOURCE,FSTYPE,UUID"]
      loop:
        - mountpoint: "{{ backups.restic.repositories.games.mountpoint }}"
          filesystem: "{{ backups.restic.repositories.games.filesystem }}"
          filesystem_uuid: "{{ backups.restic.repositories.games.filesystem_uuid }}"
          mount_source: ""
        - mountpoint: "{{ backups.restic.repositories.nfs.mountpoint }}"
          filesystem: "{{ backups.restic.repositories.nfs.filesystem }}"
          filesystem_uuid: ""
          mount_source: "{{ backups.restic.repositories.nfs.mount_source }}"
      register: offen_preservation_findmnt
      changed_when: false
      check_mode: false

    - name: Require exact backup mount identities before archive preservation
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json).filesystems | length == 1
          - (item.stdout | from_json).filesystems[0].target == item.item.mountpoint
          - (item.stdout | from_json).filesystems[0].fstype == item.item.filesystem
          - item.item.filesystem_uuid | length == 0 or (item.stdout | from_json).filesystems[0].uuid == item.item.filesystem_uuid
          - item.item.mount_source | length == 0 or (item.stdout | from_json).filesystems[0].source == item.item.mount_source
      loop: "{{ offen_preservation_findmnt.results }}"
      loop_control:
        label: "{{ item.item.mountpoint }}"

    - name: Inspect free bytes on each protected replica filesystem
      ansible.builtin.command:
        argv: [/usr/bin/df, --output=avail, --block-size=1, "{{ item }}"]
      loop: "{{ backups.legacy_offen.migration_archive_preservation.replica_roots }}"
      register: offen_preservation_capacity
      changed_when: false
      check_mode: false

    - name: Require capacity for independent protected copies
      ansible.builtin.assert:
        that:
          - item.stdout_lines[-1] | trim | int >= (backups.legacy_offen.migration_archive_preservation.archives | map(attribute='bytes') | sum)
        fail_msg: "Insufficient free bytes for protected Offen copies under {{ item.item }}."
      loop: "{{ offen_preservation_capacity.results }}"
      loop_control:
        label: "{{ item.item }}"
    - name: Inspect Offen scheduler process inventories before archive preservation
      ansible.builtin.command:
        argv: [/usr/bin/docker, top, "{{ item }}", -eo, "pid,comm"]
      loop: "{{ backups.legacy_offen.scheduler_services }}"
      register: offen_preservation_processes
      changed_when: false
      check_mode: false

    - name: Require no active Offen backup child before archive preservation
      ansible.builtin.assert:
        that:
          - item.stdout_lines | length == 2
          - item.stdout_lines[1].split() | length == 2
          - item.stdout_lines[1].split()[1] == 'backup'
        fail_msg: "An Offen scheduler has an unexpected child process; a backup may be active in {{ item.item }}."
      loop: "{{ offen_preservation_processes.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Acquire each Offen scheduler internal lock during archive preservation
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - exec
          - --detach
          - "{{ item }}"
          - /usr/bin/flock
          - --exclusive
          - --nonblock
          - /var/lock/dockervolumebackup.lock
          - /bin/sh
          - -c
          - "echo $$ > /tmp/.offen-archive-preservation-lock.pid; exec /bin/sleep 1800"
      loop: "{{ backups.legacy_offen.scheduler_services }}"
      changed_when: true
      check_mode: false
      failed_when: false
      notify: Release Offen internal preservation locks

    - name: Recheck preservation locks immediately before the bounded copy
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && /usr/bin/docker top {{ item | quote }} -eo pid,comm |
          /usr/bin/awk 'NR > 1 { print $2 }' | /usr/bin/sort
        executable: /bin/bash
      loop: "{{ backups.legacy_offen.scheduler_services }}"
      register: offen_preservation_locked_processes
      changed_when: false
      check_mode: false

    - name: Require exact preservation lock ownership with no backup child
      ansible.builtin.assert:
        that:
          - item.stdout_lines == ['backup', 'flock', 'sleep']
        fail_msg: "The Offen internal scheduler lock was not acquired exclusively in {{ item.item }}."
      loop: "{{ offen_preservation_locked_processes.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Create and verify independent protected archive copies
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          created=0
          subdirectory={{ backups.legacy_offen.migration_archive_preservation.protected_subdirectory | quote }}
          {% for root in backups.legacy_offen.migration_archive_preservation.replica_roots %}
          root={{ root | quote }}
          test -d "$root" && test ! -L "$root"
          protected="$root/$subdirectory"
          if test -e "$protected"; then
            test -d "$protected" && test ! -L "$protected"
            test "$(/usr/bin/stat -c '%u:%g:%a' "$protected")" = '0:0:700'
          else
            /usr/bin/install -d -o root -g root -m 0700 -- "$protected"
          fi
          {% for archive in backups.legacy_offen.migration_archive_preservation.archives %}
          source="$root"/{{ archive.basename | quote }}
          destination="$protected"/{{ archive.basename | quote }}
          expected_bytes={{ archive.bytes | quote }}
          expected_sha256={{ archive.sha256 | quote }}
          test -f "$source" && test ! -L "$source"
          test "$(/usr/bin/stat -c '%u:%g:%a:%h:%s' "$source")" = "0:0:600:1:$expected_bytes"
          test "$(/usr/bin/sha256sum "$source" | /usr/bin/cut -d' ' -f1)" = "$expected_sha256"
          if test -e "$destination"; then
            test -f "$destination" && test ! -L "$destination"
            test "$(/usr/bin/stat -c '%u:%g:%a:%h:%s' "$destination")" = "0:0:600:1:$expected_bytes"
            test "$(/usr/bin/sha256sum "$destination" | /usr/bin/cut -d' ' -f1)" = "$expected_sha256"
          else
            temporary="$protected/.{{ archive.basename }}.partial.$$"
            trap '/usr/bin/rm -f -- "$temporary"' EXIT
            /usr/bin/cp --reflink=never -- "$source" "$temporary"
            /usr/bin/chown root:root "$temporary"
            /usr/bin/chmod 0600 "$temporary"
            test "$(/usr/bin/stat -c '%u:%g:%a:%h:%s' "$temporary")" = "0:0:600:1:$expected_bytes"
            test "$(/usr/bin/sha256sum "$temporary" | /usr/bin/cut -d' ' -f1)" = "$expected_sha256"
            /usr/bin/mv -n -- "$temporary" "$destination"
            test ! -e "$temporary"
            trap - EXIT
            created=$((created + 1))
          fi
          test "$(/usr/bin/sha256sum "$source" | /usr/bin/cut -d' ' -f1)" = "$expected_sha256"
          {% endfor %}
          {% endfor %}
          printf 'offen_archive_preservation=verified created=%s copies=4\n' "$created"
        executable: /bin/bash
      register: offen_preservation_copy
      changed_when: "'created=0' not in offen_preservation_copy.stdout"
      check_mode: false
      async: 1200
      poll: 5

    - name: Release internal preservation locks on the success path
      ansible.builtin.meta: flush_handlers

    - name: Inspect Offen scheduler process inventories after lock release
      ansible.builtin.command:
        argv: [/usr/bin/docker, top, "{{ item }}", -eo, "pid,comm"]
      loop: "{{ backups.legacy_offen.scheduler_services }}"
      register: offen_preservation_processes_after
      changed_when: false
      check_mode: false
      until: offen_preservation_processes_after.stdout_lines | length == 2
      retries: 5
      delay: 1

    - name: Require exact Offen scheduler process inventories after lock release
      ansible.builtin.assert:
        that:
          - item.stdout_lines | length == 2
          - item.stdout_lines[1].split() | length == 2
          - item.stdout_lines[1].split()[1] == 'backup'
        fail_msg: "The preservation lock did not release cleanly in {{ item.item }}."
      loop: "{{ offen_preservation_processes_after.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Report exact protected archive preservation result
      ansible.builtin.debug:
        msg: "{{ offen_preservation_copy.stdout_lines[-1] }}"
  handlers:
    - name: Release Offen internal preservation locks
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - exec
          - "{{ item }}"
          - /bin/sh
          - -c
          - >-
            set -eu;
            file=/tmp/.offen-archive-preservation-lock.pid;
            if ! test -e "$file"; then exit 0; fi;
            test -f "$file" && test ! -L "$file";
            pid=$(cat "$file");
            case "$pid" in ''|*[!0-9]*) exit 1;; esac;
            test "$(cat "/proc/$pid/comm")" = sleep;
            kill "$pid";
            rm -f -- "$file"
      loop: "{{ backups.legacy_offen.scheduler_services }}"
      changed_when: true
      listen: Release Offen internal preservation locks
  post_tasks:
    - name: Release the shared production mutation lock after verified preservation
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_operation: offen-archive-preservation
