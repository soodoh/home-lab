---
- name: Configure native Z-Wave backups without exposing network keys
  hosts: docker-host
  gather_facts: true
  gather_subset: ['!all', min]
  any_errors_fatal: true
  vars:
    radio_backup_settings:
      storeBackup: true
      storeCron: '0 4 * * *'
      storeKeep: 7
      nvmBackup: true
      nvmCron: '15 4 * * *'
      nvmKeep: 7
      nvmBackupOnEvent: true
  pre_tasks:
    - name: Require separate approval for private radio settings and the short Z-Wave restart
      ansible.builtin.assert:
        that: ansible_check_mode or radio_backups_apply_confirmed | default(false) | bool
        quiet: true
    - name: Observe the managed Compose project
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe
    - name: Acquire production ownership
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: radio-backup-configuration
  tasks:
    - name: Inspect the adopted radio store metadata
      ansible.builtin.stat:
        path: /srv/home-lab-state/zwave-data
        follow: false
        get_checksum: false
        get_mime: false
      register: radio_store_metadata
      become: true
    - name: Require the adopted non-writable store identity before hardening
      ansible.builtin.assert:
        that:
          - radio_store_metadata.stat.isdir | default(false)
          - not (radio_store_metadata.stat.islnk | default(false))
          - radio_store_metadata.stat.uid == 1000
          - radio_store_metadata.stat.gid == 1000
          - radio_store_metadata.stat.mode in ['0700', '0750', '0755']
        quiet: true
    - name: Inspect native settings metadata without hashing private values
      ansible.builtin.stat:
        path: /srv/home-lab-state/zwave-data/settings.json
        follow: false
        get_checksum: false
        get_mime: false
      register: radio_settings_metadata
      become: true
    - name: Require the adopted regular settings identity before hardening
      ansible.builtin.assert:
        that:
          - radio_settings_metadata.stat.isreg | default(false)
          - not (radio_settings_metadata.stat.islnk | default(false))
          - radio_settings_metadata.stat.nlink == 1
          - radio_settings_metadata.stat.uid == 1000
          - radio_settings_metadata.stat.gid == 1000
          - radio_settings_metadata.stat.mode in ['0600', '0640', '0644']
        quiet: true
    - name: Inspect any unresolved radio configuration before-image before mutation
      ansible.builtin.stat:
        path: /var/lib/home-lab-restic/radio-settings-before.json
        follow: false
        get_checksum: false
        get_mime: false
      register: radio_before
      become: true
    - name: Refuse an unresolved before-image before hardening or stopping its writer
      ansible.builtin.assert:
        that: not radio_before.stat.exists
        quiet: true
    - name: Protect the store including future native backup and settings replacements
      ansible.builtin.file:
        path: /srv/home-lab-state/zwave-data
        state: directory
        owner: '1000'
        group: '1000'
        mode: '0700'
      become: true
    - name: Protect adopted settings without changing their contents or ownership
      ansible.builtin.file:
        path: /srv/home-lab-state/zwave-data/settings.json
        owner: '1000'
        group: '1000'
        mode: '0600'
      become: true
    - name: Read native settings privately
      ansible.builtin.slurp:
        src: /srv/home-lab-state/zwave-data/settings.json
      register: radio_current
      no_log: true
      become: true
    - name: Determine whether native backup settings differ
      ansible.builtin.set_fact:
        radio_changed: >-
          {{ ((radio_current.content | b64decode | from_json).backup | default({}) |
              combine(radio_backup_settings)) !=
             (radio_current.content | b64decode | from_json).backup | default({}) }}
    - name: Report the native backup schedule change
      ansible.builtin.debug:
        msg: "Native Z-Wave backup schedule requires restart: {{ radio_changed }}"
    - name: Update only when the schedule differs
      when: radio_changed and not ansible_check_mode
      block:
        - name: Stop the native writer without starting an intentionally stopped container
          ansible.builtin.command:
            argv: [docker, inspect, --format, '{{ "{{.State.Running}}" }}', zwave]
          register: radio_running
          changed_when: false
          become: true
        - name: Stop Z-Wave before changing settings
          ansible.builtin.command:
            argv: [docker, stop, --time, '120', zwave]
          changed_when: true
          become: true
          when: radio_running.stdout == 'true'
        - name: Reread settings after excluding its writer
          ansible.builtin.slurp:
            src: /srv/home-lab-state/zwave-data/settings.json
          register: radio_stopped
          no_log: true
          become: true
        - name: Preserve the exact stopped settings before mutation
          ansible.builtin.copy:
            content: "{{ radio_stopped.content | b64decode }}"
            dest: /var/lib/home-lab-restic/radio-settings-before.json
            owner: root
            group: root
            mode: '0600'
          no_log: true
          become: true
        - name: Merge only the backup settings using native atomic file replacement
          ansible.builtin.copy:
            content: >-
              {{ (radio_stopped.content | b64decode | from_json) |
                 combine({'backup': radio_backup_settings}, recursive=true) | to_nice_json }}
            dest: /srv/home-lab-state/zwave-data/settings.json
            mode: '0600'
            owner: '1000'
            group: '1000'
          no_log: true
          become: true
        - name: Restore the previous running state
          ansible.builtin.command:
            argv: [docker, start, zwave]
          become: true
          changed_when: true
          when: radio_running.stdout == 'true'
        - name: Verify Z-Wave resumed
          ansible.builtin.command:
            argv: [docker, inspect, --format, '{{ "{{.State.Running}}" }}', zwave]
          register: radio_resumed
          changed_when: false
          failed_when: radio_running.stdout == 'true' and radio_resumed.stdout != 'true'
          become: true
        - name: Wait for the native Home Assistant websocket listener after restart
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 3000
            state: started
            timeout: 120
          when: radio_running.stdout == 'true'
          become: true
        - name: Reassert private settings mode after native startup
          ansible.builtin.file:
            path: /srv/home-lab-state/zwave-data/settings.json
            owner: '1000'
            group: '1000'
            mode: '0600'
          become: true
        - name: Read the resumed native settings privately
          ansible.builtin.slurp:
            src: /srv/home-lab-state/zwave-data/settings.json
          register: radio_verified
          no_log: true
          become: true
        - name: Require exact merged settings readback before releasing recovery material
          ansible.builtin.assert:
            that:
              - >-
                (radio_verified.content | b64decode | from_json) ==
                ((radio_stopped.content | b64decode | from_json) |
                 combine({'backup': radio_backup_settings}, recursive=true))
            quiet: true
          no_log: true
        - name: Remove the before-image only after verified native settings and running-state recovery
          ansible.builtin.file:
            path: /var/lib/home-lab-restic/radio-settings-before.json
            state: absent
          become: true
  post_tasks:
    - name: Release production ownership only after successful configuration
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_operation: radio-backup-configuration
