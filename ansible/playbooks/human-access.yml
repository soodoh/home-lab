---
- name: Converge dedicated human access on the Docker host
  hosts: docker_host
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Require explicit approval before changing Docker human access
      ansible.builtin.assert:
        that:
          - ansible_check_mode or (human_access_apply_confirmed | default(false) | bool)
        fail_msg: "Human-access convergence requires --check or -e human_access_apply_confirmed=true."
  roles:
    - role: human_access

- name: Converge dedicated human access on the Proxmox host
  hosts: proxmox_hosts
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/proxmox_hosts.yml"
  pre_tasks:
    - name: Require explicit approval before changing Proxmox human access
      ansible.builtin.assert:
        that:
          - ansible_check_mode or (human_access_apply_confirmed | default(false) | bool)
        fail_msg: "Human-access convergence requires --check or -e human_access_apply_confirmed=true."
  roles:
    - role: human_access
