---
- name: Deploy the complete committed Compose project through native Ansible
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  pre_tasks:
    - name: Re-observe the active Compose state
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe

    - name: Acquire the durable production ownership lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: compose-native-deploy
  tasks:
    - name: Re-observe active Compose state under production ownership
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe

    - name: Archive and converge committed Compose source
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: deploy
  post_tasks:
    - name: Release exact production ownership only after complete success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: compose-native-deploy
