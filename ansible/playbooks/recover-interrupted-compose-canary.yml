---
- name: Complete the exact interrupted native Compose canary activation
  hosts: docker-host
  gather_facts: false
  any_errors_fatal: true
  vars:
    compose_interrupted_owner_sha256: 7c690c6c26290d3863c8cd1c4a101c99c33ca85de26b42b2ad0dcac3c12030c4
    compose_interrupted_active_hash: 2f12e384fdc0ce759d23b0bd9e16ad402d3ecd2985b4ecdfe048127f1c5748be
    compose_interrupted_candidate_hash: 3e5600bfa5ff9441d729e4e81634854435cea13f15568337adbc87911468569e
    compose_interrupted_older_previous_hash: 31a2fe455d849ab38d373709ee39cd6378406708c1de29e43b6e410eb21ca213
    compose_interrupted_checkpoint: >-
      /var/lib/docker-compose/deploy-3e5600bfa5ff9441d729e4e81634854435cea13f15568337adbc87911468569e-previous-images.json
    compose_interrupted_action_pattern: '^(?:flaresolverr|[0-9a-f]{12}_flaresolverr)$'
    compose_interrupted_current_lock_captured_at: '2026-08-28T08:46:41.279798+00:00'
    compose_interrupted_previous_lock_captured_at: '2026-08-28T08:46:19.999526+00:00'
    compose_interrupted_checkpoint_captured_at: '2026-09-19T19:14:22.523537+00:00'
    compose_native_backup_journal_path: "{{ restic_systemd.journal_path }}"
    compose_native_files:
      - docker-compose.yml
      - "{{ compose_native_image_override_path }}"
    compose_native_runtime_cli:
      - /usr/bin/docker
      - compose
      - --project-name
      - "{{ compose_native_project_name }}"
      - --project-directory
      - "{{ compose_native_current_dir }}"
      - --env-file
      - "{{ compose_native_runtime_env_path }}"
      - --file
      - "{{ compose_native_current_dir }}/docker-compose.yml"
      - --file
      - "{{ compose_native_image_override_path }}"
  tasks:
    - name: Validate exact forward-recovery authorization
      ansible.builtin.assert:
        that:
          - ansible_check_mode or (compose_interrupted_recovery_confirmed | default(false) | bool)
        fail_msg: >-
          The interrupted canary requires compose_interrupted_recovery_confirmed=true
          outside check mode. This play cannot recover any other owner or generation.

    - name: Inspect exact retained recovery inputs
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: "{{ item.checksum | default(false) }}"
        checksum_algorithm: sha256
        get_mime: false
      become: true
      register: compose_interrupted_paths
      loop:
        - {path: /var/lib/iac-ansible-production.lock, kind: directory, mode: "0700"}
        - {path: /var/lib/iac-ansible-production.lock/owner, kind: file, mode: "0600", checksum: true}
        - {path: "{{ compose_native_backup_lock_path }}", kind: file, mode: "0660", group: restic-proton}
        - {path: "{{ compose_native_backup_journal_path }}", kind: absent}
        - {path: "{{ compose_interrupted_checkpoint }}", kind: file, mode: "0600"}
        - {path: "{{ compose_native_current_dir }}", kind: directory, mode: "0755"}
        - {path: "{{ compose_native_previous_dir }}", kind: directory, mode: "0755"}
        - {path: "{{ compose_native_runtime_env_path }}", kind: file, mode: "0600"}
        - {path: "{{ compose_native_previous_env_path }}", kind: file, mode: "0600"}
        - {path: "{{ compose_native_current_image_lock_path }}", kind: file, mode: "0600"}
        - {path: "{{ compose_native_previous_image_lock_path }}", kind: file, mode: "0600"}
        - {path: "{{ compose_native_retained_image_root }}", kind: directory, mode: "0700"}
        - {path: "{{ compose_native_artifact_identity_path }}", kind: file, mode: "0444"}
        - path: "{{ compose_native_staging_root }}/{{ compose_interrupted_older_previous_hash }}"
          kind: directory
          mode: "0700"
        - path: "{{ compose_native_staged_env_root }}/{{ compose_interrupted_older_previous_hash }}.env"
          kind: file
          mode: "0600"
      no_log: true

    - name: Require exact retained recovery input identities
      ansible.builtin.assert:
        that:
          - >-
            (item.item.kind == 'absent' and not (item.stat.exists | default(false))) or
            (item.item.kind == 'directory' and item.stat.isdir | default(false) and
             not (item.stat.islnk | default(false)) and item.stat.pw_name == 'root' and
             item.stat.gr_name == 'root' and item.stat.mode == item.item.mode) or
            (item.item.kind == 'file' and item.stat.isreg | default(false) and
             not (item.stat.islnk | default(false)) and item.stat.nlink == 1 and
             item.stat.pw_name == 'root' and
             item.stat.gr_name == (item.item.group | default('root')) and
             item.stat.mode == item.item.mode)
        fail_msg: An exact interrupted-canary recovery input is absent or unsafe.
      loop: "{{ compose_interrupted_paths.results }}"
      no_log: true

    - name: Require the exact retained production owner
      ansible.builtin.assert:
        that:
          - compose_interrupted_paths.results[1].stat.gr_name == 'root'
          - compose_interrupted_paths.results[1].stat.checksum == compose_interrupted_owner_sha256
        fail_msg: The retained production owner differs from the interrupted canary.
      no_log: true

    - name: Recompute exact current previous and archived artifact identities
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ item }}/scripts/compose-artifact.py"
          - --root
          - "{{ item }}"
          - --no-git
          - hash
      become: true
      register: compose_interrupted_artifacts
      changed_when: false
      check_mode: false
      loop:
        - "{{ compose_native_current_dir }}"
        - "{{ compose_native_previous_dir }}"
        - "{{ compose_native_staging_root }}/{{ compose_interrupted_older_previous_hash }}"
      no_log: true

    - name: Require exact publication and rollback artifact identities
      ansible.builtin.assert:
        that:
          - compose_interrupted_artifacts.results[0].stdout == compose_interrupted_candidate_hash
          - compose_interrupted_artifacts.results[1].stdout == compose_interrupted_active_hash
          - compose_interrupted_artifacts.results[2].stdout == compose_interrupted_older_previous_hash
        fail_msg: Current previous or archived generation differs from the interrupted canary.
      no_log: true

    - name: Read the retained active-artifact marker
      ansible.builtin.slurp:
        src: "{{ compose_native_artifact_identity_path }}"
      become: true
      register: compose_interrupted_marker
      changed_when: false
      no_log: true

    - name: Require old marker and byte-identical current previous environments
      ansible.builtin.command:
        argv:
          - /usr/bin/cmp
          - --silent
          - --
          - "{{ item.left }}"
          - "{{ item.right }}"
      become: true
      changed_when: false
      check_mode: false
      loop:
        - left: "{{ compose_native_runtime_env_path }}"
          right: "{{ compose_native_previous_env_path }}"
        - left: "{{ compose_native_previous_env_path }}"
          right: "{{ compose_native_staged_env_root }}/{{ compose_interrupted_older_previous_hash }}.env"
      no_log: true

    - name: Require the unadvanced active-artifact marker
      ansible.builtin.assert:
        that:
          - compose_interrupted_marker.content | b64decode | trim == compose_interrupted_active_hash
        fail_msg: The active-artifact marker no longer identifies the pre-deployment generation.
      no_log: true

    - name: Verify exact checkpoint and previous image generations remain locally available
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_native_current_dir }}/scripts/compose-image-lock.py"
          - verify
          - --current
          - "{{ compose_interrupted_checkpoint }}"
          - --previous
          - "{{ compose_native_previous_image_lock_path }}"
          - --retained-root
          - "{{ compose_native_retained_image_root }}"
      become: true
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require semantic image-lock and archived-generation bindings
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          current = json.loads(pathlib.Path("{{ compose_native_current_image_lock_path }}").read_text())
          checkpoint = json.loads(pathlib.Path("{{ compose_interrupted_checkpoint }}").read_text())
          previous = json.loads(pathlib.Path("{{ compose_native_previous_image_lock_path }}").read_text())
          if current.get("captured_at") != "{{ compose_interrupted_current_lock_captured_at }}":
              raise SystemExit(1)
          if previous.get("captured_at") != "{{ compose_interrupted_previous_lock_captured_at }}":
              raise SystemExit(1)
          if checkpoint.get("captured_at") != "{{ compose_interrupted_checkpoint_captured_at }}":
              raise SystemExit(1)
          if current.get("project") != checkpoint.get("project") or current.get("images") != checkpoint.get("images"):
              raise SystemExit(1)

          expected = {row["reference"] for row in previous["images"]}
          command = [
              "/usr/bin/docker", "compose", "--project-name", "{{ compose_native_project_name }}",
              "--project-directory", "{{ compose_native_staging_root }}/{{ compose_interrupted_older_previous_hash }}",
              "--env-file", "{{ compose_native_staged_env_root }}/{{ compose_interrupted_older_previous_hash }}.env",
              "--file", "{{ compose_native_staging_root }}/{{ compose_interrupted_older_previous_hash }}/docker-compose.yml",
              "--file", "{{ compose_native_image_override_path }}", "config", "--images",
          ]
          actual = set(subprocess.check_output(command, text=True, stderr=subprocess.DEVNULL).splitlines())
          if actual != expected:
              raise SystemExit(1)
          PY
      environment:
        HOME: "{{ compose_native_home }}"
      become: true
      changed_when: false
      check_mode: false
      no_log: true

    - name: Recheck the backup mutex immediately before recovery preview
      ansible.builtin.command:
        argv:
          - /usr/bin/bash
          - -c
          - >-
            set -euo pipefail;
            exec 9< "$1";
            /usr/bin/flock --exclusive --nonblock 9 /usr/bin/true
          - compose-interrupted-canary-backup-lock-probe
          - "{{ compose_native_backup_lock_path }}"
      become: true
      changed_when: false
      check_mode: false
      no_log: true

    - name: List the exact declared current services
      ansible.builtin.command:
        argv: "{{ compose_native_runtime_cli + ['config', '--services'] }}"
      become: true
      environment:
        HOME: "{{ compose_native_home }}"
      register: compose_interrupted_declared_services
      changed_when: false
      check_mode: false
      no_log: true

    - name: Preview the exact interrupted replacement actions
      community.docker.docker_compose_v2:
        project_src: "{{ compose_native_current_dir }}"
        project_name: "{{ compose_native_project_name }}"
        files: "{{ compose_native_files }}"
        env_files:
          - "{{ compose_native_runtime_env_path }}"
        state: present
        pull: never
        build: never
        recreate: auto
        remove_orphans: false
        renew_anon_volumes: false
        wait: false
      become: true
      environment:
        HOME: "{{ compose_native_home }}"
      register: compose_interrupted_preview
      check_mode: true
      no_log: true

    - name: Require the exact two-action replacement boundary
      ansible.builtin.assert:
        that:
          - compose_interrupted_preview.changed
          - compose_interrupted_preview.actions | length == 2
          - compose_interrupted_preview.actions | map(attribute='what') | unique | list == ['container']
          - compose_interrupted_preview.actions | map(attribute='status') | sort == ['Recreate', 'Starting']
          - >-
            compose_interrupted_preview.actions | map(attribute='id') |
            select('match', compose_interrupted_action_pattern) | list | length == 2
          - compose_interrupted_preview.containers | length == compose_native_expected_service_count | int
        fail_msg: Live Compose actions no longer match the inspected interrupted canary.
      no_log: true

    - name: Report the exact check-mode forward-recovery boundary
      ansible.builtin.debug:
        msg:
          owner_sha256: "{{ compose_interrupted_owner_sha256 }}"
          current_hash: "{{ compose_interrupted_candidate_hash }}"
          previous_hash: "{{ compose_interrupted_active_hash }}"
          older_previous_hash: "{{ compose_interrupted_older_previous_hash }}"
          replacement_actions: 2
          recovery: dependency-aware auto convergence then native publication completion
      changed_when: true
      when: ansible_check_mode

    - name: Complete exact interrupted canary convergence and publication
      when: not ansible_check_mode
      block:
        - name: Adopt only the exact interrupted canary owner
          ansible.builtin.import_role:
            name: apply_lock
          vars:
            apply_lock_action: adopt
            apply_lock_path: "{{ compose_native_apply_lock_path }}"
            apply_lock_backup_guard_path: "{{ compose_native_backup_lock_path }}"
            apply_lock_operation: compose-native-canary
            apply_lock_expected_owner_sha256: "{{ compose_interrupted_owner_sha256 }}"

        - name: Settle the exact canary through dependency-aware auto convergence
          community.docker.docker_compose_v2:
            project_src: "{{ compose_native_current_dir }}"
            project_name: "{{ compose_native_project_name }}"
            files: "{{ compose_native_files }}"
            env_files:
              - "{{ compose_native_runtime_env_path }}"
            services:
              - flaresolverr
            dependencies: true
            state: present
            pull: never
            build: never
            recreate: auto
            remove_orphans: false
            renew_anon_volumes: false
            wait: true
            wait_timeout: "{{ compose_native_wait_timeout }}"
          become: true
          environment:
            HOME: "{{ compose_native_home }}"
          no_log: true

        - name: Require a zero-change complete project preview
          community.docker.docker_compose_v2:
            project_src: "{{ compose_native_current_dir }}"
            project_name: "{{ compose_native_project_name }}"
            files: "{{ compose_native_files }}"
            env_files:
              - "{{ compose_native_runtime_env_path }}"
            state: present
            pull: never
            build: never
            recreate: auto
            remove_orphans: false
            renew_anon_volumes: false
            wait: false
          become: true
          environment:
            HOME: "{{ compose_native_home }}"
          register: compose_interrupted_final_preview
          check_mode: true
          no_log: true

        - name: Assert exact project idempotence after recovery convergence
          ansible.builtin.assert:
            that:
              - not compose_interrupted_final_preview.changed
              - compose_interrupted_final_preview.containers | length == compose_native_expected_service_count | int
            fail_msg: The complete Compose project remains non-idempotent after recovery convergence.
          no_log: true

        - name: List running services after recovery convergence
          ansible.builtin.command:
            argv: "{{ compose_native_runtime_cli + ['ps', '--status', 'running', '--services'] }}"
          become: true
          environment:
            HOME: "{{ compose_native_home }}"
          register: compose_interrupted_running
          changed_when: false
          no_log: true

        - name: Require the complete running service set
          ansible.builtin.assert:
            that:
              - compose_interrupted_running.stdout_lines | length == compose_native_expected_service_count | int
              - compose_interrupted_running.stdout_lines | sort == compose_interrupted_declared_services.stdout_lines | sort
            fail_msg: The complete running service set was not preserved.
          no_log: true

        - name: Verify required healthy containers after recovery
          ansible.builtin.command:
            argv:
              - /usr/bin/docker
              - inspect
              - --format
              - "{% raw %}{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}{% endraw %}"
              - "{{ item }}"
          become: true
          register: compose_interrupted_health
          loop: "{{ compose_native_required_healthy_containers }}"
          changed_when: false
          retries: 30
          delay: 10
          until: compose_interrupted_health.stdout == 'healthy'
          no_log: true

        - name: Verify the recovered canary remains running
          ansible.builtin.command:
            argv:
              - /usr/bin/docker
              - inspect
              - --format
              - "{% raw %}{{.State.Status}}{% endraw %}"
              - flaresolverr
          become: true
          register: compose_interrupted_canary_state
          changed_when: false
          retries: 30
          delay: 10
          until: compose_interrupted_canary_state.stdout == 'running'
          no_log: true

        - name: Archive the exact older previous image generation
          ansible.builtin.copy:
            src: "{{ compose_native_previous_image_lock_path }}"
            dest: "{{ compose_native_retained_image_root }}/{{ compose_interrupted_older_previous_hash }}.json"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
            force: false
          become: true
          no_log: true

        - name: Require the archived older previous image generation to match
          ansible.builtin.command:
            argv:
              - /usr/bin/cmp
              - --silent
              - --
              - "{{ compose_native_previous_image_lock_path }}"
              - "{{ compose_native_retained_image_root }}/{{ compose_interrupted_older_previous_hash }}.json"
          become: true
          changed_when: false
          no_log: true

        - name: Preserve pre-deployment current images under the old active artifact
          ansible.builtin.copy:
            src: "{{ compose_interrupted_checkpoint }}"
            dest: "{{ compose_native_retained_image_root }}/{{ compose_interrupted_active_hash }}.json"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
            force: false
          become: true
          no_log: true

        - name: Require the retained old active image generation to match
          ansible.builtin.command:
            argv:
              - /usr/bin/cmp
              - --silent
              - --
              - "{{ compose_interrupted_checkpoint }}"
              - "{{ compose_native_retained_image_root }}/{{ compose_interrupted_active_hash }}.json"
          become: true
          changed_when: false
          no_log: true

        - name: Publish the checkpoint as the previous image generation
          ansible.builtin.copy:
            src: "{{ compose_interrupted_checkpoint }}"
            dest: "{{ compose_native_previous_image_lock_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          become: true
          no_log: true

        - name: Capture the converged current image generation
          ansible.builtin.command:
            argv:
              - "{{ ansible_python_interpreter }}"
              - "{{ compose_native_current_dir }}/scripts/compose-image-lock.py"
              - capture
              - --project
              - "{{ compose_native_project_name }}"
              - --output
              - "{{ compose_native_current_image_lock_path }}"
          become: true
          changed_when: true
          no_log: true

        - name: Verify current previous and retained image generations
          ansible.builtin.command:
            argv:
              - "{{ ansible_python_interpreter }}"
              - "{{ compose_native_current_dir }}/scripts/compose-image-lock.py"
              - verify
              - --current
              - "{{ compose_native_current_image_lock_path }}"
              - --previous
              - "{{ compose_native_previous_image_lock_path }}"
              - --retained-root
              - "{{ compose_native_retained_image_root }}"
          become: true
          changed_when: false
          no_log: true

        - name: Publish the exact active candidate artifact identity
          ansible.builtin.copy:
            content: "{{ compose_interrupted_candidate_hash }}\n"
            dest: "{{ compose_native_artifact_identity_path }}"
            owner: root
            group: root
            mode: "0444"
          become: true
          no_log: true

        - name: Remove the consumed interruption checkpoint after complete success
          ansible.builtin.file:
            path: "{{ compose_interrupted_checkpoint }}"
            state: absent
          become: true
          no_log: true

        - name: Release only the exact interrupted canary owner
          ansible.builtin.import_role:
            name: apply_lock
          vars:
            apply_lock_action: release
            apply_lock_path: "{{ compose_native_apply_lock_path }}"
            apply_lock_backup_guard_path: "{{ compose_native_backup_lock_path }}"
            apply_lock_operation: compose-native-canary
            apply_lock_expected_owner_sha256: "{{ compose_interrupted_owner_sha256 }}"

        - name: Report successful exact forward recovery
          ansible.builtin.debug:
            msg:
              active_hash: "{{ compose_interrupted_candidate_hash }}"
              previous_hash: "{{ compose_interrupted_active_hash }}"
              older_previous_hash: "{{ compose_interrupted_older_previous_hash }}"
              running_services: "{{ compose_interrupted_running.stdout_lines | length }}"
              database_migration_performed: false
              restic_activation_performed: false
