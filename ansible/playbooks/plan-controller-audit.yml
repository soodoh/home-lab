---
- name: Audit the automatic-plan controller privilege boundary
  hosts: docker_host
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  vars:
    plan_user_expected_helper_checksum: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../roles/plan_controller/files/iac-read-docker-version', rstrip=false)
         | hash('sha256') }}
    plan_user_expected_sudoers_checksum: "{{ plan_user_sudoers_content | hash('sha256') }}"
  tasks:
    - name: Inspect the automatic-plan password lock
      ansible.builtin.command:
        argv:
          - /usr/bin/passwd
          - --status
          - "{{ plan_user_name }}"
      become: true
      register: plan_user_audit_password
      changed_when: false
      check_mode: false

    - name: Inspect the automatic-plan group membership
      ansible.builtin.command:
        argv:
          - /usr/bin/id
          - --name
          - --groups
          - "{{ plan_user_name }}"
      register: plan_user_audit_groups
      changed_when: false
      check_mode: false

    - name: Inspect the automatic-plan policy files
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
      become: true
      loop:
        - "{{ plan_user_sudoers_path }}"
        - "{{ plan_user_docker_version_helper }}"
      register: plan_user_audit_files

    - name: Validate the automatic-plan sudoers syntax
      ansible.builtin.command:
        argv:
          - /usr/sbin/visudo
          - --check
          - "--file={{ plan_user_sudoers_path }}"
      become: true
      changed_when: false
      check_mode: false

    - name: Run the fixed helper as the automatic-plan user
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - "--user={{ plan_user_name }}"
          - --
          - /usr/bin/sudo
          - --non-interactive
          - --
          - "{{ plan_user_docker_version_helper }}"
      become: true
      register: plan_user_audit_helper
      changed_when: false
      check_mode: false

    - name: Confirm broad passwordless sudo remains denied
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - "--user={{ plan_user_name }}"
          - --
          - /usr/bin/sudo
          - --non-interactive
          - --
          - /usr/bin/true
      become: true
      register: plan_user_audit_broad_sudo
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Confirm helper arguments are denied by sudoers
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - "--user={{ plan_user_name }}"
          - --
          - /usr/bin/sudo
          - --non-interactive
          - --
          - "{{ plan_user_docker_version_helper }}"
          - unexpected
      become: true
      register: plan_user_audit_helper_argument
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Confirm direct Docker access remains denied
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - "--user={{ plan_user_name }}"
          - --
          - /usr/bin/docker
          - info
      become: true
      register: plan_user_audit_direct_docker
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Inspect the effective automatic-plan sudo commands
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - --list
          - "--other-user={{ plan_user_name }}"
      become: true
      register: plan_user_audit_sudo_list
      changed_when: false
      check_mode: false

    - name: Assert the automatic-plan controller boundary
      ansible.builtin.assert:
        that:
          - plan_user_audit_password.stdout.split()[1] == 'L'
          - plan_user_audit_groups.stdout.split() | sort == [plan_user_name]
          - plan_user_audit_files.results[0].stat.exists
          - plan_user_audit_files.results[0].stat.pw_name == 'root'
          - plan_user_audit_files.results[0].stat.gr_name == 'root'
          - plan_user_audit_files.results[0].stat.mode == '0440'
          - plan_user_audit_files.results[0].stat.checksum == plan_user_expected_sudoers_checksum
          - plan_user_audit_files.results[1].stat.exists
          - plan_user_audit_files.results[1].stat.pw_name == 'root'
          - plan_user_audit_files.results[1].stat.gr_name == 'root'
          - plan_user_audit_files.results[1].stat.mode == '0755'
          - plan_user_audit_files.results[1].stat.checksum == plan_user_expected_helper_checksum
          - plan_user_audit_helper.stdout == audit_expected_docker_client_version ~ '|' ~ audit_expected_docker_server_version
          - plan_user_audit_broad_sudo.rc != 0
          - plan_user_audit_helper_argument.rc != 0
          - plan_user_audit_helper_argument.rc != 64
          - plan_user_audit_direct_docker.rc != 0
          - plan_user_audit_sudo_list.stdout_lines | select('search', 'NOPASSWD:') | list | length == 1
          - >-
            plan_user_audit_sudo_list.stdout_lines
            | select('search', 'NOPASSWD:')
            | select('search', plan_user_docker_version_helper)
            | list
            | length == 1
        fail_msg: >-
          The automatic-plan account, file content, groups, Docker access, or sudo boundary differs from the approved state.
