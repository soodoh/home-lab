---
- name: Install the inert Proxmox firewall transaction boundary
  hosts: proxmox_hosts
  gather_facts: true
  any_errors_fatal: true
  force_handlers: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/proxmox_hosts.yml"
  pre_tasks:
    - name: Require the exact Proxmox host and explicit firewall install approval
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.virtualization_role != 'guest'
          - ansible_facts.hostname == proxmox.node
          - lookup('ansible.builtin.env', 'PROXMOX_FIREWALL_SSH_PUBLIC_KEYS') | trim | length > 0
          - ansible_check_mode or (proxmox_firewall_install_confirmed | default(false) | bool)
          - ansible_check_mode or (proxmox_ssh_access_proven | default(false) | bool)
        fail_msg: >-
          Firewall transaction installation requires the intended host, a protected firewall key,
          explicit approval, and separately proven SSH access.

    - name: Verify the Proxmox installation before any host mutation
      ansible.builtin.command:
        argv:
          - /usr/bin/pveversion
      changed_when: false
      check_mode: false

    - name: Acquire the shared host-side mutation lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: proxmox-firewall-install

  roles:
    - role: proxmox_firewall

  tasks:
    - name: Install only the firewall transaction service identity
      ansible.builtin.include_role:
        name: proxmox_host
        tasks_from: service-accounts
      vars:
        proxmox_host_selected_service_accounts: >-
          {{ proxmox_service_accounts | selectattr('name', 'equalto', 'firewall-apply') | list }}

    - name: Admit the closed firewall identity through OpenSSH
      ansible.builtin.include_role:
        name: ssh
      vars:
        ssh_service_name: "{{ proxmox.ssh.service }}"
        ssh_host_key_sentinel_path: "{{ proxmox.ssh.host_key_sentinel.path }}"
        ssh_host_key_sentinel_owner: "{{ proxmox.ssh.host_key_sentinel.owner }}"
        ssh_host_key_sentinel_group: "{{ proxmox.ssh.host_key_sentinel.group }}"
        ssh_host_key_sentinel_mode: "{{ proxmox.ssh.host_key_sentinel.mode }}"
        ssh_config_path: "{{ proxmox.ssh.config_file.path }}"
        ssh_config_owner: "{{ proxmox.ssh.config_file.owner }}"
        ssh_config_group: "{{ proxmox.ssh.config_file.group }}"
        ssh_config_mode: "{{ proxmox.ssh.config_file.mode }}"
        ssh_pubkey_authentication: "{{ proxmox.ssh.pubkey_authentication }}"
        ssh_password_authentication: "{{ proxmox.ssh.password_authentication }}"
        ssh_kbd_interactive_authentication: "{{ proxmox.ssh.kbd_interactive_authentication }}"
        ssh_permit_root_login: "{{ proxmox.ssh.permit_root_login }}"
        ssh_access_proven: "{{ proxmox_ssh_access_proven | default(false) }}"
        ssh_allow_users: "{{ proxmox.ssh.allow_users }}"

  post_tasks:
    - name: Release the shared host-side mutation lock after success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
