---
- name: Execute one separately approved LiteLLM observation or config transaction
  # Target admission precedes inventory batching and even implicit SETUP task selection.
  hosts: >-
    {{ lookup('ansible.builtin.pipe', ([ansible_playbook_python, '-I', '-B',
    playbook_dir + '/../../scripts/litellm-deployment.py', 'validate-bundle', '--phase', 'target',
    '--workspace', litellm_bundle, '--known-hosts',
    lookup('ansible.builtin.env', 'HOME_LAB_DEBIAN_PRODUCTION_KNOWN_HOSTS'),
    '--overrides', ((['litellm_workspace'] if litellm_workspace is defined else []) +
    (['litellm_argv'] if litellm_argv is defined else []) +
    (['litellm_output'] if litellm_output is defined else []) +
    (['litellm_source'] if litellm_source is defined else [])) | to_json,
    '--transport', ({
    'host': ansible_host, 'user': ansible_user,
    'connection': ansible_connection | default('ssh'), 'port': ansible_port,
    'ssh_executable': ansible_ssh_executable, 'ssh_args': ansible_ssh_args,
    'ssh_common_args': ansible_ssh_common_args, 'ssh_extra_args': ansible_ssh_extra_args,
    'sftp_extra_args': ansible_sftp_extra_args, 'scp_extra_args': ansible_scp_extra_args,
    'private_key_file': ansible_private_key_file, 'password': ansible_password,
    'retries': ansible_ssh_retries, 'host_key_checking': ansible_host_key_checking,
    'ssh_host_key_checking': ansible_ssh_host_key_checking,
    'become': ansible_become, 'become_method': ansible_become_method,
    'become_user': ansible_become_user, 'become_exe': ansible_become_exe,
    'become_flags': ansible_become_flags, 'python_interpreter': ansible_python_interpreter,
    'transfer_method': ansible_ssh_transfer_method,
    'shell_type': ansible_shell_type, 'shell_executable': ansible_shell_executable,
    'use_tty': ansible_ssh_use_tty, 'pipelining': ansible_pipelining,
    'ssh_pipelining': ansible_ssh_pipelining, 'facts_modules': ansible_facts_modules,
    'check_mode': ansible_check_mode, 'inventory_hostname': 'docker-host-production',
    'legacy': {
    'host': ansible_ssh_host | default('docker-host'),
    'user': ansible_ssh_user | default('ansible-deploy'),
    'port': ansible_ssh_port | default(22),
    'key': ansible_ssh_private_key_file | default(''),
    'password': ansible_ssh_pass | default(''),
    'become_password': ansible_become_password | default(''),
    'become_pass': ansible_become_pass | default(''),
    'sudo_exe': ansible_sudo_exe | default('/usr/bin/sudo'),
    'sudo_flags': ansible_sudo_flags | default('-H -S -n'),
    'sudo_user': ansible_sudo_user | default('root'),
    'sudo_pass': ansible_sudo_pass | default('')}} | to_json)] | map('quote') | join(' '))) }}
  gather_facts: false
  any_errors_fatal: true
  connection: ssh
  vars:
    # Play values outrank inventory; extra-vars remain visible to both admission gates.
    ansible_host: docker-host
    ansible_user: ansible-deploy
    ansible_connection: ssh
    ansible_python_interpreter: /usr/bin/python3
    ansible_become: true
    ansible_become_method: sudo
    ansible_ssh_host: docker-host
    ansible_ssh_user: ansible-deploy
    ansible_ssh_port: 22
    ansible_ssh_private_key_file: ''
    ansible_ssh_pass: ''
    ansible_become_password: ''
    ansible_become_pass: ''
    ansible_sudo_exe: /usr/bin/sudo
    ansible_sudo_flags: -H -S -n
    ansible_sudo_user: root
    ansible_sudo_pass: ''
    ansible_ssh_common_args: >-
      -F /dev/null
      -o BatchMode=yes
      -o StrictHostKeyChecking=yes
      -o GlobalKnownHostsFile=/dev/null
      -o UpdateHostKeys=no
      -o UserKnownHostsFile={{ lookup('ansible.builtin.env', 'HOME_LAB_DEBIAN_PRODUCTION_KNOWN_HOSTS') }}
      -o IdentityAgent=none
      -o IdentityFile=none
      -o IdentitiesOnly=yes
      -o PreferredAuthentications=none
      -o PubkeyAuthentication=no
      -o PasswordAuthentication=no
      -o KbdInteractiveAuthentication=no
      -o GSSAPIAuthentication=no
      -o ClearAllForwardings=yes
      -o PermitLocalCommand=no
      -o ConnectTimeout=10
      -o ServerAliveInterval=15
      -o ServerAliveCountMax=2
      -o RequestTTY=no
    # Explicit plugin variables override ambient ansible.cfg/environment defaults.
    # Extra-vars still win: the controller validator rejects any changed effective value.
    # Ansible --start-at-first-task can replay SETUP despite gather_facts: false.
    ansible_facts_modules: []
    ansible_port: 22
    ansible_ssh_executable: /usr/bin/ssh
    ansible_ssh_args: -o ControlMaster=no -o ControlPath=none
    ansible_ssh_extra_args: ''
    ansible_sftp_extra_args: ''
    ansible_scp_extra_args: ''
    ansible_private_key_file: ''
    ansible_password: ''
    ansible_ssh_retries: 0
    ansible_host_key_checking: true
    ansible_ssh_host_key_checking: true
    ansible_ssh_transfer_method: piped
    ansible_shell_type: sh
    ansible_shell_executable: /bin/sh
    ansible_ssh_use_tty: false
    ansible_pipelining: true
    ansible_ssh_pipelining: true
    ansible_become_user: root
    ansible_become_exe: /usr/bin/sudo
    ansible_become_flags: -H -S -n
  roles:
    - role: litellm_deploy
