---
- name: Complete the exact interrupted Jellyfin LDAP Compose publication
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  vars:
    jellyfin_ldap_recovery_base_commit: be14411
    jellyfin_ldap_recovery_owner_sha256: 1be8a12b91bf30bf6be759068ca8b231c84852a3c8da0b4516f84ac283567b76
    jellyfin_ldap_recovery_original_artifact: e15090e2ae7088b5daffde931981ccf3f0a11c3c4b0b0af06bc07657c86fb210
    jellyfin_ldap_recovery_published_artifact: 0ecafe6da030d526538df56ccb0e35e6c66e44aaa64a6c8b459b1bfad0a05822
    jellyfin_ldap_recovery_candidate_artifact: 4add9f19c96e2b3cf14367bc3c5adcc842ee8d3bfdcd5f658fe40c909ac3959d
    jellyfin_ldap_recovery_playbook: ansible/playbooks/recover-jellyfin-ldap-compose.yml
  pre_tasks:
    - name: Inspect the exact controller recovery source boundary
      ansible.builtin.shell: |
        set -euo pipefail
        test "$(/usr/bin/git status --porcelain=v1 --untracked-files=no)" = ""
        /usr/bin/git merge-base --is-ancestor "{{ jellyfin_ldap_recovery_base_commit }}" HEAD
        actual_changes=$(/usr/bin/git diff --name-only "{{ jellyfin_ldap_recovery_base_commit }}"..HEAD)
        expected_changes=$(/usr/bin/printf '%s\n' \
          'ansible/inventory/host_vars/docker-host.yml' \
          '{{ jellyfin_ldap_recovery_playbook }}' \
          'ansible/playbooks/site.yml' \
          'ansible/roles/compose_native/defaults/main.yml' \
          'ansible/roles/compose_native/tasks/deploy.yml' \
          'ansible/roles/compose_native/tasks/generation.yml' \
          'ansible/roles/compose_native/tasks/observe.yml' \
          'scripts/test-compose-native.py' \
          'services/apps.yml')
        test "$actual_changes" = "$expected_changes"
        test "$(
          {{ ansible_playbook_python }} scripts/compose-artifact.py --root . hash
        )" = "{{ jellyfin_ldap_recovery_candidate_artifact }}"
      args:
        chdir: "{{ playbook_dir }}/../.."
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false

    - name: Inspect the retained owner and unpublished candidate boundary
      ansible.builtin.shell: |
        set -euo pipefail
        lock={{ compose_native_apply_lock_path | quote }}
        owner="$lock/owner"
        test "$(stat --format='%U:%G:%a:%F' -- "$lock")" = 'root:root:700:directory'
        test "$(stat --format='%U:%G:%a:%h:%F' -- "$owner")" = 'root:root:600:1:regular file'
        test "$(find "$lock" -mindepth 1 -maxdepth 1 -printf x | wc -c)" -eq 1
        test "$(sha256sum "$owner" | cut --delimiter=' ' --fields=1)" = "{{ jellyfin_ldap_recovery_owner_sha256 }}"
        grep --fixed-strings --line-regexp 'controller={{ ansible_user }}' "$owner" >/dev/null
        grep --fixed-strings --line-regexp 'operation=native-site-convergence' "$owner" >/dev/null
        test "$(grep --extended-regexp --count '^started=[0-9]{4}-[0-9]{2}-[0-9]{2}T' "$owner")" -eq 1
        test "$(cat {{ compose_native_artifact_identity_path | quote }})" = "{{ jellyfin_ldap_recovery_original_artifact }}"
        test "$(
          {{ ansible_python_interpreter }} {{ compose_native_current_dir | quote }}/scripts/compose-artifact.py \
            --root {{ compose_native_current_dir | quote }} --no-git hash
        )" = "{{ jellyfin_ldap_recovery_published_artifact }}"
        published={{ compose_native_staging_root | quote }}/{{ jellyfin_ldap_recovery_published_artifact }}
        published_env={{ compose_native_staged_env_root | quote }}/{{ jellyfin_ldap_recovery_published_artifact }}.env
        test "$(
          {{ ansible_python_interpreter }} "$published/scripts/compose-artifact.py" \
            --root "$published" --no-git hash
        )" = "{{ jellyfin_ldap_recovery_published_artifact }}"
        test "$(stat --format='%U:%G:%a:%h:%F' -- "$published_env")" = 'root:root:600:1:regular file'
        cmp --silent -- "$published_env" {{ compose_native_runtime_env_path | quote }}
        original={{ (compose_native_deployment_root ~ '/.before-' ~ jellyfin_ldap_recovery_original_artifact) | quote }}
        original_env={{ ((compose_native_runtime_env_path | dirname) ~ '/.before-' ~ jellyfin_ldap_recovery_original_artifact ~ '.env') | quote }}
        test "$(
          {{ ansible_python_interpreter }} "$original/scripts/compose-artifact.py" \
            --root "$original" --no-git hash
        )" = "{{ jellyfin_ldap_recovery_original_artifact }}"
        test "$(stat --format='%U:%G:%a:%h:%F' -- "$original_env")" = 'root:root:600:1:regular file'
        test ! -e {{ (compose_native_deployment_root ~ '/.before-' ~ jellyfin_ldap_recovery_published_artifact) | quote }}
        test ! -e {{ ((compose_native_runtime_env_path | dirname) ~ '/.before-' ~ jellyfin_ldap_recovery_published_artifact ~ '.env') | quote }}
        candidate={{ compose_native_staging_root | quote }}/{{ jellyfin_ldap_recovery_candidate_artifact }}
        candidate_env={{ compose_native_staged_env_root | quote }}/{{ jellyfin_ldap_recovery_candidate_artifact }}.env
        if test -e "$candidate"; then
          test "$(
            {{ ansible_python_interpreter }} "$candidate/scripts/compose-artifact.py" \
              --root "$candidate" --no-git hash
          )" = "{{ jellyfin_ldap_recovery_candidate_artifact }}"
        else
          test ! -e "$candidate_env"
        fi
        if test -e "$candidate_env"; then
          test "$(stat --format='%U:%G:%a:%h:%F' -- "$candidate_env")" = 'root:root:600:1:regular file'
        fi
        docker network inspect docker-compose_jellyfin-auth >/dev/null
        test "$(docker inspect authentik-ldap | {{ ansible_python_interpreter }} -c \
          'import json,sys; print(json.load(sys.stdin)[0]["State"]["Status"])')" = created
        test "$(docker inspect authentik-ldap | {{ ansible_python_interpreter }} -c \
          'import json,sys; print(json.load(sys.stdin)[0]["Config"]["Image"])')" = \
          'ghcr.io/goauthentik/ldap:2026.8.3@sha256:7114c560be4e24dc61080fe5bd7684cf0ebf4b0a6230a8247943ffa8957b73d4'
        test ! -e {{ compose_native_backup_journal_path | quote }}
        flock --exclusive --nonblock -- {{ compose_native_backup_lock_path | quote }} /bin/true
        for unit in {{ compose_native_backup_writer_units | join(' ') }}; do
          test "$(systemctl show --property=ActiveState --value "$unit")" = inactive
        done
        for container in jellyfin authentik-server authentik-postgres; do
          test "$(docker inspect "$container" | {{ ansible_python_interpreter }} -c \
            'import json,sys; print(json.load(sys.stdin)[0]["State"]["Health"]["Status"])')" = healthy
        done
      args:
        executable: /bin/bash
      become: true
      changed_when: false
      check_mode: false
      no_log: true

    - name: List the active declared services without rendering configuration
      ansible.builtin.command:
        argv: "{{ compose_native_runtime_cli + ['config', '--services'] }}"
      become: true
      environment:
        HOME: "{{ compose_native_home }}"
      register: compose_native_declared_services
      changed_when: false
      check_mode: false
      no_log: true

    - name: Adopt only the exact interrupted native site owner
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: adopt
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: native-site-convergence
        apply_lock_expected_owner_sha256: "{{ jellyfin_ldap_recovery_owner_sha256 }}"

  tasks:
    - name: Complete the exact committed Compose generation
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: deploy
      vars:
        compose_native_authoritative_reconcile: true
        compose_native_apply_confirmed: true
        compose_native_environment_change_confirmed: true
        compose_native_expected_service_additions: []
        compose_native_expected_network_additions: []
        compose_native_expected_protected_service_changes:
          - jellyfin:volumes

  post_tasks:
    - name: Verify the retained original before-images before consuming them
      ansible.builtin.shell: |
        set -euo pipefail
        original={{ (compose_native_deployment_root ~ '/.before-' ~ jellyfin_ldap_recovery_original_artifact) | quote }}
        original_env={{ ((compose_native_runtime_env_path | dirname) ~ '/.before-' ~ jellyfin_ldap_recovery_original_artifact ~ '.env') | quote }}
        test "$(
          {{ ansible_python_interpreter }} "$original/scripts/compose-artifact.py" \
            --root "$original" --no-git hash
        )" = "{{ jellyfin_ldap_recovery_original_artifact }}"
        test "$(stat --format='%U:%G:%a:%h:%F' -- "$original_env")" = 'root:root:600:1:regular file'
        test "$(cat {{ compose_native_artifact_identity_path | quote }})" = "{{ jellyfin_ldap_recovery_candidate_artifact }}"
      args:
        executable: /bin/bash
      become: true
      changed_when: false
      no_log: true

    - name: Remove the consumed original before-images after complete convergence
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - "{{ compose_native_deployment_root }}/.before-{{ jellyfin_ldap_recovery_original_artifact }}"
        - "{{ compose_native_runtime_env_path | dirname }}/.before-{{ jellyfin_ldap_recovery_original_artifact }}.env"
      no_log: true

    - name: Release only the adopted owner after complete convergence
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: native-site-convergence
        apply_lock_expected_owner_sha256: "{{ jellyfin_ldap_recovery_owner_sha256 }}"

- name: Verify the recovered native Docker host state
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  tasks:
    - name: Observe final coordination and active Compose state
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe
      when: not ansible_check_mode
