---
- name: Guardedly transition legacy Offen backup schedulers
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Require an exact Offen scheduler transition approval
      ansible.builtin.assert:
        that:
          - offen_scheduler_action | default('') in ['quiesce', 'resume']
          - offen_scheduler_transition_confirmed | default(false) | bool
          - >-
            (offen_scheduler_action == 'quiesce' and
             offen_scheduler_transition_confirmation | default('') == 'stop-offen-keep-definitions-and-archives' and
             backups.legacy_offen.scheduler_state == 'quiesced') or
            (offen_scheduler_action == 'resume' and
             offen_scheduler_transition_confirmation | default('') == 'resume-offen-existing-definitions' and
             backups.legacy_offen.scheduler_state == 'active')
          - >-
            offen_scheduler_action == 'resume' or
            (backups.legacy_offen.migration_retention_hold.state == 'applied' and
             backups.legacy_offen.migration_retention_hold.current_object_retention_days >= 365 and
             offen_scheduler_expected_aws_hold_plan_sha256 | default('') == backups.legacy_offen.migration_retention_hold.plan_sha256 and
             (offen_scheduler_expected_recovery_object_version_id_sha256 | default('')) ==
             backups.legacy_offen.migration_retention_hold.recovery_object_version_id_sha256)
          - >-
            offen_scheduler_action == 'resume' or
            (backups.legacy_offen.migration_retention_hold.verified_at <= now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') and
             backups.legacy_offen.migration_retention_hold.review_deadline > now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'))
          - >-
            offen_scheduler_action == 'resume' or
            (((backups.legacy_offen.migration_retention_hold.review_deadline |
               to_datetime('%Y-%m-%dT%H:%M:%SZ')) -
              (backups.legacy_offen.migration_retention_hold.verified_at |
               to_datetime('%Y-%m-%dT%H:%M:%SZ'))).total_seconds() > 0 and
             ((backups.legacy_offen.migration_retention_hold.review_deadline |
               to_datetime('%Y-%m-%dT%H:%M:%SZ')) -
              (backups.legacy_offen.migration_retention_hold.verified_at |
               to_datetime('%Y-%m-%dT%H:%M:%SZ'))).total_seconds() <= 2592000)
        fail_msg: The Offen transition requires its exact action, contract state, and confirmation.

    - name: Acquire the shared production mutation lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: "offen-scheduler-{{ offen_scheduler_action }}"
  tasks:
    - name: Inspect exact backup mount identities before scheduler transition
      ansible.builtin.command:
        argv: [/usr/bin/findmnt, --json, --target, "{{ item.mountpoint }}", --output, "TARGET,SOURCE,FSTYPE,UUID"]
      loop:
        - mountpoint: "{{ backups.restic.repositories.games.mountpoint }}"
          filesystem: "{{ backups.restic.repositories.games.filesystem }}"
          filesystem_uuid: "{{ backups.restic.repositories.games.filesystem_uuid }}"
          mount_source: ""
        - mountpoint: "{{ backups.restic.repositories.nfs.mountpoint }}"
          filesystem: "{{ backups.restic.repositories.nfs.filesystem }}"
          filesystem_uuid: ""
          mount_source: "{{ backups.restic.repositories.nfs.mount_source }}"
      register: offen_transition_mounts
      changed_when: false
      check_mode: false

    - name: Require exact backup mount identities before scheduler transition
      ansible.builtin.assert:
        that:
          - observed | length == 1
          - observed[0].target == item.item.mountpoint
          - observed[0].fstype == item.item.filesystem
          - item.item.filesystem_uuid | length == 0 or observed[0].uuid == item.item.filesystem_uuid
          - item.item.mount_source | length == 0 or observed[0].source == item.item.mount_source
        fail_msg: Refusing Offen transition without the exact contract backup mount.
      loop: "{{ offen_transition_mounts.results }}"
      vars:
        observed: "{{ (item.stdout | from_json).filesystems }}"

    - name: Require both exact Offen archive replicas before scheduler transition
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          expected_bytes={{ backups.legacy_offen.final_archive.bytes | quote }}
          expected_sha256={{ backups.legacy_offen.final_archive.sha256 | quote }}
          {% for root in backups.legacy_offen.final_archive.replica_paths %}
          path={{ (root ~ '/' ~ backups.legacy_offen.final_archive.basename) | quote }}
          test -f "$path" && test ! -L "$path"
          test "$(/usr/bin/stat -c '%u:%g:%a:%h:%s' "$path")" = "0:0:600:1:$expected_bytes"
          test "$(/usr/bin/sha256sum "$path" | /usr/bin/cut -d' ' -f1)" = "$expected_sha256"
          {% endfor %}
      args:
        executable: /bin/bash
      changed_when: false
      check_mode: false

    - name: Capture complete bounded backup-root inventories before transition
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          {% for root in backups.legacy_offen.local_paths %}
          /usr/bin/find {{ root | quote }} -xdev -mindepth 1 \
            -printf '%P|%y|%s|%U|%G|%m|%T@\0' |
            /usr/bin/sort --zero-terminated |
            /usr/bin/sha256sum | /usr/bin/cut -d' ' -f1
          {% endfor %}
        executable: /bin/bash
      register: offen_transition_inventory_before
      changed_when: false
      check_mode: false

    - name: Require no concurrent Restic or rclone operation
      ansible.builtin.command:
        argv: [/usr/bin/pgrep, --exact, "{{ item }}"]
      loop: [restic, rclone]
      register: offen_transition_backup_processes
      changed_when: false
      failed_when: offen_transition_backup_processes.rc != 1
      check_mode: false

    - name: List services declared by the active Compose artifact
      ansible.builtin.command:
        argv: "{{ compose_runtime_cli + ['config', '--services'] }}"
      environment:
        HOME: "{{ compose_home_dir }}"
      register: offen_transition_declared_services
      changed_when: false
      check_mode: false

    - name: List all materialized services from the active Compose project
      ansible.builtin.command:
        argv: "{{ compose_runtime_cli + ['ps', '--all', '--services'] }}"
      environment:
        HOME: "{{ compose_home_dir }}"
      register: offen_transition_materialized_services
      changed_when: false
      check_mode: false

    - name: List running services from the active Compose project
      ansible.builtin.command:
        argv: "{{ compose_runtime_cli + ['ps', '--status', 'running', '--services'] }}"
      environment:
        HOME: "{{ compose_home_dir }}"
      register: offen_transition_running_services
      changed_when: false
      check_mode: false

    - name: Require exact declared, materialized, and non-Offen running service sets
      ansible.builtin.assert:
        that:
          - backups.legacy_offen.scheduler_services | difference(offen_transition_declared_services.stdout_lines) | length == 0
          - offen_transition_declared_services.stdout_lines | length == audit_expected_compose_service_count
          - offen_transition_materialized_services.stdout_lines | sort == offen_transition_declared_services.stdout_lines | sort
          - >-
            (offen_transition_declared_services.stdout_lines | difference(backups.legacy_offen.scheduler_services) |
             difference(offen_transition_running_services.stdout_lines) | length) == 0
          - >-
            (offen_transition_declared_services.stdout_lines | difference(offen_transition_running_services.stdout_lines) |
             difference(backups.legacy_offen.scheduler_services) | length) == 0
        fail_msg: Declared, materialized, or non-Offen running services differ before scheduler transition.

    - name: Inspect current Offen scheduler container states
      ansible.builtin.command:
        argv: [/usr/bin/docker, inspect, --format, "{{ '{{.State.Running}}' }}", "{{ item }}"]
      loop: "{{ backups.legacy_offen.scheduler_services }}"
      register: offen_transition_states_before
      changed_when: false
      check_mode: false

    - name: Require valid Offen scheduler states before transition
      ansible.builtin.assert:
        that:
          - item.stdout in ['true', 'false']
        fail_msg: An Offen scheduler container has an invalid runtime state.
      loop: "{{ offen_transition_states_before.results }}"

    - name: Record whether the exact scheduler transition is required
      ansible.builtin.set_fact:
        offen_transition_required: >-
          {{
            ('true' in (offen_transition_states_before.results | map(attribute='stdout') | list))
            if offen_scheduler_action == 'quiesce'
            else
            ('false' in (offen_transition_states_before.results | map(attribute='stdout') | list))
          }}

    - name: Require a complete source-state audit before an initial Offen quiescence
      ansible.builtin.import_role:
        name: audit
      vars:
        audit_expected_stopped_compose_services: []
        audit_expected_running_compose_service_count: "{{ audit_expected_compose_service_count }}"
      when:
        - offen_scheduler_action == 'quiesce'
        - "'false' not in (offen_transition_states_before.results | map(attribute='stdout') | list)"

    - name: Inspect running Offen scheduler process inventories
      ansible.builtin.command:
        argv: [/usr/bin/docker, top, "{{ item.item }}", -eo, "pid,comm"]
      loop: "{{ offen_transition_states_before.results }}"
      register: offen_transition_process_inventories
      changed_when: false
      check_mode: false
      when:
        - offen_scheduler_action == 'quiesce'
        - offen_transition_required | bool
        - item.stdout == 'true'

    - name: Refuse to stop an Offen scheduler with an active child process
      ansible.builtin.assert:
        that:
          - item.stdout_lines | length == 2
          - item.stdout_lines[1].split() | length == 2
          - item.stdout_lines[1].split()[1] == 'backup'
        fail_msg: An Offen scheduler has an unexpected child process; a backup may be active.
      loop: "{{ offen_transition_process_inventories.results }}"
      when:
        - offen_scheduler_action == 'quiesce'
        - offen_transition_required | bool
        - not (item.skipped | default(false))

    - name: Acquire each running Offen scheduler internal lock until container stop
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - exec
          - --detach
          - "{{ item.item }}"
          - /usr/bin/flock
          - --exclusive
          - --nonblock
          - /var/lock/dockervolumebackup.lock
          - /bin/sleep
          - "900"
      loop: "{{ offen_transition_states_before.results }}"
      changed_when: true
      when:
        - not ansible_check_mode
        - offen_scheduler_action == 'quiesce'
        - offen_transition_required | bool
        - item.stdout == 'true'

    - name: Inspect scheduler process sets while internal locks are held
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && /usr/bin/docker top {{ item.item | quote }} -eo pid,comm |
          /usr/bin/awk 'NR > 1 { print $2 }' | /usr/bin/sort
        executable: /bin/bash
      loop: "{{ offen_transition_states_before.results }}"
      register: offen_transition_locked_processes
      changed_when: false
      when:
        - not ansible_check_mode
        - offen_scheduler_action == 'quiesce'
        - offen_transition_required | bool
        - item.stdout == 'true'

    - name: Require exact scheduler lock ownership with no backup child
      ansible.builtin.assert:
        that:
          - item.stdout_lines == ['backup', 'flock', 'sleep']
        fail_msg: The Offen internal scheduler lock was not acquired exclusively.
      loop: "{{ offen_transition_locked_processes.results }}"
      when:
        - not ansible_check_mode
        - offen_scheduler_action == 'quiesce'
        - offen_transition_required | bool
        - not (item.skipped | default(false))

    - name: Report the exact scheduler transition during check mode
      ansible.builtin.debug:
        msg: "Would {{ offen_scheduler_action }} exactly {{ backups.legacy_offen.scheduler_services | join(', ') }} without deleting definitions or archives."
      changed_when: true
      when:
        - ansible_check_mode
        - offen_transition_required | bool

    - name: Apply the exact Offen scheduler transition
      ansible.builtin.command:
        argv: >-
          {{ compose_runtime_cli +
             ([('stop' if offen_scheduler_action == 'quiesce' else 'start')]) +
             backups.legacy_offen.scheduler_services }}
      environment:
        HOME: "{{ compose_home_dir }}"
      changed_when: true
      when:
        - not ansible_check_mode
        - offen_transition_required | bool

    - name: Inspect Offen scheduler container states after transition
      ansible.builtin.command:
        argv: [/usr/bin/docker, inspect, --format, "{{ '{{.State.Running}}' }}", "{{ item }}"]
      loop: "{{ backups.legacy_offen.scheduler_services }}"
      register: offen_transition_states_after
      changed_when: false
      check_mode: false

    - name: Require the exact Offen scheduler target state
      ansible.builtin.assert:
        that:
          - >-
            ansible_check_mode or
            (offen_scheduler_action == 'quiesce' and item.stdout == 'false') or
            (offen_scheduler_action == 'resume' and item.stdout == 'true')
        fail_msg: Offen scheduler transition did not reach the exact contract state.
      loop: "{{ offen_transition_states_after.results }}"

    - name: Verify the contract Compose health baseline after transition
      ansible.builtin.import_role:
        name: health

    - name: Reverify both exact Offen archive replicas after scheduler transition
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          expected_bytes={{ backups.legacy_offen.final_archive.bytes | quote }}
          expected_sha256={{ backups.legacy_offen.final_archive.sha256 | quote }}
          {% for root in backups.legacy_offen.final_archive.replica_paths %}
          path={{ (root ~ '/' ~ backups.legacy_offen.final_archive.basename) | quote }}
          test -f "$path" && test ! -L "$path"
          test "$(/usr/bin/stat -c '%u:%g:%a:%h:%s' "$path")" = "0:0:600:1:$expected_bytes"
          test "$(/usr/bin/sha256sum "$path" | /usr/bin/cut -d' ' -f1)" = "$expected_sha256"
          {% endfor %}
      args:
        executable: /bin/bash
      changed_when: false
      check_mode: false

    - name: Capture complete bounded backup-root inventories after transition
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          {% for root in backups.legacy_offen.local_paths %}
          /usr/bin/find {{ root | quote }} -xdev -mindepth 1 \
            -printf '%P|%y|%s|%U|%G|%m|%T@\0' |
            /usr/bin/sort --zero-terminated |
            /usr/bin/sha256sum | /usr/bin/cut -d' ' -f1
          {% endfor %}
        executable: /bin/bash
      register: offen_transition_inventory_after
      changed_when: false
      check_mode: false

    - name: Require backup-root-wide non-deletion and metadata preservation
      ansible.builtin.assert:
        that:
          - offen_transition_inventory_after.stdout_lines == offen_transition_inventory_before.stdout_lines
        fail_msg: A backup-root entry changed during the Offen scheduler transition.
  post_tasks:
    - name: Release the shared production mutation lock after verified transition
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_operation: "offen-scheduler-{{ offen_scheduler_action }}"
