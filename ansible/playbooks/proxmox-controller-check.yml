---
- name: Check the exact locked Proxmox controller observation
  hosts: proxmox_host
  gather_facts: false
  become: false
  any_errors_fatal: true
  tags: [audit]
  tasks:
    - name: Require the fixed audit-only scope
      ansible.builtin.assert:
        that:
          - ansible_check_mode
          - ansible_run_tags | length == 1
          - ansible_run_tags | first == 'audit'
          - ansible_connection == 'local'
          - inventory_hostname == 'proxmox-host-production'
          - lifecycle_contract_host == 'proxmox'
          - lifecycle_profile == 'production'
        fail_msg: "Fixed audit scope required; selected={{ ansible_run_tags }}"
    - name: Independently audit the locked observation against the direct contract
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/../../scripts/controller/proxmox-ansible-audit.js"
          - --artifact-dir
          - "{{ lookup('ansible.builtin.env', 'RECONCILE_PROXMOX_CHECK_ARTIFACT') }}"
          - --observation
          - "{{ lookup('ansible.builtin.env', 'RECONCILE_PROXMOX_CHECK_OBSERVATION') }}"
      check_mode: false
      changed_when: false
      no_log: true
