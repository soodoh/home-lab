---
- name: Install and qualify Jellyfin LDAP authentication without changing user providers
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  vars:
    jellyfin_ldap_plugin_version: 24.0.0.0
    jellyfin_ldap_plugin_id: 958aad66-3784-4d2a-b89a-a7b6fab6e25c
    jellyfin_ldap_plugin_url: >-
      https://repo.jellyfin.org/releases/plugin/ldap-authentication/ldap-authentication_24.0.0.0.zip
    jellyfin_ldap_plugin_md5: 1e34d0e48336187922622c35d938380c
    jellyfin_ldap_plugin_dir: >-
      /srv/home-lab-state/jellyfin-data/config/plugins/LDAP Authentication_24.0.0.0
    jellyfin_ldap_base_dn: dc=jellyfin,dc=ldap,dc=diloreto,dc=com
    jellyfin_ldap_bind_dn: >-
      cn=jellyfin-ldap-bind,ou=users,dc=jellyfin,dc=ldap,dc=diloreto,dc=com
    jellyfin_ldap_user_filter: >-
      (memberOf=cn=Jellyfin,ou=groups,dc=jellyfin,dc=ldap,dc=diloreto,dc=com)
    jellyfin_ldap_backup_root: >-
      /srv/home-lab-state/jellyfin-upgrades/ldap-migration-{{ ansible_date_time.iso8601_basic_short }}
    jellyfin_ldap_lock_action: acquire
    jellyfin_ldap_expected_owner_sha256: ""
  pre_tasks:
    - name: Validate the exact LDAP migration inputs
      ansible.builtin.assert:
        that:
          - jellyfin_ldap_plugin_version == '24.0.0.0'
          - jellyfin_ldap_plugin_id == '958aad66-3784-4d2a-b89a-a7b6fab6e25c'
          - jellyfin_ldap_plugin_md5 is match('^[0-9a-f]{32}$')
          - jellyfin_ldap_lock_action in ['acquire', 'adopt']
          - >-
            jellyfin_ldap_lock_action == 'acquire'
            or jellyfin_ldap_expected_owner_sha256 is match('^[0-9a-f]{64}$')
          - compose_native_expected_service_count | int == 39
        fail_msg: Jellyfin LDAP migration inputs are not exact.

    - name: Require a clean committed controller source
      ansible.builtin.shell: |
        set -euo pipefail
        test "$(/usr/bin/git status --porcelain=v1 --untracked-files=no)" = ""
        test -n "$(/usr/bin/git rev-parse HEAD)"
      args:
        chdir: "{{ playbook_dir }}/../.."
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false

    - name: Acquire or adopt exact production ownership for Jellyfin LDAP migration
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: "{{ jellyfin_ldap_lock_action }}"
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: jellyfin-ldap-plugin-migration
        apply_lock_expected_owner_sha256: "{{ jellyfin_ldap_expected_owner_sha256 }}"

    - name: Require the converged LDAP outpost and Jellyfin boundary
      ansible.builtin.shell: |
        set -euo pipefail
        test "$(cat {{ compose_native_artifact_identity_path | quote }})" = \
          '4add9f19c96e2b3cf14367bc3c5adcc842ee8d3bfdcd5f658fe40c909ac3959d'
        test "$(
          {{ ansible_python_interpreter }} {{ compose_native_current_dir | quote }}/scripts/compose-artifact.py \
            --root {{ compose_native_current_dir | quote }} --no-git hash
        )" = '4add9f19c96e2b3cf14367bc3c5adcc842ee8d3bfdcd5f658fe40c909ac3959d'
        test "$(docker inspect jellyfin | {{ ansible_python_interpreter }} -c \
          'import json,sys; print(json.load(sys.stdin)[0]["State"]["Health"]["Status"])')" = healthy
        test "$(docker inspect authentik-ldap | {{ ansible_python_interpreter }} -c \
          'import json,sys; print(json.load(sys.stdin)[0]["State"]["Status"])')" = running
        test "$(docker compose \
          --project-name {{ compose_native_project_name | quote }} \
          --project-directory {{ compose_native_current_dir | quote }} \
          --env-file {{ compose_native_runtime_env_path | quote }} \
          --file {{ (compose_native_current_dir ~ '/docker-compose.yml') | quote }} \
          ps --services --status running | wc -l)" -eq 39
      args:
        executable: /bin/bash
      become: true
      changed_when: false
      no_log: true

  tasks:
    - name: Stage the checksum-pinned official LDAP plugin package
      ansible.builtin.get_url:
        url: "{{ jellyfin_ldap_plugin_url }}"
        dest: /var/tmp/jellyfin-ldap-authentication-24.0.0.0.zip
        checksum: "md5:{{ jellyfin_ldap_plugin_md5 }}"
        owner: root
        group: root
        mode: "0600"
      become: true

    - name: Stop back up and atomically install the LDAP plugin
      block:
        - name: Stop Jellyfin for a consistent authentication rollback backup
          ansible.builtin.command:
            argv:
              - /usr/bin/docker
              - stop
              - --time
              - "60"
              - jellyfin
          become: true
          changed_when: true

        - name: Preserve the exact pre-LDAP Jellyfin database and authentication configuration
          ansible.builtin.shell: |
            set -euo pipefail
            backup={{ jellyfin_ldap_backup_root | quote }}
            test ! -e "$backup"
            install -d -o root -g root -m 0700 "$backup"
            cp --archive --reflink=auto \
              /srv/home-lab-state/jellyfin-data/config/data/jellyfin.db \
              "$backup/jellyfin.db"
            for suffix in -shm -wal; do
              source=/srv/home-lab-state/jellyfin-data/config/data/jellyfin.db$suffix
              if test -e "$source"; then
                cp --archive --reflink=auto "$source" "$backup/jellyfin.db$suffix"
              fi
            done
            cp --archive --reflink=auto \
              /srv/home-lab-state/jellyfin-data/config/config \
              "$backup/config"
            cp --archive --reflink=auto \
              /srv/home-lab-state/jellyfin-data/config/plugins \
              "$backup/plugins"
            find "$backup" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$backup/SHA256SUMS"
            chmod 0600 "$backup/SHA256SUMS"
          args:
            executable: /bin/bash
          become: true
          changed_when: true
          no_log: true

        - name: Inspect an existing LDAP plugin directory
          ansible.builtin.stat:
            path: "{{ jellyfin_ldap_plugin_dir }}"
            follow: false
            get_checksum: false
            get_mime: false
          become: true
          register: jellyfin_ldap_plugin_path

        - name: Require an existing LDAP plugin path to be a real directory
          ansible.builtin.assert:
            that:
              - not (jellyfin_ldap_plugin_path.stat.exists | default(false))
                or (jellyfin_ldap_plugin_path.stat.isdir | default(false))
              - not (jellyfin_ldap_plugin_path.stat.islnk | default(false))
            fail_msg: Existing LDAP plugin path is not a real directory.

        - name: Create a private LDAP plugin extraction directory
          ansible.builtin.tempfile:
            state: directory
            path: /srv/home-lab-state/jellyfin-data/config/plugins
            prefix: .ldap-authentication-
          become: true
          register: jellyfin_ldap_plugin_incoming
          when: not (jellyfin_ldap_plugin_path.stat.exists | default(false))

        - name: Extract the official LDAP plugin into its private incoming directory
          ansible.builtin.unarchive:
            src: /var/tmp/jellyfin-ldap-authentication-24.0.0.0.zip
            dest: "{{ jellyfin_ldap_plugin_incoming.path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          become: true
          when: not (jellyfin_ldap_plugin_path.stat.exists | default(false))

        - name: Set the incoming LDAP plugin directory identity
          ansible.builtin.file:
            path: "{{ jellyfin_ldap_plugin_incoming.path }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          become: true
          when: not (jellyfin_ldap_plugin_path.stat.exists | default(false))

        - name: Verify the exact LDAP plugin file set and bytes
          ansible.builtin.shell: |
            set -euo pipefail
            plugin={{ (jellyfin_ldap_plugin_incoming.path | default(jellyfin_ldap_plugin_dir)) | quote }}
            test "$(find "$plugin" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)" = \
              $'LDAP-Auth.dll\nNovell.Directory.Ldap.NETStandard.dll\nmeta.json'
            echo '79b5d443a3ef3da9dff79a3a7df5620804b39d8e590f756b074b679e85c800cf  LDAP-Auth.dll' | \
              (cd "$plugin" && sha256sum --check --status)
            echo '85918b6f9e91acffac9bd081b70404b0456c7a6f0c9c5666ccda8951bd8120d4  Novell.Directory.Ldap.NETStandard.dll' | \
              (cd "$plugin" && sha256sum --check --status)
            echo '950cd855fefebd90153613e34cf413643010dc6f765d3829b97664c23e1ab2c4  meta.json' | \
              (cd "$plugin" && sha256sum --check --status)
          args:
            executable: /bin/bash
          become: true
          changed_when: false

        - name: Atomically publish the LDAP plugin directory
          ansible.builtin.command:
            argv:
              - /usr/bin/mv
              - --no-target-directory
              - --
              - "{{ jellyfin_ldap_plugin_incoming.path }}"
              - "{{ jellyfin_ldap_plugin_dir }}"
          become: true
          changed_when: true
          when: not (jellyfin_ldap_plugin_path.stat.exists | default(false))
      always:
        - name: Remove an unpublished LDAP plugin extraction directory
          ansible.builtin.file:
            path: "{{ jellyfin_ldap_plugin_incoming.path | default('/nonexistent-ldap-plugin-incoming') }}"
            state: absent
          become: true
          when:
            - jellyfin_ldap_plugin_incoming.path | default('') | length > 0
            - jellyfin_ldap_plugin_incoming.path != jellyfin_ldap_plugin_dir

        - name: Start Jellyfin after the bounded plugin installation attempt
          ansible.builtin.command:
            argv:
              - /usr/bin/docker
              - start
              - jellyfin
          become: true
          changed_when: true

        - name: Wait for Jellyfin health after plugin loading
          ansible.builtin.command:
            argv:
              - /usr/bin/docker
              - inspect
              - --format
              - "{% raw %}{{.State.Health.Status}}{% endraw %}"
              - jellyfin
          become: true
          register: jellyfin_ldap_health
          changed_when: false
          retries: 60
          delay: 5
          until: jellyfin_ldap_health.stdout == 'healthy'

    - name: Remove the staged LDAP plugin package
      ansible.builtin.file:
        path: /var/tmp/jellyfin-ldap-authentication-24.0.0.0.zip
        state: absent
      become: true

    - name: Read the existing Jellyfin API key only into memory
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - -c
          - >-
            import sqlite3;
            c=sqlite3.connect('file:/srv/home-lab-state/jellyfin-data/config/data/jellyfin.db?mode=ro',uri=True);
            rows=c.execute('select AccessToken from ApiKeys').fetchall();
            assert len(rows)==1 and isinstance(rows[0][0],str) and len(rows[0][0])>=32;
            print(rows[0][0])
      become: true
      register: jellyfin_api_key
      changed_when: false
      no_log: true

    - name: Discover the private Jellyfin API endpoint
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - --format
          - "{% raw %}{{range .NetworkSettings.Networks}}{{.IPAddress}}{{\"\\n\"}}{{end}}{% endraw %}"
          - jellyfin
      become: true
      register: jellyfin_private_addresses
      changed_when: false
      no_log: true

    - name: Select one exact private Jellyfin API address
      ansible.builtin.set_fact:
        jellyfin_api_url: "http://{{ jellyfin_private_addresses.stdout_lines | first }}:8096"
      no_log: true

    - name: Require the compatible LDAP plugin to be loaded
      ansible.builtin.uri:
        url: "{{ jellyfin_api_url }}/Plugins"
        method: GET
        headers:
          X-Emby-Token: "{{ jellyfin_api_key.stdout }}"
        return_content: true
        status_code: 200
      register: jellyfin_plugins
      no_log: true

    - name: Start the loaded LDAP plugin record
      ansible.builtin.set_fact:
        jellyfin_ldap_plugin_record: {}
      no_log: true

    - name: Select the loaded LDAP plugin record
      ansible.builtin.set_fact:
        jellyfin_ldap_plugin_record: "{{ item }}"
      loop: "{{ jellyfin_plugins.json }}"
      when: (item.Id | default(item.id)) == jellyfin_ldap_plugin_id
      no_log: true

    - name: Require exact loaded LDAP plugin compatibility
      ansible.builtin.assert:
        that:
          - jellyfin_ldap_plugin_record | length > 0
          - >-
            (jellyfin_ldap_plugin_record.Version |
             default(jellyfin_ldap_plugin_record.version)) == jellyfin_ldap_plugin_version
        fail_msg: Jellyfin did not load the exact LDAP Authentication 24.0.0.0 plugin.
      no_log: true

    - name: Create a root-only encrypted-input workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: jellyfin-ldap-configuration-
      become: true
      register: jellyfin_ldap_secret_workspace

    - name: Configure and test LDAP without exposing managed credentials
      block:
        - name: Transfer only the encrypted managed LDAP credential file
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../infrastructure/tofu/authentik/client-secrets.sops.json"
            dest: "{{ jellyfin_ldap_secret_workspace.path }}/client-secrets.sops.json"
            owner: root
            group: root
            mode: "0600"
          become: true

        - name: Decrypt the managed LDAP credential only in memory
          ansible.builtin.command:
            argv:
              - /usr/local/bin/sops
              - --decrypt
              - "{{ jellyfin_ldap_secret_workspace.path }}/client-secrets.sops.json"
          become: true
          environment:
            SOPS_AGE_KEY_FILE: "{{ compose_native_age_identity_path }}"
          register: jellyfin_ldap_secrets
          changed_when: false
          no_log: true

        - name: Hold the LDAP bind password without logging it
          ansible.builtin.set_fact:
            jellyfin_ldap_bind_password: >-
              {{ (jellyfin_ldap_secrets.stdout | from_json).ldap.bind_password }}
          no_log: true

        - name: Read the current LDAP plugin configuration
          ansible.builtin.uri:
            url: "{{ jellyfin_api_url }}/Plugins/{{ jellyfin_ldap_plugin_id }}/Configuration"
            method: GET
            headers:
              X-Emby-Token: "{{ jellyfin_api_key.stdout }}"
            return_content: true
            status_code: 200
          register: jellyfin_ldap_current_configuration
          no_log: true

        - name: Build the exact safe LDAP plugin configuration
          ansible.builtin.set_fact:
            jellyfin_ldap_configuration: >-
              {{ jellyfin_ldap_current_configuration.json | combine({
                'LdapServer': 'authentik-ldap',
                'LdapPort': 6636,
                'UseSsl': true,
                'UseStartTls': false,
                'SkipSslVerify': false,
                'LdapBindUser': jellyfin_ldap_bind_dn,
                'LdapBindPassword': jellyfin_ldap_bind_password,
                'LdapBaseDn': jellyfin_ldap_base_dn,
                'LdapSearchFilter': jellyfin_ldap_user_filter,
                'LdapAdminBaseDn': '',
                'LdapAdminFilter': '_disabled_',
                'EnableLdapAdminFilterMemberUid': false,
                'LdapSearchAttributes': 'cn, mail',
                'LdapClientCertPath': '',
                'LdapClientKeyPath': '',
                'LdapRootCaPath': '/etc/ssl/certs/authentik-ldap.pem',
                'CreateUsersFromLdap': false,
                'AllowPassChange': false,
                'LdapUidAttribute': 'uid',
                'LdapUsernameAttribute': 'cn',
                'LdapPasswordAttribute': 'userPassword',
                'EnableLdapProfileImageSync': false,
                'RemoveImagesNotInLdap': false,
                'EnableAllFolders': false,
                'EnabledFolders': [],
                'PasswordResetUrl': 'https://auth.diloreto.com'
              }, recursive=true) }}
          no_log: true

        - name: Save the exact safe LDAP plugin configuration
          ansible.builtin.uri:
            url: "{{ jellyfin_api_url }}/Plugins/{{ jellyfin_ldap_plugin_id }}/Configuration"
            method: POST
            headers:
              X-Emby-Token: "{{ jellyfin_api_key.stdout }}"
            body_format: json
            body: "{{ jellyfin_ldap_configuration }}"
            status_code: 204
          no_log: true

        - name: Test LDAPS certificate bind and base search through the plugin
          ansible.builtin.uri:
            url: "{{ jellyfin_api_url }}/Ldap/TestServerBind"
            method: POST
            headers:
              X-Emby-Token: "{{ jellyfin_api_key.stdout }}"
            body_format: json
            body:
              LdapServer: authentik-ldap
              LdapPort: 6636
              UseSsl: true
              UseStartTls: false
              SkipSslVerify: false
              AllowPassChange: false
              LdapBindUser: "{{ jellyfin_ldap_bind_dn }}"
              LdapBindPassword: "{{ jellyfin_ldap_bind_password }}"
              LdapBaseDn: "{{ jellyfin_ldap_base_dn }}"
              PasswordResetUrl: https://auth.diloreto.com
              LdapClientCertPath: ""
              LdapClientKeyPath: ""
              LdapRootCaPath: /etc/ssl/certs/authentik-ldap.pem
            return_content: true
            status_code: 200
          register: jellyfin_ldap_bind_test
          no_log: true

        - name: Require successful verified LDAPS bind and search
          ansible.builtin.assert:
            that:
              - >-
                (jellyfin_ldap_bind_test.json.Connect |
                 default(jellyfin_ldap_bind_test.json.connect)) == 'Success'
              - >-
                (jellyfin_ldap_bind_test.json.Bind |
                 default(jellyfin_ldap_bind_test.json.bind)) == 'Success'
              - >-
                (jellyfin_ldap_bind_test.json.BaseSearch |
                 default(jellyfin_ldap_bind_test.json.baseSearch)) is match('^Found [1-9][0-9]* Entities$')
              - >-
                (jellyfin_ldap_bind_test.json.Error |
                 default(jellyfin_ldap_bind_test.json.error, true) | default('')) | length == 0
            fail_msg: Jellyfin LDAP plugin failed its verified LDAPS bind or base search.
          no_log: true

        - name: Test the restrictive user filter with administrator mapping disabled
          ansible.builtin.uri:
            url: "{{ jellyfin_api_url }}/Ldap/TestLdapFilters"
            method: POST
            headers:
              X-Emby-Token: "{{ jellyfin_api_key.stdout }}"
            body_format: json
            body:
              LdapSearchFilter: "{{ jellyfin_ldap_user_filter }}"
              LdapAdminFilter: _disabled_
              EnableLdapAdminFilterMemberUid: false
            return_content: true
            status_code: 200
          register: jellyfin_ldap_filter_test
          no_log: true

        - name: Require exactly five allowed users and no LDAP administrators
          ansible.builtin.assert:
            that:
              - >-
                (jellyfin_ldap_filter_test.json.Users |
                 default(jellyfin_ldap_filter_test.json.users)) | int == 5
              - >-
                (jellyfin_ldap_filter_test.json.Admins |
                 default(jellyfin_ldap_filter_test.json.admins)) | int == 0
              - >-
                (jellyfin_ldap_filter_test.json.IsSubset |
                 default(jellyfin_ldap_filter_test.json.isSubset)) | bool
            fail_msg: Jellyfin LDAP filter scope or administrator mapping is unsafe.
          no_log: true

        - name: Save the exact LDAP login search attributes without testing a user password
          ansible.builtin.uri:
            url: "{{ jellyfin_api_url }}/Ldap/LdapUserSearch"
            method: POST
            headers:
              X-Emby-Token: "{{ jellyfin_api_key.stdout }}"
            body_format: json
            body:
              LdapSearchAttributes: cn, mail
              TestSearchUsername: ""
            status_code: 200
          no_log: true

        - name: Re-read the effective LDAP plugin configuration
          ansible.builtin.uri:
            url: "{{ jellyfin_api_url }}/Plugins/{{ jellyfin_ldap_plugin_id }}/Configuration"
            method: GET
            headers:
              X-Emby-Token: "{{ jellyfin_api_key.stdout }}"
            return_content: true
            status_code: 200
          register: jellyfin_ldap_effective_configuration
          no_log: true

        - name: Require safe effective LDAP settings
          ansible.builtin.assert:
            that:
              - jellyfin_ldap_effective_configuration.json.LdapServer == 'authentik-ldap'
              - jellyfin_ldap_effective_configuration.json.LdapPort | int == 6636
              - jellyfin_ldap_effective_configuration.json.UseSsl | bool
              - not (jellyfin_ldap_effective_configuration.json.UseStartTls | bool)
              - not (jellyfin_ldap_effective_configuration.json.SkipSslVerify | bool)
              - not (jellyfin_ldap_effective_configuration.json.CreateUsersFromLdap | bool)
              - not (jellyfin_ldap_effective_configuration.json.AllowPassChange | bool)
              - jellyfin_ldap_effective_configuration.json.LdapAdminFilter == '_disabled_'
              - jellyfin_ldap_effective_configuration.json.LdapUidAttribute == 'uid'
              - jellyfin_ldap_effective_configuration.json.LdapUsernameAttribute == 'cn'
              - jellyfin_ldap_effective_configuration.json.LdapRootCaPath == '/etc/ssl/certs/authentik-ldap.pem'
            fail_msg: Effective Jellyfin LDAP settings violate migration safety requirements.
          no_log: true
      always:
        - name: Remove the LDAP secret workspace
          ansible.builtin.file:
            path: "{{ jellyfin_ldap_secret_workspace.path }}"
            state: absent
          become: true
          no_log: true

  post_tasks:
    - name: Release production ownership after successful LDAP plugin qualification
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: jellyfin-ldap-plugin-migration
        apply_lock_expected_owner_sha256: "{{ jellyfin_ldap_expected_owner_sha256 }}"
