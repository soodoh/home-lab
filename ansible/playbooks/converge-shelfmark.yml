---
- name: Observe current host state before converging Shelfmark settings
  ansible.builtin.import_playbook: observe-hosts.yml

- name: Observe current backup admission before converging Shelfmark settings
  ansible.builtin.import_playbook: observe-backups.yml

- name: Converge Shelfmark connection and acquisition settings under production ownership
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  vars:
    compose_native_apply_operation: shelfmark-connections
  pre_tasks:
    - name: Require explicit approval for live Shelfmark settings changes
      ansible.builtin.assert:
        that: shelfmark_apply_confirmed | default(false) | bool
        fail_msg: Live Shelfmark convergence requires shelfmark_apply_confirmed=true.
      when: not ansible_check_mode

    - name: Observe active Compose state
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe

    - name: Acquire production ownership
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: shelfmark-connections
  tasks:
    - name: Revalidate backup admission under exact production ownership
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: admission

    - name: Reobserve active Compose under production ownership
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe

    - name: Converge only the Shelfmark consumer settings
      ansible.builtin.import_role:
        name: shelfmark
  post_tasks:
    - name: Release production ownership only on complete success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: shelfmark-connections
