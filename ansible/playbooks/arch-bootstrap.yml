---
- name: Provision a fresh Arch workload guest
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Acquire the shared host-side mutation lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: arch-bootstrap
  roles:
    - role: arch_packages
    - role: base
    - role: deploy_user
    - role: plan_controller
    - role: tailscale
    - role: arch_network
    - role: arch_mounts
    - role: docker
    - role: human_access
    - role: sops_age
    - role: arch_hardware
  post_tasks:
    - name: Release the shared host-side mutation lock after success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
