---
- name: Observe current host state before changing Grimmory settings
  ansible.builtin.import_playbook: observe-hosts.yml

- name: Observe current backup admission before changing Grimmory settings
  ansible.builtin.import_playbook: observe-backups.yml

- name: Converge Grimmory settings under production ownership
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  vars:
    compose_native_apply_operation: grimmory-authentication
  pre_tasks:
    - name: Require explicit approval for Grimmory settings changes
      ansible.builtin.assert:
        that: grimmory_apply_confirmed | default(false) | bool
        fail_msg: Live Grimmory settings convergence requires grimmory_apply_confirmed=true.
      when: not ansible_check_mode

    - name: Observe active Compose state
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe

    - name: Acquire production ownership
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: grimmory-authentication

  tasks:
    - name: Revalidate backup admission under exact production ownership
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: admission

    - name: Reobserve active Compose under production ownership
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe

    - name: Converge native authentication and adopted import settings
      ansible.builtin.import_role:
        name: grimmory

  post_tasks:
    - name: Release production ownership only on complete success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: grimmory-authentication
