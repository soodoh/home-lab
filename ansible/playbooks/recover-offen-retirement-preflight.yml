---
- name: Recover the exact rolled-back Offen retirement preflight
  hosts: docker_host
  gather_facts: false
  any_errors_fatal: true
  vars:
    offen_preflight_manifest_sha256: d864caf2459c0e5c6ec2b5b31de920018d187eb7a4905a079e7bb80db146a4a4
  pre_tasks:
    - name: Require exact rollback-recovery authorization
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - offen_preflight_recovery_confirmation | default('') == 'recover-reviewed-' ~ offen_preflight_manifest_sha256
          - offen_preflight_expected_production_owner_sha256 | default('') is match('^[0-9a-f]{64}$')
        fail_msg: Preflight recovery requires the exact old manifest and retained production owner.

    - name: Adopt only the exact retained Offen retirement production lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: adopt
        apply_lock_operation: offen-retirement-local
        apply_lock_expected_owner_sha256: "{{ offen_preflight_expected_production_owner_sha256 }}"

  tasks:
    - name: Verify and retain the exact rolled-back local transaction
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../../scripts/recover-offen-retirement-preflight
          {{ offen_preflight_manifest_sha256 }}
      register: offen_preflight_recovery
      changed_when: true

    - name: Require bounded rollback-recovery result
      ansible.builtin.assert:
        that:
          - >-
            offen_preflight_recovery.stdout is match(
              '^offen_retirement_preflight_recovery=rolled-back-retained manifest_sha256=' ~
              offen_preflight_manifest_sha256
            )

  post_tasks:
    - name: Release only the exact retained Offen retirement production lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_operation: offen-retirement-local
        apply_lock_expected_owner_sha256: "{{ offen_preflight_expected_production_owner_sha256 }}"
