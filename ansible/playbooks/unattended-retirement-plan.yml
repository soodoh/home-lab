---
- name: Observe Debian unattended-upgrade retirement drift
  hosts: docker_host
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
  roles:
    - role: lifecycle_state
      vars:
        lifecycle_state_enforce: true
        lifecycle_state_emit_observation: false
    - role: unattended_retirement_plan
