---
- name: Build read-only Proxmox access cutover evidence
  hosts: proxmox_host
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
  roles:
    - role: lifecycle_state
      vars:
        lifecycle_state_enforce: false
        lifecycle_state_emit_observation: false
    - role: access_cutover_plan
      vars:
        access_cutover_plan_emit: true
