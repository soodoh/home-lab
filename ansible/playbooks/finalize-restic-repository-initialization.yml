---
- name: Finalize only committed owner-bound Restic repository identities
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  tasks:
    - name: Require exact initialization finalization approval and state
      ansible.builtin.assert:
        that:
          - restic_repository_initialization_finalize_confirmed | default(false) | bool
          - restic_repository_initialization_finalize_confirmation | default('') == 'finalize-owner-bound-restic-repository-initialization'
          - restic_repository_initialization_expected_owner_sha256 | default('') is match('^[0-9a-f]{64}$')
          - restic_repository_initialization_reviewed_commit | default('') is match('^[0-9a-f]{40}$')
          - backups.restic.migration_state == 'inert'
          - backups.restic.initialization.state == 'initialized'
          - backups.restic.initialization.source_policy_sha256 is match('^[0-9a-f]{64}$')
          - backups.restic.initialization.evidence_sha256 is match('^[0-9a-f]{64}$')
          - backups.restic.initialization.verified_at is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T')
          - backups.restic.repositories.values() | map(attribute='id') | unique | list | length == 3
          - backups.restic.repositories.values() | map(attribute='id') | select('match', '^[0-9a-f]{64}$') | list | length == 3
          - backups.restic.qualification.state == 'qualified'
          - backups.legacy_offen.scheduler_state == 'quiesced'
          - backups.legacy_offen.migration_archive_preservation.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.current_object_retention_days >= 365
          - backups.legacy_offen.migration_retention_hold.review_deadline > now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')
        fail_msg: Finalization requires committed exact evidence, repository IDs, owner hash, and confirmation.

    - name: Inspect controller repository commit
      ansible.builtin.command:
        argv: [/usr/bin/git, -C, "{{ playbook_dir }}/../..", rev-parse, HEAD]
      delegate_to: localhost
      become: false
      register: restic_initialization_controller_head
      changed_when: false
      check_mode: false

    - name: Inspect controller repository cleanliness
      ansible.builtin.command:
        argv: [/usr/bin/git, -C, "{{ playbook_dir }}/../..", status, --porcelain]
      delegate_to: localhost
      become: false
      register: restic_initialization_controller_status
      changed_when: false
      check_mode: false

    - name: Require exact clean reviewed commit
      ansible.builtin.assert:
        that:
          - restic_initialization_controller_head.stdout == restic_repository_initialization_reviewed_commit
          - restic_initialization_controller_status.stdout == ''

    - name: Read checked-in initialization evidence
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../{{ backups.restic.initialization.evidence_file }}"
      delegate_to: localhost
      become: false
      register: restic_initialization_committed_evidence
      no_log: true

    - name: Read retained owner, installed source policy, journal, and host evidence
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ apply_lock_path }}/owner"
        - /etc/home-lab/restic-policy.json
        - "{{ backups.restic.initialization.journal_path }}"
        - "{{ backups.restic.initialization.host_evidence_path }}"
      become: true
      register: restic_initialization_finalize_inputs
      no_log: true

    - name: Require exact committed and retained transaction bindings
      ansible.builtin.assert:
        that:
          - (restic_initialization_finalize_inputs.results[0].content | b64decode | hash('sha256')) == restic_repository_initialization_expected_owner_sha256
          - "'operation=restic-repository-initialization' in (restic_initialization_finalize_inputs.results[0].content | b64decode).splitlines()"
          - (restic_initialization_finalize_inputs.results[1].content | b64decode | hash('sha256')) == backups.restic.initialization.source_policy_sha256
          - journal.lock_owner_sha256 == restic_repository_initialization_expected_owner_sha256
          - journal.source_policy_sha256 == backups.restic.initialization.source_policy_sha256
          - restic_initialization_finalize_inputs.results[3].content == restic_initialization_committed_evidence.content
          - (restic_initialization_committed_evidence.content | b64decode | hash('sha256')) == backups.restic.initialization.evidence_sha256
          - evidence.keys() | sort == expected_evidence_keys | sort
          - evidence.repository_ids.keys() | sort == ['games', 'nfs', 'proton']
          - evidence.completed_at == backups.restic.initialization.verified_at
          - >-
            evidence.repository_ids ==
            {'games': backups.restic.repositories.games.id,
             'nfs': backups.restic.repositories.nfs.id,
             'proton': backups.restic.repositories.proton.id}
          - evidence.lock_owner_sha256 == restic_repository_initialization_expected_owner_sha256
          - evidence.source_policy_sha256 == backups.restic.initialization.source_policy_sha256
        fail_msg: Committed initialization evidence differs from the exact retained transaction.
      vars:
        journal: "{{ restic_initialization_finalize_inputs.results[2].content | b64decode | from_json }}"
        evidence: "{{ restic_initialization_committed_evidence.content | b64decode | from_json }}"
        expected_evidence_keys:
          - account_username_sha256
          - chunker_polynomial
          - completed_at
          - helper_sha256
          - lock_owner_sha256
          - mounts
          - operations
          - proton_minimum_allocated_bytes
          - proton_minimum_free_bytes
          - proton_observed_free_bytes
          - proton_observed_total_bytes
          - qualification_evidence_sha256
          - repository_ids
          - restic_sha256
          - rclone_sha256
          - source_policy_sha256
          - started_at
          - state
          - type
          - version
      no_log: true

    - name: Converge the exact ID-bearing Restic policy while lock remains held
      ansible.builtin.import_role:
        name: restic_backup
      become: true

    - name: Verify exact repository IDs, common chunker parameters, and evidence
      ansible.builtin.command:
        argv: [/usr/local/libexec/home-lab/initialize-restic-repositories, verify]
      become: true
      register: restic_initialization_verify
      changed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Require exact bounded final verification
      ansible.builtin.assert:
        that:
          - restic_initialization_verify.rc == 0
          - restic_initialization_verify.stdout == 'restic_repository_initialization=verified evidence_sha256=' ~ backups.restic.initialization.evidence_sha256
      when: not ansible_check_mode

    - name: Re-audit the complete quiesced source state before finalization release
      ansible.builtin.import_role:
        name: audit
      vars:
        audit_expected_stopped_compose_services: "{{ backups.legacy_offen.scheduler_services }}"
        audit_expected_running_compose_service_count: "{{ audit_expected_compose_service_count - (backups.legacy_offen.scheduler_services | length) }}"

    - name: Reassert archive preservation and current retention hold before cleanup
      ansible.builtin.assert:
        that:
          - backups.legacy_offen.migration_archive_preservation.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.current_object_retention_days >= 365
          - backups.legacy_offen.migration_retention_hold.review_deadline > now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')
        fail_msg: Finalization retention protections expired before cleanup and lock release.

    - name: Remove only finalized transient initialization state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ backups.restic.initialization.journal_path }}"
        - "{{ backups.restic.initialization.result_path }}"
      become: true
      when: not ansible_check_mode

    - name: Release only the exact owner-bound initialization lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_operation: restic-repository-initialization
        apply_lock_expected_owner_sha256: "{{ restic_repository_initialization_expected_owner_sha256 }}"
