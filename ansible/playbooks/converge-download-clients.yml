---
# Credential rotation is a separate, approval-gated step before the saved Arr
# OpenTofu plan is applied. No Compose environment receives these credentials.
- name: Observe current host state before changing download clients
  ansible.builtin.import_playbook: observe-hosts.yml

- name: Observe current backup admission before changing download clients
  ansible.builtin.import_playbook: observe-backups.yml

- name: Converge application download-client credentials under production ownership
  hosts: docker-host
  gather_facts: true
  gather_subset: ["!all", min]
  any_errors_fatal: true
  vars:
    compose_native_apply_operation: download-client-credentials
  pre_tasks:
    - name: Require explicit approval for a live credential change
      ansible.builtin.assert:
        that: download_client_apply_confirmed | default(false) | bool
        fail_msg: Live credential convergence requires download_client_apply_confirmed=true.
      when: not ansible_check_mode

    - name: Observe active Compose state
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe

    - name: Acquire production ownership
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_operation: download-client-credentials

  tasks:
    - name: Revalidate backup admission under exact production ownership
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: admission

    - name: Reobserve active Compose under production ownership
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: observe

    - name: Read BookOrbit integration inputs
      ansible.builtin.import_role:
        name: bookorbit
        tasks_from: load

    - name: Refuse to rotate credentials while BookOrbit acquisition is only partially activated
      ansible.builtin.assert:
        that: >-
          ('bookorbit' in compose_native_declared_services.stdout_lines) ==
          (bookorbit_production.BOOKORBIT_CONVERGENCE_API_KEY is defined)
        fail_msg: Complete BookOrbit acquisition activation with the scoped SOPS key before rotating credentials.

    - name: Preflight the configured BookOrbit consumer before starting a provider rotation
      ansible.builtin.include_role:
        name: bookorbit
        tasks_from: preflight
      when: bookorbit_production.BOOKORBIT_CONVERGENCE_API_KEY is defined

    - name: Verify that BookOrbit requires qBittorrent authentication before rotating native credentials
      ansible.builtin.include_role:
        name: bookorbit
        tasks_from: verify-client-auth
      when: bookorbit_production.BOOKORBIT_CONVERGENCE_API_KEY is defined

    - name: Converge download-client credentials
      ansible.builtin.import_role:
        name: download_client

    - name: Sync Shelfmark after native download-client credential convergence
      ansible.builtin.import_role:
        name: shelfmark

    - name: Sync BookOrbit from the same SOPS revision following native rotation
      ansible.builtin.include_role:
        name: bookorbit
      when: bookorbit_production.BOOKORBIT_CONVERGENCE_API_KEY is defined

  post_tasks:
    - name: Release production ownership only on complete success
      ansible.builtin.import_role:
        name: compose_native
        tasks_from: release
      vars:
        compose_native_apply_operation: download-client-credentials
