---
- name: Remove only the obsolete Proton TOTP field for the retained transaction
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  vars:
    proton_password_only_script_sha256: 5ccac87533a83bb9a1b82df61e96552a6be6902c27f95193169167c56597fe7e
    proton_password_only_installed_helper_sha256: fc7b52f32bdd255fedaea54278b9aa7772854e141de9610c4ffc38bb32b01fc3
  tasks:
    - name: Require exact password-only transition approval
      ansible.builtin.assert:
        that:
          - proton_password_only_confirmed | default(false) | bool
          - proton_password_only_confirmation | default('') == 'remove-only-obsolete-proton-totp-field'
          - proton_password_only_expected_transaction_sha256 | default('') is match('^[0-9a-f]{64}$')
          - proton_password_only_expected_auth_evidence_sha256 | default('') is match('^[0-9a-f]{64}$')
          - proton_password_only_expected_rotation_evidence_sha256 | default('') is match('^[0-9a-f]{64}$')
          - backups.restic.migration_state == 'inert'
          - backups.restic.proton.authentication_mode == 'password-only'
          - backups.restic.qualification.state == 'ready'
          - backups.restic.credentials.state == 'provisioned'
          - backups.restic.credential_refs.proton_totp_seed is not defined
          - backups.legacy_offen.scheduler_state == 'quiesced'
          - backups.legacy_offen.migration_retention_hold.state == 'applied'
          - backups.legacy_offen.migration_retention_hold.review_deadline > now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')
        fail_msg: Password-only transition requires its exact reviewed state and confirmation.

    - name: Inspect retained qualification lock and owner
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop:
        - "{{ apply_lock_path }}"
        - "{{ apply_lock_path }}/owner"
      become: true
      register: proton_password_only_lock_paths

    - name: Inspect retained qualification lock contents
      ansible.builtin.find:
        paths: "{{ apply_lock_path }}"
        hidden: true
        recurse: false
        file_type: any
      become: true
      register: proton_password_only_lock_entries
      when: proton_password_only_lock_paths.results[0].stat.isdir | default(false)

    - name: Read retained qualification owner
      ansible.builtin.slurp:
        src: "{{ apply_lock_path }}/owner"
      become: true
      register: proton_password_only_lock_owner
      no_log: true
      when: proton_password_only_lock_paths.results[1].stat.isreg | default(false)

    - name: Require exact retained qualification lock
      ansible.builtin.assert:
        that:
          - proton_password_only_lock_paths.results[0].stat.isdir | default(false)
          - proton_password_only_lock_paths.results[0].stat.pw_name == 'root'
          - proton_password_only_lock_paths.results[0].stat.mode == '0700'
          - proton_password_only_lock_paths.results[1].stat.isreg | default(false)
          - proton_password_only_lock_paths.results[1].stat.pw_name == 'root'
          - proton_password_only_lock_paths.results[1].stat.mode == '0600'
          - proton_password_only_lock_entries.matched == 1
          - "'controller=ansible-deploy' in (proton_password_only_lock_owner.content | b64decode).splitlines()"
          - "'operation=proton-qualification' in (proton_password_only_lock_owner.content | b64decode).splitlines()"
          - (proton_password_only_lock_owner.content | b64decode | hash('sha256')) == proton_password_only_expected_transaction_sha256
        fail_msg: Retained lock is not the explicitly reviewed failed Proton qualification transaction.
      no_log: true

    - name: Set transaction-specific password-only paths
      ansible.builtin.set_fact:
        proton_password_only_transaction_sha256: "{{ proton_password_only_lock_owner.content | b64decode | hash('sha256') }}"
        proton_password_only_auth_evidence_path: >-
          /var/lib/home-lab-restic/proton-auth-diagnostic-{{ proton_password_only_lock_owner.content | b64decode | hash('sha256') }}.json
        proton_password_only_rotation_evidence_path: >-
          /var/lib/home-lab-restic/proton-credential-rotation-{{ proton_password_only_lock_owner.content | b64decode | hash('sha256') }}.json
        proton_password_only_evidence_path: >-
          /var/lib/home-lab-restic/proton-password-only-transition-{{ proton_password_only_lock_owner.content | b64decode | hash('sha256') }}.json
        proton_password_only_script_temp: >-
          /run/proton-password-only-transition-{{ proton_password_only_lock_owner.content | b64decode | hash('sha256') }}
      no_log: true

    - name: Require no concurrent Restic or rclone process
      ansible.builtin.command:
        argv: [/usr/bin/pgrep, --exact, "{{ item }}"]
      loop: [restic, rclone]
      register: proton_password_only_processes
      changed_when: false
      failed_when: proton_password_only_processes.rc != 1
      check_mode: false

    - name: Inspect stopped Offen scheduler states
      ansible.builtin.command:
        argv: [/usr/bin/docker, inspect, --format, "{{ '{{.State.Running}}' }}", "{{ item }}"]
      loop: "{{ backups.legacy_offen.scheduler_services }}"
      register: proton_password_only_offen_states
      changed_when: false
      check_mode: false

    - name: Require Offen schedulers to remain stopped
      ansible.builtin.assert:
        that:
          - item.stdout == 'false'
        fail_msg: An Offen scheduler is not quiesced during the password-only transition.
      loop: "{{ proton_password_only_offen_states.results }}"

    - name: Inspect protected password-only prerequisites
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
      loop:
        - name: policy
          path: /etc/home-lab/restic-policy.json
          owner: root
          group: restic-proton
          mode: "0440"
        - name: installed_helper
          path: /usr/local/libexec/home-lab/qualify-proton-backup
          owner: root
          group: restic-proton
          mode: "0750"
          checksum: "{{ proton_password_only_installed_helper_sha256 }}"
        - name: rclone_config
          path: /var/lib/restic-proton/rclone.conf
          owner: restic-proton
          group: restic-proton
          mode: "0600"
        - name: config_parent
          path: /var/lib/restic-proton
          owner: restic-proton
          group: restic-proton
          mode: "0700"
          directory: true
        - name: cache
          path: /var/lib/restic-proton/cache
          owner: restic-proton
          group: restic-proton
          mode: "0700"
          directory: true
        - name: backup_mutex
          path: /run/lock/home-lab-backup.lock
          owner: root
          group: restic-proton
          mode: "0660"
        - name: evidence_parent
          path: /var/lib/home-lab-restic
          owner: root
          group: root
          mode: "0750"
          directory: true
      become: true
      register: proton_password_only_prerequisites

    - name: Require exact protected password-only prerequisites
      ansible.builtin.assert:
        that:
          - >-
            (item.item.directory | default(false) | bool and item.stat.isdir | default(false))
            or (not (item.item.directory | default(false) | bool) and item.stat.isreg | default(false))
          - not (item.stat.islnk | default(false))
          - item.item.directory | default(false) | bool or item.stat.nlink == 1
          - item.stat.pw_name == item.item.owner
          - item.stat.gr_name == item.item.group
          - item.stat.mode == item.item.mode
          - item.item.checksum is not defined or item.stat.checksum == item.item.checksum
        fail_msg: "Protected password-only prerequisite {{ item.item.name }} differs."
      loop: "{{ proton_password_only_prerequisites.results }}"

    - name: Read installed legacy Restic policy
      ansible.builtin.slurp:
        src: /etc/home-lab/restic-policy.json
      become: true
      register: proton_password_only_installed_policy
      no_log: true

    - name: Require exact inert legacy policy seam
      ansible.builtin.assert:
        that:
          - installed.migration_state == 'inert'
          - installed.qualification.state == 'ready'
          - installed.qualification.username_sha256 == backups.restic.qualification.username_sha256
          - installed.qualification.helper_sha256 == proton_password_only_installed_helper_sha256
          - "installed.credentials == {'bootstrap_enabled': true, 'state': 'provisioned'}"
          - installed.proton.authentication_mode is not defined
          - installed.credential_refs.proton_totp_seed == 'PROTON_BACKUP_TOTP_SEED'
          - installed.repositories.values() | map(attribute='id') | select('ne', none) | list | length == 0
        fail_msg: Installed legacy Restic policy is not the exact reviewed password-only transition seam.
      vars:
        installed: "{{ proton_password_only_installed_policy.content | b64decode | from_json }}"
      no_log: true

    - name: Inspect prior and absent transaction evidence
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
      loop:
        - name: auth_evidence
          path: "{{ proton_password_only_auth_evidence_path }}"
          present: true
          checksum: "{{ proton_password_only_expected_auth_evidence_sha256 }}"
        - name: rotation_evidence
          path: "{{ proton_password_only_rotation_evidence_path }}"
          present: true
          checksum: "{{ proton_password_only_expected_rotation_evidence_sha256 }}"
        - name: qualification_result
          path: "{{ backups.restic.qualification.result_path }}"
          present: false
        - name: qualification_evidence
          path: "{{ backups.restic.qualification.host_evidence_path }}"
          present: false
        - name: recovery_evidence
          path: >-
            /var/lib/home-lab-restic/proton-qualification-recovery-{{ proton_password_only_transaction_sha256 }}.json
          present: false
      become: true
      register: proton_password_only_evidence_paths

    - name: Require exact prior and absent transaction evidence
      ansible.builtin.assert:
        that:
          - item.stat.exists == item.item.present
          - not item.item.present or item.stat.isreg | default(false)
          - not item.item.present or not (item.stat.islnk | default(false))
          - not item.item.present or item.stat.nlink == 1
          - not item.item.present or item.stat.pw_name == 'root'
          - not item.item.present or item.stat.gr_name == 'root'
          - not item.item.present or item.stat.mode == '0600'
          - item.item.checksum is not defined or item.stat.checksum == item.item.checksum
        fail_msg: "Password-only evidence prerequisite {{ item.item.name }} differs."
      loop: "{{ proton_password_only_evidence_paths.results }}"

    - name: Inspect resumable password-only transition claim
      ansible.builtin.stat:
        path: "{{ proton_password_only_evidence_path }}"
        follow: false
        get_checksum: false
        get_mime: false
      become: true
      register: proton_password_only_claim

    - name: Require an absent or protected resumable transition claim
      ansible.builtin.assert:
        that:
          - >-
            not proton_password_only_claim.stat.exists
            or (
              proton_password_only_claim.stat.isreg | default(false)
              and not (proton_password_only_claim.stat.islnk | default(false))
              and proton_password_only_claim.stat.nlink == 1
              and proton_password_only_claim.stat.pw_name == 'root'
              and proton_password_only_claim.stat.gr_name == 'root'
              and proton_password_only_claim.stat.mode == '0600'
            )
        fail_msg: Existing password-only transition claim is not a protected resumable marker.

    - name: Read resumable password-only transition claim
      ansible.builtin.slurp:
        src: "{{ proton_password_only_evidence_path }}"
      become: true
      register: proton_password_only_claim_content
      no_log: true
      when: proton_password_only_claim.stat.exists

    - name: Require exact resumable password-only transition claim
      ansible.builtin.assert:
        that:
          - claim.keys() | sort == expected_keys | sort
          - claim.account_username_sha256 == backups.restic.qualification.username_sha256
          - claim.auth_diagnostic_evidence_sha256 == proton_password_only_expected_auth_evidence_sha256
          - claim.credential_rotation_evidence_sha256 == proton_password_only_expected_rotation_evidence_sha256
          - claim.started_at is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - claim.state == 'started'
          - claim.transaction_sha256 == proton_password_only_transaction_sha256
          - claim.version == 1
        fail_msg: Existing password-only transition claim is not the exact resumable transaction marker.
      vars:
        claim: "{{ proton_password_only_claim_content.content | b64decode | from_json }}"
        expected_keys:
          - account_username_sha256
          - auth_diagnostic_evidence_sha256
          - credential_rotation_evidence_sha256
          - started_at
          - state
          - transaction_sha256
          - version
      no_log: true
      when: proton_password_only_claim.stat.exists

    - name: Report exact password-only transition in check mode
      ansible.builtin.debug:
        msg: >-
          Would stage one hash-pinned root-only supervisor, acquire the existing backup mutex,
          atomically claim transaction evidence, remove only the obsolete otp_secret_key field,
          require the client cache to remain absent, prove every other static field byte-identical,
          make zero Proton requests, retain all prior evidence, and retain the production lock.
      changed_when: true
      when: ansible_check_mode

    - name: Stage and run the password-only transition
      when: not ansible_check_mode
      block:
        - name: Stage hash-pinned password-only supervisor
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../scripts/diagnose-proton-auth"
            dest: "{{ proton_password_only_script_temp }}"
            owner: root
            group: root
            mode: "0700"
          become: true
          no_log: true

        - name: Remove only the obsolete TOTP field under the backup mutex
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - "{{ proton_password_only_script_temp }}"
              - password-only-supervise
              - "{{ proton_password_only_transaction_sha256 }}"
              - "{{ proton_password_only_script_sha256 }}"
              - "{{ proton_password_only_expected_auth_evidence_sha256 }}"
              - "{{ proton_password_only_expected_rotation_evidence_sha256 }}"
          become: true
          register: proton_password_only_run
          changed_when: true
          failed_when: false
          no_log: true
      always:
        - name: Remove only the ephemeral password-only supervisor
          ansible.builtin.file:
            path: "{{ proton_password_only_script_temp }}"
            state: absent
          become: true
          no_log: true

    - name: Capture only a controlled password-only transition failure
      ansible.builtin.set_fact:
        proton_password_only_failure_report: >-
          {{
            (
              transition_failure_output
              | regex_search('(?m)^proton_auth_diagnostic=failed reason=[a-z0-9_.-]+\\r?$')
              | default('', true)
              | trim
            )
            if (
              transition_failure_output
              | regex_search('(?m)^proton_auth_diagnostic=failed reason=[a-z0-9_.-]+\\r?$')
              | default('', true)
              | length
            ) > 0
            else 'proton_password_only_transition=failed reason=unclassified_output_sha256_'
              ~ (transition_failure_output | hash('sha256'))
          }}
      vars:
        transition_failure_output: >-
          {{
            (proton_password_only_run.stdout | default(''))
            ~ '\n' ~ (proton_password_only_run.stderr | default(''))
            ~ '\n' ~ (proton_password_only_run.msg | default('') | string)
          }}
      no_log: true
      when:
        - not ansible_check_mode
        - proton_password_only_run.rc != 0

    - name: Require atomic password-only transition success
      ansible.builtin.assert:
        that:
          - proton_password_only_run.rc == 0
          - proton_password_only_run.stdout is match('^proton_password_only_transition=passed evidence_sha256=[0-9a-f]{64}$')
        fail_msg: "{{ proton_password_only_failure_report | default('proton_password_only_transition=failed reason=unclassified') }}"
      no_log: true
      when: not ansible_check_mode

    - name: Read transaction-bound password-only evidence
      ansible.builtin.slurp:
        src: "{{ proton_password_only_evidence_path }}"
      become: true
      register: proton_password_only_evidence
      no_log: true
      when: not ansible_check_mode

    - name: Require exact password-only transition evidence
      ansible.builtin.assert:
        that:
          - evidence.keys() | sort == expected_keys | sort
          - evidence.account_username_sha256 == backups.restic.qualification.username_sha256
          - evidence.auth_diagnostic_evidence_sha256 == proton_password_only_expected_auth_evidence_sha256
          - evidence.cache_state == 'absent'
          - evidence.credential_rotation_evidence_sha256 == proton_password_only_expected_rotation_evidence_sha256
          - evidence.provider_requests == 0
          - evidence.removed_field == 'otp_secret_key'
          - evidence.state == 'password-only'
          - evidence.transaction_sha256 == proton_password_only_transaction_sha256
          - evidence.transitioned_at is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - evidence.version == 1
          - proton_password_only_run.stdout == 'proton_password_only_transition=passed evidence_sha256=' ~ evidence_sha256
        fail_msg: Password-only evidence differs from the reviewed transaction schema.
      vars:
        evidence: "{{ proton_password_only_evidence.content | b64decode | from_json }}"
        evidence_sha256: "{{ proton_password_only_evidence.content | b64decode | hash('sha256') }}"
        expected_keys:
          - account_username_sha256
          - auth_diagnostic_evidence_sha256
          - cache_state
          - credential_rotation_evidence_sha256
          - provider_requests
          - removed_field
          - state
          - transaction_sha256
          - transitioned_at
          - version
      no_log: true
      when: not ansible_check_mode

    - name: Re-read retained qualification owner after password-only transition
      ansible.builtin.slurp:
        src: "{{ apply_lock_path }}/owner"
      become: true
      register: proton_password_only_final_lock_owner
      no_log: true
      when: not ansible_check_mode

    - name: Confirm password-only transition retained exact qualification lock
      ansible.builtin.assert:
        that:
          - proton_password_only_final_lock_owner.content == proton_password_only_lock_owner.content
        fail_msg: Password-only transition did not retain the exact failed qualification owner bytes.
      no_log: true
      when: not ansible_check_mode
