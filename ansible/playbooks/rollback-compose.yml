---
- name: Perform the separately approved previous-artifact Compose rollback
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Acquire the host-side production apply lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: compose-rollback
  roles:
    - role: compose_rollback
  post_tasks:
    - name: Verify the complete running service baseline after rollback
      ansible.builtin.import_role:
        name: health

    - name: Release the host-side production apply lock after successful verification
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_operation: compose-rollback
