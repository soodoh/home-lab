---
- name: Verify the active Compose artifact for CT retirement
  hosts: docker_host
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  tasks:
    - name: Require an exact expected Compose artifact hash
      ansible.builtin.assert:
        that:
          - compose_retirement_expected_artifact_sha256 is defined
          - compose_retirement_expected_artifact_sha256 is string
          - compose_retirement_expected_artifact_sha256 is regex('^[0-9a-f]{64}$')
        fail_msg: The expected Compose artifact hash is missing or invalid.
      changed_when: false
      no_log: true

    - name: Hash the active Compose artifact without Git metadata
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ compose_current_dir }}/scripts/compose-artifact.py"
          - --root
          - "{{ compose_current_dir }}"
          - --no-git
          - hash
      become: true
      check_mode: false
      changed_when: false
      register: compose_retirement_active_artifact
      no_log: true

    - name: Require the active artifact to match the saved-plan manifest
      ansible.builtin.assert:
        that:
          - compose_retirement_active_artifact.rc == 0
          - compose_retirement_active_artifact.stdout == compose_retirement_expected_artifact_sha256
        fail_msg: The active Compose artifact does not match the saved-plan manifest.
      changed_when: false
      no_log: true
