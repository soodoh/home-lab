---
- name: Plan or bootstrap the local management plane
  hosts: docker_host
  gather_facts: true
  become: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Enforce the management-plane apply safety contract
      ansible.builtin.import_role:
        name: apply_guard
      vars:
        apply_guard_allowed_tags: "{{ bootstrap_allowed_apply_tags }}"
      tags:
        - always
        - management_plane

    - name: Require local execution for the initial bootstrap
      ansible.builtin.assert:
        that:
          - ansible_connection == 'local'
        fail_msg: "Initial Tailscale and deploy-user bootstrap must use inventory/local.yml on the Docker host."
      tags:
        - management_plane

    - name: Require dual-path recovery and tailnet-policy confirmations before a normal bootstrap
      ansible.builtin.assert:
        that:
          - lan_ssh_recovery_confirmed | default(false) | ansible.builtin.bool
          - proxmox_console_recovery_confirmed | default(false) | ansible.builtin.bool
          - tailscale_gateway_recovery_confirmed | default(false) | ansible.builtin.bool
          - tailscale_transport_ssh_confirmed | default(false) | ansible.builtin.bool
        fail_msg: >-
          Refusing Docker bootstrap. First verify fresh LAN SSH, the Proxmox serial console, the dedicated
          Tailscale gateway LXC route, and tailnet authorization for OpenSSH over the Tailscale transport; then pass all four confirmations.
      when: not ansible_check_mode
      tags:
        - management_plane

  roles:
    - role: deploy_user
      tags:
        - management_plane
    - role: human_access
      tags:
        - management_plane
    - role: tailscale
      tags:
        - management_plane

  post_tasks:
    - name: Report mandatory external verification gates
      ansible.builtin.debug:
        msg: >-
          After an approved bootstrap apply, keep the current LAN session open and verify Tailscale status,
          OpenSSH over the Tailscale transport as ansible-deploy, passwordless sudo, a fresh LAN SSH login, Proxmox console access,
          and the complete audit before changing inventory/production.yml.
      tags:
        - management_plane
