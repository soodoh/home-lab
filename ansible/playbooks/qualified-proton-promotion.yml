---
- name: Promote exact qualified Proton Restic repository
  hosts: docker_host
  gather_facts: true
  become: true
  vars:
    qualified_proton_helper_source: "{{ playbook_dir }}/../../scripts/promote-qualified-proton-restic"
    qualified_proton_helper_path: /usr/local/libexec/home-lab/promote-qualified-proton-restic
    qualified_proton_stage: "/var/lib/restic-proton/qualified-proton-promotion/staged/{{ qualified_proton_plan_sha256 }}"
  pre_tasks:
    - name: Validate qualified Proton operation boundary
      ansible.builtin.assert:
        that:
          - qualified_proton_operation in ['install', 'observe', 'apply']
          - qualified_proton_expected_helper_sha256 is match('^[0-9a-f]{64}$')
        fail_msg: Qualified Proton operation or helper identity differs.

    - name: Require live mode for qualified Proton promotion
      ansible.builtin.assert:
        that: [not ansible_check_mode]
        fail_msg: Qualified Proton promotion cannot run in check mode.
      when: qualified_proton_operation == 'apply'

    - name: Inspect retained production lock for qualified Proton resume
      ansible.builtin.stat:
        path: "{{ apply_lock_path }}"
        checksum_algorithm: sha256
        follow: false
      register: qualified_proton_apply_lock
      when: qualified_proton_operation == 'apply'

    - name: Inspect retained production lock owner for qualified Proton resume
      ansible.builtin.stat:
        path: "{{ apply_lock_path }}/owner"
        checksum_algorithm: sha256
        follow: false
      register: qualified_proton_apply_lock_owner
      when:
        - qualified_proton_operation == 'apply'
        - qualified_proton_apply_lock.stat.exists
        - qualified_proton_apply_lock.stat.isdir
        - not qualified_proton_apply_lock.stat.islnk

    - name: Require safe retained production lock metadata
      ansible.builtin.assert:
        that:
          - qualified_proton_apply_lock.stat.isdir
          - not qualified_proton_apply_lock.stat.islnk
          - qualified_proton_apply_lock.stat.pw_name == 'root'
          - qualified_proton_apply_lock.stat.gr_name == 'root'
          - qualified_proton_apply_lock.stat.mode == '0700'
          - qualified_proton_apply_lock_owner.stat.isreg
          - not qualified_proton_apply_lock_owner.stat.islnk
          - qualified_proton_apply_lock_owner.stat.nlink == 1
          - qualified_proton_apply_lock_owner.stat.pw_name == 'root'
          - qualified_proton_apply_lock_owner.stat.gr_name == 'root'
          - qualified_proton_apply_lock_owner.stat.mode == '0600'
          - qualified_proton_apply_lock_owner.stat.checksum is match('^[0-9a-f]{64}$')
        fail_msg: Retained production lock is unsafe and cannot be adopted.
      when:
        - qualified_proton_operation == 'apply'
        - qualified_proton_apply_lock.stat.exists

    - name: Acquire or adopt exact shared production lock for qualified Proton promotion
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: "{{ 'adopt' if qualified_proton_apply_lock.stat.exists else 'acquire' }}"
        apply_lock_operation: "qualified-proton-promotion-{{ qualified_proton_plan_sha256 }}"
        apply_lock_expected_owner_sha256: >-
          {{ qualified_proton_apply_lock_owner.stat.checksum
             if qualified_proton_apply_lock.stat.exists else '' }}
      when: qualified_proton_operation == 'apply'

  tasks:
    - name: Install exact qualified Proton promotion capability
      ansible.builtin.copy:
        src: "{{ qualified_proton_helper_source }}"
        dest: "{{ qualified_proton_helper_path }}"
        owner: root
        group: restic-proton
        mode: "0750"
      when: qualified_proton_operation == 'install'

    - name: Inspect installed qualified Proton promotion capability
      ansible.builtin.stat:
        path: "{{ qualified_proton_helper_path }}"
        checksum_algorithm: sha256
        follow: false
      register: qualified_proton_helper_stat
      when: qualified_proton_operation != 'install' or not ansible_check_mode

    - name: Validate installed qualified Proton promotion capability
      ansible.builtin.assert:
        that:
          - qualified_proton_helper_stat.stat.exists
          - qualified_proton_helper_stat.stat.isreg
          - not qualified_proton_helper_stat.stat.islnk
          - qualified_proton_helper_stat.stat.pw_name == 'root'
          - qualified_proton_helper_stat.stat.gr_name == 'restic-proton'
          - qualified_proton_helper_stat.stat.mode == '0750'
          - qualified_proton_helper_stat.stat.nlink == 1
          - qualified_proton_helper_stat.stat.checksum == qualified_proton_expected_helper_sha256
        fail_msg: Installed qualified Proton promotion capability differs.
      when: qualified_proton_operation != 'install' or not ansible_check_mode

    - name: Observe qualified Proton promotion boundary
      ansible.builtin.command:
        argv: [/usr/sbin/runuser, --user, restic-proton, --, "{{ qualified_proton_helper_path }}", observe]
      register: qualified_proton_observation
      changed_when: false
      when: qualified_proton_operation == 'observe'

    - name: Save bounded qualified Proton observation
      ansible.builtin.copy:
        content: "{{ qualified_proton_observation.stdout }}\n"
        dest: "{{ qualified_proton_controller_output }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: qualified_proton_operation == 'observe'

    - name: Converge beta tools and incident-suspended Restic policy
      ansible.builtin.import_role:
        name: restic_backup
      when: qualified_proton_operation == 'apply'

    - name: Validate qualified Proton transaction inputs
      ansible.builtin.assert:
        that:
          - qualified_proton_plan_sha256 is match('^[0-9a-f]{64}$')
          - qualified_proton_authorization_sha256 is match('^[0-9a-f]{64}$')
          - qualified_proton_confirmation == 'promote-qualified-proton-repository-' ~ qualified_proton_plan_sha256 ~ '-' ~ qualified_proton_authorization_sha256
          - qualified_proton_plan_source | basename == 'qualified-proton-promotion-' ~ qualified_proton_plan_sha256 ~ '.json'
          - qualified_proton_authorization_source | basename == 'authorization-' ~ qualified_proton_authorization_sha256 ~ '.json'
        fail_msg: Qualified Proton transaction binding differs.
      when: qualified_proton_operation == 'apply'

    - name: Create protected qualified Proton roots
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: restic-proton
        group: restic-proton
        mode: "0700"
      loop:
        - /var/lib/restic-proton/qualified-proton-promotion
        - /var/lib/restic-proton/qualified-proton-promotion/staged
        - "{{ qualified_proton_stage }}"
      when: qualified_proton_operation == 'apply'

    - name: Stage exact qualified Proton artifacts
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ qualified_proton_stage }}/{{ item.dest }}"
        owner: restic-proton
        group: restic-proton
        mode: "0600"
      loop:
        - src: "{{ qualified_proton_plan_source }}"
          dest: "qualified-proton-promotion-{{ qualified_proton_plan_sha256 }}.json"
        - src: "{{ qualified_proton_authorization_source }}"
          dest: "authorization-{{ qualified_proton_authorization_sha256 }}.json"
      when: qualified_proton_operation == 'apply'

    - name: Execute explicitly authorized qualified Proton promotion
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - --user
          - restic-proton
          - --
          - "{{ qualified_proton_helper_path }}"
          - apply
          - "{{ qualified_proton_stage }}/qualified-proton-promotion-{{ qualified_proton_plan_sha256 }}.json"
          - "{{ qualified_proton_stage }}/authorization-{{ qualified_proton_authorization_sha256 }}.json"
      environment:
        QUALIFIED_PROTON_PROMOTION_CONFIRMED: "{{ qualified_proton_confirmation }}"
      changed_when: true
      when: qualified_proton_operation == 'apply'

    - name: Verify promoted rclone binary identity
      ansible.builtin.stat:
        path: /usr/local/bin/rclone
        checksum_algorithm: sha256
        follow: false
      register: qualified_proton_rclone
      when: qualified_proton_operation == 'apply'

    - name: Verify incident suspension remains enforced
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, show, --property=ActiveState, --property=UnitFileState, --value, "{{ item }}"]
      loop:
        - home-lab-restic-daily.timer
        - home-lab-restic-maintenance.timer
      register: qualified_proton_timers
      changed_when: false
      when: qualified_proton_operation == 'apply'

    - name: Require exact beta identity and suspended timers after promotion
      ansible.builtin.assert:
        that:
          - qualified_proton_rclone.stat.checksum == backups.restic.tools.rclone.installed_sha256
          - qualified_proton_timers.results | map(attribute='stdout_lines') | list == [['inactive', 'disabled'], ['inactive', 'disabled']]
        fail_msg: Qualified Proton post-deployment safety boundary differs.
      when: qualified_proton_operation == 'apply'

    - name: Read committed qualified Proton receipt
      ansible.builtin.slurp:
        src: "/var/lib/restic-proton/qualified-proton-promotion/{{ qualified_proton_plan_sha256 }}/receipt.json"
      register: qualified_proton_receipt
      no_log: true
      when: qualified_proton_operation == 'apply'

    - name: Persist protected qualified Proton receipt durably
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import base64, os, stat, sys
            from pathlib import Path
            path = Path(sys.argv[1])
            parent = path.parent
            info = parent.lstat()
            if (not stat.S_ISDIR(info.st_mode) or stat.S_ISLNK(info.st_mode)
                    or stat.S_IMODE(info.st_mode) != 0o700 or info.st_uid != os.geteuid()):
                raise SystemExit("controller receipt directory differs")
            raw = base64.b64decode(sys.stdin.buffer.read(), validate=True); temporary = parent / f".{path.name}.{os.getpid()}.tmp"
            descriptor = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
            with os.fdopen(descriptor, "wb") as handle: handle.write(raw); handle.flush(); os.fchmod(handle.fileno(), 0o600); os.fsync(handle.fileno())
            os.replace(temporary, path); directory = os.open(parent, os.O_RDONLY | os.O_DIRECTORY)
            try: os.fsync(directory)
            finally: os.close(directory)
          - "{{ qualified_proton_controller_output }}"
        stdin: "{{ qualified_proton_receipt.content }}"
        stdin_add_newline: false
      delegate_to: localhost
      become: false
      no_log: true
      changed_when: true
      when: qualified_proton_operation == 'apply'

    - name: Remove successful qualified Proton staging
      ansible.builtin.file:
        path: "{{ qualified_proton_stage }}"
        state: absent
      when: qualified_proton_operation == 'apply'

  post_tasks:
    - name: Release shared production lock after qualified Proton promotion
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_operation: "qualified-proton-promotion-{{ qualified_proton_plan_sha256 }}"
        apply_lock_expected_owner_sha256: >-
          {{ qualified_proton_apply_lock_owner.stat.checksum
             if qualified_proton_apply_lock.stat.exists else '' }}
      when: qualified_proton_operation == 'apply'
