---
- name: Install one separately authorized maintenance capability
  hosts: docker_host
  gather_facts: true
  become: false
  serial: 1
  max_fail_percentage: 0
  vars:
    maintenance_capability_source_root: "{{ playbook_dir }}/../../infrastructure/maintenance/host"
  pre_tasks:
    - name: Build source hash binding from reviewed repository bytes
      ansible.builtin.set_fact:
        maintenance_capability_expected_source_hashes: >-
          {{
            (
              {
                'transport': lookup('ansible.builtin.file', maintenance_capability_source_root + '/debian-package-apply-transport',
                                    rstrip=False) | hash('sha256'),
                'executor': lookup('ansible.builtin.file', maintenance_capability_source_root + '/debian-package-transaction',
                                   rstrip=False) | hash('sha256'),
                'observer': lookup('ansible.builtin.file', maintenance_capability_source_root + '/package-candidate-observer',
                                   rstrip=False) | hash('sha256')
              }
            ) if maintenance_capability_kind == 'package-identity' else
            (
              {
                'observer': lookup('ansible.builtin.file', maintenance_capability_source_root + '/unattended-retirement-observer',
                                   rstrip=False) | hash('sha256'),
                'executor': lookup('ansible.builtin.file', maintenance_capability_source_root + '/unattended-retirement-transaction',
                                   rstrip=False) | hash('sha256')
              }
              if maintenance_capability_kind == 'unattended-retirement' else
              {
                'executor': lookup('ansible.builtin.file', maintenance_capability_source_root + '/debian-reboot-transaction',
                                   rstrip=False) | hash('sha256')
              }
            )
          }}
  roles:
    - role: lifecycle_state
    - role: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: "maintenance-capability-{{ maintenance_capability_kind }}-{{ maintenance_capability_plan_sha256 }}"
    - role: maintenance_capability
  post_tasks:
    - name: Release the exact maintenance capability host lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_operation: "maintenance-capability-{{ maintenance_capability_kind }}-{{ maintenance_capability_plan_sha256 }}"
      when: not ansible_check_mode
