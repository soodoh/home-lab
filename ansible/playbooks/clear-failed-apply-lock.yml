---
- name: Clear one separately inspected failed production apply lock
  hosts: docker_host
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  tasks:
    - name: Require exact failed-lock clearance inputs
      ansible.builtin.assert:
        that:
          - ansible_check_mode or (iac_lock_clear_confirmed | default(false) | ansible.builtin.bool)
          - iac_failed_lock_expected_operation | default('') is match('^[a-z0-9_-]+$')
          - iac_failed_lock_expected_operation not in ['proton-qualification', 'restic-repository-initialization']
        fail_msg: >-
          Failed production lock clearance requires confirmation and the exact inspected non-transactional operation.

    - name: Inspect the failed production apply lock
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      become: true
      register: iac_failed_lock_paths
      loop:
        - "{{ apply_lock_path }}"
        - "{{ apply_lock_path }}/owner"

    - name: Inspect failed production lock contents
      ansible.builtin.find:
        paths: "{{ apply_lock_path }}"
        hidden: true
        recurse: false
        file_type: any
      become: true
      register: iac_failed_lock_entries
      when: iac_failed_lock_paths.results[0].stat.isdir | default(false)

    - name: Read the exact failed-lock owner record
      ansible.builtin.slurp:
        src: "{{ apply_lock_path }}/owner"
      become: true
      register: iac_failed_lock_owner
      no_log: true
      when: iac_failed_lock_paths.results[1].stat.isreg | default(false)

    - name: Require the exact inspected failed lock and owner
      ansible.builtin.assert:
        that:
          - iac_failed_lock_paths.results[0].stat.isdir | default(false)
          - iac_failed_lock_paths.results[0].stat.pw_name == 'root'
          - iac_failed_lock_paths.results[0].stat.mode == '0700'
          - iac_failed_lock_paths.results[1].stat.isreg | default(false)
          - iac_failed_lock_paths.results[1].stat.pw_name == 'root'
          - iac_failed_lock_paths.results[1].stat.mode == '0600'
          - iac_failed_lock_entries.matched == 1
          - "'controller=ansible-deploy' in (iac_failed_lock_owner.content | b64decode).splitlines()"
          - >-
            'operation=' ~ iac_failed_lock_expected_operation in
            (iac_failed_lock_owner.content | b64decode).splitlines()
          - >-
            (iac_failed_lock_owner.content | b64decode).splitlines()
            | select('match', '^started=[0-9]{4}-[0-9]{2}-[0-9]{2}T')
            | list
            | length == 1
        fail_msg: "Production lock identity or contents differ from the reviewed failed operation."
      no_log: true

    - name: Report the exact failed-lock clearance plan
      ansible.builtin.debug:
        msg:
          lock_path: "{{ apply_lock_path }}"
          controller: ansible-deploy
          operation: "{{ iac_failed_lock_expected_operation }}"
          entry_count: 1
      changed_when: true
      when: ansible_check_mode

    - name: Atomically detach and clear only the inspected failed lock
      ansible.builtin.command:
        argv:
          - /usr/bin/flock
          - --exclusive
          - --nonblock
          - --
          - "{{ backups.restic.runner.lock_path }}"
          - /usr/bin/bash
          - -c
          - >-
            set -euo pipefail;
            lock=$1;
            expected_operation=$2;
            owner="$lock/owner";
            test "$(/usr/bin/stat --format='%U:%G:%a:%F' -- "$lock")" = 'root:root:700:directory';
            test "$(/usr/bin/stat --format='%U:%G:%a:%h:%F' -- "$owner")" = 'root:root:600:1:regular file';
            test "$(/usr/bin/find "$lock" -mindepth 1 -maxdepth 1 -printf x | /usr/bin/wc -c)" -eq 1;
            /usr/bin/grep --fixed-strings --line-regexp -- 'controller=ansible-deploy' "$owner" >/dev/null;
            /usr/bin/grep --fixed-strings --line-regexp -- "operation=$expected_operation" "$owner" >/dev/null;
            test "$(/usr/bin/grep --extended-regexp --count '^started=[0-9]{4}-[0-9]{2}-[0-9]{2}T' "$owner")" -eq 1;
            tombstone="${lock}.cleared.$$";
            test ! -e "$tombstone";
            /usr/bin/mv --no-target-directory -- "$lock" "$tombstone";
            /usr/bin/rm -- "$tombstone/owner";
            /usr/bin/rmdir -- "$tombstone"
          - clear-failed-apply-lock
          - "{{ apply_lock_path }}"
          - "{{ iac_failed_lock_expected_operation }}"
      become: true
      changed_when: true
      when: not ansible_check_mode
