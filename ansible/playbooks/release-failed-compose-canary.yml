---
# Prepared recovery for the exact pre-publication refusal recorded on September 18, 2026.
# This play is not authorized merely because it exists; operations.md owns that decision.
- name: Release only the exact retained pre-publication Compose canary owner
  hosts: docker-host
  gather_facts: false
  any_errors_fatal: true
  vars:
    compose_native_failed_candidate_dir: >-
      {{ compose_native_staging_root }}/{{ compose_native_failed_candidate_hash }}
    compose_native_failed_candidate_env: >-
      {{ compose_native_staged_env_root }}/{{ compose_native_failed_candidate_hash }}.env
    compose_native_failed_checkpoint: >-
      /var/lib/docker-compose/deploy-{{ compose_native_failed_candidate_hash }}-previous-images.json
  pre_tasks:
    - name: Bind release to the exact audited failed attempt
      ansible.builtin.assert:
        that:
          - >-
            compose_native_failed_owner_sha256 ==
            '5af8bb373ce87c55ad50b3237805c9b8413f5f2bf8df5bd11671d6fc66329706'
          - >-
            compose_native_failed_candidate_hash ==
            'fbd84ff2fd70b0a7cd6a560930db0a66f8f88b56cd5472a9fe167bc404fe04b5'
          - >-
            compose_native_failed_active_hash ==
            '2f12e384fdc0ce759d23b0bd9e16ad402d3ecd2985b4ecdfe048127f1c5748be'
          - ansible_check_mode or (compose_native_failed_release_confirmed | default(false) | bool)
        fail_msg: >-
          Release inputs must identify the exact audited pre-publication failure, and normal mode
          requires compose_native_failed_release_confirmed=true.

    - name: Inspect exact retained failure paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
      become: true
      register: compose_native_failed_paths
      loop:
        - "{{ compose_native_apply_lock_path }}"
        - "{{ compose_native_apply_lock_path }}/owner"
        - "{{ compose_native_current_dir }}"
        - "{{ compose_native_failed_candidate_dir }}"
        - "{{ compose_native_failed_candidate_env }}"
        - "{{ compose_native_failed_checkpoint }}"
        - "{{ compose_native_retained_image_root }}"
        - "{{ compose_native_backup_lock_path }}"
        - "{{ compose_native_artifact_identity_path }}"

    - name: Require the unchanged pre-publication failure boundary
      ansible.builtin.assert:
        that:
          - compose_native_failed_paths.results[0].stat.isdir | default(false)
          - compose_native_failed_paths.results[0].stat.pw_name == 'root'
          - compose_native_failed_paths.results[0].stat.gr_name == 'root'
          - compose_native_failed_paths.results[0].stat.mode == '0700'
          - compose_native_failed_paths.results[1].stat.isreg | default(false)
          - compose_native_failed_paths.results[1].stat.nlink == 1
          - compose_native_failed_paths.results[1].stat.pw_name == 'root'
          - compose_native_failed_paths.results[1].stat.gr_name == 'root'
          - compose_native_failed_paths.results[1].stat.mode == '0600'
          - compose_native_failed_paths.results[1].stat.checksum == compose_native_failed_owner_sha256
          - compose_native_failed_paths.results[2].stat.isdir | default(false)
          - compose_native_failed_paths.results[3].stat.isdir | default(false)
          - compose_native_failed_paths.results[3].stat.pw_name == 'root'
          - not (compose_native_failed_paths.results[4].stat.exists | default(false))
          - not (compose_native_failed_paths.results[5].stat.exists | default(false))
          - compose_native_failed_paths.results[6].stat.isdir | default(false)
          - compose_native_failed_paths.results[6].stat.pw_name == 'root'
          - compose_native_failed_paths.results[6].stat.gr_name == 'root'
          - compose_native_failed_paths.results[6].stat.mode == '0700'
          - compose_native_failed_paths.results[7].stat.isreg | default(false)
          - not (compose_native_failed_paths.results[7].stat.islnk | default(false))
          - compose_native_failed_paths.results[7].stat.nlink == 1
          - compose_native_failed_paths.results[7].stat.uid == 0
          - compose_native_failed_paths.results[7].stat.gid == restic_proton_gid | int
          - compose_native_failed_paths.results[7].stat.mode == '0660'
          - compose_native_failed_paths.results[8].stat.isreg | default(false)
          - not (compose_native_failed_paths.results[8].stat.islnk | default(false))
          - compose_native_failed_paths.results[8].stat.nlink == 1
          - compose_native_failed_paths.results[8].stat.uid == 0
          - compose_native_failed_paths.results[8].stat.gid == 0
          - compose_native_failed_paths.results[8].stat.mode == '0444'
        fail_msg: Retained host state no longer matches the audited pre-publication refusal.

    - name: Read the unchanged active artifact marker
      ansible.builtin.slurp:
        src: "{{ compose_native_artifact_identity_path }}"
      become: true
      register: compose_native_failed_active_marker

    - name: Require the exact unchanged active artifact marker
      ansible.builtin.assert:
        that:
          - compose_native_failed_active_marker.content | b64decode | trim == compose_native_failed_active_hash
        fail_msg: The active artifact marker changed after the audited refusal.

    - name: Require the exact retained owner operation
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - --fixed-strings
          - --line-regexp
          - operation=compose-native-canary
          - "{{ compose_native_apply_lock_path }}/owner"
      become: true
      changed_when: false
      check_mode: false

    - name: Recompute unchanged active and failed candidate identities
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ item }}/scripts/compose-artifact.py"
          - --root
          - "{{ item }}"
          - --no-git
          - hash
      become: true
      register: compose_native_failed_artifacts
      changed_when: false
      check_mode: false
      loop:
        - "{{ compose_native_current_dir }}"
        - "{{ compose_native_failed_candidate_dir }}"

    - name: Require exact active and failed candidate artifact identities
      ansible.builtin.assert:
        that:
          - compose_native_failed_artifacts.results[0].stdout == compose_native_failed_active_hash
          - compose_native_failed_artifacts.results[1].stdout == compose_native_failed_candidate_hash
        fail_msg: Active or failed candidate artifact bytes changed after the audited refusal.

    - name: Inspect retained image records and unpublished incoming directories
      ansible.builtin.command:
        argv: "{{ item }}"
      become: true
      register: compose_native_failed_residuals
      changed_when: false
      check_mode: false
      loop:
        - >-
          {{ ['/usr/bin/find', compose_native_retained_image_root, '-mindepth', '1',
              '-maxdepth', '1', '-printf', 'x'] }}
        - >-
          {{ ['/usr/bin/find', compose_native_staging_root, '-mindepth', '1',
              '-maxdepth', '1', '-name', '.incoming-*', '-printf', 'x'] }}
        - >-
          {{ ['/usr/bin/find', compose_native_deployment_root, '-mindepth', '1',
              '-maxdepth', '1', '-name', '.native-current-*', '-printf', 'x'] }}
        - >-
          {{ ['/usr/bin/find', compose_native_apply_lock_path, '-mindepth', '1',
              '-maxdepth', '1', '!', '-name', 'owner', '-printf', 'x'] }}

    - name: Require no image archive unpublished incoming artifact or extra owner file
      ansible.builtin.assert:
        that:
          - compose_native_failed_residuals.results[0].stdout | length == 0
          - compose_native_failed_residuals.results[1].stdout | length == 0
          - compose_native_failed_residuals.results[2].stdout | length == 0
          - compose_native_failed_residuals.results[3].stdout | length == 0
        fail_msg: Unexpected post-failure state exists; do not release ownership.

    - name: Adopt only the exact retained Compose canary owner
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: adopt
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_backup_guard_path: "{{ compose_native_backup_lock_path }}"
        apply_lock_operation: compose-native-canary
        apply_lock_expected_owner_sha256: "{{ compose_native_failed_owner_sha256 }}"

  tasks:
    - name: Release only the exact adopted Compose canary owner
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
        apply_lock_path: "{{ compose_native_apply_lock_path }}"
        apply_lock_backup_guard_path: "{{ compose_native_backup_lock_path }}"
        apply_lock_operation: compose-native-canary
        apply_lock_expected_owner_sha256: "{{ compose_native_failed_owner_sha256 }}"

  post_tasks:
    - name: Report the bounded ownership release in check mode
      ansible.builtin.debug:
        msg:
          owner_sha256: "{{ compose_native_failed_owner_sha256 }}"
          preserved_candidate_hash: "{{ compose_native_failed_candidate_hash }}"
          active_hash: "{{ compose_native_failed_active_hash }}"
          candidate_environment_exists: false
          interruption_checkpoint_exists: false
          note: Check mode validated the retained boundary but did not release ownership.
      changed_when: true
      when: ansible_check_mode

    - name: Verify ownership release while preserving failed candidate evidence
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      become: true
      register: compose_native_release_post_paths
      when: not ansible_check_mode
      loop:
        - "{{ compose_native_apply_lock_path }}"
        - "{{ compose_native_failed_candidate_dir }}"

    - name: Require only ownership to be released
      ansible.builtin.assert:
        that:
          - not (compose_native_release_post_paths.results[0].stat.exists | default(false))
          - compose_native_release_post_paths.results[1].stat.isdir | default(false)
        fail_msg: Exact ownership release or candidate preservation failed.
      when: not ansible_check_mode

    - name: Report bounded failed-attempt closure
      ansible.builtin.debug:
        msg:
          released_owner_sha256: "{{ compose_native_failed_owner_sha256 }}"
          preserved_candidate_hash: "{{ compose_native_failed_candidate_hash }}"
          active_hash: "{{ compose_native_failed_active_hash }}"
          candidate_environment_exists: false
          interruption_checkpoint_exists: false
          candidate_removed: false
          container_mutation_performed: false
      changed_when: true
      when: not ansible_check_mode
